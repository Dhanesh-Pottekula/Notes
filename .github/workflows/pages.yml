# Publishes the Notes website to GitHub Pages on every push to main.
# The site is packed by tools/build_site.py (pages to read only; private and working files stay out).
# One-time set-up on GitHub: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy Notes site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Pack the site
        run: python3 tools/build_site.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
