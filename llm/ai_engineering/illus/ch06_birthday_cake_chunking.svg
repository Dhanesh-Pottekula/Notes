<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One birthday cake cut three ways: tiny chunks, large chunks, overlapping chunks</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="girl">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#c98a5e"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#c98a5e"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l12 70 h-72 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <path d="M-22 -150 q0 34 -8 44 h16 z M22 -150 q0 34 8 44 h-16 z" fill="#2e2a2a"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 q-20 -8 -42 0 z" fill="#2e2a2a"/>
    </g>
    <g id="cake">
      <rect x="4" y="8" width="240" height="160" rx="14" fill="#000" opacity=".08"/>
      <rect x="0" y="0" width="240" height="160" rx="14" fill="#f2a7b4"/>
      <rect x="10" y="10" width="220" height="140" rx="10" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="2 9" stroke-linecap="round"/>
    </g>
    <g id="balloon"><path d="M0 34 q-6 30 4 60" stroke="#b9ad98" stroke-width="2" fill="none"/><ellipse cx="0" cy="0" rx="22" ry="28" fill="currentColor"/><path d="M-4 28 h8 l-4 7 z" fill="currentColor"/></g>
    <g id="plate"><ellipse cx="0" cy="0" rx="38" ry="10" fill="#fff" stroke="#d8cdb8" stroke-width="2"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="320" y1="24" x2="320" y2="616" stroke="#d8cdb8" stroke-width="3"/>
  <line x1="640" y1="24" x2="640" y2="616" stroke="#d8cdb8" stroke-width="3"/>
  <!-- confetti -->
  <g opacity=".8"><rect x="30" y="100" width="8" height="4" fill="#e0a33a" transform="rotate(30 34 102)"/><rect x="292" y="120" width="8" height="4" fill="#1f6f78"/><rect x="350" y="96" width="8" height="4" fill="#e07a5f" transform="rotate(-30 354 98)"/><rect x="610" y="104" width="8" height="4" fill="#7a4e7e"/><rect x="664" y="98" width="8" height="4" fill="#e0a33a"/><rect x="930" y="122" width="8" height="4" fill="#e07a5f" transform="rotate(40 934 124)"/><circle cx="470" cy="100" r="3" fill="#1f6f78"/><circle cx="160" cy="104" r="3" fill="#7a4e7e"/><circle cx="800" cy="102" r="3" fill="#1f6f78"/></g>

  <!-- PANEL 1: tiny chunks split the words -->
  <text x="160" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">SMALL CHUNKS</text>
  <use href="#cake" transform="translate(40 130)"/>
  <text x="160" y="217" text-anchor="middle" font-size="19" font-weight="700" font-style="italic" fill="#7a4e7e">Happy Birthday Riya</text>
  <g stroke="#fff" stroke-width="3">
    <line x1="80" y1="130" x2="80" y2="290"/><line x1="120" y1="130" x2="120" y2="290"/><line x1="160" y1="130" x2="160" y2="290"/><line x1="200" y1="130" x2="200" y2="290"/><line x1="240" y1="130" x2="240" y2="290"/>
    <line x1="40" y1="170" x2="280" y2="170"/><line x1="40" y1="210" x2="280" y2="210"/><line x1="40" y1="250" x2="280" y2="250"/>
  </g>
  <!-- hands reaching in from all sides -->
  <g stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none">
    <path d="M14 150 l40 6"/><path d="M306 258 l-40 -2"/><path d="M60 330 l10 -38"/><path d="M250 326 l-6 -34"/><path d="M160 100 l0 40" stroke="#b07850"/>
  </g>
  <g fill="#d9a27a"><circle cx="58" cy="157" r="8"/><circle cx="262" cy="256" r="8"/><circle cx="71" cy="288" r="8"/><circle cx="243" cy="288" r="8"/><circle cx="160" cy="142" r="8"/></g>
  <!-- the two pieces that broke the name -->
  <rect x="34" y="380" width="120" height="70" rx="8" fill="#f2a7b4"/>
  <rect x="172" y="380" width="120" height="70" rx="8" fill="#f2a7b4"/>
  <text x="94" y="422" text-anchor="middle" font-size="19" font-weight="700" font-style="italic" fill="#7a4e7e">Happy Bir</text>
  <text x="232" y="422" text-anchor="middle" font-size="19" font-weight="700" font-style="italic" fill="#7a4e7e">thday Riya</text>
  <path d="M110 300 q-20 40 -16 70" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="7 6" marker-end="url(#a1)"/>
  <path d="M210 300 q20 40 16 70" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="7 6" marker-end="url(#a1)"/>
  <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  <circle cx="163" cy="415" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <path d="M156 408 l14 14 M170 408 l-14 14" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  <!-- many little plates -->
  <g><use href="#plate" transform="translate(70 520) scale(.7)"/><use href="#plate" transform="translate(160 540) scale(.7)"/><use href="#plate" transform="translate(250 520) scale(.7)"/><use href="#plate" transform="translate(110 590) scale(.7)"/><use href="#plate" transform="translate(210 590) scale(.7)"/></g>
  <g fill="#f2a7b4"><rect x="62" y="508" width="16" height="12" rx="2"/><rect x="152" y="528" width="16" height="12" rx="2"/><rect x="242" y="508" width="16" height="12" rx="2"/><rect x="102" y="578" width="16" height="12" rx="2"/><rect x="202" y="578" width="16" height="12" rx="2"/></g>

  <!-- PANEL 2: three huge slabs, few guests -->
  <text x="480" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">LARGE CHUNKS</text>
  <use href="#cake" transform="translate(360 120)"/>
  <text x="480" y="168" text-anchor="middle" font-size="19" font-weight="700" font-style="italic" fill="#7a4e7e">Happy Birthday Riya</text>
  <g stroke="#fff" stroke-width="5"><line x1="360" y1="200" x2="600" y2="200"/><line x1="480" y1="200" x2="480" y2="280"/></g>
  <use href="#balloon" transform="translate(624 150) scale(.7)" color="#7a4e7e"/>
  <!-- disappointed kids in the background with empty plates -->
  <g>
    <use href="#man" transform="translate(410 450) scale(.55)" color="#cbbfa9"/>
    <use href="#man" transform="translate(550 450) scale(.55)" color="#b9ad98"/>
  </g>
  <g stroke="#c98a5e" stroke-width="6" stroke-linecap="round" fill="none"><path d="M397 390 q-6 12 4 16 M423 390 q6 12 -4 16"/><path d="M537 390 q-6 12 4 16 M563 390 q6 12 -4 16"/></g>
  <ellipse cx="410" cy="406" rx="20" ry="5" fill="#fff" stroke="#d8cdb8" stroke-width="2"/><ellipse cx="550" cy="406" rx="20" ry="5" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M404 377 q6 -4 12 0 M544 377 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  <circle cx="480" cy="372" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="480" y="380" text-anchor="middle" font-size="22" font-weight="800" fill="#e07a5f">!</text>
  <!-- three lucky guests with big plates -->
  <g>
    <use href="#man" transform="translate(380 600) scale(.8)" color="#1f6f78"/>
    <use href="#man" transform="translate(468 600) scale(.8)" color="#e0a33a"/>
    <use href="#man" transform="translate(556 600) scale(.8)" color="#e07a5f"/>
  </g>
  <g stroke="#c98a5e" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M361 512 q-8 16 6 22 M399 512 q8 16 -6 22"/>
    <path d="M449 512 q-8 16 6 22 M487 512 q8 16 -6 22"/>
    <path d="M537 512 q-8 16 6 22 M575 512 q8 16 -6 22"/>
  </g>
  <g fill="#f2a7b4"><rect x="356" y="508" width="48" height="24" rx="4"/><rect x="444" y="508" width="48" height="24" rx="4"/><rect x="532" y="508" width="48" height="24" rx="4"/></g>
  <use href="#plate" transform="translate(380 534) scale(.85)"/>
  <use href="#plate" transform="translate(468 534) scale(.85)"/>
  <use href="#plate" transform="translate(556 534) scale(.85)"/>
  <g fill="#f2a7b4"><rect x="356" y="512" width="48" height="22" rx="4"/><rect x="444" y="512" width="48" height="22" rx="4"/><rect x="532" y="512" width="48" height="22" rx="4"/></g>

  <!-- PANEL 3: medium slices that overlap -->
  <text x="800" y="64" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">OVERLAP</text>
  <use href="#cake" transform="translate(680 120)"/>
  <!-- overlapping bands -->
  <g fill="#fff" opacity=".55"><rect x="680" y="150" width="240" height="22"/><rect x="680" y="196" width="240" height="22"/><rect x="680" y="242" width="240" height="22"/></g>
  <g stroke="#fff" stroke-width="2" stroke-dasharray="6 5"><line x1="680" y1="150" x2="920" y2="150"/><line x1="680" y1="172" x2="920" y2="172"/><line x1="680" y1="196" x2="920" y2="196"/><line x1="680" y1="218" x2="920" y2="218"/><line x1="680" y1="242" x2="920" y2="242"/><line x1="680" y1="264" x2="920" y2="264"/></g>
  <text x="800" y="190" text-anchor="middle" font-size="19" font-weight="700" font-style="italic" fill="#7a4e7e">Happy Birthday Riya</text>
  <use href="#balloon" transform="translate(676 430) scale(.7)" color="#e0a33a"/>
  <use href="#balloon" transform="translate(930 470) scale(.6)" color="#1f6f78"/>
  <!-- proud girl holding the intact slice -->
  <use href="#girl" transform="translate(800 610) scale(1.05)" color="#7a4e7e"/>
  <path d="M784 434 l16 -36 l16 36 z" fill="#e0a33a"/><circle cx="800" cy="396" r="5" fill="#e07a5f"/>
  <g stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"><path d="M776 494 l-30 -112"/><path d="M824 494 l30 -112"/></g>
  <rect x="706" y="300" width="188" height="68" rx="10" fill="#f2a7b4"/>
  <rect x="706" y="300" width="188" height="14" rx="6" fill="#fff" opacity=".55"/>
  <rect x="706" y="354" width="188" height="14" rx="6" fill="#fff" opacity=".55"/>
  <text x="800" y="341" text-anchor="middle" font-size="18" font-weight="700" font-style="italic" fill="#7a4e7e">Happy Birthday Riya</text>
    <path d="M791 461 q9 9 18 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="914" cy="334" r="18" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <path d="M905 334 l7 7 l12 -14" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
