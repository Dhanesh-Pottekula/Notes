<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A detective's thought, action, observation loop around an evidence board</title>
  <defs>
    <g id="det">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#8a5a3c"/>
      <path d="M-8 -128 l8 30 l8 -30 z" fill="#f6f1e7"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
      <g fill="#3d3a3a"><ellipse cx="-8" cy="-166" rx="7" ry="5"/><ellipse cx="8" cy="-166" rx="7" ry="5"/></g>
      <path d="M-10 -140 q10 -6 20 0 q-10 4 -20 0 z" fill="#2e2a2a" stroke="#2e2a2a" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <g id="dhobi">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-15" y="-60" width="12" height="60" rx="6" fill="#b07850"/>
      <rect x="3" y="-60" width="12" height="60" rx="6" fill="#b07850"/>
      <path d="M-22 -64 h44 l2 50 h-48 z" fill="#1f6f78"/>
      <path d="M-22 -50 h44 M-22 -34 h46 M-8 -64 v50 M8 -64 v50" stroke="#2a8f9a" stroke-width="3"/>
      <path d="M-24 -64 v-40 a24 24 0 0 1 48 0 v40 z" fill="#fff"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="20" fill="#b07850"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <ellipse cx="470" cy="330" rx="330" ry="250" fill="#ece3d1"/>

  <!-- clockwise loop arrows -->
  <g stroke="#e07a5f" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#ar)">
    <path d="M592 96 Q690 100 700 176"/>
    <path d="M740 492 Q730 570 616 582"/>
    <path d="M392 612 Q228 624 222 480"/>
    <path d="M238 318 Q232 170 352 140"/>
  </g>

  <!-- centre: evidence board -->
  <rect x="352" y="242" width="236" height="168" rx="8" fill="#8a6d5a"/>
  <rect x="362" y="252" width="216" height="148" rx="4" fill="#d9b382"/>
  <g fill="#fff"><rect x="380" y="266" width="48" height="52"/><rect x="512" y="266" width="48" height="52"/><rect x="380" y="334" width="48" height="52"/><rect x="512" y="334" width="48" height="52"/></g>
  <g fill="#b9ad98"><circle cx="404" cy="286" r="10"/><circle cx="536" cy="286" r="10"/><circle cx="404" cy="354" r="10"/><circle cx="536" cy="354" r="10"/><path d="M388 318 a16 12 0 0 1 32 0 z M520 318 a16 12 0 0 1 32 0 z M388 386 a16 12 0 0 1 32 0 z M520 386 a16 12 0 0 1 32 0 z"/></g>
  <path d="M384 338 l40 44 M424 338 l-40 44" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <g stroke="#c0392b" stroke-width="3" fill="none"><path d="M428 292 L512 292"/><path d="M428 292 L512 360"/><path d="M372 360 L380 360"/></g>
  <g fill="#c0392b"><circle cx="428" cy="292" r="4"/><circle cx="512" cy="292" r="4"/><circle cx="512" cy="360" r="4"/></g>
  <circle cx="470" cy="326" r="18" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="470" y="335" text-anchor="middle" font-size="24" font-weight="800" fill="#7a4e7e">?</text>

  <!-- TOP: thinking aloud -->
  <text x="300" y="92" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">THOUGHT</text>
  <use href="#det" transform="translate(440 210) scale(.62)"/>
  <path d="M424 145 q2 18 22 16" stroke="#c98a5e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M456 145 q10 -4 -6 -24" stroke="#c98a5e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="474" cy="104" r="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <circle cx="488" cy="88" r="7" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="496" y="24" width="96" height="70" rx="26" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <path d="M526 40 l-14 10 l6 10 l6 -4 v28 h40 v-28 l6 4 l6 -10 l-14 -10 q-18 8 -36 0 z" fill="#e8f0ef" stroke="#1f6f78" stroke-width="2"/>
  <ellipse cx="552" cy="70" rx="9" ry="6" fill="#a8743e" opacity=".8"/>

  <!-- RIGHT: going to the dhobi ghat -->
  <g stroke="#b9ad98" stroke-width="2"><line x1="630" y1="200" x2="830" y2="196"/><line x1="630" y1="232" x2="830" y2="228"/></g>
  <g fill="#fff" stroke="#e5ddcc" stroke-width="1"><rect x="640" y="200" width="44" height="34"/><rect x="694" y="199" width="44" height="40"/><rect x="748" y="198" width="44" height="30"/><rect x="666" y="232" width="40" height="30"/><rect x="760" y="230" width="44" height="34"/></g>
  <path d="M630 430 q100 -10 240 0" stroke="#7fb0b8" stroke-width="6" fill="none" opacity=".6"/>
  <use href="#det" transform="translate(690 420) scale(.62)"/>
  <path d="M706 352 l28 -8" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>
  <use href="#dhobi" transform="translate(800 420) scale(.62)"/>
  <path d="M784 352 l-10 24 M816 352 l10 24" stroke="#b07850" stroke-width="7" stroke-linecap="round"/>
  <circle cx="744" cy="300" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="744" y="308" text-anchor="middle" font-size="22" font-weight="800" fill="#e07a5f">?</text>
  <text x="745" y="474" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ACTION</text>

  <!-- BOTTOM: the dhobi explains, the detective's notebook fills -->
  <use href="#dhobi" transform="translate(470 600) scale(.62)"/>
  <path d="M455 532 q-18 10 -22 24" stroke="#b07850" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M485 532 q16 -6 22 -26" stroke="#b07850" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M424 552 l-12 8 l5 8 l5 -3 v26 h30 v-26 l5 3 l5 -8 l-12 -8 q-13 6 -26 0 z" fill="#e8f0ef"/>
  <ellipse cx="438" cy="578" rx="6" ry="4" fill="#a8743e" opacity=".8"/>
  <g fill="#7fb0b8"><circle cx="420" cy="598" r="2"/><circle cx="428" cy="604" r="2"/></g>
  <path d="M520 462 h92 a12 12 0 0 1 12 12 v30 a12 12 0 0 1 -12 12 h-74 l-14 14 v-14 h-4 a12 12 0 0 1 -12 -12 v-30 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <path d="M530 480 q8 -8 16 0 t16 0 t16 0 t16 0 M530 498 q8 -8 16 0 t16 0 t16 0" stroke="#1f6f78" stroke-width="3" fill="none"/>
  <rect x="330" y="520" width="44" height="56" rx="4" fill="#fff" stroke="#8a5a3c" stroke-width="3"/>
  <path d="M338 536 h28 M338 548 h22 M338 560 h26" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <path d="M378 514 l-26 44" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  <text x="790" y="608" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">OBSERVATION</text>

  <!-- LEFT: back at the board, moving the red string -->
  <use href="#det" transform="translate(270 440) scale(.62)"/>
  <path d="M286 372 Q330 360 368 360" stroke="#c98a5e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M254 372 q-8 20 2 34" stroke="#c98a5e" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M368 360 Q450 330 512 292" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="5 4"/>

  <!-- break out of the loop: name the culprit -->
  <path d="M846 410 Q900 380 900 300" stroke="#7a4e7e" stroke-width="6" fill="none" stroke-linecap="round" marker-end="url(#ap)"/>
  <g fill="#3d3a3a"><rect x="878" y="236" width="12" height="44" rx="5"/><rect x="896" y="236" width="12" height="44" rx="5"/><path d="M872 240 v-34 a21 21 0 0 1 42 0 v34 z"/><circle cx="893" cy="168" r="17"/></g>
  <circle cx="893" cy="122" r="17" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="893" y="130" text-anchor="middle" font-size="22" font-weight="800" fill="#7a4e7e">!</text>
</svg>
