<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A shopkeeper agent choosing between a calculator, a bill printer and a translator phone</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 v24 h-8 v-20 q-13 -8 -26 0 v20 h-8 z" fill="#a8743e"/>
    </g>
    <g id="pot"><path d="M-22 0 h44 l-4 -30 h-36 z" fill="#cbbfa9"/><rect x="-24" y="-34" width="48" height="6" rx="3" fill="#b9ad98"/><path d="M-12 -24 v18" stroke="#fff" stroke-width="4" opacity=".7" stroke-linecap="round"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- shelves of steel utensils and plastic goods -->
  <rect x="30" y="80" width="560" height="320" fill="#efe6d2"/>
  <g fill="#8a6d5a"><rect x="30" y="180" width="560" height="10"/><rect x="30" y="290" width="560" height="10"/><rect x="30" y="390" width="560" height="10"/></g>
  <use href="#pot" transform="translate(70 180)"/><use href="#pot" transform="translate(130 180) scale(.8)"/>
  <use href="#pot" transform="translate(480 180)"/><use href="#pot" transform="translate(540 180) scale(.8)"/>
  <use href="#pot" transform="translate(400 290) scale(.9)"/><use href="#pot" transform="translate(470 290)"/><use href="#pot" transform="translate(540 290) scale(.8)"/>
  <g><path d="M60 290 l6 -42 h40 l6 42 z" fill="#1f6f78" opacity=".7"/><path d="M120 290 l6 -42 h40 l6 42 z" fill="#e07a5f" opacity=".7"/><path d="M60 390 l6 -42 h40 l6 42 z" fill="#e0a33a" opacity=".7"/><rect x="440" y="350" width="40" height="40" rx="4" fill="#7a4e7e" opacity=".6"/><rect x="490" y="356" width="40" height="34" rx="4" fill="#1f6f78" opacity=".6"/></g>
  <!-- market lane to the right -->
  <rect x="610" y="120" width="320" height="10" fill="#e07a5f" opacity=".7"/>
  <path d="M610 130 h320 l-20 30 h-280 z" fill="#e0a33a" opacity=".5"/>

  <!-- thought bubble: mental maths goes wrong -->
  <circle cx="226" cy="352" r="7" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <circle cx="240" cy="326" r="10" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="170" y="206" width="170" height="104" rx="40" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <text x="255" y="250" text-anchor="middle" font-size="24" font-weight="700" fill="#7a4e7e">37×48</text>
  <path d="M200 280 q20 -26 40 0 t40 0 q-10 -18 26 -6" stroke="#b9ad98" stroke-width="3" fill="none"/>
  <path d="M226 224 l58 66 M284 224 l-58 66" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>

  <!-- shopkeeper behind the counter -->
  <use href="#man" transform="translate(210 650) scale(1.5)" color="#1f6f78"/>
  <g stroke="#fff" stroke-width="4" opacity=".45"><line x1="186" y1="470" x2="186" y2="520"/><line x1="202" y1="460" x2="202" y2="520"/><line x1="218" y1="460" x2="218" y2="520"/><line x1="234" y1="470" x2="234" y2="520"/></g>
  <rect x="222" y="478" width="12" height="16" rx="2" fill="#fff" opacity=".9"/><rect x="226" y="470" width="4" height="14" fill="#e07a5f"/>
  <path d="M210 404 v-10" stroke="#f6f1e7" stroke-width="2"/>
  <path d="M196 418 a3 3 0 0 0 6 0 M218 418 a3 3 0 0 0 6 0" fill="#2e2a2a"/>
  <path d="M202 438 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M248 490 q40 10 74 8" stroke="#c98a5e" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M172 490 q-24 10 -28 24" stroke="#c98a5e" stroke-width="16" stroke-linecap="round" fill="none"/>
  <!-- which tool? -->
  <circle cx="356" cy="410" r="20" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="356" y="419" text-anchor="middle" font-size="26" font-weight="800" fill="#e07a5f">?</text>
  <path d="M378 404 q60 -24 110 6" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#ar)"/>
  <path d="M380 396 q120 -60 230 0" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#ar)"/>

  <!-- counter -->
  <rect x="40" y="500" width="660" height="140" fill="#8a6d5a"/>
  <rect x="40" y="500" width="660" height="12" fill="#cfe0dc"/>
  <rect x="60" y="530" width="300" height="80" rx="8" fill="#d8cdb8"/>
  <rect x="380" y="530" width="300" height="80" rx="8" fill="#d8cdb8"/>
  <text x="210" y="583" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">AGENT</text>
  <text x="530" y="583" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TOOLS</text>

  <!-- tool 1: calculator -->
  <rect x="300" y="440" width="84" height="62" rx="8" fill="#3d3a3a"/>
  <rect x="310" y="448" width="64" height="14" rx="3" fill="#cfe3d6"/>
  <g fill="#e0a33a"><rect x="310" y="468" width="12" height="10" rx="2"/><rect x="326" y="468" width="12" height="10" rx="2"/><rect x="342" y="468" width="12" height="10" rx="2"/><rect x="358" y="468" width="16" height="26" rx="2" fill="#e07a5f"/><rect x="310" y="484" width="12" height="10" rx="2"/><rect x="326" y="484" width="12" height="10" rx="2"/><rect x="342" y="484" width="12" height="10" rx="2"/></g>
  <circle cx="324" cy="497" r="9" fill="#c98a5e"/>
  <!-- tool 2: bill printer with receipt going to the customer -->
  <rect x="440" y="452" width="90" height="50" rx="8" fill="#fff"/>
  <rect x="440" y="452" width="90" height="12" rx="6" fill="#b9ad98"/>
  <path d="M466 454 v-34 q0 -10 10 -10 h22 q10 0 10 10 v34 z" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M474 424 h26 M474 434 h18" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <path d="M520 430 q150 -40 196 0" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#ar2)"/>
  <!-- tool 3: translator phone on a stand -->
  <path d="M584 502 l16 -20 h26 l16 20 z" fill="#6b5446"/>
  <rect x="588" y="420" width="50" height="76" rx="8" fill="#3d3a3a"/>
  <rect x="594" y="428" width="38" height="58" rx="3" fill="#e8f0ef"/>
  <path d="M598 436 h22 v10 h-14 l-6 5 z" fill="#e0a33a"/><path d="M628 458 h-22 v10 h14 l6 5 z" fill="#1f6f78"/>
  <!-- speech bubbles going to the tourists -->
  <path d="M676 268 h120 a14 14 0 0 1 14 14 v30 a14 14 0 0 1 -14 14 h-80 l-16 16 v-16 h-24 a14 14 0 0 1 -14 -14 v-30 a14 14 0 0 1 14 -14 z" fill="#fff" stroke="#e0a33a" stroke-width="3"/>
  <path d="M684 296 q8 -14 16 0 q8 -14 16 0 h10 q6 -10 14 0 q8 -14 16 0 h20 q6 -12 12 0" stroke="#e0a33a" stroke-width="3" fill="none"/>
  <path d="M684 286 h104" stroke="#e0a33a" stroke-width="3"/>
  <path d="M790 194 h120 a14 14 0 0 1 14 14 v30 a14 14 0 0 1 -14 14 h-24 v16 l-16 -16 h-80 a14 14 0 0 1 -14 -14 v-30 a14 14 0 0 1 14 -14 z" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <path d="M798 222 q6 -10 12 0 t12 0 t12 0 M846 222 h20 M876 222 q6 -10 12 0 t12 0" stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M650 420 q20 -60 50 -84" stroke="#e0a33a" stroke-width="2" stroke-dasharray="4 5" fill="none"/>

  <!-- local customer takes the bill -->
  <use href="#man" transform="translate(760 620) scale(.95)" color="#e07a5f"/>
  <path d="M786 403 a3 3 0 0 1 0 0" fill="none"/>
  <path d="M736 514 q-20 -30 -14 -60" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M784 514 q8 30 0 50" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
  <rect x="706" y="410" width="34" height="46" rx="3" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M712 422 h22 M712 432 h16 M712 442 h20" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <circle cx="722" cy="456" r="7" fill="#b07850"/>
  <!-- tourist couple with backpack and map -->
  <use href="#woman" transform="translate(848 620) scale(.95)" color="#7a4e7e"/>
  <rect x="890" y="486" width="34" height="54" rx="8" fill="#6b5446"/>
  <use href="#man" transform="translate(912 620) scale(.95)" color="#e0a33a"/>
  <path d="M902 459 a10 10 0 0 0 20 0" fill="none"/>
  <path d="M826 514 q-10 20 6 34" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M870 514 q14 16 22 30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <rect x="864" y="530" width="44" height="32" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M872 540 q10 -6 18 4 t12 2 M880 556 l8 -10" stroke="#1f6f78" stroke-width="2" fill="none"/>
  <path d="M842 468 q6 5 12 0 M906 468 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>
