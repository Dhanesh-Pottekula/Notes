<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A North Indian chef carries her skills into a South Indian kitchen and only practises dosa</title>
  <defs>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
      <circle cx="0" cy="-174" r="9" fill="#2e2a2a"/>
    </g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="20" fill="#b07850"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#d8cdb8"/>
    </g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- wall tiles line -->
  <rect x="0" y="420" width="960" height="8" fill="#e5dcc9"/>

  <!-- faded memory inset: tandoor and rotis -->
  <circle cx="150" cy="160" r="104" fill="#efe6d2" stroke="#d8cdb8" stroke-width="4"/>
  <g opacity=".6">
    <path d="M100 236 q-6 -60 20 -80 h60 q26 20 20 80 z" fill="#c4744f"/>
    <ellipse cx="150" cy="156" rx="30" ry="8" fill="#6b5446"/>
    <path d="M140 146 q-6 -16 0 -30 M158 146 q6 -16 0 -30" stroke="#b9ad98" stroke-width="3" fill="none"/>
    <g fill="#e0a33a"><ellipse cx="86" cy="118" rx="18" ry="7"/><ellipse cx="86" cy="108" rx="18" ry="7"/></g>
    <g transform="translate(212 236) scale(.62)">
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/><rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="#7a4e7e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
      <path d="M-24 -100 l-30 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    </g>
  </g>
  <path d="M252 120 Q420 20 548 120" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="3 9" stroke-linecap="round" marker-end="url(#ar)"/>

  <!-- floating bundle of skills -->
  <rect x="552" y="40" width="384" height="200" rx="34" fill="#1f6f78" opacity=".16"/>
  <rect x="552" y="40" width="384" height="200" rx="34" fill="none" stroke="#1f6f78" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="744" y="92" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">PRE-TRAINED SKILLS</text>
  <!-- knife -->
  <path d="M600 186 h70 q20 -2 26 -22 h-96 z" fill="#9fb0b5"/><path d="M600 186 h70 q20 -2 26 -22" stroke="#6d7f85" stroke-width="3" fill="none"/><rect x="574" y="178" width="30" height="12" rx="4" fill="#3d3a3a"/>
  <!-- tadka pan with spices -->
  <ellipse cx="760" cy="176" rx="36" ry="12" fill="#3d3a3a"/><path d="M724 176 q36 30 72 0 z" fill="#3d3a3a"/>
  <path d="M796 172 h40" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <g fill="#e0a33a"><circle cx="748" cy="174" r="4"/><circle cx="764" cy="178" r="4"/></g><circle cx="776" cy="172" r="4" fill="#e07a5f"/><circle cx="756" cy="170" r="3" fill="#6b5446"/>
  <!-- timer -->
  <circle cx="884" cy="174" r="28" fill="#fff" stroke="#e07a5f" stroke-width="5"/>
  <path d="M884 174 v-16 M884 174 l12 8" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <rect x="876" y="138" width="16" height="8" rx="2" fill="#e07a5f"/>
  <!-- straps to her shoulders -->
  <path d="M600 240 L452 428 M680 240 L492 428" stroke="#1f6f78" stroke-width="3" stroke-dasharray="6 6" opacity=".7"/>

  <!-- framed certificate; second enrolment not needed -->
  <rect x="44" y="300" width="84" height="64" rx="4" fill="#8a6d5a"/><rect x="52" y="308" width="68" height="48" fill="#fff"/>
  <path d="M62 322 h48 M62 334 h36" stroke="#b9ad98" stroke-width="3"/><circle cx="104" cy="346" r="6" fill="#e0a33a"/>
  <rect x="146" y="304" width="52" height="66" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M154 318 h34 M154 330 h34 M154 342 h26" stroke="#d8cdb8" stroke-width="3"/>
  <path d="M146 304 l52 66 M198 304 l-52 66" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>

  <!-- wall calendar: three weeks -->
  <rect x="600" y="282" width="104" height="104" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="600" y="282" width="104" height="20" rx="6" fill="#e07a5f"/>
  <g fill="#e8e0d0"><rect x="610" y="312" width="84" height="14"/><rect x="610" y="332" width="84" height="14"/><rect x="610" y="352" width="84" height="14"/></g>
  <g stroke="#1f6f78" stroke-width="4" stroke-linecap="round" fill="none"><path d="M614 318 l4 4 l8 -8"/><path d="M614 338 l4 4 l8 -8"/><path d="M614 358 l4 4 l8 -8"/></g>
  <path d="M632 319 h56 M632 339 h56 M632 359 h56" stroke="#1f6f78" stroke-width="3" opacity=".6"/>

  <!-- the chef behind the stove -->
  <use href="#woman" transform="translate(470 600) scale(1.45)" color="#ffffff"/>
  <path d="M448 430 L500 540" stroke="#7a4e7e" stroke-width="12"/>
  <path d="M462 394 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M434 456 q-30 20 -30 50" stroke="#c98a5e" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M506 456 q24 20 30 46" stroke="#c98a5e" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M536 500 l-10 30" stroke="#8a6d5a" stroke-width="6" stroke-linecap="round"/><ellipse cx="524" cy="533" rx="14" ry="6" fill="#cfd4d6"/>

  <!-- stove, tawa and dosa spiral -->
  <rect x="270" y="540" width="420" height="100" fill="#cbbfa9"/>
  <rect x="270" y="540" width="420" height="12" fill="#b9ad98"/>
  <ellipse cx="480" cy="540" rx="160" ry="30" fill="#3d3a3a"/>
  <ellipse cx="480" cy="536" rx="140" ry="22" fill="#4a4646"/>
  <path d="M480 536 m0 0 a10 5 0 1 1 20 0 a30 12 0 1 1 -60 0 a50 18 0 1 1 100 0" stroke="#f3e2b8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <ellipse cx="560" cy="546" rx="18" ry="6" fill="#f3e2b8"/>
  <text x="480" y="608" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">FINETUNING</text>

  <!-- sambar pot, tumblers, banana leaf, coconut -->
  <path d="M120 600 q0 -80 70 -80 q70 0 70 80 z" fill="#8a8580"/>
  <ellipse cx="190" cy="522" rx="62" ry="10" fill="#c4744f"/>
  <path d="M170 506 q-8 -14 0 -26 M206 506 q8 -14 0 -26" stroke="#b9ad98" stroke-width="3" fill="none"/>
  <path d="M40 620 q60 -40 140 -6 q-60 30 -140 6 z" fill="#5f9a54"/>
  <g fill="#cfd4d6"><path d="M200 620 l4 -36 h20 l4 36 z"/><path d="M234 620 l4 -36 h20 l4 36 z"/></g>

  <!-- older cook nods -->
  <use href="#man" transform="translate(830 600) scale(1.1)" color="#ffffff"/>
  <rect x="808" y="534" width="44" height="66" rx="4" fill="#f4efe4"/>
  <rect x="808" y="534" width="44" height="8" fill="#e0a33a"/>
  <path d="M808 482 q-24 14 -36 -10" stroke="#b07850" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M770 474 v-14" stroke="#b07850" stroke-width="8" stroke-linecap="round"/>
  <path d="M852 482 q10 26 6 46" stroke="#b07850" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M822 448 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M800 420 q-8 8 0 16 M860 420 q8 8 0 16" stroke="#b9ad98" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
