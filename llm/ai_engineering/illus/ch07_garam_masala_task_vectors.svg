<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two family twists on grandma's garam masala are added to her base to make a merged blend</title>
  <defs>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 v26 h-7 v-22 q-14 -8 -28 0 v22 h-7 z" fill="#2e2a2a"/>
    </g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="jar"><rect x="-18" y="-40" width="36" height="40" rx="6" fill="#e8f0ef" stroke="#b9ad98" stroke-width="2"/><rect x="-20" y="-48" width="40" height="10" rx="3" fill="#8a6d5a"/><rect x="-14" y="-24" width="28" height="20" rx="3" fill="#9a5a32"/></g>
    <g id="spoon"><path d="M0 0 l60 40" stroke="#9aa5a8" stroke-width="6" stroke-linecap="round"/><ellipse cx="-8" cy="-4" rx="26" ry="14" fill="#b9c3c6"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- sunlight shaft with spice dust -->
  <path d="M600 0 h120 l-220 640 h-120 z" fill="#fff" opacity=".4"/>
  <g fill="#c4744f" opacity=".5"><circle cx="560" cy="160" r="3"/><circle cx="600" cy="110" r="2"/><circle cx="540" cy="250" r="2.5"/><circle cx="620" cy="60" r="2"/><circle cx="500" cy="330" r="2"/></g>
  <!-- shelf with jars and masala dabba -->
  <rect x="740" y="120" width="200" height="10" fill="#8a6d5a"/>
  <use href="#jar" transform="translate(770 120)"/><use href="#jar" transform="translate(820 120)"/>
  <ellipse cx="890" cy="112" rx="34" ry="10" fill="#b9c3c6"/><rect x="856" y="96" width="68" height="16" fill="#9aa5a8"/><ellipse cx="890" cy="96" rx="34" ry="10" fill="#cfd4d6"/>
  <!-- stone grinder -->
  <rect x="40" y="560" width="110" height="40" rx="6" fill="#9a9590"/><ellipse cx="95" cy="560" rx="55" ry="10" fill="#b5b0aa"/><rect x="70" y="540" width="50" height="16" rx="8" fill="#7c7772"/>

  <!-- inset: subtracting a clashing twist -->
  <rect x="32" y="32" width="200" height="150" rx="16" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <path d="M70 150 q62 40 124 0 z" fill="#c4744f"/><ellipse cx="132" cy="150" rx="62" ry="12" fill="#9a5a32"/>
  <path d="M132 136 v-50" stroke="#9aa5a8" stroke-width="5" stroke-linecap="round"/><ellipse cx="132" cy="84" rx="20" ry="10" fill="#b9c3c6"/>
  <path d="M120 80 q12 -14 26 -4" stroke="#c0392b" stroke-width="8" stroke-linecap="round" fill="none"/>
  <circle cx="196" cy="72" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <path d="M188 72 h16" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  <path d="M132 60 v-14" stroke="#e07a5f" stroke-width="3" marker-end="url(#ar)"/>

  <!-- the label over both twists -->
  <text x="480" y="196" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TASK VECTORS</text>
  <path d="M352 186 L300 250 M608 186 L660 250" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- daughter with her jar, spoon of extra cardamom lifted out -->
  <use href="#woman" transform="translate(180 560) scale(1.25)" color="#e07a5f"/>
  <path d="M158 420 q20 26 50 22 M202 420 q14 16 14 26" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <use href="#jar" transform="translate(220 458)"/>
  <path d="M220 404 Q236 340 268 300" stroke="#e0a33a" stroke-width="3" fill="none" stroke-dasharray="4 5"/>
  <circle cx="272" cy="282" r="44" fill="#e0a33a" opacity=".22"/>
  <use href="#spoon" transform="translate(272 282) rotate(180) scale(-1 1)"/>
  <g fill="#7cb342"><ellipse cx="270" cy="276" rx="8" ry="5"/><ellipse cx="284" cy="282" rx="8" ry="5"/><ellipse cx="262" cy="284" rx="8" ry="5"/></g>

  <!-- grandson with his jar, spoon of black pepper -->
  <use href="#man" transform="translate(790 560) scale(1.25)" color="#1f6f78"/>
  <path d="M822 420 q-20 26 -50 22 M758 420 q-14 16 -14 26" stroke="#d9a27a" stroke-width="13" stroke-linecap="round" fill="none"/>
  <use href="#jar" transform="translate(746 458)"/>
  <path d="M746 404 Q730 340 696 300" stroke="#e0a33a" stroke-width="3" fill="none" stroke-dasharray="4 5"/>
  <circle cx="690" cy="282" r="44" fill="#e0a33a" opacity=".22"/>
  <use href="#spoon" transform="translate(690 282) rotate(180)"/>
  <g fill="#2e2a2a"><circle cx="688" cy="278" r="4.5"/><circle cx="700" cy="284" r="4.5"/><circle cx="680" cy="286" r="4.5"/><circle cx="694" cy="290" r="4"/></g>

  <!-- grandma on her low stool -->
  <rect x="430" y="400" width="100" height="30" rx="6" fill="#8a6d5a"/>
  <path d="M452 322 a28 26 0 0 1 56 0 l26 96 h-108 z" fill="#ffffff"/>
  <path d="M462 300 q30 40 60 118" stroke="#e8e2d4" stroke-width="10" fill="none"/>
  <rect x="472" y="282" width="16" height="12" fill="#b07850"/>
  <circle cx="480" cy="266" r="23" fill="#b07850"/>
  <path d="M457 264 a23 23 0 0 1 46 0 q-23 -10 -46 0 z" fill="#cfcac2"/>
  <circle cx="503" cy="252" r="9" fill="#cfcac2"/>
  <path d="M472 276 q8 7 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M452 340 q-20 40 0 70 M508 340 q20 40 0 70" stroke="#b07850" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- her big clay bowl -->
  <path d="M388 420 q92 80 184 0 z" fill="#c4744f"/>
  <ellipse cx="480" cy="420" rx="92" ry="18" fill="#9a5a32"/>
  <ellipse cx="480" cy="420" rx="80" ry="12" fill="#a8642f"/>
  <text x="480" y="500" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">BASE MODEL</text>

  <!-- arrows: base + twists flow into the merged bowl -->
  <path d="M300 300 Q330 520 392 556" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#ar)"/>
  <path d="M660 300 Q630 520 568 556" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#ar)"/>
  <circle cx="330" cy="470" r="15" fill="#fff" stroke="#1f6f78" stroke-width="3"/><path d="M322 470 h16 M330 462 v16" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>
  <circle cx="630" cy="470" r="15" fill="#fff" stroke="#1f6f78" stroke-width="3"/><path d="M622 470 h16 M630 462 v16" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>

  <!-- the glowing merged bowl in front -->
  <ellipse cx="480" cy="560" rx="110" ry="40" fill="#e0a33a" opacity=".25"/>
  <path d="M404 548 q76 66 152 0 z" fill="#c4744f"/>
  <ellipse cx="480" cy="548" rx="76" ry="15" fill="#9a5a32"/>
  <g><ellipse cx="456" cy="546" rx="7" ry="4" fill="#7cb342"/><ellipse cx="500" cy="550" rx="7" ry="4" fill="#7cb342"/><circle cx="476" cy="550" r="4" fill="#2e2a2a"/><circle cx="514" cy="544" r="4" fill="#2e2a2a"/><circle cx="440" cy="550" r="3.5" fill="#2e2a2a"/></g>
  <path d="M470 532 q-6 -12 0 -22 M492 532 q6 -12 0 -22" stroke="#c4744f" stroke-width="3" fill="none" opacity=".7"/>
  <text x="480" y="624" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">MERGED</text>
</svg>
