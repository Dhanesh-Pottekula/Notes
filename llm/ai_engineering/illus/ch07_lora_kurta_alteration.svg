<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A tailor stitches a thin saffron strip onto a ready-made kurta instead of sewing a new one</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <path id="kurta" d="M-50 -150 l-30 8 l-70 90 l30 22 l50 -50 v220 h140 v-220 l50 50 l30 -22 l-70 -90 l-30 -8 q-25 22 -50 0 z"/>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- window grille light -->
  <g fill="#fff" opacity=".45"><path d="M380 0 h90 l-60 300 h-90 z"/><path d="M500 0 h50 l-60 300 h-50 z"/></g>
  <!-- shelf with the untouched new-kurta option -->
  <rect x="40" y="196" width="300" height="12" fill="#8a6d5a"/>
  <g opacity=".75">
    <rect x="60" y="132" width="120" height="64" rx="6" fill="#d9e4e6"/>
    <ellipse cx="60" cy="164" rx="12" ry="32" fill="#c3d2d5"/><ellipse cx="180" cy="164" rx="12" ry="32" fill="#c3d2d5"/>
    <path d="M200 196 l12 -60 h96 l-6 60 z" fill="#efe2c4"/>
    <path d="M226 186 v-34 h20 v8 h20 v-8 h20 v34" stroke="#b9ad98" stroke-width="3" fill="none" stroke-dasharray="5 4"/>
    <path d="M190 196 q30 -14 60 0" stroke="#e0a33a" stroke-width="5" fill="none"/>
  </g>
  <circle cx="320" cy="140" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <path d="M313 133 l14 14 M327 133 l-14 14" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>

  <!-- tailor behind the table -->
  <use href="#man" transform="translate(620 420) scale(1.25)" color="#e8e2d4"/>
  <path d="M595 225 a25 14 0 0 1 50 0 z" fill="#fff"/>
  <rect x="595" y="222" width="50" height="5" fill="#d8cdb8"/>
  <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="611" cy="236" r="7"/><circle cx="629" cy="236" r="7"/><path d="M618 236 h4"/></g>
  <path d="M606 254 q14 6 28 0" stroke="#d8cdb8" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- work table -->
  <path d="M20 300 h740 l40 340 h-820 z" fill="#a8876f"/>
  <path d="M20 300 h740 v10 h-740 z" fill="#8a6d5a"/>
  <!-- the ready-made kurta lying flat -->
  <g transform="translate(400 470)">
    <use href="#kurta" fill="#000" opacity=".08" transform="translate(6 6)"/>
    <use href="#kurta" fill="#ffffff"/>
    <path d="M-25 -150 q25 22 50 0" stroke="#d8cdb8" stroke-width="3" fill="none"/>
    <path d="M0 -128 v50" stroke="#d8cdb8" stroke-width="3"/>
    <g fill="#d8cdb8"><circle cx="0" cy="-112" r="3"/><circle cx="0" cy="-96" r="3"/></g>
    <!-- the thin LoRA strips -->
    <g fill="#e08a2a"><rect x="-74" y="-60" width="8" height="198"/><rect x="66" y="-60" width="8" height="198"/><path d="M-70 -64 l-64 -6 l-4 6 l66 8 z"/><path d="M70 -64 l64 -6 l4 6 l-66 8 z"/></g>
    <g stroke="#fff" stroke-width="1.5" stroke-dasharray="3 4"><line x1="-70" y1="-56" x2="-70" y2="134"/><line x1="70" y1="-56" x2="70" y2="134"/></g>
  </g>
  <text x="400" y="478" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">FROZEN</text>
  <text x="400" y="516" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">WEIGHTS</text>
  <text x="618" y="580" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LORA</text>
  <path d="M572 568 l-88 -16" stroke="#e08a2a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="480" cy="551" r="5" fill="#e08a2a"/>

  <!-- tailor's hands stitching the seam -->
  <path d="M592 300 q-60 30 -112 96" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M648 300 q-10 60 -150 140" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M498 440 l26 -30" stroke="#9aa5a8" stroke-width="3"/>
  <path d="M524 410 q30 -30 60 -10" stroke="#e08a2a" stroke-width="2" fill="none"/>

  <!-- tools on the table -->
  <g><rect x="80" y="330" width="22" height="30" rx="3" fill="#e08a2a"/><rect x="76" y="326" width="30" height="6" rx="2" fill="#8a6d5a"/><rect x="76" y="358" width="30" height="6" rx="2" fill="#8a6d5a"/><rect x="118" y="336" width="22" height="30" rx="3" fill="#1f6f78"/><rect x="114" y="332" width="30" height="6" rx="2" fill="#8a6d5a"/><rect x="114" y="364" width="30" height="6" rx="2" fill="#8a6d5a"/></g>
  <circle cx="176" cy="356" r="16" fill="#e07a5f"/><g stroke="#3d3a3a" stroke-width="2"><line x1="172" y1="344" x2="168" y2="336"/><line x1="180" y1="344" x2="186" y2="336"/></g>
  <g fill="none" stroke="#3d3a3a" stroke-width="4"><circle cx="642" cy="350" r="8"/><circle cx="660" cy="346" r="8"/></g>
  <path d="M648 340 l50 -14 M654 354 l46 -8" stroke="#9aa5a8" stroke-width="4" stroke-linecap="round"/>
  <path d="M672 628 q40 -26 96 -14" stroke="#e0a33a" stroke-width="10" fill="none"/>
  <!-- balance: altered kurta weighs the same -->
  <path d="M120 600 v-120" stroke="#6b5446" stroke-width="6"/>
  <path d="M60 480 h120" stroke="#6b5446" stroke-width="5"/>
  <path d="M60 480 l-20 46 h40 z M180 480 l-20 46 h40 z" fill="none" stroke="#b9ad98" stroke-width="2"/>
  <path d="M36 526 h48 q-6 14 -24 14 q-18 0 -24 -14 z M156 526 h48 q-6 14 -24 14 q-18 0 -24 -14 z" fill="#b9ad98"/>
  <rect x="44" y="512" width="32" height="16" rx="3" fill="#fff"/>
  <rect x="164" y="512" width="32" height="16" rx="3" fill="#fff"/><rect x="164" y="512" width="4" height="16" fill="#e08a2a"/><rect x="192" y="512" width="4" height="16" fill="#e08a2a"/>
  <rect x="100" y="596" width="40" height="10" rx="3" fill="#6b5446"/>
  <text x="120" y="472" text-anchor="middle" font-size="22" font-weight="800" fill="#1f6f78">=</text>

  <!-- delighted customer in a vest -->
  <use href="#man" transform="translate(880 600) scale(1.1)" color="#ffffff"/>
  <path d="M858 482 q-18 -30 -8 -60 M902 482 q18 -30 8 -60" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M870 448 q10 10 20 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- inset: the perfect fit afterwards -->
  <circle cx="852" cy="320" r="6" fill="#fff" stroke="#1f6f78" stroke-width="2"/>
  <circle cx="842" cy="296" r="9" fill="#fff" stroke="#1f6f78" stroke-width="2"/>
  <rect x="770" y="60" width="170" height="220" rx="24" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <g transform="translate(855 262) scale(.85)">
    <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
    <path d="M-28 -40 v-64 a28 26 0 0 1 56 0 v64 z" fill="#f4efe4"/>
    <rect x="-28" y="-104" width="5" height="64" fill="#e08a2a"/><rect x="23" y="-104" width="5" height="64" fill="#e08a2a"/>
    <path d="M-28 -110 l-12 40 M28 -110 l12 40" stroke="#f4efe4" stroke-width="12" stroke-linecap="round"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    <path d="M-7 -144 q7 7 14 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <circle cx="912" cy="92" r="16" fill="#1f6f78"/>
  <path d="M904 92 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
