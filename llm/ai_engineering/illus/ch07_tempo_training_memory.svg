<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Inference moves only the furniture; training also moves giant notebooks of gradients and optimizer states</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#6b5a3e"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#6b5a3e"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#c9a96e"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="cab">
      <path d="M-150 -10 v-90 q0 -30 30 -36 h50 v126 z" fill="#1f6f78"/>
      <path d="M-140 -74 v-22 q0 -22 22 -26 h36 v48 z" fill="#cfe0dc"/>
      <rect x="-150" y="-26" width="300" height="16" rx="4" fill="#3d3a3a"/>
      <rect x="-72" y="-60" width="222" height="36" fill="#6b5446"/>
      <rect x="-72" y="-60" width="222" height="6" fill="#8a6d5a"/>
      <circle cx="-150" cy="-50" r="6" fill="#e0a33a"/>
    </g>
    <g id="sofa"><rect x="0" y="-48" width="110" height="48" rx="8" fill="#7a4e7e"/><rect x="-6" y="-60" width="16" height="60" rx="6" fill="#6a3f6e"/><rect x="100" y="-60" width="16" height="60" rx="6" fill="#6a3f6e"/></g>
    <g id="almirah"><rect x="0" y="-130" width="56" height="130" rx="3" fill="#b9ad98"/><line x1="28" y1="-126" x2="28" y2="-4" stroke="#8f8574" stroke-width="2"/><rect x="20" y="-74" width="4" height="14" fill="#6b5446"/><rect x="32" y="-74" width="4" height="14" fill="#6b5446"/></g>
    <g id="table"><rect x="0" y="-34" width="70" height="8" fill="#8a6d5a"/><rect x="6" y="-26" width="6" height="26" fill="#6b5446"/><rect x="58" y="-26" width="6" height="26" fill="#6b5446"/></g>
    <g id="chair"><rect x="0" y="-46" width="6" height="46" fill="#6b5446"/><rect x="0" y="-22" width="26" height="6" fill="#8a6d5a"/><rect x="22" y="-22" width="5" height="22" fill="#6b5446"/></g>
    <g id="load">
      <use href="#sofa" transform="translate(-64 -60)"/>
      <use href="#table" transform="translate(-50 -120)"/>
      <use href="#chair" transform="translate(-60 -154) rotate(-8)"/><use href="#chair" transform="translate(-20 -154)"/>
      <use href="#almirah" transform="translate(70 -60)"/>
      <path d="M-70 -60 L40 -150 M-70 -60 L130 -190 M150 -60 L60 -190" stroke="#e0d3b2" stroke-width="3" fill="none"/>
    </g>
    <g id="nb"><rect x="-190" y="-26" width="380" height="52" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="3"/><g fill="none" stroke="#3d3a3a" stroke-width="3"><circle cx="-170" cy="-26" r="6"/><circle cx="-130" cy="-26" r="6"/><circle cx="-90" cy="-26" r="6"/><circle cx="-50" cy="-26" r="6"/><circle cx="-10" cy="-26" r="6"/><circle cx="30" cy="-26" r="6"/><circle cx="70" cy="-26" r="6"/><circle cx="110" cy="-26" r="6"/><circle cx="150" cy="-26" r="6"/></g></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- apartment blocks -->
  <g fill="#e8dfcc"><rect x="30" y="140" width="190" height="330"/><rect x="250" y="190" width="200" height="280"/><rect x="510" y="140" width="190" height="330"/><rect x="730" y="190" width="200" height="280"/></g>
  <g fill="#d8cdb8"><rect x="54" y="170" width="30" height="30"/><rect x="110" y="170" width="30" height="30"/><rect x="166" y="170" width="30" height="30"/><rect x="54" y="230" width="30" height="30"/><rect x="166" y="230" width="30" height="30"/><rect x="280" y="220" width="30" height="30"/><rect x="390" y="220" width="30" height="30"/><rect x="534" y="170" width="30" height="30"/><rect x="646" y="170" width="30" height="30"/><rect x="760" y="220" width="30" height="30"/><rect x="870" y="220" width="30" height="30"/></g>
  <rect x="0" y="500" width="960" height="140" fill="#e5dcc9"/>
  <line x1="480" y1="24" x2="480" y2="616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">INFERENCE</text>
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRAINING</text>

  <!-- LEFT: neat load -->
  <ellipse cx="270" cy="504" rx="160" ry="8" fill="#000" opacity=".08"/>
  <g transform="translate(270 478)"><use href="#cab"/><use href="#load"/></g>
  <circle cx="150" cy="478" r="24" fill="#3d3a3a"/><circle cx="150" cy="478" r="9" fill="#b9ad98"/>
  <circle cx="380" cy="478" r="24" fill="#3d3a3a"/><circle cx="380" cy="478" r="9" fill="#b9ad98"/>
  <!-- relaxed driver leaning on the cab -->
  <use href="#man" transform="translate(84 504)"/>
  <path d="M104 400 q10 20 22 26" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M66 400 q-14 18 -4 36" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M76 362 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- RIGHT: same furniture plus giant notebooks -->
  <!-- the bigger truck waiting behind -->
  <rect x="890" y="300" width="90" height="190" rx="10" fill="#7a4e7e" opacity=".85"/>
  <rect x="900" y="320" width="60" height="60" rx="6" fill="#cfe0dc"/>
  <circle cx="930" cy="490" r="24" fill="#3d3a3a"/>
  <ellipse cx="730" cy="514" rx="170" ry="8" fill="#000" opacity=".1"/>
  <g transform="translate(730 494) rotate(3)"><use href="#cab"/><use href="#load"/></g>
  <g transform="translate(0 14)">
  <use href="#nb" transform="translate(712 278) rotate(2)"/>
  <use href="#nb" transform="translate(722 224) rotate(-2)"/>
  <use href="#nb" transform="translate(716 168) rotate(1)"/>
  <text x="722" y="234" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" transform="rotate(-2 722 224)">GRADIENTS + OPTIMIZER</text>
  <path d="M640 168 h40 M690 168 h60 M760 168 h30 M640 288 h50 M720 288 h70" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <path d="M600 158 l18 -18 l6 6 l-18 18 z" fill="#e0a33a"/>
  </g>
  <!-- squashed tyres -->
  <ellipse cx="606" cy="500" rx="30" ry="14" fill="#3d3a3a"/><ellipse cx="606" cy="498" rx="10" ry="6" fill="#b9ad98"/>
  <ellipse cx="842" cy="508" rx="32" ry="12" fill="#3d3a3a"/><ellipse cx="842" cy="506" rx="10" ry="5" fill="#b9ad98"/>
  <path d="M584 520 l-12 8 M628 520 l12 8 M822 524 l-12 6 M864 524 l12 6" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <!-- sweating driver -->
  <use href="#man" transform="translate(530 560) scale(.95)"/>
  <path d="M548 462 q16 -20 -4 -38" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M512 462 q-12 18 -6 36" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M522 430 q8 -6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g fill="#7fb0b8"><path d="M504 396 q-6 10 0 14 q6 -4 0 -14 z"/><path d="M500 420 q-5 8 0 11 q5 -3 0 -11 z"/><path d="M560 400 q-5 8 0 11 q5 -3 0 -11 z"/></g>

  <!-- inset: smaller tempo, smaller items -->
  <rect x="740" y="536" width="196" height="88" rx="12" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <g transform="translate(846 604) scale(.42)"><use href="#cab"/><use href="#load" transform="scale(.6) translate(0 -20)"/></g>
  <circle cx="796" cy="604" r="10" fill="#3d3a3a"/><circle cx="893" cy="604" r="10" fill="#3d3a3a"/>
</svg>
