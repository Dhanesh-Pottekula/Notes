<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A trainee practises an engine failure in a flight simulator that an instructor can replay endlessly</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#cfcac2"/>
    </g>
    <g id="seat"><rect x="0" y="-70" width="44" height="54" rx="10" fill="#1f6f78"/><rect x="-4" y="-22" width="52" height="16" rx="6" fill="#185a62"/><rect x="18" y="-6" width="8" height="12" fill="#6b5446"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="540" width="960" height="100" fill="#e5dcc9"/>

  <!-- inset: a cracked physics book -->
  <rect x="30" y="30" width="180" height="130" rx="14" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <path d="M60 140 l6 -86 h80 l-6 86 z" fill="#7a4e7e"/>
  <path d="M66 54 l-6 86" stroke="#5c3a60" stroke-width="5"/>
  <path d="M106 54 l-10 26 l14 12 l-12 22 l8 26" stroke="#fff" stroke-width="3" fill="none"/>
  <circle cx="178" cy="66" r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="178" y="74" text-anchor="middle" font-size="22" font-weight="800" fill="#e07a5f">!</text>

  <!-- hydraulic legs -->
  <g stroke="#9aa5a8" stroke-width="16" stroke-linecap="round"><line x1="330" y1="430" x2="300" y2="530"/><line x1="610" y1="430" x2="640" y2="530"/><line x1="470" y1="430" x2="470" y2="530"/></g>
  <g stroke="#6d7f85" stroke-width="22" stroke-linecap="round"><line x1="306" y1="510" x2="300" y2="530"/><line x1="634" y1="510" x2="640" y2="530"/><line x1="470" y1="505" x2="470" y2="530"/></g>
  <g fill="#3d3a3a"><rect x="270" y="532" width="60" height="12" rx="4"/><rect x="610" y="532" width="60" height="12" rx="4"/><rect x="440" y="532" width="60" height="12" rx="4"/></g>
  <ellipse cx="470" cy="544" rx="230" ry="10" fill="#000" opacity=".08"/>

  <!-- the simulator pod, side cut away -->
  <rect x="246" y="96" width="448" height="344" rx="56" fill="#ffffff"/>
  <rect x="246" y="96" width="448" height="344" rx="56" fill="none" stroke="#d8cdb8" stroke-width="3"/>
  <rect x="282" y="128" width="376" height="246" rx="20" fill="#2f3a4a"/>
  <!-- wraparound screen: storm and burning engine -->
  <rect x="296" y="140" width="348" height="150" rx="10" fill="#5b6b7d"/>
  <rect x="296" y="140" width="348" height="150" rx="10" fill="#9ccbe0" opacity=".2"/>
  <g fill="#44505e"><ellipse cx="360" cy="168" rx="60" ry="20"/><ellipse cx="560" cy="160" rx="80" ry="22"/><ellipse cx="460" cy="176" rx="50" ry="16"/></g>
  <path d="M420 170 l-14 30 h14 l-10 28" stroke="#f3e2b8" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <path d="M330 258 L610 238 l6 8 L330 268 z" fill="#cfd4d6"/>
  <rect x="520" y="248" width="44" height="18" rx="9" fill="#9aa5a8"/>
  <g fill="#3d3a3a" opacity=".85"><circle cx="512" cy="248" r="10"/><circle cx="492" cy="236" r="13"/><circle cx="466" cy="220" r="15"/><circle cx="436" cy="206" r="16"/><circle cx="404" cy="196" r="13"/></g>
  <path d="M520 252 q-10 -8 -2 -18 q8 6 10 0 q8 10 0 18 z" fill="#e07a5f"/>
  <!-- instrument panel with warning light -->
  <rect x="296" y="296" width="348" height="34" rx="6" fill="#3d3a3a"/>
  <g fill="#7fb0b8"><circle cx="330" cy="313" r="9"/><circle cx="362" cy="313" r="9"/><circle cx="578" cy="313" r="9"/><circle cx="610" cy="313" r="9"/></g>
  <circle cx="540" cy="313" r="20" fill="#e04b3a" opacity=".35"/><circle cx="540" cy="313" r="10" fill="#e04b3a"/>
  <!-- trainee pilot from behind, gripping the yoke -->
  <rect x="436" y="326" width="68" height="48" rx="10" fill="#4a3f55"/>
  <path d="M434 374 v-30 a36 30 0 0 1 72 0 v30 z" fill="#fff"/>
  <g fill="#e0a33a"><rect x="436" y="334" width="14" height="5" rx="2"/><rect x="490" y="334" width="14" height="5" rx="2"/></g>
  <path d="M440 352 l-16 -24 M500 352 l16 -24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M418 326 h104" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="470" cy="300" r="22" fill="#2e2a2a"/>
  <circle cx="470" cy="280" r="9" fill="#2e2a2a"/>
  <path d="M448 298 a22 22 0 0 1 44 0" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <rect x="442" y="294" width="10" height="16" rx="4" fill="#3d3a3a"/><rect x="488" y="294" width="10" height="16" rx="4" fill="#3d3a3a"/>
  <text x="470" y="420" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SYNTHETIC DATA</text>

  <!-- RARE EVENTS pointing at the smoking engine -->
  <text x="830" y="120" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">RARE EVENTS</text>
  <path d="M760 134 Q680 180 576 250" stroke="#e07a5f" stroke-width="4" fill="none" marker-end="url(#ar)"/>

  <!-- instructor at the console -->
  <use href="#man" transform="translate(830 560) scale(1.15)" color="#7a4e7e"/>
  <path d="M820 390 q10 6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M802 450 q-24 4 -42 10" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <rect x="726" y="460" width="210" height="84" rx="6" fill="#6b5446"/>
  <rect x="726" y="460" width="210" height="10" rx="4" fill="#8a6d5a"/>
  <circle cx="762" cy="456" r="20" fill="#1f6f78"/>
  <path d="M752 452 a10 10 0 1 1 4 10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M748 446 l4 7 l6 -5" stroke="#fff" stroke-width="3" fill="none"/>
  <rect x="864" y="426" width="64" height="36" rx="4" fill="#2f3a4a"/>
  <text x="896" y="451" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a" font-family="Menlo, monospace">247</text>

  <!-- empty passenger seats, nobody at risk -->
  <use href="#seat" transform="translate(40 600)"/>
  <use href="#seat" transform="translate(96 600)"/>
  <use href="#seat" transform="translate(152 600)"/>
  <use href="#seat" transform="translate(208 600)"/>
  <circle cx="246" cy="508" r="16" fill="#1f6f78"/>
  <path d="M238 508 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
