<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Photocopies of photocopies lose the faint margin notes first until only bold headings remain</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <filter id="b1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="b2" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e5dcc9"/>
  <!-- fluorescent tube -->
  <rect x="300" y="28" width="360" height="12" rx="6" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M300 46 l-40 60 M660 46 l40 60" stroke="#fff" stroke-width="2" opacity=".8"/>

  <!-- shop assistant feeding the copier -->
  <use href="#man" transform="translate(120 420) scale(1.1)" color="#1f6f78"/>
  <rect x="104" y="270" width="32" height="6" fill="#fff" opacity=".5"/>
  <path d="M112 270 q6 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M146 304 q24 10 34 0" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <!-- copier -->
  <rect x="30" y="320" width="190" height="244" rx="10" fill="#9aa5a8"/>
  <rect x="24" y="306" width="202" height="22" rx="6" fill="#7c878b"/>
  <rect x="150" y="296" width="60" height="12" fill="#fff"/>
  <rect x="44" y="350" width="70" height="30" rx="4" fill="#2f3a4a"/>
  <circle cx="190" cy="364" r="9" fill="#7cb342"/>
  <rect x="44" y="420" width="162" height="12" rx="4" fill="#7c878b"/><rect x="44" y="460" width="162" height="12" rx="4" fill="#7c878b"/>
  <path d="M220 360 h40 v10 h-40 z" fill="#d8dee0"/>

  <!-- long counter -->
  <rect x="226" y="440" width="734" height="130" fill="#8a6d5a"/>
  <rect x="226" y="440" width="734" height="16" fill="#6b5446"/>

  <!-- labels -->
  <text x="286" y="250" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">REAL DATA</text>
  <text x="538" y="250" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">RARE DETAILS LOST</text>
  <text x="790" y="250" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">COLLAPSE</text>

  <!-- five generations of copies -->
  <g transform="translate(236 296)">
    <rect x="4" y="6" width="100" height="148" fill="#000" opacity=".08"/>
    <rect x="0" y="0" width="100" height="148" fill="#fff"/>
    <rect x="12" y="12" width="60" height="12" rx="2" fill="#2b2b2b"/>
    <path d="M12 36 h64 M12 48 h58 M12 60 h62 M12 72 h50 M12 84 h60 " stroke="#7d7d7d" stroke-width="3" stroke-linecap="round"/>
    <g opacity="1"><circle cx="32" cy="112" r="12" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M50 124 l12 -22 l12 22 z" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M44 112 h6" stroke="#1f6f78" stroke-width="2"/></g>
    <g opacity="1" stroke="#7a4e7e" stroke-width="1.5" fill="none"><path d="M84 38 q3 -3 6 0 t6 0 M84 48 q3 -3 6 0 t6 0 M84 58 q3 -3 6 0"/><path d="M90 128 l2 6 l6 0 l-5 4 l2 6 l-5 -4 l-5 4 l2 -6 l-5 -4 l6 0 z"/></g>
  </g>
  <path d="M338 372 h16" stroke="#e07a5f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <g transform="translate(362 296)">
    <rect x="4" y="6" width="100" height="148" fill="#000" opacity=".08"/>
    <rect x="0" y="0" width="100" height="148" fill="#fff"/>
    <rect x="12" y="12" width="60" height="12" rx="2" fill="#2b2b2b"/>
    <path d="M12 36 h64 M12 48 h58 M12 60 h62 M12 72 h50 M12 84 h60 " stroke="#929292" stroke-width="3.5" stroke-linecap="round"/>
    <g opacity=".85"><circle cx="32" cy="112" r="12" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M50 124 l12 -22 l12 22 z" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M44 112 h6" stroke="#1f6f78" stroke-width="2"/></g>
    <g opacity=".45" stroke="#7a4e7e" stroke-width="1.5" fill="none"><path d="M84 38 q3 -3 6 0 t6 0 M84 48 q3 -3 6 0 t6 0 M84 58 q3 -3 6 0"/><path d="M90 128 l2 6 l6 0 l-5 4 l2 6 l-5 -4 l-5 4 l2 -6 l-5 -4 l6 0 z"/></g>
  </g>
  <path d="M464 372 h16" stroke="#e07a5f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <g transform="translate(488 296)">
    <rect x="4" y="6" width="100" height="148" fill="#000" opacity=".08"/>
    <rect x="0" y="0" width="100" height="148" fill="#fff"/>
    <rect x="12" y="12" width="60" height="12" rx="2" fill="#2b2b2b"/>
    <path d="M12 36 h64 M12 48 h58 M12 60 h62 M12 72 h50 M12 84 h60 " stroke="#a5a5a5" stroke-width="4" filter="url(#b1)" stroke-linecap="round"/>
    <g opacity=".6" filter="url(#b1)"><circle cx="32" cy="112" r="12" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M50 124 l12 -22 l12 22 z" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M44 112 h6" stroke="#1f6f78" stroke-width="2"/></g>
    <g opacity=".12" stroke="#7a4e7e" stroke-width="1.5" fill="none"><path d="M84 38 q3 -3 6 0 t6 0 M84 48 q3 -3 6 0 t6 0 M84 58 q3 -3 6 0"/><path d="M90 128 l2 6 l6 0 l-5 4 l2 6 l-5 -4 l-5 4 l2 -6 l-5 -4 l6 0 z"/></g>
  </g>
  <path d="M590 372 h16" stroke="#e07a5f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <g transform="translate(614 296)">
    <rect x="4" y="6" width="100" height="148" fill="#000" opacity=".08"/>
    <rect x="0" y="0" width="100" height="148" fill="#fff"/>
    <rect x="12" y="12" width="60" height="12" rx="2" fill="#2b2b2b"/>
    <path d="M12 40 h64 M12 58 h56 M12 76 h62 M12 112 h58 M12 130 h40" stroke="#9a9a9a" stroke-width="7" filter="url(#b2)" stroke-linecap="round"/>
  </g>
  <path d="M716 372 h16" stroke="#e07a5f" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <g transform="translate(740 296)">
    <rect x="4" y="6" width="100" height="148" fill="#000" opacity=".08"/>
    <rect x="0" y="0" width="100" height="148" fill="#fff"/>
    <rect x="12" y="12" width="60" height="12" rx="2" fill="#2b2b2b"/>
    <rect x="12" y="40" width="50" height="16" fill="#2b2b2b"/><rect x="12" y="70" width="64" height="12" fill="#2b2b2b"/><rect x="40" y="110" width="40" height="18" fill="#2b2b2b"/>
  </g>

  <!-- puzzled student -->
  <use href="#man" transform="translate(904 600) scale(.95)" color="#7a4e7e"/>
  <path d="M880 492 q-8 -14 2 -24" fill="none"/>
  <path d="M928 504 q16 -30 -6 -46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M894 470 q10 -4 18 2" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="900" cy="374" r="18" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="900" y="383" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">?</text>
</svg>
