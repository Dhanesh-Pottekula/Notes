<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Four dhabas with identical stoves; the busy one wins on its ingredients and recipe book</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="stove">
      <rect x="-44" y="-26" width="88" height="26" rx="4" fill="#3d3a3a"/>
      <circle cx="-22" cy="-13" r="5" fill="#8a8580"/><circle cx="22" cy="-13" r="5" fill="#8a8580"/>
      <path d="M-30 -26 l-6 -6 M30 -26 l6 -6" stroke="#3d3a3a" stroke-width="4"/>
      <ellipse cx="0" cy="-32" rx="48" ry="9" fill="#2b2b2b"/>
      <ellipse cx="0" cy="-34" rx="40" ry="5" fill="#4a4646"/>
    </g>
    <g id="awning"><rect x="0" y="0" width="170" height="40" fill="#e0a33a"/><g fill="#f6f1e7" opacity=".7"><rect x="20" y="0" width="20" height="40"/><rect x="60" y="0" width="20" height="40"/><rect x="100" y="0" width="20" height="40"/><rect x="140" y="0" width="20" height="40"/></g><path d="M0 40 q10.6 12 21.2 0 t21.2 0 t21.2 0 t21.2 0 t21.2 0 t21.2 0 t21.2 0 t21.2 0" fill="#e0a33a"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="470" width="960" height="170" fill="#e5dcc9"/>
  <path d="M0 560 h960" stroke="#f6f1e7" stroke-width="6" stroke-dasharray="40 30"/>

  <!-- stall back walls -->
  <g fill="#ece3d1"><rect x="40" y="150" width="170" height="180"/><rect x="225" y="150" width="170" height="180"/><rect x="410" y="150" width="170" height="180"/></g>
  <rect x="600" y="150" width="340" height="180" fill="#f3e6c8"/>
  <!-- bored cook in stall 2 -->
  <g transform="translate(350 470) scale(1.333) translate(-310 -420)">
  <use href="#man" transform="translate(310 420) scale(.9)" color="#b9ad98"/>
  <path d="M296 330 q-6 -40 6 -54" stroke="#c98a5e" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M302 304 q8 -3 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="344" y="248" font-size="20" font-weight="800" fill="#b9ad98">z z</text>
  </g>
  <!-- the busy owner in stall 4 -->
  <g transform="translate(736 470) scale(1.333) translate(-680 -450)">
  <use href="#man" transform="translate(680 450) scale(1.05)" color="#1f6f78"/>
  <path d="M664 340 v-14 a16 8 0 0 1 32 0 v14 z" fill="#fff"/>
  <path d="M659 290 a21 21 0 0 1 42 0 q0 -6 -6 -10 a24 18 0 0 0 -30 0 q-6 4 -6 10 z" fill="#e07a5f"/>
  <path d="M658 280 q22 -26 44 0 q-22 -8 -44 0 z" fill="#e07a5f"/>
  <path d="M661 292 q0 26 19 30 q19 -4 19 -30 q-4 14 -19 14 q-15 0 -19 -14 z" fill="#2e2a2a"/>
  <path d="M706 330 q20 6 34 -10" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M654 330 q-10 6 -12 -2" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>

  </g>
  <!-- counters and the identical stoves -->
  <g fill="#8a6d5a"><rect x="40" y="330" width="170" height="146"/><rect x="225" y="330" width="170" height="146"/><rect x="410" y="330" width="170" height="146"/><rect x="600" y="330" width="340" height="146"/></g>
  <g fill="#6b5446"><rect x="40" y="330" width="170" height="10"/><rect x="225" y="330" width="170" height="10"/><rect x="410" y="330" width="170" height="10"/><rect x="600" y="330" width="340" height="10"/></g>
  <use href="#stove" transform="translate(125 330)"/>
  <use href="#stove" transform="translate(290 330)"/>
  <use href="#stove" transform="translate(495 330)"/>
  <use href="#stove" transform="translate(650 330)"/>
  <!-- posts and awnings -->
  <g fill="#6b5446"><rect x="40" y="130" width="8" height="270"/><rect x="202" y="130" width="8" height="270"/><rect x="225" y="130" width="8" height="270"/><rect x="387" y="130" width="8" height="270"/><rect x="410" y="130" width="8" height="270"/><rect x="572" y="130" width="8" height="270"/><rect x="600" y="130" width="8" height="270"/><rect x="932" y="130" width="8" height="270"/></g>
  <use href="#awning" transform="translate(40 110)" opacity=".75"/>
  <use href="#awning" transform="translate(225 110)" opacity=".75"/>
  <use href="#awning" transform="translate(410 110)" opacity=".75"/>
  <use href="#awning" transform="translate(600 110) scale(2 1)"/>
  <!-- hand-painted board with a star -->
  <rect x="700" y="38" width="140" height="64" rx="8" fill="#e07a5f"/>
  <path d="M770 48 l9 18 l20 3 l-15 14 l4 20 l-18 -10 l-18 10 l4 -20 l-15 -14 l20 -3 z" fill="#f6f1e7"/>

  <!-- YOUR DATA: chosen ingredients and the worn recipe notebook -->
  <text x="836" y="190" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">YOUR DATA</text>
  <ellipse cx="890" cy="310" rx="64" ry="34" fill="#e0a33a" opacity=".25"/>
  <g transform="translate(22 0)">
    <ellipse cx="760" cy="326" rx="16" ry="6" fill="#fff"/><path d="M744 326 q16 12 32 0 z" fill="#fff"/><circle cx="756" cy="322" r="4" fill="#9a5a32"/><circle cx="764" cy="322" r="4" fill="#e0a33a"/>
    <ellipse cx="800" cy="326" rx="16" ry="6" fill="#fff"/><path d="M784 326 q16 12 32 0 z" fill="#fff"/><circle cx="796" cy="322" r="4" fill="#2e2a2a"/><circle cx="804" cy="321" r="4" fill="#7cb342"/>
    <circle cx="752" cy="300" r="10" fill="#e04b3a"/><circle cx="772" cy="296" r="10" fill="#e04b3a"/><path d="M750 290 l4 -4 M770 286 l4 -4" stroke="#5f9a54" stroke-width="3"/>
    <path d="M806 330 v-26 q0 -10 10 -10 h8 q10 0 10 10 v26 z" fill="#c9a24a"/><rect x="812" y="286" width="16" height="8" rx="2" fill="#b08a34"/>
    <path d="M840 334 l4 -48 h60 l-4 48 z" fill="#7a4e7e"/><path d="M846 334 l4 -48" stroke="#5c3a60" stroke-width="3"/>
    <g fill="#e0a33a"><rect x="864" y="280" width="6" height="12"/><rect x="876" y="280" width="6" height="10"/><rect x="888" y="280" width="6" height="14"/></g>
  </g>

  <!-- SAME MODEL: bracket linking every stove -->
  <path d="M125 482 v12 H650 v-12 M290 482 v12 M495 482 v12" stroke="#2b2b2b" stroke-width="3" fill="none"/>
  <text x="400" y="540" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SAME MODEL</text>
  <path d="M400 510 v-10" stroke="#2b2b2b" stroke-width="3" marker-end="url(#ar)"/>

  <!-- long queue at the famous dhaba -->
  <use href="#man" transform="translate(880 620) scale(.85)" color="#7a4e7e"/>
  <use href="#man" transform="translate(800 624) scale(.85)" color="#e0a33a"/>
  <use href="#man" transform="translate(720 628) scale(.85)" color="#e07a5f"/>
  <g fill="#cbbfa9"><circle cx="660" cy="600" r="6"/><circle cx="636" cy="604" r="6"/><circle cx="612" cy="608" r="6"/></g>

  <!-- inset: tasting and writing at night -->
  <rect x="30" y="498" width="210" height="126" rx="14" fill="#2f3a4a"/>
  <circle cx="210" cy="524" r="12" fill="#f3e2b8"/><circle cx="216" cy="520" r="11" fill="#2f3a4a"/>
  <g transform="translate(100 618) scale(.6)">
    <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#1f6f78"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -12 -42 0 z" fill="#e07a5f"/>
    <path d="M-19 -146 q0 26 19 30 q19 -4 19 -30 q-4 14 -19 14 q-15 0 -19 -14 z" fill="#2e2a2a"/>
    <path d="M-24 -100 q-26 -10 -24 -40 l12 -4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M24 -100 q30 20 60 26" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="140" y="560" width="70" height="50" rx="4" fill="#fff"/>
  <path d="M150 574 h50 M150 586 h38 M150 598 h44" stroke="#b9ad98" stroke-width="3"/>
  <path d="M170 600 l26 -30" stroke="#e0a33a" stroke-width="3"/>
</svg>
