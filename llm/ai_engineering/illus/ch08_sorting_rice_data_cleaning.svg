<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Sorting rice on three plates: remove junk, remove what may not be served, keep only the best grains</title>
  <defs>
    <g id="plate">
      <ellipse cx="0" cy="6" rx="96" ry="30" fill="#000" opacity=".08"/>
      <ellipse cx="0" cy="0" rx="92" ry="28" fill="#b9c3c6"/>
      <ellipse cx="0" cy="-2" rx="78" ry="21" fill="#d8dee0"/>
    </g>
    <g id="heap">
      <ellipse cx="0" cy="-6" rx="56" ry="13" fill="#f4efe4"/>
      <g fill="#fffdf6"><ellipse cx="-30" cy="-8" rx="5" ry="2"/><ellipse cx="-14" cy="-12" rx="5" ry="2" transform="rotate(30 -14 -12)"/><ellipse cx="4" cy="-6" rx="5" ry="2"/><ellipse cx="20" cy="-11" rx="5" ry="2" transform="rotate(-30 20 -11)"/><ellipse cx="34" cy="-5" rx="5" ry="2"/><ellipse cx="-4" cy="-14" rx="5" ry="2"/></g>
    </g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="330" width="960" height="310" fill="#eadfca"/>
  <!-- morning sun streaks -->
  <g fill="#fff" opacity=".35"><path d="M160 0 h70 l170 640 h-70 z"/><path d="M300 0 h40 l170 640 h-40 z"/></g>
  <!-- courtyard wall: window with morning sun, shelf, tulsi pot -->
  <rect x="380" y="60" width="200" height="190" rx="8" fill="#8a6d5a"/>
  <rect x="392" y="72" width="176" height="166" fill="#f9e7b8"/>
  <circle cx="480" cy="150" r="36" fill="#e0a33a" opacity=".8"/>
  <g stroke="#6b5446" stroke-width="5"><line x1="436" y1="72" x2="436" y2="238"/><line x1="480" y1="72" x2="480" y2="238"/><line x1="524" y1="72" x2="524" y2="238"/><line x1="392" y1="155" x2="568" y2="155"/></g>
  <rect x="680" y="200" width="220" height="10" fill="#8a6d5a"/>
  <g fill="#b9c3c6"><rect x="700" y="160" width="40" height="40" rx="6"/><rect x="750" y="150" width="44" height="50" rx="6"/><rect x="804" y="166" width="34" height="34" rx="6"/></g>
  <g fill="#9aa5a8"><rect x="698" y="154" width="44" height="8" rx="3"/><rect x="748" y="144" width="48" height="8" rx="3"/><rect x="802" y="160" width="38" height="8" rx="3"/></g>
  <g transform="translate(160 -10)">
  <path d="M60 330 l10 -60 h80 l10 60 z" fill="#c4744f"/><rect x="64" y="262" width="92" height="12" rx="4" fill="#a85f3e"/>
  <g fill="#5f9a54"><ellipse cx="96" cy="236" rx="12" ry="22" transform="rotate(-20 96 236)"/><ellipse cx="124" cy="232" rx="12" ry="24" transform="rotate(20 124 232)"/><ellipse cx="110" cy="220" rx="11" ry="26"/></g>
  </g>
  <!-- woven mat -->
  <rect x="24" y="452" width="200" height="90" rx="6" fill="#d9b382"/>
  <g stroke="#c49a63" stroke-width="3"><line x1="24" y1="470" x2="224" y2="470"/><line x1="24" y1="488" x2="224" y2="488"/><line x1="24" y1="506" x2="224" y2="506"/><line x1="24" y1="524" x2="224" y2="524"/></g>

  <!-- the woman seated cross-legged -->
  <path d="M56 496 q70 -40 150 0 q-10 22 -75 22 q-65 0 -75 -22 z" fill="#7a4e7e"/>
  <path d="M92 400 a38 34 0 0 1 76 0 l12 96 h-100 z" fill="#7a4e7e"/>
  <path d="M100 372 q50 30 74 124" stroke="#e0a33a" stroke-width="10" fill="none"/>
  <rect x="122" y="350" width="16" height="14" fill="#c98a5e"/>
  <circle cx="130" cy="330" r="24" fill="#c98a5e"/>
  <path d="M106 328 a24 24 0 0 1 48 0 q-24 -12 -48 0 z" fill="#5a5450"/>
  <circle cx="108" cy="318" r="11" fill="#5a5450"/>
  <path d="M136 340 q8 4 12 -2" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M164 400 q50 20 80 52" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M100 410 q-10 40 30 70" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>

  <!-- labels -->
  <text x="300" y="384" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">REMOVE JUNK</text>
  <text x="530" y="384" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">REMOVE PII</text>
  <text x="750" y="384" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">FILTER</text>

  <!-- plate 1: stones, husk, straw out to the waste bowl -->
  <use href="#plate" transform="translate(300 470)"/>
  <use href="#heap" transform="translate(300 470)"/>
  <g fill="#6b6b6b"><circle cx="280" cy="462" r="5"/><circle cx="318" cy="458" r="4"/></g>
  <path d="M296 470 l18 -6 M330 466 l14 2" stroke="#c49a63" stroke-width="3" stroke-linecap="round"/>
  <path d="M270 476 l30 -4" stroke="#e0c27a" stroke-width="2"/>
  <path d="M300 450 Q270 420 250 446" fill="none"/>
  <path d="M320 500 Q330 540 316 560" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#a2)"/>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  <path d="M276 570 q30 30 60 0 z" fill="#8a6d5a"/><ellipse cx="306" cy="570" rx="30" ry="7" fill="#6b5446"/>
  <g fill="#6b6b6b"><circle cx="298" cy="569" r="4"/><circle cx="312" cy="571" r="3"/></g>
  <!-- sparrow pecking at husk -->
  <g transform="translate(220 600)">
    <ellipse cx="0" cy="0" rx="18" ry="11" fill="#8a6d5a"/><circle cx="14" cy="-10" r="8" fill="#8a6d5a"/>
    <path d="M21 -10 l8 3 l-8 2 z" fill="#e0a33a"/><circle cx="16" cy="-12" r="1.8" fill="#2b2b2b"/>
    <path d="M-16 -2 l-14 -6 l2 10 z" fill="#6b5446"/><path d="M-4 -4 q8 -6 14 2" stroke="#c4a07e" stroke-width="3" fill="none"/>
    <path d="M-2 10 v8 M4 10 v8" stroke="#e0a33a" stroke-width="2"/>
  </g>
  <path d="M248 612 l10 -2" stroke="#c49a63" stroke-width="3" stroke-linecap="round"/>

  <!-- plate 2: odd grains go into the covered tin -->
  <use href="#plate" transform="translate(530 470)"/>
  <use href="#heap" transform="translate(530 470)"/>
  <g fill="#c4954a"><ellipse cx="512" cy="460" rx="5" ry="2.5"/><ellipse cx="546" cy="464" rx="5" ry="2.5"/></g>
  <ellipse cx="528" cy="456" rx="5" ry="2.5" fill="#8a6d5a"/>
  <path d="M520 420 l8 0 l6 6 v8 l-6 6 h-8 l-6 -6 v-8 z" fill="#e04b3a" transform="translate(30 4)"/>
  <rect x="548" y="433" width="12" height="3" fill="#fff"/>
  <path d="M548 500 Q560 540 548 556" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#a2)"/>
  <rect x="510" y="566" width="64" height="44" rx="6" fill="#9aa5a8"/>
  <rect x="504" y="556" width="76" height="14" rx="5" fill="#7c878b"/>
  <rect x="534" y="548" width="16" height="10" rx="3" fill="#7c878b"/>
  <path d="M532 580 l6 0 l4 4 v6 l-4 4 h-6 l-4 -4 v-6 z" fill="#e04b3a"/>

  <!-- plate 3: only the best grains to the pot; surplus to the sack -->
  <use href="#plate" transform="translate(750 470)"/>
  <ellipse cx="736" cy="466" rx="40" ry="10" fill="#fffdf6"/>
  <g fill="#fff" stroke="#e5ddcc" stroke-width="1"><ellipse cx="722" cy="464" rx="8" ry="2.5"/><ellipse cx="740" cy="462" rx="8" ry="2.5"/><ellipse cx="756" cy="467" rx="8" ry="2.5"/><ellipse cx="732" cy="470" rx="8" ry="2.5"/></g>
  <path d="M780 456 l50 -4" stroke="#1f6f78" stroke-width="5" marker-end="url(#ar)"/>
  <path d="M740 500 Q740 540 700 560" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#ar)"/>
  <path d="M640 620 q-10 -40 10 -64 h56 q18 24 8 64 z" fill="#efe6d2" stroke="#b9ad98" stroke-width="3"/>
  <path d="M652 556 q26 -12 54 0" stroke="#b9ad98" stroke-width="5" fill="none"/>
  <ellipse cx="678" cy="560" rx="22" ry="5" fill="#f4efe4"/>
  <!-- cooking pot, nearly full -->
  <path d="M846 420 h100 v74 q0 26 -26 26 h-48 q-26 0 -26 -26 z" fill="#9aa5a8"/>
  <ellipse cx="896" cy="420" rx="54" ry="12" fill="#7c878b"/>
  <ellipse cx="896" cy="424" rx="46" ry="8" fill="#fffdf6"/>
  <path d="M842 440 h-12 M950 440 h12" stroke="#7c878b" stroke-width="7" stroke-linecap="round"/>
</svg>
