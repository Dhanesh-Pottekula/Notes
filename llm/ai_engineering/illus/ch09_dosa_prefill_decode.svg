<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Prefill does all the order prep at once; decode walks to the tawa for one dosa at a time</title>
  <defs>
    <g id="cook">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#b07850"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#b07850"/>
      <path d="M-22 -66 h44 l4 40 h-52 z" fill="#d9534f"/>
      <path d="M-22 -54 h46 M-24 -40 h48 M-8 -66 v40 M8 -66 v40" stroke="#f6f1e7" stroke-width="3" opacity=".7"/>
      <path d="M-24 -64 v-40 a24 24 0 0 1 48 0 v40 z" fill="#ffffff"/>
      <path d="M8 -128 q16 10 16 40 h-8 q0 -26 -14 -34 z" fill="#e0a33a"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="dosa"><path d="M-30 0 q30 -16 60 0 q-30 8 -60 0 z" fill="#e0a33a"/></g>
    <g id="plate"><ellipse cx="0" cy="0" rx="30" ry="8" fill="#e8eef0" stroke="#b9c3c6" stroke-width="2"/></g>
    <g id="foot"><ellipse cx="0" cy="0" rx="4" ry="7" fill="#cbbfa9"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="24" x2="480" y2="616" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: PREFILL, everything at once -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PREFILL</text>
  <!-- the long order slip -->
  <rect x="190" y="92" width="100" height="150" rx="3" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <circle cx="240" cy="98" r="6" fill="#e07a5f"/>
  <path d="M202 116 h76 M202 130 h60 M202 144 h70 M202 158 h52 M202 172 h76 M202 186 h64 M202 200 h72 M202 214 h56 M202 228 h68" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <path d="M220 250 l-6 22 M260 250 l6 22" stroke="#e07a5f" stroke-width="2" stroke-dasharray="3 4"/>
  <!-- burst -->
  <g stroke="#e0a33a" stroke-width="4" stroke-linecap="round"><line x1="150" y1="300" x2="136" y2="286"/><line x1="330" y1="300" x2="344" y2="286"/><line x1="122" y1="450" x2="104" y2="450"/><line x1="358" y1="450" x2="376" y2="450"/></g>
  <use href="#cook" transform="translate(240 590) scale(1.3)"/>
  <path d="M232 405 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- many arms -->
  <g stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M214 460 Q160 420 120 372"/>
    <path d="M266 460 Q320 420 360 372"/>
    <path d="M214 470 Q150 480 112 520"/>
    <path d="M266 470 Q330 480 368 520"/>
  </g>
  <!-- onions on a board -->
  <rect x="50" y="356" width="100" height="40" rx="6" fill="#d9b382"/>
  <g fill="#b0607e"><circle cx="76" cy="372" r="11"/><path d="M98 384 h14 M100 376 h12 M118 380 h10" stroke="#b0607e" stroke-width="5"/></g>
  <path d="M120 372 l20 -24" stroke="#9aa5a8" stroke-width="5" stroke-linecap="round"/>
  <!-- potato masala pan -->
  <path d="M330 380 q40 30 80 0 z" fill="#3d3a3a"/><ellipse cx="370" cy="380" rx="40" ry="8" fill="#e0b84a"/>
  <path d="M410 378 h40" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M360 372 l-6 -26" stroke="#8a6d5a" stroke-width="5" stroke-linecap="round"/>
  <!-- batter bowls -->
  <path d="M50 520 q40 40 80 0 z" fill="#b9c3c6"/><ellipse cx="90" cy="520" rx="40" ry="9" fill="#f3e2b8"/>
  <path d="M110 516 l14 -34" stroke="#8a6d5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 580 q26 26 52 0 z" fill="#b9c3c6"/><ellipse cx="66" cy="580" rx="26" ry="6" fill="#f3e2b8"/>
  <!-- chutney grinder -->
  <path d="M350 600 l8 -64 h44 l8 64 z" fill="#e8eef0" stroke="#b9c3c6" stroke-width="2"/>
  <path d="M360 590 l4 -40 h32 l4 40 z" fill="#8bc34a" opacity=".85"/>
  <rect x="352" y="526" width="56" height="12" rx="4" fill="#3d3a3a"/>
  <path d="M368 520 l4 -4" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>

  <!-- RIGHT: DECODE, one dosa per trip -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">DECODE</text>
  <!-- big tawa at the back -->
  <rect x="826" y="196" width="10" height="44" fill="#6b5446"/><rect x="884" y="196" width="10" height="44" fill="#6b5446"/>
  <rect x="806" y="230" width="108" height="12" rx="4" fill="#6b5446"/>
  <ellipse cx="860" cy="190" rx="76" ry="20" fill="#2b2b2b"/>
  <ellipse cx="860" cy="186" rx="62" ry="12" fill="#4a4646"/>
  <use href="#dosa" transform="translate(860 186)"/>
  <path d="M846 160 q-6 -12 0 -24 M872 160 q6 -12 0 -24" stroke="#cbbfa9" stroke-width="3" fill="none"/>
  <!-- the walking path, there and back -->
  <path d="M530 520 V250 Q530 214 566 214 H786" stroke="#b9ad98" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
  <path d="M560 520 V262 Q560 240 584 240 H790" stroke="#b9ad98" stroke-width="3" fill="none" stroke-dasharray="2 9" stroke-linecap="round"/>
  <use href="#foot" transform="translate(526 330)"/><use href="#foot" transform="translate(536 300)"/><use href="#foot" transform="translate(526 270)"/>
  <use href="#foot" transform="translate(620 210) rotate(90)"/><use href="#foot" transform="translate(660 220) rotate(90)"/><use href="#foot" transform="translate(700 210) rotate(90)"/><use href="#foot" transform="translate(740 220) rotate(90)"/>
  <use href="#foot" transform="translate(704 244) rotate(-90)"/><use href="#foot" transform="translate(664 236) rotate(-90)"/>
  <text x="680" y="288" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">MEMORY TRIPS</text>
  <!-- the cook walking with one plate -->
  <use href="#cook" transform="translate(545 470) scale(.85)"/>
  <path d="M563 404 q18 6 26 -8" stroke="#c98a5e" stroke-width="9" stroke-linecap="round" fill="none"/>
  <use href="#plate" transform="translate(596 394) scale(.8)"/>
  <use href="#dosa" transform="translate(596 390) scale(.6)"/>
  <!-- inset: glancing at a ledger card, not re-reading the slip -->
  <rect x="808" y="300" width="128" height="120" rx="12" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <rect x="832" y="318" width="64" height="80" rx="4" fill="#f3e2b8"/>
  <path d="M842 336 h44 M842 350 h44 M842 364 h30" stroke="#8a6d5a" stroke-width="3"/>
  <circle cx="912" cy="388" r="10" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M919 395 l8 8" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>
  <!-- serving counter with waiting plates -->
  <rect x="610" y="540" width="330" height="100" fill="#8a6d5a"/>
  <rect x="610" y="540" width="330" height="12" fill="#6b5446"/>
  <use href="#plate" transform="translate(760 534)"/><use href="#plate" transform="translate(830 534)"/><use href="#plate" transform="translate(900 534)"/>
  <g font-size="20" font-weight="800" fill="#2b2b2b" text-anchor="middle"><text x="760" y="516">2</text><text x="830" y="516">3</text><text x="900" y="516">4</text></g>
  <!-- the one customer who got dosa 1 -->
  <use href="#man" transform="translate(680 630) scale(.95)" color="#1f6f78"/>
  <path d="M658 522 q-6 20 10 26 M706 522 q6 20 -10 26" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/>
  <use href="#plate" transform="translate(682 550)"/>
  <use href="#dosa" transform="translate(682 546) scale(.8)"/>
  <text x="634" y="560" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">1</text>
</svg>
