<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Memory hierarchy as a kitchen: spice box at hand, fridge a few steps away, the shop down the street</title>
  <defs>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="currentColor"/>
      <path d="M-18 -100 h36 l4 60 h-44 z" fill="#f4efe4"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
      <circle cx="-4" cy="-174" r="9" fill="#2e2a2a"/>
    </g>
    <g id="tiny"><rect x="-6" y="-20" width="5" height="20" rx="2" fill="#4a3f55"/><rect x="1" y="-20" width="5" height="20" rx="2" fill="#4a3f55"/><path d="M-9 -20 v-14 a9 9 0 0 1 18 0 v14 z" fill="currentColor"/><circle cx="0" cy="-48" r="7" fill="#c98a5e"/></g>
    <g id="foot"><ellipse cx="0" cy="0" rx="5" ry="8" fill="#b9ad98"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="470" width="960" height="170" fill="#e5dcc9"/>

  <!-- window to the street -->
  <rect x="548" y="80" width="392" height="340" rx="8" fill="#8a6d5a"/>
  <rect x="562" y="94" width="364" height="312" fill="#dbe9ea"/>
  <path d="M562 330 L926 250 V406 H562 z" fill="#d8cdb8"/>
  <path d="M600 406 L870 262 L900 262 L700 406 z" fill="#c9bba3"/>
  <!-- kirana shop in the distance -->
  <rect x="846" y="214" width="66" height="48" fill="#efe6d2"/>
  <path d="M840 214 h78 l-6 -16 h-66 z" fill="#e07a5f"/>
  <g fill="#c49a63"><rect x="852" y="240" width="14" height="22" rx="4"/><rect x="868" y="244" width="12" height="18" rx="4"/></g>
  <g fill="#1f6f78" opacity=".7"><rect x="884" y="222" width="22" height="6"/><rect x="884" y="234" width="22" height="6"/></g>
  <use href="#tiny" transform="translate(896 262) scale(.6)" color="#e0a33a"/>
  <path d="M900 228 l6 -10" stroke="#c98a5e" stroke-width="3" stroke-linecap="round"/>
  <!-- the long tired walk -->
  <path d="M640 400 Q760 330 862 266" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="4 8"/>
  <use href="#tiny" transform="translate(744 352) rotate(8)" color="#7a4e7e"/>
  <path d="M736 316 q-4 -6 0 -10" stroke="#7fb0b8" stroke-width="2" fill="none"/>
  <g stroke="#2e2a2a" stroke-width="3"><line x1="562" y1="250" x2="926" y2="250"/><line x1="744" y1="94" x2="744" y2="406"/></g>

  <!-- kitchen counter, stove, kadai, masala dabba -->
  <rect x="150" y="390" width="240" height="80" fill="#8a6d5a"/>
  <rect x="150" y="384" width="240" height="12" fill="#6b5446"/>
  <rect x="176" y="366" width="96" height="20" rx="4" fill="#3d3a3a"/>
  <path d="M206 366 q8 -18 14 -4 q6 -16 12 0 q6 -12 10 4 z" fill="#e0a33a"/>
  <path d="M180 346 q44 34 88 0 z" fill="#3d3a3a"/><ellipse cx="224" cy="346" rx="44" ry="8" fill="#e0a33a"/>
  <path d="M266 344 h22" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="330" cy="378" rx="44" ry="12" fill="#9aa5a8"/>
  <ellipse cx="330" cy="372" rx="44" ry="12" fill="#cfd4d6"/>
  <g><circle cx="330" cy="372" r="6" fill="#e0a33a"/><circle cx="310" cy="368" r="5.5" fill="#c0392b"/><circle cx="350" cy="368" r="5.5" fill="#f3e2b8"/><circle cx="314" cy="378" r="5.5" fill="#6b5446"/><circle cx="346" cy="378" r="5.5" fill="#7cb342"/><circle cx="330" cy="364" r="5" fill="#e07a5f"/><circle cx="330" cy="381" r="5" fill="#2e2a2a"/></g>
  <!-- the cook stirring, dabba within reach -->
  <use href="#woman" transform="translate(110 470) scale(1.25)" color="#1f6f78"/>
  <path d="M106 296 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round" transform="translate(4 0)"/>
  <path d="M134 346 q30 -10 60 -20" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M194 326 l30 16" stroke="#8a6d5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M136 360 q20 20 40 10" stroke="#c98a5e" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M290 340 q20 -20 30 4" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="3 4"/>

  <!-- the fridge, door open -->
  <rect x="404" y="226" width="104" height="244" rx="8" fill="#e8eef0"/>
  <rect x="412" y="234" width="88" height="226" rx="4" fill="#fff"/>
  <g fill="#cfd4d6"><rect x="412" y="300" width="88" height="5"/><rect x="412" y="362" width="88" height="5"/><rect x="412" y="420" width="88" height="5"/></g>
  <rect x="424" y="262" width="18" height="38" rx="4" fill="#fff" stroke="#b9c3c6" stroke-width="2"/>
  <circle cx="462" cy="286" r="12" fill="#e04b3a"/><circle cx="484" cy="290" r="9" fill="#7cb342"/>
  <path d="M424 360 q10 -26 30 -10 q14 -20 30 4 z" fill="#5f9a54"/>
  <rect x="440" y="384" width="40" height="36" rx="4" fill="#e0a33a"/>
  <path d="M424 458 h70" stroke="#c49a63" stroke-width="10" stroke-linecap="round"/>
  <path d="M404 226 l-40 18 v210 l40 16 z" fill="#cfd4d6"/>
  <rect x="372" y="300" width="6" height="40" rx="3" fill="#9aa5a8"/>

  <!-- labels -->
  <text x="330" y="524" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SRAM</text>
  <text x="456" y="524" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" dx="10">HBM</text>
  <text x="744" y="524" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">CPU DRAM</text>

  <!-- distance markers -->
  <g transform="translate(330 574)">
    <path d="M-12 14 v-22 a4 4 0 0 1 8 0 v-8 a4 4 0 0 1 8 0 v6 a4 4 0 0 1 8 0 v6 a4 4 0 0 1 8 0 v14 q0 14 -14 14 h-6 q-12 0 -12 -10 z" fill="#c98a5e"/>
  </g>
  <g><use href="#foot" transform="translate(448 572) rotate(80)"/><use href="#foot" transform="translate(470 584) rotate(80)"/><use href="#foot" transform="translate(492 572) rotate(80)"/></g>
  <path d="M590 580 H910" stroke="#7a4e7e" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M590 568 v24 M910 568 v24" stroke="#7a4e7e" stroke-width="4"/>
  <g fill="#b9ad98"><use href="#foot" transform="translate(640 600) rotate(80)"/><use href="#foot" transform="translate(700 600) rotate(80)"/><use href="#foot" transform="translate(760 600) rotate(80)"/><use href="#foot" transform="translate(820 600) rotate(80)"/><use href="#foot" transform="translate(880 600) rotate(80)"/></g>
</svg>
