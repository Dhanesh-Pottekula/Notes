<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Share autos at a metro exit: wait until full, leave after two minutes, or swap passengers on the move</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="drv"><path d="M-11 26 v-10 a11 9 0 0 1 22 0 v10 z" fill="#c9a96e"/><circle cx="0" cy="0" r="10" fill="#b07850"/><path d="M-10 -2 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="500" width="960" height="70" fill="#d8cdb8"/>
  <path d="M0 536 h960" stroke="#f6f1e7" stroke-width="4" stroke-dasharray="30 24"/>
  <!-- elevated metro over panels 1 and 2 -->
  <rect x="0" y="120" width="636" height="30" fill="#cbbfa9"/>
  <rect x="0" y="150" width="636" height="8" fill="#b9ad98"/>
  <g fill="#d8cdb8"><rect x="30" y="158" width="40" height="342"/><rect x="560" y="158" width="40" height="342"/></g>
  <path d="M220 500 l70 -150 h20 l-70 150 z" fill="#cbbfa9"/>
  <g stroke="#b9ad98" stroke-width="3"><line x1="232" y1="474" x2="252" y2="474"/><line x1="246" y1="444" x2="266" y2="444"/><line x1="260" y1="414" x2="280" y2="414"/><line x1="274" y1="384" x2="294" y2="384"/></g>
  <!-- trees along the road in panel 3 -->
  <g><rect x="680" y="300" width="10" height="200" fill="#8a6d5a"/><circle cx="685" cy="280" r="46" fill="#7aa86a"/><rect x="900" y="320" width="10" height="180" fill="#8a6d5a"/><circle cx="905" cy="300" r="40" fill="#7aa86a"/></g>

  <!-- panel gaps -->
  <rect x="317" y="0" width="6" height="640" fill="#ffffff"/>
  <rect x="637" y="0" width="6" height="640" fill="#ffffff"/>

  <text x="160" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">STATIC</text>
  <text x="480" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">DYNAMIC</text>
  <text x="800" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">CONTINUOUS</text>

  <!-- autos -->
<g transform="translate(170 500)">
  <ellipse cx="0" cy="18" rx="112" ry="7" fill="#000" opacity=".08"/>
  <path d="M-112 -4 q0 -36 40 -60 h170 v60 q0 8 -8 8 h-194 q-8 0 -8 -8 z" fill="#3f8f4f"/>
  <path d="M-86 -64 q10 -56 60 -62 h102 q20 0 22 18 l4 44 z" fill="#2b2b2b"/><path d="M-84 -66 q10 -52 58 -58 h100 q18 0 20 16 l2 10 h-190 z" fill="#e0b23a"/>
  <rect x="-78" y="-108" width="164" height="44" rx="6" fill="#f6f1e7" opacity=".85"/>
  <rect x="-38" y="-108" width="8" height="44" fill="#e0b23a"/>
  <path d="M-27 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#7a4e7e"/><circle cx="-16" cy="-92" r="10" fill="#c98a5e"/><path d="M-26 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M-5 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#1f6f78"/><circle cx="6" cy="-92" r="10" fill="#b07850"/><path d="M-4 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <circle cx="28" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="17" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="39" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="72" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="61" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="-70" cy="4" r="18" fill="#3d3a3a"/><circle cx="-70" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="64" cy="4" r="18" fill="#3d3a3a"/><circle cx="64" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="-104" cy="-40" r="6" fill="#f3e2b8"/>
  </g>

<g transform="translate(470 500)">
  <ellipse cx="0" cy="18" rx="112" ry="7" fill="#000" opacity=".08"/>
  <path d="M118 -60 h40 M126 -40 h30 M118 -20 h44" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <path d="M-112 -4 q0 -36 40 -60 h170 v60 q0 8 -8 8 h-194 q-8 0 -8 -8 z" fill="#3f8f4f"/>
  <path d="M-86 -64 q10 -56 60 -62 h102 q20 0 22 18 l4 44 z" fill="#2b2b2b"/><path d="M-84 -66 q10 -52 58 -58 h100 q18 0 20 16 l2 10 h-190 z" fill="#e0b23a"/>
  <rect x="-78" y="-108" width="164" height="44" rx="6" fill="#f6f1e7" opacity=".85"/>
  <rect x="-38" y="-108" width="8" height="44" fill="#e0b23a"/>
  <path d="M-27 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#7a4e7e"/><circle cx="-16" cy="-92" r="10" fill="#c98a5e"/><path d="M-26 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M-5 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#1f6f78"/><circle cx="6" cy="-92" r="10" fill="#b07850"/><path d="M-4 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <circle cx="28" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="17" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="50" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="39" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="72" cy="-92" r="11" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/><rect x="61" y="-78" width="22" height="12" rx="4" fill="none" stroke="#e07a5f" stroke-width="2.5" stroke-dasharray="3 3"/>
  <circle cx="-70" cy="4" r="18" fill="#3d3a3a"/><circle cx="-70" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="64" cy="4" r="18" fill="#3d3a3a"/><circle cx="64" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="-104" cy="-40" r="6" fill="#f3e2b8"/>
  </g>

<g transform="translate(778 500)">
  <ellipse cx="0" cy="18" rx="112" ry="7" fill="#000" opacity=".08"/>
  <path d="M118 -60 h40 M126 -40 h30 M118 -20 h44" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <path d="M-112 -4 q0 -36 40 -60 h170 v60 q0 8 -8 8 h-194 q-8 0 -8 -8 z" fill="#3f8f4f"/>
  <path d="M-86 -64 q10 -56 60 -62 h102 q20 0 22 18 l4 44 z" fill="#2b2b2b"/><path d="M-84 -66 q10 -52 58 -58 h100 q18 0 20 16 l2 10 h-190 z" fill="#e0b23a"/>
  <rect x="-78" y="-108" width="164" height="44" rx="6" fill="#f6f1e7" opacity=".85"/>
  <rect x="-38" y="-108" width="8" height="44" fill="#e0b23a"/>
  <path d="M-27 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#7a4e7e"/><circle cx="-16" cy="-92" r="10" fill="#c98a5e"/><path d="M-26 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M-5 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#1f6f78"/><circle cx="6" cy="-92" r="10" fill="#b07850"/><path d="M-4 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M17 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#e07a5f"/><circle cx="28" cy="-92" r="10" fill="#d9a27a"/><path d="M18 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M39 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#e0a33a"/><circle cx="50" cy="-92" r="10" fill="#c98a5e"/><path d="M40 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <path d="M61 -66 v-10 a11 9 0 0 1 22 0 v10 z" fill="#4a3f55"/><circle cx="72" cy="-92" r="10" fill="#b07850"/><path d="M62 -94 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
  <circle cx="-70" cy="4" r="18" fill="#3d3a3a"/><circle cx="-70" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="64" cy="4" r="18" fill="#3d3a3a"/><circle cx="64" cy="4" r="7" fill="#b9ad98"/>
  <circle cx="-104" cy="-40" r="6" fill="#f3e2b8"/>
  </g>


  <!-- P1: driver waves for more; passengers check watches -->
  <use href="#drv" transform="translate(110 408)"/>
  <path d="M100 430 q-26 -6 -36 -40" stroke="#b07850" stroke-width="7" stroke-linecap="round" fill="none"/>
  <circle cx="63" cy="386" r="6" fill="#b07850"/>
  <path d="M58 370 q-8 -8 -2 -16 M70 368 q4 -10 12 -10" stroke="#b9ad98" stroke-width="2.5" fill="none"/>
  <circle cx="160" cy="432" r="5" fill="#fff" stroke="#3d3a3a" stroke-width="2"/>
  <circle cx="142" cy="300" r="22" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <path d="M142 300 v-12 M142 300 l9 5" stroke="#e07a5f" stroke-width="3" stroke-linecap="round"/>
  <path d="M150 324 l-4 64" stroke="#e07a5f" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- P2: two minutes up, leaves half full -->
  <use href="#drv" transform="translate(410 408)"/>
  <path d="M398 428 l-14 -12 l-4 -12 M422 428 l14 -12 l4 -12" stroke="#b07850" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="480" cy="250" r="50" fill="#fff" stroke="#1f6f78" stroke-width="5"/>
  <rect x="470" y="190" width="20" height="12" rx="3" fill="#1f6f78"/>
  <path d="M480 250 L480 206 A44 44 0 0 1 495 209 Z" fill="#e0a33a" opacity=".6"/>
  <path d="M480 250 l14 -40" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <text x="480" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#1f6f78">2:00</text>

  <!-- P3: one passenger steps out at the stop, a new one steps in -->
  <rect x="902" y="350" width="6" height="150" fill="#6b5446"/>
  <rect x="818" y="320" width="130" height="34" rx="4" fill="#1f6f78"/>
  <text x="883" y="343" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">Indiranagar</text>
  <use href="#drv" transform="translate(718 408)"/>
  <use href="#man" transform="translate(930 560) scale(.6)" color="#e07a5f"/>
  <path d="M922 470 l20 -2" stroke="#b9ad98" stroke-width="3"/>
  <use href="#man" transform="translate(866 566) scale(.6)" color="#1f6f78"/>
  <rect x="846" y="508" width="26" height="20" rx="3" fill="#6b5446"/>
  <path d="M884 520 q16 -20 0 -40" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="3 4" marker-end="url(#ar)"/>
  <path d="M906 486 q12 -6 10 16" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="3 4"/>

  <!-- connecting arrow -->
  <path d="M40 604 H916" stroke="#1f6f78" stroke-width="5" stroke-linecap="round" marker-end="url(#ar)"/>
</svg>
