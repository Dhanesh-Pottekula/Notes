<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A chai stall serves plain chai from a ready kettle, makes special orders fresh, and never reuses a named cup</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="glass"><path d="M-9 0 l-2 -26 h22 l-2 26 z" fill="#fff" opacity=".9"/><path d="M-8 -2 l-2 -16 h20 l-2 16 z" fill="#c4874a"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- station arch behind -->
  <path d="M20 330 V120 q140 -90 280 0 V330" fill="#ece3d1"/>
  <path d="M660 330 V140 q140 -90 280 0 V330" fill="#ece3d1"/>
  <rect x="0" y="520" width="960" height="120" fill="#e5dcc9"/>

  <!-- labels -->
  <text x="230" y="92" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CACHE HIT</text>
  <text x="704" y="176" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CACHE MISS</text>
  <!-- clock: time passing, expiry -->
  <circle cx="230" cy="150" r="26" fill="#fff" stroke="#7a4e7e" stroke-width="4"/>
  <path d="M230 150 v-16 M230 150 l12 6" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M262 132 a36 36 0 0 1 4 32" stroke="#7a4e7e" stroke-width="3" fill="none"/>

  <!-- vendor behind the counter -->
  <use href="#man" transform="translate(480 500) scale(1.45)" color="#7a4e7e"/>
  <g stroke="#f6f1e7" stroke-width="3" opacity=".5"><path d="M456 360 h48 M456 378 h48 M470 344 v56 M490 344 v56"/></g>
  <path d="M446 334 q34 20 68 0" stroke="#fff" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M470 294 q10 6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M446 352 q-60 -6 -110 -44" stroke="#c98a5e" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M514 352 q90 10 150 -4" stroke="#c98a5e" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- counter -->
  <rect x="110" y="400" width="720" height="130" fill="#8a6d5a"/>
  <rect x="110" y="400" width="720" height="12" fill="#6b5446"/>

  <!-- the big kettle on a low flame -->
  <rect x="170" y="384" width="120" height="18" rx="4" fill="#3d3a3a"/>
  <path d="M206 384 q6 -12 10 0 q6 -12 10 0 q6 -12 10 0 q6 -12 10 0" fill="#7fb0d6"/>
  <path d="M164 380 q-14 -110 66 -120 q80 10 66 120 z" fill="#b9c3c6"/>
  <ellipse cx="230" cy="262" rx="40" ry="10" fill="#9aa5a8"/>
  <rect x="222" y="244" width="16" height="10" rx="3" fill="#7c878b"/>
  <path d="M190 268 q40 -60 80 0" stroke="#7c878b" stroke-width="7" fill="none"/>
  <path d="M290 330 q30 -6 44 -30 l8 6 q-12 30 -46 40 z" fill="#b9c3c6"/>
  <path d="M182 300 v60" stroke="#fff" stroke-width="6" opacity=".5" stroke-linecap="round"/>
  <path d="M340 304 q6 40 2 92" stroke="#c4874a" stroke-width="5" fill="none"/>
  <path d="M220 240 q-8 -16 0 -30 M244 238 q8 -16 0 -30" stroke="#cbbfa9" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- row of glasses going out fast -->
  <use href="#glass" transform="translate(342 400)"/><use href="#glass" transform="translate(372 400)"/><use href="#glass" transform="translate(402 400)"/>

  <!-- the fresh special-order pan -->
  <rect x="640" y="384" width="100" height="18" rx="4" fill="#3d3a3a"/>
  <path d="M664 384 q6 -12 10 0 q6 -12 10 0 q6 -12 10 0" fill="#7fb0d6"/>
  <path d="M648 350 q42 44 84 0 z" fill="#3d3a3a"/><ellipse cx="690" cy="350" rx="42" ry="9" fill="#c4874a"/>
  <path d="M732 348 h36" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <g fill="#6b5446"><circle cx="676" cy="349" r="3"/><circle cx="698" cy="351" r="3"/></g>
  <circle cx="686" cy="346" r="4" fill="#e9d7b6"/><circle cx="706" cy="346" r="3" fill="#e9d7b6"/>
  <path d="M680 336 q-6 -12 0 -24 M700 336 q6 -12 0 -24" stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- masala, sugar, oat milk -->
  <path d="M748 400 q14 14 28 0 z" fill="#fff"/><g fill="#9a5a32"><circle cx="756" cy="398" r="3"/><circle cx="766" cy="397" r="3"/></g>
  <path d="M784 400 q12 12 24 0 z" fill="#fff"/><ellipse cx="796" cy="400" rx="12" ry="3" fill="#fffdf6"/>
  <path d="M790 400 v-44 l8 -10 h16 l8 10 v44 z" fill="#e8f0ef"/><rect x="790" y="370" width="32" height="14" fill="#7cb342"/>

  <!-- office workers walk off with their glasses -->
  <use href="#man" transform="translate(70 620) scale(.9)" color="#1f6f78"/>
  <use href="#man" transform="translate(150 626) scale(.9)" color="#e0a33a"/>
  <path d="M90 520 q20 -10 22 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round" fill="none"/>
  <use href="#glass" transform="translate(114 492) scale(.8)"/>
  <path d="M170 526 q20 -10 22 -30" stroke="#b07850" stroke-width="10" stroke-linecap="round" fill="none"/>
  <use href="#glass" transform="translate(194 498) scale(.8)"/>
  <path d="M20 560 h24 M14 580 h30" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>

  <!-- young woman in gym clothes waits for the fresh order -->
  <g transform="translate(890 610)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-64" width="12" height="64" rx="5" fill="#2b2b2b"/><rect x="2" y="-64" width="12" height="64" rx="5" fill="#2b2b2b"/>
    <path d="M-22 -60 v-44 a22 22 0 0 1 44 0 v44 z" fill="#e07a5f"/>
    <path d="M-22 -104 a22 22 0 0 1 44 0" fill="#e07a5f"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -152 a21 21 0 0 1 42 0 q-21 -8 -42 0 z" fill="#2e2a2a"/>
    <path d="M14 -166 q20 0 18 30" stroke="#2e2a2a" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M-22 -100 q-10 30 4 46 M22 -100 q10 30 -4 46" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M-6 -142 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- shelf: the named cup is never reused -->
  <rect x="300" y="574" width="170" height="10" fill="#6b5446"/><rect x="312" y="584" width="8" height="40" fill="#6b5446"/><rect x="450" y="584" width="8" height="40" fill="#6b5446"/>
  <path d="M352 574 l-6 -52 h44 l-6 52 z" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M352 544 q6 -6 10 0 t10 0 t10 0" stroke="#7a4e7e" stroke-width="2.5" fill="none"/>
  <circle cx="416" cy="526" r="16" fill="#fff" stroke="#e04b3a" stroke-width="3"/>
  <path d="M409 519 l14 14 M423 519 l-14 14" stroke="#e04b3a" stroke-width="4" stroke-linecap="round"/>
  <text x="560" y="572" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DO NOT CACHE</text>
</svg>
