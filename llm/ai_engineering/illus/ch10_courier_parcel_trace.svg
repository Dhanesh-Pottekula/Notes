<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Metrics show 3% late, logs pile up as endless scans, a trace shows one parcel stuck at a hub for 2 days</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="box"><rect x="-16" y="-24" width="32" height="24" rx="2" fill="#c49a63"/><path d="M-16 -16 h32 M0 -24 v8" stroke="#a87f4c" stroke-width="2"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e5dcc9"/>
  <!-- conveyor belt in the background -->
  <rect x="0" y="232" width="960" height="14" fill="#9aa5a8"/>
  <g fill="#7c878b"><circle cx="40" cy="239" r="5"/><circle cx="200" cy="239" r="5"/><circle cx="360" cy="239" r="5"/><circle cx="520" cy="239" r="5"/><circle cx="680" cy="239" r="5"/></g>
  <use href="#box" transform="translate(330 232)"/><use href="#box" transform="translate(380 232) scale(.8)"/><use href="#box" transform="translate(600 232)"/>
  <g stroke="#e8dfcc" stroke-width="6"><line x1="320" y1="96" x2="320" y2="600"/><line x1="640" y1="96" x2="640" y2="600"/></g>

  <text x="170" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">METRICS</text>
  <text x="480" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LOGS</text>
  <text x="790" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRACE</text>

  <!-- LEFT: wall screen with one small red bar -->
  <rect x="44" y="100" width="252" height="176" rx="10" fill="#2f3a4a"/>
  <rect x="56" y="112" width="228" height="152" rx="4" fill="#3d4a5c"/>
  <g fill="#7fb0b8"><rect x="76" y="160" width="26" height="90"/><rect x="114" y="140" width="26" height="110"/><rect x="152" y="176" width="26" height="74"/></g>
  <rect x="190" y="230" width="26" height="20" fill="#e04b3a"/>
  <text x="240" y="216" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">3%</text>
  <path d="M66 250 h208" stroke="#9aa5a8" stroke-width="2"/>
  <use href="#man" transform="translate(170 600) scale(1.1)" color="#1f6f78"/>
  <path d="M164 448 q-4 -4 -4 -10" fill="none"/>
  <path d="M152 432 l16 -6" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M198 486 q20 10 18 -16" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <rect x="206" y="446" width="24" height="26" rx="4" fill="#fff"/><path d="M230 452 q10 2 6 12 h-6" stroke="#fff" stroke-width="4" fill="none"/>
  <path d="M212 440 q-4 -8 0 -14 M222 440 q4 -8 0 -14" stroke="#cbbfa9" stroke-width="2.5" fill="none"/>

  <!-- MIDDLE: the endless printout, clerk buried to his knees -->
  <rect x="424" y="268" width="112" height="56" rx="8" fill="#9aa5a8"/>
  <rect x="440" y="276" width="80" height="8" fill="#3d3a3a"/>
  <g fill="#7c878b"><rect x="436" y="324" width="8" height="70"/><rect x="516" y="324" width="8" height="70"/></g>
  <use href="#man" transform="translate(480 610) scale(1.05)" color="#e0a33a"/>
  <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="472" cy="455" r="7"/><circle cx="490" cy="455" r="7"/><path d="M479 455 h4"/></g>
  <path d="M470 474 q10 -5 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  <path d="M454 500 q-20 10 -30 -14 M506 500 q20 10 30 -14" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
  <g fill="none" stroke-linecap="round">
    <path d="M480 300 Q470 360 420 380 Q350 410 380 460 Q420 520 360 560 Q330 590 400 600 Q480 610 540 580 Q610 550 580 500 Q550 450 600 420" stroke="#fff" stroke-width="34"/>
    <path d="M480 300 Q470 360 420 380 Q350 410 380 460 Q420 520 360 560 Q330 590 400 600 Q480 610 540 580 Q610 550 580 500 Q550 450 600 420" stroke="#b9ad98" stroke-width="20" stroke-dasharray="2 7" opacity=".55"/>
    <path d="M400 560 q60 30 160 0" stroke="#fff" stroke-width="34"/>
    <path d="M400 560 q60 30 160 0" stroke="#b9ad98" stroke-width="20" stroke-dasharray="2 7" opacity=".55"/>
  </g>
  <!-- coils heaped over the clerk's legs -->
  <g fill="#fff" stroke="#d8cdb8" stroke-width="2">
    <ellipse cx="480" cy="606" rx="96" ry="22"/><ellipse cx="470" cy="588" rx="80" ry="20"/><ellipse cx="492" cy="570" rx="66" ry="18"/><ellipse cx="478" cy="554" rx="50" ry="14"/>
  </g>
  <g stroke="#b9ad98" stroke-width="2" opacity=".6"><path d="M410 604 h12 M440 610 h12 M520 606 h12 M420 586 h10 M500 590 h12 M450 568 h10 M520 570 h10 M466 552 h10"/></g>
  <g fill="#9aa5a8"><rect x="410" y="452" width="12" height="8" rx="2"/><rect x="562" y="496" width="12" height="8" rx="2"/><rect x="380" y="552" width="12" height="8" rx="2"/></g>

  <!-- RIGHT: warehouse with one forgotten box -->
  <path d="M836 196 V120 l52 -28 l52 28 V196 z" fill="#d8cdb8"/>
  <rect x="858" y="138" width="60" height="58" fill="#efe6d2"/>
  <use href="#box" transform="translate(902 196) scale(.8)"/>
  <!-- the customer and the tracking page -->
  <path d="M852 482 v-26 a28 28 0 0 1 56 0 v26 z" fill="#5c3a60"/>
  <use href="#man" transform="translate(880 616) scale(1.05)" color="#7a4e7e"/>
  <rect x="660" y="244" width="160" height="316" rx="20" fill="#2b2b2b"/>
  <rect x="670" y="262" width="140" height="282" rx="8" fill="#fff"/>
  <path d="M704 296 V506" stroke="#1f6f78" stroke-width="5"/>
  <circle cx="704" cy="296" r="9" fill="#1f6f78"/>
  <path d="M722 290 h50 M722 302 h36" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="704" cy="354" r="9" fill="#1f6f78"/>
  <g transform="translate(724 362)"><rect x="0" y="-16" width="26" height="16" rx="2" fill="#e0a33a"/><path d="M26 -12 h10 l6 6 v6 h-16 z" fill="#e0a33a"/><circle cx="8" cy="2" r="4" fill="#3d3a3a"/><circle cx="34" cy="2" r="4" fill="#3d3a3a"/></g>
  <circle cx="704" cy="428" r="9" fill="#e04b3a"/>
  <circle cx="704" cy="428" r="20" fill="none" stroke="#e04b3a" stroke-width="3"/>
  <path d="M728 412 h16 l-12 14 l12 14 h-16 l12 -14 z" fill="none" stroke="#7a4e7e" stroke-width="2.5" stroke-linejoin="round"/>
  <text x="754" y="434" font-size="18" font-weight="800" fill="#e04b3a">2 days</text>
  <circle cx="704" cy="500" r="9" fill="#b9ad98"/>
  <path d="M722 504 v-14 l10 -8 l10 8 v14 z" fill="#b9ad98"/>
  <path d="M832 136 l-90 0" fill="none"/>
  <path d="M722 420 Q780 300 880 190" stroke="#e04b3a" stroke-width="3" fill="none" stroke-dasharray="4 6"/>
  <path d="M830 470 q-10 20 -14 50" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M906 500 q-20 40 -86 40" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
</svg>
