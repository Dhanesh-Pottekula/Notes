<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A sticky note hides the ID number from the copy shop; at home the note comes off the original</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
      <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 v30 h-8 v-26 q-13 -8 -26 0 v26 h-8 z" fill="#2e2a2a"/>
    </g>
    <g id="digits" fill="#2b2b2b"><rect x="0" y="0" width="6" height="12"/><rect x="9" y="0" width="6" height="12"/><rect x="18" y="0" width="6" height="12"/><rect x="27" y="0" width="6" height="12"/><rect x="40" y="0" width="6" height="12"/><rect x="49" y="0" width="6" height="12"/><rect x="58" y="0" width="6" height="12"/><rect x="67" y="0" width="6" height="12"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="24" x2="480" y2="616" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: the copy shop -->
  <rect x="24" y="560" width="440" height="56" fill="#e5dcc9"/>
  <g fill="#e8e0d0"><rect x="30" y="120" width="70" height="90" rx="4"/><rect x="40" y="110" width="70" height="90" rx="4" fill="#efe9dc"/></g>
  <!-- assistant behind the copier -->
  <use href="#man" transform="translate(400 440) scale(1.05)" color="#1f6f78"/>
  <g fill="#2e2a2a"><circle cx="392" cy="285" r="2.5"/><circle cx="406" cy="285" r="2.5"/></g>
  <!-- the copier -->
  <rect x="110" y="350" width="260" height="220" rx="10" fill="#9aa5a8"/>
  <rect x="130" y="380" width="70" height="26" rx="4" fill="#2f3a4a"/>
  <circle cx="340" cy="392" r="8" fill="#7cb342"/>
  <path d="M100 350 L130 270 H350 L380 350 Z" fill="#7c878b"/>
  <!-- document on the glass -->
  <path d="M150 340 L170 284 H310 L330 340 Z" fill="#fff"/>
  <path d="M182 296 h70 M178 306 h90" stroke="#b9ad98" stroke-width="3"/>
  <path d="M168 318 h134 l4 14 h-142 z" fill="#e8f0ef"/>
  <path d="M210 314 h72 l6 22 h-82 z" fill="#f7d33a"/>
  <!-- sight line: the shop only sees the yellow patch -->
  <path d="M392 288 Q320 270 262 316" stroke="#7a4e7e" stroke-width="2.5" fill="none" stroke-dasharray="3 5" marker-end="url(#a2)"/>
  <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  <text x="246" y="236" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">MASK</text>
  <path d="M246 244 v56" stroke="#2b2b2b" stroke-width="2"/>
  <!-- woman pressing the sticky note -->
  <use href="#woman" transform="translate(64 560) scale(1.15)" color="#e07a5f"/>
  <path d="M90 444 Q150 380 222 328" stroke="#d9a27a" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M56 454 q8 6 16 0" fill="none"/>
  <!-- the copy that comes out -->
  <rect x="190" y="430" width="120" height="14" rx="4" fill="#3d3a3a"/>
  <path d="M200 440 L188 520 H312 L300 440 Z" fill="#fff"/>
  <path d="M206 456 h60 M204 468 h80" stroke="#b9ad98" stroke-width="3"/>
  <path d="M202 480 h96 l3 14 h-102 z" fill="#e8f0ef"/>
  <path d="M226 478 h52 l3 18 h-58 z" fill="#fff" stroke="#e0b23a" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text x="240" y="604" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">MODEL</text>

  <!-- RIGHT: at home, peel the note off -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">UNMASK</text>
  <path d="M720 80 v60" stroke="#6b5446" stroke-width="3"/>
  <path d="M690 140 h60 l20 36 h-100 z" fill="#e0a33a"/>
  <path d="M670 176 h100 L860 440 H580 z" fill="#f9e7b8" opacity=".45"/>
  <!-- the woman, seated -->
  <use href="#woman" transform="translate(640 520) scale(1.15)" color="#e07a5f"/>
  <path d="M632 336 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- original held up: the number now visible -->
  <g transform="translate(-36 0)">
  <rect x="540" y="250" width="100" height="130" rx="4" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M554 268 h60 M554 280 h72" stroke="#b9ad98" stroke-width="3"/>
  <rect x="550" y="296" width="80" height="26" rx="3" fill="#e8f0ef"/>
  <use href="#digits" transform="translate(554 303)"/>
  <path d="M554 340 h60 M554 352 h50" stroke="#b9ad98" stroke-width="3"/>
  </g>
  <path d="M618 412 q-30 -20 -58 -40" stroke="#d9a27a" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M664 412 q30 -40 52 -96" stroke="#d9a27a" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M700 300 l44 -10 l6 26 l-44 10 z" fill="#f7d33a"/>
  <path d="M704 300 q18 -10 40 -10" stroke="#e0b23a" stroke-width="2" fill="none"/>
  <path d="M610 280 Q670 250 700 296" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="4 4" marker-end="url(#ar)"/>
  <!-- dining table -->
  <path d="M520 430 H940 L956 470 H504 Z" fill="#8a6d5a"/>
  <rect x="504" y="470" width="452" height="12" fill="#6b5446"/>
  <g fill="#6b5446"><rect x="526" y="482" width="12" height="130"/><rect x="920" y="482" width="12" height="130"/></g>
  <!-- photocopy lying beside -->
  <path d="M700 446 L716 424 H806 L800 446 Z" fill="#fff"/>
  <path d="M722 430 h60 l-2 6 h-60 z" fill="#fff" stroke="#e0b23a" stroke-width="2" stroke-dasharray="3 3"/>
  <!-- tea and handbag -->
  <path d="M832 408 h30 l-4 30 h-22 z" fill="#fff"/><path d="M862 414 q10 2 6 14 l-8 0" stroke="#fff" stroke-width="4" fill="none"/>
  <path d="M840 400 q-4 -8 0 -14 M852 400 q4 -8 0 -14" stroke="#cbbfa9" stroke-width="2.5" fill="none"/>
  <path d="M880 444 l6 -48 h46 l6 48 z" fill="#7a4e7e"/><path d="M892 396 q17 -26 34 0" stroke="#5c3a60" stroke-width="5" fill="none"/>

  <!-- inset: a detector can still miss a number -->
  <rect x="780" y="500" width="160" height="116" rx="12" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <rect x="800" y="514" width="70" height="88" rx="2" fill="#f6f1e7"/>
  <rect x="806" y="524" width="58" height="10" fill="#f7d33a"/><rect x="806" y="542" width="58" height="10" fill="#f7d33a"/>
  <g transform="translate(806 560) scale(.78)"><use href="#digits"/></g>
  <rect x="806" y="580" width="58" height="10" fill="#f7d33a"/>
  <circle cx="886" cy="550" r="22" fill="none" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M902 566 l20 22" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="918" cy="522" r="12" fill="#e07a5f"/>
  <text x="918" y="528" text-anchor="middle" font-size="16" font-weight="800" fill="#fff">!</text>
</svg>
