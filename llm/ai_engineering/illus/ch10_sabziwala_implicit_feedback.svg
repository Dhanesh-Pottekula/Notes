<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A vegetable seller reads a customer's picks, frowns and remarks instead of handing out a feedback form</title>
  <defs>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <path d="M-26 0 l6 -104 a20 20 0 0 1 40 0 l6 104 z" fill="#1f6f78"/>
      <path d="M-20 -104 a20 20 0 0 1 40 0 l-34 70 z" fill="#2a8f9a"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
      <circle cx="-16" cy="-160" r="9" fill="#2e2a2a"/>
    </g>
    <g id="tom"><circle r="11" fill="#e04b3a"/><path d="M-4 -10 l4 3 l4 -3" stroke="#5f9a54" stroke-width="3" fill="none"/></g>
    <g id="cap"><path d="M-12 -10 q12 -8 24 0 q4 16 -4 24 q-8 4 -16 0 q-8 -8 -4 -24 z" fill="#4f9a45"/><rect x="-2" y="-16" width="4" height="7" fill="#3d7a35"/></g>
    <g id="spin"><path d="M0 0 q-20 -30 -10 -60 q10 20 10 60 z M0 0 q20 -30 10 -60 q-10 20 -10 60 z M0 0 q-2 -36 0 -66 q4 30 0 66 z" fill="#3f8f4f"/><rect x="-6" y="-6" width="12" height="14" rx="2" fill="#c49a63"/></g>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="540" width="960" height="100" fill="#e5dcc9"/>

  <!-- faded umbrella -->
  <rect x="166" y="190" width="6" height="220" fill="#6b5446"/>
  <path d="M30 210 q140 -130 280 0 z" fill="#e0a33a" opacity=".55"/>
  <path d="M30 210 q35 14 70 0 q35 14 70 0 q35 14 70 0 q35 14 70 0" fill="#e0a33a" opacity=".55"/>

  <!-- seller behind the cart -->
  <g transform="translate(330 470) scale(1.3)">
    <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#ffffff"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-150" r="20" fill="#b07850"/>
    <path d="M-19 -156 a19 14 0 0 1 38 0 z" fill="#ffffff"/>
    <path d="M14 -156 l12 -10" stroke="#e0a33a" stroke-width="3"/>
    <path d="M-6 -146 q3 -2 6 0 M6 -146 q3 -2 6 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-8 -136 q8 4 16 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>

  <!-- the cart and its vegetables -->
  <path d="M120 398 h440 l-10 70 h-420 z" fill="#8a6d5a"/>
  <rect x="116" y="392" width="448" height="12" rx="4" fill="#6b5446"/>
  <g><circle cx="170" cy="500" r="42" fill="none" stroke="#6b5446" stroke-width="8"/><path d="M170 458 v84 M128 500 h84" stroke="#6b5446" stroke-width="4"/></g>
  <g><circle cx="510" cy="500" r="42" fill="none" stroke="#6b5446" stroke-width="8"/><path d="M510 458 v84 M468 500 h84" stroke="#6b5446" stroke-width="4"/></g>
  <use href="#spin" transform="translate(160 394)"/><use href="#spin" transform="translate(192 394) rotate(10)"/>
  <g fill="#c4874a"><circle cx="236" cy="384" r="12"/><circle cx="258" cy="380" r="12"/><circle cx="246" cy="366" r="12"/><circle cx="280" cy="386" r="11"/></g>
  <g stroke="#3f8f4f" stroke-width="4" stroke-linecap="round"><path d="M300 390 q12 -16 30 -18"/><path d="M304 394 q14 -12 30 -12"/></g>
  <use href="#cap" transform="translate(372 378)"/><use href="#cap" transform="translate(398 380)"/><use href="#cap" transform="translate(386 360)"/>
  <rect x="410" y="336" width="34" height="22" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M410 347 l-8 4" stroke="#b9ad98" stroke-width="2"/>
  <path d="M418 344 h18 M418 352 h12" stroke="#e04b3a" stroke-width="3"/>
  <use href="#tom" transform="translate(470 384)"/><use href="#tom" transform="translate(494 386)"/><use href="#tom" transform="translate(482 366)"/><use href="#tom" transform="translate(516 384)"/><use href="#tom" transform="translate(504 366)"/>
  <use href="#tom" transform="translate(540 384) scale(.7)"/>
  <!-- the unused feedback form -->
  <rect x="226" y="416" width="44" height="52" rx="2" fill="#fff" stroke="#d8cdb8" stroke-width="2" transform="rotate(-6 248 442)"/>
  <path d="M234 428 h28 M234 438 h28 M234 448 h20" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M226 416 l44 52 M270 416 l-44 52" stroke="#e04b3a" stroke-width="4" stroke-linecap="round"/>
  <text x="248" y="612" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO FORM</text>
  <path d="M248 584 v-110" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="3 4"/>

  <!-- customer: three cues -->
  <use href="#woman" transform="translate(680 600) scale(1.25)"/>
  <rect x="704" y="520" width="44" height="50" rx="6" fill="#e8dfcc"/><path d="M712 522 q14 -36 28 0" stroke="#cbbfa9" stroke-width="4" fill="none"/>
  <!-- 1: picks a small tomato -->
  <path d="M656 480 Q600 430 550 392" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <circle cx="546" cy="388" r="8" fill="#c98a5e"/>
  <!-- 2: frowns at the capsicum price -->
  <path d="M668 418 l8 3 M684 421 l8 -3" stroke="#2e2a2a" stroke-width="2.5"/>
  <path d="M672 436 q8 -5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M664 424 Q560 330 446 346" stroke="#7a4e7e" stroke-width="2" fill="none" stroke-dasharray="3 5"/>
  <!-- 3: holds up the spinach, "not like last week's" -->
  <path d="M706 480 q30 -30 40 -70" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/>
  <use href="#spin" transform="translate(748 410) scale(.8)"/>
  <path d="M790 250 h110 a14 14 0 0 1 14 14 v46 a14 14 0 0 1 -14 14 h-80 l-24 22 l4 -22 h-10 a14 14 0 0 1 -14 -14 v-46 a14 14 0 0 1 14 -14 z" fill="#fff" stroke="#3f8f4f" stroke-width="3"/>
  <use href="#spin" transform="translate(816 312) scale(.55)"/>
  <rect x="844" y="266" width="52" height="44" rx="4" fill="#f6f1e7" stroke="#b9ad98" stroke-width="2"/>
  <rect x="844" y="266" width="52" height="10" rx="3" fill="#e07a5f"/>
  <path d="M888 296 h-30 m8 -8 l-8 8 l8 8" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- number badges -->
  <g font-size="16" font-weight="800" text-anchor="middle" fill="#fff">
    <circle cx="590" cy="408" r="13" fill="#7a4e7e"/><text x="590" y="414">1</text>
    <circle cx="640" cy="396" r="13" fill="#7a4e7e"/><text x="640" y="402">2</text>
    <circle cx="784" cy="388" r="13" fill="#7a4e7e"/><text x="784" y="394">3</text>
  </g>

  <!-- seller's thought bubble -->
  <text x="520" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">IMPLICIT FEEDBACK</text>
  <circle cx="352" cy="222" r="7" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <circle cx="372" cy="196" r="10" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="390" y="90" width="270" height="100" rx="40" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <use href="#tom" transform="translate(450 140) scale(1.4)"/>
  <circle cx="530" cy="140" r="24" fill="#f3e2b8"/>
  <g fill="#2e2a2a"><circle cx="522" cy="134" r="3"/><circle cx="538" cy="134" r="3"/></g>
  <path d="M520 152 q10 -8 20 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <use href="#spin" transform="translate(600 172) scale(.8)"/>
  <path d="M640 126 h-20 m6 -6 l-6 6 l6 6" stroke="#7a4e7e" stroke-width="2.5" fill="none"/>
  <g stroke="#7a4e7e" stroke-width="2" fill="none" stroke-dasharray="3 5" marker-end="url(#ar)">
    <path d="M590 394 Q560 260 456 190"/>
    <path d="M640 382 Q610 260 540 194"/>
    <path d="M784 374 Q740 230 620 192"/>
  </g>
</svg>
