<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Easy underarm balls teach nothing; night-time bouncers behind a safety screen build real technique</title>
  <defs>
    <g id="bat">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".1"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#ffffff"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#ffffff"/>
      <rect x="-19" y="-44" width="16" height="40" rx="5" fill="#e8eef0"/><rect x="3" y="-44" width="16" height="40" rx="5" fill="#e8eef0"/>
      <path d="M-24 -60 v-44 a24 24 0 0 1 48 0 v44 z" fill="#ffffff"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-23 -150 a23 23 0 0 1 46 0 h6 v6 h-52 z" fill="#2f4f7a"/>
      <path d="M-12 -144 v18 M0 -144 v20 M12 -144 v18 M-14 -136 h28" stroke="#9aa5a8" stroke-width="2"/>
    </g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="20" fill="#b07850"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="24" x2="480" y2="616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">EASY CASES</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">REAL USERS</text>

  <!-- LEFT: lazy afternoon in the park -->
  <rect x="24" y="96" width="440" height="520" rx="12" fill="#f3ead2"/>
  <circle cx="400" cy="150" r="30" fill="#e0a33a" opacity=".6"/>
  <path d="M24 520 h440 v84 a12 12 0 0 1 -12 12 h-416 a12 12 0 0 1 -12 -12 z" fill="#b8d49c"/>
  <circle cx="80" cy="260" r="50" fill="#9cc27a"/><rect x="74" y="300" width="12" height="220" fill="#8a6d5a"/>
  <!-- flat line icon -->
  <rect x="300" y="250" width="90" height="58" rx="8" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M312 284 h66" stroke="#9aa5a8" stroke-width="4" stroke-linecap="round"/>
  <!-- uncle lobs underarm -->
  <use href="#man" transform="translate(130 560)" color="#ffffff"/>
  <path d="M152 450 q24 40 44 28" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M108 450 q-10 30 -4 50" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
  <path d="M122 420 q8 5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M206 470 Q260 360 330 440" stroke="#b9ad98" stroke-width="3" fill="none" stroke-dasharray="4 7"/>
  <circle cx="334" cy="446" r="7" fill="#e04b3a"/>
  <!-- bored batsman yawning -->
  <use href="#bat" transform="translate(370 560)"/>
  <ellipse cx="370" cy="416" rx="5" ry="7" fill="#2e2a2a"/>
  <path d="M352 450 q-10 20 -6 30 M388 450 q-10 20 -30 28" stroke="#c98a5e" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M354 474 l-30 40" stroke="#d9b382" stroke-width="12" stroke-linecap="round"/>
  <text x="404" y="384" font-size="20" font-weight="800" fill="#b9ad98">z</text>
  <!-- dog asleep in the grass -->
  <g transform="translate(250 560)">
    <ellipse cx="0" cy="0" rx="36" ry="14" fill="#c4874a"/><circle cx="34" cy="-6" r="12" fill="#c4874a"/>
    <path d="M28 -16 l-4 -8 l10 4 z" fill="#a8743e"/><path d="M-36 0 q-12 -2 -16 6" stroke="#c4874a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M32 -6 q4 2 8 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>

  <!-- RIGHT: floodlit nets at 2 a.m. -->
  <rect x="496" y="96" width="440" height="520" rx="12" fill="#2f3a4a"/>
  <path d="M520 110 L640 600 H496 V120 z" fill="#f9e7b8" opacity=".08"/>
  <rect x="496" y="520" width="440" height="96" fill="#5b6470"/>
  <g stroke="#6b7684" stroke-width="1.5"><path d="M520 120 v400 M560 120 v400 M600 120 v400 M640 120 v400 M680 120 v400 M720 120 v400 M760 120 v400 M800 120 v400 M840 120 v400 M880 120 v400 M920 120 v400 M496 160 h440 M496 220 h440 M496 280 h440 M496 340 h440 M496 400 h440 M496 460 h440"/></g>
  <!-- floodlight -->
  <rect x="512" y="104" width="8" height="40" fill="#9aa5a8"/>
  <g fill="#fff8d8"><circle cx="516" cy="112" r="9"/></g>
  <!-- pavilion clock: 2 o'clock -->
  <circle cx="600" cy="160" r="26" fill="#f6f1e7" stroke="#9aa5a8" stroke-width="4"/>
  <path d="M600 160 v-17 M600 160 l12 -7" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <!-- safety screen with coach and monitor -->
  <rect x="668" y="126" width="212" height="120" rx="6" fill="#e8eef0"/>
  <g stroke="#cfd4d6" stroke-width="2"><path d="M690 126 v120 M720 126 v120 M750 126 v120 M780 126 v120 M810 126 v120 M840 126 v120"/></g>
  <text x="774" y="198" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">GUARDRAILS</text>
  <rect x="680" y="246" width="8" height="40" fill="#9aa5a8"/><rect x="860" y="246" width="8" height="40" fill="#9aa5a8"/>
  <use href="#man" transform="translate(906 400) scale(.62)" color="#1f6f78"/>
  <rect x="842" y="318" width="30" height="40" rx="2" fill="#fff"/>
  <path d="M890 340 l-14 0" stroke="#b07850" stroke-width="7" stroke-linecap="round"/>
  <rect x="832" y="268" width="40" height="28" rx="3" fill="#1b2430" stroke="#9aa5a8" stroke-width="2"/>
  <path d="M838 288 l8 -8 l8 4 l10 -10" stroke="#7cb342" stroke-width="2" fill="none"/>
  <!-- growth icon -->
  <rect x="520" y="234" width="90" height="58" rx="8" fill="#fff"/>
  <path d="M532 280 l20 -10 l16 4 l28 -24" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M590 248 h8 v8" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- fast bowler running in hard -->
  <g transform="translate(880 590) rotate(-10)">
    <rect x="-24" y="-66" width="14" height="66" rx="6" fill="#ffffff" transform="rotate(22 -17 -60)"/>
    <rect x="8" y="-66" width="14" height="66" rx="6" fill="#ffffff" transform="rotate(-24 15 -60)"/>
    <path d="M-26 -60 v-50 a26 26 0 0 1 52 0 v50 z" fill="#7a4e7e"/>
    <path d="M-10 -100 q6 10 0 20 M8 -96 q6 10 0 18" stroke="#9a6e9e" stroke-width="3" fill="none"/>
    <rect x="-7" y="-140" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-156" r="20" fill="#b07850"/>
    <path d="M-20 -160 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    <path d="M-24 -112 l-40 -40" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <path d="M24 -112 l30 30" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
  </g>
  <path d="M790 452 Q720 460 668 410" stroke="#f6f1e7" stroke-width="3" fill="none" stroke-dasharray="6 6" opacity=".7"/>
  <circle cx="660" cy="404" r="8" fill="#e04b3a"/>
  <!-- batsman sways back -->
  <g transform="rotate(-12 600 576)"><use href="#bat" transform="translate(600 576)"/></g>
  <path d="M542 428 l-16 -86" stroke="#d9b382" stroke-width="12" stroke-linecap="round"/>
  <path d="M554 475 q-14 -20 -12 -46 M601 465 q-30 -8 -56 -34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round" fill="none"/>
</svg>
