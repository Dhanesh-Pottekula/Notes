  <text x="412" y="212" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <text x="423" y="199" text-anchor="middle" font-size="18" font-weight="800" fill="#7a4e7e">?</text>
  <text x="417" y="220" text-anchor="middle" font-size="18" font-weight="800" fill="#b9ad98">?</text>
  <text x="454" y="200" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">?</text>
  <rect x="448" y="194" width="18" height="8" rx="4" fill="#1f6f78" opacity=".8"/>
  <rect x="469" y="262" width="18" height="8" rx="4" fill="#e07a5f" opacity=".8"/>
  <text x="478" y="282" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <!-- the answer card -->
  <ellipse cx="480" cy="322" rx="70" ry="34" fill="#e0a33a" opacity=".3"/>
  <rect x="440" y="300" width="80" height="46" rx="6" fill="#fff" stroke="#e0a33a" stroke-width="3"/>
