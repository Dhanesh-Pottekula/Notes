  <path d="M496 336 l6 6 l12 -14" stroke="#1f6f78" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="546" y="334" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANSWER</text>

  <!-- closed medicine cupboard pushed aside -->
  <rect x="34" y="470" width="110" height="150" rx="6" fill="#e8eef0" stroke="#b9c3c6" stroke-width="3"/>
  <path d="M89 470 v150" stroke="#b9c3c6" stroke-width="3"/>
  <path d="M74 520 h30 M89 505 v30" stroke="#e07a5f" stroke-width="7"/>
  <rect x="80" y="552" width="18" height="14" rx="2" fill="#9aa5a8"/><path d="M84 552 v-5 a5 5 0 0 1 10 0 v5" stroke="#9aa5a8" stroke-width="2.5" fill="none"/>

  <!-- QUESTIONS: the doctor counts them off -->
  <text x="140" y="300" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">QUESTIONS</text>
  <g fill="#fff" stroke="#1f6f78" stroke-width="2.5">
    <rect x="40" y="320" width="70" height="44" rx="12"/><rect x="120" y="320" width="70" height="44" rx="12"/><rect x="200" y="320" width="70" height="44" rx="12"/>
  </g>
  <use href="#clock" transform="translate(75 342)"/>
  <use href="#body" transform="translate(152 344)"/>
  <use href="#thermo" transform="translate(235 342)"/>
  <path d="M235 364 l10 16 l-2 -16 z M155 364 l40 30 l-26 -30 z" fill="#fff" stroke="#1f6f78" stroke-width="2"/>
  <g transform="translate(250 600) scale(1.2)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-60" width="12" height="60" rx="5" fill="#4a3f55"/><rect x="2" y="-60" width="12" height="60" rx="5" fill="#4a3f55"/>
    <path d="M-28 -56 v-48 a28 26 0 0 1 56 0 v48 z" fill="#ffffff"/>
    <path d="M-8 -128 l8 24 l8 -24 z" fill="#1f6f78"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -148 a21 21 0 0 1 42 0 v6 h-6 v-6 q-15 -10 -30 0 v6 h-6 z" fill="#b9b4ac"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-148" r="5"/><circle cx="7" cy="-148" r="5"/><path d="M-2 -148 h4"/></g>
    <path d="M-5 -138 q5 3 10 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M28 -100 q20 6 30 -16" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/>
    <g stroke="#d9a27a" stroke-width="4" stroke-linecap="round"><path d="M56 -118 v-12"/><path d="M62 -116 v-10"/></g>
    <path d="M-10 -120 q-10 30 10 40 q14 4 16 -12" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  </g>

  <!-- desk with stethoscope, BP machine, calendar -->
  <rect x="320" y="470" width="350" height="16" rx="4" fill="#8a6d5a"/>
  <rect x="330" y="486" width="330" height="130" fill="#a8876f"/>
  <rect x="356" y="430" width="60" height="40" rx="4" fill="#9aa5a8"/><circle cx="386" cy="448" r="12" fill="#fff"/><path d="M386 448 l6 -6" stroke="#e07a5f" stroke-width="2"/>
  <path d="M416 456 q20 8 30 0" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <path d="M520 466 q-20 -30 10 -36 q30 6 10 36" stroke="#3d3a3a" stroke-width="3" fill="none"/><circle cx="540" cy="466" r="6" fill="#9aa5a8"/>
  <rect x="590" y="410" width="54" height="56" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="590" y="410" width="54" height="12" fill="#e07a5f"/>

  <!-- patient holding his stomach -->
  <use href="#man" transform="translate(730 610) scale(1.15)" color="#7fb0b8"/>
  <g stroke="#5f9aa3" stroke-width="2" opacity=".7"><path d="M708 480 h44 M708 500 h44 M708 520 h44 M718 470 v70 M742 470 v70"/></g>
  <path d="M706 486 q-6 30 22 34 M754 486 q4 26 -18 30" stroke="#b07850" stroke-width="12" stroke-linecap="round" fill="none"/>
  <path d="M722 456 q8 -5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>

  <!-- inset: new problems need an experiment -->
  <rect x="806" y="292" width="130" height="150" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="834" y="318" width="16" height="64" rx="8" fill="#e8f0ef" stroke="#7a4e7e" stroke-width="2"/>
  <rect x="836" y="350" width="12" height="30" rx="6" fill="#8bc34a"/>
  <path d="M884 318 h20 v26 l18 36 q2 8 -6 8 h-44 q-8 0 -6 -8 l18 -36 z" fill="#e8f0ef" stroke="#7a4e7e" stroke-width="2"/>
  <path d="M872 372 h44 l6 12 q0 4 -4 4 h-48 q-4 0 -4 -4 z" fill="#e0a33a"/>
  <text x="871" y="426" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">EVAL</text>
</svg>
