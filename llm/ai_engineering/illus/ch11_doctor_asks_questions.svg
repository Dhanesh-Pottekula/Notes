  <path d="M860 40 v160 M790 120 h140" stroke="#cbbfa9" stroke-width="4"/>

  <!-- the funnel of possibilities -->
  <path d="M230 36 H730 L512 290 H448 Z" fill="#ece3d1" stroke="#d8cdb8" stroke-width="3"/>
  <g stroke="#1f6f78" stroke-width="3" stroke-dasharray="8 6"><line x1="300" y1="114" x2="660" y2="114"/><line x1="358" y1="180" x2="602" y2="180"/><line x1="410" y1="240" x2="550" y2="240"/></g>
  <use href="#clock" transform="translate(682 114)"/>
  <use href="#body" transform="translate(624 180)"/>
  <use href="#thermo" transform="translate(570 240)"/>
  <text x="335" y="73" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">?</text>
  <rect x="418" y="75" width="18" height="8" rx="4" fill="#e07a5f" opacity=".8"/>
  <text x="304" y="68" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <text x="447" y="61" text-anchor="middle" font-size="18" font-weight="800" fill="#b9ad98">?</text>
  <circle cx="534" cy="62" r="7" fill="#e07a5f" opacity=".8"/><path d="M524 62 h20 M534 52 v20" stroke="#e07a5f" stroke-width="2" opacity=".8"/>
  <circle cx="675" cy="71" r="7" fill="#e07a5f" opacity=".8"/><path d="M665 71 h20 M675 61 v20" stroke="#e07a5f" stroke-width="2" opacity=".8"/>
  <text x="445" y="63" text-anchor="middle" font-size="18" font-weight="800" fill="#b9ad98">?</text>
  <text x="612" y="73" text-anchor="middle" font-size="18" font-weight="800" fill="#7a4e7e">?</text>
  <circle cx="358" cy="81" r="7" fill="#e07a5f" opacity=".8"/><path d="M348 81 h20 M358 71 v20" stroke="#e07a5f" stroke-width="2" opacity=".8"/>
  <circle cx="286" cy="53" r="7" fill="#7a4e7e" opacity=".8"/><path d="M276 53 h20 M286 43 v20" stroke="#7a4e7e" stroke-width="2" opacity=".8"/>
  <circle cx="590" cy="79" r="7" fill="#e0a33a" opacity=".8"/><path d="M580 79 h20 M590 69 v20" stroke="#e0a33a" stroke-width="2" opacity=".8"/>
  <rect x="390" y="70" width="18" height="8" rx="4" fill="#7a4e7e" opacity=".8"/>
  <circle cx="511" cy="63" r="7" fill="#b9ad98" opacity=".8"/><path d="M501 63 h20 M511 53 v20" stroke="#b9ad98" stroke-width="2" opacity=".8"/>
  <rect x="450" y="65" width="18" height="8" rx="4" fill="#b9ad98" opacity=".8"/>
  <text x="444" y="62" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6f78">?</text>
  <rect x="287" y="72" width="18" height="8" rx="4" fill="#e07a5f" opacity=".8"/>
  <text x="627" y="87" text-anchor="middle" font-size="18" font-weight="800" fill="#1f6f78">?</text>
  <text x="479" y="75" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <text x="379" y="61" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">?</text>
  <text x="536" y="94" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <rect x="540" y="67" width="18" height="8" rx="4" fill="#e07a5f" opacity=".8"/>
  <text x="526" y="75" text-anchor="middle" font-size="18" font-weight="800" fill="#e0a33a">?</text>
  <circle cx="386" cy="159" r="7" fill="#7a4e7e" opacity=".8"/><path d="M376 159 h20 M386 149 v20" stroke="#7a4e7e" stroke-width="2" opacity=".8"/>
  <circle cx="479" cy="166" r="7" fill="#7a4e7e" opacity=".8"/><path d="M469 166 h20 M479 156 v20" stroke="#7a4e7e" stroke-width="2" opacity=".8"/>
  <rect x="575" y="145" width="18" height="8" rx="4" fill="#e0a33a" opacity=".8"/>
  <rect x="446" y="133" width="18" height="8" rx="4" fill="#1f6f78" opacity=".8"/>
  <text x="403" y="148" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">?</text>
  <rect x="392" y="131" width="18" height="8" rx="4" fill="#e0a33a" opacity=".8"/>
  <circle cx="414" cy="132" r="7" fill="#7a4e7e" opacity=".8"/><path d="M404 132 h20 M414 122 v20" stroke="#7a4e7e" stroke-width="2" opacity=".8"/>
