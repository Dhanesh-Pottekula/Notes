<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A doctor's questions narrow a funnel of possible illnesses down to one answer</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="20" fill="#b07850"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="clock"><circle r="12" fill="#fff" stroke="#1f6f78" stroke-width="3"/><path d="M0 0 v-7 M0 0 l5 3" stroke="#1f6f78" stroke-width="2.5" stroke-linecap="round"/></g>
    <g id="body"><circle cx="0" cy="-12" r="5" fill="#b9ad98"/><rect x="-6" y="-6" width="12" height="18" rx="5" fill="#b9ad98"/><path d="M14 -2 h-10 l4 -4 M4 -2 l4 4" stroke="#e07a5f" stroke-width="2.5" fill="none" stroke-linecap="round"/></g>
    <g id="thermo"><rect x="-3" y="-14" width="6" height="22" rx="3" fill="#fff" stroke="#e07a5f" stroke-width="2"/><circle cx="0" cy="10" r="5" fill="#e07a5f"/><rect x="-1" y="-4" width="2" height="12" fill="#e07a5f"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- frosted window -->
