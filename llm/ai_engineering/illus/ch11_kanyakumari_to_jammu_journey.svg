<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A train journey from the southern tip to the northern hills, and the traveller walking on to a workshop</title>
  <defs>
    <g id="stn"><circle r="7" fill="#fff" stroke="#1f6f78" stroke-width="3"/></g>
    <g id="chai"><path d="M-7 0 l-2 -14 h18 l-2 14 z" fill="#fff"/><path d="M-6 -2 l-1 -9 h14 l-1 9 z" fill="#c4874a"/><path d="M-2 -18 q-4 -6 0 -10 M4 -18 q4 -6 0 -10" stroke="#b9ad98" stroke-width="2" fill="none"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- sea -->
  <path d="M0 470 Q200 440 300 520 Q380 600 470 520 Q560 440 700 470 L960 500 V640 H0 Z" fill="#dbe9ea"/>
  <!-- sunrise in the north -->
  <circle cx="160" cy="110" r="40" fill="#e0a33a" opacity=".3"/>
  <!-- stylised map -->
  <path d="M360 52 L424 44 L456 96 L436 150 L500 196 L600 216 L680 196 L724 226 L694 270 L642 260 L612 300 L562 324 L520 384 L470 464 L424 556 L394 612 L368 578 L340 480 L302 400 L266 362 L216 360 L176 322 L206 290 L248 280 L280 220 L318 180 L330 116 Z" fill="#cfe0b8"/>
  <!-- snowy hills -->
  <g><path d="M340 140 l30 -56 l30 56 z" fill="#b9ad98"/><path d="M360 102 l10 -18 l10 18 z" fill="#fff"/><path d="M384 150 l34 -64 l34 64 z" fill="#a89c88"/><path d="M406 108 l12 -22 l12 22 z" fill="#fff"/><path d="M436 170 l24 -44 l24 44 z" fill="#b9ad98"/><path d="M452 140 l8 -14 l8 14 z" fill="#fff"/></g>
  <!-- rivers -->
  <g stroke="#7fb0d6" stroke-width="4" fill="none" stroke-linecap="round"><path d="M450 190 Q520 240 600 250 Q640 256 668 240"/><path d="M330 330 Q400 340 470 380"/><path d="M380 450 Q430 470 500 430"/></g>

  <!-- the long route -->
  <path id="route" d="M392 600 Q360 540 380 490 Q410 430 360 380 Q300 320 360 270 Q420 230 412 160" stroke="#3d3a3a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M392 600 Q360 540 380 490 Q410 430 360 380 Q300 320 360 270 Q420 230 412 160" stroke="#f6f1e7" stroke-width="2" fill="none" stroke-dasharray="4 8"/>
  <use href="#stn" transform="translate(392 600)"/><use href="#stn" transform="translate(376 504)"/><use href="#stn" transform="translate(372 392)"/><use href="#stn" transform="translate(340 318)"/><use href="#stn" transform="translate(400 240)"/>
  <use href="#chai" transform="translate(346 520)"/><use href="#chai" transform="translate(410 400)"/><use href="#chai" transform="translate(304 300)"/>
  <text x="246" y="430" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">THE BOOK</text>
  <path d="M246 442 Q290 470 360 440" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-dasharray="3 4"/>
  <!-- distance sign -->
  <rect x="480" y="488" width="6" height="56" fill="#6b5446"/>
  <rect x="436" y="470" width="96" height="34" rx="5" fill="#1f6f78"/>
  <text x="484" y="493" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">3,700 km</text>

  <!-- the train at rest in the hills -->
  <g>
    <rect x="388" y="166" width="40" height="26" rx="6" fill="#2f6fa8" transform="rotate(-80 408 179)"/>
    <rect x="392" y="208" width="40" height="26" rx="6" fill="#2f6fa8" transform="rotate(-45 412 221)"/>
    <rect x="356" y="236" width="40" height="26" rx="6" fill="#2f6fa8" transform="rotate(-20 376 249)"/>
    <g fill="#dbe9ea"><rect x="400" y="168" width="8" height="8" transform="rotate(-80 408 179)"/><rect x="406" y="214" width="8" height="8" transform="rotate(-45 412 221)"/><rect x="370" y="242" width="8" height="8" transform="rotate(-20 376 249)"/></g>
  </g>
  <!-- hill-station platform and the traveller -->
  <rect x="430" y="176" width="190" height="16" rx="3" fill="#a89c88"/>
  <rect x="430" y="192" width="190" height="10" fill="#8f8574"/>
  <g transform="translate(536 176) scale(.82)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/><rect x="3" y="-40" width="11" height="40" rx="5" fill="#4a3f55"/>
    <rect x="-40" y="-118" width="26" height="54" rx="8" fill="#6b5446"/>
    <path d="M-24 -104 a24 24 0 0 1 48 0 l8 70 h-64 z" fill="#e07a5f"/>
    <path d="M-26 -116 q26 22 52 0 l4 22 q-30 14 -60 0 z" fill="#7a4e7e"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
    <circle cx="-14" cy="-164" r="9" fill="#2e2a2a"/>
    <path d="M-12 -144 q-4 4 -6 2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M24 -100 q14 26 10 44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <rect x="28" y="-60" width="20" height="26" rx="2" fill="#e0a33a"/>
  </g>
  <path d="M620 184 Q660 190 700 214" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 6"/>

  <!-- the workshop at the end of the path -->
  <text x="790" y="104" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">START BUILDING</text>
  <path d="M684 160 l106 -38 l106 38 z" fill="#8a6d5a"/>
  <rect x="696" y="160" width="188" height="140" fill="#efe6d2"/>
  <rect x="712" y="176" width="156" height="110" fill="#fff"/>
  <g stroke="#6b5446" stroke-width="4" stroke-linecap="round"><path d="M728 190 v30"/><path d="M748 188 l10 30"/><path d="M780 190 v20 h10"/></g>
  <rect x="724" y="246" width="132" height="10" fill="#8a6d5a"/>
  <g fill="#6b5446"><rect x="732" y="256" width="6" height="30"/><rect x="842" y="256" width="6" height="30"/></g>
  <path d="M770 246 l6 -34 h52 l-6 34 z" fill="#3d3a3a"/>
  <path d="M776 240 l5 -24 h40 l-4 24 z" fill="#7fb0b8"/>
  <path d="M760 246 h72" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  <circle cx="852" cy="236" r="9" fill="#e0a33a"/><rect x="848" y="218" width="8" height="10" fill="#c4874a"/>
</svg>
