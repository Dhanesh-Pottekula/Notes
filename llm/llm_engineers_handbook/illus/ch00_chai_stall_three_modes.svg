<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A railway chai stall serving three ways: a hurried passenger now, a delivery order later, and a scheduled batch of cups</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="cup"><path d="M-9 -24 h18 l-3 24 h-12 z" fill="#fff"/><rect x="-10" y="-27" width="20" height="5" rx="2" fill="#e0a33a"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- platform -->
  <rect x="0" y="540" width="960" height="100" fill="#e6dccb"/>
  <rect x="0" y="540" width="960" height="8" fill="#e0a33a"/>

  <!-- LEFT: train with open door + platform clock -->
  <rect x="24" y="200" width="250" height="250" rx="16" fill="#1f6f78" opacity=".85"/>
  <rect x="24" y="260" width="250" height="10" fill="#f6f1e7" opacity=".5"/>
  <rect x="44" y="290" width="50" height="40" rx="6" fill="#d8eef0" opacity=".7"/>
  <rect x="200" y="290" width="50" height="40" rx="6" fill="#d8eef0" opacity=".7"/>
  <rect x="114" y="286" width="66" height="164" fill="#3d3a3a"/>
  <rect x="24" y="450" width="250" height="12" fill="#3d3a3a"/>
  <line x1="150" y1="96" x2="150" y2="122" stroke="#3d3a3a" stroke-width="4"/>
  <circle cx="150" cy="152" r="30" fill="#fff" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M150 152 v-22 M150 152 l-6 -20" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M150 152 m0 -26 a26 26 0 0 0 -8 1" stroke="#e07a5f" stroke-width="5" fill="none"/>
  <text x="150" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONLINE</text>

  <!-- stall awning -->
  <rect x="300" y="120" width="636" height="34" fill="#e07a5f"/>
  <path d="M300 154 h636 l0 18 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 q-26 14 -53 0 z" fill="#e0a33a"/>
  <rect x="306" y="170" width="10" height="370" fill="#6b5446"/>
  <rect x="920" y="170" width="10" height="370" fill="#6b5446"/>

  <!-- chaiwala pouring a high arc -->
  <g transform="translate(410 520)">
    <use href="#man" color="#ffffff"/>
    <path d="M-26 -110 l-30 -50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -110 l-30 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M18 -130 q12 30 4 60" stroke="#cbbfa9" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-20 -164 a20 20 0 0 1 40 0" fill="none"/>
    <path d="M-12 -138 q12 6 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <!-- brass kettle up high, tea pouring in an arc -->
  <path d="M382 316 q22 4 8 30" stroke="#b7802a" stroke-width="5" fill="none"/>
  <path d="M334 346 h46 q6 -30 -8 -38 h-30 q-14 8 -8 38 z" fill="#e0a33a"/>
  <rect x="338" y="304" width="38" height="7" rx="3" fill="#b7802a"/>
  <rect x="350" y="302" width="12" height="10" rx="4" fill="#b7802a"/>
  <path d="M334 334 l-20 -14" stroke="#e0a33a" stroke-width="7" stroke-linecap="round"/>
  <path d="M312 320 q-14 30 2 82" stroke="#b7802a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g transform="translate(580 476)">
    <use href="#man" color="#f6f1e7" transform="scale(.85)"/>
    <path d="M-22 -96 l10 40 M22 -96 l18 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- counter -->
  <rect x="300" y="420" width="400" height="120" rx="8" fill="#8a6d5a"/>
  <rect x="300" y="420" width="400" height="16" rx="8" fill="#6b5446"/>
  <!-- glass on counter, passenger reaching -->
  <path d="M306 402 h18 l-3 18 h-12 z" fill="#d9a27a" opacity=".9"/>
  <!-- milk can with tasting spoon -->
  <rect x="460" y="378" width="34" height="42" rx="6" fill="#e0a33a"/>
  <rect x="466" y="370" width="22" height="10" rx="3" fill="#b7802a"/>
  <path d="M470 370 l20 -12" stroke="#9a9086" stroke-width="3" stroke-linecap="round"/>

  <!-- hurried passenger with backpack -->
  <g transform="translate(250 540)">
    <use href="#man" color="#7a4e7e"/>
    <rect x="-46" y="-118" width="24" height="54" rx="8" fill="#e0a33a"/>
    <path d="M26 -110 l44 -20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-20 -110 l-8 44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g transform="translate(206 340)"><circle r="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/><text y="7" text-anchor="middle" font-size="20" font-weight="800" fill="#e07a5f">!</text></g>

  <!-- ASYNC: helper packing sealed cups, phone with order, bicycle -->
  <text x="590" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASYNC</text>
  <path d="M596 420 q-4 -48 12 -54 h48 q16 6 12 54 z" fill="#efe6d2"/>
  <path d="M606 368 q26 -26 52 0" stroke="#b9ad98" stroke-width="5" fill="none"/>
  <use href="#cup" x="616" y="400"/><use href="#cup" x="638" y="400"/><use href="#cup" x="660" y="400"/>
  <rect x="510" y="372" width="30" height="48" rx="5" fill="#3d3a3a"/>
  <rect x="514" y="378" width="22" height="34" rx="2" fill="#fff"/>
  <path d="M517 384 h16 v10 h-10 l-4 4 v-4 h-2 z" fill="#1f6f78"/>
  <path d="M522 402 h8 l-1 6 h-6 z" fill="#e0a33a"/>
  <!-- bicycle -->
  <g fill="none" stroke="#3d3a3a" stroke-width="5">
    <circle cx="560" cy="580" r="30"/><circle cx="660" cy="580" r="30"/>
    <path d="M560 580 l34 -44 h46 l20 44 M594 536 l20 44 l46 -44 M640 536 l-6 -16 h18"/>
  </g>
  <path d="M598 530 h-18" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M690 410 q30 50 -20 110" stroke="#e07a5f" stroke-width="4" stroke-dasharray="8 7" fill="none" marker-end="url(#arr)"/>

  <!-- BATCH: urn, trays of stacked cups, 4 o'clock clock -->
  <text x="836" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BATCH</text>
  <circle cx="880" cy="222" r="24" fill="#fff" stroke="#3d3a3a" stroke-width="4"/>
  <path d="M880 222 v-16 M880 222 l14 8" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <rect x="740" y="254" width="70" height="110" rx="14" fill="#b9ad98"/>
  <rect x="740" y="270" width="70" height="8" fill="#9a9086"/>
  <path d="M810 330 h14 v10" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <rect x="736" y="364" width="78" height="10" rx="4" fill="#6b5446"/>
  <path d="M776 254 q-8 -20 0 -40 M792 254 q8 -22 -2 -40" stroke="#cfc4b0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <rect x="730" y="430" width="186" height="110" rx="6" fill="#8a6d5a"/>
  <g>
    <rect x="740" y="420" width="166" height="10" rx="3" fill="#cbbfa9"/>
    <use href="#cup" x="756" y="420"/><use href="#cup" x="780" y="420"/><use href="#cup" x="804" y="420"/><use href="#cup" x="828" y="420"/><use href="#cup" x="852" y="420"/><use href="#cup" x="876" y="420"/>
    <rect x="740" y="384" width="166" height="10" rx="3" fill="#cbbfa9" transform="translate(0 -0)"/>
  </g>
  <g transform="translate(0 -36)">
    <use href="#cup" x="830" y="420"/><use href="#cup" x="854" y="420"/><use href="#cup" x="878" y="420"/>
  </g>
</svg>
