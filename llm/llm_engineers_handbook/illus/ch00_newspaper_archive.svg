<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Newspaper archive: a clerk collects stories, files originals in the back room, a librarian indexes clippings into a card cabinet</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <path d="M-30 0 l6 -64 h48 l6 64 z" fill="currentColor"/>
      <path d="M-24 -56 v-48 a24 24 0 0 1 48 0 v48 z" fill="currentColor"/>
      <path d="M-18 -124 l40 64" stroke="#fff" stroke-opacity=".35" stroke-width="10"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
      <circle cx="18" cy="-160" r="8" fill="#2e2a2a"/>
    </g>
    <g id="file"><rect x="0" y="0" width="22" height="58" rx="2" fill="#8a6d5a"/><rect x="5" y="8" width="12" height="8" fill="#efe6d2"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- back room panel -->
  <rect x="300" y="96" width="270" height="464" fill="#e6dccb"/>
  <rect x="24" y="560" width="912" height="10" fill="#d8cdb8"/>

  <!-- LEFT: mail slot and three bundles -->
  <rect x="30" y="170" width="120" height="200" rx="6" fill="#d8cdb8"/>
  <rect x="48" y="214" width="84" height="14" rx="4" fill="#3d3a3a"/>
  <g transform="translate(60 248) rotate(-8)"><rect width="56" height="34" rx="3" fill="#fff"/><path d="M28 0 v34 M0 17 h56" stroke="#1f6f78" stroke-width="4"/></g>
  <g transform="translate(70 290) rotate(6)"><rect width="56" height="34" rx="3" fill="#fff"/><path d="M28 0 v34 M0 17 h56" stroke="#e07a5f" stroke-width="4"/></g>
  <g transform="translate(58 330) rotate(-4)"><rect width="56" height="34" rx="3" fill="#fff"/><path d="M28 0 v34 M0 17 h56" stroke="#7a4e7e" stroke-width="4"/></g>

  <!-- clerk with wire basket -->
  <g transform="translate(220 560)">
    <use href="#man" color="#efe6d2"/>
    <path d="M-26 -110 l-10 46 l30 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M26 -110 l12 46 l-30 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="8" cy="-150" r="6"/><path d="M-2 -150 h4"/></g>
    <rect x="-44" y="-74" width="88" height="40" rx="4" fill="none" stroke="#3d3a3a" stroke-width="3"/>
    <path d="M-30 -74 v40 M-14 -74 v40 M2 -74 v40 M18 -74 v40 M34 -74 v40 M-44 -54 h88" stroke="#3d3a3a" stroke-width="1.5"/>
    <rect x="-34" y="-92" width="30" height="20" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
    <rect x="0" y="-90" width="30" height="18" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  </g>
  <text x="200" y="612" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CRAWLER</text>

  <!-- MIDDLE: tall steel shelves with brown files -->
  <text x="435" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DATA WAREHOUSE</text>
  <rect x="322" y="120" width="10" height="440" fill="#9a9086"/>
  <rect x="538" y="120" width="10" height="440" fill="#9a9086"/>
  <g fill="#b9ad98"><rect x="322" y="200" width="226" height="8"/><rect x="322" y="300" width="226" height="8"/><rect x="322" y="400" width="226" height="8"/><rect x="322" y="500" width="226" height="8"/></g>
  <g>
    <use href="#file" x="340" y="142"/><use href="#file" x="364" y="142"/><use href="#file" x="388" y="142"/><use href="#file" x="412" y="142"/><use href="#file" x="436" y="142"/><use href="#file" x="460" y="142"/><use href="#file" x="484" y="142"/><use href="#file" x="508" y="142"/>
    <use href="#file" x="340" y="242"/><use href="#file" x="364" y="242"/><use href="#file" x="388" y="242"/><use href="#file" x="412" y="242"/><use href="#file" x="436" y="242"/><use href="#file" x="460" y="242"/><use href="#file" x="484" y="242"/>
    <use href="#file" x="340" y="342"/><use href="#file" x="364" y="342"/><use href="#file" x="388" y="342"/><use href="#file" x="412" y="342"/><use href="#file" x="436" y="342"/><use href="#file" x="460" y="342"/><use href="#file" x="484" y="342"/><use href="#file" x="508" y="342"/>
    <use href="#file" x="340" y="442"/><use href="#file" x="364" y="442"/><use href="#file" x="388" y="442"/><use href="#file" x="412" y="442"/><use href="#file" x="436" y="442"/>
  </g>
  <!-- one more file sliding in -->
  <g transform="translate(512 236) rotate(-14)"><use href="#file"/></g>

  <!-- RIGHT: librarian at a table cutting clippings -->
  <path d="M700 96 v40" stroke="#3d3a3a" stroke-width="3"/>
  <path d="M672 166 l28 -30 l28 30 z" fill="#1f6f78"/>
  <path d="M676 166 l-26 70 h100 l-26 -70 z" fill="#fff3cf" opacity=".7"/>
  <g transform="translate(690 500)">
    <use href="#woman" color="#1f6f78"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="8" cy="-150" r="6"/><path d="M-2 -150 h4"/></g>
    <path d="M-24 -110 l-14 40 l20 10" stroke="#d9a27a" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M24 -110 l20 36 l16 4" stroke="#d9a27a" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <rect x="590" y="430" width="200" height="16" rx="6" fill="#6b5446"/>
  <rect x="604" y="446" width="14" height="114" fill="#6b5446"/><rect x="762" y="446" width="14" height="114" fill="#6b5446"/>
  <!-- story sheet + scissors + clippings with index cards -->
  <rect x="612" y="404" width="62" height="28" fill="#fff"/>
  <path d="M618 412 h48 M618 420 h36" stroke="#b9ad98" stroke-width="3"/>
  <path d="M640 404 v28" stroke="#e07a5f" stroke-width="2" stroke-dasharray="4 3"/>
  <g transform="translate(756 412) rotate(20)" fill="none" stroke="#3d3a3a" stroke-width="3"><circle cx="0" cy="0" r="6"/><circle cx="0" cy="16" r="6"/><path d="M5 3 l34 10 M5 13 l34 -10"/></g>
  <g transform="translate(700 410)"><rect width="34" height="22" fill="#fff"/><rect x="18" y="-8" width="22" height="14" fill="#fff" stroke="#e0a33a" stroke-width="2"/><circle cx="22" cy="-4" r="2.5" fill="#e07a5f"/></g>

  <!-- card cabinet -->
  <rect x="806" y="300" width="130" height="260" rx="6" fill="#8a6d5a"/>
  <rect x="806" y="300" width="130" height="16" rx="6" fill="#6b5446"/>
  <g fill="#a98a73">
    <rect x="816" y="330" width="52" height="34" rx="3"/><rect x="874" y="330" width="52" height="34" rx="3"/>
    <rect x="816" y="372" width="52" height="34" rx="3"/><rect x="874" y="372" width="52" height="34" rx="3"/>
    <rect x="816" y="414" width="52" height="34" rx="3"/><rect x="874" y="414" width="52" height="34" rx="3"/>
    <rect x="816" y="456" width="52" height="34" rx="3"/><rect x="874" y="456" width="52" height="34" rx="3"/>
    <rect x="816" y="498" width="52" height="34" rx="3"/><rect x="874" y="498" width="52" height="34" rx="3"/>
  </g>
  <g fill="#e0a33a"><circle cx="842" cy="347" r="4"/><circle cx="900" cy="347" r="4"/><circle cx="842" cy="389" r="4"/><circle cx="900" cy="389" r="4"/><circle cx="842" cy="431" r="4"/><circle cx="900" cy="431" r="4"/><circle cx="842" cy="473" r="4"/><circle cx="900" cy="473" r="4"/><circle cx="842" cy="515" r="4"/><circle cx="900" cy="515" r="4"/></g>
  <text x="868" y="290" text-anchor="middle" font-size="25" font-weight="800" fill="#2b2b2b" letter-spacing="1">VECTOR DB</text>

  <!-- inset: reader asks, one drawer opens -->
  <circle cx="852" cy="170" r="76" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <circle cx="812" cy="152" r="16" fill="#b07850"/>
  <path d="M796 150 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
  <path d="M790 210 v-20 a22 22 0 0 1 44 0 v20 z" fill="#e0a33a"/>
  <rect x="826" y="112" width="34" height="22" rx="8" fill="#f6f1e7" stroke="#7a4e7e" stroke-width="2"/>
  <text x="843" y="129" text-anchor="middle" font-size="18" font-weight="800" fill="#7a4e7e">?</text>
  <rect x="858" y="150" width="56" height="58" rx="3" fill="#8a6d5a"/>
  <rect x="852" y="170" width="54" height="20" rx="2" fill="#a98a73"/>
  <rect x="870" y="158" width="26" height="16" fill="#fff" stroke="#e0a33a" stroke-width="2"/>
  <path d="M884 192 l-14 0" stroke="#1f6f78" stroke-width="3" marker-end="url(#arr)"/>

  <!-- flow arrow: slot -> back room -> table -> cabinet -->
  <path d="M150 222 q80 -120 170 -60 M560 260 q50 -70 70 120 M780 418 q20 0 30 -10" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
</svg>
