<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A new kirana shop stocks only the essentials and leaves an empty wall section for later</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sack"><path d="M-22 0 q-8 -34 4 -50 h36 q12 16 4 50 z" fill="#d9c79a"/><path d="M-16 -50 q16 -10 32 0" stroke="#b9ad98" stroke-width="4" fill="none"/><rect x="-10" y="-30" width="20" height="12" rx="2" fill="#e07a5f" opacity=".7"/></g>
    <g id="jar"><rect x="-13" y="-34" width="26" height="34" rx="5" fill="#fff" opacity=".9"/><rect x="-11" y="-20" width="22" height="18" rx="3" fill="#e0a33a"/><rect x="-14" y="-40" width="28" height="7" rx="2" fill="#e07a5f"/></g>
    <g id="oil"><rect x="-9" y="-40" width="18" height="40" rx="5" fill="#f3c46b"/><rect x="-4" y="-50" width="8" height="10" fill="#1f6f78"/><rect x="-9" y="-26" width="18" height="10" fill="#1f6f78"/></g>
    <g id="bisc"><rect x="-10" y="-30" width="20" height="30" rx="2" fill="#e07a5f"/><rect x="-10" y="-22" width="20" height="8" fill="#e0a33a"/></g>
    <g id="brk"><path d="M0 0 v24 h30" stroke="#9a9086" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="0" cy="0" r="4" fill="#3d3a3a"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- half-built blocks behind -->
  <g fill="#e2d8c6"><rect x="30" y="90" width="90" height="230"/><rect x="850" y="60" width="90" height="260"/></g>
  <g stroke="#cbbfa9" stroke-width="3"><path d="M30 150 h90 M30 210 h90 M30 270 h90 M850 120 h90 M850 180 h90 M850 240 h90"/><path d="M60 90 v-30 M910 60 v-30"/></g>
  <rect x="0" y="540" width="960" height="100" fill="#e6dccb"/>

  <!-- shop body -->
  <rect x="140" y="140" width="680" height="400" fill="#7fb7b0"/>
  <rect x="160" y="190" width="640" height="350" fill="#efe6d2"/>
  <rect x="160" y="166" width="640" height="24" fill="#cbbfa9"/>
  <path d="M160 178 h640" stroke="#b9ad98" stroke-width="2"/>
  <!-- MVP board -->
  <rect x="400" y="86" width="160" height="58" rx="6" fill="#1f6f78"/>
  <text x="480" y="128" text-anchor="middle" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="2">MVP</text>
  <rect x="396" y="140" width="168" height="8" fill="#6b5446"/>
  <!-- marigold garland -->
  <path d="M170 196 q155 50 310 0 q155 50 310 0" stroke="#7a9a3a" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="200" cy="205" r="7"/><circle cx="250" cy="215" r="7"/><circle cx="300" cy="220" r="7"/><circle cx="360" cy="220" r="7"/><circle cx="420" cy="212" r="7"/><circle cx="540" cy="212" r="7"/><circle cx="600" cy="220" r="7"/><circle cx="660" cy="220" r="7"/><circle cx="710" cy="215" r="7"/><circle cx="760" cy="205" r="7"/></g>
  <g fill="#e07a5f"><circle cx="225" cy="211" r="6"/><circle cx="275" cy="218" r="6"/><circle cx="330" cy="221" r="6"/><circle cx="390" cy="217" r="6"/><circle cx="570" cy="217" r="6"/><circle cx="630" cy="221" r="6"/><circle cx="685" cy="218" r="6"/><circle cx="735" cy="211" r="6"/></g>

  <!-- shelves: complete but sparse -->
  <g fill="#8a6d5a"><rect x="250" y="290" width="320" height="8"/><rect x="250" y="370" width="320" height="8"/></g>
  <use href="#bisc" x="280" y="290"/><use href="#bisc" x="306" y="290"/><use href="#bisc" x="332" y="290"/><use href="#bisc" x="358" y="290"/>
  <use href="#oil" x="440" y="290"/><use href="#oil" x="466" y="290"/><use href="#oil" x="492" y="290"/>
  <use href="#jar" x="290" y="370"/><use href="#jar" x="326" y="370"/><use href="#jar" x="362" y="370"/>
  <use href="#sack" x="470" y="370"/><use href="#sack" x="530" y="370"/>
  <!-- small fridge with milk -->
  <rect x="176" y="256" width="62" height="174" rx="6" fill="#ffffff"/>
  <rect x="182" y="266" width="50" height="80" rx="3" fill="#d8eef0"/>
  <g fill="#fff" stroke="#1f6f78" stroke-width="2"><rect x="188" y="300" width="12" height="18" rx="2"/><rect x="204" y="300" width="12" height="18" rx="2"/><rect x="220" y="300" width="10" height="18" rx="2"/></g>

  <!-- empty wall section with bare brackets -->
  <rect x="603" y="228" width="192" height="150" rx="6" fill="#f6f1e7" stroke="#d8cdb8" stroke-width="2" stroke-dasharray="7 6"/>
  <use href="#brk" x="636" y="286"/><use href="#brk" x="736" y="286"/>
  <use href="#brk" x="636" y="334"/><use href="#brk" x="736" y="334"/>
  <text x="698" y="270" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">ADD LATER</text>

  <!-- owner behind counter handing bag -->
  <g transform="translate(430 500)">
    <use href="#man" color="#ffffff"/>
    <path d="M-26 -104 l26 34 v-30" fill="#4a3f55"/>
    <path d="M-26 -60 v-44 l26 34 l26 -34 v44 z" fill="#7a4e7e"/>
    <path d="M-12 -138 q12 8 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M26 -108 l64 10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-26 -108 l-12 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- counter with QR stand, phone, notebook -->
  <rect x="200" y="440" width="380" height="100" rx="6" fill="#8a6d5a"/>
  <rect x="200" y="440" width="380" height="14" rx="6" fill="#6b5446"/>
  <rect x="240" y="400" width="36" height="40" rx="3" fill="#fff" stroke="#3d3a3a" stroke-width="2"/>
  <g fill="#3d3a3a"><rect x="246" y="406" width="9" height="9"/><rect x="262" y="406" width="9" height="9"/><rect x="246" y="422" width="9" height="9"/><rect x="261" y="421" width="4" height="4"/><rect x="266" y="427" width="4" height="4"/></g>
  <rect x="300" y="420" width="44" height="20" rx="2" fill="#e0a33a"/><path d="M322 420 v20" stroke="#b7802a" stroke-width="2"/>
  <rect x="356" y="414" width="20" height="26" rx="3" fill="#3d3a3a"/><path d="M360 420 h12 v8 h-8 l-3 3 z" fill="#7fb7b0"/>
  <!-- cloth bag with rice, milk, biscuits -->
  <path d="M480 440 q-6 -44 10 -50 h50 q16 6 10 50 z" fill="#1f6f78"/>
  <path d="M492 390 q22 -26 44 0" stroke="#1f6f78" stroke-width="5" fill="none"/>
  <rect x="496" y="374" width="16" height="22" rx="3" fill="#fff" stroke="#1f6f78" stroke-width="2"/>
  <rect x="516" y="376" width="14" height="20" rx="2" fill="#e07a5f"/>

  <!-- young mother with toddler -->
  <g transform="translate(640 560)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-16 0 v-50 h32 v50 z" fill="#efe6d2"/>
    <path d="M-28 -40 l4 -64 a24 24 0 0 1 48 0 l4 64 z" fill="#e07a5f"/>
    <path d="M-22 -122 q22 26 44 0" stroke="#e0a33a" stroke-width="8" fill="none"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
    <circle cx="18" cy="-160" r="8" fill="#2e2a2a"/>
    <path d="M-24 -104 l-70 -14" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M24 -100 l20 50" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(700 560)">
    <ellipse cx="0" cy="2" rx="18" ry="4" fill="#000" opacity=".08"/>
    <rect x="-10" y="-30" width="8" height="30" rx="3" fill="#4a3f55"/><rect x="2" y="-30" width="8" height="30" rx="3" fill="#4a3f55"/>
    <path d="M-14 -28 v-26 a14 14 0 0 1 28 0 v26 z" fill="#e0a33a"/>
    <circle cx="0" cy="-74" r="13" fill="#d9a27a"/><path d="M-13 -76 a13 13 0 0 1 26 0 z" fill="#2e2a2a"/>
    <path d="M-12 -50 l-12 -2" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- ghosted: left out on purpose -->
  <g fill="none" stroke="#9a9086" stroke-width="3" stroke-dasharray="7 6" opacity=".7">
    <rect x="34" y="400" width="86" height="136" rx="6"/><path d="M34 440 h86 M48 420 h20"/>
    <circle cx="858" cy="520" r="18"/><circle cx="926" cy="520" r="18"/>
    <path d="M858 520 q10 -50 40 -46 l20 46 M890 474 l-6 -26 h18 M840 470 h40 v30"/>
  </g>
</svg>
