<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mimic who learned only from TV broadcasts nails the stage act but has nothing to say at a family dinner</title>
  <defs>
    <g id="artist">
      <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
      <rect x="-19" y="-62" width="16" height="62" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-62" width="16" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-30 -60 v-44 a30 28 0 0 1 60 0 v44 z" fill="#2f5d8c"/>
      <path d="M-6 -130 l6 30 l6 -30 z" fill="#fff"/>
      <g fill="#cfe0f2"><circle cx="-18" cy="-96" r="2"/><circle cx="-10" cy="-80" r="2"/><circle cx="16" cy="-90" r="2"/><circle cx="20" cy="-72" r="2"/><circle cx="-20" cy="-70" r="2"/><circle cx="10" cy="-106" r="2"/></g>
      <rect x="-7" y="-136" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-152" r="21" fill="#b07850"/>
      <path d="M-21 -156 a21 21 0 0 1 42 0 z" fill="#2e2a2a"/>
      <path d="M-9 -144 q9 -5 18 0" stroke="#2e2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>
    <g id="aud"><circle cx="0" cy="-30" r="16" fill="#3d3a3a" opacity=".55"/><path d="M-24 10 v-14 a24 20 0 0 1 48 0 v14 z" fill="#3d3a3a" opacity=".55"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="0" width="480" height="640" fill="#efe7d6"/>
  <rect x="480" y="0" width="480" height="640" fill="#f8ecd0"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: stage -->
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BROADCAST SIDE</text>
  <path d="M300 96 l-90 440 h200 z" fill="#fff6d8" opacity=".8"/>
  <path d="M300 92 l-10 -6 h20 z" fill="#3d3a3a"/>
  <!-- TV with cricket -->
  <rect x="34" y="110" width="210" height="150" rx="8" fill="#3d3a3a"/>
  <rect x="44" y="120" width="190" height="130" fill="#6fae7b"/>
  <rect x="120" y="150" width="34" height="96" fill="#d9c79a"/>
  <rect x="92" y="236" width="60" height="6" fill="#4a3f55"/>
  <g transform="translate(140 222)">
    <circle cx="0" cy="-48" r="8" fill="#fff"/>
    <path d="M-8 -38 h16 v26 h-16 z" fill="#fff"/>
    <path d="M-6 -12 l-6 16 M6 -12 l6 16" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <path d="M8 -34 l22 -18" stroke="#e0a33a" stroke-width="6" stroke-linecap="round"/>
  </g>
  <circle cx="200" cy="168" r="5" fill="#e07a5f"/>
  <rect x="124" y="260" width="30" height="20" fill="#3d3a3a"/>
  <!-- learning line from TV into head -->
  <path d="M244 170 q60 -10 66 74" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <!-- confident artist leaning forward -->
  <rect x="200" y="530" width="270" height="14" fill="#8a6d5a"/>
  <g transform="translate(320 530) rotate(6)">
    <use href="#artist"/>
    <path d="M-30 -110 l-30 30 l-4 34" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M28 -110 l18 -26 l-24 -20" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M-20 -168 q20 -18 40 0" stroke="#3d3a3a" stroke-width="4" fill="none"/>
    <path d="M-20 -160 l8 20 h12" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    <circle cx="2" cy="-140" r="4" fill="#3d3a3a"/>
    <path d="M-6 -136 q6 8 12 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <!-- laughing audience -->
  <use href="#aud" x="60" y="610"/><use href="#aud" x="120" y="618"/><use href="#aud" x="180" y="610"/><use href="#aud" x="400" y="616"/>
  <path d="M40 568 q8 10 20 0 M100 576 q8 10 20 0 M160 568 q8 10 20 0" stroke="#e0a33a" stroke-width="3" fill="none"/>

  <!-- RIGHT: family dinner -->
  <!-- faint real commentator laughing at head of table -->
  <g opacity=".35" fill="none" stroke="#7a4e7e" stroke-width="3" stroke-dasharray="6 5">
    <circle cx="880" cy="292" r="20"/>
    <path d="M854 430 v-80 a26 26 0 0 1 52 0 v80"/>
    <path d="M870 298 q10 8 20 0"/>
  </g>
  <!-- aunt in a shawl with spoon raised -->
  <g transform="translate(770 470)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-28 0 v-92 a28 28 0 0 1 56 0 v92 z" fill="#7a4e7e"/>
    <path d="M-30 -110 q30 30 60 0 v20 q-30 30 -60 0 z" fill="#e0a33a"/>
    <rect x="-7" y="-130" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-146" r="19" fill="#d9a27a"/>
    <path d="M-22 -140 a22 24 0 0 1 44 0 v-6 a22 22 0 0 0 -44 0 z" fill="#efe6d2"/>
    <path d="M-20 -150 a20 18 0 0 1 40 0 z" fill="#b9ad98"/>
    <path d="M-28 -100 l-26 -36" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-56 -138 l-4 -30" stroke="#9a9086" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="-61" cy="-172" rx="8" ry="5" fill="#9a9086"/>
  </g>
  <!-- table with food -->
  <rect x="540" y="440" width="390" height="18" rx="6" fill="#8a6d5a"/>
  <rect x="560" y="458" width="14" height="110" fill="#6b5446"/><rect x="896" y="458" width="14" height="110" fill="#6b5446"/>
  <ellipse cx="700" cy="436" rx="38" ry="8" fill="#fff"/>
  <ellipse cx="700" cy="430" rx="26" ry="6" fill="#e0a33a"/><ellipse cx="702" cy="426" rx="24" ry="5" fill="#f3c46b"/>
  <ellipse cx="790" cy="436" rx="34" ry="8" fill="#fff"/>
  <path d="M770 432 q20 -18 40 0 z" fill="#fffaf0" stroke="#e6dccb" stroke-width="2"/>
  <path d="M846 438 q14 16 30 0 z" fill="#b9ad98"/>
  <ellipse cx="861" cy="436" rx="16" ry="4" fill="#e0a33a"/>
  <!-- frozen artist, sweating -->
  <g transform="translate(600 540)">
    <use href="#artist"/>
    <path d="M-30 -108 l-6 52" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <path d="M28 -108 l6 52" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <circle cx="-7" cy="-155" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-155" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-136" rx="4" ry="5" fill="#2e2a2a"/>
    <path d="M24 -168 q4 8 0 12 q-4 -4 0 -12 z M-26 -158 q4 8 0 12 q-4 -4 0 -12 z" fill="#8fc3d6"/>
  </g>
  <!-- empty thought bubble -->
  <circle cx="606" cy="358" r="7" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="620" cy="330" r="11" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <ellipse cx="650" cy="230" rx="96" ry="72" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <text x="650" y="246" text-anchor="middle" font-size="40" font-weight="800" fill="#cbbfa9">?</text>
  <text x="762" y="244" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO DATA</text>
</svg>
