<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Railway story of feature, training and inference pipelines: chart printed, TTEs trained, TTE checks tickets from the chart</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="tte">
      <use href="#man" color="#2b2b2b"/>
      <path d="M-6 -128 l6 26 l6 -26 z" fill="#fff"/>
    </g>
    <g id="desk"><rect x="-40" y="0" width="80" height="12" rx="3" fill="#8a6d5a"/><rect x="-34" y="12" width="8" height="50" fill="#6b5446"/><rect x="26" y="12" width="8" height="50" fill="#6b5446"/><rect x="-14" y="-6" width="26" height="8" fill="#fff"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="640" y="96" width="320" height="544" fill="#e9eef0"/>
  <line x1="320" y1="30" x2="320" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <line x1="640" y1="30" x2="640" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="160" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">FEATURE</text>
  <text x="480" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRAINING</text>
  <text x="800" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">INFERENCE</text>

  <!-- LEFT: printing and pasting the chart -->
  <rect x="150" y="150" width="150" height="190" rx="6" fill="#8a6d5a"/>
  <rect x="162" y="162" width="126" height="166" fill="#fff"/>
  <g stroke="#b9ad98" stroke-width="4"><path d="M172 182 h106 M172 202 h90 M172 222 h106 M172 242 h70 M172 262 h106 M172 282 h96 M172 302 h80"/></g>
  <rect x="24" y="420" width="140" height="12" rx="4" fill="#8a6d5a"/>
  <rect x="34" y="432" width="10" height="128" fill="#6b5446"/><rect x="144" y="432" width="10" height="128" fill="#6b5446"/>
  <rect x="40" y="378" width="96" height="42" rx="6" fill="#b9ad98"/>
  <rect x="52" y="372" width="72" height="8" fill="#3d3a3a"/>
  <path d="M88 372 l-4 -20 l12 -10 l-12 -10 l12 -10 l-10 -10" stroke="#fff" stroke-width="10" fill="none" stroke-linejoin="round"/>
  <path d="M136 402 h18 v18" stroke="#fff" stroke-width="10" fill="none"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="1.5"><rect x="140" y="408" width="22" height="10"/><rect x="142" y="400" width="22" height="10"/></g>
  <g transform="translate(90 560)">
    <use href="#man" color="#9a9086"/>
    <path d="M-26 -106 l-6 46 M26 -106 l16 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g transform="translate(250 560)">
    <use href="#man" color="#7a4e7e"/>
    <path d="M-26 -106 l-20 -78 M26 -106 l10 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- MIDDLE: instructor and three trainee TTEs -->
  <rect x="352" y="112" width="140" height="120" rx="4" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <g stroke="#1f6f78" stroke-width="4" stroke-linecap="round"><path d="M368 136 h10 M388 136 h88 M368 160 h10 M388 160 h70 M368 184 h10 M388 184 h82 M368 208 h10 M388 208 h56"/></g>
  <g transform="translate(580 470)">
    <use href="#man" color="#1f6f78"/>
    <path d="M-20 -160 a20 14 0 0 1 40 0 z" fill="#d8cdb8"/>
    <path d="M-26 -108 l-56 -70" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-82 -178 l-14 -14" stroke="#6b5446" stroke-width="4" stroke-linecap="round"/>
    <path d="M26 -108 l6 44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <use href="#tte" transform="translate(372 512) scale(.75)"/>
  <use href="#tte" transform="translate(452 512) scale(.75)"/>
  <use href="#tte" transform="translate(532 512) scale(.75)"/>
  <use href="#desk" x="372" y="470"/><use href="#desk" x="452" y="470"/><use href="#desk" x="532" y="470"/>

  <!-- RIGHT: sleeper coach -->
  <rect x="660" y="120" width="280" height="80" rx="10" fill="#d8eef0"/>
  <path d="M800 120 v80" stroke="#e9eef0" stroke-width="8"/>
  <rect x="800" y="250" width="140" height="22" rx="6" fill="#2f5d8c"/>
  <rect x="800" y="420" width="140" height="40" rx="8" fill="#2f5d8c"/>
  <rect x="920" y="250" width="14" height="300" fill="#9a9086"/>
  <!-- disconnected phone -->
  <rect x="680" y="226" width="80" height="8" fill="#8a6d5a"/>
  <rect x="694" y="204" width="44" height="22" rx="6" fill="#3d3a3a"/>
  <path d="M690 202 q26 -18 52 0" stroke="#3d3a3a" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M716 226 q-4 26 -20 34 q-12 6 -8 18" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <path d="M682 268 l16 16 M698 268 l-16 16" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <!-- passenger on berth -->
  <g transform="translate(880 470)">
    <path d="M-24 -40 v-50 a24 24 0 0 1 48 0 v50 z" fill="#e0a33a"/>
    <path d="M-16 -40 h-40 v70 M-4 -40 h-40 v70" stroke="#4a3f55" stroke-width="13" fill="none" stroke-linecap="round"/>
    <rect x="-7" y="-122" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-136" r="19" fill="#b07850"/>
    <path d="M-19 -140 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -86 l-34 10" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <rect x="-70" y="-86" width="20" height="12" rx="2" fill="#fff" stroke="#e07a5f" stroke-width="2"/>
  </g>
  <!-- TTE with clipboard -->
  <g transform="translate(750 560)">
    <use href="#tte"/>
    <rect x="-12" y="-108" width="22" height="8" rx="2" fill="#e0a33a"/>
    <path d="M-26 -106 l10 40 l30 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M26 -106 l30 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <rect x="764" y="440" width="44" height="58" rx="4" fill="#8a6d5a" transform="rotate(-10 786 469)"/>
  <rect x="770" y="448" width="32" height="44" fill="#fff" transform="rotate(-10 786 469)"/>
  <g stroke="#b9ad98" stroke-width="3" transform="rotate(-10 786 469)"><path d="M774 458 h24 M774 468 h20 M774 478 h24"/></g>

  <!-- arrows -->
  <path d="M296 156 Q520 70 770 440" stroke="#e07a5f" stroke-width="7" fill="none" marker-end="url(#arr)"/>
  <path d="M600 280 Q680 280 724 380" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arrp)"/>
</svg>
