<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Wedding catering: more choppers and more counters scale out, the one biryani handi scales up</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="chopper">
      <ellipse cx="0" cy="2" rx="40" ry="6" fill="#000" opacity=".08"/>
      <rect x="-40" y="-18" width="80" height="18" rx="9" fill="#4a3f55"/>
      <path d="M-24 -14 v-44 a24 24 0 0 1 48 0 v44 z" fill="#fff"/>
      <rect x="-6" y="-86" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-100" r="18" fill="#b07850"/>
      <path d="M-18 -104 a18 18 0 0 1 36 0 z" fill="#fff"/>
      <path d="M-20 -62 l10 40 M20 -62 l18 32" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
      <rect x="0" y="-26" width="56" height="10" rx="3" fill="#8a6d5a"/>
      <circle cx="20" cy="-30" r="5" fill="#e07a5f"/><circle cx="32" cy="-30" r="4" fill="#7a4e7e"/><circle cx="44" cy="-30" r="4" fill="#5c9a5c"/>
    </g>
    <g id="counter"><rect x="0" y="0" width="80" height="80" rx="4" fill="#fff"/><rect x="0" y="0" width="80" height="14" fill="#e07a5f"/><ellipse cx="22" cy="-6" rx="16" ry="7" fill="#9a9086"/><ellipse cx="58" cy="-6" rx="16" ry="7" fill="#9a9086"/><ellipse cx="22" cy="-9" rx="12" ry="4" fill="#e0a33a"/><ellipse cx="58" cy="-9" rx="12" ry="4" fill="#5c9a5c"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>
  <!-- fairy lights -->
  <path d="M20 120 q230 50 460 0 q230 50 460 0" stroke="#7a4e7e" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="60" cy="129" r="5"/><circle cx="140" cy="140" r="5"/><circle cx="220" cy="145" r="5"/><circle cx="300" cy="144" r="5"/><circle cx="380" cy="137" r="5"/><circle cx="580" cy="137" r="5"/><circle cx="660" cy="144" r="5"/><circle cx="740" cy="145" r="5"/><circle cx="820" cy="140" r="5"/><circle cx="900" cy="129" r="5"/></g>
  <text x="160" y="76" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCALE OUT</text>
  <text x="480" y="76" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCALE UP</text>
  <text x="800" y="76" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCALE OUT</text>

  <!-- LEFT: row of choppers + newcomer -->
  <use href="#chopper" x="60" y="540"/>
  <use href="#chopper" x="160" y="540"/>
  <g transform="translate(270 540)">
    <use href="#man" color="#ffffff" transform="scale(.85)"/>
    <path d="M-20 -128 a17 17 0 0 1 34 0 z" fill="#fff" transform="translate(0 0)"/>
    <path d="M-22 -92 l-20 30 M22 -92 l-20 30" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
    <rect x="-52" y="-66" width="60" height="10" rx="3" fill="#8a6d5a"/>
  </g>
  <g fill="#1f6f78" font-size="26" font-weight="800"><text x="282" y="350">+</text><text x="300" y="380">+</text></g>
  <path d="M30 590 h260" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>

  <!-- CENTRE: giant sealed handi on a big stove, small one faded behind -->
  <g opacity=".35">
    <rect x="340" y="420" width="70" height="40" rx="4" fill="#6b5446"/>
    <ellipse cx="375" cy="404" rx="30" ry="22" fill="#b8663f"/><rect x="360" y="374" width="30" height="10" rx="3" fill="#a1552f"/>
  </g>
  <path d="M376 360 v-120" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>
  <rect x="400" y="460" width="200" height="100" rx="8" fill="#3d3a3a"/>
  <rect x="420" y="500" width="160" height="14" rx="7" fill="#e07a5f" opacity=".85"/>
  <ellipse cx="500" cy="392" rx="112" ry="86" fill="#b8663f"/>
  <ellipse cx="470" cy="370" rx="50" ry="40" fill="#c97a50" opacity=".6"/>
  <rect x="440" y="296" width="120" height="28" rx="8" fill="#a1552f"/>
  <path d="M434 300 q66 -16 132 0" stroke="#efe6d2" stroke-width="12" fill="none" stroke-linecap="round"/>
  <ellipse cx="500" cy="292" rx="68" ry="12" fill="#a1552f"/>
  <rect x="490" y="268" width="20" height="16" rx="5" fill="#a1552f"/>
  <path d="M480 260 q-10 -20 0 -40 M520 260 q10 -22 0 -40" stroke="#cfc4b0" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- head cook pointing -->
  <g transform="translate(622 560)">
    <use href="#man" color="#ffffff"/>
    <path d="M-20 -60 v-50 h40 v50 z" fill="#efe6d2"/>
    <path d="M-12 -138 q12 -6 24 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-26 -108 l-36 -24" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l4 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- RIGHT: counters, third being opened -->
  <use href="#counter" x="672" y="440"/>
  <use href="#counter" x="764" y="440"/>
  <rect x="856" y="440" width="80" height="80" rx="4" fill="#fff"/>
  <rect x="856" y="440" width="80" height="14" fill="#e07a5f"/>
  <path d="M856 436 q40 -30 70 -80 l14 10 q-30 50 -60 74 z" fill="#efe6d2" stroke="#d8cdb8" stroke-width="2"/>
  <g transform="translate(910 612) scale(.85)">
    <use href="#man" color="#ffffff"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 10 -18 l14 30 l14 -30 a24 24 0 0 1 10 18 v42 z" fill="#8a2f3a"/>
    <path d="M-26 -108 l-14 -58" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- guest queue -->
  <g opacity=".45" fill="#9a9086"><circle cx="672" cy="590" r="12"/><path d="M656 640 v-24 a16 16 0 0 1 32 0 v24 z"/><circle cx="720" cy="594" r="12"/><path d="M704 640 v-20 a16 16 0 0 1 32 0 v20 z"/></g>
  <g transform="translate(780 620) scale(.8)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-30 0 l6 -64 h48 l6 64 z" fill="#e0a33a"/>
    <path d="M-24 -56 v-48 a24 24 0 0 1 48 0 v48 z" fill="#e07a5f"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
  </g>
  <path d="M672 396 h170" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>
</svg>
