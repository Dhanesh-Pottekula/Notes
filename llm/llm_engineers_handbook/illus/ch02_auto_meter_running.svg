<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An auto-rickshaw meter keeps running while the passenger shops; a friend calls when it crosses 500</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="540" width="960" height="100" fill="#cbbfa9"/>
  <rect x="0" y="530" width="960" height="12" fill="#b9ad98"/>

  <!-- CENTRE: saree showroom with passenger browsing -->
  <rect x="380" y="150" width="270" height="380" fill="#8a6d5a"/>
  <rect x="396" y="220" width="238" height="310" fill="#d8eef0"/>
  <g>
    <rect x="410" y="240" width="210" height="8" fill="#8a6d5a"/><rect x="410" y="320" width="210" height="8" fill="#8a6d5a"/>
    <rect x="416" y="208" width="26" height="32" fill="#e07a5f"/><rect x="446" y="212" width="26" height="28" fill="#7a4e7e"/><rect x="476" y="208" width="26" height="32" fill="#e0a33a"/><rect x="506" y="212" width="26" height="28" fill="#1f6f78"/><rect x="536" y="208" width="26" height="32" fill="#e07a5f"/><rect x="566" y="212" width="26" height="28" fill="#5c9a5c"/>
    <rect x="416" y="290" width="26" height="30" fill="#5c9a5c"/><rect x="446" y="288" width="26" height="32" fill="#e0a33a"/><rect x="476" y="290" width="26" height="30" fill="#7a4e7e"/><rect x="506" y="288" width="26" height="32" fill="#e07a5f"/><rect x="536" y="290" width="26" height="30" fill="#1f6f78"/><rect x="566" y="288" width="26" height="32" fill="#e0a33a"/>
  </g>
  <!-- passenger, back to the street -->
  <g transform="translate(510 500) scale(.95)">
    <use href="#man" color="#1f6f78"/>
    <path d="M-20 -150 a20 20 0 0 1 40 0 v4 h-40 z" fill="#2e2a2a"/>
    <path d="M-20 -118 l40 50" stroke="#3d3a3a" stroke-width="4"/>
    <rect x="12" y="-80" width="34" height="38" rx="4" fill="#3d3a3a"/>
    <path d="M-26 -108 l-14 -60 M26 -108 l-6 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <path d="M396 220 l90 310 M520 220 l110 310" stroke="#fff" stroke-width="10" opacity=".35"/>
  <!-- clock with trails -->
  <circle cx="515" cy="114" r="30" fill="#fff" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M515 114 v-20 M515 114 l14 8" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 92 a48 48 0 0 0 0 44 M456 82 a64 64 0 0 0 0 64 M560 92 a48 48 0 0 1 0 44 M574 82 a64 64 0 0 1 0 64" stroke="#b9ad98" stroke-width="3" fill="none"/>

  <!-- LEFT: parked auto with dozing driver -->
  <path d="M60 330 q10 -80 110 -84 h120 q30 0 40 30 v54 z" fill="#e0a33a"/>
  <path d="M48 330 h300 v150 q0 20 -20 20 h-260 q-20 0 -20 -20 z" fill="#5c9a5c"/>
  <rect x="118" y="330" width="120" height="120" fill="#3d3a3a" opacity=".85"/>
  <rect x="48" y="420" width="300" height="10" fill="#3d3a3a" opacity=".3"/>
  <circle cx="110" cy="510" r="30" fill="#3d3a3a"/><circle cx="110" cy="510" r="11" fill="#b9ad98"/>
  <circle cx="300" cy="510" r="30" fill="#3d3a3a"/><circle cx="300" cy="510" r="11" fill="#b9ad98"/>
  <text x="196" y="306" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ENDPOINT</text>
  <!-- driver dozing, feet up on handlebar -->
  <circle cx="160" cy="370" r="18" fill="#b07850"/>
  <path d="M142 372 q18 26 36 0 q0 22 -18 22 q-18 0 -18 -22 z" fill="#d8cdb8"/>
  <path d="M142 366 a18 18 0 0 1 36 0 z" fill="#b9ad98"/>
  <path d="M150 392 h40 v50 h-40 z" fill="#b39a6a"/>
  <path d="M184 418 l54 -32 h28" stroke="#4a3f55" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M260 372 l14 -12" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <g fill="#7a4e7e" font-size="20" font-weight="800"><text x="186" y="352">z</text><text x="200" y="336">z</text></g>
  <!-- meter on the side with sticker -->
  <rect x="264" y="350" width="72" height="56" rx="6" fill="#3d3a3a"/>
  <rect x="272" y="358" width="56" height="22" rx="3" fill="#e07a5f"/>
  <rect x="276" y="384" width="50" height="18" rx="3" fill="#fff"/>
  <text x="301" y="398" text-anchor="middle" font-size="14" font-weight="800" fill="#2b2b2b">₹500</text>
  <!-- magnified meter digits -->
  <path d="M312 350 v-112" stroke="#7a4e7e" stroke-width="3" stroke-dasharray="5 5"/>
  <circle cx="290" cy="150" r="84" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="226" y="122" width="128" height="64" rx="8" fill="#3d3a3a"/>
  <text x="290" y="168" text-anchor="middle" font-size="40" font-weight="800" fill="#e07a5f" letter-spacing="3">512</text>
  <path d="M236 100 l12 8 M272 92 v12 M308 92 v12 M344 100 l-12 8" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  <path d="M234 92 v-0" stroke="none"/>

  <!-- RIGHT: inset of friend calling -->
  <rect x="684" y="150" width="252" height="270" rx="22" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="704" y="350" width="212" height="12" rx="4" fill="#8a6d5a"/>
  <rect x="770" y="300" width="70" height="46" rx="4" fill="#3d3a3a"/>
  <g transform="translate(790 352)">
    <path d="M-24 0 v-54 a24 24 0 0 1 48 0 v54 z" fill="#e07a5f"/>
    <rect x="-7" y="-80" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-96" r="20" fill="#d9a27a"/>
    <path d="M-21 -96 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
    <circle cx="-16" cy="-106" r="8" fill="#2e2a2a"/>
    <circle cx="-6" cy="-98" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-98" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-86" rx="4" ry="5" fill="#2e2a2a"/>
    <path d="M24 -50 l10 -40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <rect x="26" y="-110" width="14" height="26" rx="3" fill="#3d3a3a"/>
  </g>
  <g transform="translate(880 210)">
    <path d="M-18 14 q0 -30 18 -30 q18 0 18 30 l6 8 h-48 z" fill="#e0a33a"/>
    <circle cx="0" cy="26" r="5" fill="#e0a33a"/>
    <path d="M-30 -14 q-8 12 0 24 M30 -14 q8 12 0 24" stroke="#e07a5f" stroke-width="3" fill="none"/>
  </g>
  <text x="810" y="470" text-anchor="middle" font-size="29" font-weight="800" fill="#2b2b2b" letter-spacing="1">BILLING ALARM</text>
</svg>
