<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A catering truck carries a whole kitchen; open the doors and it is running</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="wheel"><circle r="30" fill="#3d3a3a"/><circle r="12" fill="#b9ad98"/></g>
    <g id="flame"><path d="M0 0 q-10 -12 0 -26 q10 14 0 26 z" fill="#4f8fd6"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="540" width="960" height="100" fill="#d9dfc0"/>
  <!-- fairy lights -->
  <path d="M340 40 q300 50 600 0" stroke="#7a4e7e" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="380" cy="50" r="5"/><circle cx="460" cy="62" r="5"/><circle cx="540" cy="68" r="5"/><circle cx="620" cy="70" r="5"/><circle cx="700" cy="67" r="5"/><circle cx="780" cy="61" r="5"/><circle cx="860" cy="52" r="5"/></g>
  <!-- ghost of the big banquet kitchen -->
  <g fill="none" stroke="#b9ad98" stroke-width="3" stroke-dasharray="8 7" opacity=".8">
    <rect x="360" y="110" width="560" height="400"/>
    <path d="M360 110 l60 -20 h440 l60 20 M820 90 v-40 h40 v40"/>
  </g>

  <!-- truck body -->
  <rect x="340" y="200" width="430" height="300" rx="10" fill="#ffffff"/>
  <path d="M770 280 h70 q40 0 60 40 l20 50 v130 h-150 z" fill="#ffffff"/>
  <path d="M790 296 h46 q28 0 40 30 l12 34 h-98 z" fill="#d8eef0"/>
  <rect x="340" y="480" width="580" height="22" rx="6" fill="#9a9086"/>
  <use href="#wheel" x="430" y="510"/><use href="#wheel" x="830" y="510"/>
  <!-- side door raised like an awning -->
  <path d="M360 214 h390 l30 -60 h-450 z" fill="#efe6d2"/>
  <path d="M330 154 h450" stroke="#cbbfa9" stroke-width="4"/>
  <!-- kitchen inside -->
  <rect x="360" y="214" width="390" height="250" fill="#e6dccb"/>
  <path d="M380 236 h350" stroke="#9a9086" stroke-width="4"/>
  <g stroke="#9a9086" stroke-width="3"><path d="M410 236 v30 M440 236 v38 M470 236 v26 M500 236 v34"/></g>
  <g fill="#9a9086"><ellipse cx="410" cy="270" rx="8" ry="5"/><ellipse cx="440" cy="278" rx="9" ry="5"/><ellipse cx="470" cy="266" rx="7" ry="5"/><path d="M486 270 q14 18 28 0 z"/></g>
  <!-- stoves -->
  <rect x="380" y="380" width="200" height="84" fill="#3d3a3a"/>
  <use href="#flame" x="430" y="380"/><use href="#flame" x="530" y="380"/>
  <path d="M400 360 q30 26 60 0 z" fill="#5a5552"/><path d="M500 360 q30 26 60 0 z" fill="#5a5552"/>
  <ellipse cx="430" cy="360" rx="34" ry="5" fill="#e0a33a"/><ellipse cx="530" cy="360" rx="34" ry="5" fill="#e07a5f"/>
  <!-- cold cabinet -->
  <rect x="600" y="270" width="80" height="194" rx="4" fill="#cfe3ea"/>
  <rect x="610" y="282" width="60" height="80" fill="#eef6f8" opacity=".8"/><rect x="610" y="372" width="60" height="80" fill="#eef6f8" opacity=".8"/>
  <!-- plates and water drum -->
  <g fill="#b9ad98"><rect x="550" y="282" width="36" height="6" rx="3"/><rect x="550" y="290" width="36" height="6" rx="3"/><rect x="550" y="298" width="36" height="6" rx="3"/><rect x="550" y="306" width="36" height="6" rx="3"/></g>
  <rect x="694" y="380" width="46" height="84" rx="10" fill="#1f6f78"/>
  <rect x="694" y="404" width="46" height="6" fill="#165860"/>

  <!-- rear doors swung open -->
  <path d="M340 200 l-70 26 v250 l70 22 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="3"/>
  <path d="M290 230 v236" stroke="#cbbfa9" stroke-width="3"/>
  <!-- UP label + arrow -->
  <text x="214" y="296" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">UP</text>
  <path d="M214 380 v-60" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>
  <!-- rear step + caterer ready -->
  <rect x="300" y="500" width="70" height="12" fill="#6b5446"/>
  <g transform="translate(336 500) scale(.95)">
    <use href="#man" color="#ffffff"/>
    <path d="M-6 -128 v60 M6 -128 v60" stroke="#cbbfa9" stroke-width="3"/>
    <rect x="-21" y="-170" width="42" height="10" rx="5" fill="#e07a5f"/>
    <path d="M-26 -108 l-44 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l44 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-10 -140 q10 8 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>

  <!-- helpers carrying a steaming vessel to the buffet -->
  <rect x="24" y="500" width="90" height="12" rx="4" fill="#e07a5f"/>
  <rect x="30" y="512" width="8" height="48" fill="#6b5446"/><rect x="100" y="512" width="8" height="48" fill="#6b5446"/>
  <use href="#man" color="#1f6f78" transform="translate(150 600) scale(.8)"/>
  <use href="#man" color="#7a4e7e" transform="translate(250 600) scale(.8)"/>
  <path d="M170 516 h60 v-6 q-30 -8 -60 0 z" fill="#9a9086"/>
  <path d="M168 516 q32 40 64 0 z" fill="#b9ad98"/>
  <path d="M190 498 q-8 -16 0 -30 M210 498 q8 -16 0 -30" stroke="#cfc4b0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M168 520 l-4 -6 M232 520 l4 -6" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>

  <!-- inset: truck closed on the highway -->
  <rect x="24" y="24" width="300" height="220" rx="22" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M40 190 h268" stroke="#9a9086" stroke-width="5"/>
  <path d="M40 210 h30 M100 210 h30 M160 210 h30 M220 210 h30" stroke="#cbbfa9" stroke-width="4"/>
  <rect x="44" y="76" width="216" height="98" rx="6" fill="#efe6d2"/>
  <path d="M260 106 h22 q14 0 20 14 l6 22 v32 h-48 z" fill="#efe6d2"/>
  <path d="M266 112 h14 q8 0 12 10 l3 10 h-29 z" fill="#d8eef0"/>
  <circle cx="90" cy="180" r="14" fill="#3d3a3a"/><circle cx="270" cy="180" r="14" fill="#3d3a3a"/>
  <text x="152" y="133" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">DOCKER IMAGE</text>
  <path d="M28 120 h10 M24 140 h12" stroke="#cbbfa9" stroke-width="3"/>
</svg>
