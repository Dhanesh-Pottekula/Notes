<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Station platforms: platform 3 (the repo folder) always has the 3.11.8 express, platform 1 has the default local</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="win"><rect width="44" height="30" rx="5" fill="#d8eef0"/></g>
    <g id="pig"><ellipse cx="0" cy="0" rx="9" ry="6" fill="#9a9086"/><circle cx="7" cy="-5" r="4" fill="#9a9086"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- express on the far track (platform 3) -->
  <rect x="280" y="196" width="680" height="134" rx="20" fill="#2f5d8c"/>
  <rect x="280" y="270" width="680" height="14" fill="#fff"/>
  <use href="#win" x="560" y="214"/><use href="#win" x="630" y="214"/><use href="#win" x="700" y="214"/><use href="#win" x="770" y="214"/><use href="#win" x="910" y="214"/>
  <rect x="840" y="208" width="56" height="122" fill="#3d3a3a"/>
  <!-- platform 3 -->
  <rect x="230" y="330" width="730" height="50" fill="#e0d4bd"/>
  <rect x="230" y="330" width="730" height="6" fill="#e0a33a"/>
  <!-- tracks and platform 2 strip -->
  <path d="M0 392 h960 M0 402 h960" stroke="#9a9086" stroke-width="3"/>
  <rect x="0" y="412" width="960" height="20" fill="#e6dccb"/>
  <!-- grey local on near track -->
  <rect x="0" y="440" width="500" height="116" rx="14" fill="#9a9086"/>
  <use href="#win" x="30" y="460"/><use href="#win" x="100" y="460"/><use href="#win" x="330" y="460"/><use href="#win" x="400" y="460"/>
  <rect x="200" y="454" width="64" height="102" fill="#6b6460"/>
  <path d="M500 546 h460" stroke="#9a9086" stroke-width="3"/>
  <!-- platform 1 foreground -->
  <rect x="0" y="556" width="960" height="84" fill="#e6dccb"/>
  <rect x="0" y="556" width="960" height="6" fill="#e0a33a"/>

  <!-- overbridge with stairs down to platform 3 -->
  <rect x="24" y="112" width="560" height="22" fill="#b9ad98"/>
  <path d="M24 112 h560" stroke="#8a6d5a" stroke-width="4"/>
  <path d="M30 96 h550" stroke="#8a6d5a" stroke-width="3"/>
  <path d="M60 96 v16 M140 96 v16 M220 96 v16 M300 96 v16 M380 96 v16 M460 96 v16 M540 96 v16" stroke="#8a6d5a" stroke-width="3"/>
  <use href="#pig" x="170" y="90"/><use href="#pig" x="196" y="90"/>
  <rect x="40" y="134" width="22" height="300" fill="#b9ad98"/>
  <path d="M556 112 h28 l92 218 h-30 z" fill="#cbbfa9"/>
  <path d="M570 140 h22 M582 168 h22 M594 196 h22 M606 224 h22 M618 252 h22 M630 280 h22 M642 308 h22" stroke="#9a9086" stroke-width="3"/>

  <!-- yellow board 3.11.8 hanging from the bridge -->
  <path d="M410 134 v18 M490 134 v18" stroke="#3d3a3a" stroke-width="3"/>
  <rect x="384" y="150" width="132" height="42" rx="5" fill="#e0a33a"/>
  <text x="450" y="180" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b">3.11.8</text>
  <!-- PLATFORM BOARD label + arrow -->
  <text x="740" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">PLATFORM BOARD</text>
  <path d="M600 84 q-50 30 -78 70" stroke="#e07a5f" stroke-width="4" fill="none" marker-end="url(#arr)"/>

  <!-- folder signpost: REPO FOLDER -->
  <rect x="404" y="300" width="10" height="36" fill="#6b5446"/>
  <path d="M276 222 h90 l12 -14 h104 a8 8 0 0 1 8 8 v80 a8 8 0 0 1 -8 8 h-206 a8 8 0 0 1 -8 -8 v-66 a8 8 0 0 1 8 -8 z" fill="#1f6f78"/>
  <text x="379" y="274" text-anchor="middle" font-size="24" font-weight="800" fill="#fff" letter-spacing="1">REPO FOLDER</text>

  <!-- engineer stepping off the stairs, ticket in hand -->
  <g transform="translate(720 368) scale(.9)">
    <use href="#man" color="#7a4e7e"/>
    <path d="M-20 -164 a22 22 0 0 1 40 0 v8 h-40 z" fill="#7a4e7e"/>
    <rect x="-50" y="-96" width="30" height="36" rx="4" fill="#3d3a3a"/>
    <path d="M20 -120 l-36 30" stroke="#3d3a3a" stroke-width="4"/>
    <path d="M26 -108 l26 -24" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <rect x="46" y="-152" width="26" height="18" rx="2" fill="#e0a33a"/>
    <path d="M-26 -108 l-8 44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <path d="M580 120 q40 120 70 200 q50 40 160 10" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/>

  <!-- platform 1: DEFAULT board, commuters, tea vendor, bench -->
  <rect x="616" y="470" width="6" height="94" fill="#3d3a3a"/>
  <rect x="556" y="440" width="126" height="38" rx="5" fill="#cbbfa9"/>
  <text x="619" y="467" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">DEFAULT</text>
  <use href="#man" color="#cbbfa9" transform="translate(110 620) scale(.8)"/>
  <use href="#man" color="#1f6f78" transform="translate(180 626) scale(.8)"/>
  <g transform="translate(400 624) scale(.85)">
    <use href="#man" color="#ffffff"/>
    <path d="M26 -108 l26 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M50 -74 q0 -24 20 -24 q20 0 20 24 z" fill="#e0a33a"/>
    <path d="M50 -84 l-12 -8" stroke="#e0a33a" stroke-width="5"/>
  </g>
  <g fill="#9a9086"><rect x="740" y="590" width="160" height="10" rx="4"/><rect x="750" y="600" width="8" height="26"/><rect x="882" y="600" width="8" height="26"/><rect x="740" y="568" width="160" height="8" rx="4"/></g>
</svg>
