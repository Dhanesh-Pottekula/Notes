<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A vague shopping note versus an exact kirana bill, with separate rice bins for each family</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sack"><path d="M-20 0 q-8 -32 4 -46 h32 q12 14 4 46 z" fill="#d9c79a"/><path d="M-14 -46 q14 -10 28 0" stroke="#b9ad98" stroke-width="4" fill="none"/></g>
    <g id="bin"><rect x="-34" y="-70" width="68" height="70" rx="6" fill="#b9ad98"/><rect x="-38" y="-80" width="76" height="12" rx="5" fill="#9a9086"/><rect x="-6" y="-88" width="12" height="8" rx="3" fill="#9a9086"/><rect x="-18" y="-46" width="36" height="18" rx="3" fill="#fff"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: NOTE -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">NOTE</text>
  <!-- window with tulsi -->
  <rect x="40" y="110" width="110" height="110" rx="6" fill="#d8eef0"/>
  <path d="M95 110 v110 M40 165 h110" stroke="#f6f1e7" stroke-width="6"/>
  <rect x="70" y="214" width="50" height="10" fill="#8a6d5a"/>
  <path d="M80 214 h30 l-4 -20 h-22 z" fill="#e07a5f"/>
  <path d="M95 194 v-26 M95 182 q-14 -6 -16 -16 M95 176 q14 -6 16 -16" stroke="#5c9a5c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- mother with glasses on head -->
  <g transform="translate(130 560)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-30 0 l6 -64 h48 l6 64 z" fill="#1f6f78"/>
    <path d="M-24 -56 v-48 a24 24 0 0 1 48 0 v48 z" fill="#1f6f78"/>
    <path d="M-18 -124 l40 64" stroke="#e0a33a" stroke-width="10"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#8a8580"/>
    <circle cx="-16" cy="-158" r="8" fill="#8a8580"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-6" cy="-168" r="5"/><circle cx="8" cy="-168" r="5"/></g>
    <path d="M24 -108 l60 -4" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- torn note -->
  <path d="M206 420 h96 v44 l-8 4 l-8 -4 l-8 4 l-8 -4 l-8 4 l-8 -4 l-8 4 l-8 -4 l-8 4 l-8 -4 l-8 4 l-8 -4 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="254" y="450" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2b2b" font-style="italic">Rice 5 kg</text>
  <!-- confused son -->
  <g transform="translate(360 560)">
    <use href="#man" color="#e07a5f"/>
    <path d="M-26 -108 l-34 0" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l14 -50 l-20 -20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M-6 -138 q6 -4 12 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <!-- thought bubble: which rice? -->
  <circle cx="352" cy="364" r="7" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="340" cy="338" r="11" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <rect x="200" y="160" width="250" height="160" rx="40" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <use href="#sack" x="250" y="290"/><use href="#sack" x="325" y="290"/><use href="#sack" x="400" y="290"/>
  <g font-size="26" font-weight="800" fill="#e07a5f" text-anchor="middle"><text x="250" y="226">?</text><text x="325" y="226">?</text><text x="400" y="226">?</text></g>
  <rect x="240" y="264" width="20" height="10" fill="#e0a33a"/><rect x="315" y="264" width="20" height="10" fill="#7a4e7e"/><rect x="390" y="264" width="20" height="10" fill="#5c9a5c"/>

  <!-- RIGHT: LOCK FILE -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">LOCK FILE</text>
  <!-- separate rice bins = VENV -->
  <text x="630" y="132" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">VENV</text>
  <rect x="510" y="250" width="250" height="10" fill="#8a6d5a"/>
  <use href="#bin" x="552" y="250"/><use href="#bin" x="632" y="250"/><use href="#bin" x="712" y="250"/>
  <g fill="#2b2b2b" opacity=".6"><rect x="540" y="208" width="24" height="4"/><rect x="620" y="208" width="24" height="4"/><rect x="700" y="208" width="24" height="4"/></g>
  <!-- stove with biryani pot -->
  <rect x="800" y="226" width="130" height="34" rx="4" fill="#3d3a3a"/>
  <path d="M826 226 q-6 -50 39 -54 q45 4 39 54 z" fill="#b8663f"/>
  <ellipse cx="865" cy="174" rx="34" ry="7" fill="#a1552f"/>
  <path d="M852 160 q-8 -16 0 -32 M878 160 q8 -16 0 -32" stroke="#cfc4b0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- door with cousin -->
  <rect x="830" y="300" width="110" height="260" fill="#8a6d5a"/>
  <rect x="842" y="312" width="86" height="248" fill="#e6dccb"/>
  <g transform="translate(880 560) scale(.85)">
    <use href="#man" color="#5c9a5c"/>
    <path d="M-26 -108 l-34 6" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l6 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-12 -140 q12 8 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <!-- confident son with long bill -->
  <g transform="translate(620 560)">
    <use href="#man" color="#e07a5f"/>
    <path d="M26 -108 l58 -6" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-26 -108 l-6 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-12 -140 q12 8 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <path d="M700 330 h86 v180 q-10 8 -22 0 q-10 8 -22 0 q-10 8 -22 0 q-10 8 -20 0 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <g stroke="#b9ad98" stroke-width="3"><path d="M712 350 h60 M712 366 h48 M712 382 h60 M712 432 h54 M712 448 h40 M712 464 h60 M712 480 h44"/></g>
  <rect x="704" y="396" width="78" height="26" fill="#e0a33a" opacity=".55"/>
  <text x="743" y="415" text-anchor="middle" font-size="15" font-weight="800" fill="#2b2b2b">Batch 2311</text>
  <path d="M792 420 q20 0 30 0" stroke="#1f6f78" stroke-width="4" marker-end="url(#arr)"/>
</svg>
