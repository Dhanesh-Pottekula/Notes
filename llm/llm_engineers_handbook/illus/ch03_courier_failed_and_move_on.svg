<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A courier marks a locked house as failed and moves on to the next delivery</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="parcel"><rect width="40" height="28" rx="2" fill="#c9a26a"/><path d="M20 0 v28" stroke="#a5844f" stroke-width="3"/></g>
    <g id="tree"><rect x="-6" y="-80" width="12" height="80" fill="#6b5446"/><circle cx="0" cy="-100" r="40" fill="#e07a5f"/><circle cx="-30" cy="-84" r="26" fill="#d0654b"/><circle cx="30" cy="-84" r="26" fill="#d0654b"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="500" width="960" height="140" fill="#cbbfa9"/>
  <rect x="0" y="490" width="960" height="12" fill="#b9ad98"/>

  <!-- faint warehouse far away, crossed-out return arrow -->
  <g opacity=".45">
    <path d="M30 150 l50 -30 l50 30 v60 h-100 z" fill="#b9ad98"/>
    <rect x="66" y="176" width="28" height="34" fill="#9a9086"/>
    <path d="M330 300 q-100 -60 -186 -120" stroke="#9a9086" stroke-width="4" fill="none" stroke-dasharray="7 6"/>
    <path d="M144 180 l14 -2 M144 180 l4 13" stroke="#9a9086" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M218 222 l28 28 M246 222 l-28 28" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>

  <!-- locked house -->
  <path d="M60 300 l120 -70 l120 70 z" fill="#7a4e7e"/>
  <rect x="76" y="300" width="208" height="190" fill="#efe6d2"/>
  <rect x="140" y="370" width="80" height="120" fill="#8a6d5a"/>
  <path d="M166 420 a14 14 0 0 1 28 0" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <rect x="160" y="418" width="40" height="32" rx="4" fill="#e0a33a"/>
  <circle cx="180" cy="432" r="4" fill="#3d3a3a"/>
  
  <text x="180" y="352" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">FAILED</text>
  <!-- gate -->
  <path d="M290 490 v-70 M320 490 v-70 M290 440 h30 M290 470 h30" stroke="#3d3a3a" stroke-width="4"/>

  <!-- scooter with parcel box -->
  <g transform="translate(400 500)">
    <circle cx="0" cy="-20" r="20" fill="#3d3a3a"/><circle cx="110" cy="-20" r="20" fill="#3d3a3a"/>
    <path d="M-10 -40 h90 l30 -50 h10" stroke="#e07a5f" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -40 q20 -30 70 -30 h30 v30 z" fill="#e07a5f"/>
    <rect x="-30" y="-130" width="80" height="62" rx="4" fill="#9a9086"/>
    <use href="#parcel" x="-24" y="-160"/><use href="#parcel" x="8" y="-158"/><use href="#parcel" x="-12" y="-186"/>
  </g>
  <!-- courier writing a cross on clipboard -->
  <g transform="translate(350 500)">
    <use href="#man" color="#e07a5f"/>
    <path d="M-22 -168 a22 22 0 0 1 44 0 z" fill="#3d3a3a"/>
    <path d="M-26 -108 l-24 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l-10 34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-10 -138 q10 4 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <rect x="280" y="400" width="38" height="50" rx="3" fill="#8a6d5a"/>
  <rect x="285" y="408" width="28" height="38" fill="#fff"/>
  <path d="M290 418 h18 M290 428 h12 M290 438 h18" stroke="#b9ad98" stroke-width="2"/>
  <path d="M300 424 l8 8 M308 424 l-8 8" stroke="#e07a5f" stroke-width="3"/>

  <!-- MOVE ON arrow to next house -->
  <path d="M380 590 Q560 620 740 560" stroke="#1f6f78" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <text x="560" y="582" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">MOVE ON</text>

  <!-- gulmohar tree -->
  <use href="#tree" x="590" y="490"/>

  <!-- next house, man receiving parcel -->
  <path d="M680 320 l120 -70 l120 70 z" fill="#1f6f78"/>
  <rect x="696" y="320" width="208" height="170" fill="#efe6d2"/>
  <rect x="820" y="380" width="64" height="110" fill="#6b5446"/>
  <rect x="712" y="344" width="40" height="36" fill="#d8eef0"/>
  <g transform="translate(780 500)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-22 0 l4 -64 h36 l4 64 z" fill="#ffffff"/>
    <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#e0a33a"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-150" r="20" fill="#b07850"/>
    <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#d8cdb8"/>
    <path d="M-10 -142 q10 8 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-26 -108 l-24 30 M26 -108 l-16 30" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
  </g>
  <use href="#parcel" x="736" y="398"/>
  <path d="M730 380 l10 10 l18 -22" stroke="#5c9a5c" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- inset: end-of-day sheet -->
  <rect x="560" y="28" width="376" height="170" rx="22" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="584" y="48" width="328" height="130" rx="6" fill="#f6f1e7"/>
  <text x="604" y="100" font-size="24" font-weight="700" fill="#2b2b2b">Koramangala 8/8</text>
  <text x="604" y="150" font-size="24" font-weight="700" fill="#2b2b2b">Indiranagar 6/7</text>
  <path d="M866 82 l8 10 l16 -20" stroke="#5c9a5c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M866 128 l20 20 M886 128 l-20 20" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
</svg>
