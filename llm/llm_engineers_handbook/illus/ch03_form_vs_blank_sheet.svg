<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A form with labelled boxes shows a missing PAN at once; a free-form sheet fails only later in the back office</title>
  <defs>
    <g id="clerk">
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#2f4a6e"/>
      <path d="M-6 -128 l6 30 l6 -30 z" fill="#fff"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-21 -150 a21 21 0 0 1 42 0 v14 h-6 v-12 a15 13 0 0 0 -30 0 v12 h-6 z" fill="#2e2a2a"/>
      <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="8" cy="-150" r="6"/></g>
    </g>
    <g id="appl">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#ffffff"/>
      <path d="M-26 -110 h52 M-26 -96 h52 M-26 -82 h52 M-26 -68 h52" stroke="#1f6f78" stroke-width="5"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="20" fill="#b07850"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="counter">
      <rect x="30" y="400" width="420" height="160" rx="6" fill="#8a6d5a"/>
      <rect x="30" y="400" width="420" height="16" rx="6" fill="#6b5446"/>
      <rect x="218" y="150" width="10" height="236" fill="#9a9086"/>
      <rect x="40" y="150" width="178" height="236" fill="#d8eef0" opacity=".55"/>
      <path d="M70 180 l40 -20 M70 210 l80 -40" stroke="#fff" stroke-width="6" opacity=".7"/>
      <circle cx="370" cy="392" r="12" fill="#e0a33a"/><rect x="358" y="392" width="24" height="8" fill="#b7802a"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="480" y="0" width="480" height="640" fill="#f1ece4"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: CLASS -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">CLASS</text>
  <g transform="translate(110 400)"><use href="#clerk"/><path d="M26 -108 l60 -30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#counter"/>
  <!-- the form -->
  <rect x="190" y="200" width="160" height="196" rx="4" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="190" y="200" width="160" height="22" rx="4" fill="#1f6f78"/>
  <g fill="none" stroke="#b9ad98" stroke-width="2"><rect x="204" y="236" width="132" height="24"/><rect x="204" y="272" width="132" height="24"/><rect x="204" y="350" width="132" height="24"/></g>
  <path d="M210 248 h90 M210 284 h70 M210 362 h80" stroke="#2f5d8c" stroke-width="3"/>
  <rect x="204" y="308" width="132" height="28" fill="#fbe1da" stroke="#e07a5f" stroke-width="3"/>
  <rect x="266" y="312" width="64" height="20" rx="4" fill="#e07a5f"/>
  <text x="298" y="328" text-anchor="middle" font-size="15" font-weight="800" fill="#fff">PAN</text>
  <path d="M214 330 l-20 -60" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  <!-- applicant nods, clock shows seconds -->
  <g transform="translate(424 560)"><use href="#appl"/><path d="M-26 -108 l-34 22" stroke="#b07850" stroke-width="11" stroke-linecap="round"/><path d="M-10 -140 q10 8 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/></g>
  <circle cx="400" cy="160" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/>
  <path d="M400 160 v-18" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M400 160 l12 6" stroke="#e07a5f" stroke-width="2"/>
  <path d="M400 134 a26 26 0 0 1 14 4" stroke="#5c9a5c" stroke-width="5" fill="none"/>
  <path d="M90 130 l12 10 l22 -26" stroke="#5c9a5c" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- RIGHT: DICT -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">DICT</text>
  <g transform="translate(590 400)"><use href="#clerk"/><path d="M-26 -108 l-24 -30 M26 -108 l24 -30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#counter" x="480"/>
  <!-- messy blank sheet -->
  <rect x="670" y="200" width="160" height="196" rx="4" fill="#fff" stroke="#cbbfa9" stroke-width="2" transform="rotate(4 750 298)"/>
  <g stroke="#2f5d8c" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M686 224 q20 -8 40 4 q20 8 40 -6 q14 -6 30 4"/>
    <path d="M700 260 l60 30 M690 300 q30 -30 60 -10 q30 20 50 -20"/>
    <path d="M720 330 q-10 20 20 30 q30 4 40 -30"/>
    <path d="M780 240 v60 M800 250 l-20 40"/>
    <path d="M690 360 q40 10 70 -4"/>
  </g>
  <circle cx="790" cy="356" r="22" fill="none" stroke="#e07a5f" stroke-width="4" opacity=".8"/>
  <path d="M778 356 h24" stroke="#e07a5f" stroke-width="4" opacity=".8"/>
  <g transform="translate(904 560)"><use href="#appl"/><path d="M-26 -108 l-10 46" stroke="#b07850" stroke-width="11" stroke-linecap="round"/></g>

  <!-- inset: a week later, machine jams -->
  <rect x="520" y="440" width="300" height="170" rx="18" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="540" y="462" width="60" height="64" rx="4" fill="#fff" stroke="#3d3a3a" stroke-width="3"/>
  <rect x="540" y="462" width="60" height="16" fill="#e07a5f"/>
  <g fill="#cbbfa9"><rect x="548" y="486" width="8" height="8"/><rect x="562" y="486" width="8" height="8"/><rect x="576" y="486" width="8" height="8"/><rect x="548" y="500" width="8" height="8"/><rect x="562" y="500" width="8" height="8"/><rect x="576" y="500" width="8" height="8"/><rect x="548" y="514" width="8" height="8"/></g>
  <circle cx="580" cy="518" r="7" fill="none" stroke="#e07a5f" stroke-width="2.5"/>
  <rect x="640" y="500" width="150" height="90" rx="8" fill="#9a9086"/>
  <rect x="656" y="490" width="118" height="14" fill="#3d3a3a"/>
  <path d="M680 492 l10 -30 l20 14 l10 -26 l20 20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M676 470 l-10 -8 M760 470 l12 -10 M770 490 l14 -2" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="715" cy="550" r="18" fill="#e07a5f"/>
  <text x="715" y="558" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">!</text>
</svg>
