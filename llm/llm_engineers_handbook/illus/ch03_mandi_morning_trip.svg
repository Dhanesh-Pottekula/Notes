<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Morning mandi trip: buy from several stalls, wash and sort, store whole in the cold room</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="tom"><circle cx="0" cy="0" r="9" fill="#e07a5f"/><circle cx="16" cy="2" r="9" fill="#d0654b"/><circle cx="8" cy="-12" r="9" fill="#e07a5f"/><circle cx="-14" cy="3" r="8" fill="#d0654b"/><circle cx="30" cy="2" r="8" fill="#e07a5f"/></g>
    <g id="oni"><circle cx="0" cy="0" r="9" fill="#9a5e8f"/><circle cx="16" cy="2" r="9" fill="#7a4e7e"/><circle cx="8" cy="-12" r="9" fill="#9a5e8f"/><circle cx="-14" cy="3" r="8" fill="#7a4e7e"/><circle cx="30" cy="2" r="8" fill="#9a5e8f"/></g>
    <g id="spi"><ellipse cx="0" cy="0" rx="12" ry="7" fill="#5c9a5c"/><ellipse cx="16" cy="-6" rx="12" ry="7" fill="#4a8a4a"/><ellipse cx="8" cy="-14" rx="12" ry="7" fill="#5c9a5c"/><ellipse cx="-14" cy="-4" rx="10" ry="6" fill="#4a8a4a"/><ellipse cx="30" cy="0" rx="10" ry="6" fill="#5c9a5c"/></g>
    <g id="crate"><rect x="0" y="0" width="70" height="36" rx="3" fill="#1f6f78"/><path d="M8 12 h54 M8 24 h54" stroke="#165860" stroke-width="3"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="0" width="330" height="640" fill="#f8e6dc"/>
  <rect x="640" y="96" width="300" height="464" fill="#d9e9ef"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>

  <!-- LEFT: three stalls -->
  <text x="176" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SOURCES</text>
  <g>
    <path d="M26 150 l44 -40 l44 40 z" fill="#e07a5f"/><rect x="26" y="150" width="88" height="10" fill="#c96a50"/>
    <path d="M132 150 l44 -40 l44 40 z" fill="#1f6f78"/><rect x="132" y="150" width="88" height="10" fill="#165860"/>
    <path d="M238 150 l44 -40 l44 40 z" fill="#e0a33a"/><rect x="238" y="150" width="88" height="10" fill="#b7802a"/>
    <path d="M30 160 v120 M110 160 v120 M136 160 v120 M216 160 v120 M242 160 v120 M322 160 v120" stroke="#8a6d5a" stroke-width="4"/>
    <rect x="26" y="270" width="300" height="60" fill="#8a6d5a"/>
    <use href="#tom" x="54" y="262"/><use href="#oni" x="160" y="262"/><use href="#spi" x="266" y="262"/>
  </g>
  <!-- cook with woven basket -->
  <g transform="translate(150 548)">
    <use href="#man" color="#ffffff"/>
    <path d="M-24 -100 h48 v28 h-48 z" fill="#e07a5f" opacity=".35"/>
    <path d="M-18 -172 h36 v14 h-36 z M-22 -184 a22 14 0 0 1 44 0 v12 h-44 z" fill="#ffffff"/>
    <path d="M-26 -108 l-24 -24" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l30 34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <path d="M200 486 h78 l-10 44 h-58 z" fill="#c9a26a"/>
  <path d="M206 496 h66 M210 510 h58" stroke="#a5844f" stroke-width="3"/>
  <circle cx="220" cy="482" r="8" fill="#e07a5f"/><circle cx="240" cy="480" r="8" fill="#7a4e7e"/><ellipse cx="260" cy="480" rx="11" ry="6" fill="#5c9a5c"/>
  <!-- ignored pre-cut packet -->
  <rect x="24" y="400" width="70" height="8" fill="#8a6d5a" opacity=".5"/>
  <rect x="36" y="364" width="44" height="36" rx="4" fill="#d8eef0" opacity=".6"/>
  <path d="M42 376 h10 M56 382 h12 M46 390 h14" stroke="#e07a5f" stroke-width="4" opacity=".6"/>
  <path d="M30 356 l56 56 M86 356 l-56 56" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>

  <!-- MIDDLE: wash and sort -->
  <text x="485" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ETL</text>
  <path d="M410 330 v60 h30 v14" stroke="#9a9086" stroke-width="8" fill="none"/>
  <path d="M440 414 v44" stroke="#8fc3d6" stroke-width="5" stroke-dasharray="4 5"/>
  <g transform="translate(396 548)">
    <use href="#man" color="#7a4e7e"/>
    <path d="M26 -108 l26 50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-26 -108 l-8 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <path d="M408 470 h100 l-10 70 h-80 z" fill="#b9ad98"/>
  <ellipse cx="458" cy="470" rx="50" ry="8" fill="#8fc3d6"/>
  <circle cx="440" cy="468" r="7" fill="#e07a5f"/><circle cx="470" cy="470" r="7" fill="#7a4e7e"/>
  <g transform="translate(580 548)">
    <use href="#man" color="#e0a33a"/>
    <path d="M-26 -108 l-26 50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l8 46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <use href="#crate" x="500" y="510"/>
  <circle cx="520" cy="506" r="7" fill="#e07a5f"/><circle cx="536" cy="506" r="7" fill="#e07a5f"/><circle cx="552" cy="506" r="7" fill="#e07a5f"/>

  <!-- RIGHT: cold room with crates by type -->
  <path d="M890 180 v36 M874 189 l32 18 M874 207 l32 -18 M900 330 v28 M888 337 l24 14 M888 351 l24 -14" stroke="#fff" stroke-width="3"/>
  <rect x="664" y="150" width="192" height="290" rx="6" fill="#bcd3db"/>
  <rect x="676" y="170" width="168" height="44" rx="4" fill="#ffffff"/>
  <rect x="824" y="290" width="12" height="60" rx="5" fill="#3d3a3a"/>
  <text x="760" y="200" text-anchor="middle" font-size="23" font-weight="800" fill="#2b2b2b" letter-spacing="1">WAREHOUSE</text>
  <g>
    <use href="#crate" x="660" y="524"/><use href="#crate" x="660" y="486"/><use href="#crate" x="660" y="448"/>
    <use href="#crate" x="756" y="524"/><use href="#crate" x="756" y="486"/><use href="#crate" x="756" y="448"/>
    <use href="#crate" x="852" y="524"/><use href="#crate" x="852" y="486"/><use href="#crate" x="852" y="448"/>
  </g>
  <use href="#tom" x="676" y="440"/><use href="#oni" x="772" y="440"/><use href="#spi" x="868" y="442"/>
  <rect x="640" y="96" width="300" height="464" fill="none" stroke="#9fc4d1" stroke-width="6"/>

  <!-- flow arrow: stalls -> basket -> tubs -> cold room -->
  <path d="M176 336 q30 60 60 130 M290 470 q60 -150 120 -10 M520 470 q80 -260 210 -60" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
</svg>
