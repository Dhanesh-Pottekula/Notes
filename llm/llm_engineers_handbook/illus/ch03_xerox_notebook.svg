<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Photocopy a whole notebook, copy only the real notes into your register, throw the photocopies away</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="girl">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-60" width="13" height="60" rx="6" fill="#2f5d8c"/>
      <rect x="3" y="-60" width="13" height="60" rx="6" fill="#2f5d8c"/>
      <path d="M-24 -50 v-54 a24 24 0 0 1 48 0 v54 z" fill="#e07a5f"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
      <path d="M-22 -148 a22 22 0 0 1 44 0 v24 h-8 v-24 a14 14 0 0 0 -28 0 v24 h-8 z" fill="#2e2a2a"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>
  <rect x="320" y="96" width="380" height="464" fill="#f8ecd0"/>

  <!-- LEFT: Xerox shop -->
  <g transform="translate(110 470)">
    <use href="#man" color="#cbbfa9"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="8" cy="-150" r="6"/></g>
    <path d="M-14 -146 q14 40 28 0" stroke="#e0a33a" stroke-width="1.5" fill="none"/>
    <path d="M26 -108 l26 20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <rect x="40" y="380" width="200" height="180" rx="8" fill="#b9ad98"/>
  <rect x="40" y="368" width="200" height="16" rx="4" fill="#3d3a3a"/>
  <rect x="52" y="420" width="176" height="10" fill="#9a9086"/>
  <rect x="60" y="460" width="70" height="80" rx="4" fill="#9a9086"/>
  <rect x="140" y="350" width="60" height="22" fill="#2f5d8c"/>
  <path d="M240 440 h40 v10 h-40 z" fill="#9a9086"/>
  <g fill="#fff" stroke="#e6dccb" stroke-width="1"><rect x="246" y="414" width="40" height="28" transform="rotate(-8 266 428)"/><rect x="250" y="404" width="40" height="28" transform="rotate(10 270 418)"/></g>
  <g transform="translate(290 560) scale(.9)">
    <use href="#girl"/>
    <path d="M20 -96 l-30 50" stroke="#7a4e7e" stroke-width="4"/>
    <rect x="-34" y="-58" width="26" height="30" rx="6" fill="#7a4e7e"/>
    <path d="M-24 -108 l-14 40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="1.5"><rect x="236" y="474" width="40" height="8"/><rect x="236" y="482" width="40" height="8"/><rect x="236" y="490" width="40" height="8"/></g>

  <!-- step arrows -->
  <path d="M290 250 q30 -40 60 -10" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M690 250 q30 -40 60 -10" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>

  <!-- MIDDLE: desk, lamp, student copying -->
  <g transform="translate(488 470)">
    <use href="#girl"/>
    <path d="M-24 -108 l-20 40 M24 -108 l30 34" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="330" y="420" width="360" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="344" y="436" width="14" height="124" fill="#6b5446"/><rect x="662" y="436" width="14" height="124" fill="#6b5446"/>
  <!-- lamp -->
  <path d="M684 420 v-120 l-40 -26" stroke="#3d3a3a" stroke-width="6" fill="none"/>
  <path d="M618 284 l30 -22 l20 26 z" fill="#e0a33a"/>
  <path d="M628 286 l-40 124 h96 l-30 -120 z" fill="#fff3cf" opacity=".55"/>
  <!-- desk front panel hides legs -->
  <rect x="344" y="436" width="332" height="80" fill="#a98a73"/>
  <!-- photocopy stack: RAW HTML -->
  <g fill="#fff" stroke="#d8cdb8" stroke-width="1.5"><rect x="340" y="404" width="128" height="16"/><rect x="342" y="388" width="128" height="16"/><rect x="340" y="372" width="128" height="16"/><rect x="343" y="356" width="128" height="16"/></g>
  <rect x="352" y="452" width="148" height="36" rx="4" fill="#ffffff" stroke="#e07a5f" stroke-width="2"/>
  <text x="426" y="478" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">RAW HTML</text>
  <!-- pushed aside: doodle + timetable -->
  <g transform="rotate(-18 330 300)"><rect x="300" y="276" width="46" height="36" fill="#fff" stroke="#d8cdb8"/><circle cx="314" cy="292" r="7" fill="none" stroke="#7a4e7e" stroke-width="2"/><path d="M308 304 q6 4 12 0" stroke="#7a4e7e" stroke-width="2" fill="none"/></g>
  <!-- open register: CLEAN TEXT -->
  <rect x="500" y="366" width="170" height="52" rx="3" fill="#2f5d8c"/>
  <rect x="504" y="368" width="80" height="46" fill="#ffffff"/><rect x="586" y="368" width="80" height="46" fill="#ffffff"/>
  <path d="M510 380 h68 M510 392 h68 M510 404 h50 M592 380 h68 M592 392 h40" stroke="#2f5d8c" stroke-width="2"/>
  <rect x="508" y="452" width="164" height="36" rx="4" fill="#ffffff" stroke="#1f6f78" stroke-width="2"/>
  <text x="590" y="478" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">CLEAN TEXT</text>
  <!-- magnified tight handwriting -->
  <circle cx="440" cy="190" r="72" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <g stroke="#2f5d8c" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M390 166 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0"/>
    <path d="M382 192 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0"/>
    <path d="M394 218 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0 q4 -10 8 0 q4 10 8 0"/>
  </g>
  <path d="M500 228 q40 60 70 136" stroke="#7a4e7e" stroke-width="2" stroke-dasharray="5 5" fill="none"/>

  <!-- RIGHT: discard -->
  <text x="800" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">DISCARD</text>
  <path d="M740 440 h120 l-14 120 h-92 z" fill="#9a9086"/>
  <path d="M752 470 h96 M756 500 h88 M760 530 h80" stroke="#7d746b" stroke-width="3"/>
  <g fill="#fff" stroke="#d8cdb8" stroke-width="1.5"><rect x="770" y="350" width="46" height="34" transform="rotate(20 793 367)"/><rect x="790" y="390" width="46" height="34" transform="rotate(-15 813 407)"/><rect x="760" y="410" width="46" height="34" transform="rotate(35 783 427)"/></g>
  <g transform="translate(900 560) scale(.9)">
    <use href="#girl"/>
    <rect x="-46" y="-104" width="30" height="44" rx="3" fill="#2f5d8c"/>
    <path d="M-24 -108 l-6 40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M24 -108 l-30 -40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
