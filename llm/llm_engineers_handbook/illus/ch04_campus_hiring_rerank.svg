<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Fast CV screening narrows thousands to thirty, then slow face-to-face interviews rank the few</title>
  <defs>
    <g id="cv"><rect width="26" height="34" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><path d="M5 8 h16 M5 14 h12 M5 20 h16 M5 26 h10" stroke="#b9ad98" stroke-width="2"/></g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="610" y="96" width="330" height="480" rx="10" fill="#f8e6cc"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>

  <!-- LEFT: screening table -->
  <text x="190" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BI-ENCODER</text>
  <!-- profile sheet on the wall + clock -->
  <rect x="250" y="110" width="70" height="90" rx="3" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <circle cx="285" cy="110" r="6" fill="#e07a5f"/>
  <circle cx="285" cy="136" r="12" fill="#1f6f78" opacity=".5"/>
  <path d="M262 160 h46 M262 172 h46 M262 184 h30" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="100" cy="140" r="24" fill="#fff" stroke="#3d3a3a" stroke-width="4"/>
  <path d="M100 140 v-16 M100 140 l6 -14" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 116 a24 24 0 0 1 8 1.5" stroke="#5c9a5c" stroke-width="6" fill="none"/>
  <!-- HR executive -->
  <g transform="translate(180 430)">
    <path d="M-24 0 v-54 a24 24 0 0 1 48 0 v54 z" fill="#2f4a6e"/>
    <path d="M-6 -78 l6 26 l6 -26 z" fill="#fff"/>
    <rect x="-7" y="-84" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-100" r="20" fill="#d9a27a"/>
    <path d="M-21 -100 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
    <circle cx="16" cy="-112" r="8" fill="#2e2a2a"/>
    <path d="M-24 -50 l-30 30 M24 -50 l30 28" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <rect x="50" y="-30" width="18" height="6" rx="2" fill="#e0a33a" transform="rotate(-30 59 -27)"/>
  </g>
  <path d="M86 380 l-16 -6 M86 392 l-20 -2" stroke="#b9ad98" stroke-width="3" stroke-linecap="round"/>
  <rect x="24" y="420" width="340" height="14" rx="5" fill="#8a6d5a"/>
  <rect x="36" y="434" width="12" height="126" fill="#6b5446"/><rect x="340" y="434" width="12" height="126" fill="#6b5446"/>
  <!-- towering pile of CVs -->
  <g fill="#fff" stroke="#d8cdb8" stroke-width="1.5">
    <rect x="40" y="400" width="80" height="20"/><rect x="42" y="380" width="80" height="20"/><rect x="38" y="360" width="80" height="20"/><rect x="41" y="340" width="80" height="20"/><rect x="39" y="320" width="80" height="20"/><rect x="42" y="300" width="80" height="20"/><rect x="40" y="280" width="80" height="20"/><rect x="43" y="260" width="80" height="20"/><rect x="40" y="240" width="80" height="20"/>
  </g>
  <!-- reject tray and shortlist -->
  <path d="M236 396 h110 l-8 24 h-94 z" fill="#9a9086"/>
  <g transform="translate(250 372) rotate(-12)"><use href="#cv"/></g>
  <g transform="translate(286 368) rotate(10)"><use href="#cv"/></g>
  <g transform="translate(310 376) rotate(-4)"><use href="#cv"/></g>
  <use href="#cv" x="206" y="386"/>

  <!-- CENTRE: funnel -->
  <path d="M130 236 q120 -120 262 -76" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M392 150 h200 l-74 220 v40 h-52 v-40 z" fill="#d8eef0" opacity=".75" stroke="#9fc4d1" stroke-width="3"/>
  <g>
    <use href="#cv" x="410" y="160"/><use href="#cv" x="440" y="166"/><use href="#cv" x="470" y="158"/><use href="#cv" x="500" y="168"/><use href="#cv" x="530" y="160"/><use href="#cv" x="550" y="172"/>
    <use href="#cv" x="430" y="200"/><use href="#cv" x="460" y="206"/><use href="#cv" x="490" y="198"/><use href="#cv" x="520" y="208"/>
    <use href="#cv" x="456" y="250"/><use href="#cv" x="486" y="246"/>
  </g>
  <path d="M492 300 v70" stroke="#e07a5f" stroke-width="5" marker-end="url(#arr)"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="1.5"><rect x="466" y="530" width="52" height="10"/><rect x="466" y="520" width="52" height="10"/><rect x="466" y="510" width="52" height="10"/><rect x="466" y="500" width="52" height="10"/></g>
  <path d="M492 418 v70" stroke="#e07a5f" stroke-width="4" stroke-dasharray="6 6" marker-end="url(#arr)"/>
  <rect x="456" y="540" width="72" height="20" rx="3" fill="#1f6f78"/>
  <!-- crumpled good CV on the floor -->
  <path d="M396 560 q-6 -24 14 -30 q20 -10 32 6 q14 16 -4 26 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M402 540 l12 8 l10 -12 M416 554 l14 -6" stroke="#cbbfa9" stroke-width="2" fill="none"/>
  <path d="M424 512 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 z" fill="#e0a33a"/>

  <!-- RIGHT: interview at round table -->
  <text x="775" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CROSS-ENCODER</text>
  <path d="M775 96 v40" stroke="#3d3a3a" stroke-width="3"/>
  <path d="M750 160 l25 -24 l25 24 z" fill="#e0a33a"/>
  <g transform="translate(680 520)">
    <use href="#man" color="#7a4e7e"/>
    <path d="M-20 -150 a20 20 0 0 1 40 0" fill="none"/>
    <path d="M-16 -144 q16 34 32 0 v6 q-16 22 -32 0 z" fill="#8a8580"/>
    <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#8a8580"/>
    <path d="M26 -108 l36 18" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g transform="translate(870 520)">
    <use href="#man" color="#ffffff"/>
    <path d="M-6 -126 l6 40 l6 -40 z" fill="#1f6f78"/>
    <path d="M-26 -108 l-36 18" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <path d="M24 -168 q4 8 0 12 q-4 -4 0 -12 z" fill="#8fc3d6"/>
  </g>
  <ellipse cx="775" cy="440" rx="120" ry="24" fill="#8a6d5a"/>
  <rect x="766" y="460" width="18" height="96" fill="#6b5446"/>
  <ellipse cx="775" cy="556" rx="40" ry="8" fill="#6b5446"/>
  <g stroke="#e07a5f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M712 330 q30 -20 60 0 q30 20 60 0" marker-end="url(#arr)"/>
    <path d="M832 360 q-30 20 -60 0 q-30 -20 -60 0" marker-end="url(#arr)"/>
  </g>
</svg>
