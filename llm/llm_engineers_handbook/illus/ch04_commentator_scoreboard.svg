<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A commentator reads the live score from the scoreboard; with the blinds down he confidently guesses a wrong score</title>
  <defs>
    <g id="comm">
      <path d="M-30 0 v-48 a30 28 0 0 1 60 0 v48 z" fill="#2f4a6e"/>
      <path d="M-6 -74 l6 28 l6 -28 z" fill="#fff"/>
      <rect x="-7" y="-82" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-100" r="21" fill="#c98a5e"/>
      <path d="M-21 -104 a21 21 0 0 1 42 0 l-4 -2 a17 14 0 0 0 -34 0 z" fill="#d8d4cf"/>
      <path d="M-22 -104 a22 22 0 0 1 44 0" stroke="#3d3a3a" stroke-width="4" fill="none"/>
      <rect x="-27" y="-110" width="8" height="16" rx="3" fill="#3d3a3a"/>
      <path d="M-23 -96 q4 16 18 14" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: window to a sunlit stadium -->
  <rect x="24" y="96" width="432" height="300" rx="6" fill="#cfe7f0"/>
  <path d="M24 300 q216 -50 432 0 v96 h-432 z" fill="#7fb07a"/>
  <path d="M24 300 q216 -50 432 0" stroke="#e6dccb" stroke-width="6" fill="none"/>
  <path d="M24 230 h432 v40 q-216 -20 -432 30 z" fill="#b9ad98" opacity=".6"/>
  <!-- scoreboard RETRIEVAL -->
  <rect x="250" y="112" width="190" height="124" rx="6" fill="#3d3a3a"/>
  <rect x="320" y="236" width="12" height="40" fill="#3d3a3a"/>
  <rect x="358" y="236" width="12" height="40" fill="#3d3a3a"/>
  <rect x="258" y="118" width="174" height="36" rx="3" fill="#f6f1e7"/>
  <text x="345" y="145" text-anchor="middle" font-size="25" font-weight="800" fill="#2b2b2b" letter-spacing="1">RETRIEVAL</text>
  <rect x="270" y="160" width="150" height="56" rx="4" fill="#1f2a2a"/>
  <text x="345" y="200" text-anchor="middle" font-size="30" font-weight="800" fill="#e0a33a" letter-spacing="2">245/3</text>
  <!-- sepia thought bubble MEMORY -->
  <circle cx="150" cy="300" r="8" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="136" cy="272" r="12" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <rect x="40" y="110" width="190" height="140" rx="40" fill="#f3e3c6" stroke="#b9ad98" stroke-width="3"/>
  <g fill="#a57d52">
    <circle cx="96" cy="150" r="10"/>
    <path d="M86 162 h20 v36 h-20 z"/>
    <path d="M88 198 l-8 30 M104 198 l10 30" stroke="#a57d52" stroke-width="7" stroke-linecap="round"/>
    <path d="M108 168 l30 22" stroke="#7d5c3a" stroke-width="7" stroke-linecap="round"/>
    <path d="M160 160 h40 q0 34 -20 38 q-20 -4 -20 -38 z"/>
    <rect x="174" y="198" width="12" height="16"/><rect x="166" y="214" width="28" height="8"/>
  </g>
  <text x="44" y="94" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">MEMORY</text>
  <!-- commentator at the desk, pointing at scoreboard -->
  <g transform="translate(220 450)">
    <use href="#comm"/>
    <path d="M26 -54 l46 -56" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-10 -86 q10 8 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <path d="M236 352 Q280 300 300 236" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <rect x="24" y="440" width="432" height="18" rx="5" fill="#6b5446"/>
  <rect x="40" y="458" width="400" height="120" fill="#8a6d5a"/>

  <!-- RIGHT: blinds down -->
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">HALLUCINATION</text>
  <rect x="504" y="96" width="432" height="300" rx="6" fill="#b9ad98"/>
  <g stroke="#9a9086" stroke-width="4"><path d="M504 126 h432 M504 156 h432 M504 186 h432 M504 216 h432 M504 246 h432 M504 276 h432 M504 306 h432 M504 336 h432 M504 366 h432"/></g>
  <path d="M900 96 v120" stroke="#6b5446" stroke-width="3"/>
  <!-- producer, head in hands -->
  <g transform="translate(870 492) scale(.85)">
    <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#7a4e7e"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-150" r="20" fill="#b07850"/>
    <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    <path d="M-26 -108 l-12 -30 l14 -16 M26 -108 l12 -30 l-14 -16" stroke="#b07850" stroke-width="11" stroke-linecap="round" fill="none"/>
  </g>
  <!-- speech bubble with a wrong score -->
  <path d="M600 130 h190 a16 16 0 0 1 16 16 v60 a16 16 0 0 1 -16 16 h-150 l-24 24 l2 -24 h-18 a16 16 0 0 1 -16 -16 v-60 a16 16 0 0 1 16 -16 z" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="698" y="190" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="2">312/1</text>
  <circle cx="828" cy="128" r="18" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="828" y="137" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">?</text>
  <!-- commentator, finger raised -->
  <g transform="translate(640 450)">
    <use href="#comm"/>
    <path d="M26 -54 l20 -60" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M46 -114 v-18" stroke="#c98a5e" stroke-width="6" stroke-linecap="round"/>
    <path d="M-10 -88 q10 10 20 0 z" fill="#2e2a2a"/>
  </g>
  <rect x="504" y="440" width="432" height="18" rx="5" fill="#6b5446"/>
  <rect x="520" y="458" width="400" height="120" fill="#8a6d5a"/>
</svg>
