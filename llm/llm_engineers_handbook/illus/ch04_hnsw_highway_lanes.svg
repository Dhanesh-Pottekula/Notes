<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>HNSW as finding a friend's house: highway layer, main-road layer, lane layer, with a nearly-right alternative</title>
  <defs>
    <g id="mini">
      <rect x="-5" y="-22" width="4" height="22" rx="2" fill="#4a3f55"/><rect x="1" y="-22" width="4" height="22" rx="2" fill="#4a3f55"/>
      <path d="M-9 -22 v-16 a9 9 0 0 1 18 0 v16 z" fill="currentColor"/>
      <circle cx="0" cy="-52" r="7" fill="#c98a5e"/><path d="M-7 -53 a7 7 0 0 1 14 0 z" fill="#2e2a2a"/>
    </g>
    <g id="car"><path d="M-22 0 v-10 l8 -10 h22 l8 10 h6 v10 z" fill="#ffffff" stroke="#9a9086" stroke-width="1.5"/><circle cx="-12" cy="0" r="5" fill="#3d3a3a"/><circle cx="12" cy="0" r="5" fill="#3d3a3a"/></g>
    <g id="hs"><rect x="0" y="0" width="22" height="16" fill="#efe6d2"/><path d="M-2 0 l13 -9 l13 9 z" fill="#c98a5e"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>

  <!-- BOTTOM plane: dense lanes (layer 0) -->
  <g transform="translate(140 456) skewX(-33.7)">
    <rect width="560" height="130" fill="#e6dccb" opacity=".95"/>
    <g stroke="#cbbfa9" stroke-width="6"><path d="M0 22 h560 M0 50 h560 M0 78 h560 M0 106 h560"/><path d="M40 0 v130 M90 0 v130 M140 0 v130 M190 0 v130 M240 0 v130 M290 0 v130 M340 0 v130 M390 0 v130 M440 0 v130 M490 0 v130 M540 0 v130"/></g>
    <g fill="#c98a5e" opacity=".75">
      <rect x="50" y="28" width="30" height="16"/><rect x="100" y="56" width="30" height="16"/><rect x="150" y="28" width="30" height="16"/><rect x="200" y="84" width="30" height="16"/><rect x="250" y="56" width="30" height="16"/><rect x="300" y="28" width="30" height="16"/><rect x="250" y="112" width="30" height="14"/><rect x="450" y="28" width="30" height="16"/><rect x="500" y="56" width="30" height="16"/><rect x="100" y="112" width="30" height="14"/><rect x="10" y="84" width="22" height="16"/><rect x="500" y="112" width="30" height="14"/>
    </g>
    <rect x="350" y="56" width="30" height="16" fill="#2f5d8c"/>
    <rect x="400" y="84" width="30" height="16" fill="#9a9086" opacity=".55"/>
  </g>
  <!-- MIDDLE plane: main roads + colony gates -->
  <g transform="translate(140 276) skewX(-33.7)">
    <rect width="560" height="130" fill="#ede5d6" opacity=".95"/>
    <g stroke="#b9ad98" stroke-width="12"><path d="M0 34 h560 M0 96 h560 M110 0 v130 M250 0 v130 M370 0 v130 M490 0 v130"/></g>
    <g fill="#7a4e7e" opacity=".5"><rect x="160" y="54" width="60" height="26"/><rect x="420" y="54" width="44" height="26"/><rect x="20" y="54" width="60" height="26"/></g>
  </g>
  <!-- TOP plane: one highway, big areas -->
  <g transform="translate(140 96) skewX(-33.7)">
    <rect width="560" height="130" fill="#f3ede2" opacity=".95"/>
    <rect x="0" y="54" width="560" height="26" fill="#9a9086"/>
    <path d="M0 67 h560" stroke="#f6f1e7" stroke-width="3" stroke-dasharray="14 12"/>
    <circle cx="110" cy="26" r="16" fill="#1f6f78" opacity=".6"/><circle cx="270" cy="108" r="16" fill="#e0a33a" opacity=".7"/><circle cx="480" cy="24" r="16" fill="#7a4e7e" opacity=".55"/>
    <path d="M372 80 l14 30" stroke="#9a9086" stroke-width="10"/>
  </g>
  <!-- plane edges -->
  <g fill="none" stroke="#b9ad98" stroke-width="2">
    <path d="M140 96 h560 l-87 130 h-560 z"/>
    <path d="M140 276 h560 l-87 130 h-560 z"/>
    <path d="M140 456 h560 l-87 130 h-560 z"/>
  </g>

  <!-- car on the highway, then the main road -->
  <use href="#car" x="400" y="168"/>
  <path d="M352 160 h-30 M352 170 h-40" stroke="#b9ad98" stroke-width="3"/>
  <use href="#car" x="476" y="352" transform="rotate(0)"/>
  <!-- colony gate arch -->
  <path d="M424 326 v-26 a18 18 0 0 1 36 0 v26" stroke="#e07a5f" stroke-width="6" fill="none"/>

  <!-- bold dashed route dropping between layers -->
  <path d="M470 200 V 300" stroke="#e07a5f" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <path d="M470 372 V 500" stroke="#e07a5f" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/>
  <!-- faint alternative exit -->
  <path d="M520 200 C 560 320 560 420 506 532" stroke="#9a9086" stroke-width="3" stroke-dasharray="6 6" fill="none" opacity=".7"/>
  <circle cx="540" cy="548" r="13" fill="#fff" stroke="#9a9086" stroke-width="2"/>
  <text x="540" y="555" text-anchor="middle" font-size="18" font-weight="800" fill="#9a9086">?</text>

  <!-- walking to the blue house, friend waving -->
  <use href="#mini" color="#7a4e7e" transform="translate(424 552)"/>
  <use href="#mini" color="#e0a33a" transform="translate(500 516)"/>
  <path d="M508 482 l8 -10" stroke="#c98a5e" stroke-width="4" stroke-linecap="round"/>

  <!-- labels -->
  <text x="830" y="172" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">TOP LAYER</text>
  <path d="M736 162 h-40" stroke="#b9ad98" stroke-width="3"/>
  <text x="830" y="512" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">LAYER 0</text>
  <path d="M756 502 h-60" stroke="#b9ad98" stroke-width="3"/>
  <text x="790" y="604" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">APPROXIMATE</text>
  <path d="M680 594 q-60 0 -124 -40" stroke="#9a9086" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
</svg>
