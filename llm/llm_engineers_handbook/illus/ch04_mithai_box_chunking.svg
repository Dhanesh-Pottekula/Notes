<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Packing whole laddoos into fixed-size boxes under a weight limit; a nearly empty last box is thrown away</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="lad"><circle r="11" fill="#e0a33a"/><circle cx="-3" cy="-3" r="3" fill="#f3c46b"/></g>
    <g id="closed"><rect x="0" y="0" width="76" height="48" rx="3" fill="#ffffff"/><rect x="0" y="0" width="76" height="10" fill="#efe6d2"/><path d="M38 0 v48 M0 24 h76" stroke="#d0343a" stroke-width="3"/><path d="M30 -6 q8 8 16 0 q-8 -8 -16 0" stroke="#d0343a" stroke-width="3" fill="none"/></g>
    <g id="tray"><rect x="0" y="0" width="120" height="10" rx="3" fill="#b9ad98"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- back shelves with trays of sweets -->
  <rect x="24" y="96" width="912" height="250" fill="#efe1c4"/>
  <g fill="#8a6d5a"><rect x="24" y="170" width="912" height="8"/><rect x="24" y="250" width="912" height="8"/></g>
  <g>
    <use href="#tray" x="50" y="160"/><use href="#tray" x="220" y="160"/><use href="#tray" x="640" y="160"/><use href="#tray" x="800" y="160"/>
    <use href="#tray" x="50" y="240"/><use href="#tray" x="220" y="240"/><use href="#tray" x="640" y="240"/><use href="#tray" x="800" y="240"/>
  </g>
  <g fill="#e0a33a"><circle cx="70" cy="150" r="9"/><circle cx="92" cy="150" r="9"/><circle cx="114" cy="150" r="9"/><circle cx="136" cy="150" r="9"/><circle cx="158" cy="150" r="9"/><circle cx="660" cy="150" r="9"/><circle cx="682" cy="150" r="9"/><circle cx="704" cy="150" r="9"/><circle cx="726" cy="150" r="9"/><circle cx="748" cy="150" r="9"/></g>
  <g fill="#e6dccb" stroke="#cbbfa9"><path d="M230 232 l10 -10 l10 10 l-10 10 z M254 232 l10 -10 l10 10 l-10 10 z M278 232 l10 -10 l10 10 l-10 10 z M302 232 l10 -10 l10 10 l-10 10 z M810 232 l10 -10 l10 10 l-10 10 z M834 232 l10 -10 l10 10 l-10 10 z M858 232 l10 -10 l10 10 l-10 10 z M882 232 l10 -10 l10 10 l-10 10 z"/></g>
  <g fill="#e07a5f"><rect x="230" y="140" width="18" height="18" rx="2"/><rect x="254" y="140" width="18" height="18" rx="2"/><rect x="278" y="140" width="18" height="18" rx="2"/><rect x="302" y="140" width="18" height="18" rx="2"/><rect x="60" y="222" width="18" height="18" rx="2" fill="#5c9a5c"/><rect x="84" y="222" width="18" height="18" rx="2" fill="#5c9a5c"/><rect x="108" y="222" width="18" height="18" rx="2" fill="#5c9a5c"/></g>

  <!-- shopkeeper with Gandhi cap -->
  <g transform="translate(466 480) scale(1.2)">
    <use href="#man" color="#ffffff"/>
    <path d="M-22 -160 l4 -14 h36 l4 14 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M14 -126 l16 50" stroke="#e07a5f" stroke-width="10"/>
    <path d="M-10 -138 q10 6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-26 -108 l-20 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l16 -46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- the laddoo that won't fit -->
  <use href="#lad" x="522" y="268"/>
  <path d="M546 262 l12 -6 M546 276 l14 0" stroke="#e07a5f" stroke-width="3" stroke-linecap="round"/>

  <g transform="translate(904 470) scale(.9)">
    <use href="#man" color="#7a4e7e"/>
    <path d="M-20 -100 h40 v80 h-40 z" fill="#efe6d2"/>
    <path d="M-26 -108 l-40 34" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <path d="M-10 -136 q10 -6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <!-- glass counter -->
  <rect x="24" y="400" width="912" height="18" rx="4" fill="#cfe3ea"/>
  <rect x="24" y="418" width="912" height="170" fill="#dcecef"/>
  <rect x="24" y="588" width="912" height="16" fill="#8a6d5a"/>
  <path d="M80 430 l60 140 M500 430 l40 100" stroke="#fff" stroke-width="8" opacity=".6"/>

  <!-- CHUNK: three closed boxes -->
  <text x="190" y="330" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CHUNK</text>
  <use href="#closed" x="64" y="352"/><use href="#closed" x="152" y="352"/><use href="#closed" x="240" y="352"/>

  <!-- full open box -->
  <rect x="400" y="354" width="136" height="46" rx="3" fill="#ffffff"/>
  <g>
    <use href="#lad" x="418" y="367"/><use href="#lad" x="443" y="367"/><use href="#lad" x="468" y="367"/><use href="#lad" x="493" y="367"/><use href="#lad" x="518" y="367"/>
    <use href="#lad" x="418" y="389"/><use href="#lad" x="443" y="389"/><use href="#lad" x="468" y="389"/><use href="#lad" x="493" y="389"/><use href="#lad" x="518" y="389"/>
  </g>

  <!-- scale with limit line: MAX TOKENS -->
  <rect x="580" y="380" width="130" height="20" rx="4" fill="#9a9086"/>
  <rect x="592" y="342" width="106" height="38" rx="3" fill="#ffffff"/>
  <path d="M592 342 h106" stroke="#d0343a" stroke-width="2"/>
  <rect x="610" y="430" width="90" height="40" rx="4" fill="#3d3a3a"/>
  <rect x="618" y="438" width="74" height="24" rx="2" fill="#5c9a5c"/>
  <rect x="618" y="438" width="62" height="24" rx="2" fill="#8fcf8f"/>
  <path d="M680 432 v36" stroke="#d0343a" stroke-width="4"/>
  <path d="M645 400 v30" stroke="#9a9086" stroke-width="6"/>
  <text x="655" y="512" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">MAX TOKENS</text>

  <!-- MIN LENGTH: nearly empty last box, assistant, bin -->
  <text x="776" y="300" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">MIN LENGTH</text>
  <rect x="760" y="350" width="80" height="50" rx="3" fill="#ffffff"/>
  <use href="#lad" x="780" y="384"/><use href="#lad" x="804" y="384"/>
  <path d="M842 400 q50 30 56 112" stroke="#e07a5f" stroke-width="3" stroke-dasharray="6 6" fill="none"/><path d="M890 500 l8 14 l8 -14" stroke="#e07a5f" stroke-width="3" fill="none"/>
  <path d="M870 520 h60 l-8 64 h-44 z" fill="#9a9086"/>
</svg>
