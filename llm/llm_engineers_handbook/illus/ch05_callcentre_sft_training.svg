<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A well-read new hire recites the manual on day one; after call-script training he answers the customer properly</title>
  <defs>
    <g id="agent">
      <path d="M-24 0 v-54 a24 24 0 0 1 48 0 v54 z" fill="#ffffff"/>
      <path d="M-4 -78 v40" stroke="#1f6f78" stroke-width="3"/>
      <rect x="-9" y="-44" width="14" height="18" rx="2" fill="#1f6f78"/>
      <rect x="-6" y="-84" width="12" height="10" fill="#c98a5e"/>
      <ellipse cx="0" cy="-102" rx="18" ry="21" fill="#c98a5e"/>
      <path d="M-18 -106 a18 20 0 0 1 36 0 q-18 -8 -36 0 z" fill="#2e2a2a"/>
      <path d="M-20 -106 a20 20 0 0 1 40 0" stroke="#3d3a3a" stroke-width="4" fill="none"/>
      <rect x="15" y="-110" width="8" height="16" rx="3" fill="#3d3a3a"/>
      <path d="M19 -96 q-2 14 -14 14" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    </g>
    <g id="books">
      <rect x="0" y="0" width="80" height="22" rx="2" fill="#1f6f78"/><rect x="6" y="-22" width="74" height="22" rx="2" fill="#e07a5f"/><rect x="-4" y="-44" width="80" height="22" rx="2" fill="#7a4e7e"/><rect x="4" y="-66" width="76" height="22" rx="2" fill="#e0a33a"/><rect x="-2" y="-88" width="80" height="22" rx="2" fill="#2f5d8c"/><rect x="8" y="-110" width="72" height="22" rx="2" fill="#5c9a5c"/><rect x="2" y="-132" width="78" height="22" rx="2" fill="#e07a5f"/><rect x="10" y="-154" width="70" height="22" rx="2" fill="#7a4e7e"/>
    </g>
    <g id="cust">
      <path d="M-26 40 v-20 a26 22 0 0 1 52 0 v20 z" fill="#e0a33a"/>
      <circle cx="0" cy="-6" r="17" fill="#d9a27a"/>
      <path d="M-18 -6 a18 18 0 0 1 36 0 l-4 2 a14 13 0 0 0 -28 0 z" fill="#2e2a2a"/>
      <rect x="16" y="-12" width="8" height="18" rx="2" fill="#3d3a3a"/>
    </g>
  </defs>

  <rect width="960" height="640" fill="#eef1f2"/>
  <rect x="480" y="0" width="480" height="640" fill="#f8efe0"/>
  <rect x="0" y="560" width="960" height="80" fill="#c9d6e3"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: BASE MODEL -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">BASE MODEL</text>
  <rect x="24" y="300" width="432" height="10" fill="#b9ad98"/>
  <g transform="translate(64 398) rotate(-4)"><use href="#books"/></g>
  <g transform="translate(250 430) scale(1.3)">
    <use href="#agent"/>
    <path d="M-10 -92 h20" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-24 -50 l10 30 M24 -50 l-10 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M208 406 l42 -10 l42 10 v-34 l-42 -10 l-42 10 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M250 362 v44" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="24" y="420" width="432" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="40" y="436" width="400" height="124" fill="#a3876f"/>
  <g transform="translate(-30 -22)">
  <!-- dense scroll speech bubble -->
  <path d="M180 110 h190 a12 12 0 0 1 12 12 v126 a12 12 0 0 1 -12 12 h-90 l-20 26 l-4 -26 h-76 a12 12 0 0 1 -12 -12 v-126 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <g stroke="#9a9086" stroke-width="3"><path d="M184 128 h182 M184 138 h176 M184 148 h182 M184 158 h170 M184 168 h182 M184 178 h178 M184 188 h182 M184 198 h168 M184 208 h182 M184 218 h176 M184 228 h182 M184 238 h150 M184 248 h176"/></g>
  </g>
  <!-- confused customer inset -->
  <circle cx="400" cy="350" r="52" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <g transform="translate(400 350)">
    <use href="#cust"/>
    <path d="M-20 22 l-10 -36 l10 -14" stroke="#d9a27a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M-6 0 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <text x="30" y="-22" font-size="18" font-weight="800" fill="#e07a5f">?</text>
  </g>

  <!-- RIGHT: AFTER SFT -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">AFTER SFT</text>
  <rect x="504" y="300" width="432" height="10" fill="#b9ad98"/>
  <g transform="translate(524 398) rotate(-4) scale(.9)" opacity=".85"><use href="#books"/></g>
  <!-- trainer in maroon kurta -->
  <g transform="translate(876 430) scale(1.2)">
    <path d="M-24 0 v-54 a24 24 0 0 1 48 0 v54 z" fill="#8a2f3a"/>
    <rect x="-6" y="-84" width="12" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-102" r="19" fill="#d9a27a"/>
    <path d="M-20 -102 a20 20 0 0 1 40 0 l-4 2 a16 14 0 0 0 -32 0 z" fill="#2e2a2a"/>
    <circle cx="16" cy="-112" r="8" fill="#2e2a2a"/>
    <path d="M-8 -94 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-24 -50 l-30 34" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(690 430) scale(1.3)">
    <use href="#agent"/>
    <path d="M-10 -92 q10 10 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-24 -50 l-6 40 M24 -50 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="504" y="420" width="432" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="520" y="436" width="400" height="124" fill="#a3876f"/>
  <!-- laptop with waveform -->
  <path d="M770 420 l10 -64 h90 l-10 64 z" fill="#3d3a3a"/>
  <path d="M790 390 l8 0 l4 -14 l6 26 l6 -32 l6 30 l6 -18 l6 10 l8 -2 l6 0" stroke="#8fcf8f" stroke-width="3" fill="none"/>
  <rect x="756" y="418" width="110" height="6" rx="2" fill="#9a9086"/>
  <!-- script card with two arrow rows -->
  <rect x="566" y="374" width="80" height="46" rx="3" fill="#fff" stroke="#1f6f78" stroke-width="2"/>
  <path d="M576 390 h46 l-8 -6 M622 390 l-8 6" stroke="#e07a5f" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M576 406 h46 l-8 -6 M622 406 l-8 6" stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- short confident speech -->
  <path d="M640 150 h90 a12 12 0 0 1 12 12 v36 a12 12 0 0 1 -12 12 h-50 l-14 22 l-4 -22 h-22 a12 12 0 0 1 -12 -12 v-36 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <path d="M646 172 h76 M646 188 h50" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>
  <!-- happy customer inset -->
  <circle cx="860" cy="196" r="52" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <g transform="translate(860 196)">
    <use href="#cust"/>
    <path d="M-7 -2 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-34 -22 q-4 8 0 16 M-40 -26 q-6 12 0 24" stroke="#5c9a5c" stroke-width="2.5" fill="none"/>
  </g>
</svg>
