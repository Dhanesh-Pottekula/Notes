<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Padding wastes fixed-size boxes on bubble wrap; packing fits several items per box with dividers and trims what is too long</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#9a9086"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="box"><rect width="96" height="64" fill="#c9a26a"/><path d="M0 0 l-10 -14 M96 0 l10 -14" stroke="#b08a52" stroke-width="6" stroke-linecap="round"/></g>
    <g id="wrap"><circle cx="12" cy="12" r="9" fill="#d8eef0"/><circle cx="30" cy="12" r="9" fill="#cfe7f0"/><circle cx="66" cy="12" r="9" fill="#d8eef0"/><circle cx="84" cy="12" r="9" fill="#cfe7f0"/><circle cx="12" cy="30" r="9" fill="#cfe7f0"/><circle cx="84" cy="30" r="9" fill="#d8eef0"/><circle cx="21" cy="0" r="8" fill="#e3f2f5"/><circle cx="75" cy="0" r="8" fill="#e3f2f5"/></g>
    <g id="shelfbox"><rect width="60" height="40" fill="#c9a26a"/><path d="M0 12 h60" stroke="#b08a52" stroke-width="3"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <!-- shelves of identical boxes -->
  <rect x="24" y="170" width="432" height="8" fill="#8a6d5a"/><rect x="504" y="170" width="432" height="8" fill="#8a6d5a"/>
  <use href="#shelfbox" x="40" y="130"/><use href="#shelfbox" x="110" y="130"/><use href="#shelfbox" x="180" y="130"/><use href="#shelfbox" x="250" y="130"/><use href="#shelfbox" x="320" y="130"/>
  <use href="#shelfbox" x="600" y="130"/><use href="#shelfbox" x="670" y="130"/><use href="#shelfbox" x="740" y="130"/><use href="#shelfbox" x="810" y="130"/>

  <!-- LEFT: padding -->
  <g transform="translate(240 492) scale(1.25)"><use href="#man"/><path d="M-10 -138 q10 -6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/><path d="M24 -166 q4 8 0 12 q-4 -4 0 -12 z" fill="#8fc3d6"/></g>
  <use href="#box" x="34" y="356"/><use href="#box" x="138" y="356"/><use href="#box" x="242" y="356"/><use href="#box" x="346" y="356"/>
  <use href="#wrap" x="34" y="352"/><use href="#wrap" x="138" y="352"/><use href="#wrap" x="242" y="352"/><use href="#wrap" x="346" y="352"/>
  <rect x="72" y="344" width="22" height="12" rx="3" fill="#3d3a3a"/>
  <rect x="174" y="338" width="24" height="18" fill="#7a4e7e"/>
  <rect x="278" y="344" width="26" height="12" rx="5" fill="#e07a5f"/>
  <rect x="384" y="340" width="20" height="16" rx="3" fill="#e0a33a"/>
  <text x="240" y="236" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">PADDING</text>
  <path d="M150 250 l-40 84 M330 250 l40 84" stroke="#9fc4d1" stroke-width="3"/>
  <!-- counter with ruler -->
  <rect x="24" y="420" width="432" height="140" fill="#8a6d5a"/>
  <rect x="24" y="420" width="432" height="22" fill="#e6dccb"/>
  <path d="M34 420 v10 M58 420 v6 M82 420 v10 M106 420 v6 M130 420 v10 M154 420 v6 M178 420 v10 M202 420 v6 M226 420 v10 M250 420 v6 M274 420 v10 M298 420 v6 M322 420 v10 M346 420 v6 M370 420 v10 M394 420 v6 M418 420 v10 M442 420 v6" stroke="#3d3a3a" stroke-width="2"/>
  <!-- long curling receipt -->
  <path d="M420 442 h30 v120 q0 40 -40 40 q-30 0 -30 -24 q0 -16 20 -16 h20" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M428 460 h16 M428 476 h16 M428 492 h16 M428 508 h16 M428 524 h16 M428 540 h16" stroke="#b9ad98" stroke-width="2"/>

  <!-- RIGHT: packing -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PACKING</text>
  <g transform="translate(716 498) scale(1.25)"><use href="#man"/><path d="M-10 -140 q10 8 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/></g>
  <!-- box 1: three items with dividers -->
  <use href="#box" x="540" y="356"/>
  <rect x="550" y="338" width="20" height="18" rx="3" fill="#3d3a3a"/>
  <rect x="582" y="334" width="22" height="22" fill="#7a4e7e"/>
  <rect x="612" y="342" width="18" height="14" rx="3" fill="#e0a33a"/>
  <rect x="574" y="324" width="5" height="40" fill="#8a6d5a"/>
  <rect x="606" y="324" width="5" height="40" fill="#8a6d5a"/>
  <text x="590" y="280" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">MASK</text>
  <path d="M590 290 l-10 28" stroke="#e07a5f" stroke-width="4" marker-end="url(#arr)"/>
  <!-- box 2: poster trimmed to fit -->
  <use href="#box" x="790" y="356"/>
  <rect x="824" y="300" width="22" height="70" rx="4" fill="#1f6f78"/>
  <path d="M818 300 h34" stroke="#e07a5f" stroke-width="3" stroke-dasharray="5 4"/>
  <g transform="translate(880 270) rotate(30)"><rect width="22" height="40" rx="4" fill="#1f6f78" opacity=".8"/></g>
  <path d="M884 324 l6 14" stroke="#9a9086" stroke-width="2" stroke-dasharray="4 4"/>
  <g transform="translate(856 286) rotate(-20)" fill="none" stroke="#3d3a3a" stroke-width="3"><circle cx="0" cy="0" r="6"/><circle cx="0" cy="16" r="6"/><path d="M5 3 l30 10 M5 13 l30 -10"/></g>
  <!-- counter with ruler -->
  <rect x="504" y="420" width="432" height="140" fill="#8a6d5a"/>
  <rect x="504" y="420" width="432" height="22" fill="#e6dccb"/>
  <path d="M514 420 v10 M538 420 v6 M562 420 v10 M586 420 v6 M610 420 v10 M634 420 v6 M658 420 v10 M682 420 v6 M706 420 v10 M730 420 v6 M754 420 v10 M778 420 v6 M802 420 v10 M826 420 v6 M850 420 v10 M874 420 v6 M898 420 v10 M922 420 v6" stroke="#3d3a3a" stroke-width="2"/>
  <!-- short receipt -->
  <path d="M900 442 h28 v40 l-4 4 l-5 -4 l-5 4 l-5 -4 l-5 4 l-4 -4 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M906 456 h16 M906 468 h12" stroke="#b9ad98" stroke-width="2"/>
</svg>
