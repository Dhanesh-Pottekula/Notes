<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An examiner checks practice books against the sealed exam paper and bans the leaking press</title>
  <defs>
    <g id="kid">
      <path d="M-14 0 v-30 a14 14 0 0 1 28 0 v30 z" fill="currentColor"/>
      <circle cx="0" cy="-44" r="11" fill="#c98a5e"/><path d="M-11 -46 a11 11 0 0 1 22 0 z" fill="#2e2a2a"/>
      <path d="M-12 -26 l-10 -24 M12 -26 l10 -24" stroke="#c98a5e" stroke-width="6" stroke-linecap="round"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d0343a"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- steel almirahs -->
  <rect x="460" y="110" width="110" height="250" rx="4" fill="#b9c3c6"/><path d="M515 110 v250" stroke="#9aa6aa" stroke-width="3"/>
  <rect x="580" y="110" width="110" height="250" rx="4" fill="#b9c3c6"/><path d="M635 110 v250" stroke="#9aa6aa" stroke-width="3"/>
  <g fill="#d8cdb8"><rect x="700" y="300" width="70" height="60"/><rect x="706" y="270" width="60" height="30"/></g>

  <!-- glass partition with the coaching classroom -->
  <rect x="30" y="96" width="400" height="230" fill="#d8eef0"/>
  <rect x="30" y="96" width="400" height="230" fill="none" stroke="#9a9086" stroke-width="6"/>
  <use href="#kid" color="#1f6f78" transform="translate(110 290)"/>
  <use href="#kid" color="#e07a5f" transform="translate(180 290)"/>
  <use href="#kid" color="#7a4e7e" transform="translate(250 290)"/>
  <rect x="120" y="186" width="54" height="40" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="147" y="214" text-anchor="middle" font-size="18" font-weight="800" fill="#5c9a5c">98%</text>
  <rect x="300" y="270" width="110" height="12" fill="#8a6d5a"/>
  <path d="M338 270 h28 l-4 -10 h-20 z" fill="#b7802a"/>
  <path d="M332 226 h40 q0 30 -20 34 q-20 -4 -20 -34 z" fill="#e0a33a"/>
  <path d="M352 226 l-6 14 l8 6 l-6 12" stroke="#3d3a3a" stroke-width="2.5" fill="none"/>
  <path d="M60 120 l40 -16 M60 160 l100 -50" stroke="#fff" stroke-width="6" opacity=".6"/>

  <!-- banned press list on the wall -->
  <rect x="790" y="120" width="130" height="170" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="830" y="112" width="50" height="14" fill="#e0a33a" opacity=".6"/>
  <path d="M806 150 h96 M806 170 h80 M806 250 h96 M806 270 h70" stroke="#b9ad98" stroke-width="3"/>
  <rect x="820" y="186" width="70" height="46" rx="4" fill="#3d3a3a"/>
  <path d="M834 196 h42 v26 h-42 z" fill="#9a9086"/>
  <path d="M808 178 l94 62 M902 178 l-94 62" stroke="#d0343a" stroke-width="5" stroke-linecap="round"/>
  <text x="852" y="330" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">PROVENANCE</text>

  <!-- examiner -->
  <g transform="translate(466 452) scale(1.25)">
    <path d="M-30 0 v-60 a30 30 0 0 1 60 0 v60 z" fill="#ffffff"/>
    <path d="M-24 -80 l44 70" stroke="#e0a33a" stroke-width="7"/>
    <rect x="-7" y="-96" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-112" r="21" fill="#d9a27a"/>
    <path d="M-22 -112 a22 22 0 0 1 44 0 l-4 0 a18 15 0 0 0 -36 0 z" fill="#b9b3ac"/>
    <circle cx="0" cy="-138" r="9" fill="#b9b3ac"/>
    <path d="M-15 -108 h12 a6 4 0 0 1 -12 0 z M3 -108 h12 a6 4 0 0 1 -12 0 z" fill="none" stroke="#2b2b2b" stroke-width="2.5"/>
    <path d="M-7 -98 h14" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-30 -50 l-50 30 M30 -50 l60 34" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- desk -->
  <rect x="120" y="440" width="720" height="18" rx="5" fill="#6b5446"/>
  <rect x="140" y="458" width="680" height="120" fill="#8a6d5a"/>
  <!-- sealed envelope: TEST SET -->
  <rect x="150" y="364" width="150" height="76" rx="4" fill="#c9a26a"/>
  <path d="M150 364 l75 40 l75 -40" stroke="#a5844f" stroke-width="3" fill="none"/>
  <circle cx="225" cy="404" r="12" fill="#d0343a"/>
  <rect x="160" y="300" width="130" height="34" rx="4" fill="#fff" stroke="#c9a26a" stroke-width="2"/>
  <text x="225" y="325" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">TEST SET</text>
  <path d="M225 334 v24" stroke="#c9a26a" stroke-width="3"/>
  <!-- official paper and practice book with matching lines -->
  <rect x="320" y="354" width="90" height="86" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M330 372 h70 M330 390 h60 M330 408 h70 M330 426 h50" stroke="#b9ad98" stroke-width="3"/>
  <path d="M520 360 l50 -6 l50 6 v80 l-50 -6 l-50 6 z" fill="#e07a5f"/>
  <path d="M524 364 l46 -4 v74 l-46 4 z M570 360 l46 4 v74 l-46 -4 z" fill="#fff"/>
  <path d="M530 380 h34 M530 398 h34 M530 416 h34 M578 380 h32 M578 398 h32" stroke="#b9ad98" stroke-width="3"/>
  <g stroke="#e0a33a" stroke-width="3" fill="none" opacity=".9">
    <path d="M400 372 q65 -20 130 8"/><path d="M390 408 q70 20 140 8"/>
  </g>
  <g fill="#e0a33a"><circle cx="400" cy="372" r="4"/><circle cx="530" cy="380" r="4"/><circle cx="390" cy="408" r="4"/><circle cx="530" cy="416" r="4"/></g>
  <!-- row of practice books -->
  <g><rect x="640" y="396" width="14" height="44" fill="#1f6f78"/><rect x="656" y="400" width="14" height="40" fill="#e0a33a"/><rect x="672" y="394" width="14" height="46" fill="#7a4e7e"/><rect x="688" y="402" width="14" height="38" fill="#5c9a5c"/></g>
  <!-- red tray: CONTAMINATED -->
  <path d="M640 520 l60 -14 l60 14 z" fill="#7a4e7e"/>
  <path d="M596 518 h218 l-12 46 h-194 z" fill="#ec9a86"/>
  <path d="M596 518 h218" stroke="#d0343a" stroke-width="5"/>
  <text x="705" y="548" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">CONTAMINATED</text>
  <path d="M600 410 q-20 50 40 100" stroke="#d0343a" stroke-width="3" stroke-dasharray="6 6" fill="none" marker-end="url(#arr)"/>
</svg>
