<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>LoRA as a transparent overlay: draw a few metro lines on a clear sheet over a locked city map, and swap sheets</title>
  <defs>
    <g id="sheetbus"><rect width="130" height="170" rx="4" fill="#d8eef0" opacity=".6" stroke="#9fc4d1" stroke-width="2"/><path d="M14 30 q50 40 100 10 M20 120 q40 -50 96 -30" stroke="#e0a33a" stroke-width="7" fill="none" stroke-linecap="round"/></g>
    <g id="sheetcyc"><rect width="130" height="170" rx="4" fill="#d8eef0" opacity=".6" stroke="#9fc4d1" stroke-width="2"/><path d="M20 20 v130 M20 80 h96 M70 80 v70" stroke="#5c9a5c" stroke-width="6" fill="none" stroke-dasharray="12 6" stroke-linecap="round"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- windows and a plant -->
  <rect x="60" y="60" width="150" height="140" rx="6" fill="#d8eef0"/><path d="M135 60 v140 M60 130 h150" stroke="#f6f1e7" stroke-width="6"/>
  <rect x="250" y="60" width="150" height="140" rx="6" fill="#d8eef0"/><path d="M325 60 v140 M250 130 h150" stroke="#f6f1e7" stroke-width="6"/>
  <path d="M640 260 h40 l-6 40 h-28 z" fill="#e07a5f"/>
  <path d="M660 260 q-20 -40 -6 -70 M660 260 q20 -50 10 -80 M660 260 q4 -40 -2 -60" stroke="#5c9a5c" stroke-width="8" fill="none" stroke-linecap="round"/>

  <!-- planner leaning over (behind table) -->
  <g transform="translate(400 330)">
    <path d="M-26 0 v-50 a26 26 0 0 1 52 0 v50 z" fill="#5a7fa8" transform="rotate(14)"/>
    <rect x="4" y="-86" width="14" height="12" fill="#d9a27a" transform="rotate(14)"/>
    <circle cx="12" cy="-100" r="20" fill="#d9a27a" transform="rotate(14)"/>
    <path d="M-8 -104 a20 20 0 0 1 40 0 l0 6 h-6 v-6 a14 12 0 0 0 -28 0 v6 h-6 z" fill="#2e2a2a" transform="rotate(14)"/>
    <path d="M18 -40 l40 60" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-16 -40 l-30 66" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M58 20 l14 16" stroke="#7a4e7e" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- drafting table -->
  <rect x="0" y="600" width="960" height="40" fill="#e6dccb"/>
  <rect x="96" y="536" width="16" height="70" fill="#6b5446"/><rect x="630" y="536" width="16" height="70" fill="#6b5446"/>
  <path d="M104 580 h534" stroke="#6b5446" stroke-width="8"/>
  <path d="M90 320 h560 l40 220 h-640 z" fill="#8a6d5a"/>
  <path d="M110 334 h524 l32 192 h-588 z" fill="#efe6d2"/>
  <!-- printed city map (frozen) -->
  <g stroke="#cbbfa9" stroke-width="3">
    <path d="M100 380 h548 M95 420 h560 M88 460 h574 M80 500 h588"/>
    <path d="M160 334 l-20 192 M230 334 l-14 192 M300 334 l-8 192 M370 334 l-2 192 M440 334 l4 192 M510 334 l10 192 M580 334 l16 192"/>
  </g>
  <ellipse cx="200" cy="400" rx="44" ry="18" fill="#9fc4d1"/>
  <ellipse cx="520" cy="490" rx="36" ry="14" fill="#9fc4d1"/>
  <rect x="300" y="440" width="60" height="34" rx="6" fill="#a9cfa0"/>
  <rect x="560" y="352" width="50" height="26" rx="6" fill="#a9cfa0"/>
  <!-- clips + padlock -->
  <g fill="#9a9086"><rect x="104" y="326" width="22" height="16" rx="3"/><rect x="618" y="326" width="22" height="16" rx="3"/><rect x="62" y="512" width="22" height="16" rx="3"/><rect x="654" y="512" width="22" height="16" rx="3"/></g>
  <rect x="58" y="532" width="30" height="24" rx="4" fill="#e0a33a"/>
  <path d="M64 532 v-8 a9 9 0 0 1 18 0 v8" stroke="#3d3a3a" stroke-width="4" fill="none"/>
  <!-- FROZEN W plaque -->
  <rect x="110" y="476" width="150" height="38" rx="5" fill="#ffffff" stroke="#9a9086" stroke-width="2"/>
  <text x="185" y="503" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1">FROZEN W</text>

  <!-- transparent LoRA sheet with metro lines -->
  <path d="M320 344 h290 l22 150 h-300 z" fill="#cfe7f0" opacity=".55" stroke="#ffffff" stroke-width="3"/>
  <path d="M340 470 q80 -40 140 -60 t130 -40" stroke="#7a4e7e" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M400 360 q20 60 40 120" stroke="#e07a5f" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g fill="#fff" stroke="#3d3a3a" stroke-width="3"><circle cx="372" cy="456" r="6"/><circle cx="480" cy="410" r="6"/><circle cx="560" cy="386" r="6"/><circle cx="420" cy="420" r="6"/><circle cx="406" cy="378" r="6"/></g>
  <rect x="452" y="434" width="172" height="36" rx="5" fill="#ffffff" stroke="#7a4e7e" stroke-width="2"/>
  <text x="538" y="459" text-anchor="middle" font-size="19" font-weight="800" fill="#2b2b2b" letter-spacing="1">LORA ADAPTER</text>

  <!-- stroke darkness swatch -->
  <g><rect x="130" y="286" width="26" height="20" fill="#d9c6dc"/><rect x="158" y="286" width="26" height="20" fill="#b593b7"/><rect x="186" y="286" width="26" height="20" fill="#946a97"/><rect x="214" y="286" width="26" height="20" fill="#7a4e7e"/><rect x="242" y="286" width="26" height="20" fill="#4f2f52"/></g>
  <path d="M172 280 l14 -14 M186 266 v0" stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"/>

  <!-- wall rack: MULTI-LORA -->
  <text x="830" y="110" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">MULTI-LORA</text>
  <rect x="716" y="140" width="228" height="8" rx="4" fill="#3d3a3a"/>
  <path d="M770 148 v12 M890 148 v12" stroke="#3d3a3a" stroke-width="3"/>
  <use href="#sheetbus" x="712" y="160"/>
  <use href="#sheetcyc" x="804" y="168"/>
  <!-- swap arrows -->
  <path d="M770 340 C 760 420 700 440 640 420" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M620 350 C 650 300 700 300 720 320" stroke="#9a9086" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
</svg>
