<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A single judge favours the first, biggest, home-state dish; shuffled plates and a diverse jury fix the bias</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="plate"><ellipse cx="0" cy="0" rx="30" ry="8" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/><ellipse cx="0" cy="-3" rx="12" ry="5" fill="#e07a5f"/><circle cx="4" cy="-7" r="3" fill="#5c9a5c"/></g>
    <g id="num"><circle r="11" fill="#fff" stroke="#3d3a3a" stroke-width="2"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>

  <!-- LEFT: BIASED JUDGE -->
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BIASED JUDGE</text>
  <g transform="translate(96 500) scale(1.15)">
    <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
    <path d="M-36 -40 v-60 a36 30 0 0 1 72 0 v60 z" fill="#ffffff"/>
    <path d="M-36 -104 q36 30 72 0 v26 q-36 30 -72 0 z" fill="#d0343a"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-150" r="21" fill="#c98a5e"/>
    <path d="M-21 -156 a21 21 0 0 1 42 0 q-21 -8 -42 0 z" fill="#d8d4cf"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="8" cy="-150" r="6"/></g>
    <path d="M-8 -138 q8 6 16 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M34 -96 l52 10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <rect x="24" y="440" width="432" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="40" y="456" width="400" height="104" fill="#a3876f"/>
  <!-- plate 1: oversized home-state heap -->
  <ellipse cx="200" cy="436" rx="50" ry="12" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M160 432 q40 -70 80 0 z" fill="#e0a33a"/>
  <circle cx="186" cy="410" r="6" fill="#e07a5f"/><circle cx="210" cy="400" r="5" fill="#5c9a5c"/>
  <path d="M232 404 v-30" stroke="#3d3a3a" stroke-width="2"/><path d="M232 374 h18 l-4 6 l4 6 h-18 z" fill="#1f6f78"/>
  <!-- three small elegant plates, ignored -->
  <use href="#plate" x="300" y="436"/><use href="#plate" x="360" y="436"/><use href="#plate" x="420" y="436"/>
  <g font-size="14" font-weight="800" fill="#2b2b2b" text-anchor="middle">
    <use href="#num" x="200" y="484"/><text x="200" y="489">1</text>
    <use href="#num" x="300" y="484"/><text x="300" y="489">2</text>
    <use href="#num" x="360" y="484"/><text x="360" y="489">3</text>
    <use href="#num" x="420" y="484"/><text x="420" y="489">4</text>
  </g>
  <!-- three bias tags over his choice -->
  <g transform="translate(150 290)"><circle r="22" fill="#e0a33a"/><text y="8" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">1</text></g>
  <g transform="translate(210 280)"><circle r="22" fill="#fff" stroke="#e07a5f" stroke-width="3"/><path d="M-14 6 q14 -26 28 0 z" fill="#e0a33a"/><path d="M-16 6 h32" stroke="#9a9086" stroke-width="3"/></g>
  <g transform="translate(270 290)"><circle r="22" fill="#fff" stroke="#1f6f78" stroke-width="3"/><path d="M0 12 q-12 -12 -12 -20 a12 12 0 0 1 24 0 q0 8 -12 20 z" fill="#1f6f78"/><circle cy="-8" r="4" fill="#fff"/></g>
  <path d="M150 314 l20 60 M210 304 l-4 60 M270 314 l-30 56" stroke="#cbbfa9" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- RIGHT: shuffle + diverse jury -->
  <text x="822" y="300" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">DIVERSE JURY</text>
  <!-- organiser with clipboard + headset -->
  <g transform="translate(556 520)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-28 -40 l4 -64 a24 24 0 0 1 48 0 l4 64 z" fill="#1f6f78"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
    <path d="M-22 -150 a22 22 0 0 1 44 0" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    <path d="M22 -146 q0 14 -14 14" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    <rect x="-46" y="-110" width="26" height="34" rx="2" fill="#8a6d5a"/><rect x="-42" y="-104" width="18" height="24" fill="#fff"/>
    <path d="M24 -100 l30 20" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- three judges -->
  <g transform="translate(740 500)">
    <use href="#man" color="#ffffff"/>
    <path d="M-20 -60 v-10 h40 v10 z" fill="#efe6d2"/>
    <path d="M26 -108 l10 40" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g transform="translate(822 500)">
    <path d="M-28 0 l4 -104 a24 24 0 0 1 48 0 l4 104 z" fill="#ffffff"/>
    <path d="M-28 0 l4 -104 h6 l-4 104 z" fill="#d0343a"/>
    <path d="M-24 -100 l44 70" stroke="#d0343a" stroke-width="7"/>
    <rect x="-7" y="-134" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-150" r="20" fill="#d9a27a"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 l-4 2 a17 15 0 0 0 -34 0 z" fill="#2e2a2a"/>
    <circle cx="0" cy="-156" r="3" fill="#d0343a"/>
    <path d="M24 -100 l10 34" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(892 500)">
    <use href="#man" color="#ffffff"/>
    <path d="M-20 -164 h40 v-12 a20 14 0 0 0 -40 0 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-26 -108 l-10 40" stroke="#d9a27a" stroke-width="11" stroke-linecap="round"/>
  </g>
  <rect x="504" y="440" width="432" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="520" y="456" width="400" height="104" fill="#a3876f"/>
  <!-- shuffled plates with curved arrows -->
  <use href="#plate" x="600" y="436"/><use href="#plate" x="670" y="436"/>
  <g font-size="14" font-weight="800" fill="#2b2b2b" text-anchor="middle">
    <use href="#num" x="600" y="484"/><text x="600" y="489">3</text>
    <use href="#num" x="670" y="484"/><text x="670" y="489">1</text>
  </g>
  <path d="M594 410 q36 -44 70 -6" stroke="#1f6f78" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <text x="652" y="380" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">SHUFFLE</text>
  <path d="M676 420 q-36 -50 -72 -10" stroke="#1f6f78" stroke-width="4" fill="none" marker-end="url(#arr)" transform="translate(0 6)"/>
  <!-- calibration plate with gold star -->
  <use href="#plate" x="822" y="436"/>
  <path d="M866 400 l4 9 l10 1 l-8 6 l3 10 l-9 -6 l-9 6 l3 -10 l-8 -6 l10 -1 z" fill="#e0a33a"/>
</svg>
