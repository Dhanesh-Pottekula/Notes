<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The dhaba owner tastes two bowls of dal and picks one, teaching the new cook by preference after a single demonstration</title>
  <defs>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="bowl"><path d="M-46 0 q46 52 92 0 z" fill="#b9c3c6"/><ellipse cx="0" cy="0" rx="46" ry="9" fill="#9aa6aa"/></g>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>
  <!-- vessels on hooks -->
  <path d="M320 96 h420" stroke="#6b5446" stroke-width="6"/>
  <g stroke="#6b5446" stroke-width="3"><path d="M360 96 v16 M440 96 v16 M640 96 v16 M710 96 v16"/></g>
  <g fill="#b9c3c6"><path d="M340 112 q20 34 40 0 z"/><circle cx="440" cy="128" r="16"/><path d="M620 112 q20 30 40 0 z"/><rect x="698" y="112" width="24" height="30" rx="4"/></g>
  <!-- glowing tandoor -->
  <path d="M770 560 v-150 q0 -60 80 -60 q80 0 80 60 v150 z" fill="#c98a5e"/>
  <ellipse cx="850" cy="368" rx="40" ry="12" fill="#e07a5f"/>
  <ellipse cx="850" cy="368" rx="26" ry="7" fill="#f3c46b"/>
  <path d="M836 340 q-8 -20 4 -40 M864 340 q8 -22 -4 -44" stroke="#cfc4b0" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- wooden bench -->

  <!-- owner tasting -->
  <g transform="translate(390 504) scale(1.1)">
    <use href="#man" color="#ffffff"/>
    <path d="M-23 -160 q23 -26 46 0 q2 10 -4 12 h-38 q-6 -2 -4 -12 z" fill="#e0a33a"/>
    <path d="M-14 -138 q14 -10 28 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-26 -108 l-64 -14" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M26 -108 l30 -34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M56 -142 l-40 -6" stroke="#9aa6aa" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="14" cy="-148" rx="7" ry="4" fill="#9aa6aa"/>
  </g>
  <!-- new cook with notebook -->
  <g transform="translate(704 556)">
    <use href="#man" color="#ffffff"/>
    <path d="M-26 -112 q26 20 52 0" stroke="#e07a5f" stroke-width="8" fill="none"/>
    <path d="M-26 -104 l20 34 M26 -104 l-10 36" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
    <rect x="-18" y="-84" width="36" height="28" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-12 -74 h20 M-12 -64 h14" stroke="#1f6f78" stroke-width="2"/>
    <path d="M-8 -138 q8 4 16 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>

  <!-- steel counter -->
  <rect x="80" y="430" width="560" height="16" rx="4" fill="#9aa6aa"/>
  <rect x="96" y="446" width="528" height="114" fill="#b9c3c6"/>
  <!-- left bowl: glossy tadka -->
  <use href="#bowl" x="220" y="420"/>
  <ellipse cx="220" cy="420" rx="40" ry="7" fill="#e0a33a"/>
  <g fill="#d0343a"><circle cx="206" cy="419" r="4"/><circle cx="222" cy="421" r="3"/><circle cx="236" cy="418" r="4"/></g>
  <ellipse cx="212" cy="417" rx="10" ry="2" fill="#fff" opacity=".7"/>
  <path d="M206 400 q-6 -12 0 -24 M232 400 q6 -12 0 -24" stroke="#cfc4b0" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- right bowl: pale and thin -->
  <use href="#bowl" x="560" y="420"/>
  <ellipse cx="560" cy="420" rx="40" ry="7" fill="#efe1b8"/>
  <!-- labels -->
  <text x="220" y="364" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CHOSEN</text>
  <text x="560" y="364" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">REJECTED</text>
  <path d="M190 330 l10 10 l20 -24" stroke="#5c9a5c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M504 300 l14 14 M518 300 l-14 14" stroke="#d0343a" stroke-width="5" stroke-linecap="round"/>

  <!-- speech bubble: less salt, more tadka -->
  <path d="M470 150 h150 a14 14 0 0 1 14 14 v50 a14 14 0 0 1 -14 14 h-100 l-30 24 l6 -24 h-26 a14 14 0 0 1 -14 -14 v-50 a14 14 0 0 1 14 -14 z" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <path d="M492 206 l8 -26 h16 l8 26 z" fill="#ffffff" stroke="#9a9086" stroke-width="2"/>
  <g fill="#9a9086"><circle cx="502" cy="176" r="2"/><circle cx="510" cy="172" r="2"/><circle cx="506" cy="168" r="2"/></g>
  <path d="M530 190 h14" stroke="#d0343a" stroke-width="5" stroke-linecap="round"/>
  <path d="M564 196 h26 q8 0 10 -10" stroke="#3d3a3a" stroke-width="4" fill="none"/>
  <ellipse cx="568" cy="196" rx="12" ry="7" fill="#e0a33a"/>
  <path d="M606 190 h16 M614 182 v16" stroke="#5c9a5c" stroke-width="5" stroke-linecap="round"/>

  <!-- inset: one demonstration (SFT) -->
  <rect x="24" y="24" width="250" height="200" rx="20" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="44" y="150" width="110" height="50" rx="4" fill="#3d3a3a"/>
  <path d="M74 150 q26 24 52 0 z" fill="#9aa6aa"/>
  <path d="M90 150 l-6 -10 M112 150 l6 -10" stroke="#e07a5f" stroke-width="3"/>
  <g transform="translate(110 196) scale(.62)">
    <use href="#man" color="#ffffff"/>
    <path d="M-20 -164 h40 v-14 a20 14 0 0 0 -40 0 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-26 -108 l-20 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <g transform="translate(200 200) scale(.55)">
    <use href="#man" color="#ffffff"/>
    <path d="M-26 -112 q26 20 52 0" stroke="#e07a5f" stroke-width="8" fill="none"/>
  </g>
  <text x="222" y="72" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">SFT</text>
</svg>
