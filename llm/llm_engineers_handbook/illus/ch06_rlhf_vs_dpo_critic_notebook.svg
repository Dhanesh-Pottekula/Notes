<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>RLHF needs a critic scoring new dishes in a loop; DPO edits the recipe straight from a notebook of better-worse pairs, tied to the original</title>
  <defs>
    <g id="cook">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#ffffff"/>
      <path d="M-18 -100 h36 v46 h-36 z" fill="#efe6d2"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -164 h40 v-12 a20 14 0 0 0 -40 0 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
      <path d="M-20 -158 h40" stroke="#2e2a2a" stroke-width="4"/>
    </g>
    <g id="dish"><ellipse cx="0" cy="0" rx="24" ry="7" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/><path d="M-12 -2 q12 -16 24 0 z" fill="#e07a5f"/></g>
    <g id="card"><rect x="-16" y="-22" width="32" height="34" rx="3" fill="#ffffff" stroke="#3d3a3a" stroke-width="2"/></g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="0" y="560" width="960" height="80" fill="#e6dccb"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: RLHF -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">RLHF</text>
  <!-- stoves -->
  <rect x="300" y="160" width="150" height="50" rx="4" fill="#3d3a3a"/>
  <path d="M345 160 q-6 -8 0 -16 q6 8 0 16 z M415 160 q-6 -8 0 -16 q6 8 0 16 z" fill="#4f8fd6"/>
  <rect x="318" y="114" width="54" height="30" rx="5" fill="#9aa6aa"/><rect x="312" y="112" width="66" height="6" rx="3" fill="#7d8a8e"/>
  <path d="M390 144 q25 14 50 0 z" fill="#3d3a3a"/><path d="M440 140 h16" stroke="#3d3a3a" stroke-width="4"/>
  <!-- critic at a small table -->
  <g transform="translate(100 470)">
    <path d="M-26 0 v-54 a26 26 0 0 1 52 0 v54 z" fill="#2b2b2b"/>
    <rect x="-7" y="-84" width="14" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-100" r="20" fill="#d9a27a"/>
    <path d="M-23 -96 v-8 a23 22 0 0 1 46 0 v8 h-8 v-6 a15 14 0 0 0 -30 0 v6 z" fill="#2e2a2a"/>
    <path d="M24 -50 l20 -60" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-24 -50 l-6 30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="40" y="440" width="140" height="12" rx="4" fill="#8a6d5a"/>
  <rect x="104" y="452" width="10" height="108" fill="#6b5446"/>
  <rect x="58" y="426" width="34" height="14" fill="#fff" stroke="#cbbfa9"/>
  <!-- score cards 8, 5, 9 -->
  <g font-size="22" font-weight="800" fill="#2b2b2b" text-anchor="middle">
    <use href="#card" x="96" y="300"/><text x="96" y="306">8</text>
    <use href="#card" x="136" y="290"/><text x="136" y="296">5</text>
    <use href="#card" x="176" y="300"/><text x="176" y="306">9</text>
  </g>
  <!-- three cooks presenting dishes -->
  <g transform="translate(240 560)"><use href="#cook"/><path d="M-26 -106 l-30 20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/></g>
  <use href="#dish" x="184" y="472"/>
  <g transform="translate(320 560)"><use href="#cook"/><path d="M-26 -106 l-12 30" stroke="#b07850" stroke-width="11" stroke-linecap="round"/></g>
  <use href="#dish" x="288" y="474"/>
  <g transform="translate(400 560)"><use href="#cook"/><path d="M-26 -106 l-12 30" stroke="#d9a27a" stroke-width="11" stroke-linecap="round"/></g>
  <use href="#dish" x="368" y="474"/>
  <!-- the daily loop: stoves -> cooks -> critic -> stoves -->
  <path d="M440 220 q30 80 -20 150" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M200 520 q-10 30 -60 20" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M136 256 q40 -110 150 -86" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>

  <!-- RIGHT: DPO -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">DPO</text>
  <!-- pinned original recipe card: REFERENCE -->
  <rect x="700" y="120" width="210" height="110" rx="4" fill="#fff8e6" stroke="#b9ad98" stroke-width="2"/>
  <circle cx="805" cy="124" r="6" fill="#d0343a"/>
  <text x="805" y="168" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">REFERENCE</text>
  <path d="M724 190 h160 M724 210 h120" stroke="#b9ad98" stroke-width="3"/>
  <!-- short elastic band -->
  <path d="M805 230 q-12 10 0 20 q12 10 0 20 q-12 10 0 20 q12 10 0 20" stroke="#e0a33a" stroke-width="5" fill="none"/>
  <!-- cook with beard at prep counter -->
  <g transform="translate(600 500)">
    <use href="#cook"/>
    <path d="M-16 -144 q16 34 32 0 v8 q-16 24 -32 0 z" fill="#2e2a2a"/>
    <path d="M26 -106 l60 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-26 -106 l20 38" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <rect x="504" y="430" width="432" height="16" rx="5" fill="#8a6d5a"/>
  <rect x="520" y="446" width="400" height="114" fill="#a3876f"/>
  <!-- open notebook of pairs -->
  <rect x="530" y="378" width="120" height="52" rx="3" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M590 378 v52" stroke="#cbbfa9" stroke-width="2"/>
  <g>
    <circle cx="546" cy="392" r="6" fill="#e0a33a"/><path d="M556 392 l4 4 l8 -8" stroke="#5c9a5c" stroke-width="3" fill="none"/>
    <circle cx="546" cy="414" r="6" fill="#e0a33a"/><path d="M556 414 l4 4 l8 -8" stroke="#5c9a5c" stroke-width="3" fill="none"/>
    <circle cx="604" cy="392" r="6" fill="#b9ad98"/><path d="M614 386 l10 10 M624 386 l-10 10" stroke="#d0343a" stroke-width="3"/>
    <circle cx="604" cy="414" r="6" fill="#b9ad98"/><path d="M614 408 l10 10 M624 408 l-10 10" stroke="#d0343a" stroke-width="3"/>
  </g>
  <!-- recipe card being edited with pencil -->
  <rect x="730" y="320" width="150" height="110" rx="4" fill="#ffffff" stroke="#3d3a3a" stroke-width="2"/>
  <path d="M746 346 h80 M746 376 h80 M746 406 h60" stroke="#b9ad98" stroke-width="3"/>
  <path d="M850 356 v-20 m-7 7 l7 -7 l7 7" stroke="#5c9a5c" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M850 366 v20 m-7 -7 l7 7 l7 -7" stroke="#d0343a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M686 398 l40 -28" stroke="#e0a33a" stroke-width="6" stroke-linecap="round"/>
  <path d="M726 370 l6 -4" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
</svg>
