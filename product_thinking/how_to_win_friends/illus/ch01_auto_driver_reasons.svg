<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An auto driver refuses a short trip and his thought bubble shows the traffic jam and fuel price behind it</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="car"><rect x="-26" y="-14" width="52" height="18" rx="6" fill="currentColor"/><path d="M-16 -14 l6 -10 h20 l6 10 z" fill="currentColor"/><circle cx="-14" cy="5" r="5" fill="#3d3a3a"/><circle cx="14" cy="5" r="5" fill="#3d3a3a"/></g>
    <g id="mini"><path d="M-18 4 v-16 q0 -14 16 -14 h8 q12 0 14 14 v16 z" fill="#e0c13a"/><rect x="-18" y="-6" width="38" height="10" fill="#3f9a5a"/><circle cx="-10" cy="6" r="4" fill="#3d3a3a"/><circle cx="12" cy="6" r="4" fill="#3d3a3a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M0 560 H960" stroke="#cbbfa9" stroke-width="5"/>
  <!-- metro pillar + rain tree -->
  <rect x="890" y="250" width="44" height="310" fill="#cbbfa9"/><rect x="860" y="230" width="100" height="26" fill="#b9ad98"/>
  <path d="M60 560 V420" stroke="#8a6d5a" stroke-width="12"/>
  <g fill="#9cc29a"><circle cx="40" cy="400" r="40"/><circle cx="90" cy="388" r="44"/><circle cx="60" cy="360" r="34"/></g>

  <!-- annoyed passenger -->
  <g transform="translate(180 560) scale(1.1)"><use href="#m" color="#cfe0ea"/>
    <path d="M-8 -124 l8 30 l8 -30" stroke="#1f6f78" stroke-width="3" fill="none"/><rect x="-6" y="-94" width="12" height="16" rx="2" fill="#fff"/>
    <path d="M-16 -126 l38 66" stroke="#6b5446" stroke-width="5"/><rect x="16" y="-70" width="40" height="30" rx="5" fill="#6b5446"/>
    <path d="M-12 -162 l9 5 M12 -162 l-9 5" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-30 10 l-6 -18 M22 -104 l30 10 l6 -18" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- storm cloud fading -->
  <g fill="#9a9590" opacity=".75"><circle cx="164" cy="300" r="18"/><circle cx="188" cy="290" r="24"/><circle cx="212" cy="302" r="18"/><rect x="164" y="300" width="48" height="18"/></g>
  <g fill="#9a9590" opacity=".3"><circle cx="236" cy="296" r="10"/><circle cx="142" cy="308" r="8"/></g>
  <path d="M190 320 l-8 14 h10 l-8 14" stroke="#e0a33a" stroke-width="3" fill="none"/>
  <text x="330" y="420" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">WHY?</text>

  <!-- auto-rickshaw with driver -->
  <ellipse cx="600" cy="562" rx="150" ry="9" fill="#000" opacity=".08"/>
  <path d="M470 540 v-110 q0 -60 80 -64 h70 q70 4 76 70 v104 z" fill="#e0c13a"/>
  <rect x="470" y="470" width="226" height="40" fill="#3f9a5a"/>
  <path d="M492 430 q4 -44 58 -46 h20 v86 h-78 z" fill="#f6f1e7" opacity=".7"/>
  <rect x="600" y="400" width="80" height="60" rx="8" fill="#3d3a3a" opacity=".85"/>
  <circle cx="500" cy="540" r="24" fill="#3d3a3a"/><circle cx="500" cy="540" r="9" fill="#9a9590"/>
  <circle cx="660" cy="540" r="24" fill="#3d3a3a"/><circle cx="660" cy="540" r="9" fill="#9a9590"/>
  <!-- driver leaning out, shaking head -->
  <g transform="translate(530 480)">
    <path d="M-22 0 v-36 a22 22 0 0 1 44 0 v36 z" fill="#c9a86a"/>
    <path d="M-20 -40 q20 -12 40 0" stroke="#fff" stroke-width="8" fill="none"/>
    <rect x="-6" y="-66" width="12" height="10" fill="#b07850"/>
    <circle cx="0" cy="-80" r="19" fill="#b07850"/><path d="M-19 -84 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-12 -70 q12 -6 24 0" stroke="#2e2a2a" stroke-width="4" fill="none"/>
    <path d="M-10 -80 h6 M4 -80 h6" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-26 -88 q-8 8 0 16 M26 -88 q8 8 0 16" stroke="#7a4e7e" stroke-width="3" fill="none"/>
    <path d="M-20 -30 l-30 14" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- thought bubble: jam + fuel -->
  <circle cx="540" cy="372" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="556" cy="346" r="12" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="380" y="40" width="480" height="270" rx="60" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="540" y="96" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">JAM</text>
  <rect x="410" y="200" width="270" height="60" rx="6" fill="#d8cdb8"/>
  <use href="#car" transform="translate(436 232)" color="#e07a5f"/>
  <use href="#car" transform="translate(496 236)" color="#1f6f78"/>
  <use href="#mini" transform="translate(552 236)"/>
  <use href="#car" transform="translate(610 232)" color="#7a4e7e"/>
  <rect x="440" y="146" width="90" height="44" rx="6" fill="#e07a5f"/><circle cx="458" cy="192" r="6" fill="#3d3a3a"/><circle cx="512" cy="192" r="6" fill="#3d3a3a"/><g fill="#fff"><rect x="448" y="154" width="14" height="12"/><rect x="468" y="154" width="14" height="12"/><rect x="488" y="154" width="14" height="12"/><rect x="508" y="154" width="14" height="12"/></g>
  <!-- clock 40 min -->
  <circle cx="620" cy="160" r="30" fill="#fff" stroke="#3d3a3a" stroke-width="4"/>
  <path d="M620 160 L620 130 A30 30 0 1 1 594 175 Z" fill="#e0a33a" opacity=".5"/>
  <path d="M620 160 v-20 M620 160 l14 8" stroke="#3d3a3a" stroke-width="3"/>
  <!-- fuel pump with up arrow -->
  <path d="M700 90 V260" stroke="#e3dccd" stroke-width="2"/>
  <rect x="730" y="130" width="56" height="110" rx="8" fill="#1f6f78"/><rect x="740" y="142" width="36" height="26" rx="3" fill="#dff0e4"/>
  <path d="M786 150 h14 v60 q0 14 -12 14" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <rect x="722" y="236" width="72" height="12" rx="3" fill="#3d3a3a"/>
  <path d="M822 236 V112" stroke="#c0392b" stroke-width="7" marker-end="url(#ah)"/>
  <!-- passenger now sees it -->
  <path d="M206 380 C250 330 320 310 376 250" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="8 8"/>
</svg>
