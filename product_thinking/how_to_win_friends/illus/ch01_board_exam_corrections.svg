<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mother under a tower of corrections pauses as her stressed daughter quietly brings her a cup of chai</title>
  <defs>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -102 a22 22 0 0 1 44 0 l6 102 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sb"><rect x="-46" y="-22" width="92" height="44" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
    <g id="x"><path d="M-6 -6 l12 12 M6 -6 l-12 12" stroke="#e07a5f" stroke-width="3.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- night window with city lights -->
  <rect x="660" y="60" width="250" height="170" rx="6" fill="#2f3e6b"/><path d="M785 60 v170" stroke="#f6f1e7" stroke-width="6"/>
  <g fill="#3b4a7b"><rect x="680" y="150" width="30" height="80"/><rect x="720" y="120" width="40" height="110"/><rect x="800" y="140" width="34" height="90"/><rect x="846" y="110" width="44" height="120"/></g>
  <g fill="#f3e3b0"><rect x="688" y="164" width="6" height="6"/><rect x="730" y="134" width="6" height="6"/><rect x="744" y="160" width="6" height="6"/><rect x="810" y="156" width="6" height="6"/><rect x="856" y="128" width="6" height="6"/><rect x="872" y="170" width="6" height="6"/></g>

  <!-- tower of corrections -->
  <g transform="translate(0 -40)">
  <use href="#sb" transform="translate(150 380)"/>
  <g transform="translate(150 380)"><path d="M-8 -14 v28 M-16 -4 h16" stroke="#2b2b2b" stroke-width="3"/><circle cx="-8" cy="-16" r="4" fill="#2b2b2b"/><path d="M14 -10 v20" stroke="#1f6f78" stroke-width="4"/></g>
  <use href="#sb" transform="translate(166 330)"/>
  <g transform="translate(166 330)"><rect x="-16" y="-14" width="16" height="26" rx="3" fill="#3d3a3a"/><use href="#x" transform="translate(16 0)"/></g>
  <use href="#sb" transform="translate(146 280)"/>
  <text x="146" y="290" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">78</text>
  <use href="#sb" transform="translate(170 230)"/>
  <g transform="translate(170 230)"><ellipse cx="-10" cy="4" rx="18" ry="6" fill="#cfd3d6"/><use href="#x" transform="translate(20 0)"/></g>
  <use href="#sb" transform="translate(150 180)"/>
  <g transform="translate(150 180)"><path d="M-20 0 h40" stroke="#b9ad98" stroke-width="5"/><use href="#x" transform="translate(0 0)"/></g>
  <use href="#sb" transform="translate(168 130)" opacity=".5"/>
  </g>
  <path d="M150 362 l14 18 l8 -18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M152 361 h18" stroke="#fff" stroke-width="4"/>
  <!-- label with tally -->
  <text x="390" y="140" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CORRECTIONS</text>
  <g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"><path d="M290 160 v26 M300 160 v26 M310 160 v26 M320 160 v26 M286 182 l38 -18 M340 160 v26 M350 160 v26 M360 160 v26 M370 160 v26 M336 182 l38 -18 M390 160 v26 M400 160 v26 M410 160 v26 M420 160 v26 M386 182 l38 -18 M440 160 v26 M450 160 v26 M460 160 v26 M470 160 v26 M436 182 l38 -18"/></g>

  <!-- mother, finger raised, mid-realisation -->
  <g transform="translate(180 560) scale(1.12)"><use href="#f" color="#7a4e7e"/>
    <path d="M-20 -110 l40 50" stroke="#e0a33a" stroke-width="9"/>
    <circle cx="0" cy="-164" r="9" fill="#2e2a2a"/>
    <path d="M-10 -160 l8 -3 M10 -160 l-8 -3" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="3" fill="#2e2a2a"/><circle cx="6" cy="-150" r="3" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-138" rx="4" ry="3" fill="#2e2a2a"/>
    <path d="M20 -104 l20 -16 v-24" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- study table with lamp, books, mock test -->
  <rect x="380" y="430" width="240" height="14" rx="3" fill="#8a6d5a"/><rect x="392" y="444" width="10" height="116" fill="#6b5446"/><rect x="598" y="444" width="10" height="116" fill="#6b5446"/>
  <path d="M590 430 v-80 l-30 -20" stroke="#3d3a3a" stroke-width="5" fill="none"/><path d="M540 322 l40 -10 l-6 30 z" fill="#e0a33a"/>
  <path d="M540 340 L480 430 H600 Z" fill="#f3e3b0" opacity=".5"/>
  <g><rect x="400" y="400" width="80" height="14" fill="#1f6f78"/><rect x="404" y="386" width="72" height="14" fill="#e07a5f"/><rect x="398" y="414" width="86" height="16" fill="#e0a33a"/></g>
  <rect x="500" y="414" width="60" height="16" rx="1" fill="#fff" transform="rotate(-6 530 422)"/><text x="530" y="428" text-anchor="middle" font-size="14" font-weight="800" fill="#e07a5f" transform="rotate(-6 530 422)">78</text>

  <!-- daughter bringing chai -->
  <g transform="translate(730 560)"><use href="#f" color="#1f6f78"/>
    <path d="M-22 -40 l-6 40 h56 l-6 -40 z" fill="#4a3f55"/>
    <path d="M-18 -150 v24 M18 -150 v24" stroke="#2e2a2a" stroke-width="8" stroke-linecap="round"/>
    <path d="M10 -166 l12 -6" stroke="#e0a33a" stroke-width="3"/>
    <path d="M-10 -146 h6 M4 -146 h6" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-5 -137 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-20 -104 l-40 10 M-20 -92 l-40 2" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M20 -104 l8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M654 448 h22 l-3 30 h-16 z" fill="#f3e3b0" stroke="#cbbfa9" stroke-width="2"/><rect x="656" y="454" width="18" height="18" fill="#b07850"/>
  <path d="M660 440 q6 -12 0 -22 M670 440 q6 -12 0 -22" stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="710" y="350" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE KIND ACT</text>
  <!-- grey stress cloud over daughter -->
  <g transform="translate(80 150)"><g fill="#9a9590"><circle cx="716" cy="250" r="18"/><circle cx="740" cy="240" r="24"/><circle cx="764" cy="252" r="18"/><rect x="716" y="250" width="48" height="18"/></g>
  <path d="M728 272 l-4 12 M744 272 l-4 12 M760 272 l-4 12" stroke="#9fb3bf" stroke-width="3" stroke-linecap="round"/></g>
</svg>
