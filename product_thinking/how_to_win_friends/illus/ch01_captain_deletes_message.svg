<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>In the dressing room a cricket captain deletes an angry draft to his slumped bowler, remembering his own tired hands</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#e8e3dc"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#e8e3dc"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- wall hooks with pads and helmet -->
  <path d="M600 150 H930" stroke="#8a6d5a" stroke-width="8"/>
  <rect x="630" y="160" width="30" height="80" rx="8" fill="#fff" stroke="#d8cdb8" stroke-width="2"/><rect x="666" y="160" width="30" height="80" rx="8" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
  <path d="M730 200 a28 28 0 0 1 56 0 v8 h-56 z" fill="#1f6f78"/><path d="M736 208 h44" stroke="#9a9590" stroke-width="3"/><path d="M736 214 h44" stroke="#9a9590" stroke-width="3"/>
  <rect x="820" y="160" width="70" height="60" rx="8" fill="#7a4e7e"/>
  <!-- window with floodlight -->
  <rect x="860" y="270" width="70" height="70" rx="4" fill="#3b4a6b"/><g fill="#f3e3b0"><circle cx="880" cy="290" r="5"/><circle cx="895" cy="290" r="5"/><circle cx="910" cy="290" r="5"/></g><path d="M895 296 v40" stroke="#9a9590" stroke-width="3"/>
  <!-- fan -->
  <path d="M480 0 v24" stroke="#3d3a3a" stroke-width="3"/><ellipse cx="480" cy="28" rx="70" ry="6" fill="#9a9590"/>
  <!-- rolled net + balls -->
  <rect x="430" y="520" width="130" height="34" rx="17" fill="#d8cdb8" stroke="#b9ad98" stroke-width="2"/>
  <path d="M446 522 v30 M466 522 v30 M486 522 v30 M506 522 v30 M526 522 v30 M546 522 v30" stroke="#b9ad98" stroke-width="2"/>
  <circle cx="580" cy="548" r="9" fill="#fff"/><circle cx="600" cy="552" r="8" fill="#fff"/>

  <!-- captain with phone -->
  <g transform="translate(170 560) scale(1.12)"><use href="#m" color="#ffffff"/>
    <path d="M-22 -160 h44 v-4 a22 14 0 0 0 -44 0 z M14 -164 h22 v6 h-22 z" fill="#1f6f78"/>
    <circle cx="-3" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="9" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-2 -138 h10" stroke="#2e2a2a" stroke-width="2.5"/>
    <circle cx="-10" cy="-142" r="4" fill="#e07a5f" opacity=".5"/><circle cx="14" cy="-142" r="4" fill="#e07a5f" opacity=".5"/>
    <path d="M22 -104 l26 18 l10 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="52" y="-110" width="14" height="24" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -104 l-8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- big phone screen with draft -->
  <rect x="250" y="230" width="190" height="250" rx="18" fill="#3d3a3a"/>
  <rect x="262" y="246" width="166" height="218" rx="6" fill="#fff"/>
  <text x="345" y="282" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DRAFT</text>
  <g fill="#cbbfa9"><rect x="276" y="300" width="138" height="8" rx="4"/><rect x="276" y="318" width="120" height="8" rx="4"/><rect x="276" y="336" width="138" height="8" rx="4"/><rect x="276" y="354" width="100" height="8" rx="4"/><rect x="276" y="372" width="132" height="8" rx="4"/><rect x="276" y="390" width="90" height="8" rx="4"/></g>
  <g fill="#e07a5f"><rect x="320" y="318" width="40" height="8" rx="4"/><rect x="290" y="354" width="56" height="8" rx="4"/><rect x="330" y="390" width="36" height="8" rx="4"/></g>
  <text x="404" y="440" text-anchor="middle" font-size="40" font-weight="800" fill="#e07a5f">!</text>
  <!-- bin icon with arrow -->
  <path d="M430 300 C500 260 540 300 534 360" stroke="#7a4e7e" stroke-width="5" fill="none" marker-end="url(#ah)"/>
  <rect x="506" y="372" width="56" height="10" rx="3" fill="#3d3a3a"/><rect x="524" y="364" width="20" height="8" rx="2" fill="#3d3a3a"/>
  <path d="M510 384 h48 l-6 62 h-36 z" fill="#3d3a3a"/>
  <path d="M526 394 v42 M534 394 v42 M542 394 v42" stroke="#9a9590" stroke-width="3"/>
  <text x="534" y="490" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DELETE</text>

  <!-- thought bubble: hot sun 18 overs, shaking hands -->
  <circle cx="176" cy="352" r="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="160" cy="318" r="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="148" cy="278" r="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <ellipse cx="200" cy="130" rx="166" ry="94" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="112" cy="104" r="22" fill="#e0a33a"/><g stroke="#e0a33a" stroke-width="4" stroke-linecap="round"><path d="M112 70 v-8 M112 138 v8 M78 104 h-8 M146 104 h8 M88 80 l-6 -6 M136 80 l6 -6 M88 128 l-6 6 M136 128 l6 6"/></g>
  <rect x="72" y="154" width="84" height="38" rx="4" fill="#3d3a3a"/><text x="114" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#f3e3b0">18 OV</text>
  <circle cx="272" cy="122" r="14" fill="#c0392b"/>
  <path d="M234 148 q10 -26 30 -12 M310 148 q-10 -26 -30 -12" stroke="#c98a5e" stroke-width="12" fill="none" stroke-linecap="round"/>
  <g stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"><path d="M220 122 l-8 -4 M218 138 l-10 0 M324 122 l8 -4 M326 138 l10 0"/></g>

  <!-- bowler slumped on bench -->
  <rect x="660" y="470" width="260" height="16" rx="4" fill="#8a6d5a"/><rect x="676" y="486" width="10" height="74" fill="#6b5446"/><rect x="894" y="486" width="10" height="74" fill="#6b5446"/>
  <ellipse cx="790" cy="562" rx="60" ry="6" fill="#000" opacity=".08"/>
  <path d="M770 470 l-4 86 M806 470 l4 86" stroke="#d8d3cc" stroke-width="14" stroke-linecap="round"/>
  <path d="M760 470 h56 l-4 -40 a24 22 0 0 0 -48 0 z" fill="#dfe6ea"/>
  <path d="M766 440 l8 34 M810 440 l-8 34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <circle cx="788" cy="418" r="19" fill="#c98a5e"/>
  <path d="M764 414 q24 -34 48 0 l6 22 h-60 z" fill="#e0a33a"/>
  <path d="M780 428 q8 -4 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
</svg>
