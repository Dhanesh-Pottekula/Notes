<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two feuding partners run rival chai stalls while customers drift to a third chain down the road</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="stall">
      <rect x="10" y="0" width="8" height="250" fill="#6b5446"/><rect x="162" y="0" width="8" height="250" fill="#6b5446"/>
      <path d="M0 0 h180 v26 q-15 14 -30 0 q-15 14 -30 0 q-15 14 -30 0 q-15 14 -30 0 q-15 14 -30 0 q-15 14 -30 0 z" fill="currentColor"/>
      <rect x="10" y="150" width="160" height="100" fill="#8a6d5a"/><rect x="10" y="150" width="160" height="10" fill="#6b5446"/>
      <path d="M40 150 v-34 a22 22 0 0 1 44 0 v34 z" fill="#cfd3d6"/><path d="M84 124 l18 -10" stroke="#cfd3d6" stroke-width="7" stroke-linecap="round"/><rect x="54" y="88" width="16" height="8" rx="3" fill="#3d3a3a"/>
      <g fill="#f3e3b0" opacity=".9"><rect x="112" y="112" width="22" height="38" rx="4"/><rect x="138" y="118" width="20" height="32" rx="4"/></g>
      <g fill="#e0a33a"><rect x="116" y="130" width="14" height="5"/><rect x="141" y="134" width="14" height="5"/></g>
    </g>
    <g id="cup"><path d="M-7 0 h14 l-2 18 h-10 z" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#d8cdb8"/>
  <path d="M0 540 H960" stroke="#cbbfa9" stroke-width="4"/>
  <!-- streetlight -->
  <path d="M600 540 V220 q0 -20 22 -20 h24" stroke="#9a9590" stroke-width="6" fill="none"/><ellipse cx="652" cy="204" rx="14" ry="7" fill="#e0a33a"/>

  <!-- two rival stalls -->
  <use href="#stall" transform="translate(20 290)" color="#1f6f78"/>
  <use href="#stall" transform="translate(290 290)" color="#e0a33a"/>
  <!-- crack between them -->
  <path d="M255 540 l-10 22 l14 14 l-12 22 l10 18 l-8 24" stroke="#6b5446" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <text x="255" y="250" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SPLIT</text>
  <path d="M232 268 l14 12 l-10 10 l16 14" stroke="#e07a5f" stroke-width="4" fill="none"/>

  <!-- senior partner pointing angrily -->
  <g transform="translate(150 612) scale(1.08)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#d8d3cc"/>
    <path d="M-12 -138 q12 -8 24 0" stroke="#9a9590" stroke-width="5" fill="none"/>
    <path d="M-12 -164 l10 5 M12 -164 l-10 5" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M22 -104 l60 -10" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- junior partner, arms spread, puzzled -->
  <g transform="translate(380 612)"><use href="#m" color="#7a4e7e"/>
    <rect x="-18" y="-96" width="36" height="40" rx="4" fill="#fff" opacity=".85"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-5 -138 q5 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-30 10 l-8 -18 M22 -104 l30 10 l8 -18" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- unsure customer -->
  <g transform="translate(530 612) scale(.9)"><use href="#m" color="#e07a5f"/>
    <path d="M-22 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l14 30" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <use href="#cup" transform="translate(40 -84)"/>
  </g>
  <circle cx="530" cy="400" r="20" fill="#7a4e7e"/><text x="530" y="411" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">?</text>

  <!-- third chain: bigger stall and crowd -->
  <use href="#stall" transform="translate(690 230) scale(1.35)" color="#7a4e7e"/>
  <g fill="#f3e3b0"><circle cx="720" cy="254" r="6"/><circle cx="770" cy="254" r="6"/><circle cx="820" cy="254" r="6"/><circle cx="870" cy="254" r="6"/><circle cx="920" cy="254" r="6"/></g>
  <text x="810" y="120" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">THIRD CHAIN</text>
  <g transform="translate(730 616) scale(.92)"><use href="#m" color="#1f6f78"/><path d="M-22 -104 l-8 44 M22 -104 l18 -30" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><use href="#cup" transform="translate(42 -152)"/></g>
  <g transform="translate(810 620) scale(.92)"><use href="#m" color="#e0a33a"/><path d="M-22 -104 l-8 44 M22 -104 l8 44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(890 616) scale(.92)"><use href="#m" color="#e07a5f"/><path d="M-22 -104 l-18 -30 M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#cup" transform="translate(-42 -152)"/></g>
  <!-- customers drifting away -->
  <path d="M110 190 C260 120 520 140 668 214" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="12 9" marker-end="url(#ah)"/>
  <path d="M400 210 C480 180 580 190 666 240" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="12 9" marker-end="url(#ah)"/>
</svg>
