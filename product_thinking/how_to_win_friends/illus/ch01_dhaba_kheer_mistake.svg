<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A dhaba owner comforts a crying young cook who mixed up the salt and sugar jars and gives him a second chance</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="jar"><rect x="-30" y="-90" width="60" height="90" rx="10" fill="#e6f0f2" stroke="#b9c8cc" stroke-width="2"/><rect x="-24" y="-102" width="48" height="14" rx="4" fill="#8a6d5a"/><rect x="-26" y="-44" width="52" height="40" rx="6" fill="#fff"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SECOND CHANCE</text>
  <!-- tandoor -->
  <path d="M40 560 l14 -150 q50 -24 100 0 l14 150 z" fill="#b9876a"/><ellipse cx="104" cy="412" rx="46" ry="10" fill="#6b5446"/>
  <path d="M90 400 q6 -16 0 -30 M114 398 q6 -16 0 -30" stroke="#e3dccd" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- shelf -->
  <path d="M200 200 H460" stroke="#8a6d5a" stroke-width="8"/>
  <g fill="#d8cdb8"><rect x="214" y="150" width="40" height="50" rx="6"/><rect x="266" y="140" width="40" height="60" rx="6"/><rect x="318" y="150" width="40" height="50" rx="6"/><rect x="370" y="146" width="40" height="54" rx="6"/></g>
  <!-- serving hatch with wedding crowd -->
  <rect x="640" y="110" width="280" height="150" rx="6" fill="#6b5446"/><rect x="652" y="122" width="256" height="126" fill="#fbeedb"/>
  <path d="M652 140 q64 22 128 0 q64 22 128 0" stroke="#e0a33a" stroke-width="6" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g><circle cx="700" cy="200" r="14" fill="#c98a5e"/><path d="M684 248 a16 30 0 0 1 32 0 z" fill="#e07a5f"/><circle cx="760" cy="196" r="14" fill="#b07850"/><path d="M744 248 a16 32 0 0 1 32 0 z" fill="#7a4e7e"/><circle cx="820" cy="200" r="14" fill="#d9a27a"/><path d="M804 248 a16 30 0 0 1 32 0 z" fill="#1f6f78"/><circle cx="874" cy="198" r="14" fill="#c98a5e"/><path d="M858 248 a16 30 0 0 1 32 0 z" fill="#e0a33a"/></g>
  <g fill="#2e2a2a"><path d="M686 196 a14 14 0 0 1 28 0 z"/><path d="M746 192 a14 14 0 0 1 28 0 z"/><path d="M806 196 a14 14 0 0 1 28 0 z"/><path d="M860 194 a14 14 0 0 1 28 0 z"/></g>
  <!-- counter -->
  <rect x="180" y="440" width="320" height="14" rx="3" fill="#3d3a3a"/><rect x="190" y="454" width="300" height="106" fill="#cbbfa9"/>
  <!-- jars -->
  <use href="#jar" transform="translate(240 440)"/>
  <text x="240" y="422" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">SALT</text>
  <use href="#jar" transform="translate(330 440) rotate(-14)"/>
  <text x="326" y="420" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1" transform="rotate(-14 326 420)">SUGAR</text>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="1"><circle cx="360" cy="436" r="3"/><circle cx="370" cy="438" r="3"/><circle cx="380" cy="436" r="3"/><circle cx="374" cy="430" r="3"/></g>
  <!-- ladle went to wrong jar -->
  <path d="M240 330 C240 260 420 250 452 330" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <circle cx="300" cy="270" r="18" fill="#e07a5f"/><path d="M292 262 l16 16 M308 262 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- kheer pot -->
  <path d="M410 440 v-70 h110 v70 z" fill="#b8bec2"/><ellipse cx="465" cy="370" rx="58" ry="12" fill="#f3e3b0"/><path d="M404 384 h-12 M526 384 h12" stroke="#9a9590" stroke-width="8" stroke-linecap="round"/>
  <path d="M450 354 q6 -14 0 -26 M476 352 q6 -14 0 -26" stroke="#e3dccd" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- young cook crying -->
  <g transform="translate(580 580)"><use href="#m" color="#ffffff"/>
    <path d="M-20 -96 h40 v60 h-40 z" fill="#e0a33a" opacity=".85"/>
    <path d="M-16 -162 h32 v-6 a16 10 0 0 0 -32 0 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-10 -144 q4 4 8 0 M2 -144 q4 4 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-6 -132 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-8 -140 q-3 8 0 12 q3 -4 0 -12 z" fill="#5b9bd5"/>
    <path d="M-22 -104 l12 30 l12 -6 M22 -104 l-12 30 l-12 -6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- owner with turban, hand on cook's shoulder -->
  <g transform="translate(720 580) scale(1.14)"><use href="#m" color="#f3ede0"/>
    <path d="M-24 -60 h48 v22 h-48 z" fill="#f3ede0"/>
    <path d="M-22 -150 q-2 -30 22 -32 q24 2 22 32 q-22 -8 -44 0 z" fill="#1f6f78"/><path d="M-12 -176 l20 18" stroke="#185a61" stroke-width="4"/>
    <path d="M-17 -142 q0 34 17 34 q17 0 17 -34 q-8 10 -17 10 q-9 0 -17 -10 z" fill="#8f8a85"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-78 12" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><circle cx="30" cy="-64" r="7" fill="none" stroke="#9a9590" stroke-width="3"/>
  </g>
  <!-- bubble: Sunday, kheer, tick -->
  <rect x="740" y="300" width="190" height="96" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M752 380 l-12 30 l34 -16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M754 378 l16 14" stroke="#fff" stroke-width="5"/>
  <rect x="756" y="314" width="56" height="64" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="756" y="314" width="56" height="16" rx="4" fill="#e07a5f"/>
  <text x="784" y="364" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">SUN</text>
  <path d="M828 344 h60 a30 26 0 0 1 -60 0 z" fill="#f3e3b0" stroke="#e0a33a" stroke-width="2"/>
  <circle cx="900" cy="326" r="14" fill="#3f9a5a"/><path d="M893 326 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
