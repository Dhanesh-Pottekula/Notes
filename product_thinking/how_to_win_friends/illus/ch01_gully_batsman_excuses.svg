<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A bowled-out gully cricket batsman walks off sure he was robbed while everyone points at the broken stumps</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="f">
      <ellipse cx="0" cy="2" rx="24" ry="6" fill="#000" opacity=".08"/>
      <rect x="-12" y="-40" width="10" height="40" rx="5" fill="#b07850"/><rect x="2" y="-40" width="10" height="40" rx="5" fill="#b07850"/>
      <path d="M-24 -38 l4 -64 a20 20 0 0 1 40 0 l4 64 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-140" r="7" fill="#2e2a2a"/><circle cx="16" cy="-140" r="7" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- houses and washing line -->
  <rect x="0" y="250" width="960" height="280" fill="#eadfca"/>
  <g fill="#d8cdb8"><rect x="20" y="300" width="70" height="90" rx="4"/><rect x="520" y="300" width="70" height="90" rx="4"/><rect x="820" y="300" width="70" height="90" rx="4"/></g>
  <path d="M600 270 Q760 300 940 268" stroke="#9a9590" stroke-width="2" fill="none"/>
  <rect x="660" y="282" width="28" height="36" fill="#e07a5f"/><rect x="730" y="288" width="34" height="28" fill="#1f6f78"/><rect x="810" y="284" width="24" height="40" fill="#e0a33a"/>
  <rect y="520" width="960" height="120" fill="#d8cdb8"/>
  <path d="M40 560 H300" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- wicket: one stump stands, two fly -->
  <text x="140" y="250" text-anchor="middle" font-size="38" font-weight="800" fill="#2b2b2b" letter-spacing="1">OUT</text>
  <ellipse cx="140" cy="526" rx="50" ry="7" fill="#000" opacity=".08"/>
  <rect x="104" y="430" width="10" height="96" rx="3" fill="#e0a33a"/>
  <rect x="140" y="420" width="10" height="96" rx="3" fill="#e0a33a" transform="rotate(-28 145 470)"/>
  <rect x="176" y="404" width="10" height="96" rx="3" fill="#e0a33a" transform="rotate(-52 181 452)"/>
  <rect x="150" y="368" width="34" height="7" rx="3" fill="#8a6d5a" transform="rotate(30 167 371)"/>
  <rect x="98" y="372" width="30" height="7" rx="3" fill="#8a6d5a" transform="rotate(-20 113 375)"/>
  <g stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"><path d="M200 420 l18 -10 M206 446 l22 -4 M196 392 l12 -14"/></g>
  <circle cx="250" cy="508" r="11" fill="#c0392b"/><path d="M262 506 h22 M262 514 h16" stroke="#9a9590" stroke-width="2"/>

  <!-- batsman walking off, muttering -->
  <g transform="translate(410 548) scale(1.12)"><use href="#m" color="#ffffff"/>
    <path d="M-12 -164 l10 4 M12 -164 l-10 4" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-7" cy="-152" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-152" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -138 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-10 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l14 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="-68" width="14" height="80" rx="4" fill="#8a6d5a" transform="rotate(-24 37 -64)"/>
  </g>
  <path d="M480 360 q12 -6 4 -18 M494 372 q16 -8 6 -24" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- thought bubble -->
  <circle cx="420" cy="330" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="404" cy="300" r="12" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <ellipse cx="400" cy="170" rx="200" ry="112" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="400" y="122" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ROBBED</text>
  <!-- grievance 1: foot over crease -->
  <path d="M260 206 H340" stroke="#e07a5f" stroke-width="4"/>
  <path d="M290 222 q-2 -26 14 -26 h22 q8 0 8 10 v14 z" fill="#3d3a3a"/>
  <!-- grievance 2: bumpy pitch -->
  <path d="M362 222 q12 -24 24 0 q12 -30 26 0 q10 -18 22 0" stroke="#8a6d5a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- grievance 3: scowling umpire -->
  <circle cx="500" cy="198" r="24" fill="#d9a27a"/><path d="M476 192 a24 24 0 0 1 48 0 z" fill="#3d3a3a"/>
  <path d="M488 196 l8 4 M512 196 l-8 4" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M490 214 q10 -6 20 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>

  <!-- bowler and fielders pointing back at stumps -->
  <g transform="translate(640 548)"><use href="#m" color="#7a4e7e"/>
    <path d="M-20 -80 h40 M-20 -92 h40" stroke="#fff" stroke-width="4" opacity=".7"/>
    <ellipse cx="-6" cy="-138" rx="7" ry="6" fill="#2e2a2a"/>
    <path d="M-22 -104 l-58 -18" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(740 548) scale(.82)"><use href="#f" color="#1f6f78"/>
    <ellipse cx="-6" cy="-138" rx="6" ry="5" fill="#2e2a2a"/>
    <path d="M-20 -104 l-54 -22" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M20 -104 l10 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(850 548) scale(1.04)"><use href="#m" color="#e0a33a"/>
    <path d="M-22 -162 h52 v-6 a24 14 0 0 0 -52 0 z" fill="#1f6f78"/>
    <path d="M-6 -138 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-14 -44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M-36 -148 v-22" stroke="#d9a27a" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 -104 l8 44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
