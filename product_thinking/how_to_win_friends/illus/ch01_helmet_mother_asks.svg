<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A shouted-at son hangs his helmet on the mirror; when his mother asks why and gets a lighter helmet, he wears it</title>
  <defs>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="11" height="40" rx="5" fill="#e8d8c0"/><rect x="3" y="-40" width="11" height="40" rx="5" fill="#e8d8c0"/>
      <path d="M-26 -34 l4 -68 a22 22 0 0 1 44 0 l4 68 z" fill="currentColor"/>
      <path d="M-20 -110 l40 50" stroke="#e0a33a" stroke-width="9"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="14" cy="-160" r="8" fill="#2e2a2a"/>
    </g>
    <g id="sc">
      <ellipse cx="0" cy="2" rx="80" ry="7" fill="#000" opacity=".08"/>
      <circle cx="-50" cy="-20" r="20" fill="#3d3a3a"/><circle cx="-50" cy="-20" r="8" fill="#9a9590"/>
      <circle cx="52" cy="-20" r="20" fill="#3d3a3a"/><circle cx="52" cy="-20" r="8" fill="#9a9590"/>
      <path d="M-78 -30 q0 -40 40 -44 h30 l10 30 h40 l10 -74 h16 l-6 88 h-140 z" fill="currentColor"/>
      <rect x="-70" y="-84" width="56" height="12" rx="6" fill="#3d3a3a"/>
      <path d="M58 -128 h-24" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
      <path d="M50 -128 l-8 -24" stroke="#3d3a3a" stroke-width="3"/><ellipse cx="40" cy="-156" rx="8" ry="6" fill="#9a9590"/>
    </g>
    <g id="rider">
      <path d="M-30 -84 h40 l6 50" stroke="#4a3f55" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M-46 -80 v-44 a22 22 0 0 1 44 0 v44 z" fill="currentColor"/>
      <rect x="-56" y="-124" width="14" height="40" rx="6" fill="#6b5446"/>
      <path d="M-6 -118 l40 -10" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
      <rect x="-30" y="-154" width="12" height="12" fill="#c98a5e"/>
      <circle cx="-24" cy="-168" r="18" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#d8cdb8"/>
  <path d="M480 40 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SHOUTING</text>
  <text x="720" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASKING WHY</text>

  <!-- LEFT: gate + shouting mother -->
  <rect x="24" y="250" width="34" height="290" fill="#cbbfa9"/><rect x="18" y="240" width="46" height="16" fill="#b9ad98"/>
  <g transform="translate(110 540) scale(1.08)"><use href="#f" color="#7a4e7e"/>
    <path d="M-12 -170 l10 6 M12 -170 l-10 6" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="2" cy="-138" rx="6" ry="5" fill="#2e2a2a"/>
    <path d="M20 -104 l46 -26" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -104 l-10 30 l16 6" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g stroke="#e07a5f" stroke-width="4" stroke-linecap="round" fill="none"><path d="M150 380 l20 -8 l-6 -10 l22 -8"/><path d="M154 400 l26 0 l-8 -10 l26 0"/><path d="M150 420 l22 8 l-2 -12 l22 8"/></g>
  <!-- son riding off, helmet on mirror -->
  <g transform="translate(330 540)">
    <use href="#rider" color="#e0a33a"/>
    <path d="M-42 -176 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    <path d="M-48 -164 q-20 -6 -34 6 M-46 -176 q-20 -4 -30 -16" stroke="#9a9590" stroke-width="3" fill="none"/>
    <use href="#sc" color="#1f6f78"/>
    <path d="M40 -150 v14" stroke="#3d3a3a" stroke-width="3"/>
    <path d="M20 -118 a22 24 0 0 1 44 0 v8 h-44 z" fill="#3d3a3a"/><rect x="34" y="-120" width="28" height="10" rx="4" fill="#6c7a86"/>
  </g>
  <circle cx="420" cy="380" r="20" fill="#e07a5f"/><path d="M410 370 l20 20 M430 370 l-20 20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- RIGHT: neem, calm mother asking -->
  <rect x="924" y="250" width="34" height="290" fill="#cbbfa9"/><rect x="918" y="240" width="46" height="16" fill="#b9ad98"/>
  <g transform="translate(580 540) scale(1.08)"><use href="#f" color="#7a4e7e"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-5 -140 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -104 l30 10 l14 -16" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- bubble: heavy helmet with ache vs light helmet with tick -->
  <rect x="520" y="110" width="290" height="140" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M574 248 l10 28 l20 -28" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M576 246 h26" stroke="#fff" stroke-width="4"/>
  <path d="M556 210 a36 40 0 0 1 72 0 v12 h-72 z" fill="#3d3a3a"/><rect x="580" y="196" width="46" height="16" rx="6" fill="#6c7a86"/>
  <path d="M600 140 l8 10 l-8 8 l8 10" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M644 180 h22" stroke="#b9ad98" stroke-width="4"/><path d="M660 172 l8 8 l-8 8" stroke="#b9ad98" stroke-width="4" fill="none"/>
  <path d="M690 214 a30 32 0 0 1 60 0 z" fill="#7fb7d9"/><path d="M690 214 h60" stroke="#5a96bd" stroke-width="5"/>
  <circle cx="782" cy="150" r="16" fill="#3f9a5a"/><path d="M774 150 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- son wearing light helmet, thumbs up -->
  <g transform="translate(790 540)">
    <use href="#rider" color="#e0a33a"/>
    <path d="M-46 -170 a22 24 0 0 1 44 0 z" fill="#7fb7d9"/><path d="M-46 -170 h44" stroke="#5a96bd" stroke-width="4"/>
    <path d="M-40 -168 q-4 14 8 22" stroke="#3d3a3a" stroke-width="2" fill="none"/>
    <circle cx="-16" cy="-166" r="2.5" fill="#2e2a2a"/><path d="M-22 -158 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <use href="#sc" color="#1f6f78"/>
  </g>
  <circle cx="872" cy="330" r="20" fill="#3f9a5a"/><path d="M862 330 l7 7 l12 -14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
