<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Three family members in front of a messy kitchen each say not me and point at someone else</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -102 a22 22 0 0 1 44 0 l6 102 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="18" fill="#d9a27a"/>
    </g>
    <g id="bub"><rect x="-92" y="-38" width="184" height="70" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-12 31 l12 22 l12 -22 z" fill="#fff"/><path d="M-12 32 l12 21 l12 -21" fill="none" stroke="#cbbfa9" stroke-width="2"/>
      <text x="0" y="10" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">NOT ME</text></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- tiled wall -->
  <g stroke="#e6dccb" stroke-width="2"><path d="M0 260 H960 M0 300 H960"/><path d="M60 260 v80 M140 260 v80 M220 260 v80 M300 260 v80 M380 260 v80 M460 260 v80 M540 260 v80 M620 260 v80 M700 260 v80 M780 260 v80 M860 260 v80"/></g>
  <!-- counter -->
  <rect x="30" y="340" width="900" height="16" rx="3" fill="#3d3a3a"/>
  <rect x="40" y="356" width="880" height="244" fill="#cbbfa9"/>
  <g fill="#b9ad98"><rect x="60" y="376" width="190" height="200" rx="6"/><rect x="270" y="376" width="190" height="200" rx="6"/><rect x="480" y="376" width="190" height="200" rx="6"/><rect x="690" y="376" width="210" height="200" rx="6"/></g>
  <rect y="600" width="960" height="40" fill="#d8cdb8"/>
  <!-- stove + cooker -->
  <rect x="400" y="318" width="170" height="22" rx="4" fill="#9a9590"/>
  <rect x="440" y="266" width="64" height="52" rx="10" fill="#cfd3d6"/><rect x="452" y="256" width="40" height="12" rx="4" fill="#3d3a3a"/><rect x="468" y="242" width="8" height="16" fill="#3d3a3a"/>
  <path d="M504 282 h44" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/>
  <!-- noodle pan -->
  <path d="M190 312 h110 l-12 28 h-86 z" fill="#3d3a3a"/><path d="M300 318 h50" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <path d="M206 312 q10 -16 20 0 q10 -16 20 0 q10 -16 20 0 q10 -16 20 0" stroke="#e0a33a" stroke-width="4" fill="none"/>
  <!-- dirty plates -->
  <g fill="#dfe3e6"><ellipse cx="680" cy="334" rx="56" ry="8"/><ellipse cx="684" cy="324" rx="54" ry="8"/><ellipse cx="678" cy="314" rx="52" ry="8"/><ellipse cx="686" cy="304" rx="50" ry="8"/></g>
  <g fill="#e0a33a" opacity=".8"><circle cx="660" cy="302" r="5"/><circle cx="700" cy="304" r="4"/></g>
  <!-- spills, peels, lid -->
  <g fill="#e0a33a"><ellipse cx="360" cy="338" rx="22" ry="4"/><circle cx="388" cy="336" r="3"/><circle cx="342" cy="334" r="3"/></g>
  <g fill="#c88aa8"><path d="M590 336 q8 -12 16 0 z"/><path d="M614 334 q8 -10 16 0 z"/><path d="M790 336 q8 -12 16 0 z"/></g>
  <path d="M120 336 l-14 -6 M132 334 l-6 -12" stroke="#1f6f78" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="860" cy="620" rx="30" ry="7" fill="#cfd3d6"/>

  <!-- blame loop -->
  <path d="M308 160 H372" stroke="#7a4e7e" stroke-width="5" marker-end="url(#ah)"/>
  <path d="M588 160 H652" stroke="#7a4e7e" stroke-width="5" marker-end="url(#ah)"/>
  <path d="M760 104 C760 30 200 30 200 98" stroke="#7a4e7e" stroke-width="5" fill="none" stroke-dasharray="12 9" marker-end="url(#ah)"/>
  <use href="#bub" transform="translate(200 160)"/>
  <use href="#bub" transform="translate(480 160)"/>
  <use href="#bub" transform="translate(760 160)"/>

  <!-- teenager shrugging with fork -->
  <g transform="translate(200 600) scale(1.1)"><use href="#m" color="#7a4e7e"/>
    <path d="M-24 -100 a24 26 0 0 1 48 0" fill="none" stroke="#5f3c63" stroke-width="10"/>
    <path d="M-12 -126 q12 14 24 0" stroke="#fff" stroke-width="3" fill="none"/>
    <circle cx="-7" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M-6 -140 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-22 18 l-6 -20 M22 -104 l22 18 l6 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M56 -90 v-30 M52 -120 v-10 M56 -120 v-10 M60 -120 v-10" stroke="#9a9590" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- uncle checking watch, bag on shoulder, turning to go -->
  <g transform="translate(480 600) scale(1.12)"><use href="#m" color="#e8eef2"/>
    <path d="M-16 -126 l36 66" stroke="#6b5446" stroke-width="5"/><rect x="14" y="-70" width="42" height="32" rx="5" fill="#6b5446"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#8f8a85"/>
    <path d="M-12 -132 q12 8 24 0" stroke="#2e2a2a" stroke-width="4" fill="none"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-22 -104 l-6 30 l30 -14" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-4" y="-66" width="10" height="9" rx="2" fill="#3d3a3a"/>
    <path d="M22 -104 l10 42" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- grandmother arms folded, thumb pointing back -->
  <g transform="translate(760 600) scale(1.08)"><use href="#f" color="#e0a33a"/>
    <path d="M-22 -110 l40 50" stroke="#c97b2a" stroke-width="12"/>
    <path d="M-18 -152 a18 18 0 0 1 36 0 z" fill="#e8e3dc"/><circle cx="14" cy="-160" r="8" fill="#e8e3dc"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-148" r="5"/><circle cx="7" cy="-148" r="5"/><path d="M-2 -148 h4"/></g>
    <path d="M-5 -137 q5 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -100 l-10 22 h-24" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -100 l-30 -6 M-52 -106 l-6 -12" stroke="#d9a27a" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
</svg>
