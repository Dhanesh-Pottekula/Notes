<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mocking meme spreads across phones and the angry classmate confronts its maker at his hostel door</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="meme"><rect x="0" y="0" width="64" height="52" rx="4" fill="#fff"/><circle cx="32" cy="22" r="10" fill="none" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="19" cy="20" r="7" fill="none" stroke="#2b2b2b" stroke-width="2.5"/><circle cx="45" cy="20" r="7" fill="none" stroke="#2b2b2b" stroke-width="2.5"/><path d="M32 32 v12 M24 48 l8 -6 l8 6" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
    <g id="ph"><rect x="-34" y="-58" width="68" height="116" rx="10" fill="#3d3a3a"/><rect x="-28" y="-48" width="56" height="94" rx="4" fill="#dff0e4"/><use href="#meme" transform="translate(-24 -36) scale(.75)"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <text x="170" y="84" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">MEME</text>
  <!-- LEFT: big phone with chat + meme -->
  <rect x="96" y="120" width="150" height="270" rx="18" fill="#3d3a3a"/>
  <rect x="108" y="138" width="126" height="232" rx="6" fill="#dff0e4"/>
  <rect x="108" y="138" width="126" height="26" fill="#1f6f78"/>
  <rect x="118" y="176" width="70" height="14" rx="7" fill="#fff"/>
  <use href="#meme" transform="translate(134 200) scale(1.15)"/>
  <rect x="150" y="272" width="74" height="14" rx="7" fill="#c9ecd2"/>
  <rect x="118" y="296" width="56" height="14" rx="7" fill="#fff"/>
  <rect x="140" y="320" width="84" height="14" rx="7" fill="#c9ecd2"/>
  <!-- copies spreading -->
  <use href="#ph" transform="translate(70 500) rotate(-12)"/>
  <use href="#ph" transform="translate(190 520)"/>
  <use href="#ph" transform="translate(310 480) rotate(10)"/>
  <g stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8"><path d="M130 392 L90 430" marker-end="url(#ah)"/><path d="M172 394 L184 446" marker-end="url(#ah)"/><path d="M226 384 L284 416" marker-end="url(#ah)"/></g>
  <g stroke="#e0a33a" stroke-width="4" fill="none" stroke-linecap="round"><path d="M20 420 q8 8 16 0 M28 404 q8 8 16 0 M240 446 q8 8 16 0 M248 430 q8 8 16 0 M356 404 q8 8 16 0 M364 388 q8 8 16 0"/></g>

  <!-- RIGHT: hostel corridor -->
  <rect x="400" y="0" width="560" height="560" fill="#cfe0c8"/>
  <rect x="400" y="560" width="560" height="80" fill="#d8cdb8"/>
  <path d="M400 0 V640" stroke="#d8cdb8" stroke-width="3"/>
  <text x="680" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PAYBACK</text>
  <!-- window with palm -->
  <rect x="826" y="110" width="104" height="120" rx="4" fill="#bfe0ea"/><path d="M878 110 v120 M826 170 h104" stroke="#fff" stroke-width="4"/>
  <path d="M884 230 q-4 -50 4 -86" stroke="#8a6d5a" stroke-width="6" fill="none"/>
  <path d="M888 146 q-26 -6 -40 10 M888 146 q22 -14 38 -2 M888 146 q-10 -20 -30 -22 M888 146 q14 -22 30 -22" stroke="#3f7d4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- open door -->
  <rect x="440" y="196" width="160" height="364" fill="#6b5446"/>
  <rect x="452" y="208" width="136" height="352" fill="#3d3a3a" opacity=".35"/>
  <path d="M440 196 l-24 16 v348 l24 0 z" fill="#8a6d5a"/>
  <rect x="490" y="164" width="60" height="28" rx="4" fill="#fff"/><text x="520" y="186" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">14</text>

  <!-- meme maker leaning back in doorway -->
  <g transform="translate(520 560) rotate(-5)"><use href="#m" color="#ffffff"/>
    <rect x="-16" y="-60" width="32" height="26" fill="#4a3f55"/>
    <circle cx="4" cy="-152" r="3" fill="#2e2a2a"/><circle cx="16" cy="-152" r="3" fill="#2e2a2a"/><ellipse cx="10" cy="-138" rx="5" ry="6" fill="#2e2a2a"/>
    <path d="M-22 -104 l-22 -20 l-4 -20 M22 -104 l22 -20 l4 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-56" y="-164" width="14" height="24" rx="3" fill="#3d3a3a"/>
  </g>
  <!-- friend holding meme maker -->
  <g transform="translate(600 562) scale(.96)"><use href="#m" color="#e0a33a"/>
    <path d="M-24 -86 h48" stroke="#1f6f78" stroke-width="8"/>
    <path d="M-22 -104 l-40 -10" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l8 44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- friend in mundu pushing angry classmate back -->
  <g transform="translate(720 562)"><use href="#m" color="#e07a5f"/>
    <path d="M-20 0 l2 -64 h36 l2 64 z" fill="#f3ede0"/>
    <path d="M22 -104 l40 -4 M22 -96 l40 8" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-10 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- angry classmate jabbing finger -->
  <g transform="translate(820 562) scale(1.04)"><use href="#m" color="#7a4e7e"/>
    <path d="M-10 -124 l6 40" stroke="#e0a33a" stroke-width="3"/><rect x="-12" y="-86" width="16" height="20" rx="2" fill="#fff"/>
    <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="-8" cy="-150" r="6"/><circle cx="6" cy="-150" r="6"/></g>
    <path d="M-16 -164 l10 6 M12 -164 l-10 6" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="-2" cy="-136" rx="6" ry="4" fill="#2e2a2a"/>
    <path d="M-22 -104 l-78 -26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g stroke="#e07a5f" stroke-width="4" stroke-linecap="round" fill="none"><path d="M800 362 l8 -18 l8 10 l8 -18"/><path d="M836 370 l12 -14 l4 12 l12 -14"/></g>
  <circle cx="660" cy="300" r="22" fill="#e07a5f"/><text x="660" y="312" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">!</text>
</svg>
