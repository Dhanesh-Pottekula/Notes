<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A pressure cooker lets off steam while a wife quietly moves her husband's angry letter into an unsent drawer</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -102 a22 22 0 0 1 44 0 l6 102 z" fill="currentColor"/>
      <path d="M-20 -110 l40 50" stroke="#c9b26a" stroke-width="9"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-160" r="8" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- LEFT: kitchen counter + cooker -->
  <rect x="30" y="440" width="380" height="16" rx="3" fill="#3d3a3a"/><rect x="40" y="456" width="360" height="104" fill="#cbbfa9"/>
  <rect x="110" y="420" width="220" height="20" rx="4" fill="#9a9590"/>
  <g fill="#5b9bd5"><path d="M196 420 q6 -14 12 0 z"/><path d="M212 420 q6 -16 12 0 z"/><path d="M228 420 q6 -14 12 0 z"/></g>
  <path d="M150 408 v-70 a70 26 0 0 1 140 0 v70 a70 14 0 0 1 -140 0 z" fill="#cfd3d6"/>
  <ellipse cx="220" cy="338" rx="70" ry="14" fill="#b8bec2"/>
  <rect x="180" y="316" width="80" height="16" rx="6" fill="#3d3a3a"/>
  <path d="M258 324 h96" stroke="#3d3a3a" stroke-width="12" stroke-linecap="round"/>
  <rect x="212" y="292" width="16" height="26" rx="4" fill="#3d3a3a"/>
  <g stroke="#7a4e7e" stroke-width="3" stroke-dasharray="6 6" fill="none"><path d="M176 392 q20 -24 40 -30 M260 392 q-20 -24 -36 -32"/></g>
  <!-- steam plume -->
  <g fill="#fff" stroke="#e3dccd" stroke-width="2"><circle cx="214" cy="270" r="18"/><circle cx="196" cy="238" r="24"/><circle cx="180" cy="198" r="28"/><circle cx="154" cy="156" r="30"/><circle cx="160" cy="114" r="26"/></g>
  <text x="336" y="128" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">LET OFF STEAM</text>
  <path d="M480 40 V610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- RIGHT: window with empty post box -->
  <rect x="790" y="110" width="140" height="150" rx="4" fill="#cfe3ea"/><path d="M860 110 v150 M790 185 h140" stroke="#fff" stroke-width="5"/>
  <rect x="818" y="196" width="30" height="58" rx="12" fill="#c0392b"/><rect x="812" y="190" width="42" height="12" rx="6" fill="#a83226"/><rect x="824" y="210" width="18" height="4" fill="#3d3a3a"/>
  <!-- desk -->
  <rect x="540" y="400" width="300" height="14" rx="3" fill="#8a6d5a"/>
  <rect x="690" y="414" width="140" height="146" fill="#6b5446"/>
  <rect x="700" y="470" width="120" height="80" fill="#8a6d5a"/>
  <rect x="700" y="430" width="120" height="30" fill="#8a6d5a"/>
  <path d="M700 470 l-26 28 h124 l22 -28 z" fill="#a8896f"/>
  <text x="762" y="534" text-anchor="middle" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="1">UNSENT</text>
  <rect x="556" y="414" width="10" height="146" fill="#6b5446"/>
  <!-- angry letter on desk -->
  <rect x="600" y="378" width="74" height="22" rx="2" fill="#fff" transform="rotate(-4 637 389)"/>
  <path d="M606 386 l8 -4 l8 6 l8 -6 l8 6 l8 -6 l8 6 l8 -4" stroke="#e07a5f" stroke-width="2.5" fill="none"/>
  <!-- husband on stool, steam over head -->
  <rect x="520" y="480" width="70" height="12" rx="4" fill="#6b5446"/><rect x="530" y="492" width="8" height="68" fill="#6b5446"/><rect x="572" y="492" width="8" height="68" fill="#6b5446"/>
  <g transform="translate(560 480)">
    <path d="M-10 0 h50 v80" stroke="#f3ede0" stroke-width="22" fill="none" stroke-linejoin="round"/>
    <path d="M-24 4 v-46 a24 24 0 0 1 48 0 v46 z" fill="#ffffff" stroke="#e3dccd" stroke-width="1.5"/>
    <path d="M18 -54 l44 -16" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-6" y="-80" width="12" height="10" fill="#c98a5e"/>
    <circle cx="2" cy="-94" r="19" fill="#c98a5e"/><path d="M-17 -98 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-4" cy="-112" r="5"/><circle cx="10" cy="-112" r="5"/></g>
    <path d="M2 -104 l8 4 M14 -104 l-6 4" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M6 -84 h10" stroke="#2e2a2a" stroke-width="3"/>
  </g>
  <g fill="#fff" stroke="#e3dccd" stroke-width="2"><circle cx="560" cy="350" r="10"/><circle cx="572" cy="328" r="13"/><circle cx="558" cy="302" r="15"/></g>
  <text x="530" y="324" text-anchor="middle" font-size="34" font-weight="800" fill="#e07a5f">!</text>
  <!-- link: cooker steam to his head steam -->
  <path d="M222 196 C360 190 470 240 540 296" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- wife lifting letter into drawer -->
  <g transform="translate(880 560) scale(1.06)"><use href="#f" color="#1f6f78"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-5 -140 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-20 -104 l-36 30 l-30 -4" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -104 l8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="770" y="460" width="42" height="28" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="2" transform="rotate(10 791 474)"/>
  <path d="M772 464 l20 12 l20 -10" stroke="#cbbfa9" stroke-width="2" fill="none" transform="rotate(10 791 474)"/>
  <path d="M790 500 v16" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
</svg>
