<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Residents shout at a housing society secretary whose excuses act like a shield</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -102 a22 22 0 0 1 44 0 l6 102 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="14" cy="-160" r="8" fill="#2e2a2a"/>
    </g>
    <g id="shout"><path d="M0 0 l18 -8 l-4 -10 l20 -6 M0 18 l24 0 l-6 -10 l24 0" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="mo"><ellipse cx="0" cy="-138" rx="6" ry="5" fill="#2e2a2a"/><path d="M-12 -164 l10 5 M12 -164 l-10 5" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <rect x="380" y="34" width="200" height="10" rx="5" fill="#fff"/><path d="M380 44 l-20 24 M580 44 l20 24" stroke="#fff" stroke-width="2" opacity=".6"/>
  <text x="480" y="112" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SOCIETY MEETING</text>
  <!-- notice board with colour chart -->
  <rect x="40" y="150" width="150" height="110" rx="4" fill="#b9876a"/><rect x="50" y="160" width="130" height="90" fill="#e8d8c0"/>
  <g><rect x="62" y="172" width="22" height="22" fill="#1f6f78"/><rect x="90" y="172" width="22" height="22" fill="#e0a33a"/><rect x="118" y="172" width="22" height="22" fill="#e07a5f"/><rect x="146" y="172" width="22" height="22" fill="#7a4e7e"/><rect x="62" y="206" width="106" height="6" fill="#b9ad98"/><rect x="62" y="220" width="80" height="6" fill="#b9ad98"/></g>
  <!-- plastic chairs -->
  <g fill="#cbbfa9"><rect x="60" y="500" width="70" height="10" rx="3"/><rect x="66" y="510" width="6" height="50"/><rect x="118" y="510" width="6" height="50"/><rect x="290" y="500" width="70" height="10" rx="3"/><rect x="296" y="510" width="6" height="50"/><rect x="348" y="510" width="6" height="50"/></g>

  <!-- residents shouting -->
  <g transform="translate(100 560)"><use href="#f" color="#e07a5f"/><use href="#mo"/>
    <path d="M20 -104 l30 -40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><rect x="40" y="-190" width="36" height="46" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(12 58 -167)"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(210 560)"><use href="#m" color="#e8e3dc"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#e8e3dc"/><use href="#mo"/>
    <path d="M22 -104 l20 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M44 -60 v60" stroke="#6b5446" stroke-width="6"/>
    <path d="M-22 -104 l-10 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(320 560)"><use href="#m" color="#1f6f78"/><use href="#mo"/>
    <path d="M-16 -122 v30 M16 -122 v30" stroke="#f6f1e7" stroke-width="4"/>
    <path d="M22 -104 l58 -12" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-10 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(430 560)"><use href="#f" color="#e0a33a"/><use href="#mo"/>
    <path d="M-20 -110 l40 50" stroke="#c97b2a" stroke-width="9"/>
    <path d="M20 -104 l-2 -26 l-6 -10" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#shout" transform="translate(140 340)"/>
  <use href="#shout" transform="translate(250 352)"/>
  <use href="#shout" transform="translate(410 330)"/>
  <use href="#shout" transform="translate(470 370)"/>

  <!-- shield of excuses with sparks -->
  <path d="M600 250 q60 -26 70 -10 q26 150 -10 300 q-20 -10 -60 -20 q20 -130 0 -270 z" fill="#dfe8ea" opacity=".9"/>
  <path d="M612 270 q40 -16 46 -4" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g stroke="#e0a33a" stroke-width="4" stroke-linecap="round"><path d="M586 300 l-18 -10 M584 318 l-22 4 M588 336 l-16 14 M586 400 l-20 -8 M588 416 l-18 10"/></g>

  <!-- table with jug -->
  <rect x="660" y="430" width="270" height="14" rx="3" fill="#8a6d5a"/><rect x="676" y="444" width="10" height="116" fill="#6b5446"/><rect x="906" y="444" width="10" height="116" fill="#6b5446"/>
  <path d="M870 430 v-42 a14 14 0 0 1 28 0 v42 z" fill="#cfd3d6"/>
  <!-- secretary: arms crossed, eyes shut, chin up -->
  <g transform="translate(780 560) scale(1.12)"><use href="#m" color="#f0e6c8"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#8f8a85"/>
    <rect x="8" y="-118" width="6" height="14" fill="#1f6f78"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-150" r="6"/><circle cx="7" cy="-150" r="6"/><path d="M-1 -150 h2"/></g>
    <path d="M-11 -150 h8 M3 -150 h8" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-6 -136 h12" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-22 -104 l8 26 h34 M22 -104 l-8 22 h-30" stroke="#c98a5e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- bubble -->
  <rect x="690" y="180" width="244" height="64" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M770 243 l10 26 l14 -26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M772 242 h20" stroke="#fff" stroke-width="4"/>
  <text x="812" y="224" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NOT MY FAULT</text>
  <!-- paint bucket with price tag -->
  <path d="M560 560 l-6 -56 h64 l-6 56 z" fill="#1f6f78"/><path d="M554 504 a32 18 0 0 1 64 0" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <rect x="600" y="466" width="56" height="30" rx="4" fill="#fff" stroke="#e07a5f" stroke-width="2"/><text x="628" y="488" text-anchor="middle" font-size="20" font-weight="800" fill="#e07a5f">2x</text>
  <path d="M598 480 l-12 22" stroke="#e07a5f" stroke-width="2"/>
</svg>
