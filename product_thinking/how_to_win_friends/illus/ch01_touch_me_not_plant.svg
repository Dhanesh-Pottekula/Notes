<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A poked touch-me-not plant folds shut while the same plant given sun and water opens wide</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="lo"><path d="M0 0 H92" stroke="#3f7d4a" stroke-width="3"/>
      <g fill="#5aa060"><ellipse cx="14" cy="-10" rx="4" ry="10"/><ellipse cx="14" cy="10" rx="4" ry="10"/><ellipse cx="26" cy="-11" rx="4" ry="11"/><ellipse cx="26" cy="11" rx="4" ry="11"/><ellipse cx="38" cy="-12" rx="4" ry="12"/><ellipse cx="38" cy="12" rx="4" ry="12"/><ellipse cx="50" cy="-12" rx="4" ry="12"/><ellipse cx="50" cy="12" rx="4" ry="12"/><ellipse cx="62" cy="-11" rx="4" ry="11"/><ellipse cx="62" cy="11" rx="4" ry="11"/><ellipse cx="74" cy="-10" rx="4" ry="10"/><ellipse cx="74" cy="10" rx="4" ry="10"/><ellipse cx="86" cy="-8" rx="4" ry="8"/><ellipse cx="86" cy="8" rx="4" ry="8"/></g></g>
    <g id="lc"><path d="M0 0 H80" stroke="#3f7d4a" stroke-width="3"/>
      <g fill="#6f8f5a"><ellipse cx="22" cy="-3" rx="14" ry="3"/><ellipse cx="22" cy="3" rx="14" ry="3"/><ellipse cx="48" cy="-3" rx="14" ry="3"/><ellipse cx="48" cy="3" rx="14" ry="3"/><ellipse cx="70" cy="-2" rx="10" ry="2.5"/><ellipse cx="70" cy="2" rx="10" ry="2.5"/></g></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="440" width="960" height="100" fill="#d8cdb8"/>
  <path d="M0 440 H960" stroke="#cbbfa9" stroke-width="6"/>
  <rect y="540" width="960" height="100" fill="#cf9f7c"/>
  <g fill="#b9876a"><ellipse cx="80" cy="590" rx="10" ry="5"/><ellipse cx="380" cy="610" rx="8" ry="4"/><ellipse cx="560" cy="600" rx="9" ry="5"/><ellipse cx="900" cy="585" rx="10" ry="5"/></g>
  <path d="M480 40 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">CRITICISM</text>
  <text x="700" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">CARE</text>

  <!-- LEFT: closed, drooping plant -->
  <ellipse cx="250" cy="544" rx="60" ry="8" fill="#000" opacity=".08"/>
  <path d="M250 542 C246 480 262 440 252 380" stroke="#3f7d4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M250 500 C230 480 214 470 196 466" stroke="#3f7d4a" stroke-width="4" fill="none"/>
  <path d="M252 470 C276 452 296 450 312 452" stroke="#3f7d4a" stroke-width="4" fill="none"/>
  <use href="#lc" transform="translate(252 384) rotate(110)"/>
  <use href="#lc" transform="translate(252 390) rotate(70)"/>
  <use href="#lc" transform="translate(198 466) rotate(120)"/>
  <use href="#lc" transform="translate(310 452) rotate(60)"/>
  <use href="#lc" transform="translate(254 430) rotate(135)"/>
  <g stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"><path d="M300 372 l14 -8 M306 392 l16 0 M196 400 l-14 -6"/></g>
  <!-- poking hand -->
  <path d="M-10 170 L150 316" stroke="#1f6f78" stroke-width="44" stroke-linecap="round"/>
  <circle cx="166" cy="332" r="24" fill="#c98a5e"/>
  <path d="M176 344 L222 384" stroke="#c98a5e" stroke-width="13" stroke-linecap="round"/>
  <path d="M150 350 q-6 14 6 22" stroke="#c98a5e" stroke-width="11" fill="none" stroke-linecap="round"/>
  <!-- bounce: nothing gets in -->
  <path d="M90 420 L176 430 L104 500" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <circle cx="60" cy="300" r="22" fill="#e07a5f"/><text x="60" y="312" text-anchor="middle" font-size="30" font-weight="800" fill="#fff">!</text>

  <!-- RIGHT: open plant with flower -->
  <ellipse cx="700" cy="544" rx="80" ry="9" fill="#000" opacity=".08"/>
  <path d="M700 542 C694 470 712 420 704 330" stroke="#3f7d4a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M700 496 C680 476 660 466 640 462" stroke="#3f7d4a" stroke-width="4" fill="none"/>
  <path d="M703 456 C726 436 748 432 766 434" stroke="#3f7d4a" stroke-width="4" fill="none"/>
  <use href="#lo" transform="translate(642 462) rotate(-160)"/>
  <use href="#lo" transform="translate(764 434) rotate(-20)"/>
  <use href="#lo" transform="translate(704 380) rotate(-140)"/>
  <use href="#lo" transform="translate(704 372) rotate(-40)"/>
  <use href="#lo" transform="translate(700 508) rotate(10)"/>
  <g stroke="#d96aa0" stroke-width="3" stroke-linecap="round" transform="translate(704 318)"><path d="M0 0 l0 -18 M0 0 l13 -13 M0 0 l18 0 M0 0 l13 13 M0 0 l-13 -13 M0 0 l-18 0 M0 0 l-13 13 M0 0 l7 -17 M0 0 l-7 -17 M0 0 l17 -7 M0 0 l-17 -7"/></g>
  <circle cx="704" cy="318" r="7" fill="#e98bb8"/>
  <!-- sun -->
  <circle cx="886" cy="140" r="34" fill="#e0a33a"/>
  <g stroke="#e0a33a" stroke-width="5" stroke-linecap="round"><path d="M886 86 v-16 M886 194 v16 M832 140 h-16 M940 140 h14 M848 102 l-11 -11 M924 102 l11 -11 M848 178 l-11 11 M924 178 l11 11"/></g>
  <g stroke="#e0a33a" stroke-width="2" opacity=".5" stroke-dasharray="6 8"><path d="M850 176 L760 300 M870 186 L800 330"/></g>
  <!-- child's arm with watering can -->
  <path d="M970 300 L900 330" stroke="#e0c13a" stroke-width="30" stroke-linecap="round"/>
  <path d="M900 330 L872 350" stroke="#b07850" stroke-width="11" stroke-linecap="round"/>
  <rect x="806" y="340" width="70" height="56" rx="10" fill="#9fb3bf"/>
  <path d="M818 342 a26 22 0 0 1 46 0" stroke="#7f939f" stroke-width="7" fill="none"/>
  <path d="M808 380 L760 444" stroke="#9fb3bf" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="756" cy="450" rx="12" ry="6" fill="#7f939f" transform="rotate(-50 756 450)"/>
  <g stroke="#5b9bd5" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"><path d="M750 458 L726 530 M758 462 L742 534 M742 456 L712 526"/></g>
</svg>
