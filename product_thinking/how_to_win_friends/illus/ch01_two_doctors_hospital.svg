<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>In a hospital ward one doctor snaps at a ward boy in front of patients while another calmly fixes a drip with a nurse</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="f">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -102 a22 22 0 0 1 44 0 l6 102 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="18" fill="#b07850"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-160" r="8" fill="#2e2a2a"/>
    </g>
    <g id="bed">
      <rect x="0" y="-70" width="10" height="70" fill="#9a9590"/><rect x="170" y="-50" width="8" height="50" fill="#9a9590"/>
      <rect x="0" y="-56" width="178" height="18" rx="4" fill="#fff" stroke="#d8cdb8" stroke-width="2"/>
      <path d="M50 -56 h128 v-10 q-64 -14 -128 0 z" fill="#9fc3c8"/>
      <ellipse cx="30" cy="-64" rx="22" ry="9" fill="#fff"/>
    </g>
    <g id="pat"><circle cx="0" cy="0" r="15" fill="#c98a5e"/><path d="M-15 -3 a15 15 0 0 1 30 0 z" fill="#2e2a2a"/></g>
    <g id="drip"><rect x="-3" y="-200" width="6" height="200" fill="#9a9590"/><path d="M-30 -200 h60" stroke="#9a9590" stroke-width="5"/><rect x="12" y="-196" width="22" height="34" rx="6" fill="#cfe3ea" stroke="#9fb3bf" stroke-width="2"/><ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="0" width="960" height="250" fill="#dfeae6"/>
  <g fill="#cfe3ea"><rect x="60" y="110" width="90" height="120" rx="4"/><rect x="330" y="110" width="90" height="120" rx="4"/><rect x="540" y="110" width="90" height="120" rx="4"/><rect x="810" y="110" width="90" height="120" rx="4"/></g>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SNAPS</text>
  <text x="720" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">FIXES</text>

  <!-- LEFT: two beds with uneasy patients -->
  <use href="#bed" transform="translate(20 380)"/>
  <use href="#bed" transform="translate(270 380)"/>
  <g transform="translate(56 302)"><use href="#pat"/><circle cx="-5" cy="2" r="3" fill="#fff"/><circle cx="5" cy="2" r="3" fill="#fff"/><circle cx="-4" cy="2" r="1.5" fill="#2e2a2a"/><circle cx="6" cy="2" r="1.5" fill="#2e2a2a"/></g>
  <g transform="translate(306 302)"><use href="#pat"/><circle cx="-5" cy="2" r="3" fill="#fff"/><circle cx="5" cy="2" r="3" fill="#fff"/><circle cx="-6" cy="2" r="1.5" fill="#2e2a2a"/><circle cx="4" cy="2" r="1.5" fill="#2e2a2a"/></g>
  <!-- shouting doctor -->
  <g transform="translate(150 580) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#8f8a85"/>
    <path d="M-10 -122 q-6 30 6 44" stroke="#3d3a3a" stroke-width="3" fill="none"/><circle cx="-4" cy="-78" r="5" fill="#3d3a3a"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="0" cy="-150" r="5"/><circle cx="12" cy="-150" r="5"/></g>
    <path d="M-4 -162 l8 5 M16 -162 l-8 5" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="8" cy="-136" rx="6" ry="5" fill="#2e2a2a"/>
    <path d="M22 -104 l62 -14" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g stroke="#e07a5f" stroke-width="4" stroke-linecap="round" fill="none"><path d="M262 404 l18 -8 l-4 -10 l20 -6"/><path d="M264 424 l24 0 l-6 -10 l24 0"/></g>
  <!-- ward boy shrinking back with dropped tray -->
  <g transform="translate(380 580) rotate(6)"><use href="#m" color="#c9b27a"/>
    <path d="M-12 -158 a14 10 0 0 1 24 0" stroke="#2e2a2a" stroke-width="0" fill="none"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="4" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -138 q4 -3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-14 -26 M22 -104 l14 -26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <ellipse cx="440" cy="562" rx="34" ry="7" fill="#cfd3d6"/><circle cx="414" cy="556" r="5" fill="#cfd3d6"/><circle cx="458" cy="548" r="4" fill="#cfd3d6"/>
  <circle cx="420" cy="350" r="20" fill="#e07a5f"/><text x="420" y="361" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">!</text>

  <!-- RIGHT: bed with relaxed patient -->
  <use href="#bed" transform="translate(760 380)"/>
  <g transform="translate(796 302)"><use href="#pat"/><path d="M-6 4 q6 6 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
  <use href="#drip" transform="translate(700 560)"/>
  <!-- tangled line being straightened -->
  <path d="M722 398 q-20 20 0 30 q20 10 -4 24 q-14 10 6 30 q30 20 80 -100" stroke="#9fb3bf" stroke-width="3" fill="none"/>
  <circle cx="756" cy="296" r="20" fill="#3f9a5a"/><path d="M746 296 l7 7 l12 -14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- calm woman doctor -->
  <g transform="translate(560 580) scale(1.08)"><use href="#f" color="#ffffff"/>
    <path d="M-24 -40 l-4 40 h56 l-4 -40 z" fill="#7a4e7e"/>
    <path d="M-8 -122 q-6 30 6 44" stroke="#3d3a3a" stroke-width="3" fill="none"/><circle cx="-2" cy="-78" r="5" fill="#3d3a3a"/>
    <circle cx="-2" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="10" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M0 -140 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -104 l34 -4 l22 -18" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- junior nurse pointing at line -->
  <g transform="translate(640 580) scale(.98)"><use href="#f" color="#eef3f4"/>
    <rect x="-14" y="-172" width="28" height="10" rx="3" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
    <circle cx="2" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="12" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M2 -140 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -104 l46 -42" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -104 l-8 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
