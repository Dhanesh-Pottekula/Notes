<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An uncle's dismissive remark at a wedding is still what the grown cousin remembers twenty years later</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="unc">
      <use href="#m" color="#8a7f6a"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#d8d3cc"/>
      <path d="M-14 -138 q14 -8 28 0" stroke="#3d3a3a" stroke-width="5" fill="none"/>
      <circle cx="-12" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="0" cy="-150" r="2.5" fill="#2e2a2a"/>
      <path d="M-10 -132 q6 3 12 -2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
      <path d="M-22 -104 l-30 -18" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
      <path d="M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    </g>
    <g id="spiky"><path d="M0 -50 l14 18 l22 -10 l2 22 l22 4 l-12 18 l14 16 l-22 4 l-2 22 l-20 -10 l-14 18 l-12 -18 l-22 10 l0 -22 l-22 -6 l14 -16 l-12 -18 l22 -4 l4 -22 l20 12 z" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
      <rect x="-14" y="-18" width="28" height="36" fill="#b9ad98"/><g fill="#fff"><rect x="-8" y="-12" width="6" height="6"/><rect x="2" y="-12" width="6" height="6"/><rect x="-8" y="0" width="6" height="6"/><rect x="2" y="0" width="6" height="6"/></g>
      <path d="M20 -20 q10 10 4 22" stroke="#c98a5e" stroke-width="7" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- LEFT festive -->
  <rect x="0" y="0" width="480" height="640" fill="#fbeedb"/>
  <path d="M0 140 Q120 190 240 140 Q360 190 480 140" stroke="#e0a33a" stroke-width="10" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M0 160 Q120 210 240 160 Q360 210 480 160" stroke="#e07a5f" stroke-width="8" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>
  <g fill="#f3e3b0"><circle cx="60" cy="110" r="5"/><circle cx="140" cy="118" r="5"/><circle cx="220" cy="110" r="5"/><circle cx="300" cy="118" r="5"/><circle cx="380" cy="110" r="5"/><circle cx="450" cy="118" r="5"/></g>
  <ellipse cx="90" cy="470" rx="60" ry="14" fill="#e8d8c0"/><rect x="84" y="470" width="12" height="90" fill="#e8d8c0"/>
  <rect y="560" width="480" height="80" fill="#e8d0b0"/>
  <text x="240" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">WEDDING</text>
  <!-- cousin with phone -->
  <g transform="translate(170 590) scale(1.05)"><use href="#m" color="#e0a33a"/>
    <path d="M-24 -60 h48 v14 h-48 z" fill="#e0a33a"/>
    <circle cx="0" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="12" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M0 -138 q6 2 12 -2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l36 -24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="50" y="-168" width="34" height="50" rx="5" fill="#3d3a3a"/><rect x="54" y="-162" width="26" height="38" fill="#fff"/>
    <path d="M60 -144 l5 6 l10 -12" stroke="#3f9a5a" stroke-width="3" fill="none"/>
  </g>
  <path d="M158 470 l8 10 l-6 8 l8 10" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- uncle smirking -->
  <g transform="translate(380 590) scale(1.12)"><use href="#unc"/><rect x="-60" y="-130" width="14" height="20" rx="2" fill="#f0b84a" opacity=".85"/></g>
  <use href="#spiky" transform="translate(320 270) scale(1.1)"/>

  <path d="M480 0 V640" stroke="#d8cdb8" stroke-width="3"/>
  <!-- RIGHT muted, rainy -->
  <rect x="480" y="0" width="480" height="640" fill="#e4e4e2"/>
  <g stroke="#b9c3c8" stroke-width="2" stroke-linecap="round"><path d="M520 120 l-6 18 M580 200 l-6 18 M640 110 l-6 18 M900 140 l-6 18 M860 230 l-6 18 M540 300 l-6 18 M920 320 l-6 18 M700 90 l-6 18"/></g>
  <rect x="480" y="560" width="480" height="80" fill="#cfcfcb"/>
  <text x="720" y="76" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">20 YEARS LATER</text>
  <!-- small table, framed photo with garland -->
  <rect x="790" y="450" width="130" height="12" rx="3" fill="#8a6d5a"/><rect x="800" y="462" width="8" height="98" fill="#6b5446"/><rect x="902" y="462" width="8" height="98" fill="#6b5446"/>
  <rect x="820" y="370" width="70" height="80" rx="3" fill="#6b5446"/><rect x="828" y="378" width="54" height="64" fill="#d8d3cc"/>
  <circle cx="855" cy="402" r="11" fill="#b9ad98"/><path d="M838 442 a17 16 0 0 1 34 0 z" fill="#b9ad98"/>
  <path d="M822 374 q33 60 66 0" stroke="#e0a33a" stroke-width="8" fill="none" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- grown cousin, hands folded, head down -->
  <g transform="translate(660 590) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 h48 v14 h-48 z" fill="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#5d5656"/><path d="M-19 -152 v8 M19 -152 v8" stroke="#b9b3ad" stroke-width="4"/>
    <path d="M-8 -142 h5 M4 -142 h5" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-4 -134 h8" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-22 -104 l8 26 l14 -10 M22 -104 l-8 26 l-14 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- memory bubble -->
  <circle cx="650" cy="400" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="636" cy="372" r="12" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <ellipse cx="690" cy="236" rx="160" ry="112" fill="#fff8ec" stroke="#cbbfa9" stroke-width="2"/>
  <g transform="translate(760 330) scale(.72)"><use href="#unc"/></g>
  <use href="#spiky" transform="translate(640 220) scale(.95)"/>
</svg>
