<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two cookers whistling at once drown each other out; with one cooker at a time the couple take turns talking and listening</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="ck">
      <path d="M-40 0 v-46 a40 14 0 0 1 80 0 v46 a40 10 0 0 1 -80 0 z" fill="#cfd3d6"/>
      <ellipse cx="0" cy="-46" rx="40" ry="10" fill="#b8bec2"/>
      <rect x="-24" y="-60" width="48" height="12" rx="5" fill="#3d3a3a"/>
      <path d="M22 -54 h46" stroke="#3d3a3a" stroke-width="9" stroke-linecap="round"/>
    </g>
    <rect id="wh" x="-6" y="-80" width="12" height="20" rx="4" fill="#3d3a3a"/>
    <g id="man">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/>
      <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="#9aa0a6"/>
      <rect x="-6" y="-172" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-188" r="20" fill="#c98a5e"/><path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="wife">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <path d="M-28 0 l6 -110 a22 22 0 0 1 44 0 l6 110 z" fill="#e48aa6"/>
      <path d="M-22 -118 l44 54" stroke="#c75a7e" stroke-width="9"/>
      <rect x="-6" y="-142" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-158" r="19" fill="#b07850"/><path d="M-19 -160 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-170" r="8" fill="#2e2a2a"/>
    </g>
    <g id="kitchen">
      <rect x="20" y="420" width="440" height="16" rx="3" fill="#3d3a3a"/>
      <rect x="30" y="436" width="420" height="124" fill="#cbbfa9"/>
      <path d="M170 436 v124 M310 436 v124" stroke="#b9ad98" stroke-width="3"/>
      <rect x="140" y="402" width="200" height="18" rx="4" fill="#6f6a66"/>
      <rect x="40" y="200" width="100" height="10" rx="3" fill="#8a6d5a"/>
      <g fill="#b8bec2"><rect x="50" y="170" width="20" height="30" rx="4"/><rect x="80" y="160" width="20" height="40" rx="4"/><rect x="110" y="174" width="20" height="26" rx="4"/></g>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="482" width="478" height="640" fill="#f8ecd6"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- LEFT: both at once -->
  <use href="#kitchen"/>
  <use href="#ck" transform="translate(190 402)"/><use href="#wh" transform="translate(190 402)"/>
  <use href="#ck" transform="translate(290 402)"/><use href="#wh" transform="translate(290 402)"/>
  <g fill="#fff" stroke="#e3dccd" stroke-width="2">
    <circle cx="186" cy="300" r="20"/><circle cx="200" cy="262" r="28"/><circle cx="230" cy="226" r="32"/>
    <circle cx="294" cy="300" r="20"/><circle cx="280" cy="262" r="28"/><circle cx="252" cy="230" r="32"/></g>
  <g stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"><path d="M150 230 l-14 -8 l10 -6 l-14 -8 M330 230 l14 -8 l-10 -6 l14 -8"/></g>
  <circle cx="240" cy="160" r="26" fill="#e0a33a"/><text x="240" y="172" text-anchor="middle" font-size="34" font-weight="800" fill="#fff">?</text>
  <g transform="translate(80 590)"><use href="#man"/>
    <path d="M-7 -192 l6 2 M7 -192 l-6 2" stroke="#2e2a2a" stroke-width="3"/><ellipse cx="0" cy="-176" rx="6" ry="5" fill="#2e2a2a"/>
    <path d="M-22 -146 l-16 -30 l14 -12 M22 -146 l16 -30 l-14 -12" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(400 590)"><use href="#wife"/>
    <path d="M-6 -162 l5 2 M6 -162 l-5 2" stroke="#2e2a2a" stroke-width="3"/><ellipse cx="0" cy="-148" rx="5" ry="4" fill="#2e2a2a"/>
    <path d="M-20 -114 l-14 -32 l14 -14 M20 -114 l14 -32 l-14 -14" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M36 300 h60 l6 -10 l6 10 h14 v40 h-30 l-10 12 l-2 -12 h-44 z" fill="#ffffff" stroke="#e07a5f" stroke-width="3"/>
  <g stroke="#e07a5f" stroke-width="3" fill="none"><path d="M48 314 l8 12 l8 -12 l8 12 l8 -12 l8 12 l8 -12"/></g>
  <path d="M360 300 h80 v40 h-20 l2 12 l-14 -12 h-48 v-28 l-6 -6 z" fill="#ffffff" stroke="#e07a5f" stroke-width="3"/>
  <g stroke="#e07a5f" stroke-width="3" fill="none"><path d="M372 314 l8 12 l8 -12 l8 12 l8 -12 l8 12 l8 -12"/></g>
  <text x="240" y="70" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">BOTH AT ONCE</text>
  <path d="M482 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <!-- RIGHT: one at a time -->
  <rect x="820" y="150" width="110" height="120" rx="4" fill="#cfe3ea"/><path d="M875 150 v120 M820 210 h110" stroke="#fff" stroke-width="5"/>
  <use href="#kitchen" transform="translate(480 0)"/>
  <use href="#ck" transform="translate(720 402)"/><use href="#wh" transform="translate(720 402)"/>
  <g fill="#fff" stroke="#e3dccd" stroke-width="2"><circle cx="716" cy="300" r="18"/><circle cx="706" cy="264" r="24"/><circle cx="716" cy="224" r="26"/></g>
  <g transform="translate(880 420)"><path d="M-40 0 v-40 a40 12 0 0 1 80 0 v40 a40 10 0 0 1 -80 0 z" fill="#cfd3d6"/><ellipse cx="0" cy="-40" rx="40" ry="10" fill="#e6e8ea"/></g>
  <rect x="910" y="410" width="40" height="12" rx="5" fill="#3d3a3a"/>
  <!-- wife speaking -->
  <g transform="translate(570 590)"><use href="#wife"/>
    <circle cx="-2" cy="-158" r="2.5" fill="#2e2a2a"/><circle cx="10" cy="-158" r="2.5" fill="#2e2a2a"/><ellipse cx="4" cy="-147" rx="5" ry="4" fill="#2e2a2a"/>
    <path d="M20 -114 l30 -10 l10 -12 M-20 -114 l-14 30" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <path d="M520 290 h120 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-56 l-14 16 l-2 -16 h-48 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <g stroke="#7a4e7e" stroke-width="4" stroke-linecap="round"><path d="M530 312 h100 M530 328 h70"/></g>
  <!-- husband seated, listening -->
  <rect x="806" y="530" width="76" height="12" rx="4" fill="#6b5446"/><rect x="814" y="542" width="8" height="48" fill="#6b5446"/><rect x="866" y="542" width="8" height="48" fill="#6b5446"/>
  <g transform="translate(846 530)">
    <path d="M-10 0 h-46 v56" stroke="#4a3f55" stroke-width="22" fill="none" stroke-linejoin="round"/>
    <path d="M-24 4 v-50 a24 24 0 0 1 48 0 v50 z" fill="#9aa0a6" transform="rotate(-10)"/>
    <path d="M-22 -40 l-30 34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-16" y="-86" width="12" height="12" fill="#c98a5e"/>
    <circle cx="-14" cy="-100" r="19" fill="#c98a5e"/><path d="M-33 -104 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-24" cy="-100" r="2.5" fill="#2e2a2a"/><path d="M-30 -88 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <!-- swap badge -->
  <circle cx="860" cy="330" r="30" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M842 324 a18 18 0 0 1 32 -8" stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <path d="M878 336 a18 18 0 0 1 -32 8" stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <text x="720" y="70" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE AT A TIME</text>
</svg>
