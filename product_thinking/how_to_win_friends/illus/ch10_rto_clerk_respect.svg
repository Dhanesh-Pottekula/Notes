<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a government office counter, arguing makes the clerk fold his arms; asking his advice makes him fix the form</title>
  <defs>
    <g id="p">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/>
      <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="currentColor"/>
      <rect x="-6" y="-172" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-188" r="20" fill="#c98a5e"/>
      <path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <rect id="win" x="30" y="200" width="250" height="200" fill="#efe7d8"/>
    <g id="desk">
      <g stroke="#9a9590" stroke-width="4"><path d="M30 200 h250 M60 200 v200 M100 200 v200 M210 200 v200 M250 200 v200"/></g>
      <rect x="26" y="400" width="270" height="18" rx="3" fill="#8a6d5a"/>
      <rect x="30" y="418" width="262" height="142" fill="#6b5446"/>
      <rect x="40" y="350" width="50" height="50" fill="#e0d3a8"/><path d="M40 362 h50 M40 376 h50 M40 388 h50" stroke="#cbbfa9" stroke-width="3"/>
      <circle cx="400" cy="110" r="30" fill="#ffffff" stroke="#3d3a3a" stroke-width="4"/><path d="M400 92 v18 l12 6" stroke="#3d3a3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="230" y="392" width="56" height="12" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5" transform="rotate(-4 258 398)"/>
    </g>
    <g id="clerk">
      <path d="M-30 0 v-66 a30 30 0 0 1 60 0 v66 z" fill="#9a9488"/>
      <rect x="-6" y="-104" width="12" height="12" fill="#b07850"/>
      <circle cx="0" cy="-120" r="21" fill="#b07850"/><path d="M-21 -122 a21 21 0 0 1 42 0 z" fill="#2e2a2a"/>
      <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-121" r="6"/><circle cx="7" cy="-121" r="6"/></g>
      <path d="M-10 -108 q10 -5 20 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- LEFT -->
  <use href="#win"/>
  <g transform="translate(150 400)"><use href="#clerk"/>
    <path d="M-17 -132 l10 4 M17 -132 l-10 4" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-6 -100 h12" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-28 -48 h56" stroke="#b07850" stroke-width="14" stroke-linecap="round"/><path d="M-24 -38 h48" stroke="#8a847a" stroke-width="4"/></g>
  <use href="#desk"/>
  <g stroke="#3d3a3a" stroke-width="3" opacity=".6"><path d="M120 200 v190 M150 200 v190 M180 200 v190"/></g>
  <rect x="44" y="140" width="92" height="44" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><rect x="44" y="140" width="92" height="12" rx="4" fill="#e07a5f"/>
  <text x="90" y="176" text-anchor="middle" font-size="18" font-weight="700" fill="#2b2b2b">tomorrow</text>
  <circle cx="258" cy="350" r="20" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><path d="M249 341 l18 18 M267 341 l-18 18" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(380 560)"><use href="#p" color="#e0a33a" transform="rotate(-8)"/>
    <circle cx="-16" cy="-188" r="2.5" fill="#2e2a2a" transform="rotate(-8)"/><path d="M-22 -195 l8 3" stroke="#2e2a2a" stroke-width="2.5" transform="rotate(-8)"/>
    <path d="M-14 -176 h8" stroke="#2e2a2a" stroke-width="3" transform="rotate(-8)"/>
    <path d="M-44 -140 l-50 -12 l-20 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M6 -140 l14 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-38" cy="-212" r="10" fill="#2e2a2a"/></g>
  <path d="M330 240 h110 a12 12 0 0 1 12 12 v46 a12 12 0 0 1 -12 12 h-60 l-18 18 l0 -18 h-32 a12 12 0 0 1 -12 -12 v-46 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="356" y="254" width="60" height="34" rx="3" fill="#a8cfe8"/><rect x="346" y="288" width="80" height="7" rx="2" fill="#3d3a3a"/>
  <text x="240" y="60" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ARGUE</text>
  <path d="M480 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <!-- RIGHT -->
  <g transform="translate(480 0)">
    <use href="#win"/>
    <g transform="translate(160 400) rotate(10)"><use href="#clerk"/>
      <path d="M-14 -133 q4 -3 8 0 M6 -133 q4 -3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
      <path d="M-6 -102 q6 6 12 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
      <path d="M24 -70 l44 30" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
      <path d="M-24 -70 l-30 -40" stroke="#b07850" stroke-width="12" stroke-linecap="round"/></g>
    <use href="#desk"/>
    <g stroke="#3d3a3a" stroke-width="3" opacity=".6"><path d="M120 200 v190 M150 200 v190"/></g>
    <path d="M236 376 l-20 18" stroke="#1f6f78" stroke-width="5" stroke-linecap="round"/>
    <rect x="40" y="146" width="70" height="44" rx="4" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><rect x="34" y="190" width="82" height="8" rx="2" fill="#3d3a3a"/>
    <path d="M64 158 l22 22 M86 158 l-22 22" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
    <circle cx="258" cy="350" r="20" fill="#3f9a5a"/><path d="M248 350 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g transform="translate(390 560)"><use href="#p" color="#e0a33a"/>
      <circle cx="-16" cy="-202" r="10" fill="#2e2a2a"/>
      <circle cx="-7" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-188" r="2.5" fill="#2e2a2a"/><path d="M-6 -177 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
      <path d="M-22 -146 l-24 40 l-22 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 -146 l10 40 l-30 6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <path d="M330 240 h90 a12 12 0 0 1 12 12 v46 a12 12 0 0 1 -12 12 h-40 l-14 18 l-2 -18 h-34 a12 12 0 0 1 -12 -12 v-46 a12 12 0 0 1 12 -12 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
    <text x="375" y="294" text-anchor="middle" font-size="42" font-weight="800" fill="#1f6f78">?</text>
    <text x="240" y="60" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASK HIS ADVICE</text>
  </g>
</svg>
