<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A scooter rider with the green light brakes at the stop line as a water tanker runs the red light in front of him</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- background: palms + tea stall -->
  <rect x="700" y="200" width="10" height="110" fill="#8a6d5a"/><path d="M705 200 q-40 -10 -60 20 M705 200 q40 -10 60 20 M705 200 q-20 -36 -50 -36 M705 200 q20 -36 50 -36" stroke="#5f9a4a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <rect x="160" y="236" width="120" height="74" fill="#e0a33a" opacity=".55"/><path d="M150 236 h140 l-10 -20 h-120 z" fill="#e07a5f" opacity=".6"/>
  <!-- cross road -->
  <rect y="300" width="960" height="190" fill="#b9ad98"/>
  <path d="M0 395 h960" stroke="#f6f1e7" stroke-width="5" stroke-dasharray="40 30"/>
  <!-- rider's lane -->
  <path d="M190 490 h300 l90 150 h-480 z" fill="#a89c88"/>
  <rect x="190" y="482" width="300" height="12" fill="#ffffff"/>
  <!-- tanker moving left -->
  <g>
    <rect x="300" y="262" width="470" height="140" rx="60" fill="#2f6db0"/>
    <path d="M330 300 h410" stroke="#5b8fd0" stroke-width="8" stroke-linecap="round"/>
    <rect x="180" y="300" width="130" height="134" rx="12" fill="#1f4f8a"/>
    <path d="M196 314 h70 v50 h-80 z" fill="#cfe3ea"/>
    <rect x="290" y="400" width="490" height="22" fill="#3d3a3a"/>
    <circle cx="240" cy="440" r="30" fill="#3d3a3a"/><circle cx="240" cy="440" r="11" fill="#9a9590"/>
    <circle cx="560" cy="440" r="30" fill="#3d3a3a"/><circle cx="560" cy="440" r="11" fill="#9a9590"/>
    <circle cx="700" cy="440" r="30" fill="#3d3a3a"/><circle cx="700" cy="440" r="11" fill="#9a9590"/>
    <rect x="772" y="340" width="20" height="10" fill="#9a9590"/><path d="M786 356 q-4 8 0 12 q4 -4 0 -12z" fill="#5b9bd5"/>
  </g>
  <g stroke="#7f7464" stroke-width="5" stroke-linecap="round"><path d="M810 290 h70 M820 320 h90 M810 350 h60"/></g>
  <!-- left signal: green -->
  <rect x="50" y="200" width="12" height="360" fill="#3d3a3a"/>
  <rect x="28" y="150" width="56" height="130" rx="10" fill="#3d3a3a"/>
  <circle cx="56" cy="178" r="15" fill="#5b4a4a"/><circle cx="56" cy="214" r="15" fill="#5b5a4a"/><circle cx="56" cy="250" r="15" fill="#3fbf6a"/>
  <!-- right signal: red for the tanker -->
  <rect x="902" y="210" width="12" height="350" fill="#3d3a3a"/>
  <rect x="884" y="160" width="48" height="110" rx="10" fill="#3d3a3a"/>
  <circle cx="908" cy="186" r="13" fill="#e2463a"/><circle cx="908" cy="216" r="13" fill="#5b5a4a"/><circle cx="908" cy="246" r="13" fill="#4a5b4a"/>
  <!-- rider from behind -->
  <g stroke="#3d3a3a" stroke-width="3" opacity=".5"><path d="M296 640 l-4 -40 M318 640 l2 -40"/></g>
  <rect x="294" y="560" width="24" height="80" rx="8" fill="#2e2a2a"/>
  <path d="M256 590 v-80 q0 -24 24 -28 h52 q24 4 24 28 v80 q-50 20 -100 0 z" fill="#9a9590"/>
  <rect x="284" y="520" width="44" height="14" rx="4" fill="#e2463a"/>
  <path d="M210 446 h192" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/>
  <rect x="200" y="424" width="12" height="20" rx="3" fill="#cbbfa9"/><rect x="400" y="424" width="12" height="20" rx="3" fill="#cbbfa9"/>
  <path d="M262 492 v-60 a44 44 0 0 1 88 0 v60 z" fill="#a8cfe8"/>
  <path d="M266 404 l-44 40 M346 404 l44 40" stroke="#a8cfe8" stroke-width="16" stroke-linecap="round"/>
  <circle cx="222" cy="446" r="8" fill="#c98a5e"/><circle cx="390" cy="446" r="8" fill="#c98a5e"/>
  <rect x="276" y="392" width="60" height="74" rx="10" fill="#e0a33a"/><path d="M276 410 h60" stroke="#b9822a" stroke-width="4"/>
  <rect x="298" y="366" width="16" height="12" fill="#c98a5e"/>
  <circle cx="306" cy="340" r="34" fill="#3d3a3a"/><path d="M276 352 a34 34 0 0 0 60 0" fill="#2b2b2b"/>
  <!-- brake: green tick -->
  <path d="M204 456 q-6 40 -34 62" stroke="#3f9a5a" stroke-width="4" fill="none"/>
  <circle cx="152" cy="536" r="22" fill="#3f9a5a"/><path d="M142 536 l7 7 l13 -14" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="150" y="604" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">BRAKE</text>
  <!-- keep going: red arrow into tanker -->
  <path d="M404 500 C430 460 450 420 470 384" stroke="#c0392b" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#ar)"/>
  <circle cx="486" cy="356" r="22" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><path d="M476 346 l20 20 M496 346 l-20 20" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- hospital inset -->
  <path d="M500 336 C540 260 590 220 626 190" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <rect x="610" y="40" width="220" height="150" rx="16" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="640" y="120" width="150" height="16" rx="4" fill="#cbbfa9"/><rect x="640" y="100" width="40" height="22" rx="8" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="680" y="104" width="110" height="18" rx="4" fill="#a8cfe8"/>
  <path d="M648 136 v26 M782 136 v26" stroke="#9a9590" stroke-width="5"/>
  <rect x="770" y="54" width="14" height="40" fill="#e2463a"/><rect x="757" y="67" width="40" height="14" fill="#e2463a"/>
  <!-- cracked shield: being right is not armour -->
  <path d="M300 160 l56 18 v40 q0 48 -56 70 q-56 -22 -56 -70 v-40 z" fill="#ffffff" stroke="#1f6f78" stroke-width="4"/>
  <circle cx="300" cy="216" r="16" fill="#3fbf6a"/>
  <path d="M300 162 l-10 36 l18 20 l-12 30 l8 38" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <text x="384" y="220" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">RIGHT</text>
</svg>
