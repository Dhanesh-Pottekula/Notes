<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A neighbour wins a parking argument in the society group chat, then a week later the other family turns away from him</title>
  <defs>
    <g id="p">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/>
      <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="currentColor"/>
      <rect x="-6" y="-172" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-188" r="20" fill="#c98a5e"/>
      <path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="kid">
      <ellipse cx="0" cy="2" rx="18" ry="4" fill="#000" opacity=".08"/>
      <rect x="-10" y="-44" width="8" height="44" rx="4" fill="#4a3f55"/><rect x="2" y="-44" width="8" height="44" rx="4" fill="#4a3f55"/>
      <path d="M-16 -40 v-36 a16 16 0 0 1 32 0 v36 z" fill="currentColor"/>
      <circle cx="0" cy="-104" r="14" fill="#d9a27a"/><path d="M-14 -106 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="482" width="478" height="640" fill="#e6ebec"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <rect x="482" y="560" width="478" height="80" fill="#c9cfcf"/>
  <!-- LEFT: building + gate -->
  <rect x="20" y="170" width="150" height="390" fill="#efe2c8"/>
  <g fill="#cfe3ea"><rect x="44" y="200" width="40" height="40"/><rect x="104" y="200" width="40" height="40"/><rect x="44" y="270" width="40" height="40"/><rect x="104" y="270" width="40" height="40"/></g>
  <rect x="170" y="330" width="16" height="230" fill="#3d3a3a"/><rect x="420" y="330" width="16" height="230" fill="#3d3a3a"/>
  <g stroke="#3d3a3a" stroke-width="5"><path d="M186 360 h234 M186 520 h234"/><path d="M210 360 v160 M240 360 v160 M270 360 v160 M300 360 v160 M330 360 v160 M360 360 v160 M390 360 v160"/></g>
  <!-- crooked car -->
  <g transform="rotate(-6 300 520)">
    <path d="M196 540 v-36 q0 -10 10 -12 l30 -6 l26 -30 h80 l30 30 l30 8 q10 3 10 14 v32 z" fill="#9a9590"/>
    <path d="M272 470 h66 l22 24 h-102 z" fill="#cfe3ea"/>
    <circle cx="240" cy="542" r="18" fill="#3d3a3a"/><circle cx="364" cy="542" r="18" fill="#3d3a3a"/>
  </g>
  <!-- quiet neighbour, head down -->
  <g transform="translate(80 560) scale(.85)"><use href="#p" color="#8b2f3c"/>
    <path d="M-8 -176 q8 -5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-7 -186 h4 M3 -186 h4" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-22 -146 l-4 60 M22 -146 l-2 50 l-10 6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-18" y="-96" width="12" height="18" rx="2" fill="#3d3a3a"/></g>
  <!-- winner with phone up -->
  <g transform="translate(410 560)"><use href="#p" color="#ffffff"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-189" r="6"/><circle cx="7" cy="-189" r="6"/></g>
    <path d="M-8 -176 q8 6 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -146 l12 -40 l-2 -40" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -146 l-8 56" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="22" y="-262" width="22" height="36" rx="4" fill="#3d3a3a"/></g>
  <!-- phone inset -->
  <rect x="236" y="100" width="168" height="200" rx="18" fill="#3d3a3a"/>
  <rect x="246" y="112" width="148" height="176" rx="10" fill="#ffffff"/>
  <path d="M404 250 L430 300" stroke="#3d3a3a" stroke-width="4"/>
  <rect x="258" y="124" width="96" height="44" rx="8" fill="#d8eee2"/><rect x="266" y="132" width="40" height="28" rx="3" fill="#9a9590"/><circle cx="276" cy="160" r="5" fill="#3d3a3a"/><circle cx="298" cy="160" r="5" fill="#3d3a3a"/>
  <rect x="258" y="176" width="96" height="40" rx="8" fill="#d8eee2"/><circle cx="282" cy="196" r="13" fill="none" stroke="#1f6f78" stroke-width="3"/><path d="M282 188 v8 l6 4" stroke="#1f6f78" stroke-width="3" fill="none"/>
  <rect x="258" y="224" width="96" height="44" rx="8" fill="#d8eee2"/><g stroke="#7a4e7e" stroke-width="3"><path d="M270 236 h50 M270 246 h60 M270 256 h40"/></g>
  <circle cx="372" cy="246" r="16" fill="#3f9a5a"/><path d="M364 246 l6 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="240" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">WON</text>
  <path d="M482 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <!-- RIGHT: courtyard a week later -->
  <rect x="800" y="110" width="132" height="92" rx="6" fill="#d7e6ee"/>
  <text x="866" y="164" text-anchor="middle" font-size="20" font-weight="800" fill="#2b5f80">MEETING</text>
  <path d="M806 202 l6 16 l6 -16 M826 202 l5 12 l5 -12 M846 202 l6 18 l6 -18 M870 202 l5 12 l5 -12 M892 202 l6 16 l6 -16 M914 202 l5 12 l5 -12" fill="#ffffff" stroke="#a9c7d6" stroke-width="1.5"/>
  <rect x="862" y="218" width="8" height="342" fill="#9a9590"/>
  <!-- winner alone, puzzled -->
  <g transform="translate(560 560)"><use href="#p" color="#ffffff"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-189" r="6"/><circle cx="7" cy="-189" r="6"/></g>
    <path d="M-6 -174 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -146 l14 30 l-6 -50" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -146 l-6 56" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <circle cx="610" cy="328" r="20" fill="#e0a33a"/><text x="610" y="339" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">?</text>
  <!-- his son alone with ball -->
  <g transform="translate(650 560)"><use href="#kid" color="#e0a33a"/>
    <circle cx="-5" cy="-104" r="2" fill="#2e2a2a"/><circle cx="5" cy="-104" r="2" fill="#2e2a2a"/><path d="M-5 -95 q5 -3 10 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M14 -70 l14 18" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/><circle cx="32" cy="-50" r="8" fill="#c0392b"/></g>
  <!-- neighbour and kid walking away (backs) -->
  <g transform="translate(770 560)"><use href="#p" color="#8b2f3c"/>
    <circle cx="0" cy="-188" r="20" fill="#2e2a2a"/>
    <path d="M22 -146 l14 50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -146 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(836 560)"><use href="#kid" color="#1f6f78"/><circle cx="0" cy="-104" r="14" fill="#2e2a2a"/>
    <path d="M-14 -70 l-14 4" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/></g>
  <path d="M900 470 h36" stroke="#7a4e7e" stroke-width="4" stroke-linecap="round"/><path d="M930 462 l10 8 l-10 8" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="720" y="70" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LOST GOODWILL</text>
</svg>
