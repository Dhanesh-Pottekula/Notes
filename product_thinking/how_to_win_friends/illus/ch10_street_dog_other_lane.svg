<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a fork of two old lanes a man takes the longer lane instead of pushing past a growling dog lying across his own lane</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c0392b"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3f9a5a"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- buildings -->
  <rect x="0" y="100" width="200" height="540" fill="#d9a65a"/>
  <g fill="#8a6d5a"><rect x="40" y="160" width="44" height="64" rx="20"/><rect x="120" y="160" width="44" height="64" rx="20"/><rect x="40" y="280" width="44" height="64" rx="20"/></g>
  <rect x="200" y="470" width="560" height="170" fill="#d8cdb8"/>
  <path d="M200 470 L300 250 H390 V470 z" fill="#cbbfa9"/>
  <path d="M570 470 V250 H680 L760 470 z" fill="#cbbfa9"/>
  <g stroke="#b9ad98" stroke-width="3"><path d="M260 340 h130 M232 400 h158 M570 340 h145 M570 400 h165 M200 540 h560 M200 600 h560"/></g>
  <rect x="390" y="150" width="180" height="320" fill="#7fa9c4"/>
  <rect x="380" y="138" width="200" height="18" fill="#5b7f99"/>
  <g fill="#5b7f99"><rect x="414" y="180" width="40" height="56" rx="18"/><rect x="506" y="180" width="40" height="56" rx="18"/></g>
  <rect x="455" y="250" width="50" height="70" rx="6" fill="#e0a33a" opacity=".6"/><circle cx="480" cy="280" r="7" fill="#e07a5f"/>
  <rect x="760" y="100" width="200" height="540" fill="#e07a5f" opacity=".75"/>
  <g fill="#8a4f3f"><rect x="800" y="170" width="44" height="64" rx="20"/><rect x="880" y="170" width="44" height="64" rx="20"/></g>
  <!-- wires -->
  <path d="M0 120 Q240 170 480 120 T960 120" stroke="#3d3a3a" stroke-width="2" fill="none"/>
  <path d="M0 140 Q300 200 600 130 T960 150" stroke="#3d3a3a" stroke-width="2" fill="none"/>
  <!-- doorway bell on right lane -->
  <rect x="770" y="300" width="60" height="120" rx="26" fill="#6b5446"/>
  <path d="M800 300 v18" stroke="#3d3a3a" stroke-width="2"/><path d="M792 330 q8 -16 16 0 z" fill="#e0a33a"/>
  <!-- dog across left lane -->
  <g transform="translate(300 420)">
    <ellipse cx="0" cy="18" rx="90" ry="8" fill="#000" opacity=".08"/>
    <path d="M-60 16 q-10 -40 30 -44 h60 q30 0 34 30 l-4 14 z" fill="#a0683e"/>
    <path d="M-60 10 q-30 0 -30 -14" stroke="#a0683e" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-40 16 h-30 M40 16 h36" stroke="#a0683e" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="-40" r="22" fill="#a0683e"/>
    <path d="M58 -58 l-6 -18 l16 10 z M80 -60 l4 -18 l10 16 z" fill="#7d4f2e"/>
    <path d="M84 -34 h22 v12 h-20 z" fill="#a0683e"/>
    <path d="M88 -24 l3 6 l3 -6 l3 6 l3 -6" stroke="#ffffff" stroke-width="2" fill="none"/>
    <circle cx="76" cy="-46" r="3" fill="#2e2a2a"/><path d="M70 -54 l12 4" stroke="#2e2a2a" stroke-width="3"/>
    <g stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round"><path d="M114 -46 l8 -6 l-2 10 l8 -6 M114 -20 l10 2 l-6 6 l10 2"/></g>
  </g>
  <!-- bite inset -->
  <path d="M220 190 h170 a14 14 0 0 1 14 14 v80 a14 14 0 0 1 -14 14 h-60 l-14 30 l-10 -30 h-86 a14 14 0 0 1 -14 -14 v-80 a14 14 0 0 1 14 -14 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M240 280 v-30 q0 -10 10 -10 h40 q10 0 10 10 v30 z" fill="#c98a5e"/>
  <g fill="#c98a5e"><rect x="244" y="214" width="10" height="34" rx="5"/><rect x="258" y="208" width="10" height="40" rx="5"/><rect x="272" y="210" width="10" height="38" rx="5"/><rect x="286" y="218" width="10" height="30" rx="5"/></g>
  <rect x="238" y="252" width="66" height="18" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M250 252 v18 M262 252 v18" stroke="#e3dccd" stroke-width="2"/>
  <g transform="rotate(-35 350 248)"><rect x="320" y="240" width="56" height="16" rx="3" fill="#a8cfe8" stroke="#7f9fb4" stroke-width="2"/><path d="M376 248 h20" stroke="#7f9fb4" stroke-width="3"/><rect x="306" y="242" width="14" height="12" fill="#7f9fb4"/></g>
  <!-- man at the fork -->
  <g transform="translate(480 610)">
    <ellipse cx="0" cy="2" rx="34" ry="7" fill="#000" opacity=".08"/>
    <rect x="-17" y="-88" width="14" height="88" rx="6" fill="#ffffff"/><rect x="3" y="-88" width="14" height="88" rx="6" fill="#ffffff"/>
    <path d="M-30 -60 v-86 a30 30 0 0 1 60 0 v86 z" fill="#ffffff"/>
    <path d="M-30 -60 v-86 a30 30 0 0 1 60 0 v86 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <path d="M-24 -170 L22 -80" stroke="#8a6d5a" stroke-width="6"/><rect x="10" y="-96" width="34" height="34" rx="6" fill="#e0a33a"/>
    <rect x="-7" y="-190" width="14" height="14" fill="#c98a5e"/>
    <circle cx="0" cy="-208" r="22" fill="#c98a5e"/><path d="M-22 -210 a22 22 0 0 1 44 0 z" fill="#2e2a2a"/>
    <circle cx="2" cy="-208" r="2.5" fill="#2e2a2a"/><circle cx="14" cy="-208" r="2.5" fill="#2e2a2a"/><path d="M0 -196 q8 5 14 -1" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M26 -160 l26 -32 l4 -24" stroke="#c98a5e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-26 -160 l-14 60" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-52 -100 h28 l-4 40 h-20 z" fill="#5f9a4a"/><path d="M-46 -100 q8 -16 16 0" stroke="#5f9a4a" stroke-width="4" fill="none"/>
  </g>
  <!-- arrows -->
  <path d="M440 470 C420 440 400 430 404 410" stroke="#c0392b" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#ar)"/>
  <circle cx="408" cy="380" r="20" fill="#ffffff" stroke="#c0392b" stroke-width="3"/><path d="M399 371 l18 18 M417 371 l-18 18" stroke="#c0392b" stroke-width="4" stroke-linecap="round"/>
  <path d="M540 460 C580 420 600 360 640 316" stroke="#3f9a5a" stroke-width="5" fill="none" stroke-dasharray="10 8" marker-end="url(#ag)"/>
  <circle cx="662" cy="300" r="20" fill="#3f9a5a"/><path d="M652 300 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="600" y="380" width="86" height="34" rx="17" fill="#ffffff" stroke="#3f9a5a" stroke-width="2"/>
  <text x="643" y="404" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">+2 min</text>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">MY LANE</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEXT LANE</text>
</svg>
