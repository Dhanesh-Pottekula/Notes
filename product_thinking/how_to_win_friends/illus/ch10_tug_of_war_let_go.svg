  <g transform="translate(185 560) rotate(-22)"><use href="#k" color="#2f6db0"/><path d="M-6 -158 h4 M6 -158 h4" stroke="#2e2a2a" stroke-width="3"/><path d="M-4 -146 h10" stroke="#2e2a2a" stroke-width="3"/></g>
