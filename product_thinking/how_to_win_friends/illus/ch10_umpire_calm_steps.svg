<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A village cricket umpire listens calmly to an upset batsman; a row of six step icons shows how he handles the dispute</title>
  <defs>
    <g id="p">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/>
      <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="currentColor"/>
      <rect x="-6" y="-172" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-188" r="20" fill="#c98a5e"/>
      <path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
    <g id="wl"><rect x="-16" y="-80" width="13" height="80" rx="6" fill="#ffffff"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#ffffff"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="300" width="960" height="340" fill="#e3d3b4"/>
  <!-- crowd wall, tree, tractor -->
  <rect x="0" y="260" width="700" height="40" fill="#cbbfa9"/>
  <g fill="#b9ad98"><circle cx="60" cy="246" r="14"/><circle cx="110" cy="248" r="14"/><circle cx="170" cy="246" r="14"/><circle cx="240" cy="248" r="14"/><circle cx="560" cy="246" r="14"/><circle cx="620" cy="248" r="14"/></g>
  <path d="M880 300 q-14 -100 10 -190" stroke="#8a6d5a" stroke-width="12" fill="none"/>
  <path d="M890 110 q-50 -6 -80 30 M890 110 q50 -6 70 30 M890 110 q-30 -40 -70 -40 M890 110 q30 -44 66 -36" stroke="#5f9a4a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <rect x="730" y="250" width="80" height="40" rx="6" fill="#e07a5f" opacity=".7"/><circle cx="748" cy="294" r="12" fill="#3d3a3a" opacity=".7"/><circle cx="796" cy="290" r="18" fill="#3d3a3a" opacity=".7"/>
  <!-- pitch + stumps -->
  <path d="M300 520 L380 330 h130 L600 520 z" fill="#d8c49c"/>
  <g fill="#f3ede0"><rect x="430" y="300" width="6" height="40"/><rect x="442" y="300" width="6" height="40"/><rect x="454" y="300" width="6" height="40"/></g>
  <!-- opposing captain, arms crossed -->
  <g transform="translate(130 480) scale(.85)"><use href="#p" color="#ffffff"/><use href="#wl"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <circle cx="-7" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-188" r="2.5" fill="#2e2a2a"/><path d="M-6 -176 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-24 -118 h48" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/></g>
  <!-- batsman, frustrated -->
  <g transform="translate(290 520)"><use href="#p" color="#ffffff"/><use href="#wl"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <rect x="-20" y="-80" width="40" height="70" rx="8" fill="#f3ede0" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-22 -206 a22 20 0 0 1 44 0 v4 h-44 z" fill="#1f6f78"/>
    <path d="M-12 -194 l8 3 M12 -194 l-8 3" stroke="#2e2a2a" stroke-width="3"/><circle cx="-6" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-188" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-176" rx="6" ry="5" fill="#2e2a2a"/>
    <path d="M22 -146 l36 -24 l10 -24" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -146 l-12 50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-48" y="-100" width="12" height="90" rx="4" fill="#d9a94e" transform="rotate(-10 -42 -100)"/></g>
  <path d="M214 150 h120 l14 -12 l6 16 l18 8 l-16 10 l4 18 l-18 -6 l-10 14 l-8 -14 h-110 l-12 -10 l8 -12 z" fill="#ffffff" stroke="#e07a5f" stroke-width="3"/>
  <text x="290" y="182" text-anchor="middle" font-size="34" font-weight="800" fill="#e07a5f">!</text>
  <path d="M300 200 l-6 50" stroke="#e07a5f" stroke-width="3" stroke-dasharray="4 5"/>
  <!-- umpire, calm, listening -->
  <g transform="translate(500 520) scale(1.05)"><use href="#p" color="#ffffff"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <circle cx="0" cy="-188" r="20" fill="#b07850"/>
    <path d="M-22 -194 a22 18 0 0 1 44 0 z" fill="#ffffff" stroke="#e3dccd" stroke-width="2"/><path d="M-30 -194 h32" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <path d="M-12 -186 q3 -3 6 0 M2 -186 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M-6 -174 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M10 -150 q20 6 22 60" stroke="#e0a33a" stroke-width="10" fill="none"/>
    <path d="M-22 -146 l-34 18 l-14 -10" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -146 l8 56" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <text x="520" y="200" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">LISTEN FIRST</text>
  <!-- square-leg umpire -->
  <g transform="translate(780 470) scale(.8)"><use href="#p" color="#ffffff"/>
    <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="none" stroke="#e3dccd" stroke-width="2"/>
    <circle cx="0" cy="-188" r="20" fill="#d9a27a"/><path d="M-22 -194 a22 18 0 0 1 44 0 z" fill="#ffffff" stroke="#e3dccd" stroke-width="2"/>
    <circle cx="-7" cy="-186" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-186" r="2.5" fill="#2e2a2a"/>
    <path d="M-22 -146 l-8 56 M22 -146 l8 56" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/></g>
  <path d="M570 380 Q660 330 744 360" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
  <!-- six steps -->
  <path d="M100 584 H710" stroke="#b9ad98" stroke-width="4"/>
  <g fill="#ffffff" stroke="#cbbfa9" stroke-width="2"><circle cx="100" cy="584" r="30"/><circle cx="222" cy="584" r="30"/><circle cx="344" cy="584" r="30"/><circle cx="466" cy="584" r="30"/><circle cx="588" cy="584" r="30"/><circle cx="710" cy="584" r="30"/></g>
  <path d="M92 600 q-10 -6 -8 -20 a16 16 0 0 1 32 0 q0 10 -10 14 q-4 2 -4 8 q-2 8 -10 -2 z M98 580 q4 -6 8 0" fill="#c98a5e" stroke="#a8724a" stroke-width="2"/>
  <circle cx="214" cy="584" r="14" fill="#1f6f78" opacity=".7"/><circle cx="230" cy="584" r="14" fill="#e0a33a" opacity=".7"/>
  <g fill="#c98a5e"><rect x="332" y="580" width="24" height="20" rx="6"/><rect x="332" y="566" width="6" height="18" rx="3"/><rect x="339" y="562" width="6" height="22" rx="3"/><rect x="346" y="564" width="6" height="20" rx="3"/><rect x="353" y="568" width="5" height="16" rx="3"/></g>
  <g fill="#a8cfe8"><circle cx="458" cy="588" r="10"/><circle cx="470" cy="580" r="12"/><circle cx="480" cy="590" r="8"/><circle cx="452" cy="602" r="3"/></g>
  <path d="M588 600 l-14 -14 a8 8 0 0 1 14 -10 a8 8 0 0 1 14 10 z" fill="#e07a5f"/>
  <path d="M696 580 h22 v10 a11 11 0 0 1 -22 0 z" fill="#8a6d5a"/><path d="M718 584 q8 0 6 6" stroke="#8a6d5a" stroke-width="3" fill="none"/>
  <circle cx="722" cy="568" r="8" fill="#ffffff" stroke="#1f6f78" stroke-width="2"/><path d="M722 563 v5 l3 2" stroke="#1f6f78" stroke-width="2" fill="none"/>
  <text x="850" y="596" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">PLAY ON</text>
</svg>
