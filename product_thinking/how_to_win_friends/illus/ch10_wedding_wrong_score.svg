<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a wedding table an uncle tells a cricket story while a young man laughs along and saves the correction for later</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="p">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/><rect x="3" y="-80" width="13" height="80" rx="6" fill="#4a3f55"/>
      <path d="M-26 -74 v-62 a26 26 0 0 1 52 0 v62 z" fill="currentColor"/>
      <rect x="-6" y="-172" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-188" r="20" fill="#c98a5e"/>
      <path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect width="960" height="300" fill="#f3e6d2"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- garlands -->
  <g fill="none" stroke-width="9" stroke-linecap="round" stroke-dasharray="1 14">
    <path d="M0 40 Q120 100 240 40 Q360 100 480 40 Q600 100 700 44" stroke="#e0a33a"/>
    <path d="M0 58 Q120 118 240 58 Q360 118 480 58 Q600 118 700 62" stroke="#e07a5f"/>
  </g>
  <g fill="#f4d58a"><circle cx="60" cy="150" r="5"/><circle cx="180" cy="140" r="5"/><circle cx="420" cy="150" r="5"/><circle cx="560" cy="140" r="5"/><circle cx="680" cy="150" r="5"/></g>
  <!-- relatives behind table -->
  <g transform="translate(160 520)"><use href="#p" color="#7a4e7e"/>
    <circle cx="-7" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-188" r="2.5" fill="#2e2a2a"/><path d="M-7 -177 q7 7 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="#fff"/>
    <path d="M-22 -146 l-6 50 l22 -20 M22 -146 l6 50 l-22 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <g transform="translate(290 520)"><use href="#p" color="#e0a33a"/>
    <circle cx="0" cy="-188" r="20" fill="#b07850"/><path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-188" r="2.5" fill="#2e2a2a"/><path d="M-7 -177 q7 7 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="#fff"/>
    <path d="M-22 -146 l-10 40 l30 -40 M22 -146 l10 40 l-30 -40" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- mother in green sari -->
  <g transform="translate(420 520)"><use href="#p" color="#3f8f5a"/>
    <path d="M-26 -120 L26 -160 L26 -140 L-26 -100 z" fill="#e0a33a"/>
    <circle cx="0" cy="-188" r="20" fill="#d9a27a"/><path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-200" r="9" fill="#2e2a2a"/>
    <circle cx="2" cy="-188" r="2.5" fill="#2e2a2a"/><circle cx="14" cy="-188" r="2.5" fill="#2e2a2a"/><path d="M-2 -176 q6 3 12 -1" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <circle cx="0" cy="-200" r="2" fill="#e07a5f"/></g>
  <!-- table -->
  <ellipse cx="300" cy="420" rx="230" ry="26" fill="#ffffff"/>
  <path d="M70 420 h460 v140 h-460 z" fill="#ffffff"/><path d="M70 420 h460 v14 h-460 z" fill="#efe7d8"/>
  <g><ellipse cx="170" cy="414" rx="40" ry="9" fill="#5f9a4a"/><ellipse cx="170" cy="410" rx="22" ry="7" fill="#e0a33a"/>
     <ellipse cx="300" cy="418" rx="40" ry="9" fill="#5f9a4a"/><ellipse cx="300" cy="414" rx="22" ry="7" fill="#e0a33a"/>
     <ellipse cx="430" cy="414" rx="40" ry="9" fill="#5f9a4a"/><ellipse cx="430" cy="410" rx="22" ry="7" fill="#e0a33a"/></g>
  <!-- uncle telling story -->
  <g transform="translate(620 560)"><use href="#p" color="#efe4cc"/>
    <path d="M-20 -80 h40 v80 h-40 z" fill="#ffffff"/><path d="M-20 -80 h40" stroke="#e0a33a" stroke-width="4"/>
    <path d="M-20 -190 a20 20 0 0 1 40 0 z" fill="#d6d2cc"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="-7" cy="-189" r="6"/><circle cx="7" cy="-189" r="6"/><path d="M-1 -189 h2"/></g>
    <path d="M-12 -178 q12 -6 24 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-6 -172 q6 6 12 0" fill="#fff" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M22 -146 l26 -40 l10 -40" stroke="#c98a5e" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -146 l-12 50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/></g>
  <!-- speech bubble -->
  <path d="M500 180 h170 a16 16 0 0 1 16 16 v70 a16 16 0 0 1 -16 16 h-50 l-14 22 l-6 -22 h-100 a16 16 0 0 1 -16 -16 v-70 a16 16 0 0 1 16 -16 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="524" y="204" width="12" height="56" rx="4" fill="#8a6d5a" transform="rotate(-30 530 232)"/><circle cx="562" cy="254" r="9" fill="#c0392b"/>
  <text x="620" y="248" text-anchor="middle" font-size="40" font-weight="800" fill="#1f6f78">100</text>
  <!-- young man laughing along -->
  <g transform="translate(810 560)"><use href="#p" color="#2f6db0"/>
    <path d="M-26 -74 h52 v22 h-52 z" fill="#2f6db0"/>
    <path d="M-10 -192 q4 -5 8 0 M4 -192 q4 -5 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-9 -178 q9 12 18 0 z" fill="#fff" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-22 -146 l-14 34 l30 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -146 l10 46 l-14 4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="2" y="-112" width="20" height="16" rx="2" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
    <path d="M12 -112 v16" stroke="#cbbfa9" stroke-width="1.5"/></g>
  <g fill="#e0a33a" font-size="22" font-weight="800"><text x="846" y="392">ha</text><text x="868" y="366">ha</text></g>
  <text x="774" y="322" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">LAUGH ALONG</text>
  <!-- later inset -->
  <rect x="740" y="34" width="190" height="200" rx="16" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="835" y="76" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">LATER</text>
  <rect x="764" y="96" width="78" height="96" rx="4" fill="#f6f1e7" stroke="#b9ad98" stroke-width="2"/>
  <g stroke="#b9ad98" stroke-width="3"><path d="M776 118 h54 M776 136 h54 M776 154 h54 M776 172 h34"/></g>
  <circle cx="886" cy="150" r="28" fill="#f6f1e7" stroke="#1f6f78" stroke-width="4"/><path d="M886 132 v18 l12 8" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M842 462 C940 440 948 300 904 246" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
