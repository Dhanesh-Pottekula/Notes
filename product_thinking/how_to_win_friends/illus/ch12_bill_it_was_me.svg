<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A grandfather waves a triple electricity bill and blames everyone until the eldest son says it was him</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="kid">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-26" y="-14" width="52" height="16" rx="8" fill="#4a3f55"/>
      <path d="M-18 -12 v-30 a18 18 0 0 1 36 0 v30 z" fill="currentColor"/>
      <circle cx="0" cy="-60" r="15" fill="#d9a27a"/><path d="M-15 -62 a15 15 0 0 1 30 0 z" fill="#2e2a2a"/>
      <rect x="-8" y="-38" width="16" height="22" rx="3" fill="#3d3a3a"/>
    </g>
    <g id="x"><circle r="13" fill="#e07a5f"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- guest room doorway with AC running -->
  <rect x="720" y="120" width="220" height="440" fill="#8a6d5a"/><rect x="734" y="134" width="192" height="426" fill="#e6eef0"/>
  <rect x="760" y="160" width="140" height="44" rx="10" fill="#fff" stroke="#b9c8cc" stroke-width="2"/><rect x="772" y="190" width="116" height="6" rx="3" fill="#b9c8cc"/><circle cx="886" cy="172" r="4" fill="#3f9a5a"/>
  <g stroke="#5b9bd5" stroke-width="4" fill="none" stroke-linecap="round"><path d="M780 216 q10 20 0 40 q-10 20 0 40"/><path d="M830 216 q10 20 0 40 q-10 20 0 40"/><path d="M880 216 q10 20 0 40 q-10 20 0 40"/></g>
  <rect x="760" y="470" width="150" height="40" rx="6" fill="#cbbfa9"/><rect x="766" y="456" width="40" height="18" rx="6" fill="#fff"/><rect x="768" y="510" width="8" height="50" fill="#6b5446"/><rect x="896" y="510" width="8" height="50" fill="#6b5446"/>
  <!-- geyser and meter on the wall, left -->
  <rect x="60" y="120" width="70" height="110" rx="30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="95" cy="200" r="6" fill="#e07a5f"/>
  <use href="#x" transform="translate(140 126)"/>
  <rect x="200" y="140" width="80" height="100" rx="6" fill="#3d3a3a"/><rect x="214" y="156" width="52" height="26" fill="#cbbfa9"/><circle cx="240" cy="212" r="12" fill="#b9ad98"/>
  <use href="#x" transform="translate(290 146)"/>
  <!-- children with phones -->
  <use href="#kid" color="#e0a33a" transform="translate(110 560)"/>
  <use href="#kid" color="#e07a5f" transform="translate(200 560)"/>
  <use href="#x" transform="translate(155 470)"/>
  <!-- grandfather in cane chair -->
  <ellipse cx="450" cy="562" rx="80" ry="8" fill="#000" opacity=".08"/>
  <path d="M380 560 l10 -80 h120 l10 80" stroke="#b07a3a" stroke-width="8" fill="none"/>
  <rect x="378" y="470" width="144" height="20" rx="8" fill="#c9a26a"/>
  <rect x="384" y="330" width="132" height="150" rx="18" fill="#c9a26a"/><g stroke="#b08850" stroke-width="2"><path d="M400 340 v130 M420 340 v130 M440 340 v130 M460 340 v130 M480 340 v130 M500 340 v130 M392 360 h116 M392 390 h116 M392 420 h116 M392 450 h116"/></g>
  <path d="M426 480 h68 l4 70 h-24 l-4 -50 h-20 l-4 50 h-24 z" fill="#f3ede0"/>
  <path d="M424 480 v-62 a26 26 0 0 1 52 0 v62 z" fill="#ffffff"/>
  <rect x="444" y="376" width="12" height="10" fill="#b07850"/>
  <circle cx="450" cy="360" r="21" fill="#b07850"/>
  <path d="M430 352 q2 -16 20 -16 q18 0 20 16 q-4 -8 -20 -8 q-16 0 -20 8 z" fill="#e3dccd"/>
  <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="443" cy="360" r="6"/><circle cx="458" cy="360" r="6"/></g>
  <path d="M442 374 q8 -4 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M440 380 q10 6 20 0" stroke="#e3dccd" stroke-width="4" fill="none"/>
  <!-- arm holding bill up -->
  <path d="M428 404 l-30 -40 l0 -40" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="352" y="196" width="96" height="134" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <g stroke="#cbbfa9" stroke-width="3"><path d="M366 214 h68 M366 230 h50 M366 296 h68 M366 312 h40"/></g>
  <text x="400" y="280" text-anchor="middle" font-size="38" font-weight="800" fill="#d14b3a">x3</text>
  <!-- blame arrows -->
  <path d="M352 220 C300 190 260 180 220 120" stroke="#7a4e7e" stroke-width="3.5" fill="none" stroke-dasharray="8 7" marker-end="url(#ah)" opacity=".8"/>
  <path d="M352 240 C260 230 180 200 120 240" stroke="#7a4e7e" stroke-width="3.5" fill="none" stroke-dasharray="8 7" marker-end="url(#ah)" opacity=".8"/>
  <path d="M360 330 C300 400 240 440 210 470" stroke="#7a4e7e" stroke-width="3.5" fill="none" stroke-dasharray="8 7" marker-end="url(#ah)" opacity=".8"/>
  <!-- eldest son, hand raised -->
  <g transform="translate(630 560) scale(1.18)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <path d="M-12 -132 q12 6 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <circle cx="-9" cy="-146" r="2.5" fill="#2e2a2a"/><circle cx="3" cy="-146" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -136 q4 2 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -106 l12 -40 l-2 -36" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l12 20 l14 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- AC to son -->
  <path d="M760 300 C720 320 700 330 680 360" stroke="#1f6f78" stroke-width="4" fill="none" stroke-dasharray="9 7" marker-end="url(#ah)"/>
  <!-- speech bubble -->
  <rect x="520" y="110" width="200" height="70" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M610 178 l20 36 l10 -36" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M612 176 h26" stroke="#fff" stroke-width="5"/>
  <text x="620" y="157" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">IT WAS ME</text>
  <!-- job inset: timer + spanner -->
  <g transform="translate(300 420)">
    <path d="M58 -14 l66 -40 l-62 30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><rect x="-34" y="-30" width="96" height="64" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M60 -22 v10" stroke="#fff" stroke-width="5"/>
    <circle cx="-6" cy="2" r="18" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M-6 2 v-12 M-6 2 l8 6" stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"/>
    <path d="M26 20 l20 -24" stroke="#6b5446" stroke-width="7" stroke-linecap="round"/><circle cx="48" cy="-8" r="8" fill="none" stroke="#6b5446" stroke-width="5"/>
  </g>
</svg>
