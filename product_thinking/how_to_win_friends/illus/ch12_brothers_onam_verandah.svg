<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An elder brother who came by bus sits on his younger brother's verandah on Onam and apologises while the children play cricket</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <rect x="-8" y="-14" width="58" height="26" rx="12" fill="#f3ede0"/>
      <rect x="30" y="-2" width="22" height="58" rx="10" fill="#f3ede0"/>
      <rect x="30" y="52" width="26" height="10" rx="4" fill="#c98a5e"/>
      <path d="M-22 4 v-58 a22 22 0 0 1 44 0 v58 z" fill="currentColor"/>
      <rect x="-6" y="-88" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-102" r="20" fill="#c98a5e"/>
    </g>
    <g id="kid">
      <rect x="-9" y="-40" width="8" height="40" rx="4" fill="#4a3f55"/><rect x="1" y="-40" width="8" height="40" rx="4" fill="#4a3f55"/>
      <path d="M-14 -38 v-26 a14 14 0 0 1 28 0 v26 z" fill="currentColor"/>
      <circle cx="0" cy="-88" r="12" fill="#d9a27a"/><path d="M-12 -90 a12 12 0 0 1 24 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#cfe0b8"/>
  <rect y="560" width="250" height="80" fill="#d8cdb8"/>
  <!-- bus pulling away -->
  <rect x="14" y="430" width="180" height="100" rx="14" fill="#e0a33a"/>
  <g fill="#fbeedb"><rect x="28" y="446" width="34" height="30" rx="4"/><rect x="70" y="446" width="34" height="30" rx="4"/><rect x="112" y="446" width="34" height="30" rx="4"/></g>
  <rect x="156" y="446" width="26" height="70" rx="4" fill="#c48a26"/>
  <circle cx="56" cy="532" r="18" fill="#3d3a3a"/><circle cx="150" cy="532" r="18" fill="#3d3a3a"/>
  <!-- coconut palm -->
  <path d="M250 560 q-12 -140 14 -300" stroke="#8a6d5a" stroke-width="14" fill="none" stroke-linecap="round"/>
  <g fill="#5f8f5a"><path d="M264 262 q-70 -20 -100 30 q50 -30 100 -30 z"/><path d="M264 262 q60 -40 110 0 q-60 -14 -110 0 z"/><path d="M264 262 q-30 -60 -80 -60 q50 20 80 60 z"/><path d="M264 262 q20 -60 70 -70 q-40 30 -70 70 z"/></g>
  <circle cx="258" cy="272" r="8" fill="#8a6d5a"/><circle cx="272" cy="274" r="8" fill="#8a6d5a"/>
  <!-- path from bus to verandah -->
  <path d="M190 548 C260 600 320 590 380 560" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- house -->
  <rect x="320" y="290" width="400" height="210" fill="#fbf7ef"/>
  <path d="M290 300 L420 190 H620 L750 300 z" fill="#c25b3f"/>
  <g stroke="#a3472f" stroke-width="3"><path d="M330 266 H710 M370 232 H670"/></g>
  <rect x="560" y="340" width="60" height="150" rx="4" fill="#8a6d5a"/>
  <rect x="650" y="350" width="44" height="50" fill="#6b5446"/>
  <g fill="#8a6d5a"><rect x="334" y="300" width="12" height="200"/><rect x="694" y="300" width="12" height="200"/></g>
  <rect x="310" y="500" width="420" height="18" fill="#b9ad98"/>
  <rect x="400" y="518" width="160" height="20" fill="#cbbfa9"/><rect x="420" y="538" width="120" height="22" fill="#d8cdb8"/>
  <!-- pookalam -->
  <ellipse cx="640" cy="594" rx="78" ry="26" fill="#e07a5f"/><ellipse cx="640" cy="594" rx="56" ry="18" fill="#e0a33a"/><ellipse cx="640" cy="594" rx="32" ry="10" fill="#f3d04a"/><ellipse cx="640" cy="594" rx="10" ry="4" fill="#c0392b"/>
  <!-- elder brother, facing right, palms open -->
  <g transform="translate(430 500)"><use href="#sit" color="#7a4e7e"/>
    <path d="M-20 -110 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#d8d4cc"/>
    <path d="M2 -98 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M4 -86 q6 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M14 -60 l22 22 l22 -8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 -36 q6 -6 10 -2" stroke="#c98a5e" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- younger brother, facing left, reaching out -->
  <g transform="translate(560 500) scale(-1 1)"><use href="#sit" color="#1f6f78"/>
    <path d="M-20 -108 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/>
    <circle cx="8" cy="-102" r="2.5" fill="#2e2a2a"/>
    <path d="M2 -88 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M14 -62 l40 -2 l26 -4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- speech bubble -->
  <rect x="350" y="304" width="250" height="60" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M430 362 l12 18 l14 -18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M432 361 h22" stroke="#fff" stroke-width="5"/>
  <text x="475" y="345" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">I WAS WRONG</text>
  <!-- reconciliation inset -->
  <rect x="740" y="80" width="190" height="100" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M760 160 v-30 l24 -20 l24 20 v30 z" fill="#c25b3f"/><rect x="766" y="132" width="36" height="28" fill="#fbf7ef"/>
  <path d="M862 160 v-30 l24 -20 l24 20 v30 z" fill="#c25b3f"/><rect x="868" y="132" width="36" height="28" fill="#fbf7ef"/>
  <path d="M810 148 h50" stroke="#7a4e7e" stroke-width="4"/>
  <circle cx="835" cy="120" r="14" fill="#3f9a5a"/><path d="M828 120 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- children playing cricket in the yard -->
  <g fill="#8a6d5a"><rect x="928" y="500" width="4" height="56"/><rect x="936" y="500" width="4" height="56"/><rect x="944" y="500" width="4" height="56"/></g>
  <g transform="translate(900 560)"><use href="#kid" color="#e0a33a"/>
    <path d="M10 -58 l-20 -18" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/>
    <path d="M-10 -76 l-34 20" stroke="#c9a26a" stroke-width="9" stroke-linecap="round"/></g>
  <circle cx="820" cy="520" r="6" fill="#e07a5f"/>
  <path d="M790 528 q14 -16 26 -8" stroke="#b9ad98" stroke-width="2" fill="none" stroke-dasharray="3 4"/>
  <g transform="translate(770 560)"><use href="#kid" color="#e07a5f"/>
    <path d="M10 -58 l16 -26" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/></g>
  <g transform="translate(830 610) scale(.95)"><use href="#kid" color="#7a4e7e"/>
    <path d="M-8 -58 l-16 12 M8 -58 l18 -8" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/></g>
  <g transform="translate(910 630) scale(.9)"><use href="#kid" color="#1f6f78"/>
    <path d="M-10 -58 l-12 -22 M10 -58 l12 -22" stroke="#d9a27a" stroke-width="7" stroke-linecap="round"/></g>
</svg>
