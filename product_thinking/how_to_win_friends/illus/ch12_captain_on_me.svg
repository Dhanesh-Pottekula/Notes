<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cricket captain at a press conference points to himself instead of blaming the pitch, the dew or the toss</title>
  <defs>
    <marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="x"><circle r="13" fill="#e07a5f"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
    <g id="mate">
      <rect x="-12" y="-50" width="10" height="50" rx="5" fill="#4a3f55"/><rect x="2" y="-50" width="10" height="50" rx="5" fill="#4a3f55"/>
      <path d="M-18 -48 v-34 a18 18 0 0 1 36 0 v34 z" fill="#2f5d8a"/>
      <circle cx="0" cy="-112" r="14" fill="#c98a5e"/><path d="M-14 -114 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="62" text-anchor="middle" font-size="38" font-weight="800" fill="#2b2b2b" letter-spacing="1">ON ME</text>
  <!-- backdrop -->
  <rect x="250" y="100" width="460" height="320" rx="10" fill="#e3dccd"/>
  <rect x="560" y="124" width="124" height="54" rx="6" fill="#3d3a3a" opacity=".55"/>
  <text x="622" y="160" text-anchor="middle" font-size="22" font-weight="800" fill="#f6f1e7" letter-spacing="1" opacity=".8">LOST</text>
  <!-- excuses, greyed and crossed -->
  <g opacity=".55">
    <rect x="40" y="130" width="70" height="110" rx="8" fill="#c9b48a"/><path d="M58 150 l14 30 l-8 20 l16 30 M90 160 l-10 24" stroke="#8a6d5a" stroke-width="3" fill="none"/>
    <path d="M170 150 q14 22 0 34 q-14 -12 0 -34 z M200 180 q12 20 0 30 q-12 -10 0 -30 z M160 210 q12 20 0 30 q-12 -10 0 -30 z" fill="#5b9bd5"/>
    <circle cx="80" cy="300" r="34" fill="#e0a33a"/><circle cx="80" cy="300" r="24" fill="none" stroke="#c48a26" stroke-width="3"/>
  </g>
  <use href="#x" transform="translate(110 132)"/><use href="#x" transform="translate(212 150)"/><use href="#x" transform="translate(112 272)"/>
  <!-- arrow from excuses back to himself -->
  <path d="M130 330 C170 420 300 400 420 370" stroke="#1f6f78" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#at)"/>
  <!-- captain behind the table -->
  <path d="M440 420 v-70 a40 40 0 0 1 80 0 v70 z" fill="#2f5d8a"/>
  <path d="M470 312 l10 14 l10 -14" stroke="#f6f1e7" stroke-width="4" fill="none"/>
  <rect x="472" y="296" width="16" height="14" fill="#c98a5e"/>
  <circle cx="480" cy="272" r="26" fill="#c98a5e"/>
  <path d="M454 268 a26 26 0 0 1 52 0 q-26 -12 -52 0 z" fill="#2e2a2a"/>
  <path d="M458 278 q0 22 22 24 q22 -2 22 -24 q-4 10 -22 12 q-18 -2 -22 -12 z" fill="#2e2a2a"/>
  <circle cx="470" cy="270" r="3" fill="#2e2a2a"/><circle cx="490" cy="270" r="3" fill="#2e2a2a"/>
  <path d="M462 260 l12 2 M498 260 l-12 2" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M473 289 h14" stroke="#8a5a40" stroke-width="3" stroke-linecap="round"/>
  <path d="M446 344 l14 40 l26 -14" stroke="#c98a5e" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M514 344 l20 70" stroke="#2f5d8a" stroke-width="14" stroke-linecap="round"/>
  <!-- table -->
  <rect x="240" y="410" width="480" height="140" rx="6" fill="#1f6f78"/><rect x="240" y="410" width="480" height="14" rx="4" fill="#185a61"/>
  <path d="M430 410 l14 -50 M530 410 l-14 -50" stroke="#3d3a3a" stroke-width="5" stroke-linecap="round"/>
  <rect x="436" y="348" width="14" height="22" rx="7" fill="#3d3a3a" transform="rotate(16 443 359)"/><rect x="510" y="348" width="14" height="22" rx="7" fill="#3d3a3a" transform="rotate(-16 517 359)"/>
  <rect x="600" y="370" width="18" height="40" rx="5" fill="#cfe3ea"/><rect x="603" y="362" width="12" height="10" rx="2" fill="#1f6f78"/>
  <!-- camera on tripod -->
  <path d="M800 560 l34 -150 l34 150 M834 410 v150" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <rect x="790" y="370" width="90" height="50" rx="8" fill="#3d3a3a"/><rect x="760" y="380" width="36" height="30" rx="6" fill="#3d3a3a"/><circle cx="770" cy="395" r="9" fill="#5b6a75"/>
  <circle cx="866" cy="382" r="5" fill="#e07a5f"/>
  <!-- reporters from behind -->
  <g><path d="M60 640 v-60 a50 50 0 0 1 100 0 v60 z" fill="#7a4e7e"/><circle cx="110" cy="540" r="30" fill="#2e2a2a"/>
    <path d="M150 580 l30 -50" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/><rect x="170" y="496" width="26" height="42" rx="5" fill="#3d3a3a"/></g>
  <g><path d="M230 640 v-52 a46 46 0 0 1 92 0 v52 z" fill="#e0a33a"/><circle cx="276" cy="556" r="28" fill="#4a3a32"/>
    <path d="M232 600 l-10 -40" stroke="#b07850" stroke-width="12" stroke-linecap="round"/><rect x="200" y="530" width="36" height="28" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/></g>
  <!-- dressing room inset -->
  <rect x="730" y="96" width="200" height="190" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M730 250 h200" stroke="#d8cdb8" stroke-width="2"/>
  <g transform="translate(780 260)"><use href="#mate"/></g>
  <g transform="translate(830 262)"><use href="#mate"/></g>
  <g transform="translate(880 260)"><use href="#mate"/></g>
  <path d="M782 182 q24 -10 48 0 q24 -10 48 0" stroke="#c98a5e" stroke-width="7" fill="none" stroke-linecap="round"/>
</svg>
