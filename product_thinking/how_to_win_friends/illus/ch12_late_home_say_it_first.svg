<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A son home two hours late admits it first, and his mother at the door asks if he has eaten</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="clk"><circle r="34" fill="#fff" stroke="#3d3a3a" stroke-width="5"/><g stroke="#b9ad98" stroke-width="3"><path d="M0 -28 v6 M0 28 v-6 M-28 0 h6 M28 0 h-6"/></g></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <text x="480" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SAY IT FIRST</text>
  <!-- night wall outside -->
  <rect x="0" y="96" width="960" height="464" fill="#e3dccd"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- wall clock at ten -->
  <use href="#clk" transform="translate(110 200) scale(1.3)"/>
  <path d="M110 200 l-30 -18 M110 200 v-34" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/><circle cx="110" cy="200" r="5" fill="#2b2b2b"/>
  <rect x="62" y="270" width="96" height="50" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <text x="110" y="304" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">8 PM</text>
  <path d="M70 278 l80 34 M150 278 l-80 34" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <!-- door frame and warm interior -->
  <rect x="540" y="130" width="230" height="430" fill="#8a6d5a"/>
  <rect x="556" y="146" width="198" height="414" fill="#fbe3a8"/>
  <path d="M556 146 l-60 30 v384 l60 0 z" fill="#6b5446"/>
  <rect x="640" y="430" width="110" height="10" fill="#8a6d5a"/><rect x="650" y="440" width="8" height="70" fill="#8a6d5a"/><rect x="734" y="440" width="8" height="70" fill="#8a6d5a"/>
  <path d="M676 430 a22 16 0 0 1 44 0 z" fill="#b8bec2"/>
  <path d="M655 146 v30" stroke="#3d3a3a" stroke-width="3"/><path d="M640 176 h30 l-6 14 h-18 z" fill="#e0a33a"/>
  <!-- doormat -->
  <rect x="330" y="552" width="200" height="14" rx="4" fill="#b07850"/>
  <!-- mother in doorway, plum saree -->
  <g transform="translate(620 560) scale(1.12)"><use href="#m" color="#7a4e7e"/>
    <path d="M-26 -64 h52 l6 64 h-64 z" fill="#7a4e7e"/>
    <path d="M-22 -104 l46 50" stroke="#e0a33a" stroke-width="8" stroke-linecap="round"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-160" r="10" fill="#2e2a2a"/>
    <path d="M-9 -148 q4 -3 8 0 M-17 -147" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <circle cx="-7" cy="-144" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-144" r="2.5" fill="#2e2a2a"/>
    <path d="M-8 -134 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -106 l40 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -106 l-14 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- son on doormat, bowed head, hand on chest -->
  <g transform="translate(430 560) scale(1.12)"><use href="#m" color="#e0a33a"/>
    <rect x="-40" y="-118" width="22" height="58" rx="8" fill="#1f6f78"/>
    <path d="M-16 -116 l-12 50" stroke="#185a61" stroke-width="5"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a" transform="rotate(10 0 -148)"/>
    <path d="M3 -140 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M2 -130 q6 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -104 l-8 22 l-18 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -104 l-6 48" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-34" y="-62" width="14" height="22" rx="3" fill="#3d3a3a"/>
  </g>
  <!-- son's bubble: 8 to 10, missed call -->
  <rect x="190" y="120" width="250" height="140" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M380 258 l40 54 l0 -54" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M382 256 h36" stroke="#fff" stroke-width="5"/>
  <use href="#clk" transform="translate(246 190) scale(.8)"/><path d="M246 190 l-20 12 M246 190 v-20" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <path d="M278 190 h40" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
  <use href="#clk" transform="translate(350 190) scale(.8)"/><path d="M350 190 l-20 -12 M350 190 v-20" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <rect x="398" y="160" width="28" height="48" rx="5" fill="#3d3a3a"/><rect x="402" y="166" width="20" height="34" fill="#cbbfa9"/>
  <path d="M398 218 l28 20 M426 218 l-28 20" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <!-- mother's bubble: have you eaten? -->
  <rect x="740" y="190" width="196" height="130" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M760 318 l-34 30 l52 -30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M762 316 h14" stroke="#fff" stroke-width="5"/>
  <ellipse cx="822" cy="262" rx="62" ry="40" fill="#b8bec2"/><ellipse cx="822" cy="262" rx="54" ry="33" fill="#d6dadc"/>
  <circle cx="800" cy="252" r="16" fill="#e0a33a"/><path d="M790 270 a14 10 0 0 0 30 10 z" fill="#fff"/>
  <circle cx="846" cy="262" r="20" fill="#f3ede0"/><circle cx="836" cy="268" r="20" fill="#e6d7b8"/>
  <circle cx="908" cy="222" r="16" fill="#1f6f78"/><text x="908" y="230" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">?</text>
</svg>
