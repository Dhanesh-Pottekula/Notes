<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A scooter rider argues that the road was empty while a traffic constable writes him a fine</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#8a7550"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#8a7550"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- background buildings and tree -->
  <g fill="#e3dccd"><rect x="560" y="250" width="120" height="250"/><rect x="690" y="210" width="90" height="290"/><rect x="860" y="270" width="100" height="230"/></g>
  <g fill="#f6f1e7"><rect x="580" y="280" width="24" height="30"/><rect x="630" y="280" width="24" height="30"/><rect x="580" y="340" width="24" height="30"/><rect x="630" y="340" width="24" height="30"/><rect x="710" y="240" width="22" height="30"/><rect x="745" y="240" width="22" height="30"/><rect x="710" y="300" width="22" height="30"/><rect x="745" y="300" width="22" height="30"/></g>
  <rect x="226" y="380" width="14" height="120" fill="#8a6d5a"/><circle cx="233" cy="356" r="46" fill="#9cb89a"/><circle cx="206" cy="380" r="30" fill="#9cb89a"/>
  <!-- road -->
  <rect y="500" width="960" height="140" fill="#cbbfa9"/>
  <g fill="#fff" opacity=".85"><rect x="30" y="512" width="150" height="12"/><rect x="30" y="540" width="150" height="12"/><rect x="30" y="568" width="150" height="12"/><rect x="30" y="596" width="150" height="12"/></g>
  <rect x="236" y="506" width="10" height="128" fill="#fff"/>
  <!-- signal pole -->
  <rect x="104" y="250" width="12" height="262" fill="#3d3a3a"/>
  <rect x="78" y="110" width="64" height="150" rx="12" fill="#3d3a3a"/>
  <circle cx="110" cy="146" r="22" fill="#e04a3a"/><circle cx="110" cy="146" r="30" fill="#e04a3a" opacity=".25"/>
  <circle cx="110" cy="190" r="16" fill="#6b5f4a"/><circle cx="110" cy="230" r="16" fill="#4f5a4c"/>
  <!-- scooter -->
  <ellipse cx="420" cy="566" rx="130" ry="9" fill="#000" opacity=".08"/>
  <circle cx="330" cy="530" r="32" fill="#3d3a3a"/><circle cx="330" cy="530" r="12" fill="#b9ad98"/>
  <circle cx="520" cy="530" r="32" fill="#3d3a3a"/><circle cx="520" cy="530" r="12" fill="#b9ad98"/>
  <path d="M290 520 q0 -70 60 -78 h90 l10 40 h40 l20 -110 h22 l-14 110 q30 10 30 40 h-258 z" fill="#1f6f78"/>
  <rect x="330" y="430" width="110" height="18" rx="9" fill="#2e2a2a"/>
  <path d="M528 330 l8 -24" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/><path d="M516 306 h38" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="526" cy="356" r="9" fill="#f3e3b0"/>
  <!-- rider -->
  <path d="M410 440 l60 4 l6 54" stroke="#4a3f55" stroke-width="20" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="464" y="494" width="30" height="12" rx="5" fill="#2e2a2a"/>
  <path d="M378 444 v-62 a26 26 0 0 1 52 0 v62 z" fill="#8f8a85"/>
  <rect x="398" y="342" width="12" height="10" fill="#c98a5e"/>
  <circle cx="404" cy="326" r="19" fill="#c98a5e"/>
  <path d="M382 324 a23 23 0 0 1 46 -4 l-6 2 a18 18 0 0 0 -34 4 z" fill="#e0a33a"/>
  <path d="M380 322 a24 26 0 0 1 48 -8 l2 -6 a28 28 0 0 0 -52 6 z" fill="#e0a33a"/>
  <circle cx="412" cy="326" r="2.5" fill="#2e2a2a"/><ellipse cx="414" cy="337" rx="5" ry="4" fill="#2e2a2a"/>
  <path d="M420 374 l50 14 l50 -48" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M388 372 l-34 -18 l-26 -30" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#c98a5e"><circle cx="326" cy="320" r="10"/><path d="M320 314 l-6 -14 M326 310 l-2 -16 M332 312 l2 -14" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/></g>
  <!-- excuse bubble: empty road -->
  <text x="372" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">EXCUSE</text>
  <rect x="262" y="86" width="220" height="140" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M360 224 l26 50 l14 -50" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M362 222 h36" stroke="#fff" stroke-width="5"/>
  <rect x="282" y="146" width="180" height="44" fill="#d8cdb8"/>
  <path d="M290 168 h164" stroke="#fff" stroke-width="4" stroke-dasharray="14 10"/>
  <path d="M300 126 h140" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
  
  <!-- argument leads to fine -->
  <path d="M484 140 C600 120 660 200 676 330" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- constable -->
  <g transform="translate(790 566) scale(1.2)"><use href="#m" color="#c8a96a"/>
    <path d="M-24 -100 h48 v6 h-48 z" fill="#6b5446"/>
    <path d="M-20 -160 a20 14 0 0 1 40 0 z" fill="#ffffff"/><rect x="-24" y="-162" width="48" height="6" rx="3" fill="#ffffff" stroke="#cbbfa9" stroke-width="1"/>
    <rect x="-14" y="-161" width="28" height="4" fill="#3d3a3a"/>
    <path d="M-12 -148 l8 3 M12 -148 l-8 3" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-7" cy="-143" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-143" r="2.5" fill="#2e2a2a"/>
    <path d="M-12 -136 q12 -4 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/><path d="M-7 -133 h14" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M10 -122 q8 20 -2 30" stroke="#ffffff" stroke-width="2" fill="none"/><rect x="2" y="-94" width="10" height="5" rx="2" fill="#b9ad98"/>
    <path d="M-20 -110 l-46 20 l0 -10" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -110 l-16 34 l-54 -12" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- challan pad -->
  <rect x="640" y="340" width="110" height="140" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="640" y="340" width="110" height="18" rx="4" fill="#e07a5f"/>
  <text x="695" y="400" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">FINE</text>
  <g stroke="#cbbfa9" stroke-width="3"><path d="M656 424 h78 M656 442 h78 M656 460 h50"/></g>
  <path d="M718 474 l24 -44" stroke="#1f6f78" stroke-width="6" stroke-linecap="round"/>
  <!-- trouble badge -->
  <circle cx="852" cy="300" r="22" fill="#e07a5f"/><rect x="849" y="286" width="6" height="18" rx="3" fill="#fff"/><circle cx="852" cy="311" r="3.5" fill="#fff"/>
</svg>
