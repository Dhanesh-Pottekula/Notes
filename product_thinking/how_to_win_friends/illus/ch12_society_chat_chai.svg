<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An angry chat post about a parking plan is answered with a Sunday chai invitation, where the neighbour brings a better plan</title>
  <defs>
    <g id="sit">
      <rect x="-8" y="-14" width="58" height="26" rx="12" fill="#4a3f55"/>
      <rect x="30" y="-2" width="22" height="70" rx="10" fill="#4a3f55"/>
      <path d="M-22 4 v-58 a22 22 0 0 1 44 0 v58 z" fill="currentColor"/>
      <rect x="-6" y="-88" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-102" r="20" fill="#c98a5e"/>
    </g>
    <g id="car"><rect width="26" height="40" rx="6" fill="#5b8fc5"/></g>
    <g id="glass"><path d="M-9 -26 h18 l-3 26 h-12 z" fill="#c47a3a"/><path d="M-9 -26 h18 l-1 6 h-16 z" fill="#e6d7b8"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <path d="M480 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANGRY POST</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SUNDAY CHAI</text>
  <!-- LEFT: phone with group chat -->
  <ellipse cx="240" cy="612" rx="130" ry="8" fill="#000" opacity=".08"/>
  <rect x="110" y="90" width="260" height="514" rx="30" fill="#3d3a3a"/>
  <rect x="124" y="118" width="232" height="460" rx="12" fill="#efe9dd"/>
  <rect x="124" y="118" width="232" height="34" rx="12" fill="#b9ad98"/>
  <g fill="#fff"><circle cx="146" cy="135" r="7"/><circle cx="162" cy="135" r="7"/><circle cx="178" cy="135" r="7"/></g>
  <!-- angry message -->
  <circle cx="148" cy="184" r="15" fill="#d9a27a"/><path d="M141 190 q7 -6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M140 178 l5 2 M156 178 l-5 2" stroke="#2e2a2a" stroke-width="2.5"/>
  <rect x="170" y="170" width="170" height="120" rx="14" fill="#fff" stroke="#e07a5f" stroke-width="4"/>
  <g transform="translate(184 186)"><rect width="100" height="72" rx="4" fill="#d8cdb8"/>
    <use href="#car" x="8" y="8"/><use href="#car" x="38" y="8"/><use href="#car" x="68" y="24" transform="rotate(30 81 44)"/>
    <path d="M10 60 h80" stroke="#fff" stroke-width="3" stroke-dasharray="6 5"/></g>
  <circle cx="312" cy="222" r="16" fill="#e0a33a"/><path d="M304 214 l5 3 M320 214 l-5 3" stroke="#2e2a2a" stroke-width="2.5"/><path d="M305 230 q7 -6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <g stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"><path d="M184 272 h120"/></g>
  <circle cx="340" cy="170" r="16" fill="#e07a5f"/><rect x="337" y="160" width="6" height="13" rx="3" fill="#fff"/><circle cx="340" cy="179" r="3" fill="#fff"/>
  <!-- secretary's reply -->
  <rect x="140" y="320" width="170" height="200" rx="14" fill="#fff" stroke="#1f6f78" stroke-width="4"/>
  <g stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"><path d="M156 344 h136 M156 364 h120 M156 384 h136 M156 404 h96 M156 424 h128"/></g>
  <g transform="translate(184 498)"><path d="M-14 -40 h28 l-4 40 h-20 z" fill="#c47a3a"/><path d="M-14 -40 h28 l-1 8 h-26 z" fill="#e6d7b8"/><path d="M-4 -46 q4 -8 0 -14 M6 -46 q4 -8 0 -14" stroke="#b9ad98" stroke-width="2.5" fill="none"/></g>
  <rect x="224" y="446" width="66" height="58" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="224" y="446" width="66" height="16" rx="5" fill="#e07a5f"/>
  <text x="257" y="494" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">SUN</text>
  <circle cx="332" cy="510" r="15" fill="#c98a5e"/><path d="M318 506 a14 14 0 0 1 28 0 z" fill="#d8d4cc"/>
  <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="327" cy="512" r="4.5"/><circle cx="338" cy="512" r="4.5"/></g>
  <!-- RIGHT: balcony -->
  <rect x="500" y="560" width="460" height="80" fill="#d8cdb8"/>
  <path d="M500 380 H940" stroke="#8a6d5a" stroke-width="8"/>
  <g stroke="#8a6d5a" stroke-width="5"><path d="M520 380 V560 M570 380 V560 M870 380 V560 M920 380 V560"/></g>
  <!-- plants -->
  <path d="M510 560 l8 -50 h44 l8 50 z" fill="#c25b3f"/><g fill="#5f8f5a"><ellipse cx="540" cy="490" rx="16" ry="34" transform="rotate(-20 540 490)"/><ellipse cx="552" cy="486" rx="14" ry="34" transform="rotate(20 552 486)"/></g>
  <path d="M890 560 l8 -44 h40 l8 44 z" fill="#c25b3f"/><g fill="#5f8f5a"><circle cx="906" cy="500" r="18"/><circle cx="928" cy="496" r="20"/></g>
  <!-- secretary seated, holding chai -->
  <g transform="translate(630 510)"><use href="#sit" color="#f3ede0"/>
    <path d="M-20 -110 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#d8d4cc"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="2" cy="-102" r="6"/><circle cx="16" cy="-102" r="6"/><path d="M8 -102 h2"/></g>
    <path d="M4 -88 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M14 -60 l20 26 l18 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#glass" x="58" y="-24"/>
  </g>
  <!-- neighbour seated, pointing at plan -->
  <g transform="translate(820 510) scale(-1 1)"><use href="#sit" color="#e07a5f"/>
    <path d="M-20 -104 a20 22 0 0 1 40 0 l2 40 h-10 l-4 -34 q-12 -10 -28 -6 z" fill="#2e2a2a"/>
    <circle cx="8" cy="-102" r="2.5" fill="#2e2a2a"/>
    <path d="M2 -90 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M14 -60 l40 30 l22 2" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- round table -->
  <rect x="712" y="460" width="16" height="100" fill="#6b5446"/><ellipse cx="720" cy="560" rx="44" ry="7" fill="#6b5446"/>
  <ellipse cx="720" cy="456" rx="120" ry="22" fill="#8a6d5a"/>
  <path d="M660 446 l110 -6 l12 18 l-110 6 z" fill="#fff"/>
  <g fill="#5b8fc5"><rect x="676" y="446" width="12" height="10" rx="2"/><rect x="694" y="445" width="12" height="10" rx="2"/><rect x="712" y="444" width="12" height="10" rx="2"/><rect x="730" y="443" width="12" height="10" rx="2"/></g>
  <use href="#glass" x="790" y="456"/>
  <ellipse cx="652" cy="462" rx="22" ry="6" fill="#fff"/><g fill="#e0a33a"><circle cx="644" cy="458" r="6"/><circle cx="658" cy="458" r="6"/></g>
  <!-- old plan crumpled on the floor -->
  <path d="M600 590 l14 -16 l18 6 l10 -10 l12 16 l-6 16 l-20 4 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <!-- inset: the better plan -->
  <rect x="590" y="96" width="260" height="140" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M706 234 l14 40 l16 -40" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M708 232 h26" stroke="#fff" stroke-width="5"/>
  <rect x="608" y="112" width="180" height="108" rx="6" fill="#d8cdb8"/>
  <path d="M618 166 h160" stroke="#fff" stroke-width="4" stroke-dasharray="10 8"/>
  <use href="#car" x="618" y="118"/><use href="#car" x="652" y="118"/><use href="#car" x="686" y="118"/><use href="#car" x="720" y="118"/><use href="#car" x="754" y="118"/>
  <use href="#car" x="618" y="174"/><use href="#car" x="652" y="174"/><use href="#car" x="686" y="174"/><use href="#car" x="720" y="174"/><use href="#car" x="754" y="174"/>
  <circle cx="820" cy="166" r="18" fill="#3f9a5a"/><path d="M811 166 l6 6 l12 -13" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
