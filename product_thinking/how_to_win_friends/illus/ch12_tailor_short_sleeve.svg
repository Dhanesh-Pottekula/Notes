<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A tailor holds up a wedding kurta and points out its short sleeve himself while the customer relaxes</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="19" fill="#d9a27a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- shelves of cloth bolts -->
  <path d="M40 150 H920 M40 270 H330" stroke="#8a6d5a" stroke-width="8"/>
  <g><rect x="60" y="106" width="70" height="44" rx="6" fill="#1f6f78"/><rect x="140" y="112" width="70" height="38" rx="6" fill="#e0a33a"/><rect x="220" y="106" width="70" height="44" rx="6" fill="#e07a5f"/>
    <rect x="640" y="108" width="70" height="42" rx="6" fill="#7a4e7e"/><rect x="720" y="104" width="70" height="46" rx="6" fill="#cbbfa9"/><rect x="800" y="110" width="80" height="40" rx="6" fill="#1f6f78"/>
    <rect x="60" y="228" width="70" height="42" rx="6" fill="#cbbfa9"/><rect x="140" y="222" width="70" height="48" rx="6" fill="#7a4e7e"/><rect x="220" y="230" width="70" height="40" rx="6" fill="#e0a33a"/></g>
  <!-- sewing machine -->
  <rect x="40" y="370" width="200" height="12" fill="#6b5446"/>
  <path d="M70 370 v-60 h120 v26 h-24 v34 z" fill="#3d3a3a"/><rect x="60" y="364" width="150" height="8" rx="3" fill="#3d3a3a"/><circle cx="196" cy="326" r="14" fill="#b9ad98"/>
  <!-- tailor behind counter -->
  <path d="M448 330 v-90 a32 32 0 0 1 64 0 v90 z" fill="#ffffff"/>
  <rect x="472" y="200" width="16" height="14" fill="#c98a5e"/>
  <circle cx="480" cy="180" r="22" fill="#c98a5e"/>
  <path d="M458 176 a22 22 0 0 1 44 0 q-10 -12 -22 -12 q-12 0 -22 12 z" fill="#b9ad98"/>
  <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="471" cy="182" r="7"/><circle cx="489" cy="182" r="7"/><path d="M478 182 h4"/></g>
  <path d="M472 194 q8 6 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M466 168 l10 -3 M494 168 l-10 -3" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- kurta held up -->
  <path d="M446 226 h68 v200 h-68 z" fill="#f3ede0"/>
  <path d="M446 226 v44 l-46 84 l-28 -14 z" fill="#f3ede0"/>
  <path d="M514 226 v44 l18 26 l26 -18 z" fill="#f3ede0"/>
  <path d="M466 226 q14 18 28 0" stroke="#e0a33a" stroke-width="6" fill="none"/><path d="M480 236 v70" stroke="#e0a33a" stroke-width="5" stroke-dasharray="6 6"/>
  <path d="M374 338 l26 14" stroke="#e0a33a" stroke-width="5"/><path d="M534 294 l24 -16" stroke="#e0a33a" stroke-width="5"/>
  <!-- measuring tape round neck -->
  <path d="M462 214 l-6 70 M498 214 l6 70" stroke="#e0a33a" stroke-width="6"/>
  <!-- tailor hands -->
  <circle cx="450" cy="230" r="10" fill="#c98a5e"/>
  <path d="M520 246 l50 30 l12 -6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M584 268 l14 -6" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
  <!-- ruler inset: 1 cm short -->
  <rect x="600" y="166" width="180" height="94" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="616" y="186" width="130" height="14" rx="3" fill="#f3ede0" stroke="#b9ad98" stroke-width="1.5"/>
  <rect x="616" y="210" width="110" height="14" rx="3" fill="#f3ede0" stroke="#b9ad98" stroke-width="1.5"/>
  <path d="M728 217 h16" stroke="#e07a5f" stroke-width="4" stroke-dasharray="3 3"/>
  <text x="690" y="250" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">1 cm</text>
  <path d="M640 262 C620 290 590 300 572 300" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="7 6" marker-end="url(#ah)"/>
  <!-- tick -->
  <circle cx="600" cy="380" r="20" fill="#3f9a5a"/><path d="M590 380 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- counter -->
  <rect x="140" y="426" width="580" height="14" rx="3" fill="#6b5446"/><rect x="150" y="440" width="560" height="120" fill="#8a6d5a"/>
  <g transform="translate(220 426)"><circle cx="0" cy="-10" r="12" fill="#e07a5f"/><path d="M-4 -22 l-4 -10 M4 -22 l6 -10" stroke="#3d3a3a" stroke-width="2"/></g>
  <g transform="translate(300 420)" stroke="#3d3a3a" stroke-width="4" fill="none"><circle cx="-10" cy="0" r="7"/><circle cx="10" cy="0" r="7"/><path d="M-6 -5 l40 -14 M6 -5 l28 -14"/></g>
  <rect x="380" y="414" width="30" height="10" rx="2" fill="#ffffff" transform="rotate(-10 395 419)"/>
  <rect x="610" y="408" width="56" height="18" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/>
  <!-- customer relaxing -->
  <g transform="translate(820 560) scale(1.35)"><use href="#m" color="#5b8fc5"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-146" r="2.5" fill="#2e2a2a"/><circle cx="4" cy="-146" r="2.5" fill="#2e2a2a"/>
    <path d="M-10 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-20 -106 l-30 -24 l-4 -30" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -104 l6 46" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- fading storm cloud -->
  <g opacity=".4"><circle cx="806" cy="290" r="22" fill="#e07a5f"/><circle cx="836" cy="278" r="28" fill="#e07a5f"/><circle cx="866" cy="292" r="20" fill="#e07a5f"/><rect x="800" y="288" width="72" height="24" rx="12" fill="#e07a5f"/></g>
  <path d="M828 314 l-8 12 h10 l-6 10" stroke="#e0a33a" stroke-width="3" fill="none" opacity=".5"/>
  <text x="250" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">MY MISTAKE</text>
</svg>
