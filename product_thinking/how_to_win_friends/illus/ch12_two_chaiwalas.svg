<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two chai stalls: one chaiwala argues and loses the customer, the other admits the mistake and pours a fresh glass</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="19" fill="#d9a27a"/>
    </g>
    <g id="wala">
      <path d="M-30 0 v-60 a30 30 0 0 1 60 0 v60 z" fill="currentColor"/>
      <path d="M8 -86 l18 30 l-12 4 z" fill="#f3ede0"/>
      <rect x="-7" y="-102" width="14" height="12" fill="#b07850"/>
      <circle cx="0" cy="-120" r="22" fill="#b07850"/>
      <path d="M-22 -122 a22 22 0 0 1 44 0 q-22 -10 -44 0 z" fill="#2e2a2a"/>
      <path d="M-10 -108 q10 -6 20 0" stroke="#2e2a2a" stroke-width="4" fill="none"/>
    </g>
    <g id="stall">
      <rect x="0" y="0" width="250" height="14" rx="3" fill="#6b5446"/><rect x="10" y="14" width="230" height="136" fill="#8a6d5a"/>
      <rect x="150" y="-24" width="70" height="24" rx="4" fill="#3d3a3a"/><path d="M162 -24 q8 -10 16 0 q8 -10 16 0 q8 -10 16 0" fill="#e0a33a"/>
      <path d="M166 -24 v-36 a20 18 0 0 1 40 0 v36 z" fill="#b8bec2"/><path d="M206 -46 l20 -14" stroke="#b8bec2" stroke-width="7" stroke-linecap="round"/><path d="M168 -60 q-10 -2 -10 10" stroke="#3d3a3a" stroke-width="4" fill="none"/>
      <path d="M178 -70 q6 -12 0 -24 M194 -70 q6 -12 0 -24" stroke="#e3dccd" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="20" y="-8" width="80" height="8" rx="2" fill="#b9ad98"/>
      <g fill="#cfe3ea"><path d="M26 -8 v-20 h14 v20 z"/><path d="M46 -8 v-20 h14 v20 z"/><path d="M66 -8 v-20 h14 v20 z"/></g>
      <rect x="108" y="-34" width="28" height="34" rx="6" fill="#e6f0f2" stroke="#b9c8cc" stroke-width="2"/><circle cx="122" cy="-18" r="7" fill="#e0a33a"/>
    </g>
    <g id="glass"><path d="M-10 -30 h20 l-3 30 h-14 z" fill="#c47a3a"/><path d="M-10 -30 h20 l-1 6 h-18 z" fill="#e6d7b8"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ARGUE</text>
  <text x="720" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ADMIT</text>
  <!-- LEFT stall: arguing chaiwala -->
  <g transform="translate(110 420)"><use href="#wala" color="#8f8a85"/>
    <path d="M-12 -86 l3 4 M10 -86 l-3 4" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-22 -50 h44" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
    <path d="M-26 -56 l12 10 M26 -56 l-12 10" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
  </g>
  <use href="#stall" x="30" y="410"/>
  <use href="#glass" x="290" y="410"/>
  <rect x="306" y="396" width="14" height="14" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <!-- argue bubble -->
  <rect x="40" y="110" width="150" height="90" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M96 198 l10 40 l18 -40" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M98 196 h24" stroke="#fff" stroke-width="5"/>
  <rect x="54" y="140" width="34" height="32" rx="10" fill="#b07850"/><rect x="80" y="142" width="42" height="13" rx="6.5" fill="#b07850"/><path d="M60 146 h22 M60 156 h22 M60 166 h22" stroke="#8f5f3e" stroke-width="2"/>
  <circle cx="150" cy="156" r="20" fill="#e07a5f"/><path d="M142 148 l16 16 M158 148 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- customer leaving -->
  <g transform="translate(400 560)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-6 -62 l-20 60" stroke="#4a3f55" stroke-width="13" stroke-linecap="round"/><path d="M6 -62 l22 58" stroke="#4a3f55" stroke-width="13" stroke-linecap="round"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#5b8fc5"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <path d="M6 -138 q4 -3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><circle cx="10" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-18 -104 l-16 40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <rect x="-56" y="-76" width="40" height="30" rx="5" fill="#3d3a3a"/><path d="M-20 -104 l-20 30" stroke="#3d3a3a" stroke-width="3"/>
  </g>
  <path d="M330 470 h26" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/><path d="M336 490 h20" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <!-- RIGHT stall: admitting chaiwala -->
  <g transform="translate(600 420)"><use href="#wala" color="#e0a33a"/>
    <path d="M-12 -122 q4 -4 8 0 M4 -122 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-10 -110 q10 10 20 0 z" fill="#fff" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-26 -60 l-30 10" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
    <path d="M26 -60 l40 -10" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
  </g>
  <use href="#stall" x="510" y="410"/>
  <!-- tipping wrong glass into bucket -->
  <path d="M500 560 l6 -60 h44 l6 60 z" fill="#5b6a75"/><ellipse cx="528" cy="500" rx="22" ry="5" fill="#3d3a3a"/>
  <g transform="translate(542 368) rotate(-120)"><use href="#glass"/></g>
  <path d="M530 386 q-4 30 -2 110" stroke="#c47a3a" stroke-width="5" fill="none"/>
  <!-- pouring fresh -->
  <g transform="translate(668 346) rotate(-28)"><path d="M0 0 v-36 a20 18 0 0 1 40 0 v36 z" fill="#b8bec2"/><path d="M40 -22 l20 -14" stroke="#b8bec2" stroke-width="7" stroke-linecap="round"/></g>
  <path d="M732 318 q14 30 12 74" stroke="#c47a3a" stroke-width="5" fill="none"/>
  <use href="#glass" x="744" y="410"/>
  <!-- 30 s badge -->
  <rect x="770" y="250" width="90" height="46" rx="23" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
  <text x="815" y="281" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">30 s</text>
  <!-- next mornings with ticks -->
  <g transform="translate(546 480)"><rect width="200" height="44" rx="8" fill="#fff"/>
    <g fill="#3f9a5a"><circle cx="28" cy="22" r="14"/><circle cx="76" cy="22" r="14"/><circle cx="124" cy="22" r="14"/><circle cx="172" cy="22" r="14"/></g>
    <g stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"><path d="M21 22 l5 5 l9 -10 M69 22 l5 5 l9 -10 M117 22 l5 5 l9 -10 M165 22 l5 5 l9 -10"/></g></g>
  <!-- happy customer returns -->
  <g transform="translate(880 560) scale(1.05)"><use href="#m" color="#5b8fc5"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-12 -138 q6 6 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-20 -104 l-30 24 l-20 -6" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 -104 l6 46" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
