  <g transform="translate(740 540)"><use href="#sit" color="#7a4e7e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 l-4 -4 q-15 -8 -30 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="6" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-8 -136 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -98 h44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><path d="M-22 -88 h44" stroke="#7a4e7e" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  </g>
  <!-- sister in saree -->
  <g transform="translate(480 520) scale(1.08)"><use href="#m" color="#e07a5f"/>
    <path d="M-26 -100 l40 -24 l14 10 l-28 30 l4 84 h-30 z" fill="#c9604a"/>
    <path d="M-28 -60 h56 l6 60 h-68 z" fill="#e07a5f"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="0" cy="-170" r="9" fill="#2e2a2a"/>
    <circle cx="-6" cy="-149" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-149" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -137 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l26 -26 l4 -30" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M46 -164 l12 -4 M48 -170 l10 -10 M54 -158 l12 2" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
  </g>
  <!-- coffee table with timetable and phone -->
  <ellipse cx="480" cy="580" rx="120" ry="8" fill="#000" opacity=".08"/>
  <rect x="370" y="490" width="220" height="14" rx="4" fill="#6b5446"/><rect x="386" y="504" width="12" height="74" fill="#6b5446"/><rect x="562" y="504" width="12" height="74" fill="#6b5446"/>
  <rect x="396" y="472" width="80" height="20" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="1.5"/><path d="M404 478 h60 M404 486 h44" stroke="#b9ad98" stroke-width="2"/>
  <rect x="500" y="476" width="50" height="16" rx="4" fill="#3d3a3a"/><path d="M506 486 q12 -8 20 0 t18 -2" stroke="#e0a33a" stroke-width="2" fill="none"/>
</svg>
