<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two brothers arguing over Rishikesh or Kerala find agreement when their sister points to the goal they share for their parents</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/><rect x="3" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/>
      <rect x="-22" y="-66" width="44" height="22" rx="9" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#d8cdb8"/>
  <text x="480" y="60" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SAME GOAL</text>
  <!-- window -->
  <rect x="846" y="300" width="90" height="150" rx="4" fill="#fbeedb" stroke="#8a6d5a" stroke-width="6"/><path d="M891 300 v150 M846 375 h90" stroke="#8a6d5a" stroke-width="4"/>
  <!-- shared bubble -->
  <rect x="340" y="78" width="280" height="140" rx="30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="576" cy="110" r="14" fill="#e0a33a"/>
  <rect x="380" y="140" width="14" height="60" fill="#8a6d5a"/><circle cx="387" cy="126" r="30" fill="#1f6f78" opacity=".85"/>
  <rect x="420" y="176" width="130" height="8" rx="3" fill="#8a6d5a"/><path d="M428 184 v18 M542 184 v18" stroke="#6b5446" stroke-width="5"/>
  <g><path d="M452 178 v-24 a12 12 0 0 1 24 0 v24 z" fill="#1f6f78"/><circle cx="464" cy="138" r="10" fill="#c98a5e"/><path d="M454 136 a10 10 0 0 1 20 0 z" fill="#e3dccd"/></g>
  <g><path d="M494 178 v-24 a12 12 0 0 1 24 0 v24 z" fill="#e07a5f"/><circle cx="506" cy="138" r="10" fill="#b07850"/><path d="M496 136 a10 10 0 0 1 20 0 z" fill="#e3dccd"/></g>
  <path d="M572 160 c-6 -8 -16 -2 -10 6 l10 10 l10 -10 c6 -8 -4 -14 -10 -6 z" fill="#e07a5f"/>
  <!-- left bubble: mountains -->
