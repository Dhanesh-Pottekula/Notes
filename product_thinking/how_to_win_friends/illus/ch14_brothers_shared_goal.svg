  <rect x="100" y="220" width="200" height="110" rx="26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M120 310 l50 -70 l40 50 l28 -36 l46 56 z" fill="#b9ad98"/><path d="M158 257 l12 -17 l12 15 l-6 4 l-6 -4 z M228 266 l10 -12 l10 12 z" fill="#fff"/>
  <path d="M130 318 q60 -16 90 0 t70 -4" stroke="#5b9bd5" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- right bubble: backwater houseboat -->
  <circle cx="744" cy="362" r="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="756" cy="342" r="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="660" y="220" width="200" height="110" rx="26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="672" y="292" width="176" height="28" rx="8" fill="#9cc8d6"/>
  <path d="M700 296 h100 l-14 14 h-72 z" fill="#6b5446"/><path d="M712 296 q38 -36 76 0 z" fill="#e0a33a"/>
  <path d="M826 296 q-4 -34 -2 -52" stroke="#8a6d5a" stroke-width="5" fill="none"/>
  <path d="M824 244 q-24 -2 -32 14 M824 244 q22 -6 30 10 M824 244 q-10 -16 -26 -14 M824 244 q12 -16 26 -10" stroke="#3f9a5a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- dashed arrows up to shared goal -->
  <path d="M220 218 C230 170 280 150 334 148" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M740 218 C730 170 680 150 626 148" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- going round in circles -->
  <path d="M318 270 l24 -14 l24 14 l24 -14 l24 14" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M642 270 l-24 -14 l-24 14 l-24 -14 l-24 14" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- sofa + younger brother -->
  <rect x="70" y="420" width="250" height="70" rx="16" fill="#8a6d5a"/><rect x="60" y="470" width="270" height="50" rx="12" fill="#a8846c"/><rect x="70" y="520" width="14" height="20" fill="#6b5446"/><rect x="306" y="520" width="14" height="20" fill="#6b5446"/>
  <g transform="translate(220 540)"><use href="#sit" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="8" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M2 -138 q6 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l30 -18 l2 -28" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -100 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- armchair + older brother -->
