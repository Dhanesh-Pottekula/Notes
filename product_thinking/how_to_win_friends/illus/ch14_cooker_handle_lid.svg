<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A shop owner agrees with an angry customer and her own answers show the cooker handle stays cool while only the lid gets hot</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="ck"><rect x="-24" y="-36" width="48" height="36" rx="8" fill="#b8bec2"/><ellipse cx="0" cy="-36" rx="26" ry="6" fill="#9aa1a6"/><rect x="-3" y="-50" width="6" height="12" fill="#3d3a3a"/><rect x="24" y="-40" width="30" height="6" rx="3" fill="#3d3a3a"/></g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- shelves -->
  <g fill="#8a6d5a"><rect x="690" y="150" width="250" height="8"/><rect x="690" y="250" width="250" height="8"/></g>
  <use href="#ck" transform="translate(730 150)"/><use href="#ck" transform="translate(820 150)"/><use href="#ck" transform="translate(730 250)"/><use href="#ck" transform="translate(820 250)"/>
  <g fill="#8a6d5a"><rect x="20" y="150" width="200" height="8"/></g>
  <use href="#ck" transform="translate(60 150)"/><use href="#ck" transform="translate(150 150)"/>
  <!-- inset: close-up cooker -->
  <rect x="300" y="80" width="360" height="290" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <ellipse cx="450" cy="216" rx="96" ry="34" fill="#e07a5f" opacity=".25"/>
  <rect x="370" y="220" width="160" height="120" rx="24" fill="#b8bec2"/><rect x="370" y="250" width="160" height="10" fill="#a2a9ae"/>
  <ellipse cx="450" cy="220" rx="84" ry="16" fill="#9aa1a6"/>
  <rect x="440" y="186" width="20" height="30" rx="4" fill="#3d3a3a"/><circle cx="450" cy="184" r="9" fill="#3d3a3a"/>
  <path d="M436 170 q-8 -14 0 -28 M450 166 q-8 -14 0 -28 M464 170 q-8 -14 0 -28" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="530" y="212" width="100" height="18" rx="9" fill="#3d3a3a"/>
  <path d="M548 250 q10 -8 20 0 t20 0 t20 0" stroke="#5b9bd5" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="352" y="134" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">HOT</text>
  <path d="M370 142 L404 196" stroke="#7a4e7e" stroke-width="3" marker-end="url(#ah)"/>
  <text x="586" y="150" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">COOL</text>
  <path d="M586 160 L586 200" stroke="#7a4e7e" stroke-width="3" marker-end="url(#ah)"/>
  <use href="#tick" transform="translate(612 290)"/>
  <circle cx="330" cy="290" r="16" fill="#e07a5f"/><path d="M330 280 v12 M330 298 v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- customer holding cooker -->
  <g transform="translate(190 560) scale(1.15)"><use href="#m" color="#7a4e7e"/>
    <path d="M-28 -60 h56 l6 60 h-68 z" fill="#7a4e7e"/><path d="M-26 -100 l40 -24 l14 10 l-28 30 l4 84 h-30 z" fill="#5f3c63"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-160" r="8" fill="#2e2a2a"/>
    <circle cx="2" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="12" cy="-148" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="8" cy="-136" rx="4" ry="3" fill="#2e2a2a"/>
    <path d="M-22 -104 l40 10 l20 -6 M22 -104 l18 16" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30 -100 l-14 40 h14" stroke="#e07a5f" stroke-width="6" fill="none"/><rect x="-50" y="-64" width="26" height="22" rx="4" fill="#e07a5f"/>
    <use href="#ck" transform="translate(54 -82) scale(1.1)"/>
  </g>
  <!-- two yes bubbles -->
  <rect x="150" y="228" width="60" height="46" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><use href="#tick" transform="translate(180 251)"/>
  <rect x="222" y="200" width="60" height="46" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><use href="#tick" transform="translate(252 223)"/>
  <path d="M276 330 L320 300" stroke="#7a4e7e" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- counter + owner -->
  <g transform="translate(780 510) scale(1.15)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-10 -138 q10 -6 20 0" stroke="#2e2a2a" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M-6 -130 q6 4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-22 -104 l-36 4 l-12 -16" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l8 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="660" y="420" width="300" height="14" rx="3" fill="#6b5446"/><rect x="672" y="434" width="288" height="126" fill="#8a6d5a"/>
  <path d="M690 420 q20 -18 40 -6 q20 -14 44 0 z" fill="#f3ede0"/>
  <circle cx="830" cy="410" r="12" fill="none" stroke="#3d3a3a" stroke-width="5"/>
</svg>
