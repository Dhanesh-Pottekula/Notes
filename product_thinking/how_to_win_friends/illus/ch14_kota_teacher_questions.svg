<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A coaching-class teacher asks small questions until the student finds his own mistake, 26 instead of 36</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="bust">
      <path d="M-24 0 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-74" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-88" r="19" fill="#c98a5e"/>
    </g>
    <g id="q"><rect x="-26" y="-22" width="52" height="44" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><text y="12" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">?</text></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- whiteboard -->
  <rect x="50" y="70" width="400" height="290" rx="6" fill="#ffffff" stroke="#9a9590" stroke-width="8"/>
  <rect x="50" y="356" width="400" height="10" fill="#9a9590"/>
  <rect x="110" y="110" width="170" height="170" fill="none" stroke="#1f6f78" stroke-width="6"/>
  <text x="195" y="322" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">SIDE 6</text>
  <path d="M110 296 h170" stroke="#1f6f78" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="365" y="190" text-anchor="middle" font-size="26" font-weight="800" fill="#1f6f78">6 × 6</text>
  <text x="365" y="230" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">?</text>
  <!-- teacher -->
  <g transform="translate(470 560) scale(1.15)"><use href="#m" color="#1f6f78"/>
    <path d="M-24 -60 h48 l6 34 h-60 z" fill="#1f6f78"/>
    <path d="M-24 -120 q24 30 48 0 v14 q-24 26 -48 0 z" fill="#e0a33a"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 v20 h-6 v-16 q-13 -6 -26 0 v16 h-6 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-34 -26 l-10 -24" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-66 -154 l-8 -14" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 -104 l18 30 l14 -6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <use href="#q" transform="translate(540 300)"/><use href="#q" transform="translate(580 240)"/><use href="#q" transform="translate(620 180)"/>
  <!-- background students -->
  <g opacity=".55"><g transform="translate(840 400) scale(.8)"><use href="#bust" color="#7a4e7e"/><path d="M-19 -92 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/></g>
  <g transform="translate(910 400) scale(.8)"><use href="#bust" color="#e0a33a"/><path d="M-19 -92 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/></g>
  <rect x="800" y="398" width="160" height="10" fill="#8a6d5a"/><rect x="810" y="408" width="8" height="70" fill="#6b5446"/><rect x="940" y="408" width="8" height="70" fill="#6b5446"/></g>
  <!-- student at bench -->
  <rect x="640" y="460" width="230" height="14" rx="3" fill="#8a6d5a"/><rect x="652" y="474" width="10" height="86" fill="#6b5446"/><rect x="848" y="474" width="10" height="86" fill="#6b5446"/>
  <g transform="translate(760 470) scale(1.15)"><use href="#bust" color="#ffffff"/>
    <path d="M-19 -92 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-86" r="3" fill="#2e2a2a"/><circle cx="7" cy="-86" r="3" fill="#2e2a2a"/><ellipse cx="0" cy="-75" rx="4" ry="3.5" fill="#2e2a2a"/>
    <path d="M-22 -30 l-10 22 M22 -30 l14 20" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M38 -10 l12 -26" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M716 458 h88 l-4 -10 h-80 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="880" y="490" width="40" height="70" rx="10" fill="#e07a5f"/>
  <!-- light bulb -->
  <circle cx="760" cy="300" r="20" fill="#f6dca5" stroke="#e0a33a" stroke-width="3"/><rect x="752" y="318" width="16" height="10" rx="2" fill="#9a9590"/>
  <path d="M760 268 v-10 M732 282 l-8 -6 M788 282 l8 -6" stroke="#e0a33a" stroke-width="3" stroke-linecap="round"/>
  <!-- notebook inset -->
  <rect x="690" y="60" width="230" height="170" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="712" y="80" width="186" height="130" rx="4" fill="#fbf7ee" stroke="#b9ad98" stroke-width="2"/>
  <g stroke="#d6e4ea" stroke-width="2"><path d="M712 110 h186 M712 140 h186 M712 170 h186"/></g>
  <text x="760" y="168" text-anchor="middle" font-size="40" font-weight="800" fill="#2b2b2b">26</text>
  <path d="M732 158 L790 138" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <text x="850" y="168" text-anchor="middle" font-size="40" font-weight="800" fill="#3f9a5a">36</text>
  <path d="M760 236 L760 262" stroke="#cbbfa9" stroke-width="3" stroke-dasharray="4 4"/>
  <!-- arrow board to notebook -->
  <path d="M290 100 C400 30 560 40 682 110" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
