<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A post office clerk shows an elderly man that naming his daughter as nominee gets her the money in a week, not after months of court papers</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- wall behind clerk: clock + calendar -->
  <circle cx="880" cy="76" r="30" fill="#fff" stroke="#6b5446" stroke-width="5"/><path d="M880 76 v-18 M880 76 h12" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="640" y="50" width="56" height="64" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="640" y="50" width="56" height="16" rx="4" fill="#e07a5f"/><g fill="#cbbfa9"><rect x="648" y="76" width="10" height="8"/><rect x="663" y="76" width="10" height="8"/><rect x="678" y="76" width="10" height="8"/><rect x="648" y="92" width="10" height="8"/><rect x="663" y="92" width="10" height="8"/></g>
  <!-- window -->
  <rect x="600" y="150" width="320" height="250" fill="#fbeedb"/>
  <!-- clerk -->
  <g transform="translate(750 482) scale(1.3)"><use href="#m" color="#e0a33a"/>
    <path d="M-26 -100 l40 -24 l14 10 l-28 30 v40 h-26 z" fill="#c98a2a"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="16" cy="-160" r="8" fill="#2e2a2a"/>
    <circle cx="-7" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="7" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-50 6 l-56 4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-128 -94 l-20 4" stroke="#1f6f78" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g stroke="#9a9590" stroke-width="4" opacity=".7"><path d="M640 150 V240 M680 150 V240 M720 150 V240 M760 150 V240 M800 150 V240 M840 150 V240 M880 150 V240"/></g>
  <path d="M600 240 H920" stroke="#9a9590" stroke-width="5"/>
  <rect x="592" y="142" width="336" height="16" fill="#8a6d5a"/>
  <rect x="600" y="160" width="0" height="0"/>
  <!-- counter -->
  <rect x="380" y="400" width="580" height="16" rx="3" fill="#6b5446"/><rect x="392" y="416" width="568" height="144" fill="#8a6d5a"/>
  <path d="M392 470 H960" stroke="#6b5446" stroke-width="3"/>
  <!-- form -->
  <rect x="410" y="300" width="170" height="100" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M424 318 h120 M424 334 h96 M424 350 h110" stroke="#cbbfa9" stroke-width="5" stroke-linecap="round"/>
  <rect x="418" y="362" width="154" height="30" rx="4" fill="#f6dca5" stroke="#e0a33a" stroke-width="2.5"/>
  <text x="495" y="385" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">NOMINEE</text>
  <!-- grandson passbook -->
  <rect x="340" y="384" width="40" height="16" rx="2" fill="#3f9a5a"/>
  <!-- elderly man -->
  <g transform="translate(240 604) scale(1.3)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 h48 v20 h-48 z" fill="#ffffff"/>
    <path d="M-22 -122 h44 v58 h-44 z" fill="#8f8a85" opacity=".9"/><path d="M0 -122 v58" stroke="#f3ede0" stroke-width="10"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#e3dccd"/><path d="M-19 -150 v8 M19 -150 v8" stroke="#e3dccd" stroke-width="5"/>
    <circle cx="5" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="14" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M4 -138 h10" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -104 l18 22 l-14 -38" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -100 l-14 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-38 -64 V2" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/><path d="M-38 -64 q0 -12 12 -12" stroke="#6b5446" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <!-- thought bubbles -->
  <circle cx="236" cy="372" r="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="220" cy="346" r="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <!-- happy bubble -->
  <rect x="40" y="100" width="290" height="230" rx="30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <g transform="translate(130 300)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/>
    <rect x="-12" y="-46" width="10" height="46" rx="5" fill="#4a3f55"/><rect x="2" y="-46" width="10" height="46" rx="5" fill="#4a3f55"/>
    <path d="M-20 -40 v-36 a20 20 0 0 1 40 0 v36 z" fill="#7a4e7e"/>
    <circle cx="0" cy="-110" r="15" fill="#d9a27a"/><path d="M-16 -110 a16 16 0 0 1 32 0 v26 h-8 v-22 q-8 -6 -16 0 v22 h-8 z" fill="#2e2a2a"/>
    <path d="M-6 -104 q6 5 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M18 -76 l26 -6" stroke="#d9a27a" stroke-width="8" stroke-linecap="round"/>
    <rect x="40" y="-94" width="34" height="22" rx="2" fill="#f3e3b0" stroke="#e0a33a" stroke-width="2"/><path d="M40 -94 l17 12 l17 -12" stroke="#e0a33a" stroke-width="2" fill="none"/>
  </g>
  <rect x="196" y="130" width="116" height="76" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="196" y="130" width="116" height="18" rx="6" fill="#1f6f78"/>
  <text x="254" y="186" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">1 WEEK</text>
  <circle cx="290" cy="240" r="18" fill="#3f9a5a"/><path d="M281 240 l6 7 l12 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- court papers bubble -->
  <rect x="360" y="110" width="200" height="150" rx="28" fill="#fff" stroke="#cbbfa9" stroke-width="2" opacity=".95"/>
  <circle cx="340" cy="230" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <g fill="#fff" stroke="#b9ad98" stroke-width="2"><rect x="384" y="214" width="70" height="16"/><rect x="388" y="198" width="70" height="16"/><rect x="382" y="182" width="70" height="16"/><rect x="386" y="166" width="70" height="16"/><rect x="384" y="150" width="70" height="16"/><rect x="388" y="134" width="70" height="16"/></g>
  <path d="M484 140 h40 l-20 36 l20 36 h-40 l20 -36 z" fill="#e0a33a" opacity=".85"/><path d="M484 140 h40 M484 212 h40" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>
  <circle cx="530" cy="236" r="16" fill="#e07a5f"/><path d="M523 229 l14 14 M537 229 l-14 14" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- arrow from nominee row to happy bubble -->
  <path d="M440 360 C400 330 360 320 320 300" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
