<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One tent-house hangs up on a 50-chair order; another asks three questions and sets up a home package of chairs, a shamiana and fans</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="ch"><path d="M-14 -56 h28 v30 h-28 z" fill="#c9604a"/><rect x="-18" y="-28" width="36" height="8" rx="3" fill="#c9604a"/><path d="M-14 -20 l-4 20 M14 -20 l4 20" stroke="#a84d3a" stroke-width="5" stroke-linecap="round"/></g>
    <g id="fan"><ellipse cx="0" cy="2" rx="18" ry="4" fill="#000" opacity=".08"/><rect x="-14" y="-6" width="28" height="6" rx="3" fill="#3d3a3a"/><rect x="-3" y="-90" width="6" height="86" fill="#3d3a3a"/><circle cx="0" cy="-104" r="22" fill="#fff" stroke="#9a9590" stroke-width="3"/><path d="M0 -104 l-12 -12 M0 -104 l14 -8 M0 -104 l-2 16" stroke="#1f6f78" stroke-width="6" stroke-linecap="round"/></g>
    <g id="tick"><circle r="15" fill="#3f9a5a"/><path d="M-7 0 l5 6 l9 -11" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="480" y="0" width="480" height="560" fill="#ecc3a0"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 0 V640" stroke="#d8cdb8" stroke-width="3"/>
  <!-- LEFT: call that hangs up -->
  <rect x="60" y="80" width="330" height="230" rx="28" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M220 310 l10 30 l20 -30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M222 308 h26" stroke="#fff" stroke-width="5"/>
  <use href="#ch" transform="translate(120 280)"/><use href="#ch" transform="translate(120 262)"/><use href="#ch" transform="translate(120 244)"/><use href="#ch" transform="translate(120 226)"/><use href="#ch" transform="translate(120 208)"/>
  <use href="#ch" transform="translate(166 280)"/><use href="#ch" transform="translate(166 262)"/><use href="#ch" transform="translate(166 244)"/><use href="#ch" transform="translate(166 226)"/><use href="#ch" transform="translate(166 208)"/>
  <text x="290" y="200" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">MIN 200</text>
  <circle cx="290" cy="246" r="20" fill="#e07a5f"/><path d="M281 237 l18 18 M299 237 l-18 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- man on phone, puzzled -->
  <g transform="translate(240 560) scale(1.15)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M-6 -136 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l14 -28 l-12 -18" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="-170" width="12" height="24" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -100 l-4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <text x="168" y="400" text-anchor="middle" font-size="40" font-weight="800" fill="#7a4e7e">?</text>
  <!-- broken line -->
  <path d="M300 420 h30 M350 420 h20" stroke="#9a9590" stroke-width="4" stroke-dasharray="8 8"/>
  <rect x="386" y="398" width="28" height="46" rx="5" fill="#3d3a3a"/><circle cx="420" cy="396" r="12" fill="#e07a5f"/><path d="M415 391 l10 10 M425 391 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/>

  <!-- RIGHT: courtyard package -->
  <text x="720" y="56" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PACKAGE</text>
  <path d="M520 100 h400 v52 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 q-25 22 -50 0 z" fill="#e0a33a"/>
  <g fill="#e07a5f"><rect x="540" y="100" width="20" height="52"/><rect x="600" y="100" width="20" height="52"/><rect x="660" y="100" width="20" height="52"/><rect x="720" y="100" width="20" height="52"/><rect x="780" y="100" width="20" height="52"/><rect x="840" y="100" width="20" height="52"/><rect x="900" y="100" width="20" height="52"/></g>
  <g fill="#e0a33a" opacity=".9"><circle cx="545" cy="170" r="5"/><circle cx="595" cy="170" r="5"/><circle cx="645" cy="170" r="5"/><circle cx="695" cy="170" r="5"/><circle cx="745" cy="170" r="5"/><circle cx="795" cy="170" r="5"/><circle cx="845" cy="170" r="5"/><circle cx="895" cy="170" r="5"/></g>
  <path d="M526 100 V560 M914 100 V560" stroke="#6b5446" stroke-width="8"/>
  <!-- small arched window on wall -->
  <path d="M690 330 v-60 a30 30 0 0 1 60 0 v60 z" fill="#8a6d5a"/>
  <!-- chairs: two rows -->
  <g><use href="#ch" transform="translate(566 470)"/> <use href="#ch" transform="translate(604 470)"/> <use href="#ch" transform="translate(642 470)"/> <use href="#ch" transform="translate(680 470)"/> <use href="#ch" transform="translate(718 470)"/>
  <use href="#ch" transform="translate(576 540) scale(1.1)"/> <use href="#ch" transform="translate(618 540) scale(1.1)"/> <use href="#ch" transform="translate(660 540) scale(1.1)"/> <use href="#ch" transform="translate(702 540) scale(1.1)"/> <use href="#ch" transform="translate(744 540) scale(1.1)"/></g>
  <use href="#fan" transform="translate(556 380)"/><use href="#fan" transform="translate(764 380)"/>
  <!-- owner and customer shaking hands -->
  <g transform="translate(816 566)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#ffffff"/>
    <path d="M-22 -150 q-2 -30 22 -32 q24 2 22 32 q-22 -8 -44 0 z" fill="#e0a33a"/>
    <circle cx="-7" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-10 -138 q10 -6 20 0" stroke="#2e2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 l22 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-8 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(876 566)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-8 -138 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-22 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="846" cy="474" r="8" fill="#c98a5e"/>
  <!-- three yes ticks -->
  <rect x="780" y="246" width="136" height="56" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <use href="#tick" transform="translate(808 274)"/><use href="#tick" transform="translate(848 274)"/><use href="#tick" transform="translate(888 274)"/>
  <circle cx="866" cy="318" r="6" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="872" cy="336" r="4" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
</svg>
