<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An uncle who has said never at the lunch table rejects every fact, while asking him easy questions first earns two yes answers</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="bust">
      <path d="M-24 0 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-74" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-88" r="19" fill="#c98a5e"/>
    </g>
    <g id="uncle">
      <path d="M-19 -96 a19 19 0 0 1 6 -12 M19 -96 a19 19 0 0 0 -6 -12" stroke="#8f8a85" stroke-width="6" fill="none"/>
      <path d="M-10 -78 q10 -6 20 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
      <circle cx="-7" cy="-90" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-90" r="2.5" fill="#2e2a2a"/>
    </g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO FIRST</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">YES FIRST</text>

  <!-- LEFT: lunch table -->
  <g transform="translate(250 400)"><use href="#bust" color="#d9a27a"/><path d="M-19 -92 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><path d="M-6 -78 q6 3 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/></g>
  <g transform="translate(330 400)"><use href="#bust" color="#7a4e7e"/><path d="M-19 -90 a19 19 0 0 1 38 0 l0 20 l-6 0 l0 -14 q-13 -6 -26 0 l0 14 l-6 0 z" fill="#2e2a2a"/><path d="M-6 -78 q6 3 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/></g>
  <!-- uncle at head -->
  <g transform="translate(410 404) scale(1.12)"><use href="#bust" color="#f3ede0"/><use href="#uncle"/>
    <path d="M-22 -30 h44" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><path d="M-20 -20 h40" stroke="#e3dccd" stroke-width="6" stroke-linecap="round"/>
  </g>
  <rect x="200" y="400" width="260" height="14" rx="4" fill="#8a6d5a"/><rect x="214" y="414" width="12" height="146" fill="#6b5446"/><rect x="434" y="414" width="12" height="146" fill="#6b5446"/>
  <g><ellipse cx="250" cy="396" rx="26" ry="6" fill="#b8bec2"/><ellipse cx="250" cy="394" rx="12" ry="3" fill="#f3e3b0"/><ellipse cx="330" cy="396" rx="26" ry="6" fill="#b8bec2"/><ellipse cx="330" cy="394" rx="12" ry="3" fill="#e0a33a"/><ellipse cx="410" cy="396" rx="26" ry="6" fill="#b8bec2"/></g>
  <!-- NEVER bubble -->
  <rect x="380" y="206" width="94" height="50" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M410 256 l4 22 l14 -22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M412 254 h14" stroke="#fff" stroke-width="5"/>
  <text x="427" y="239" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">"NEVER"</text>
  <!-- invisible wall -->
  <path d="M372 150 V560" stroke="#e07a5f" stroke-width="4" stroke-dasharray="6 8" opacity=".7"/>
  <circle cx="372" cy="132" r="14" fill="#e07a5f"/><path d="M366 126 l12 12 M378 126 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <!-- nephew with fact cards -->
  <g transform="translate(90 560)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="8" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M4 -138 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l30 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-20 -100 l-4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- cards flying and bouncing off the wall -->
  <g>
    <rect x="130" y="150" width="44" height="34" rx="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="144" cy="167" r="8" fill="#e0a33a"/><path d="M154 176 l14 -16" stroke="#3d3a3a" stroke-width="3"/>
    <rect x="130" y="196" width="44" height="34" rx="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="138" y="206" width="28" height="14" rx="2" fill="#1f6f78"/>
    <rect x="130" y="242" width="44" height="34" rx="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="152" cy="259" r="10" fill="#d9a27a"/><path d="M146 260 q6 5 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <g stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="8 6">
      <path d="M180 162 C260 150 330 156 366 172"/><path d="M366 172 C330 186 270 186 230 182" marker-end="url(#ah)"/>
      <path d="M180 213 H366"/><path d="M366 213 C330 226 270 228 230 226" marker-end="url(#ah)"/>
    </g>
  </g>

  <!-- RIGHT: petrol pump -->
  <rect x="520" y="300" width="80" height="260" rx="10" fill="#e07a5f"/><rect x="532" y="320" width="56" height="60" rx="4" fill="#fff"/>
  <g fill="#2b2b2b"><rect x="538" y="332" width="10" height="16" rx="2"/><rect x="552" y="332" width="10" height="16" rx="2"/><rect x="566" y="332" width="10" height="16" rx="2"/><rect x="538" y="354" width="10" height="16" rx="2"/><rect x="552" y="354" width="10" height="16" rx="2"/><rect x="566" y="354" width="10" height="16" rx="2"/></g><rect x="532" y="396" width="56" height="12" rx="3" fill="#3d3a3a"/>
  <path d="M600 420 q30 10 30 50 v40" stroke="#3d3a3a" stroke-width="6" fill="none"/>
  <rect x="514" y="286" width="92" height="20" rx="6" fill="#3d3a3a"/>
  <path d="M614 380 l40 -60 m-16 0 h16 v16" stroke="#e07a5f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- uncle standing, rueful -->
  <g transform="translate(690 560) scale(1.12)"><use href="#m" color="#f3ede0"/>
    <g transform="translate(0 -60)"><use href="#uncle"/></g>
    <path d="M-22 -104 l-14 30 l14 10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l12 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- nephew asking -->
  <g transform="translate(800 560)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-8" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M-14 -138 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-26 -10" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M22 -100 l4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="792" y="296" width="44" height="40" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><text x="814" y="326" text-anchor="middle" font-size="26" font-weight="800" fill="#7a4e7e">?</text>
  <!-- two yes bubbles -->
  <rect x="610" y="150" width="64" height="52" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><use href="#tick" transform="translate(642 176)"/>
  <rect x="690" y="110" width="64" height="52" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><use href="#tick" transform="translate(722 136)"/>
  <circle cx="676" cy="250" r="6" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="664" cy="224" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M676 186 q12 -6 14 -20" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#ah)"/>
  <!-- plain scooter -->
  <g transform="translate(850 560)">
    <ellipse cx="0" cy="2" rx="70" ry="7" fill="#000" opacity=".08"/>
    <circle cx="-44" cy="-20" r="20" fill="#3d3a3a"/><circle cx="44" cy="-20" r="20" fill="#3d3a3a"/><circle cx="-44" cy="-20" r="8" fill="#cbbfa9"/><circle cx="44" cy="-20" r="8" fill="#cbbfa9"/>
    <path d="M-64 -30 q4 -40 50 -40 h30 l14 40 z" fill="#1f6f78"/><path d="M30 -30 l14 -70 h12" stroke="#1f6f78" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="-50" y="-80" width="50" height="12" rx="6" fill="#3d3a3a"/>
  </g>
</svg>
