<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A broker who has listed the flat's problems stays silent while the buyer on the balcony talks herself into the lake view</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="x"><circle r="11" fill="#e07a5f"/><path d="M-5 -5 l10 10 M5 -5 l-10 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g>
    <g id="tb"><circle r="40" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- balcony opening with view -->
  <rect x="380" y="80" width="560" height="480" fill="#dcecf0"/>
  <path d="M380 300 q40 -30 80 -10 q30 -40 70 -10 l20 -30 l20 30 q40 -20 70 0 v60 h-260 z" fill="#b9c8cc"/>
  <g fill="#b9c8cc"><rect x="640" y="250" width="26" height="60"/><rect x="672" y="230" width="20" height="80"/><rect x="700" y="260" width="30" height="50"/><rect x="860" y="240" width="24" height="70"/></g>
  <rect x="380" y="300" width="560" height="120" fill="#9cc8d6"/>
  <path d="M420 340 h60 M540 370 h80 M700 344 h70 M820 380 h60" stroke="#dcecf0" stroke-width="4" stroke-linecap="round"/>
  <g fill="#3f9a5a"><circle cx="400" cy="300" r="22"/><circle cx="430" cy="306" r="16"/><circle cx="900" cy="296" r="24"/><circle cx="930" cy="304" r="16"/></g>
  <text x="530" y="402" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LAKE VIEW</text>
  <!-- balcony floor + railing -->
  <rect x="380" y="420" width="560" height="140" fill="#cbbfa9"/>
  <path d="M380 440 H940" stroke="#3d3a3a" stroke-width="6"/>
  <path d="M400 440 V520 M440 440 V520 M480 440 V520 M520 440 V520 M560 440 V520 M600 440 V520 M640 440 V520 M680 440 V520 M720 440 V520 M760 440 V520 M800 440 V520 M840 440 V520 M880 440 V520 M920 440 V520" stroke="#3d3a3a" stroke-width="3"/>
  <path d="M380 520 H940" stroke="#3d3a3a" stroke-width="5"/>
  <!-- door frame -->
  <rect x="370" y="70" width="14" height="490" fill="#8a6d5a"/><rect x="370" y="70" width="580" height="14" fill="#8a6d5a"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- buyer leaning on railing -->
  <g transform="translate(720 566) scale(1.15)"><use href="#m" color="#1f6f78"/>
    <path d="M-24 -60 h48 l6 34 h-60 z" fill="#1f6f78"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 v24 h-6 v-20 q-13 -6 -26 0 v20 h-6 z" fill="#2e2a2a"/>
    <path d="M-10 -148 q3 -3 6 0 M4 -148 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M-6 -137 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-20 18 l-8 8 M22 -104 l20 18 l8 8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-20 -110 l-20 50" stroke="#8a6d5a" stroke-width="4"/><rect x="-52" y="-66" width="34" height="26" rx="4" fill="#8a6d5a"/>
  </g>
  <!-- thinking-aloud bubbles -->
  <circle cx="742" cy="352" r="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="752" cy="330" r="9" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <use href="#tb" transform="translate(640 200)"/><use href="#tb" transform="translate(750 150)"/><use href="#tb" transform="translate(862 210)"/>
  <rect x="616" y="186" width="48" height="30" rx="3" fill="#3d3a3a"/><rect x="620" y="190" width="40" height="22" fill="#9cc8d6"/><rect x="608" y="216" width="64" height="6" rx="2" fill="#9a9590"/>
  <path d="M726 170 h12 v-12 h12 v-12 h12 v-12 h12" stroke="#8a6d5a" stroke-width="5" fill="none"/><path d="M748 132 c-4 -6 -12 -2 -8 4 l8 8 l8 -8 c4 -6 -4 -10 -8 -4 z" fill="#e07a5f"/>
  <rect x="836" y="204" width="44" height="26" rx="8" fill="#1f6f78"/><rect x="842" y="210" width="10" height="8" fill="#dcecf0"/><rect x="856" y="210" width="10" height="8" fill="#dcecf0"/>
  <rect x="868" y="184" width="22" height="20" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="868" y="184" width="22" height="6" fill="#e07a5f"/>
  <!-- inside wall left -->
  <!-- broker quiet in doorway -->
  <g transform="translate(270 566) scale(1.15)"><use href="#m" color="#7a4e7e"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="0" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="12" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M2 -138 h8" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-10 -124 l10 46 l10 -46" stroke="#1f6f78" stroke-width="3" fill="none"/><rect x="-6" y="-80" width="12" height="16" rx="2" fill="#fff"/>
    <path d="M-22 -104 l8 34 l22 0 M22 -104 l-4 34 l-14 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-16" y="-96" width="30" height="40" rx="3" fill="#8a6d5a"/><rect x="-12" y="-90" width="22" height="30" fill="#fff"/>
  </g>
  <!-- clipboard inset -->
  <rect x="40" y="80" width="280" height="240" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="80" y="104" width="200" height="196" rx="6" fill="#8a6d5a"/><rect x="92" y="122" width="176" height="166" fill="#fff"/><rect x="150" y="96" width="60" height="16" rx="4" fill="#3d3a3a"/>
  <text x="104" y="166" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO LIFT</text><use href="#x" transform="translate(246 158)"/>
  <path d="M104 216 h12 v-10 h12 v-10 h12" stroke="#8a6d5a" stroke-width="5" fill="none"/><text x="166" y="218" font-size="26" font-weight="800" fill="#2b2b2b">4</text><use href="#x" transform="translate(246 208)"/>
  <rect x="104" y="244" width="40" height="22" rx="7" fill="#1f6f78"/><path d="M152 256 h60" stroke="#9a9590" stroke-width="3" stroke-dasharray="6 5"/><use href="#x" transform="translate(246 256)"/>
  <path d="M320 260 C420 300 560 330 680 400" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
