<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cricket captain listens to his opener, spinner and keeper, and builds the team plan on the board from what they tell him</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-48" width="14" height="48" rx="6" fill="#ffffff"/><rect x="3" y="-48" width="14" height="48" rx="6" fill="#ffffff"/>
      <rect x="-22" y="-66" width="44" height="22" rx="9" fill="#ffffff"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="hair"><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-7" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-148" r="2.5" fill="#2e2a2a"/></g>
    <g id="locker"><rect width="70" height="300" rx="4" fill="#cbbfa9"/><path d="M8 30 h20 M8 40 h20" stroke="#b9ad98" stroke-width="3"/><circle cx="58" cy="150" r="4" fill="#9a9590"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <use href="#locker" transform="translate(20 260)"/><use href="#locker" transform="translate(96 260)"/><use href="#locker" transform="translate(790 260)"/><use href="#locker" transform="translate(866 260)"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- whiteboard -->
  <rect x="330" y="70" width="300" height="250" rx="6" fill="#fff" stroke="#9a9590" stroke-width="7"/>
  <text x="480" y="118" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">TEAM PLAN</text>
  <rect x="358" y="140" width="80" height="62" rx="8" fill="#f6dca5"/><rect x="420" y="160" width="18" height="18" rx="9" fill="#f6dca5"/>
  <rect x="440" y="140" width="80" height="62" rx="8" fill="#d6e4ea"/><circle cx="440" cy="169" r="9" fill="#fff"/>
  <rect x="522" y="140" width="80" height="62" rx="8" fill="#e6d6e7"/><circle cx="522" cy="169" r="9" fill="#fff"/>
  <rect x="386" y="150" width="22" height="44" rx="3" fill="#cbb07a"/><path d="M390 164 l8 6 l-4 8 M402 176 l-6 10" stroke="#8a6d5a" stroke-width="2" fill="none"/>
  <path d="M480 152 q-14 20 0 28 q14 -8 0 -28 z" fill="#5b9bd5"/>
  <circle cx="562" cy="171" r="14" fill="#e07a5f"/><path d="M552 166 q10 8 20 0" stroke="#fff" stroke-width="2" fill="none"/>
  <ellipse cx="480" cy="262" rx="110" ry="42" fill="none" stroke="#3f9a5a" stroke-width="4"/><rect x="474" y="246" width="12" height="32" fill="#cbb07a"/>
  <g fill="#1f6f78"><circle cx="420" cy="244" r="5"/><circle cx="540" cy="244" r="5"/><circle cx="400" cy="276" r="5"/><circle cx="560" cy="280" r="5"/><circle cx="480" cy="230" r="5"/><circle cx="510" cy="290" r="5"/></g>
  <!-- captain listening -->
  <g transform="translate(480 562) scale(1.15)"><use href="#m" color="#1f6f78"/><use href="#hair"/>
    <path d="M-6 -136 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-24 -96 h10 v10 h-10 z" fill="#e0a33a"/>
    <path d="M22 -104 l24 -14 l4 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 -138 l2 -16" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
    <path d="M-22 -104 l-10 30 l10 8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30 -80 a14 8 0 0 1 28 0 z" fill="#1f6f78"/>
  </g>
  <!-- opener with pads and helmet -->
  <g transform="translate(150 562)"><use href="#m" color="#1f6f78"/><use href="#hair"/>
    <rect x="-20" y="-62" width="18" height="62" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/><rect x="2" y="-62" width="18" height="62" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l12 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-12 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M18 -80 a20 18 0 0 1 40 0 z" fill="#3d3a3a"/><path d="M50 -80 v12 M44 -80 v12" stroke="#9a9590" stroke-width="2"/>
  </g>
  <!-- spinner, ball in hand -->
  <g transform="translate(300 562)"><use href="#m" color="#1f6f78"/><use href="#hair"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l18 -16 l2 -24" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="44" cy="-152" r="8" fill="#e07a5f"/>
    <path d="M-22 -104 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- keeper with gloves -->
  <g transform="translate(700 562)"><use href="#m" color="#1f6f78"/><use href="#hair"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-20 -14 l-4 -22" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="-56" y="-158" width="20" height="22" rx="8" fill="#e0a33a"/>
    <path d="M22 -104 l8 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="22" y="-74" width="20" height="22" rx="8" fill="#e0a33a"/>
  </g>
  <!-- bench + nodding player -->
  <rect x="790" y="500" width="150" height="14" rx="4" fill="#8a6d5a"/><rect x="800" y="514" width="10" height="46" fill="#6b5446"/><rect x="920" y="514" width="10" height="46" fill="#6b5446"/>
  <g transform="translate(860 560)"><use href="#sit" color="#1f6f78"/><use href="#hair"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -100 l-4 36 M22 -100 l4 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M836 400 q-6 10 0 20 M884 400 q6 10 0 20" stroke="#e0a33a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- kit bag -->
  <rect x="560" y="520" width="90" height="40" rx="16" fill="#7a4e7e"/><path d="M580 520 q25 -18 50 0" stroke="#5f3c63" stroke-width="5" fill="none"/>
  <!-- bubbles -->
  <rect x="60" y="150" width="120" height="80" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M130 230 l6 140" stroke="#cbbfa9" stroke-width="0"/><path d="M128 230 l10 30 l14 -30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M130 228 h20" stroke="#fff" stroke-width="5"/>
  <rect x="104" y="164" width="32" height="52" rx="3" fill="#cbb07a"/><path d="M110 180 l10 8 l-6 10 M124 200 l-6 10" stroke="#8a6d5a" stroke-width="2.5" fill="none"/>
  <rect x="200" y="250" width="110" height="80" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M270 330 l10 34 l12 -34" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M272 328 h18" stroke="#fff" stroke-width="5"/>
  <path d="M255 262 q-22 30 0 44 q22 -14 0 -44 z" fill="#5b9bd5"/>
  <rect x="690" y="200" width="120" height="84" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M700 284 l-4 38 l24 -38" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M702 282 h16" stroke="#fff" stroke-width="5"/>
  <circle cx="736" cy="242" r="20" fill="#e07a5f"/><path d="M722 236 q14 10 28 0" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M710 222 a32 32 0 0 1 20 -12" stroke="#7a4e7e" stroke-width="3" fill="none" marker-end="url(#ah)"/>
  <text x="784" y="256" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">?</text>
  <!-- arrows into the plan -->
  <g stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8">
    <path d="M182 180 C250 150 320 160 352 168" marker-end="url(#ah)"/>
    <path d="M312 280 C380 270 440 250 466 206" marker-end="url(#ah)"/>
    <path d="M690 230 C650 210 620 200 606 190" marker-end="url(#ah)"/>
  </g>
</svg>
