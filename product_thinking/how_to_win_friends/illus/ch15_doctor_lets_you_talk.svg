  <path d="M164 236 q36 40 72 0" stroke="#e0a33a" stroke-width="8" fill="none" stroke-dasharray="1 10" stroke-linecap="round"/><path d="M168 232 q32 34 64 0" stroke="#3f9a5a" stroke-width="3" fill="none"/><circle cx="200" cy="270" r="9" fill="#e07a5f"/>
  <use href="#b" transform="translate(320 170)"/>
  <path d="M332 140 a30 30 0 1 0 14 52 a24 24 0 1 1 -14 -52 z" fill="#e0a33a"/><circle cx="300" cy="150" r="2.5" fill="#e0a33a"/><circle cx="296" cy="186" r="2" fill="#e0a33a"/>
  <use href="#b" transform="translate(450 120)"/>
  <rect x="418" y="94" width="64" height="24" rx="4" fill="#e3dccd"/><path d="M424 112 h52" stroke="#9a9590" stroke-width="2"/>
  <path d="M424 126 l-4 8 M440 126 l-2 8 M456 126 l0 8 M472 126 l2 8" stroke="#5b9bd5" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="434" cy="150" r="9" fill="#b07850"/><path d="M425 148 a9 9 0 0 1 18 0 z" fill="#8f8a85"/><text x="466" y="160" text-anchor="middle" font-size="24" font-weight="800" fill="#7a4e7e">?</text>
  <use href="#b" transform="translate(580 120)"/>
  <path d="M556 106 h40 v26 a20 20 0 0 1 -40 0 z" fill="#c98a2a"/><path d="M596 114 q14 0 14 10 q0 10 -14 8" stroke="#c98a2a" stroke-width="5" fill="none"/>
  <path d="M566 96 q-4 -10 2 -16 M580 96 q-4 -10 2 -16" stroke="#cbbfa9" stroke-width="3" fill="none"/>
  <path d="M600 92 q14 -14 22 0 q-12 8 -22 0 z" fill="#3f9a5a"/><circle cx="550" cy="140" r="6" fill="#e3c9a0"/>
  <circle cx="660" cy="150" r="16" fill="#fff" stroke="#cbbfa9" stroke-width="2" stroke-dasharray="4 4"/>
  <g stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 6"><path d="M240 228 L276 196"/><path d="M364 152 L406 134"/><path d="M496 120 L534 120"/><path d="M626 132 L644 142"/></g>
