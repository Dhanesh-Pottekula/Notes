  <rect x="470" y="352" width="54" height="48" rx="6" fill="#3d3a3a"/><circle cx="497" cy="372" r="12" fill="#fff"/><path d="M497 372 l6 -6" stroke="#e07a5f" stroke-width="2.5"/>
  <path d="M760 400 q-10 -36 14 -40 q24 4 14 40" stroke="#3d3a3a" stroke-width="4" fill="none"/><circle cx="774" cy="398" r="7" fill="#9a9590"/>
  <path d="M546 362 h28 l-14 18 l14 18 h-28 l14 -18 z" fill="#f6dca5"/><path d="M546 366 h28 l-14 14 z" fill="#e0a33a"/><path d="M544 362 h32 M544 398 h32" stroke="#6b5446" stroke-width="4" stroke-linecap="round"/>
