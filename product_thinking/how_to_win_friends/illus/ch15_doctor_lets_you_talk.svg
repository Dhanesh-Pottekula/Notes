<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A family doctor listens with her pen down while a patient tells the whole story of his cough</title>
  <defs>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/><rect x="3" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/>
      <rect x="-22" y="-66" width="44" height="22" rx="9" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="b"><circle r="46" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="790" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LISTEN FIRST</text>
  <!-- cupboard + calendar -->
  <rect x="800" y="150" width="130" height="410" rx="6" fill="#8a6d5a"/><rect x="812" y="420" width="106" height="120" rx="4" fill="#6b5446"/><rect x="812" y="162" width="50" height="110" fill="#d6e4ea"/><rect x="868" y="162" width="50" height="110" fill="#d6e4ea"/>
  <g fill="#e07a5f"><rect x="818" y="236" width="12" height="30" rx="3"/><rect x="836" y="244" width="12" height="22" rx="3"/></g><g fill="#1f6f78"><rect x="876" y="238" width="14" height="28" rx="3"/><rect x="896" y="230" width="14" height="36" rx="3"/></g>
  <path d="M812 220 h50 M868 220 h50" stroke="#8a6d5a" stroke-width="4"/>
  <!-- doctor seated behind desk -->
  <g transform="translate(700 482) scale(1.3)">
    <path d="M-30 -60 v-42 a30 26 0 0 1 60 0 v42 z" fill="#ffffff"/>
    <path d="M-10 -124 l10 28 l10 -28 z" fill="#e0a33a"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 v8 h-5 v-4 q-14 -8 -28 0 v4 h-5 z" fill="#8f8a85"/><circle cx="0" cy="-168" r="9" fill="#8f8a85"/>
    <circle cx="-7" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="7" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-6 -134 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-28 -100 l-6 34 l30 0 M28 -100 l6 34 l-30 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- desk -->
  <rect x="440" y="400" width="400" height="16" rx="3" fill="#6b5446"/><rect x="452" y="416" width="376" height="144" fill="#8a6d5a"/>
  <path d="M452 460 H828" stroke="#6b5446" stroke-width="3"/>
