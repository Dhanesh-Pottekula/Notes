    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="4" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="14" cy="-150" r="2.5" fill="#2e2a2a"/><ellipse cx="10" cy="-137" rx="5" ry="4" fill="#2e2a2a"/>
    <path d="M22 -104 l30 -14 l14 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -104 l-22 -16 l-4 -24" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- chain of story bubbles -->
  <circle cx="276" cy="338" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="254" cy="312" r="11" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
