<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Over tea and murukku a young man asks the bride's grandfather about his first loom and listens for forty minutes</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/><rect x="3" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/>
      <rect x="-22" y="-66" width="44" height="22" rx="9" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- clock -->
  <circle cx="110" cy="110" r="36" fill="#fff" stroke="#6b5446" stroke-width="5"/>
  <path d="M110 110 V80 A30 30 0 1 1 84 125 z" fill="#f6dca5"/><path d="M110 110 v-26 M110 110 l-20 10" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <text x="166" y="120" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">40 MIN</text>
  <!-- framed photo -->
  <rect x="300" y="80" width="110" height="84" rx="4" fill="#8a6d5a"/><rect x="310" y="90" width="90" height="64" fill="#e3dccd"/>
  <path d="M322 146 v-44 h66 v44 M332 106 v36 M344 106 v36 M356 106 v36 M368 106 v36 M378 106 v36" stroke="#6b5446" stroke-width="3" fill="none"/>
  <!-- sofa with family -->
  <rect x="50" y="410" width="360" height="80" rx="18" fill="#7a4e7e" opacity=".5"/><rect x="40" y="470" width="380" height="52" rx="14" fill="#9a7a9e"/>
  <rect x="52" y="522" width="14" height="38" fill="#6b5446"/><rect x="394" y="522" width="14" height="38" fill="#6b5446"/>
  <circle cx="90" cy="440" r="18" fill="#e0a33a" opacity=".8"/><circle cx="370" cy="440" r="18" fill="#1f6f78" opacity=".6"/>
  <g transform="translate(120 560)"><use href="#sit" color="#1f6f78"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#8f8a85"/>
    <path d="M-9 -146 q3 -3 6 0 M3 -146 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -100 l-4 36 M22 -100 l4 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(210 560)"><use href="#sit" color="#e0a33a"/>
    <path d="M-26 -60 h52 l4 14 h-60 z" fill="#e0a33a"/><path d="M-24 -110 l40 -16 l10 10 l-30 26 v30 h-20 z" fill="#c98a2a"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-160" r="8" fill="#2e2a2a"/>
    <path d="M-9 -146 q3 -3 6 0 M3 -146 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -100 l-4 36 M22 -100 l4 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(330 560) scale(1.1) rotate(6 0 -60)"><use href="#sit" color="#7a4e7e"/>
    <path d="M-24 -60 h48 v14 h-48 z" fill="#7a4e7e"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="4" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="14" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M2 -137 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -100 l30 22" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M52 -84 h18 v14 a9 9 0 0 1 -18 0 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
    <path d="M-22 -100 l-4 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- tea table -->
  <ellipse cx="530" cy="560" rx="90" ry="7" fill="#000" opacity=".08"/>
  <rect x="450" y="476" width="160" height="12" rx="4" fill="#6b5446"/><rect x="462" y="488" width="10" height="70" fill="#6b5446"/><rect x="588" y="488" width="10" height="70" fill="#6b5446"/>
  <path d="M470 476 h20 v-16 h-20 z M574 476 h20 v-16 h-20 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <ellipse cx="532" cy="474" rx="30" ry="6" fill="#b8bec2"/>
  <g fill="none" stroke="#c98a2a" stroke-width="4"><circle cx="520" cy="466" r="7"/><circle cx="536" cy="464" r="7"/><circle cx="546" cy="469" r="6"/></g>
  <!-- armchair + grandfather -->
  <rect x="680" y="400" width="190" height="100" rx="20" fill="#8a6d5a"/><rect x="666" y="470" width="218" height="54" rx="14" fill="#a8846c"/>
  <rect x="680" y="524" width="14" height="36" fill="#6b5446"/><rect x="856" y="524" width="14" height="36" fill="#6b5446"/>
  <g transform="translate(775 560) scale(1.15) rotate(-6 0 -60)"><use href="#sit" color="#ffffff"/>
    <rect x="-22" y="-66" width="44" height="66" rx="8" fill="#ffffff"/>
    <path d="M-19 -150 a19 19 0 0 1 4 -12 M19 -150 a19 19 0 0 0 -4 -12" stroke="#e3dccd" stroke-width="7" fill="none" stroke-linecap="round"/>
    <rect x="-16" y="-156" width="13" height="10" rx="3" fill="none" stroke="#2e2a2a" stroke-width="3"/><rect x="-1" y="-156" width="13" height="10" rx="3" fill="none" stroke="#2e2a2a" stroke-width="3"/>
    <path d="M-12 -138 q8 8 16 0 z" fill="#2e2a2a"/>
    <path d="M-22 -104 l-30 -10 l-14 -26" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l26 -14 l6 -28" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M700 330 l-12 -6 M694 344 l-14 0 M856 316 l12 -8 M862 332 l14 -2" stroke="#e0a33a" stroke-width="3" stroke-linecap="round"/>
  <!-- story bubble -->
  <rect x="460" y="60" width="470" height="210" rx="30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M760 270 l4 34 l22 -34" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M762 268 h22" stroke="#fff" stroke-width="5"/>
  <!-- handloom -->
  <g transform="translate(540 200)">
    <path d="M-50 0 v-110 M50 0 v-110 M-56 -110 h112 M-56 -30 h112" stroke="#8a6d5a" stroke-width="7" stroke-linecap="round"/>
    <path d="M-36 -104 v70 M-24 -104 v70 M-12 -104 v70 M0 -104 v70 M12 -104 v70 M24 -104 v70 M36 -104 v70" stroke="#cbbfa9" stroke-width="2"/>
    <rect x="-44" y="-62" width="88" height="22" fill="#e07a5f"/><path d="M-44 -50 h88" stroke="#e0a33a" stroke-width="3"/>
  </g>
  <text x="546" y="238" text-anchor="middle" font-size="23" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE LOOM</text>
  <path d="M606 150 h34" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
  <!-- flood -->
  <g transform="translate(700 200)">
    <path d="M-30 -40 v-34 l30 -24 l30 24 v34 z" fill="#b9ad98"/><rect x="-8" y="-60" width="16" height="20" fill="#8a6d5a"/>
    <path d="M-50 -46 q12 -10 25 0 t25 0 t25 0 t25 0 M-50 -28 q12 -10 25 0 t25 0 t25 0 t25 0" stroke="#5b9bd5" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M762 150 h34" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
  <!-- lorry -->
  <g transform="translate(860 200)">
    <rect x="-56" y="-70" width="70" height="44" rx="4" fill="#1f6f78"/><path d="M14 -60 h22 l14 18 v16 h-36 z" fill="#185a61"/><rect x="20" y="-56" width="14" height="12" fill="#d6e4ea"/>
    <circle cx="-38" cy="-24" r="10" fill="#3d3a3a"/><circle cx="34" cy="-24" r="10" fill="#3d3a3a"/>
    <rect x="-52" y="-96" width="30" height="26" rx="4" fill="#e3dccd"/><rect x="-20" y="-96" width="30" height="26" rx="4" fill="#e0a33a"/><rect x="-38" y="-118" width="30" height="22" rx="4" fill="#e07a5f"/>
  </g>
</svg>
