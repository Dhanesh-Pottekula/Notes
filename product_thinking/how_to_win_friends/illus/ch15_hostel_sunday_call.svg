<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two Sunday calls to a hostel student: a list of instructions gets a five-minute all fine, one quiet question opens an hour-long talk</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/><rect x="3" y="-48" width="14" height="48" rx="6" fill="#4a3f55"/>
      <rect x="-22" y="-66" width="44" height="22" rx="9" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
    </g>
    <g id="bunk"><path d="M0 0 V-230 M100 0 V-230" stroke="#6b5446" stroke-width="8"/><rect x="0" y="-150" width="100" height="16" fill="#8a6d5a"/><rect x="0" y="-40" width="100" height="16" fill="#8a6d5a"/><rect x="4" y="-166" width="92" height="16" rx="6" fill="#1f6f78" opacity=".6"/><rect x="4" y="-56" width="92" height="16" rx="6" fill="#e0a33a" opacity=".6"/></g>
    <g id="chair"><rect x="-30" y="-56" width="60" height="10" rx="3" fill="#8a6d5a"/><path d="M-26 -46 v46 M26 -46 v46" stroke="#6b5446" stroke-width="6"/><path d="M-30 -56 v-60" stroke="#6b5446" stroke-width="6"/></g>
    <g id="dad">
      <circle r="62" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
      <path d="M-30 60 v-30 a30 26 0 0 1 60 0 v30 z" fill="#1f6f78"/>
      <circle cx="0" cy="-12" r="22" fill="#b07850"/><path d="M-22 -16 a22 22 0 0 1 44 0 q-22 -12 -44 0 z" fill="#8f8a85"/>
      <rect x="-12" y="-14" width="24" height="7" rx="3" fill="none" stroke="#2e2a2a" stroke-width="2"/>
      <rect x="18" y="-14" width="10" height="20" rx="3" fill="#3d3a3a"/>
    </g>
    <g id="cl"><circle r="24" fill="#fff" stroke="#6b5446" stroke-width="4"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 20 V620" stroke="#d8cdb8" stroke-width="3"/>
  <text x="300" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LECTURE</text>
  <text x="780" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LISTEN</text>

  <!-- LEFT -->
  <use href="#bunk" transform="translate(360 560)"/>
  <use href="#dad" transform="translate(100 150)"/>
  <ellipse cx="100" cy="150" rx="7" ry="5" fill="#2e2a2a"/>
  <!-- stream of instructions -->
  <g>
    <circle cx="200" cy="140" r="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><ellipse cx="200" cy="144" rx="16" ry="6" fill="#b8bec2"/><circle cx="196" cy="140" r="5" fill="#f3e3b0"/><circle cx="206" cy="141" r="4" fill="#e0a33a"/>
    <circle cx="250" cy="196" r="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><rect x="236" y="187" width="28" height="18" rx="2" fill="#3f9a5a"/><circle cx="250" cy="196" r="5" fill="#fff"/>
    <circle cx="290" cy="254" r="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><rect x="278" y="240" width="24" height="28" rx="2" fill="#7a4e7e"/><rect x="282" y="244" width="16" height="4" fill="#fff"/>
    <circle cx="316" cy="316" r="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><rect x="304" y="302" width="24" height="28" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="316" cy="318" r="7" fill="none" stroke="#e07a5f" stroke-width="3"/>
    <path d="M168 154 L176 146 M222 156 L232 176 M266 214 L276 230 M302 274 L308 290" stroke="#7a4e7e" stroke-width="3"/>
  </g>
  <!-- slouched student -->
  <use href="#chair" transform="translate(300 560)"/>
  <g transform="translate(300 540) scale(1.1)"><use href="#sit" color="#9a9590"/>
    <g transform="rotate(14 0 -134)"><circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-10 -146 h7 M3 -146 h7" stroke="#2e2a2a" stroke-width="3"/><path d="M-4 -136 h8" stroke="#2e2a2a" stroke-width="2.5"/></g>
    <path d="M-22 -104 l-12 34 M22 -104 l14 -10 l2 -30" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="-160" width="10" height="20" rx="3" fill="#3d3a3a" transform="rotate(14 0 -134)"/>
  </g>
  <rect x="166" y="360" width="104" height="38" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M256 392 l18 12 l-6 -16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="218" y="386" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b">ALL FINE</text>
  <use href="#cl" transform="translate(120 480)"/><path d="M120 480 V456 A24 24 0 0 1 132 459 z" fill="#e07a5f"/>

  <!-- RIGHT -->
  <use href="#bunk" transform="translate(846 560)"/>
  <use href="#dad" transform="translate(580 150)"/>
  <path d="M572 152 q8 5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <rect x="650" y="96" width="44" height="40" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><text x="672" y="126" text-anchor="middle" font-size="26" font-weight="800" fill="#7a4e7e">?</text>
  <!-- upright talking student -->
  <use href="#chair" transform="translate(780 560)"/>
  <g transform="translate(780 540) scale(1.1)"><use href="#sit" color="#9a9590"/>
    <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-148" r="2.5" fill="#2e2a2a"/><ellipse cx="0" cy="-136" rx="4" ry="3.5" fill="#2e2a2a"/>
    <path d="M22 -104 l12 -16 l-10 -30" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="16" y="-168" width="10" height="20" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -104 l-26 -10 l-10 -18" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- big bubble with three worries -->
  <rect x="640" y="200" width="290" height="120" rx="28" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M760 320 l6 30 l18 -30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M762 318 h20" stroke="#fff" stroke-width="5"/>
  <g><rect x="664" y="262" width="34" height="12" rx="3" fill="#1f6f78"/><rect x="712" y="262" width="34" height="12" rx="3" fill="#e07a5f"/><path d="M706 230 l-8 16 h12 l-8 16" stroke="#e0a33a" stroke-width="4" fill="none" stroke-linejoin="round"/></g>
  <g><rect x="770" y="234" width="40" height="50" rx="3" fill="#7a4e7e"/><rect x="776" y="240" width="28" height="6" fill="#fff"/><text x="790" y="278" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">?</text></g>
  <g><path d="M846 284 v-30 l26 -20 l26 20 v30 z" fill="#b9ad98"/><path d="M872 276 c-6 -8 -16 -2 -10 6 l10 10 l10 -10 c6 -8 -4 -14 -10 -6 z" fill="#e07a5f"/></g>
  <use href="#cl" transform="translate(620 480)"/><circle cx="620" cy="480" r="20" fill="#e07a5f"/>
</svg>
