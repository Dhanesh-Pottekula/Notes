<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A saree seller with a sore throat only unfolds sarees and smiles while the customer's aunt praises the zari and convinces the family</title>
  <defs>
    <g id="cx">
      <ellipse cx="0" cy="4" rx="50" ry="7" fill="#000" opacity=".08"/>
      <path d="M-24 -18 v-40 a24 24 0 0 1 48 0 v40 z" fill="currentColor"/>
      <rect x="-6" y="-92" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-106" r="19" fill="#c98a5e"/>
    </g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- shelves of folded sarees -->
  <rect x="30" y="80" width="430" height="230" fill="#8a6d5a"/>
  <g fill="#6b5446"><rect x="30" y="150" width="430" height="8"/><rect x="30" y="230" width="430" height="8"/></g>
  <g>
    <rect x="44" y="94" width="70" height="20" rx="3" fill="#7a4e7e"/><rect x="44" y="116" width="70" height="20" rx="3" fill="#1f6f78"/><rect x="124" y="94" width="70" height="20" rx="3" fill="#e07a5f"/><rect x="124" y="116" width="70" height="20" rx="3" fill="#e0a33a"/><rect x="204" y="94" width="70" height="20" rx="3" fill="#3f9a5a"/><rect x="204" y="116" width="70" height="20" rx="3" fill="#b0306a"/><rect x="284" y="94" width="70" height="20" rx="3" fill="#1f6f78"/><rect x="284" y="116" width="70" height="20" rx="3" fill="#7a4e7e"/><rect x="364" y="94" width="80" height="20" rx="3" fill="#e0a33a"/><rect x="364" y="116" width="80" height="20" rx="3" fill="#e07a5f"/>
    <rect x="44" y="174" width="70" height="20" rx="3" fill="#e0a33a"/><rect x="44" y="196" width="70" height="20" rx="3" fill="#b0306a"/><rect x="124" y="174" width="70" height="20" rx="3" fill="#1f6f78"/><rect x="124" y="196" width="70" height="20" rx="3" fill="#7a4e7e"/><rect x="204" y="174" width="70" height="20" rx="3" fill="#e07a5f"/><rect x="204" y="196" width="70" height="20" rx="3" fill="#3f9a5a"/><rect x="284" y="174" width="70" height="20" rx="3" fill="#e0a33a"/><rect x="284" y="196" width="70" height="20" rx="3" fill="#1f6f78"/><rect x="364" y="174" width="80" height="20" rx="3" fill="#7a4e7e"/><rect x="364" y="196" width="80" height="20" rx="3" fill="#e0a33a"/>
    <g stroke="#e8c66a" stroke-width="2"><path d="M44 112 h400 M44 134 h400 M44 192 h400 M44 214 h400"/></g>
  </g>
  <!-- white sheet platform -->
  <rect x="20" y="420" width="920" height="140" rx="10" fill="#ffffff"/><path d="M20 540 H940" stroke="#e3dccd" stroke-width="3"/>
  <!-- light from doorway -->
  <path d="M960 80 L700 420 H900 L960 300 z" fill="#f6dca5" opacity=".35"/>
  <text x="720" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">THEY SELL IT</text>
  <!-- seller cross-legged -->
  <g transform="translate(200 520) scale(1.2)"><use href="#cx" color="#cfe0e6"/>
    <ellipse cx="0" cy="-10" rx="46" ry="14" fill="#d8cdb8"/>
    <path d="M-16 -92 q16 14 32 0 l4 12 q-20 14 -40 0 z" fill="#1f6f78"/><path d="M10 -84 l8 34 l-10 0 z" fill="#1f6f78"/>
    <path d="M-19 -110 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-12 -110 q4 -4 8 0 M4 -110 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-7 -98 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -62 l40 10 M-22 -62 l-10 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- unfolded magenta saree -->
  <path d="M256 546 L282 496 H414 L436 546 z" fill="#b0306a"/>
  <path d="M256 546 L264 530 H428 L436 546 z" fill="#e0a33a"/>
  <path d="M276 520 H418" stroke="#e0a33a" stroke-width="3"/><path d="M282 496 q-8 -10 2 -18 h40 l-8 18 z" fill="#c74a82"/>
  <!-- seller's empty, silent bubble -->
  <rect x="150" y="300" width="80" height="48" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M164 324 h52" stroke="#9a9590" stroke-width="3"/><path d="M168 318 v12 M178 318 v12 M188 318 v12 M198 318 v12 M208 318 v12" stroke="#9a9590" stroke-width="2"/>
  <!-- fanned sarees foreground -->
  <path d="M440 548 l40 -36 h70 l-30 36 z" fill="#1f6f78"/><path d="M500 548 l30 -36 h70 l-20 36 z" fill="#e07a5f"/><path d="M440 548 h140" stroke="#e0a33a" stroke-width="4"/>
  <!-- aunt holding saree to light -->
  <g transform="translate(640 520) scale(1.2)"><use href="#cx" color="#1f6f78"/>
    <ellipse cx="0" cy="-10" rx="46" ry="14" fill="#1f6f78"/><path d="M-24 -60 l40 -18 l10 10 l-30 28 v22 h-20 z" fill="#185a61"/>
    <path d="M-19 -110 a19 19 0 0 1 38 0 z" fill="#e3dccd"/><circle cx="-12" cy="-122" r="8" fill="#e3dccd"/>
    <circle cx="-1" cy="-106" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="13" cy="-106" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <ellipse cx="6" cy="-94" rx="5" ry="4" fill="#2e2a2a"/>
    <path d="M22 -62 l26 -30 l6 -40" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -62 l-20 20" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M700 352 q14 60 -10 120 l-26 10 q24 -70 14 -128 z" fill="#b0306a"/><path d="M700 352 q14 60 -10 120 l-6 2 q20 -64 8 -122 z" fill="#e0a33a"/>
  <g fill="#fff6c8"><circle cx="716" cy="378" r="4"/><circle cx="722" cy="408" r="3"/><circle cx="712" cy="438" r="3"/></g>
  <!-- bride-to-be and mother leaning in -->
  <g transform="translate(780 520) scale(1.05) rotate(-6)"><use href="#cx" color="#e07a5f"/>
    <ellipse cx="0" cy="-10" rx="40" ry="13" fill="#e07a5f"/>
    <path d="M-19 -110 a19 19 0 0 1 38 0 v22 h-6 v-18 q-13 -6 -26 0 v18 h-6 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-106" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-106" r="2.5" fill="#2e2a2a"/><path d="M-6 -96 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(880 520) scale(1.1) rotate(-8)"><use href="#cx" color="#e0a33a"/>
    <ellipse cx="0" cy="-10" rx="42" ry="13" fill="#e0a33a"/><path d="M-24 -60 l40 -18 l10 10 l-30 28 v22 h-20 z" fill="#c98a2a"/>
    <path d="M-19 -110 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="12" cy="-122" r="8" fill="#2e2a2a"/>
    <circle cx="-7" cy="-106" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-106" r="2.5" fill="#2e2a2a"/><path d="M-6 -96 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <!-- aunt's speech bubble: zari close-up + tick -->
  <rect x="500" y="110" width="250" height="160" rx="28" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M610 270 l2 34 l26 -34" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M612 268 h24" stroke="#fff" stroke-width="5"/>
  <rect x="524" y="140" width="150" height="100" rx="8" fill="#b0306a"/><rect x="524" y="196" width="150" height="44" fill="#e0a33a"/>
  <path d="M530 218 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12 l12 12 l12 -12" stroke="#fff6c8" stroke-width="3" fill="none"/>
  <use href="#tick" transform="translate(712 160)"/>
  <!-- small faded other-shop bubble -->
  <g opacity=".6"><rect x="780" y="140" width="130" height="96" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M810 214 v-34 l30 -18 l30 18 v34 z" fill="#b9ad98"/><rect x="830" y="190" width="20" height="24" fill="#8a6d5a"/>
  <circle cx="888" cy="166" r="14" fill="#e07a5f"/><path d="M882 160 l12 12 M894 160 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/></g>
  <path d="M752 196 L776 192" stroke="#cbbfa9" stroke-width="2"/>
</svg>
