<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>In a family chat group, the aunt who posts only her son's wins gets thumbs-ups and is muted; the aunt who asks about everyone gets the replies and calls</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="th"><rect x="-14" y="-12" width="28" height="24" rx="8" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><path d="M-7 8 v-8 h3 l4 -8 q3 0 2 5 l-1 3 h6 q2 1 1 4 l-2 4 z" fill="#e0a33a"/></g>
    <g id="out"><rect x="-56" y="-20" width="112" height="40" rx="12" fill="#d7ecd9"/></g>
    <g id="hrt"><path d="M0 -4 c-4 -6 -12 -2 -8 4 l8 8 l8 -8 c4 -6 -4 -10 -8 -4 z" fill="#e07a5f"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 20 V620" stroke="#d8cdb8" stroke-width="3"/>
  <text x="300" y="56" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ABOUT ME</text>
  <text x="770" y="56" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ABOUT YOU</text>

  <!-- LEFT phone -->
  <rect x="190" y="84" width="220" height="420" rx="28" fill="#3d3a3a"/><rect x="202" y="110" width="196" height="370" rx="10" fill="#fbf7ee"/>
  <rect x="202" y="110" width="196" height="34" rx="10" fill="#1f6f78"/><circle cx="222" cy="127" r="9" fill="#fff" opacity=".7"/><path d="M240 127 h70" stroke="#fff" stroke-width="5" opacity=".7" stroke-linecap="round"/>
  <g>
    <use href="#out" transform="translate(326 172)"/><path d="M308 172 l18 -10 l18 10 l-18 10 z" fill="#2e2a2a"/><path d="M340 174 v10" stroke="#2e2a2a" stroke-width="3"/>
    <use href="#th" transform="translate(228 206)"/>
    <use href="#out" transform="translate(326 248)" opacity=".9"/><path d="M300 250 l50 -10 l-10 8 l-14 2 l-6 10 z" fill="#5b9bd5"/>
    <use href="#th" transform="translate(228 282)" opacity=".85"/>
    <g opacity=".75"><use href="#out" transform="translate(326 324)"/><path d="M302 332 v-8 q4 -10 14 -10 h20 q8 0 12 10 v8 z" fill="#e07a5f"/><circle cx="312" cy="334" r="5" fill="#3d3a3a"/><circle cx="340" cy="334" r="5" fill="#3d3a3a"/></g>
    <use href="#th" transform="translate(228 358)" opacity=".6"/>
    <g opacity=".55"><use href="#out" transform="translate(326 400)"/><path d="M314 388 h24 v8 a12 12 0 0 1 -24 0 z" fill="#e0a33a"/><rect x="322" y="404" width="8" height="8" fill="#e0a33a"/><rect x="316" y="410" width="20" height="4" fill="#e0a33a"/></g>
    <use href="#th" transform="translate(228 434)" opacity=".45"/>
  </g>
  <!-- muted bell -->
  <g transform="translate(436 200)"><path d="M-14 10 v-14 a14 14 0 0 1 28 0 v14 l5 5 h-38 z" fill="#9a9590"/><circle cy="20" r="4" fill="#9a9590"/><path d="M-18 -18 l36 40" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/></g>
  <!-- proud aunt -->
  <g transform="translate(110 566) scale(1.15)"><use href="#m" color="#e0a33a"/>
    <path d="M-28 -60 h56 l6 60 h-68 z" fill="#e0a33a"/><path d="M-26 -100 l40 -24 l14 10 l-28 30 l4 84 h-30 z" fill="#c98a2a"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-160" r="8" fill="#2e2a2a"/>
    <circle cx="-2" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="10" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-2 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l30 -20 l14 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="44" cy="-118" r="5" fill="none" stroke="#e0a33a" stroke-width="3"/>
    <path d="M-22 -104 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- RIGHT phone -->
  <rect x="660" y="84" width="220" height="420" rx="28" fill="#3d3a3a"/><rect x="672" y="110" width="196" height="370" rx="10" fill="#fbf7ee"/>
  <rect x="672" y="110" width="196" height="34" rx="10" fill="#1f6f78"/><circle cx="692" cy="127" r="9" fill="#fff" opacity=".7"/><path d="M710 127 h70" stroke="#fff" stroke-width="5" opacity=".7" stroke-linecap="round"/>
  <use href="#out" transform="translate(796 172)"/><rect x="766" y="160" width="20" height="24" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/><text x="816" y="182" text-anchor="middle" font-size="24" font-weight="800" fill="#7a4e7e">?</text>
  <rect x="684" y="196" width="120" height="36" rx="12" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><rect x="692" y="202" width="34" height="24" rx="3" fill="#9cc8d6"/><path d="M692 226 l12 -12 l10 8 l12 -10 v14 z" fill="#3f9a5a"/><use href="#hrt" transform="translate(748 214)"/><use href="#hrt" transform="translate(772 214)"/>
  <rect x="684" y="240" width="100" height="30" rx="12" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><use href="#hrt" transform="translate(704 254)"/><path d="M718 255 h52" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/>
  <use href="#out" transform="translate(796 296)"/><path d="M766 306 v-14 l14 -10 l14 10 v14 z" fill="#b9ad98"/><rect x="800" y="288" width="20" height="14" rx="3" fill="#3d3a3a"/><circle cx="810" cy="295" r="4" fill="#fff"/><text x="836" y="306" text-anchor="middle" font-size="22" font-weight="800" fill="#7a4e7e">?</text>
  <rect x="684" y="328" width="120" height="36" rx="12" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><rect x="692" y="334" width="34" height="24" rx="3" fill="#ecc3a0"/><path d="M698 356 v-12 l11 -8 l11 8 v12 z" fill="#e07a5f"/><use href="#hrt" transform="translate(752 346)"/>
  <rect x="684" y="372" width="140" height="30" rx="12" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><path d="M698 387 h80" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/><use href="#hrt" transform="translate(800 386)"/>
  <!-- incoming call -->
  <rect x="690" y="418" width="160" height="48" rx="16" fill="#3f9a5a"/><path d="M712 432 q-4 12 8 20 l6 -6 l-6 -6 l-4 2 q-4 -4 -4 -8 l2 -4 l-6 -6 z" fill="#fff"/>
  <circle cx="790" cy="442" r="12" fill="#fff" opacity=".9"/><circle cx="820" cy="442" r="12" fill="#fff" opacity=".6"/>
  <path d="M890 110 q20 20 0 40 M904 98 q34 32 0 64 M650 110 q-20 20 0 40" stroke="#3f9a5a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- relative faces floating -->
  <g><circle cx="912" cy="260" r="16" fill="#d9a27a"/><path d="M896 258 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/><circle cx="912" cy="320" r="16" fill="#b07850"/><path d="M896 318 a16 16 0 0 1 32 0 z" fill="#8f8a85"/><circle cx="912" cy="380" r="16" fill="#c98a5e"/><path d="M896 378 a16 16 0 0 1 32 0 v10 h-5 v-8 q-11 -6 -22 0 v8 h-5 z" fill="#2e2a2a"/></g>
  <!-- warm aunt -->
  <g transform="translate(580 566) scale(1.15)"><use href="#m" color="#1f6f78"/>
    <path d="M-28 -60 h56 l6 60 h-68 z" fill="#1f6f78"/><path d="M-26 -100 l40 -24 l14 10 l-28 30 l4 84 h-30 z" fill="#185a61"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#e3dccd"/><circle cx="-14" cy="-160" r="8" fill="#e3dccd"/>
    <circle cx="-1" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="13" cy="-148" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-1 -135 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l30 -20 l14 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -104 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
