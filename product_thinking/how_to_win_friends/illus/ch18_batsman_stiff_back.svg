<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A team manager sits with a batsman who has a stiff back and agrees he can rest; after the warm-up the batsman pads up to bat while a TV camera waits</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="head"><rect x="-6" y="-134" width="12" height="10" fill="#b07850"/><circle cx="0" cy="-148" r="19" fill="#b07850"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><path d="M-15 -142 q15 26 30 0 v6 q-15 20 -30 0 z" fill="#2e2a2a"/><circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/></g>
    <g id="mgr">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#1f6f78"/><path d="M-8 -124 l8 26 l8 -26 z" fill="#fff"/>
      <path d="M12 -96 l3 6 l6 1 l-5 4 l1 6 l-5 -3 l-5 3 l1 -6 l-5 -4 l6 -1 z" fill="#e0a33a"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -154 a19 14 0 0 1 38 0 z" fill="#8f8a85"/>
      <g fill="none" stroke="#2e2a2a" stroke-width="2.2"><circle cx="-7" cy="-147" r="5.5"/><circle cx="7" cy="-147" r="5.5"/></g>
      <path d="M-6 -135 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- LEFT hotel room -->
  <rect y="560" width="480" height="80" fill="#d8cdb8"/>
  <rect x="300" y="110" width="140" height="170" rx="4" fill="#8a6d5a"/><rect x="310" y="120" width="120" height="150" fill="#dcebf2"/>
  <path d="M390 270 v-110" stroke="#9a9590" stroke-width="6"/><rect x="372" y="140" width="36" height="24" rx="3" fill="#3d3a3a"/><g fill="#fff2c4"><circle cx="381" cy="148" r="4"/><circle cx="399" cy="148" r="4"/><circle cx="381" cy="157" r="4"/><circle cx="399" cy="157" r="4"/></g>
  <rect x="30" y="460" width="230" height="100" rx="8" fill="#b9ad98"/><rect x="30" y="440" width="230" height="30" rx="8" fill="#ffffff"/><rect x="30" y="380" width="20" height="180" rx="4" fill="#6b5446"/><rect x="50" y="410" width="60" height="30" rx="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="20" y="540" width="20" height="20" fill="#000" opacity="0"/>
  <!-- bedside table -->
  <rect x="272" y="470" width="50" height="90" fill="#8a6d5a"/><rect x="282" y="448" width="14" height="22" rx="3" fill="#cfe3ea"/><rect x="302" y="462" width="16" height="8" rx="2" fill="#3d3a3a"/>
  <!-- batsman on bed edge, hunched -->
  <g transform="translate(170 456)">
    <path d="M-20 0 h50 v80 h-14 v-64 h-36 z" fill="#2f3f66"/><rect x="18" y="76" width="22" height="10" rx="4" fill="#fff"/>
    <path d="M-30 4 q-6 -50 10 -96 a24 24 0 0 1 44 12 q-4 40 -6 84 z" fill="#2f3f66" transform="rotate(12 0 0)"/>
    <path d="M-6 -60 l4 50" stroke="#e0a33a" stroke-width="4" transform="rotate(12 0 0)"/>
    <g transform="rotate(16 0 -100) translate(4 22)"><use href="#head"/></g>
    <path d="M-12 -144 q-4 -6 4 -10 M2 -142 q6 -6 10 2" stroke="#2e2a2a" stroke-width="2.5" fill="none" transform="rotate(16 0 -100) translate(4 22)"/>
    <path d="M-26 -60 q-20 20 -2 44" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M14 -70 q24 20 10 52" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M-44 -32 l-10 -6 l8 -6 l-12 -6" stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- manager on chair -->
  <rect x="352" y="470" width="80" height="12" rx="3" fill="#6b5446"/><rect x="420" y="400" width="12" height="82" rx="3" fill="#6b5446"/><rect x="356" y="482" width="8" height="78" fill="#6b5446"/><rect x="420" y="482" width="8" height="78" fill="#6b5446"/>
  <g transform="translate(392 538)"><use href="#mgr"/>
    <rect x="-38" y="-72" width="44" height="14" rx="6" fill="#4a3f55"/><rect x="-38" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-22 -104 q-30 0 -46 -22" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 l-6 34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- warm-up arrow across divider -->
  <rect x="438" y="190" width="84" height="56" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="480" cy="220" r="16" fill="#fff" stroke="#3d3a3a" stroke-width="3"/><path d="M480 220 v-10 M480 220 l7 4" stroke="#3d3a3a" stroke-width="2.5" stroke-linecap="round"/><rect x="476" y="198" width="8" height="6" fill="#3d3a3a"/>
  <path d="M380 300 C430 260 530 260 590 300" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>

  <!-- RIGHT nets -->
  <rect x="480" y="470" width="480" height="170" fill="#8fbf7a"/><path d="M480 470 h480" stroke="#7aa866" stroke-width="4"/>
  <path d="M500 470 v-250 M700 470 v-250 M500 220 h200" stroke="#9a9590" stroke-width="5"/>
  <g stroke="#cbbfa9" stroke-width="1.5"><path d="M520 220 v250 M540 220 v250 M560 220 v250 M580 220 v250 M600 220 v250 M620 220 v250 M640 220 v250 M660 220 v250 M680 220 v250"/><path d="M500 250 h200 M500 280 h200 M500 310 h200 M500 340 h200 M500 370 h200 M500 400 h200 M500 430 h200"/></g>
  <path d="M480 560 Q720 520 960 560" stroke="#fff" stroke-width="5" fill="none"/>
  <!-- batsman padded, nodding -->
  <g transform="translate(600 560) scale(1.12)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-18" y="-64" width="16" height="64" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><rect x="2" y="-64" width="16" height="64" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-16 -50 h12 M-16 -36 h12 M-16 -22 h12 M4 -50 h12 M4 -36 h12 M4 -22 h12" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#ffffff"/>
    <use href="#head"/>
    <path d="M-12 -158 l8 2 M12 -158 l-8 2" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M-22 -104 q-26 20 -6 38" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 l16 30" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="-80" width="14" height="30" rx="4" fill="#3d3a3a"/><path d="M37 -52 l12 60" stroke="#e0c08a" stroke-width="16" stroke-linecap="round"/>
  </g>
  <!-- manager nods -->
  <g transform="translate(760 560)"><use href="#mgr"/>
    <path d="M-22 -104 l-8 40 M22 -104 l8 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- TV crew -->
  <g transform="translate(880 560)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#e07a5f"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <rect x="-58" y="-164" width="62" height="40" rx="6" fill="#3d3a3a"/><circle cx="-60" cy="-144" r="12" fill="#5a5250"/><circle cx="-60" cy="-144" r="6" fill="#9fb7c4"/><rect x="-40" y="-176" width="30" height="12" rx="3" fill="#3d3a3a"/>
    <circle cx="-14" cy="-170" r="4" fill="#e07a5f"/>
    <path d="M-22 -104 l-20 -24" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- divider + labels -->
  <path d="M480 24 V180 M480 260 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">HEALTH FIRST</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">I WILL BAT</text>
</svg>
