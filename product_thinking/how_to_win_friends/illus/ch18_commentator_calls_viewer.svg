<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cricket commentator with an inbox of angry mails phones the angriest viewer, who ends up smiling and inviting him to her son's academy</title>
  <defs>
    <g id="env"><rect x="-22" y="-15" width="44" height="30" rx="3" fill="#e07a5f"/><path d="M-22 -15 l22 16 l22 -16" stroke="#fff" stroke-width="2.5" fill="none"/><path d="M-6 9 q6 -5 12 0" stroke="#fff" stroke-width="2" fill="none"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- LEFT: studio office at evening -->
  <rect x="40" y="100" width="190" height="200" rx="6" fill="#6b5446"/><rect x="52" y="112" width="166" height="176" fill="#2f4a6b"/>
  <g fill="#4d6a8c"><rect x="60" y="190" width="26" height="98"/><rect x="92" y="160" width="22" height="128"/><rect x="120" y="200" width="30" height="88"/><rect x="156" y="150" width="24" height="138"/><rect x="186" y="210" width="26" height="78"/></g>
  <g fill="#f2c46a"><rect x="66" y="204" width="5" height="5"/><rect x="98" y="176" width="5" height="5"/><rect x="104" y="200" width="5" height="5"/><rect x="162" y="170" width="5" height="5"/><rect x="168" y="196" width="5" height="5"/><rect x="128" y="214" width="5" height="5"/></g>
  <circle cx="196" cy="136" r="10" fill="#f3ede0"/>
  <!-- desk -->
  <rect x="150" y="420" width="300" height="14" rx="3" fill="#6b5446"/><rect x="170" y="434" width="16" height="126" fill="#6b5446"/><rect x="414" y="434" width="16" height="126" fill="#6b5446"/>
  <!-- laptop overflowing -->
  <path d="M270 420 h150 l-14 -10 h-122 z" fill="#3d3a3a"/><rect x="290" y="300" width="110" height="110" rx="6" fill="#3d3a3a"/><rect x="298" y="308" width="94" height="94" fill="#fbeedb"/>
  <use href="#env" transform="translate(326 334) scale(.6)"/><use href="#env" transform="translate(364 334) scale(.6)"/><use href="#env" transform="translate(326 372) scale(.6)"/><use href="#env" transform="translate(364 372) scale(.6)"/>
  <use href="#env" transform="translate(372 270) rotate(-12)"/><use href="#env" transform="translate(420 236) rotate(10)"/><use href="#env" transform="translate(330 220) rotate(-6)"/><use href="#env" transform="translate(400 180) rotate(-14)"/><use href="#env" transform="translate(440 300) rotate(16)"/>
  <use href="#env" transform="translate(220 408)"/><use href="#env" transform="translate(240 384) rotate(8)"/><use href="#env" transform="translate(436 404) rotate(-6)"/>
  <!-- commentator -->
  <g transform="translate(110 560) scale(1.1)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#2f3f66"/><path d="M-8 -124 l8 30 l8 -30 z" fill="#fff"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#8f8a85"/>
    <path d="M-20 -150 a20 20 0 0 1 40 0" stroke="#3d3a3a" stroke-width="4" fill="none"/><path d="M-20 -128 a20 20 0 0 0 40 0" stroke="#3d3a3a" stroke-width="4" fill="none"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-9 -139 q9 -5 18 0" stroke="#8f8a85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 q-14 30 12 -36" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 l26 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="40" y="-162" width="14" height="26" rx="3" fill="#3d3a3a"/>
  </g>

  <!-- RIGHT: living room -->
  <rect x="560" y="130" width="120" height="150" rx="4" fill="#8a6d5a"/><rect x="570" y="140" width="100" height="130" fill="#e8f1ef"/>
  <rect x="570" y="230" width="100" height="40" fill="#8fbf7a"/>
  <g transform="translate(620 232) scale(.55)"><path d="M-14 -60 v-42 a14 14 0 0 1 28 0 v42 z" fill="#fff"/><rect x="-12" y="-62" width="10" height="62" rx="4" fill="#fff"/><rect x="2" y="-62" width="10" height="62" rx="4" fill="#fff"/><circle cx="0" cy="-122" r="14" fill="#c98a5e"/><path d="M-14 -126 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/><path d="M14 -90 l30 -40" stroke="#e0a33a" stroke-width="8" stroke-linecap="round"/></g>
  <!-- table with flyer -->
  <rect x="800" y="470" width="130" height="10" rx="3" fill="#6b5446"/><rect x="812" y="480" width="10" height="80" fill="#6b5446"/><rect x="908" y="480" width="10" height="80" fill="#6b5446"/>
  <rect x="826" y="452" width="60" height="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="844" cy="461" r="5" fill="#e07a5f"/><path d="M862 468 v-12 M868 468 v-12 M874 468 v-12" stroke="#8a6d5a" stroke-width="2"/>
  <path d="M760 160 v80" stroke="#3d3a3a" stroke-width="3"/><path d="M736 160 h48 l-10 -30 h-28 z" fill="#e0a33a"/><path d="M745 240 h30" stroke="#3d3a3a" stroke-width="5" stroke-linecap="round"/>
  <!-- viewer -->
  <g transform="translate(700 560) scale(1.1)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-26 0 l4 -64 h44 l4 64 z" fill="#1f6f78"/><rect x="-14" y="-40" width="10" height="40" fill="#efe6d6"/><rect x="4" y="-40" width="10" height="40" fill="#efe6d6"/>
    <path d="M-22 -60 v-42 a22 22 0 0 1 44 0 v42 z" fill="#1f6f78"/>
    <path d="M-22 -104 q22 20 44 0" stroke="#e0a33a" stroke-width="6" fill="none"/>
    <rect x="-6" y="-132" width="12" height="10" fill="#d9a27a"/><circle cx="0" cy="-146" r="18" fill="#d9a27a"/>
    <path d="M-19 -146 a19 21 0 0 1 38 0 v14 h-6 v-14 a13 12 0 0 0 -26 0 v14 h-6 z" fill="#2e2a2a"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="-8" cy="-164" r="5"/><circle cx="8" cy="-164" r="5"/></g>
    <path d="M-9 -146 q3 -3 6 0 M3 -146 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-6 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -100 q12 -30 -6 -46" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="12" y="-162" width="12" height="24" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -100 q14 20 18 0" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- bubble heart + bat -->
  <rect x="780" y="230" width="140" height="80" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M790 296 l-40 28 l52 -14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M792 294 l10 14" stroke="#fff" stroke-width="5"/>
  <path d="M820 284 c-22 -14 -18 -32 -4 -32 c6 0 4 6 4 6 c0 0 -2 -6 4 -6 c14 0 18 18 -4 32 z" fill="#e07a5f"/>
  <path d="M870 296 l22 -46" stroke="#8a6d5a" stroke-width="12" stroke-linecap="round"/><path d="M892 250 l6 -12" stroke="#3d3a3a" stroke-width="5" stroke-linecap="round"/>
  <!-- call line -->
  <path d="M180 360 C300 120 560 110 712 360" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
  <circle cx="446" cy="172" r="22" fill="#7a4e7e"/><path d="M436 164 q0 20 20 20 l4 -6 l-7 -5 l-4 4 q-7 -3 -9 -9 l4 -4 l-5 -7 z" fill="#fff"/>
  <!-- divider + labels -->
  <path d="M480 24 V150 M480 200 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANGRY INBOX</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">INVITED</text>
</svg>
