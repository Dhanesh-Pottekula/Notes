<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A Kathak guru admires a student's fancy anklets, puts them aside for the stage and offers plain ghungroo for practice</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="bell"><circle r="5" fill="#d9a441"/><circle cy="2" r="1.6" fill="#6b5446"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="520" width="960" height="120" fill="#c9a57c"/><path d="M0 560 h960 M0 600 h960" stroke="#b8936a" stroke-width="2"/>
  <!-- mirror + window -->
  <rect x="300" y="130" width="300" height="300" rx="6" fill="#8a6d5a"/><rect x="312" y="142" width="276" height="276" fill="#e3eef0"/><path d="M360 160 l-40 60 M420 160 l-80 120" stroke="#fff" stroke-width="8" opacity=".7"/>
  <!-- harmonium + tabla -->
  <rect x="780" y="470" width="120" height="50" rx="4" fill="#6b5446"/><rect x="790" y="462" width="100" height="10" fill="#fff"/><path d="M800 462 v10 M812 462 v10 M824 462 v10 M836 462 v10 M848 462 v10 M860 462 v10 M872 462 v10" stroke="#3d3a3a" stroke-width="2"/>
  <path d="M720 520 l-6 -50 h44 l-6 50 z" fill="#8a6d5a"/><ellipse cx="736" cy="470" rx="22" ry="6" fill="#efe6d6"/><circle cx="736" cy="470" r="6" fill="#3d3a3a"/>
  <!-- keepsake box -->
  <rect x="70" y="480" width="104" height="44" rx="6" fill="#1f6f78"/><path d="M70 480 l-6 -40 h104 l6 40 z" fill="#2a8590"/><rect x="74" y="486" width="96" height="10" fill="#e0a33a"/>
  <path d="M90 504 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6 l6 -6 l6 6" stroke="#e0a33a" stroke-width="2.5" fill="none"/>
  <path d="M60 470 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z" fill="#e0a33a" transform="translate(-8 -70)"/>
  <text x="140" y="264" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">FOR THE STAGE</text>
  <path d="M122 278 V420 M372 344 V400" stroke="#7a4e7e" stroke-width="3" stroke-dasharray="6 6"/>
  <!-- guru seated on cushion -->
  <ellipse cx="240" cy="530" rx="110" ry="16" fill="#7a4e7e"/>
  <g transform="translate(240 520)">
    <path d="M-80 0 q0 -36 40 -40 h80 q40 4 40 40 z" fill="#f3ede0"/><path d="M-80 0 h160" stroke="#8c2f3c" stroke-width="8"/>
    <path d="M-26 -36 v-60 a26 26 0 0 1 52 0 v60 z" fill="#f3ede0"/><path d="M-26 -96 l52 56" stroke="#8c2f3c" stroke-width="9"/>
    <rect x="-7" y="-132" width="14" height="12" fill="#b07850"/><circle cx="0" cy="-148" r="21" fill="#b07850"/>
    <path d="M-21 -150 a21 21 0 0 1 42 0 z" fill="#b9b2aa"/><circle cx="-18" cy="-160" r="10" fill="#b9b2aa"/>
    <circle cx="-7" cy="-147" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-147" r="2.5" fill="#2e2a2a"/><path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-24 -94 q-50 -6 -96 14" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M24 -94 q40 10 74 -4" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- fancy anklets in guru's raised hand -->
  <g transform="translate(122 444)"><path d="M-30 0 q30 26 60 0" stroke="#e07a5f" stroke-width="6" fill="none"/><g><use href="#bell" x="-24" y="8"/><use href="#bell" x="-12" y="14"/><use href="#bell" x="0" y="16"/><use href="#bell" x="12" y="14"/><use href="#bell" x="24" y="8"/></g>
    <circle cx="-18" cy="2" r="4" fill="#1f6f78"/><circle cx="0" cy="8" r="4" fill="#7a4e7e"/><circle cx="18" cy="2" r="4" fill="#1f6f78"/>
    <path d="M-40 -16 l4 -8 l4 8 l-4 8 z M40 -20 l3 -6 l3 6 l-3 6 z" fill="#e0a33a"/></g>
  <!-- plain ghungroo offered -->
  <g transform="translate(360 418)"><rect x="-34" y="-8" width="68" height="16" rx="6" fill="#6b5446"/><use href="#bell" x="-24" y="10"/><use href="#bell" x="-12" y="10"/><use href="#bell" x="0" y="10"/><use href="#bell" x="12" y="10"/><use href="#bell" x="24" y="10"/></g>
  <g stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round"><path d="M404 434 q8 -10 0 -20 M414 440 q14 -16 0 -32"/></g>
  <rect x="266" y="296" width="228" height="44" rx="8" fill="#f6f1e7" opacity=".92"/>
  <text x="380" y="330" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">FOR PRACTICE</text>
  <!-- student -->
  <g transform="translate(580 570) scale(1.3)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-62" width="12" height="62" rx="6" fill="#ffffff"/><rect x="2" y="-62" width="12" height="62" rx="6" fill="#ffffff"/>
    <path d="M-26 -50 v-52 a24 24 0 0 1 48 0 v52 z" fill="#7a4e7e"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="18" fill="#d9a27a"/>
    <path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><path d="M14 -150 q10 40 0 74" stroke="#2e2a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-6" cy="-148" r="2.3" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.3" fill="#2e2a2a"/><path d="M-5 -137 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <circle cx="-11" cy="-140" r="3" fill="#e07a5f" opacity=".5"/><circle cx="11" cy="-140" r="3" fill="#e07a5f" opacity=".5"/>
    <path d="M-22 -100 q-6 30 18 34 M22 -100 q6 30 -18 34" stroke="#d9a27a" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- inset: next week, plain bells on her feet -->
  <rect x="680" y="96" width="250" height="190" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="696" y="240" width="218" height="30" fill="#c9a57c"/>
  <g transform="translate(770 240)"><path d="M-14 -90 v80 q0 10 10 10 h40 q6 -8 -8 -14 h-22 v-76 z" fill="#d9a27a"/><rect x="-18" y="-40" width="36" height="12" rx="5" fill="#6b5446"/><use href="#bell" x="-10" y="-24"/><use href="#bell" x="2" y="-24"/><use href="#bell" x="12" y="-24"/></g>
  <g transform="translate(840 230)"><path d="M-14 -100 v80 q0 10 10 10 h40 q6 -8 -8 -14 h-22 v-76 z" fill="#d9a27a"/><rect x="-18" y="-50" width="36" height="12" rx="5" fill="#6b5446"/><use href="#bell" x="-10" y="-34"/><use href="#bell" x="2" y="-34"/><use href="#bell" x="12" y="-34"/></g>
  <circle cx="902" cy="128" r="16" fill="#3f9a5a"/><path d="M894 128 l6 6 l10 -11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M610 400 C650 380 680 340 700 296" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
