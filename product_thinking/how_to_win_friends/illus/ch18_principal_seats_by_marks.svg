      <path d="M-20 0 l2 -64 h36 l2 64 z" fill="#f3ede0"/><path d="M-20 -24 h40" stroke="#e0a33a" stroke-width="3"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#ffffff"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/><circle cx="0" cy="-148" r="19" fill="#b07850"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#5a5250"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
