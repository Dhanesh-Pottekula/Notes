    <path d="M-8 -134 q8 -6 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l50 -10" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <rect x="66" y="-130" width="40" height="34" rx="3" fill="#e0a33a" transform="rotate(-8 86 -113)"/><path d="M72 -120 h28 M72 -112 h28 M72 -104 h20" stroke="#fff" stroke-width="2.5" transform="rotate(-8 86 -113)"/>
    <path d="M-22 -104 l-10 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><rect x="-38" y="-70" width="10" height="7" rx="2" fill="#e0a33a"/>
