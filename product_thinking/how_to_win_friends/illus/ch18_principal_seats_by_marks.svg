    <rect x="-6" y="-132" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="18" fill="#c98a5e"/>
    <path d="M-18 -148 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="14" cy="-158" r="9" fill="#2e2a2a"/><g fill="#fff"><circle cx="22" cy="-162" r="3"/><circle cx="23" cy="-154" r="3"/><circle cx="18" cy="-168" r="3"/></g>
    <g fill="none" stroke="#2e2a2a" stroke-width="2.2"><circle cx="-7" cy="-145" r="5.5"/><circle cx="7" cy="-145" r="5.5"/></g>
    <path d="M-6 -133 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
