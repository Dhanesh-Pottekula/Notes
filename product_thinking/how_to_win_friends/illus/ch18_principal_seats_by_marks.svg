  <path d="M656 150 q32 18 64 0 q32 18 64 0 q32 18 64 0 q32 18 64 0" stroke="#e0a33a" stroke-width="3" fill="none"/>
  <g fill="#e07a5f"><path d="M680 156 l8 16 l8 -14z"/><path d="M744 156 l8 16 l8 -14z"/><path d="M808 156 l8 16 l8 -14z"/><path d="M872 156 l8 16 l8 -14z"/></g>
  <rect x="780" y="250" width="134" height="20" fill="#7a4e7e"/>
  <g transform="translate(820 250) scale(.4)"><path d="M-20 0 l6 -100 h28 l6 100 z" fill="#e0a33a"/><circle cx="0" cy="-122" r="20" fill="#d9a27a"/><path d="M-20 -124 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
  <g transform="translate(876 250) scale(.4)"><path d="M-20 0 l6 -100 h28 l6 100 z" fill="#1f6f78"/><circle cx="0" cy="-122" r="20" fill="#c98a5e"/><path d="M-20 -124 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
  <g transform="translate(712 312) scale(.6)"><use href="#dad"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-7 -137 q7 6 14 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <g fill="#e07a5f"><rect x="-40" y="-130" width="80" height="10" rx="3"/><rect x="-40" y="-118" width="80" height="10" rx="3"/></g>
    <path d="M-22 -104 l-14 -18 M22 -104 l14 -18" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="912" cy="300" r="14" fill="#3f9a5a"/><path d="M905 300 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <text x="820" y="128" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANNUAL DAY</text>
  <path d="M722 412 C780 400 810 340 800 296" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
