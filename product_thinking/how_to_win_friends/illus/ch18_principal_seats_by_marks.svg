  <text x="480" y="130" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">BY MARKS</text>
  <rect x="370" y="146" width="220" height="170" rx="6" fill="#8a6d5a"/><rect x="382" y="158" width="196" height="146" fill="#d9b98c"/>
  <rect x="400" y="168" width="160" height="128" fill="#fff"/>
  <g fill="#cbbfa9"><rect x="430" y="184" width="110" height="10" rx="4"/><rect x="430" y="208" width="100" height="10" rx="4"/><rect x="430" y="232" width="90" height="10" rx="4"/><rect x="430" y="256" width="96" height="10" rx="4"/><rect x="430" y="278" width="80" height="10" rx="4"/></g>
  <g font-size="14" font-weight="800" fill="#2b2b2b"><text x="412" y="194">1</text><text x="412" y="218">2</text><text x="412" y="242">3</text><text x="412" y="266">4</text><text x="412" y="288">5</text></g>
  <path d="M548 178 l4 8 l9 1 l-7 6 l2 9 l-8 -5 l-8 5 l2 -9 l-7 -6 l9 -1 z" fill="#e0a33a"/>
