  <path d="M326 206 l40 40 l-14 -46" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M328 202 l20 0" stroke="#fff" stroke-width="5"/>
  <rect x="216" y="160" width="40" height="50" rx="3" fill="#1f6f78"/><rect x="222" y="160" width="4" height="50" fill="#185a61"/><path d="M234 176 h14 M234 186 h14" stroke="#fff" stroke-width="3"/>
  <circle cx="296" cy="172" r="14" fill="#c98a5e"/><path d="M282 170 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/><path d="M290 178 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><path d="M280 212 a16 24 0 0 1 32 0 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
