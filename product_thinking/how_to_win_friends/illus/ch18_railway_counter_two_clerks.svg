<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two railway clerks face the same angry passenger with a waitlisted ticket: one snaps back, the other sympathizes and he calms down</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="booth">
      <path d="M30 190 h210 v370 h-210 z M52 250 v140 h166 v-140 z" fill="#8a6d5a" fill-rule="evenodd"/>
      <rect x="22" y="388" width="226" height="14" rx="3" fill="#6b5446"/>
      <g stroke="#3d3a3a" stroke-width="3"><path d="M52 250 h166 v140 h-166 z" fill="none"/><path d="M80 250 v105 M110 250 v105 M140 250 v105 M170 250 v105 M200 250 v105"/><path d="M52 355 h166"/></g>
      <rect x="60" y="210" width="150" height="26" rx="4" fill="#e0a33a"/><rect x="74" y="219" width="122" height="8" rx="4" fill="#fff" opacity=".7"/>
      <circle cx="330" cy="140" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M330 140 v-16 M330 140 l12 6" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
      <path d="M372 126 h20 l-20 28 h20 z" fill="#e0a33a" opacity=".85"/><path d="M370 124 h24 M370 156 h24" stroke="#6b5446" stroke-width="3"/>
      <path d="M180 96 v-14" stroke="#3d3a3a" stroke-width="3"/><ellipse cx="180" cy="100" rx="44" ry="6" fill="#b9ad98"/><circle cx="180" cy="100" r="7" fill="#3d3a3a"/>
    </g>
    <g id="pax">
      <use href="#m" color="#a9c9e0"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
      <rect x="40" y="-46" width="54" height="46" rx="6" fill="#7a4e7e"/><rect x="58" y="-54" width="18" height="10" rx="3" fill="none" stroke="#3d3a3a" stroke-width="3"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SNAP BACK</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SYMPATHY</text>

  <!-- LEFT: clerk snaps back -->
  <g transform="translate(135 480)"><use href="#m" color="#8f8a85"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="-7" cy="-148" r="6"/><circle cx="7" cy="-148" r="6"/><path d="M-1 -148 h2"/></g>
    <path d="M-7 -134 h14" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <path d="M-14 -160 l10 3 M14 -160 l-10 3" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <use href="#booth"/>
  <path d="M110 378 q25 -14 50 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
  <!-- passenger shouting -->
  <g transform="translate(340 580) scale(1.1)"><use href="#pax"/>
    <path d="M-14 -162 l10 5 M14 -162 l-10 5" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-136" rx="6" ry="5" fill="#6b2f2f"/>
    <path d="M-22 -104 l-54 -36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-100" y="-166" width="46" height="28" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
    <text x="-77" y="-146" text-anchor="middle" font-size="15" font-weight="800" fill="#e07a5f">WL 12</text>
    <path d="M22 -104 l10 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g stroke="#e07a5f" stroke-width="4" fill="none" stroke-linecap="round"><path d="M296 404 l-14 -6 l8 -8 l-16 -4"/><path d="M300 420 l-18 2"/></g>
  <circle cx="384" cy="350" r="20" fill="#e07a5f"/><text x="384" y="361" text-anchor="middle" font-size="28" font-weight="800" fill="#fff">!</text>
  <!-- annoyed queue -->
  <g transform="translate(460 580) scale(.75)"><use href="#m" color="#cbbfa9"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><path d="M-7 -136 q7 -4 14 0" stroke="#2e2a2a" stroke-width="3" fill="none"/></g>

  <!-- RIGHT: clerk sympathizes -->
  <g transform="translate(615 480)"><use href="#m" color="#3f8f5a"/>
    <path d="M-24 -102 l48 40" stroke="#2f7347" stroke-width="12"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-15" cy="-158" r="9" fill="#2e2a2a"/>
    <path d="M14 -168 l14 -6" stroke="#e0a33a" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-12 -158 l8 -2 M12 -158 l-8 -2" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <g transform="translate(480 0)"><use href="#booth"/></g>
  <path d="M640 384 l34 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <rect x="560" y="360" width="38" height="26" rx="3" fill="#3d3a3a"/><rect x="564" y="364" width="30" height="18" fill="#a9c9e0"/>
  <!-- TATKAL bubble -->
  <rect x="520" y="100" width="170" height="76" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M600 176 l4 26 l14 -26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M602 174 h14" stroke="#fff" stroke-width="5"/>
  <rect x="534" y="118" width="44" height="30" rx="8" fill="#1f6f78"/><rect x="540" y="124" width="12" height="10" rx="2" fill="#fff"/><rect x="558" y="124" width="12" height="10" rx="2" fill="#fff"/><circle cx="544" cy="152" r="5" fill="#3d3a3a"/><circle cx="568" cy="152" r="5" fill="#3d3a3a"/>
  <text x="634" y="146" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">TATKAL</text>
  <!-- passenger calm -->
  <g transform="translate(820 580) scale(1.1)"><use href="#pax"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -137 q6 3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 q14 -30 -2 -56" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/><rect x="10" y="-170" width="18" height="12" rx="2" fill="#fff"/>
    <path d="M-22 -104 l-18 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-62" y="-72" width="38" height="24" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
    <text x="-43" y="-55" text-anchor="middle" font-size="13" font-weight="800" fill="#e07a5f">WL 12</text>
  </g>
  <circle cx="900" cy="370" r="20" fill="#3f9a5a"/><path d="M890 370 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
