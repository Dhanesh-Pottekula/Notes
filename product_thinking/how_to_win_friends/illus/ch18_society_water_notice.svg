    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#efe6d6"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#efe6d6"/>
    <path d="M-24 -40 v-62 a24 24 0 0 1 48 0 v62 z" fill="#ffffff"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#d8d3cc"/>
