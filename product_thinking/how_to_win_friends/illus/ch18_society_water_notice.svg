  <g transform="translate(206 560)" color="#5b9bd5"><use href="#bucket"/></g>
  <!-- mother + toddler -->
  <g transform="translate(110 580)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-24 0 l4 -64 h40 l4 64 z" fill="#e0a33a"/><rect x="-12" y="-30" width="10" height="30" fill="#efe6d6"/><rect x="2" y="-30" width="10" height="30" fill="#efe6d6"/>
    <path d="M-22 -60 v-42 a22 22 0 0 1 44 0 v42 z" fill="#e0a33a"/>
    <rect x="-6" y="-132" width="12" height="10" fill="#d9a27a"/><circle cx="0" cy="-146" r="18" fill="#d9a27a"/>
    <path d="M-18 -148 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-156" r="8" fill="#2e2a2a"/>
    <circle cx="-6" cy="-146" r="2.3" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.3" fill="#2e2a2a"/><path d="M-6 -134 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -100 l24 40" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g transform="translate(160 580) scale(.5)"><rect x="-14" y="-60" width="12" height="60" rx="6" fill="#4a3f55"/><rect x="2" y="-60" width="12" height="60" rx="6" fill="#4a3f55"/><path d="M-22 -56 v-42 a22 22 0 0 1 44 0 v42 z" fill="#e07a5f"/><circle cx="0" cy="-140" r="22" fill="#d9a27a"/><path d="M-22 -144 a22 22 0 0 1 44 0 z" fill="#2e2a2a"/></g>
