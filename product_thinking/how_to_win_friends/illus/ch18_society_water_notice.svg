    <g id="cal"><rect x="-14" y="-14" width="28" height="28" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="-14" y="-14" width="28" height="8" fill="#e07a5f"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- building -->
  <rect x="40" y="120" width="380" height="440" fill="#e8dcc4"/>
  <g fill="#cbbfa9"><rect x="70" y="150" width="80" height="60"/><rect x="190" y="150" width="80" height="60"/><rect x="310" y="150" width="80" height="60"/><rect x="70" y="250" width="80" height="60"/><rect x="190" y="250" width="80" height="60"/><rect x="310" y="250" width="80" height="60"/><rect x="70" y="350" width="80" height="60"/><rect x="190" y="350" width="80" height="60"/><rect x="310" y="350" width="80" height="60"/></g>
  <g stroke="#8a6d5a" stroke-width="5"><path d="M64 214 h92 M184 214 h92 M304 214 h92 M64 314 h92 M184 314 h92 M304 314 h92 M64 414 h92 M184 414 h92 M304 414 h92"/></g>
  <g fill="#e0a33a"><rect x="78" y="196" width="14" height="18"/><rect x="200" y="296" width="14" height="18"/></g><g fill="#7a4e7e"><rect x="98" y="196" width="14" height="18"/><rect x="330" y="296" width="14" height="18"/></g><rect x="220" y="196" width="14" height="18" fill="#1f6f78"/>
  <!-- rusted pipe on wall -->
  <path d="M420 440 H650" stroke="#9a9590" stroke-width="22"/><g fill="#c2583f"><ellipse cx="470" cy="440" rx="12" ry="9"/><ellipse cx="530" cy="436" rx="9" ry="7"/><ellipse cx="572" cy="444" rx="10" ry="6"/></g>
  <path d="M500 430 l6 10 l-6 8 l6 6" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
