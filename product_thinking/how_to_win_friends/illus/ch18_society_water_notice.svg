    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#b9ad98"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/><circle cx="0" cy="-148" r="19" fill="#b07850"/>
    <path d="M-19 -154 a19 14 0 0 1 38 0 z" fill="#efe6d6"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-7 -134 q7 -4 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-14 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><path d="M-36 -62 v62" stroke="#6b5446" stroke-width="5"/>
    <path d="M22 -104 l12 50" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(330 560)" color="#e07a5f"><use href="#bucket"/></g>
  <!-- teen with bucket -->
  <g transform="translate(400 580) scale(.95)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#3d5a80"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#3d5a80"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#3f9a5a"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M-6 -134 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -104 l8 54" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(34 -10)" color="#e0a33a"><use href="#bucket"/></g>
  </g>
  <!-- tanker -->
  <g transform="translate(860 560)">
    <rect x="-130" y="-36" width="220" height="16" fill="#3d3a3a"/>
    <rect x="-130" y="-120" width="160" height="84" rx="40" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-64 -100 q-12 18 -12 24 a12 12 0 0 0 24 0 q0 -6 -12 -24 z" fill="#5b9bd5"/>
    <path d="M36 -36 v-70 h34 l20 30 v40 z" fill="#1f6f78"/><rect x="44" y="-98" width="22" height="22" fill="#e8f1ef"/>
    <circle cx="-90" cy="-16" r="18" fill="#3d3a3a"/><circle cx="-90" cy="-16" r="7" fill="#9a9590"/><circle cx="60" cy="-16" r="18" fill="#3d3a3a"/><circle cx="60" cy="-16" r="7" fill="#9a9590"/>
    <circle cx="-110" cy="-56" r="10" fill="none" stroke="#3d3a3a" stroke-width="4"/>
  </g>
  <!-- inset: burst pipe, one week -->
  <rect x="680" y="60" width="250" height="210" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <text x="805" y="100" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE WEEK</text>
  <path d="M700 168 H780 M818 168 H870" stroke="#9a9590" stroke-width="18"/><path d="M780 158 l10 6 l-6 6 l8 8 M818 158 l-8 8 l6 4 l-6 8" stroke="#c2583f" stroke-width="3" fill="none"/>
  <g stroke="#5b9bd5" stroke-width="4" stroke-linecap="round"><path d="M798 156 l-14 -30 M800 156 v-36 M802 156 l14 -30 M798 180 l-14 26 M802 180 l14 26"/></g>
  <circle cx="900" cy="130" r="16" fill="#e07a5f"/><text x="900" y="139" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">!</text>
  <g transform="translate(712 236)"><use href="#cal"/><use href="#cal" x="34"/><use href="#cal" x="68"/><use href="#cal" x="102"/><use href="#cal" x="136"/><use href="#cal" x="170"/><use href="#cal" x="204" opacity="0"/>
    <path d="M-8 -6 l16 16 M8 -6 l-16 16 M26 -6 l16 16 M42 -6 l-16 16 M60 -6 l16 16 M76 -6 l-16 16 M94 -6 l16 16 M110 -6 l-16 16 M128 -6 l16 16 M144 -6 l-16 16 M162 -6 l16 16 M178 -6 l-16 16" stroke="#e07a5f" stroke-width="2.5"/></g>
  <path d="M652 428 C680 380 690 330 704 276" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
