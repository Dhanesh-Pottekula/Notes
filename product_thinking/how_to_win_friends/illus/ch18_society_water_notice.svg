  <text x="530" y="96" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE DAY</text>
  <rect x="524" y="300" width="12" height="260" fill="#6b5446"/>
  <rect x="440" y="116" width="180" height="190" rx="6" fill="#1f6f78"/><rect x="456" y="132" width="148" height="158" fill="#fff"/>
  <path d="M496 150 h22 v12 h12 v16 h-8" stroke="#3d3a3a" stroke-width="6" fill="none" stroke-linejoin="round"/><path d="M524 186 q-8 12 -8 16 a8 8 0 0 0 16 0 q0 -4 -8 -16 z" fill="#5b9bd5"/>
  <use href="#cal" transform="translate(484 240) scale(1.2)"/><text x="484" y="253" text-anchor="middle" font-size="14" font-weight="800" fill="#2b2b2b">SAT</text>
