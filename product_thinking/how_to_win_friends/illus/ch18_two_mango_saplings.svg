  <rect x="480" y="470" width="480" height="170" fill="#e6d3a8"/>
  <path d="M480 210 h480 v260 h-480 z" fill="#f0e2c2" opacity=".6"/>
  <path d="M480 410 h480 v40 h-480 z" fill="#8f8a85"/><path d="M500 430 h40 M580 430 h40 M660 430 h40 M740 430 h40 M820 430 h40 M900 430 h40" stroke="#f6f1e7" stroke-width="4"/>
  <g transform="translate(880 410)"><rect x="-40" y="-40" width="56" height="36" rx="4" fill="#e07a5f"/><rect x="16" y="-30" width="24" height="26" rx="4" fill="#c2583f"/><circle cx="-24" cy="-4" r="7" fill="#3d3a3a"/><circle cx="28" cy="-4" r="7" fill="#3d3a3a"/></g>
  <g stroke="#cbb88f" stroke-width="5" fill="none" stroke-linecap="round"><path d="M940 240 q-40 -10 -80 6 q-30 12 -60 0"/><path d="M940 290 q-50 -12 -100 4"/><path d="M930 340 q-30 -8 -60 2"/></g>
  <g stroke="#b59c6a" stroke-width="2" fill="none"><path d="M520 540 l20 14 l-8 20 M540 554 l22 -6 M760 560 l14 18 l20 -4 M774 578 l-6 22"/></g>
  <ellipse cx="640" cy="480" rx="70" ry="9" fill="#000" opacity=".1"/>
  <path d="M630 480 q-8 -40 6 -70 q12 -24 -4 -48 l12 -4 q20 28 4 56 q-10 26 0 66 z" fill="#6b5446"/>
  <path d="M640 370 q-30 -10 -44 -40 M644 380 q30 -20 54 -14" stroke="#6b5446" stroke-width="6" fill="none" stroke-linecap="round"/>
