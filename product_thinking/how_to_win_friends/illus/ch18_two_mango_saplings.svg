  <path d="M0 210 h480 v260 h-480 z" fill="#dbe8d0" opacity=".6"/>
  <path d="M30 520 h420" stroke="#9fb7c4" stroke-width="14" stroke-linecap="round"/><path d="M30 520 h420" stroke="#c9dde6" stroke-width="5" stroke-dasharray="20 18" stroke-linecap="round"/>
  <ellipse cx="240" cy="480" rx="110" ry="12" fill="#000" opacity=".1"/>
  <path d="M226 480 q-4 -90 0 -170 h28 q4 80 0 170 z" fill="#6b5446"/>
  <path d="M240 330 l-50 -50 M244 320 l56 -54" stroke="#6b5446" stroke-width="12" stroke-linecap="round"/>
  <g fill="#2f7a4a"><circle cx="240" cy="220" r="110"/><circle cx="150" cy="260" r="70"/><circle cx="330" cy="260" r="70"/></g>
  <g fill="#3f9a5a"><circle cx="210" cy="190" r="50"/><circle cx="300" cy="230" r="40"/><circle cx="170" cy="280" r="34"/></g>
  <use href="#mango" transform="translate(170 300)"/><use href="#mango" transform="translate(205 262)"/><use href="#mango" transform="translate(262 300)"/><use href="#mango" transform="translate(300 268)"/><use href="#mango" transform="translate(330 310)"/><use href="#mango" transform="translate(238 236)"/><use href="#mango" transform="translate(140 252)"/><use href="#mango" transform="translate(276 196)"/><use href="#mango" transform="translate(196 210)"/><use href="#mango" transform="translate(354 250)"/>
  <g transform="translate(390 462)"><path d="M-20 0 h40 l-6 -36 h-28 z" fill="#1f6f78"/><path d="M20 -30 l26 -18" stroke="#1f6f78" stroke-width="7" stroke-linecap="round"/><path d="M-20 -30 q-20 0 -14 -20" stroke="#1f6f78" stroke-width="5" fill="none"/></g>

