<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two mango saplings from one nursery grow into a fruit-laden tree in a watered garden and a stunted tree by a dusty highway</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sap"><path d="M-14 0 h28 l-4 -26 h-20 z" fill="#3d3a3a"/><path d="M0 -26 v-22" stroke="#6b5446" stroke-width="3"/><ellipse cx="-8" cy="-46" rx="9" ry="4" fill="#3f9a5a" transform="rotate(-30 -8 -46)"/><ellipse cx="8" cy="-50" rx="9" ry="4" fill="#3f9a5a" transform="rotate(30 8 -50)"/></g>
    <g id="mango"><ellipse rx="9" ry="12" fill="#e0a33a"/><ellipse cx="-3" cy="-3" rx="3" ry="5" fill="#f2c46a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
