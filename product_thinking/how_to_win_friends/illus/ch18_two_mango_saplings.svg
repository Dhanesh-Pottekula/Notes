  <use href="#mango" transform="translate(610 340) scale(.6)"/><use href="#mango" transform="translate(690 378) scale(.6)"/>
  <!-- woman crouching with understanding -->
  <g transform="translate(760 480)">
    <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
    <path d="M-30 0 q-4 -50 10 -60 h30 q20 10 24 60 z" fill="#e0a33a"/>
    <path d="M-20 -54 v-36 a20 20 0 0 1 40 0 v36 z" fill="#e0a33a"/>
    <path d="M-18 -90 l40 34" stroke="#c98336" stroke-width="10"/>
    <rect x="-5" y="-118" width="10" height="10" fill="#b07850"/>
    <circle cx="0" cy="-130" r="17" fill="#b07850"/>
    <path d="M-17 -132 a17 17 0 0 1 34 0 z" fill="#5a5250"/><circle cx="14" cy="-140" r="8" fill="#5a5250"/>
    <circle cx="-6" cy="-130" r="2.3" fill="#2e2a2a"/><circle cx="5" cy="-130" r="2.3" fill="#2e2a2a"/>
    <path d="M-5 -120 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.3" fill="none"/>
    <path d="M-18 -84 q-50 4 -100 -20" stroke="#b07850" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M18 -84 l14 30" stroke="#b07850" stroke-width="9" stroke-linecap="round"/><rect x="22" y="-60" width="30" height="34" rx="6" fill="#7a4e7e"/>
  </g>
  <!-- reason icons -->
  <g transform="translate(560 250)"><circle r="26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-4 -14 q-12 16 -12 22 a12 12 0 0 0 24 0 q0 -6 -12 -22 z" fill="none" stroke="#5b9bd5" stroke-width="3" stroke-dasharray="4 3"/></g>
  <g transform="translate(560 320)"><circle r="26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-16 -6 l10 6 l-4 10 M-6 0 l12 -4 l6 12 M6 -4 l8 -10" stroke="#b59c6a" stroke-width="3" fill="none"/></g>

  <!-- divider + labels + nursery inset -->
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <rect x="72" y="28" width="336" height="54" rx="12" fill="#f6f1e7" opacity=".92"/>
  <text x="240" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">GOOD SOIL</text>
  <text x="720" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">DUST AND WIND</text>
  <rect x="380" y="530" width="200" height="90" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="396" y="590" width="168" height="10" rx="3" fill="#8a6d5a"/>
  <use href="#sap" transform="translate(450 590)"/><use href="#sap" transform="translate(510 590)"/>
  <path d="M410 530 C390 500 350 500 320 490" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M550 530 C570 500 600 500 620 494" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
