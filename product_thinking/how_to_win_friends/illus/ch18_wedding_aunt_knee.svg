<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a wedding an aunt telling her knee-operation story is hurt when a young man brushes it off and delighted when he asks about the stairs</title>
  <defs>
    <g id="aunt">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <path d="M-26 0 l4 -66 h44 l4 66 z" fill="#d94f8a"/><path d="M-26 -8 h52" stroke="#e0a33a" stroke-width="5"/>
      <path d="M-24 -60 v-40 a24 24 0 0 1 48 0 v40 z" fill="#d94f8a"/><path d="M-24 -98 l48 46" stroke="#b83c72" stroke-width="10"/>
      <rect x="-6" y="-132" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="19" fill="#c98a5e"/>
      <path d="M-19 -148 a19 19 0 0 1 38 0 z" fill="#5a5250"/><circle cx="-16" cy="-156" r="9" fill="#5a5250"/>
      <g fill="none" stroke="#2e2a2a" stroke-width="2.2"><circle cx="-7" cy="-145" r="5.5"/><circle cx="7" cy="-145" r="5.5"/></g>
      <path d="M-40 -30 v30" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/><path d="M-46 -30 h12" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>
      <rect x="-14" y="-6" width="14" height="10" rx="3" fill="#efe1c6"/>
    </g>
    <g id="guy">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/>
      <path d="M-24 -40 v-62 a24 24 0 0 1 48 0 v62 z" fill="#3d6fb0"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/><circle cx="0" cy="-148" r="19" fill="#b07850"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="story">
      <rect x="-80" y="-44" width="160" height="80" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
      <circle cx="-10" cy="44" r="6" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="-4" cy="58" r="4" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
      <rect x="-66" y="-6" width="44" height="12" rx="3" fill="#9fb7c4"/><rect x="-66" y="-18" width="12" height="14" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-64 6 v14 M-24 6 v14" stroke="#3d3a3a" stroke-width="3"/>
      <circle cx="4" cy="-16" r="12" fill="#c98a5e"/><rect x="-8" y="-14" width="24" height="12" rx="4" fill="#9fd0c4"/><path d="M-8 12 a12 18 0 0 1 24 0 z" fill="#9fd0c4"/>
      <ellipse cx="52" cy="0" rx="18" ry="22" fill="#d9a27a"/><path d="M40 0 h24 M44 -5 v10 M50 -5 v10 M56 -5 v10 M62 -5 v10" stroke="#e07a5f" stroke-width="2.5"/>
    </g>
    <g id="plate"><ellipse rx="22" ry="6" fill="#d8d3cc"/><circle cx="-6" cy="-4" r="5" fill="#e0a33a"/><circle cx="6" cy="-4" r="5" fill="#3f9a5a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- garlands + lights + mandap, both halves -->
  <g id="deco">
    <path d="M20 96 q110 40 220 0 q110 40 220 0" stroke="#e0a33a" stroke-width="10" fill="none" stroke-dasharray="1 12" stroke-linecap="round"/>
    <path d="M20 120 q110 30 220 0 q110 30 220 0" stroke="#3d3a3a" stroke-width="1.5" fill="none"/>
    <g fill="#f2c46a"><circle cx="60" cy="130" r="4"/><circle cx="110" cy="138" r="4"/><circle cx="160" cy="138" r="4"/><circle cx="210" cy="128" r="4"/><circle cx="270" cy="128" r="4"/><circle cx="320" cy="138" r="4"/><circle cx="370" cy="138" r="4"/><circle cx="420" cy="130" r="4"/></g>
    <g transform="translate(240 300)"><rect x="-100" y="-60" width="12" height="150" fill="#e07a5f" opacity=".55"/><rect x="88" y="-60" width="12" height="150" fill="#e07a5f" opacity=".55"/><path d="M-110 -60 q110 -60 220 0 z" fill="#e0a33a" opacity=".55"/><rect x="-110" y="90" width="220" height="16" fill="#cbbfa9"/></g>
  </g>
  <use href="#deco" x="480"/>
  <!-- LEFT: brush off -->
  <g transform="translate(140 580) scale(1.15)"><use href="#aunt"/>
    <circle cx="-7" cy="-145" r="2.3" fill="#2e2a2a"/><circle cx="7" cy="-145" r="2.3" fill="#2e2a2a"/>
    <path d="M-7 -131 q7 -5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -96 l-18 66" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M22 -96 l12 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(118 330)"><path d="M-30 0 a16 16 0 0 1 20 -18 a20 20 0 0 1 34 4 a14 14 0 0 1 6 22 z" fill="#9a9590"/><path d="M-14 8 l-4 12 M0 8 l-4 12 M14 8 l-4 12" stroke="#5b9bd5" stroke-width="3" stroke-linecap="round"/></g>
  <g transform="translate(150 230) scale(.85)"><use href="#story"/></g>
  <g transform="translate(330 580) scale(1.1)"><use href="#guy"/>
    <path d="M6 -158 a6 3 0 0 1 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <circle cx="9" cy="-152" r="2.3" fill="#2e2a2a"/><circle cx="16" cy="-152" r="2.3" fill="#2e2a2a"/>
    <path d="M22 -104 l12 30" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><rect x="28" y="-86" width="14" height="24" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -104 q-30 -10 -34 -46" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(330 580) scale(1.1)"><use href="#plate" transform="translate(48 -60)" opacity="0"/></g>
  <!-- guy's bubble: two knees equal -->
  <rect x="330" y="200" width="130" height="64" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M360 264 l-8 24 l24 -24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M362 262 h12" stroke="#fff" stroke-width="5"/>
  <ellipse cx="362" cy="232" rx="14" ry="18" fill="#d9a27a"/><path d="M386 226 h12 M386 238 h12" stroke="#2b2b2b" stroke-width="4"/><ellipse cx="426" cy="232" rx="14" ry="18" fill="#d9a27a"/>

  <!-- RIGHT: listen -->
  <g transform="translate(640 580) scale(1.15)"><use href="#aunt"/>
    <path d="M-10 -146 q3 -4 6 0 M4 -146 q3 -4 6 0" stroke="#2e2a2a" stroke-width="2.3" fill="none"/>
    <path d="M-8 -134 q8 8 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -96 l-18 66" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M22 -96 q30 0 50 10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(640 230) scale(.85)"><use href="#story"/></g>
  <g transform="translate(760 580) scale(1.1)"><use href="#guy"/>
    <path d="M-12 -158 l8 -2 M12 -158 l-8 -2" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M-6 -137 q6 3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l18 30" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><use href="#plate" transform="translate(44 -72)"/>
  </g>
  <path d="M704 376 c-22 -14 -18 -32 -4 -32 c6 0 4 6 4 6 c0 0 -2 -6 4 -6 c14 0 18 18 -4 32 z" fill="#e07a5f"/>
  <!-- guy's bubble: stairs + ? -->
  <rect x="790" y="200" width="140" height="70" rx="18" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M806 270 l-10 26 l28 -26" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M808 268 h14" stroke="#fff" stroke-width="5"/>
  <path d="M806 258 h20 v-14 h20 v-14 h20 v-14 h20" stroke="#1f6f78" stroke-width="5" fill="none" stroke-linejoin="round"/>
  <text x="904" y="256" text-anchor="middle" font-size="34" font-weight="800" fill="#e0a33a">?</text>
  <!-- inset: later she listens to him -->
  <rect x="842" y="420" width="94" height="80" rx="14" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="868" cy="462" r="12" fill="#c98a5e"/><path d="M856 460 a12 12 0 0 1 24 0 z" fill="#5a5250"/><path d="M852 494 a16 20 0 0 1 32 0 z" fill="#d94f8a"/>
  <circle cx="910" cy="462" r="12" fill="#b07850"/><path d="M898 460 a12 12 0 0 1 24 0 z" fill="#2e2a2a"/><path d="M894 494 a16 20 0 0 1 32 0 z" fill="#3d6fb0"/>
  <path d="M890 440 q6 -6 12 0" stroke="#7a4e7e" stroke-width="2.5" fill="none"/><path d="M886 434 q10 -10 20 0" stroke="#7a4e7e" stroke-width="2.5" fill="none"/>
  <!-- divider + labels -->
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <rect x="120" y="32" width="240" height="46" rx="10" fill="#f6f1e7"/><rect x="620" y="32" width="200" height="46" rx="10" fill="#f6f1e7"/>
  <text x="240" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BRUSH OFF</text>
  <text x="720" y="68" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LISTEN</text>
</svg>
