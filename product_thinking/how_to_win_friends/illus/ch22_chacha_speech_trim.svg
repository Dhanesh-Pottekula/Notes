<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An uncle's speech is so long it trails on the floor; after a kind note he reads a short card and the wedding guests laugh</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="uncle">
      <use href="#m" color="#f3ede0"/>
      <path d="M-24 -62 h48 v26 h-48 z" fill="#f3ede0"/>
      <path d="M-24 -100 q20 30 48 -4 v14 q-26 30 -48 4 z" fill="#8c2f39"/>
      <path d="M-19 -154 a19 19 0 0 1 38 0 q-6 -6 -19 -6 q-13 0 -19 6 z" fill="#b9b4ae"/>
      <circle cx="-7" cy="-149" r="6" fill="none" stroke="#3d3a3a" stroke-width="2"/><circle cx="7" cy="-149" r="6" fill="none" stroke="#3d3a3a" stroke-width="2"/><path d="M-1 -149 h2" stroke="#3d3a3a" stroke-width="2"/>
      <path d="M-10 -137 q10 -5 20 0" stroke="#d8d2ca" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M-6 -131 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 30 V610" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">20 MIN</text>
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">5 MIN</text>

  <!-- LEFT: living room -->
  <circle cx="400" cy="160" r="40" fill="#ffffff" stroke="#8a6d5a" stroke-width="5"/>
  <path d="M400 160 V126 A34 34 0 1 1 370.6 177 z" fill="#e07a5f" opacity=".75"/>
  <path d="M400 160 V132 M400 160 l20 10" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  <!-- sofa -->
  <rect x="270" y="440" width="190" height="90" rx="14" fill="#1f6f78"/><rect x="262" y="410" width="30" height="120" rx="12" fill="#185a61"/><rect x="440" y="410" width="30" height="120" rx="12" fill="#185a61"/>
  <rect x="280" y="530" width="10" height="30" fill="#6b5446"/><rect x="440" y="530" width="10" height="30" fill="#6b5446"/>
  <!-- nephew seated -->
  <g transform="translate(340 470)">
    <rect x="-46" y="-8" width="56" height="16" rx="8" fill="#4a3f55"/><rect x="-48" y="-8" width="14" height="70" rx="7" fill="#4a3f55"/>
    <path d="M-22 6 v-48 a22 22 0 0 1 44 0 v48 z" fill="#5b8fc9"/>
    <rect x="-6" y="-72" width="12" height="10" fill="#b07850"/>
    <circle cx="0" cy="-86" r="18" fill="#b07850"/><path d="M-18 -90 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-86" r="2.5" fill="#2e2a2a"/>
    <path d="M-12 -76 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round" transform="translate(-2 0)"/>
    <path d="M-18 -36 l-52 -14" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- uncle with long scroll -->
  <g transform="translate(150 560) scale(1.14)"><use href="#uncle"/>
    <path d="M-22 -104 l22 -26 M22 -104 l20 -22" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(146 0) scale(.82 1) translate(-146 0)">
  <path d="M146 410 h118 v120 q0 20 30 30 h-120 q-28 -10 -28 -30 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M294 560 q40 6 70 -6 q14 -6 10 -16 q-6 -8 -16 0" fill="none" stroke="#cbbfa9" stroke-width="10" stroke-linecap="round"/>
  <path d="M294 560 q40 6 70 -6 q14 -6 10 -16 q-6 -8 -16 0" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <rect x="152" y="404" width="118" height="12" rx="6" fill="#d8cdb8"/>
  <rect x="158" y="424" width="100" height="26" rx="3" fill="#e0a33a" opacity=".55"/>
  <g stroke="#b9ad98" stroke-width="3" stroke-linecap="round"><path d="M164 432 h80 M164 442 h64 M164 462 h86 M164 474 h70 M164 486 h86 M164 498 h60 M164 510 h82 M164 522 h70"/></g>
  </g>
  <path d="M208 380 c-6 -10 -22 -4 -14 8 l14 12 l14 -12 c8 -12 -8 -18 -14 -8 z" fill="#e07a5f"/>

  <!-- RIGHT: reception -->
  <path d="M500 96 q110 40 220 0 q110 40 220 0" stroke="#e0a33a" stroke-width="12" fill="none" stroke-dasharray="1 14" stroke-linecap="round"/>
  <path d="M500 96 q110 40 220 0 q110 40 220 0" stroke="#e07a5f" stroke-width="6" fill="none" stroke-dasharray="1 14" stroke-dashoffset="7" stroke-linecap="round"/>
  <!-- small clock -->
  <circle cx="890" cy="176" r="30" fill="#ffffff" stroke="#8a6d5a" stroke-width="4"/>
  <path d="M890 176 V150 A26 26 0 0 1 912.5 163 z" fill="#1f6f78" opacity=".8"/>
  <path d="M890 176 V154 M890 176 l14 -8" stroke="#3d3a3a" stroke-width="3" stroke-linecap="round"/>
  <!-- mic and uncle -->
  <path d="M640 560 V400" stroke="#3d3a3a" stroke-width="4"/><path d="M620 560 h40" stroke="#3d3a3a" stroke-width="5" stroke-linecap="round"/><rect x="634" y="380" width="12" height="24" rx="6" fill="#3d3a3a"/>
  <g transform="translate(580 560) scale(1.14)"><use href="#uncle"/>
    <path d="M-22 -104 l-10 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l26 -18" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="628" y="396" width="34" height="44" rx="3" fill="#ffffff" stroke="#cbbfa9" stroke-width="2" transform="rotate(-8 645 418)"/>
  <!-- table with laughing guests -->
  <g transform="translate(790 470)">
    <circle cx="-54" cy="-74" r="17" fill="#d9a27a"/><path d="M-71 -78 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/><path d="M-76 -10 v-30 a22 22 0 0 1 44 0 v30 z" fill="#7a4e7e"/>
    <circle cx="0" cy="-82" r="17" fill="#c98a5e"/><path d="M-17 -86 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/><path d="M-22 -10 v-38 a22 22 0 0 1 44 0 v38 z" fill="#e0a33a"/>
    <circle cx="54" cy="-74" r="17" fill="#b07850"/><path d="M37 -78 a17 17 0 0 1 34 0 z" fill="#b9b4ae"/><path d="M32 -10 v-30 a22 22 0 0 1 44 0 v30 z" fill="#1f6f78"/>
    <g fill="#2e2a2a"><path d="M-62 -70 q8 10 16 0 z"/><path d="M-8 -78 q8 10 16 0 z"/><path d="M46 -70 q8 10 16 0 z"/></g>
    <g stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"><path d="M-62 -78 q3 -3 6 0 M-52 -78 q3 -3 6 0 M-8 -86 q3 -3 6 0 M2 -86 q3 -3 6 0 M46 -78 q3 -3 6 0 M56 -78 q3 -3 6 0"/></g>
    <ellipse cx="0" cy="-4" rx="110" ry="18" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-100 0 v80 h200 v-80" fill="#ffffff"/><path d="M-100 0 q100 30 200 0" fill="none" stroke="#cbbfa9" stroke-width="2"/>
    <g fill="#b8bec2"><ellipse cx="-50" cy="-8" rx="20" ry="5"/><ellipse cx="0" cy="-6" rx="20" ry="5"/><ellipse cx="50" cy="-8" rx="20" ry="5"/></g>
  </g>
  <g stroke="#e0a33a" stroke-width="3.5" stroke-linecap="round"><path d="M716 360 l-10 -10 M790 346 v-14 M864 360 l10 -10"/></g>
  <!-- server with tray -->
  <g transform="translate(920 560) scale(.92)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -104 l-26 0" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-70 -110 h46" stroke="#9a9590" stroke-width="6" stroke-linecap="round"/>
    <path d="M-62 -112 a10 10 0 0 1 20 0 z" fill="#e0a33a"/>
  </g>
</svg>
