<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cricket coach praises a young bowler's out-swinger first, then points out his front foot landing over the crease</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <path id="star" d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4 z" fill="#e0a33a"/>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- grass and pitch -->
  <rect y="470" width="960" height="170" fill="#c9d3a6"/>
  <path d="M120 640 L330 470 H630 L840 640 z" fill="#d8cdb8"/>
  <path d="M150 600 H810" stroke="#ffffff" stroke-width="8"/>
  <!-- nets -->
  <g stroke="#b9ad98" stroke-width="1.5" opacity=".7">
    <path d="M40 470 V110 M920 470 V110"/>
    <path d="M40 150 H920 M40 230 H920 M40 310 H920 M40 390 H920" stroke-dasharray="3 6"/>
  </g>
  <rect x="34" y="100" width="12" height="372" rx="4" fill="#8a6d5a"/><rect x="914" y="100" width="12" height="372" rx="4" fill="#8a6d5a"/>
  <!-- distant stumps -->
  <g fill="#e3d7bf"><rect x="466" y="420" width="6" height="50"/><rect x="478" y="420" width="6" height="50"/><rect x="490" y="420" width="6" height="50"/></g>
  <path d="M464 420 h34" stroke="#8a6d5a" stroke-width="3"/>

  <!-- bowler -->
  <g transform="translate(210 560) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="none" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#1f6f78"/><path d="M14 -156 h16 v5 h-18 z" fill="#1f6f78"/>
    <circle cx="-5" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -139 q7 7 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 l-18 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l26 -14 l8 -30" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="58" cy="-156" r="9" fill="#c0392b"/>
  </g>
  <!-- glow lines -->
  <path d="M168 360 l-14 -12 M212 344 v-18 M256 360 l14 -12" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>

  <!-- coach -->
  <g transform="translate(400 560) scale(1.18)"><use href="#m" color="#2f3f6b"/>
    <path d="M-24 -60 h48 v8 h-48 z" fill="#2f3f6b"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-12 -136 q12 6 24 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-10 -124 l10 24 l10 -24" stroke="#cbbfa9" stroke-width="2" fill="none"/><circle cx="0" cy="-98" r="4" fill="#b8bec2"/>
    <path d="M-22 -104 l-34 -22 l-6 -26" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="16" y="-104" width="30" height="40" rx="3" fill="#8a6d5a" transform="rotate(10 30 -84)"/><rect x="20" y="-98" width="22" height="30" fill="#ffffff" transform="rotate(10 30 -84)"/>
  </g>

  <!-- bubble 1: out-swinger -->
  <text x="510" y="96" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">PRAISE FIRST</text>
  <rect x="380" y="118" width="260" height="190" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M440 306 l-6 46 l40 -46" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M442 304 h30" stroke="#ffffff" stroke-width="5"/>
  <circle cx="404" cy="142" r="14" fill="#1f6f78"/><text x="404" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">1</text>
  <path d="M500 170 v116" stroke="#8a6d5a" stroke-width="14" stroke-linecap="round"/><path d="M500 150 v22" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M410 270 C470 250 500 230 540 200 S600 160 612 150" stroke="#c0392b" stroke-width="4" fill="none" stroke-dasharray="6 8" stroke-linecap="round"/>
  <circle cx="616" cy="148" r="9" fill="#c0392b"/>
  <use href="#star" transform="translate(586 220) scale(1.4)"/>

  <!-- arrow -->
  <path d="M646 212 H676" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>

  <!-- bubble 2: no-ball foot -->
  <text x="810" y="96" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">THEN THE FIX</text>
  <rect x="686" y="118" width="250" height="190" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="710" cy="142" r="14" fill="#1f6f78"/><text x="710" y="149" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">2</text>
  <rect x="702" y="200" width="218" height="96" rx="10" fill="#d8cdb8"/>
  <path d="M702 244 H920" stroke="#ffffff" stroke-width="10"/>
  <path d="M790 296 v-62 q0 -30 22 -30 q22 0 22 30 v62 z" fill="#3d3a3a"/>
  <path d="M796 270 h32" stroke="#ffffff" stroke-width="3"/>
  <rect x="772" y="232" width="80" height="24" rx="6" fill="none" stroke="#e07a5f" stroke-width="4"/>
  <circle cx="900" cy="168" r="16" fill="#e07a5f"/><text x="900" y="176" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">!</text>
</svg>
