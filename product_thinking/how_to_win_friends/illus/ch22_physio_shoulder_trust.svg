<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A physiotherapist praises a patient's improved shoulder movement, then presses the sore spot while he breathes through it, trusting her</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <path id="star" d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4 z" fill="#e0a33a"/>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- window with palms -->
  <rect x="350" y="70" width="190" height="150" rx="6" fill="#8a6d5a"/><rect x="362" y="82" width="166" height="126" fill="#e6f0f2"/>
  <path d="M410 208 q6 -50 -4 -90 M470 208 q-4 -40 6 -70" stroke="#8a6d5a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g fill="#3f9a5a"><path d="M406 118 q-30 -10 -40 10 q20 -10 40 -10 z M406 118 q30 -14 44 6 q-24 -8 -44 -6 z M406 118 q-10 -24 10 -34 q-6 18 -10 34 z"/>
  <path d="M476 138 q-26 -8 -36 10 q18 -8 36 -10 z M476 138 q26 -12 40 4 q-22 -6 -40 -4 z M476 138 q-6 -22 12 -30 q-6 16 -12 30 z"/></g>
  <!-- wall chart -->
  <rect x="580" y="90" width="90" height="130" rx="4" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <g stroke="#b9ad98" stroke-width="4" fill="none" stroke-linecap="round"><circle cx="625" cy="112" r="10"/><path d="M625 122 v50 M605 134 h40 M625 172 l-14 34 M625 172 l14 34 M605 134 l-8 30 M645 134 l8 30"/></g>
  <g transform="translate(0 150)">
  <!-- calendar -->
  <rect x="690" y="110" width="70" height="74" rx="4" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/><rect x="690" y="110" width="70" height="16" rx="4" fill="#e07a5f"/>
  <g fill="#cbbfa9"><circle cx="704" cy="140" r="3"/><circle cx="718" cy="140" r="3"/><circle cx="732" cy="140" r="3"/><circle cx="746" cy="140" r="3"/><circle cx="704" cy="156" r="3"/><circle cx="718" cy="156" r="3"/><circle cx="746" cy="156" r="3"/><circle cx="704" cy="172" r="3"/><circle cx="718" cy="172" r="3"/></g>
  <circle cx="732" cy="156" r="9" fill="none" stroke="#1f6f78" stroke-width="3"/>
  </g>
  <!-- rack with bands and dumbbells -->
  <rect x="40" y="420" width="16" height="140" fill="#8a6d5a"/><rect x="200" y="420" width="16" height="140" fill="#8a6d5a"/>
  <path d="M40 440 H216 M40 510 H216" stroke="#8a6d5a" stroke-width="8"/>
  <g fill="none" stroke-width="6" stroke-linecap="round"><path d="M80 440 v40" stroke="#e07a5f"/><path d="M110 440 v52" stroke="#e0a33a"/><path d="M140 440 v36" stroke="#1f6f78"/><path d="M170 440 v46" stroke="#7a4e7e"/></g>
  <g fill="#3d3a3a"><rect x="70" y="498" width="10" height="12" rx="2"/><rect x="96" y="498" width="10" height="12" rx="2"/><rect x="140" y="498" width="10" height="12" rx="2"/><rect x="166" y="498" width="10" height="12" rx="2"/></g>
  <path d="M80 504 h16 M150 504 h16" stroke="#3d3a3a" stroke-width="4"/>

  <!-- treatment table -->
  <rect x="270" y="424" width="330" height="26" rx="10" fill="#1f6f78"/>
  <path d="M296 450 v110 M574 450 v110" stroke="#9a9590" stroke-width="8"/>

  <!-- physiotherapist (behind) -->
  <g transform="translate(530 560) scale(1.42)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -102 h48 v52 h-48 z" fill="#ffffff"/><path d="M-24 -60 h48 v-4 h-48 z" fill="#ffffff"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#1f6f78"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#1f6f78"/>
    <path d="M-24 -50 v-50 a24 24 0 0 1 48 0 v50 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-8 -124 l8 16 l8 -16" fill="#1f6f78"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><path d="M16 -156 q14 4 12 20" stroke="#2e2a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -138 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 l-30 -42 l-8 -2" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- patient seated sideways, facing left -->
  <g transform="translate(420 424)">
    <rect x="-46" y="-12" width="60" height="18" rx="9" fill="#4a3f55"/><rect x="-48" y="-6" width="16" height="92" rx="8" fill="#4a3f55"/>
    <rect x="-62" y="80" width="30" height="10" rx="4" fill="#3d3a3a"/>
    <path d="M-28 0 v-62 a28 28 0 0 1 56 0 v62 z" fill="#9a9590"/>
    <rect x="-7" y="-98" width="14" height="12" fill="#b07850"/>
    <circle cx="0" cy="-112" r="21" fill="#b07850"/><path d="M-21 -116 a21 21 0 0 1 42 0 q-14 -6 -24 -4 q-12 2 -18 4 z" fill="#2e2a2a"/>
    <path d="M-12 -114 l7 2 M-2 -114 l6 2" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-14 -100 q4 -3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -60 l-20 40 l20 10" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- breath lines -->
  <path d="M384 324 q-16 -4 -26 6 M380 334 q-20 2 -30 14" stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="4 6"/>
  <!-- pain burst at shoulder blade -->
  <g transform="translate(442 350)"><path d="M0 -16 L5 -6 L16 -8 L9 1 L15 11 L4 8 L0 18 L-4 8 L-15 11 L-9 1 L-16 -8 L-5 -6 z" fill="#e07a5f"/></g>

  <!-- inset bubble: range of movement -->
  <rect x="30" y="90" width="270" height="200" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  
  <path d="M298 176 L498 306 L298 214" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M299 178 V212" stroke="#ffffff" stroke-width="5"/>
  <circle cx="110" cy="250" r="12" fill="#b07850"/>
  <path d="M110 250 H240" stroke="#b07850" stroke-width="12" stroke-linecap="round"/>
  <path d="M200 250 A90 90 0 0 0 173 186" stroke="#b9ad98" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="2 10"/>
  <path d="M110 250 L173 186" stroke="#b9ad98" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M224 250 A114 114 0 0 0 110 136" stroke="#1f6f78" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M110 250 L110 140" stroke="#1f6f78" stroke-width="5" stroke-linecap="round"/>
  <use href="#star" transform="translate(240 140) scale(1.4)"/>

  <!-- trust gauge -->
  <text x="836" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRUST</text>
  <rect x="806" y="92" width="60" height="400" rx="30" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="814" y="352" width="44" height="132" rx="10" fill="#e07a5f" opacity=".7"/>
  <rect x="814" y="226" width="44" height="122" rx="6" fill="#e0a33a" opacity=".7"/>
  <rect x="814" y="100" width="44" height="122" rx="10" fill="#1f6f78" opacity=".85"/>
  <path d="M770 138 l30 -12 v24 z" fill="#3d3a3a"/><path d="M748 138 h28" stroke="#3d3a3a" stroke-width="5" stroke-linecap="round"/>
  <rect x="816" y="492" width="40" height="68" fill="#cbbfa9"/><rect x="790" y="554" width="92" height="10" rx="4" fill="#b9ad98"/>
</svg>
