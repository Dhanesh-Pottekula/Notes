<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A school principal writes to her new science head: the letter opens with praise, then a warning, then a confident send-off</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <marker id="at" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <path id="star" d="M0 -14 L4 -4 L14 -4 L6 3 L9 13 L0 7 L-9 13 L-6 3 L-14 -4 L-4 -4 z" fill="#e0a33a"/>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- window with school building -->
  <rect x="40" y="96" width="220" height="190" rx="6" fill="#8a6d5a"/><rect x="52" y="108" width="196" height="166" fill="#e6f0f2"/>
  <rect x="80" y="170" width="140" height="104" fill="#efe2c4"/><path d="M74 170 h152" stroke="#e07a5f" stroke-width="8"/>
  <g fill="#b9c8cc"><rect x="94" y="186" width="22" height="22"/><rect x="139" y="186" width="22" height="22"/><rect x="184" y="186" width="22" height="22"/><rect x="94" y="226" width="22" height="22"/><rect x="184" y="226" width="22" height="22"/></g>
  <rect x="139" y="232" width="22" height="42" fill="#8a6d5a"/>
  <path d="M236 274 V124" stroke="#9a9590" stroke-width="3"/><path d="M236 126 h-18 v12 h18 z" fill="#e0a33a"/>
  <path d="M150 108 V274 M52 190 H80" stroke="#8a6d5a" stroke-width="0"/>
  <!-- chair back -->
  <rect x="186" y="292" width="92" height="140" rx="14" fill="#6b5446"/>
  <!-- principal seated -->
  <g transform="translate(232 0)">
    <path d="M-34 430 v-64 a34 34 0 0 1 68 0 v64 z" fill="#1f6f78"/>
    <path d="M-30 350 q30 10 56 -20 l8 10 q-24 34 -64 34 z" fill="#185a61"/>
    <path d="M-34 380 h68" stroke="#e0a33a" stroke-width="4"/>
    <rect x="-7" y="318" width="14" height="12" fill="#c98a5e"/>
    <circle cx="0" cy="300" r="22" fill="#c98a5e"/>
    <path d="M-22 298 a22 22 0 0 1 44 0 q-10 -12 -22 -12 q-12 0 -22 12 z" fill="#2e2a2a"/><circle cx="18" cy="282" r="10" fill="#2e2a2a"/>
    <circle cx="-8" cy="302" r="6.5" fill="none" stroke="#3d3a3a" stroke-width="2"/><circle cx="8" cy="302" r="6.5" fill="none" stroke="#3d3a3a" stroke-width="2"/><path d="M-1.5 302 h3" stroke="#3d3a3a" stroke-width="2"/>
    <path d="M-6 314 h12" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="290" r="2" fill="#c0392b"/>
    <path d="M26 362 l40 40 l30 8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-26 362 l-20 44 l40 8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- desk -->
  <rect x="50" y="414" width="370" height="14" rx="3" fill="#6b5446"/><rect x="62" y="428" width="346" height="132" fill="#8a6d5a"/>
  <rect x="80" y="448" width="140" height="92" rx="4" fill="#7a5e4c"/><rect x="250" y="448" width="140" height="92" rx="4" fill="#7a5e4c"/>
  <!-- desk items -->
  <rect x="300" y="396" width="70" height="20" rx="2" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5" transform="rotate(-4 335 406)"/>
  <path d="M322 408 l14 -22" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  <g><rect x="70" y="398" width="70" height="8" fill="#e07a5f"/><rect x="74" y="390" width="66" height="8" fill="#e0a33a"/><rect x="70" y="406" width="72" height="8" fill="#7a4e7e"/></g>
  <path d="M156 414 v-22 h22 v22 z" fill="#ffffff"/><path d="M158 396 h18 v18 h-18 z" fill="#c98a5e" opacity=".5"/><path d="M178 398 q8 0 8 6 q0 6 -8 6" stroke="#ffffff" stroke-width="3" fill="none"/>
  <path d="M162 386 q4 -8 0 -16 M172 386 q4 -8 0 -16" stroke="#cbbfa9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M384 414 a14 14 0 0 1 28 0 z" fill="#e0a33a"/><path d="M398 400 v-8" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  <!-- dashed arrow to the letter -->
  <path d="M352 380 C370 320 400 300 440 300" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>

  <!-- the letter, large -->
  <rect x="458" y="88" width="280" height="476" rx="6" fill="#000" opacity=".08"/>
  <rect x="450" y="80" width="280" height="476" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <!-- band 1 praise -->
  <circle cx="480" cy="130" r="14" fill="#3f9a5a"/><path d="M473 130 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <use href="#star" transform="translate(480 176)"/>
  <g stroke="#b9ad98" stroke-width="4" stroke-linecap="round"><path d="M506 118 h196 M506 142 h180 M506 166 h200 M506 190 h170 M506 214 h196 M506 238 h150 M506 262 h190 M506 286 h120"/></g>
  <path d="M466 312 h248" stroke="#e3dccd" stroke-width="2"/>
  <!-- band 2 warning -->
  <rect x="500" y="328" width="214" height="92" rx="6" fill="#e0a33a" opacity=".18"/>
  <circle cx="480" cy="352" r="14" fill="#e0a33a"/><text x="480" y="360" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">!</text>
  <g stroke="#b9ad98" stroke-width="4" stroke-linecap="round"><path d="M510 344 h190 M510 368 h170 M510 392 h186"/></g>
  <path d="M466 436 h248" stroke="#e3dccd" stroke-width="2"/>
  <!-- band 3 go -->
  <g stroke="#b9ad98" stroke-width="4" stroke-linecap="round"><path d="M480 460 h200 M480 484 h150"/></g>
  <path d="M480 502 h176" stroke="#1f6f78" stroke-width="4" marker-end="url(#at)"/>
  <path d="M600 534 q10 -14 20 0 q10 14 20 0 q10 -14 24 -4" stroke="#3d3a3a" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- brackets and labels -->
  <g stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M748 110 h10 v184 h-10"/><path d="M748 334 h10 v84 h-10"/><path d="M748 452 h10 v54 h-10"/>
  </g>
  <text x="772" y="214" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">PRAISE</text>
  <text x="772" y="388" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">WARNING</text>
  <text x="772" y="492" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">GO</text>
</svg>
