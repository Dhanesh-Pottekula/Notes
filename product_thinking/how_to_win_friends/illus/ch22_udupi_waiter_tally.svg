<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>After closing at an Udupi restaurant the owner praises a young waiter and shows him a shortcut for tallying bills; within a week he closes fastest</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <path d="M-28 0 v-56 a28 28 0 0 1 56 0 v56 z" fill="currentColor"/>
      <rect x="-7" y="-92" width="14" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-106" r="21" fill="#c98a5e"/>
    </g>
    <g id="tumbler"><path d="M-9 0 l-3 -26 h24 l-3 26 z" fill="#c9d0d3"/><ellipse cx="0" cy="0" rx="16" ry="5" fill="#b8bec2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- ceiling fan -->
  <path d="M600 0 V40" stroke="#3d3a3a" stroke-width="4"/><ellipse cx="600" cy="44" rx="16" ry="8" fill="#3d3a3a"/>
  <path d="M584 44 h-90 l4 8 h86 z M616 44 h90 l-4 8 h-86 z" fill="#b9ad98"/>
  <!-- shelf with tumblers -->
  <path d="M420 150 H640" stroke="#8a6d5a" stroke-width="8"/>
  <use href="#tumbler" transform="translate(448 146)"/><use href="#tumbler" transform="translate(484 146)"/><use href="#tumbler" transform="translate(520 146)"/><use href="#tumbler" transform="translate(556 146)"/><use href="#tumbler" transform="translate(592 146)"/>
  <!-- background table with stacked chairs -->
  <rect x="660" y="300" width="140" height="10" fill="#cbbfa9"/><path d="M672 310 v80 M788 310 v80" stroke="#b9ad98" stroke-width="8"/>
  <path d="M680 300 v-50 h40 v26 M740 300 v-50 h40 v26" stroke="#b9ad98" stroke-width="6" fill="none"/>
  <!-- warm light over counter -->
  <path d="M830 120 V170" stroke="#3d3a3a" stroke-width="3"/><path d="M806 196 a24 26 0 0 1 48 0 z" fill="#e0a33a"/>
  <path d="M806 196 L760 380 H900 L854 196 z" fill="#e0a33a" opacity=".12"/>
  <!-- senior waiter behind counter -->
  <g transform="translate(830 410)" color="#f3ede0"><use href="#sit"/>
    <path d="M-21 -112 a21 21 0 0 1 42 0 q-21 -8 -42 0 z" fill="#b9b4ae"/>
    <path d="M-10 -112 l8 4 M10 -112 l-8 4" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-7" cy="-104" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-104" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -92 q7 -5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-24 -50 h48" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><path d="M-20 -42 h40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="720" y="380" width="216" height="14" rx="3" fill="#6b5446"/><rect x="730" y="394" width="196" height="166" fill="#8a6d5a"/>
  <rect x="750" y="414" width="156" height="60" rx="4" fill="#7a5e4c"/>

  <!-- chairs and legs -->
  <g fill="#6b5446"><rect x="374" y="468" width="72" height="10" rx="3"/><rect x="378" y="478" width="7" height="82"/><rect x="435" y="478" width="7" height="82"/>
  <rect x="564" y="468" width="72" height="10" rx="3"/><rect x="568" y="478" width="7" height="82"/><rect x="625" y="478" width="7" height="82"/></g>
  <path d="M398 470 h44 l4 86 h-50 z" fill="#ffffff" stroke="#d8cdb8" stroke-width="2"/>
  <rect x="574" y="470" width="14" height="88" rx="7" fill="#4a3f55"/><rect x="594" y="470" width="14" height="88" rx="7" fill="#4a3f55"/>
  <!-- owner seated -->
  <g transform="translate(410 468)" color="#ffffff"><use href="#sit"/>
    <path d="M-28 0 v-56 a28 28 0 0 1 56 0 v56 z" fill="none" stroke="#d8cdb8" stroke-width="2"/>
    <path d="M-21 -112 a21 21 0 0 1 42 0 q-21 -10 -42 0 z" fill="#2e2a2a"/>
    <path d="M-3 -122 h6 v8 h-6 z" fill="#e0a33a"/><circle cx="0" cy="-116" r="1.8" fill="#c0392b"/>
    <circle cx="-4" cy="-104" r="2.5" fill="#2e2a2a"/><circle cx="8" cy="-104" r="2.5" fill="#2e2a2a"/>
    <path d="M-2 -94 q7 5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M24 -56 l40 26 l24 -6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- young waiter seated -->
  <g transform="translate(600 468)" color="#efe2c4"><use href="#sit"/>
    <path d="M-21 -110 a21 21 0 0 1 42 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-104" r="2.5" fill="#2e2a2a"/><circle cx="4" cy="-104" r="2.5" fill="#2e2a2a"/>
    <path d="M-10 -94 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-24 -56 l-30 34 l-20 4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- marble table -->
  <rect x="340" y="460" width="320" height="14" rx="3" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M370 474 v86 M630 474 v86" stroke="#3d3a3a" stroke-width="8"/>
  <rect x="456" y="440" width="54" height="20" rx="2" fill="#ffffff" stroke="#b9ad98" stroke-width="1.5"/><path d="M464 448 h36 M464 454 h26" stroke="#b9ad98" stroke-width="2"/>
  <g fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"><rect x="410" y="448" width="34" height="12" transform="rotate(-8 427 454)"/><rect x="414" y="442" width="34" height="12" transform="rotate(6 431 448)"/></g>
  <rect x="520" y="436" width="30" height="24" rx="3" fill="#3d3a3a"/><rect x="524" y="440" width="22" height="6" fill="#c9e0c0"/>
  <path d="M454 410 C470 390 480 390 490 430" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#ah)"/>

  <!-- thought bubble: regular customer with filter coffee -->
  <circle cx="618" cy="326" r="7" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><circle cx="634" cy="302" r="10" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="580" y="180" width="160" height="110" rx="40" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="630" cy="222" r="18" fill="#d9a27a"/><path d="M612 218 a18 18 0 0 1 36 0 z" fill="#b9b4ae"/>
  <path d="M622 230 q8 6 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M606 284 v-28 a24 20 0 0 1 48 0 v28 z" fill="#7a4e7e"/>
  <use href="#tumbler" transform="translate(682 270)"/><path d="M676 240 q4 -8 0 -14 M688 240 q4 -8 0 -14" stroke="#cbbfa9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M712 214 c-4 -8 -18 -4 -12 6 l12 10 l12 -10 c6 -10 -8 -14 -12 -6 z" fill="#e07a5f"/>

  <!-- inset: stopwatches -->
  <rect x="24" y="70" width="360" height="230" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <g transform="translate(110 160)">
    <rect x="-8" y="-66" width="16" height="12" rx="2" fill="#3d3a3a"/><circle r="52" fill="#ffffff" stroke="#3d3a3a" stroke-width="6"/>
    <path d="M0 0 V-44 A44 44 0 1 1 -38 22 z" fill="#e07a5f" opacity=".8"/><path d="M0 0 L-38 22" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <path d="M182 160 H230" stroke="#7a4e7e" stroke-width="4" marker-end="url(#ah)"/>
  <g transform="translate(296 160)">
    <rect x="-8" y="-66" width="16" height="12" rx="2" fill="#3d3a3a"/><circle r="52" fill="#ffffff" stroke="#3d3a3a" stroke-width="6"/>
    <path d="M0 0 V-44 A44 44 0 0 1 31 -31 z" fill="#1f6f78" opacity=".85"/><path d="M0 0 L31 -31" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="110" y="270" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">BEFORE</text>
  <text x="296" y="270" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE WEEK</text>
</svg>
