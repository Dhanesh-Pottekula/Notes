<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A society secretary admires a contractor's neatly labelled parts cabinet over tea, and the broken lift gets fixed on Monday</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="lift"><rect x="0" y="0" width="100" height="150" rx="4" fill="#b8bec2"/><path d="M50 0 V150" stroke="#8f969a" stroke-width="3"/><rect x="-6" y="-12" width="112" height="12" rx="3" fill="#9a9590"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#cbbfa9"/>
  <!-- workbench with vice -->
  <rect x="40" y="440" width="230" height="14" rx="3" fill="#6b5446"/><rect x="52" y="454" width="12" height="106" fill="#6b5446"/><rect x="246" y="454" width="12" height="106" fill="#6b5446"/>
  <rect x="80" y="410" width="50" height="30" rx="4" fill="#3d3a3a"/><rect x="94" y="396" width="22" height="14" fill="#3d3a3a"/><path d="M130 420 h30" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <path d="M190 440 l30 -30 M210 440 l14 -14" stroke="#9a9590" stroke-width="6" stroke-linecap="round"/>
  <!-- parts cabinet -->
  <rect x="292" y="236" width="196" height="324" rx="6" fill="#7d8a90"/>
  <g fill="#9aa6ab">
    <rect x="304" y="250" width="54" height="40" rx="3"/><rect x="363" y="250" width="54" height="40" rx="3"/><rect x="422" y="250" width="54" height="40" rx="3"/>
    <rect x="304" y="298" width="54" height="40" rx="3"/><rect x="363" y="298" width="54" height="40" rx="3"/><rect x="422" y="298" width="54" height="40" rx="3"/>
    <rect x="304" y="346" width="54" height="40" rx="3"/><rect x="363" y="346" width="54" height="40" rx="3"/><rect x="422" y="346" width="54" height="40" rx="3"/>
    <rect x="304" y="394" width="54" height="40" rx="3"/><rect x="363" y="394" width="54" height="40" rx="3"/><rect x="422" y="394" width="54" height="40" rx="3"/>
    <rect x="304" y="442" width="54" height="40" rx="3"/><rect x="363" y="442" width="54" height="40" rx="3"/>
    <rect x="304" y="490" width="54" height="40" rx="3"/><rect x="363" y="490" width="54" height="40" rx="3"/><rect x="422" y="490" width="54" height="40" rx="3"/>
  </g>
  <g fill="#ffffff">
    <rect x="316" y="258" width="30" height="10"/><rect x="375" y="258" width="30" height="10"/><rect x="434" y="258" width="30" height="10"/>
    <rect x="316" y="306" width="30" height="10"/><rect x="375" y="306" width="30" height="10"/><rect x="434" y="306" width="30" height="10"/>
    <rect x="316" y="354" width="30" height="10"/><rect x="375" y="354" width="30" height="10"/><rect x="434" y="354" width="30" height="10"/>
    <rect x="316" y="402" width="30" height="10"/><rect x="375" y="402" width="30" height="10"/><rect x="434" y="402" width="30" height="10"/>
    <rect x="316" y="450" width="30" height="10"/><rect x="375" y="450" width="30" height="10"/>
    <rect x="316" y="498" width="30" height="10"/><rect x="375" y="498" width="30" height="10"/><rect x="434" y="498" width="30" height="10"/>
  </g>
  <!-- opened drawer -->
  <rect x="422" y="442" width="96" height="40" rx="3" fill="#9aa6ab"/><rect x="476" y="436" width="42" height="12" fill="#c9d0d3"/>
  <g fill="#e0a33a"><circle cx="486" cy="438" r="5"/><circle cx="498" cy="438" r="5"/><circle cx="510" cy="438" r="5"/></g>
  <rect x="434" y="450" width="30" height="10" fill="#ffffff"/>

  <!-- owner -->
  <g transform="translate(570 560) scale(1.14)"><use href="#m" color="#8f969a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><path d="M14 -158 l12 -10" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
    <circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-8 -140 q8 8 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 l-30 20 l-14 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l10 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- stool with two tea glasses -->
  <rect x="616" y="470" width="64" height="10" rx="3" fill="#8a6d5a"/><path d="M624 480 l-6 80 M672 480 l6 80" stroke="#6b5446" stroke-width="7" stroke-linecap="round"/>
  <path d="M628 470 l3 -26 h16 l3 26 z" fill="#e6f0f2" stroke="#b9c8cc" stroke-width="1.5"/><rect x="631" y="452" width="16" height="16" fill="#c98a5e" opacity=".7"/>
  <path d="M652 470 l3 -26 h16 l3 26 z" fill="#e6f0f2" stroke="#b9c8cc" stroke-width="1.5"/><rect x="655" y="452" width="16" height="16" fill="#c98a5e" opacity=".7"/>
  <path d="M638 436 q4 -8 0 -16 M662 436 q4 -8 0 -16" stroke="#cbbfa9" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- secretary -->
  <g transform="translate(740 560) scale(1.1)"><use href="#m" color="#d9e4ea"/>
    <path d="M-24 -100 h48 M-24 -86 h48 M-24 -72 h48 M-10 -126 v66 M10 -126 v66" stroke="#b9c8cc" stroke-width="2"/>
    <path d="M-19 -154 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#b9b4ae"/>
    <circle cx="-7" cy="-149" r="6" fill="none" stroke="#3d3a3a" stroke-width="2"/><circle cx="7" cy="-149" r="6" fill="none" stroke="#3d3a3a" stroke-width="2"/><path d="M-1 -149 h2" stroke="#3d3a3a" stroke-width="2"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 l-30 -26 l-4 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M676 370 l-10 -8 M690 356 l-4 -12" stroke="#e0a33a" stroke-width="3.5" stroke-linecap="round"/>

  <!-- left bubble: broken lift, waiting -->
  <text x="140" y="70" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">3 WEEKS</text>
  <rect x="30" y="90" width="220" height="200" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <use href="#lift" transform="translate(96 124)"/>
  <rect x="206" y="170" width="22" height="40" rx="4" fill="#3d3a3a"/>
  <circle cx="217" cy="228" r="13" fill="#e07a5f"/><path d="M211 222 l12 12 M223 222 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
  <g transform="translate(62 236)"><path d="M-12 -24 h24 l-12 20 l12 20 h-24 l12 -20 z" fill="#e0a33a"/><path d="M-14 -24 h28 M-14 16 h28" stroke="#8a6d5a" stroke-width="4" stroke-linecap="round"/></g>

  <!-- right bubble: Monday fix -->
  <text x="820" y="70" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">MONDAY</text>
  <rect x="710" y="90" width="220" height="200" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="728" y="112" width="70" height="74" rx="4" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/><rect x="728" y="112" width="70" height="18" rx="4" fill="#e07a5f"/>
  <text x="763" y="167" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b">MON</text>
  <circle cx="763" cy="160" r="29" fill="none" stroke="#1f6f78" stroke-width="3.5"/>
  <use href="#lift" transform="translate(834 136) scale(.76)"/>
  <circle cx="872" cy="196" r="15" fill="#3f9a5a"/><path d="M865 196 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g transform="translate(790 272) scale(.5)"><use href="#m" color="#3a6fb0"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M22 -104 l22 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="30" y="-78" width="40" height="28" rx="4" fill="#e07a5f"/><path d="M40 -78 v-8 h20 v8" stroke="#3d3a3a" stroke-width="4" fill="none"/>
  </g>
  <!-- goodwill arrow -->
  <path d="M612 352 C630 300 660 292 700 250" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
