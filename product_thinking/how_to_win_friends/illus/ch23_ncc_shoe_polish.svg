<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An NCC instructor polishes his own already shiny boot and points cadets to the polish kit; next day every shoe gleams</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="cadet">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="58" rx="6" fill="#55603a"/><rect x="3" y="-62" width="13" height="58" rx="6" fill="#55603a"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#6f7d4a"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -7 -38 0 z" fill="#2e2a2a"/>
      <circle cx="-6" cy="-146" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.5" fill="#2e2a2a"/>
    </g>
    <g id="shoe"><path d="M-14 0 v-12 a6 6 0 0 1 6 -6 h8 a6 6 0 0 1 6 6 v2 h8 a6 6 0 0 1 6 6 v4 z" fill="#1e1c1c"/></g>
    <g id="spark"><path d="M0 -9 l2.5 6.5 l6.5 2.5 l-6.5 2.5 l-2.5 6.5 l-2.5 -6.5 l-6.5 -2.5 l6.5 -2.5 z" fill="currentColor"/></g>
    <g id="tent"><path d="M-70 0 l70 -110 l70 110 z" fill="#6f7d4a"/><path d="M-14 0 l14 -40 l14 40 z" fill="#4a5530"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <circle cx="90" cy="180" r="40" fill="#e0a33a" opacity=".6"/>
  <use href="#tent" transform="translate(250 420)" opacity=".55"/><use href="#tent" transform="translate(420 420)" opacity=".55"/>
  <path d="M560 420 V160" stroke="#9a9590" stroke-width="6"/><path d="M563 166 h50 l-8 16 l8 16 h-50 z" fill="#e07a5f"/>
  <rect y="420" width="960" height="140" fill="#e6dcc6"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SET THE EXAMPLE</text>
  <!-- bench + instructor -->
  <rect x="60" y="500" width="170" height="12" rx="3" fill="#8a6d5a"/><path d="M74 512 v48 M216 512 v48" stroke="#6b5446" stroke-width="8"/>
  <g transform="translate(140 560)">
    <rect x="-18" y="-64" width="13" height="64" rx="6" fill="#55603a"/><rect x="4" y="-64" width="13" height="64" rx="6" fill="#55603a"/>
    <use href="#shoe" transform="translate(-12 0)"/>
    <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="#6f7d4a"/>
    <path d="M-20 -108 h16 M4 -108 h16" stroke="#e0a33a" stroke-width="4"/>
    <rect x="-6" y="-138" width="12" height="10" fill="#b07850"/>
    <circle cx="0" cy="-152" r="20" fill="#b07850"/>
    <path d="M-22 -160 q2 -18 24 -18 q20 2 18 12 l-38 10 z" fill="#8a3b3b"/>
    <circle cx="-7" cy="-152" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-152" r="2.5" fill="#2e2a2a"/>
    <path d="M-10 -142 q10 -5 20 0" stroke="#2e2a2a" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-6 -136 q6 3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 L54 -86" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 L-40 -76 L-4 -78" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(206 490) scale(1.6)"><use href="#shoe"/></g>
  <g color="#ffffff"><use href="#spark" transform="translate(218 462)"/><use href="#spark" transform="translate(196 470) scale(.6)"/></g>
  <rect x="120" y="474" width="26" height="12" rx="3" fill="#6b5446"/>
  <ellipse cx="100" cy="496" rx="12" ry="4" fill="#3d3a3a"/>
  <!-- cadets -->
  <g transform="translate(320 560)"><use href="#cadet"/>
    <path d="M-24 -62 h48 l4 22 q-14 6 -28 -2 q-14 8 -28 2 z" fill="#7e8c58"/>
    <path d="M-6 -136 q6 -3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -100 L-32 -60 M22 -100 L32 -60" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <g fill="#8a7a62"><path d="M-30 0 v-10 a6 6 0 0 1 6 -6 h10 a4 4 0 0 1 4 4 v12 z"/><path d="M4 0 v-12 a4 4 0 0 1 4 -4 h10 a6 6 0 0 1 6 6 v10 z"/></g>
  </g>
  <g transform="translate(392 560)"><use href="#cadet"/>
    <path d="M-6 -136 h12" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-22 -100 L-30 -60 M22 -100 L30 -60" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <g fill="#8a7a62"><path d="M-30 0 v-10 a6 6 0 0 1 6 -6 h10 a4 4 0 0 1 4 4 v12 z"/><path d="M4 0 v-12 a4 4 0 0 1 4 -4 h10 a6 6 0 0 1 6 6 v10 z"/></g>
  </g>
  <g transform="translate(464 560)"><use href="#cadet"/>
    <path d="M-6 -136 q6 -3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -100 L-40 -84" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <g fill="#8a7a62"><path d="M-30 0 v-10 a6 6 0 0 1 6 -6 h10 a4 4 0 0 1 4 4 v12 z"/><path d="M4 0 v-12 a4 4 0 0 1 4 -4 h10 a6 6 0 0 1 6 6 v10 z"/></g>
  </g>
  <!-- store room -->
  <rect x="580" y="330" width="90" height="230" fill="#cbbfa9"/><rect x="596" y="370" width="58" height="190" fill="#8a6d5a"/>
  <circle cx="625" cy="352" r="14" fill="#ffffff"/><ellipse cx="625" cy="354" rx="9" ry="5" fill="#3d3a3a"/><rect x="616" y="348" width="18" height="4" fill="#e0a33a"/>
  <path d="M200 400 C300 300 500 280 588 350" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- next day inset -->
  <text x="814" y="262" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEXT DAY</text>
  <rect x="696" y="280" width="236" height="140" rx="20" fill="#ffffff"/>
  <path d="M716 340 h196" stroke="#d8cdb8" stroke-width="4"/>
  <g transform="translate(742 338)"><use href="#shoe" transform="translate(-10 0)"/><use href="#shoe" transform="translate(12 0)"/></g>
  <g transform="translate(814 338)"><use href="#shoe" transform="translate(-10 0)"/><use href="#shoe" transform="translate(12 0)"/></g>
  <g transform="translate(886 338)"><use href="#shoe" transform="translate(-10 0)"/><use href="#shoe" transform="translate(12 0)"/></g>
  <g transform="translate(742 396)"><use href="#shoe" transform="translate(-10 0)"/><use href="#shoe" transform="translate(12 0)"/></g>
  <g transform="translate(814 396)"><use href="#shoe" transform="translate(-10 0)"/><use href="#shoe" transform="translate(12 0)"/></g>
  <path d="M716 398 h140" stroke="#d8cdb8" stroke-width="4"/>
  <g color="#e0a33a"><use href="#spark" transform="translate(742 310)"/><use href="#spark" transform="translate(820 304)"/><use href="#spark" transform="translate(892 312)"/><use href="#spark" transform="translate(770 370)"/><use href="#spark" transform="translate(836 368)"/></g>
  <g transform="translate(888 380)"><circle r="18" fill="#5f9e6e"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
</svg>
