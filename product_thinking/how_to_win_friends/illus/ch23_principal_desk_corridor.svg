<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A school principal moves his desk from his inner room into the front corridor beside the clerk's window and parents walk straight up</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <circle cx="-6" cy="-149" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-149" r="2.5" fill="#2e2a2a"/>
      <path d="M-6 -139 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- building walls -->
  <rect x="40" y="130" width="250" height="430" fill="#e9e1d2"/>
  <rect x="290" y="130" width="400" height="430" fill="#d7e6e3"/>
  <rect x="690" y="130" width="130" height="430" fill="#cbbfa9"/>
  <rect x="30" y="118" width="800" height="14" fill="#b9ad98"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="80" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">OPEN DOOR</text>
  <!-- inner room: empty, door wide open -->
  <rect x="70" y="200" width="120" height="70" rx="4" fill="#ffffff"/><path d="M84 220 h90 M84 236 h70 M84 252 h80" stroke="#cbbfa9" stroke-width="4"/>
  <rect x="80" y="520" width="150" height="34" rx="4" fill="none" stroke="#b9ad98" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M92 548 H300 M92 534 H300" stroke="#b9ad98" stroke-width="3" stroke-dasharray="4 10"/>
  <rect x="274" y="300" width="16" height="260" fill="#8a6d5a"/>
  <path d="M290 300 l-60 -22 v304 l60 -22 z" fill="#6b5446"/><circle cx="240" cy="440" r="4" fill="#e0a33a"/>
  <!-- calendar & notice board -->
  <rect x="320" y="180" width="70" height="80" rx="4" fill="#ffffff"/><rect x="320" y="180" width="70" height="24" rx="4" fill="#e07a5f"/>
  <text x="355" y="246" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">MON</text>
  <rect x="430" y="170" width="200" height="110" rx="4" fill="#8a6d5a"/><rect x="440" y="180" width="180" height="90" fill="#e9d5b0"/>
  <g fill="#ffffff"><rect x="452" y="190" width="44" height="54" transform="rotate(-4 474 217)"/><rect x="510" y="188" width="40" height="40"/><rect x="566" y="196" width="44" height="60" transform="rotate(5 588 226)"/></g>
  <!-- arrow from inner room to new desk -->
  <path d="M160 470 C210 380 300 380 360 440" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- principal seated at desk -->
  <g transform="translate(450 560)">
    <rect x="-16" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/><rect x="3" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/>
    <path d="M-24 -54 v-44 a24 24 0 0 1 48 0 v44 z" fill="#9cc3d8"/><path d="M-16 -54 v-50 l16 14 l16 -14 v50 z" fill="#4a5568"/>
    <rect x="-6" y="-130" width="12" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-144" r="19" fill="#c98a5e"/>
    <path d="M-19 -148 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#8f8a85"/>
    <circle cx="-7" cy="-145" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/><circle cx="7" cy="-145" r="6" fill="none" stroke="#2e2a2a" stroke-width="2"/>
    <circle cx="-7" cy="-145" r="1.8" fill="#2e2a2a"/><circle cx="7" cy="-145" r="1.8" fill="#2e2a2a"/>
    <path d="M-6 -134 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M22 -100 L64 -122" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="360" y="478" width="200" height="14" rx="3" fill="#8a6d5a"/><rect x="372" y="492" width="176" height="68" fill="#6b5446"/>
  <rect x="380" y="462" width="56" height="16" rx="2" fill="#ffffff"/><rect x="384" y="466" width="48" height="8" fill="#1f6f78"/>
  <rect x="460" y="468" width="50" height="10" rx="2" fill="#e07a5f"/>
  <path d="M528 478 a12 12 0 0 1 24 0 z" fill="#c9952e"/><circle cx="540" cy="464" r="3" fill="#c9952e"/>
  <!-- mother in yellow saree -->
  <g transform="translate(620 560)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-28 0 L-22 -102 a22 22 0 0 1 44 0 L28 0 z" fill="#e0a33a"/>
    <path d="M18 -118 L-16 -30" stroke="#e07a5f" stroke-width="7"/>
    <rect x="-5" y="-130" width="10" height="10" fill="#b07850"/>
    <circle cx="0" cy="-143" r="18" fill="#b07850"/>
    <path d="M-18 -146 a18 18 0 0 1 36 0 q-18 -8 -36 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-150" r="9" fill="#2e2a2a"/>
    <circle cx="-6" cy="-146" r="2" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2" fill="#2e2a2a"/><circle cx="0" cy="-154" r="1.8" fill="#e07a5f"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- clerk window -->
  <rect x="704" y="290" width="104" height="120" rx="4" fill="#3d3a3a"/><rect x="712" y="298" width="88" height="104" fill="#fbeedb"/>
  <g transform="translate(756 470)">
    <path d="M-22 -60 v-20 a22 22 0 0 1 44 0 v20 z" fill="#7a4e7e"/>
    <rect x="-5" y="-110" width="10" height="10" fill="#d9a27a"/>
    <circle cx="0" cy="-124" r="17" fill="#d9a27a"/>
    <path d="M-17 -128 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-125" r="2" fill="#2e2a2a"/><circle cx="6" cy="-125" r="2" fill="#2e2a2a"/>
    <path d="M-6 -116 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <path d="M736 398 L700 360" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
  <path d="M694 352 l-10 -6 M694 364 l-14 0 M700 346 l-6 -12" stroke="#7a4e7e" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#9a9590" stroke-width="3"><path d="M730 298 v104 M756 298 v104 M782 298 v104"/></g>
  <rect x="696" y="404" width="120" height="10" rx="2" fill="#8a6d5a"/>
  <!-- father and daughter walking in -->
  <g transform="translate(870 560)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -7 -38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -104 L-34 -60" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(822 560) scale(.66)"><use href="#m" color="#3f6ea8"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 v14 q-4 -10 -8 -12 h-22 q-4 2 -8 12 z" fill="#2e2a2a"/>
    <path d="M-22 -140 l-8 30 M22 -140 l8 30" stroke="#2e2a2a" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 -104 L44 -70" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
