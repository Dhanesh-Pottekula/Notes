<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mother tastes her son's too-salty sambar and kindly suggests curd rice tomorrow and rasam tonight; he winces and notes less salt next time</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="sit">
      <rect x="-16" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/><rect x="3" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/>
      <path d="M-22 -54 v-40 a22 22 0 0 1 44 0 v40 z" fill="currentColor"/>
      <rect x="-5" y="-122" width="10" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-134" r="17" fill="#c98a5e"/>
    </g>
    <g id="pot"><path d="M-30 0 v-34 h60 v34 z" fill="#b8bec2"/><ellipse cx="0" cy="-34" rx="30" ry="7" fill="#c8642e"/><path d="M-36 -26 h-6 M36 -26 h6" stroke="#9a9590" stroke-width="6" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">GENTLE HINT</text>
  <g transform="translate(480 560) scale(1.2) translate(-480 -560)">
  <!-- father and sister eating -->
  <use href="#sit" color="#1f6f78" transform="translate(140 560)"/>
  <path d="M123 422 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#8f8a85"/>
  <path d="M134 426 q6 -3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M130 434 q10 4 20 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M160 470 L170 444" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <use href="#sit" color="#e0a33a" transform="translate(220 560) scale(.85)"/>
  <path d="M205.5 442 a14.5 14 0 0 1 29 0 v18 q-2 -12 -5 -16 h-19 q-3 4 -5 16 z" fill="#2e2a2a"/>
  <circle cx="215" cy="447" r="2" fill="#2e2a2a"/><circle cx="225" cy="447" r="2" fill="#2e2a2a"/>
  <path d="M215 455 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- mother -->
  <g transform="translate(450 560) scale(1.06)">
    <rect x="-16" y="-56" width="13" height="56" rx="6" fill="#5f8f4e"/><rect x="3" y="-56" width="13" height="56" rx="6" fill="#5f8f4e"/>
    <path d="M-22 -54 v-40 a22 22 0 0 1 44 0 v40 z" fill="#5f8f4e"/><path d="M16 -108 L-14 -54" stroke="#e0a33a" stroke-width="6"/>
    <rect x="-5" y="-122" width="10" height="10" fill="#b07850"/>
    <circle cx="0" cy="-134" r="17" fill="#b07850"/>
    <path d="M-17 -137 a17 17 0 0 1 34 0 q-17 -8 -34 0 z" fill="#2e2a2a"/><path d="M-8 -150 q8 -4 16 0" stroke="#9a9590" stroke-width="3" fill="none"/><circle cx="15" cy="-134" r="7" fill="#2e2a2a"/>
    <circle cx="0" cy="-142" r="1.8" fill="#e07a5f"/>
    <path d="M-9 -140 l5 -3 M4 -143 l5 3" stroke="#2e2a2a" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-6" cy="-135" r="2" fill="#2e2a2a"/><circle cx="6" cy="-135" r="2" fill="#2e2a2a"/>
    <path d="M-6 -126 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-20 -96 L-16 -122" stroke="#b07850" stroke-width="9" stroke-linecap="round"/><path d="M-16 -124 l14 -2" stroke="#9a9590" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- son in apron -->
  <g transform="translate(700 560) scale(1.04)">
    <use href="#sit" color="#3f6ea8"/>
    <path d="M-16 -100 h32 v46 h-32 z" fill="#f3ede0"/><path d="M-12 -100 l-4 -14 M12 -100 l4 -14" stroke="#f3ede0" stroke-width="3"/>
    <path d="M-17 -138 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#2e2a2a"/>
    <path d="M-9 -136 l6 2 l-6 2 M9 -136 l-6 2 l6 2" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-6 -124 q3 -3 6 0 q3 3 6 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-20 -96 L-14 -120" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><path d="M-14 -122 l16 -2" stroke="#9a9590" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- table -->
  <rect x="80" y="510" width="760" height="12" rx="3" fill="#8a6d5a"/><rect x="96" y="522" width="728" height="38" fill="#6b5446"/>
  <g transform="translate(0 20)">
  <ellipse cx="140" cy="488" rx="34" ry="6" fill="#b8bec2"/><ellipse cx="140" cy="484" rx="20" ry="5" fill="#ffffff"/>
  <use href="#pot" transform="translate(570 490)"/>
  <path d="M556 446 q-5 -10 0 -20 M576 446 q-5 -10 0 -20" stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M290 490 q30 -40 60 0 z" fill="#ffffff"/><rect x="286" y="486" width="68" height="6" rx="3" fill="#b8bec2"/>
  <rect x="372" y="456" width="22" height="34" rx="4" fill="#d4d8db"/>
  <rect x="628" y="460" width="22" height="30" rx="4" fill="#ffffff"/><rect x="628" y="456" width="22" height="8" rx="3" fill="#9a9590"/>
  <g transform="translate(652 450)"><circle r="11" fill="#e07a5f"/><rect x="-1.8" y="-7" width="3.6" height="9" rx="1.5" fill="#fff"/><circle cy="5" r="2" fill="#fff"/></g>
  </g>
  </g>
  <!-- mother's bubble -->
  <rect x="290" y="150" width="300" height="140" rx="20" fill="#ffffff"/><path d="M430 290 l10 26 l18 -26 z" fill="#ffffff"/>
  <path d="M310 262 q40 -50 80 0 z" fill="#f3ede0"/><rect x="306" y="258" width="88" height="8" rx="4" fill="#b8bec2"/>
  <g fill="#ffffff" stroke="#cbbfa9" stroke-width="1"><circle cx="336" cy="244" r="3"/><circle cx="348" cy="238" r="3"/><circle cx="360" cy="246" r="3"/><circle cx="352" cy="250" r="3"/></g>
  <rect x="304" y="166" width="140" height="44" rx="6" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><rect x="304" y="166" width="140" height="10" rx="4" fill="#e07a5f"/>
  <text x="374" y="202" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b" letter-spacing="1">TOMORROW</text>
  <path d="M450 234 h-6" stroke="none"/>
  <g transform="translate(536 266)"><path d="M-34 0 v-30 h68 v30 z" fill="#b8bec2"/><ellipse cx="0" cy="-30" rx="34" ry="7" fill="#d9773e"/><path d="M-12 -42 q-6 -12 0 -24 M10 -42 q-6 -12 0 -24" stroke="#cbbfa9" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
  <path d="M458 236 h20 M468 226 v20" stroke="#1f6f78" stroke-width="5" stroke-linecap="round"/>
  <!-- son's thought bubble -->
  <circle cx="796" cy="384" r="6" fill="#ffffff"/><circle cx="790" cy="362" r="9" fill="#ffffff"/>
  <rect x="690" y="200" width="220" height="150" rx="26" fill="#ffffff"/>
  <path d="M720 300 v-40 q0 -10 14 -10 q14 0 14 10 v40 z" fill="#e9e1d2"/><path d="M722 256 h24" stroke="#9a9590" stroke-width="5"/>
  <g fill="#9a9590"><circle cx="730" cy="248" r="2"/><circle cx="738" cy="248" r="2"/></g>
  <path d="M780 226 v54" stroke="#e07a5f" stroke-width="6" marker-end="url(#ah)"/>
  <text x="850" y="268" text-anchor="middle" font-size="20" font-weight="700" fill="#2b2b2b">less salt</text>
  <path d="M812 280 h76" stroke="#e0a33a" stroke-width="3" stroke-linecap="round"/>
</svg>
