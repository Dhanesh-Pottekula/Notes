<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A flat owner bags the painters' mess herself one evening, thanks the mistri next morning, and the crew then bags its own rubbish</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/>
    </g>
    <g id="stairs"><path d="M0 0 v-40 h30 v-40 h30 v-40 h30 v-40 h30 v-40 h12 V0 z" fill="#b9ad98"/><path d="M0 -40 h30 M30 -80 h30 M60 -120 h30 M90 -160 h30" stroke="#9a9590" stroke-width="4"/></g>
    <g id="paper"><rect x="-26" y="-8" width="52" height="10" fill="#ffffff"/><circle cx="-10" cy="-4" r="4" fill="#1f6f78"/><circle cx="12" cy="-2" r="3" fill="#e0a33a"/></g>
    <g id="tin"><rect x="-12" y="-30" width="24" height="30" rx="3" fill="#b8bec2"/><rect x="-12" y="-30" width="24" height="6" fill="#9a9590"/><path d="M-12 -18 h24" stroke="#e0a33a" stroke-width="4"/></g>
    <g id="tick"><circle r="14" fill="#5f9e6e"/><path d="M-6 0 l4 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="24" y="130" width="432" height="430" fill="#e9e1d2"/><rect x="504" y="130" width="432" height="430" fill="#e9e1d2"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <line x1="480" y1="20" x2="480" y2="620" stroke="#d8cdb8" stroke-width="4"/>
  <text x="240" y="76" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SHE CLEANS</text>
  <text x="720" y="76" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">THEY CLEAN</text>
  <!-- LEFT: evening -->
  <rect x="300" y="170" width="90" height="80" rx="4" fill="#3f4a66"/><circle cx="362" cy="196" r="13" fill="#f3e3b0"/><circle cx="356" cy="192" r="11" fill="#3f4a66"/>
  <use href="#stairs" transform="translate(334 560)"/>
  <rect x="40" y="300" width="96" height="260" fill="#6b5446"/><rect x="48" y="308" width="80" height="252" fill="#3d3a3a"/>
  <path d="M48 308 l46 14 v238 l-46 0 z" fill="#8a6d5a"/>
  <circle cx="114" cy="380" r="14" fill="#d9a27a"/><path d="M100 376 a14 13 0 0 1 28 0 z" fill="#2e2a2a"/>
  <path d="M106 384 l6 -2 M118 382 l6 2" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
  <use href="#paper" transform="translate(150 556) rotate(-6)"/><use href="#paper" transform="translate(270 552) rotate(8)"/>
  <use href="#paper" transform="translate(330 528) rotate(-12)"/><use href="#tin" transform="translate(320 560)"/><use href="#tin" transform="translate(350 560) rotate(80 0 -15)"/>
  <rect x="356" y="532" width="40" height="8" rx="2" fill="#e0a33a" transform="rotate(-20 376 536)"/>
  <!-- woman kneeling with sack -->
  <g transform="translate(210 560)">
    <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
    <rect x="-34" y="-22" width="54" height="22" rx="10" fill="#4a3f55"/>
    <path d="M-28 -20 v-52 a22 22 0 0 1 44 0 v52 z" fill="#7a4e7e"/>
    <rect x="-11" y="-104" width="10" height="10" fill="#c98a5e"/>
    <circle cx="-4" cy="-116" r="17" fill="#c98a5e"/>
    <path d="M-21 -119 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#2e2a2a"/><circle cx="-20" cy="-110" r="7" fill="#2e2a2a"/>
    <circle cx="4" cy="-117" r="2" fill="#2e2a2a"/><path d="M0 -108 h8" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M14 -70 L44 -50" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
    <path d="M10 -56 L40 -30" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  </g>
  <path d="M244 560 q-6 -60 8 -80 h50 q14 20 8 80 z" fill="#ffffff"/><path d="M252 480 h50" stroke="#cbbfa9" stroke-width="4"/>
  <rect x="256" y="470" width="40" height="12" fill="#ffffff" transform="rotate(-10 276 476)"/>
  <!-- RIGHT: morning, clean -->
  <rect x="790" y="170" width="90" height="80" rx="4" fill="#cfe6ef"/><circle cx="835" cy="210" r="16" fill="#e0a33a"/>
  <use href="#stairs" transform="translate(814 560)"/>
  <rect x="520" y="300" width="96" height="260" fill="#6b5446"/><rect x="528" y="308" width="80" height="252" fill="#fbeedb"/>
  <path d="M528 308 l-20 12 v232 l20 8 z" fill="#8a6d5a"/>
  <!-- owner -->
  <g transform="translate(640 560)">
    <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-26 -40 L-22 -102 a22 22 0 0 1 44 0 L26 -40 z" fill="#7a4e7e"/>
    <rect x="-5" y="-130" width="10" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-143" r="18" fill="#c98a5e"/>
    <path d="M-18 -146 a18 18 0 0 1 36 0 q-18 -8 -36 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-138" r="7" fill="#2e2a2a"/>
    <circle cx="-5" cy="-145" r="2" fill="#2e2a2a"/><circle cx="7" cy="-145" r="2" fill="#2e2a2a"/>
    <path d="M-5 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 L44 -120" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- mistri -->
  <g transform="translate(740 560)"><use href="#m" color="#ffffff"/>
    <circle cx="-14" cy="-90" r="3" fill="#1f6f78"/><circle cx="10" cy="-76" r="4" fill="#e0a33a"/><circle cx="-4" cy="-110" r="2.5" fill="#1f6f78"/>
    <path d="M-22 -156 a22 18 0 0 1 44 0 z" fill="#cbbfa9"/><path d="M-34 -158 h20 v6 h-20 z" fill="#cbbfa9"/>
    <circle cx="-6" cy="-147" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-147" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -137 q7 5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 L-30 -58 M22 -104 L30 -58" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- bubble from owner -->
  <rect x="560" y="140" width="200" height="120" rx="18" fill="#ffffff"/><path d="M640 260 l4 24 l22 -24 z" fill="#ffffff"/>
  <g transform="translate(586 240) scale(.6)"><use href="#stairs"/></g>
  <path d="M600 160 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z" fill="#e0a33a"/>
  <path d="M676 214 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#e0a33a"/>
  <use href="#tick" transform="translate(708 180)"/>
  <path d="M706 238 c-10 -10 -22 -2 -14 8 l14 12 l14 -12 c8 -10 -4 -18 -14 -8 z" fill="#e07a5f"/>
  <!-- painter bags rubbish -->
  <path d="M808 560 q-6 -54 6 -70 l12 -10 l12 10 q12 16 6 70 z" fill="#3d3a3a"/><path d="M820 482 l6 -12 l6 12" stroke="#e0a33a" stroke-width="4" fill="none"/>
  <g transform="translate(880 560) scale(.92)"><use href="#m" color="#cfd8e3"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -7 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-147" r="2.5" fill="#2e2a2a"/><path d="M-12 -138 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 L-50 -82" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <use href="#tin" transform="translate(920 560)"/>
</svg>
