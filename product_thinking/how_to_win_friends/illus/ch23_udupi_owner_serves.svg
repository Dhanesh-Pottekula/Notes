<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>An Udupi restaurant owner leaves his cash counter to serve filter coffee to a waiting family while waiters watch</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -7 -38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sit">
      <rect x="-16" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/><rect x="3" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/>
      <path d="M-22 -54 v-40 a22 22 0 0 1 44 0 v40 z" fill="currentColor"/>
      <rect x="-5" y="-122" width="10" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-134" r="17" fill="#c98a5e"/>
      <circle cx="-6" cy="-136" r="2" fill="#2e2a2a"/><circle cx="6" cy="-136" r="2" fill="#2e2a2a"/>
      <path d="M-6 -127 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="tum"><path d="M-14 0 h28 l-4 -6 h-20 z" fill="#b8bec2"/><path d="M-8 -6 l-2 -26 h20 l-2 26 z" fill="#d4d8db"/><ellipse cx="0" cy="-32" rx="10" ry="3" fill="#a9744a"/><path d="M-3 -38 q-4 -8 0 -16 M5 -38 q-4 -8 0 -16" stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">LEAD BY EXAMPLE</text>
  <!-- cash counter, empty stool -->
  <rect x="40" y="200" width="80" height="64" rx="4" fill="#8a6d5a"/><rect x="48" y="208" width="64" height="48" fill="#e0a33a"/><circle cx="80" cy="232" r="12" fill="#f6f1e7"/>
  <rect x="30" y="420" width="190" height="14" rx="3" fill="#6b5446"/><rect x="40" y="434" width="170" height="126" fill="#8a6d5a"/>
  <rect x="60" y="390" width="60" height="30" rx="4" fill="#3d3a3a"/><rect x="68" y="396" width="44" height="10" fill="#1f6f78"/>
  <rect x="226" y="470" width="44" height="10" rx="4" fill="#cbbfa9"/><path d="M234 480 v80 M262 480 v80" stroke="#b9ad98" stroke-width="6"/>
  <!-- wall clock -->
  <circle cx="440" cy="170" r="34" fill="#ffffff"/><circle cx="440" cy="170" r="34" fill="none" stroke="#6b5446" stroke-width="6"/>
  <path d="M440 170 L462 157" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/><path d="M440 170 L428 177" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <!-- family seated -->
  <use href="#sit" color="#1f6f78" transform="translate(340 560)"/>
  <path d="M323 422 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#2e2a2a"/>
    <use href="#sit" color="#5f8f4e" transform="translate(410 560)"/>
  <path d="M393 422 a17 17 0 0 1 34 0 v26 q-2 -16 -6 -24 h-22 q-4 8 -6 24 z" fill="#2e2a2a"/>
  <use href="#sit" color="#e0a33a" transform="translate(470 560) scale(.78)"/>
  <path d="M456.7 452.3 a13.3 12.5 0 0 1 26.6 0 q-13.3 -4 -26.6 0 z" fill="#2e2a2a"/>
  <!-- table -->
  <rect x="300" y="500" width="260" height="12" rx="3" fill="#b8bec2"/><rect x="314" y="512" width="232" height="48" fill="#cbbfa9"/>
  <use href="#tum" transform="translate(530 500)"/><use href="#tum" transform="translate(390 500)"/>
  <!-- owner -->
  <g transform="translate(610 560) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -64 h48 l4 64 h-56 z" fill="#f3ede0"/><path d="M-26 -10 h52" stroke="#e0a33a" stroke-width="4"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-6 -138 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 L-70 -96" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 L66 -112" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="62" y="-128" width="20" height="26" rx="2" fill="#ffffff" stroke="#cbbfa9" stroke-width="1.5"/>
  </g>
  <!-- path from counter -->
  <path d="M248 446 C300 300 520 280 586 360" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- kitchen door with hatch -->
  <rect x="860" y="250" width="90" height="310" fill="#6b5446"/><rect x="872" y="262" width="66" height="298" fill="#8a6d5a"/><rect x="872" y="300" width="66" height="40" fill="#3d3a3a"/>
  <!-- waiters -->
  <g transform="translate(720 560)"><use href="#m" color="#8a3b3b"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="0" cy="-137" r="3" fill="#2e2a2a"/>
    <path d="M-22 -104 L-48 -116" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(790 560)"><use href="#m" color="#8a3b3b"/>
    <circle cx="-6" cy="-148" r="3.5" fill="#ffffff"/><circle cx="6" cy="-148" r="3.5" fill="#ffffff"/><circle cx="-6" cy="-148" r="2" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2" fill="#2e2a2a"/>
  </g>
  <g transform="translate(848 560)"><use href="#m" color="#8a3b3b"/>
    <path d="M-5 -138 h10" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M18 -104 q22 -30 -8 -54" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
