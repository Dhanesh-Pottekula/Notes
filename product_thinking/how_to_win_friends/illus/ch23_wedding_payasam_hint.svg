<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a Kerala wedding an aunt hands payasam to noisy cousins and points them to the verandah</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-26" y="-112" width="52" height="60" rx="6" fill="#b9ad98"/>
      <rect x="-30" y="-58" width="60" height="9" rx="3" fill="#cbbfa9"/>
      <path d="M-26 -50 v50 M26 -50 v50" stroke="#b9ad98" stroke-width="5"/>
      <rect x="-16" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/><rect x="3" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/>
      <path d="M-22 -54 v-40 a22 22 0 0 1 44 0 v40 z" fill="currentColor"/>
      <rect x="-5" y="-122" width="10" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-134" r="17" fill="#c98a5e"/>
      <circle cx="-6" cy="-136" r="2" fill="#2e2a2a"/><circle cx="6" cy="-136" r="2" fill="#2e2a2a"/>
      <path d="M-6 -127 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="cup"><path d="M-7 -12 h14 l-2 12 h-10 z" fill="#ffffff" stroke="#cbbfa9" stroke-width="1"/><ellipse cx="0" cy="-12" rx="7" ry="2.5" fill="#d9a35a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">GIFT, NOT GLARE</text>
  <!-- marigold strings -->
  <path d="M30 120 q115 50 230 0" stroke="#e0a33a" stroke-width="7" fill="none" stroke-dasharray="2 11" stroke-linecap="round"/>
  <path d="M260 120 q115 50 230 0" stroke="#e07a5f" stroke-width="7" fill="none" stroke-dasharray="2 11" stroke-linecap="round"/>
  <!-- mandapam -->
  <rect x="30" y="500" width="220" height="60" fill="#8a6d5a"/><rect x="30" y="494" width="220" height="10" fill="#6b5446"/>
  <rect x="40" y="200" width="14" height="294" fill="#cbbfa9"/><rect x="226" y="200" width="14" height="294" fill="#cbbfa9"/>
  <path d="M30 200 h220 l-20 -36 h-180 z" fill="#1f6f78"/>
  <path d="M60 494 q-30 -80 10 -150 q10 80 -10 150 z M222 494 q30 -80 -10 -150 q-10 80 10 150 z" fill="#5f8f4e"/>
  <!-- brass lamp -->
  <rect x="196" y="420" width="6" height="74" fill="#c9952e"/><ellipse cx="199" cy="494" rx="14" ry="4" fill="#c9952e"/><ellipse cx="199" cy="420" rx="16" ry="5" fill="#e0a33a"/><path d="M199 414 q-5 -8 0 -16 q5 8 0 16 z" fill="#e07a5f"/>
  <!-- priest seated cross-legged -->
  <ellipse cx="128" cy="494" rx="44" ry="12" fill="#ffffff"/>
  <path d="M106 488 v-48 a22 22 0 0 1 44 0 v48 z" fill="#ffffff"/>
  <rect x="123" y="414" width="10" height="10" fill="#b07850"/>
  <circle cx="128" cy="400" r="17" fill="#b07850"/>
  <path d="M112 394 a16 14 0 0 1 32 0 q-16 -8 -32 0 z" fill="#e8e3da"/>
  <path d="M106 448 l26 18 M150 448 l-12 18" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  <rect x="124" y="458" width="26" height="18" rx="2" fill="#e07a5f"/>
  <path d="M160 392 q8 -6 0 -12 M170 396 q12 -10 0 -22" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- cousins -->
  <use href="#sit" color="#e0a33a" transform="translate(300 560)"/>
  <path d="M283 422 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#2e2a2a"/>
  <use href="#sit" color="#1f6f78" transform="translate(380 560)"/>
  <path d="M363 422 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#2e2a2a"/>
  <use href="#sit" color="#e07a5f" transform="translate(460 560)"/>
  <path d="M443 422 a17 17 0 0 1 34 0 v26 q-2 -16 -6 -24 h-22 q-4 8 -6 24 z" fill="#2e2a2a"/>
  <path d="M440 472 l18 -40" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
  <use href="#sit" color="#ffffff" transform="translate(540 560)"/>
  <path d="M523 422 a17 16 0 0 1 34 0 q-17 -5 -34 0 z" fill="#2e2a2a"/>
  <path d="M560 470 l20 -26" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <use href="#cup" transform="translate(584 446)"/>
  <!-- chatter squiggles -->
  <g stroke="#e07a5f" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M320 392 q6 -8 0 -16 M330 396 q10 -14 0 -26"/><path d="M398 390 q6 -8 0 -16 M408 394 q10 -14 0 -26"/>
  </g>
  <!-- aunt -->
  <g transform="translate(660 560) scale(1.12)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-28 0 L-22 -102 a22 22 0 0 1 44 0 L28 0 z" fill="#f3ede0"/>
    <path d="M-28 0 h56 v-8 h-56 z" fill="#e0a33a"/>
    <path d="M20 -116 L-14 -40" stroke="#e0a33a" stroke-width="7"/>
    <rect x="-5" y="-130" width="10" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-143" r="18" fill="#c98a5e"/>
    <path d="M-18 -146 a18 18 0 0 1 36 0 q-18 -8 -36 0 z" fill="#9a9590"/><circle cx="14" cy="-158" r="8" fill="#9a9590"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="-6" cy="-147" r="2" fill="#2e2a2a"/><circle cx="6" cy="-147" r="2" fill="#2e2a2a"/>
    <path d="M-20 -104 L-58 -96" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M20 -104 L46 -150" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- tray -->
  <ellipse cx="596" cy="453" rx="34" ry="6" fill="#b8bec2"/>
  <use href="#cup" transform="translate(582 450)"/><use href="#cup" transform="translate(600 450)"/><use href="#cup" transform="translate(616 450)"/>
  <!-- doorway to verandah -->
  <rect x="760" y="230" width="160" height="330" fill="#8a6d5a"/>
  <rect x="774" y="244" width="132" height="316" fill="#fbeedb"/>
  <circle cx="870" cy="290" r="18" fill="#e0a33a"/>
  <path d="M800 560 q4 -120 -6 -210" stroke="#8a6d5a" stroke-width="8" fill="none"/>
  <path d="M794 350 q-30 -6 -40 20 M794 350 q30 -10 46 10 M794 350 q-14 -26 -40 -24 M794 350 q14 -26 42 -22" stroke="#5f8f4e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <rect x="820" y="500" width="76" height="10" rx="3" fill="#8a6d5a"/><path d="M828 510 v40 M888 510 v40" stroke="#6b5446" stroke-width="6"/>
  <text x="840" y="214" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">VERANDAH</text>
  <!-- gentle nudge arrow -->
  <path d="M624 330 C660 250 720 250 772 300" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
