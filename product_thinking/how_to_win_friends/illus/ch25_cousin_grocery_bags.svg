<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A teenage cousin drags one bag sulkily when ordered, and happily carries the rice sack and a second bag when asked for help</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="woman">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-40" width="12" height="40" rx="5" fill="#f3ede0"/><rect x="2" y="-40" width="12" height="40" rx="5" fill="#f3ede0"/>
      <path d="M-24 -36 l4 -66 a20 20 0 0 1 40 0 l4 66 z" fill="#e07a5f"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="19" fill="#d9a27a"/>
      <path d="M-20 -146 a20 20 0 0 1 40 0 q-4 -10 -20 -12 q-16 2 -20 12 z" fill="#2e2a2a"/><circle cx="0" cy="-170" r="9" fill="#2e2a2a"/>
    </g>
    <g id="teen">
      <use href="#m" color="#9a9590"/>
      <path d="M-22 -128 q22 -16 44 0 l-4 10 q-18 -8 -36 0 z" fill="#86817c"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 v4 q-19 -10 -38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="auto">
      <ellipse cx="95" cy="2" rx="100" ry="7" fill="#000" opacity=".08"/>
      <path d="M8 -44 Q2 -118 40 -146 H186 V-44 Z" fill="#e0a33a"/>
      <path d="M26 -146 Q36 -170 70 -170 H186 Q196 -170 196 -158 V-140 H26 z" fill="#3d3a3a"/>
      <path d="M20 -66 Q20 -118 46 -136 H78 V-66 z" fill="#e6efec"/>
      <rect x="100" y="-136" width="80" height="78" rx="6" fill="#4a3c33"/>
      <rect x="2" y="-62" width="194" height="24" rx="8" fill="#3f8a5a"/>
      <circle cx="34" cy="-20" r="21" fill="#3d3a3a"/><circle cx="34" cy="-20" r="8" fill="#b9ad98"/>
      <circle cx="164" cy="-20" r="21" fill="#3d3a3a"/><circle cx="164" cy="-20" r="8" fill="#b9ad98"/>
    </g>
    <g id="sack"><rect x="-26" y="-50" width="52" height="54" rx="12" fill="#f3ede0" stroke="#cbbfa9" stroke-width="2"/><path d="M-26 -36 q26 -8 52 0" stroke="#cbbfa9" stroke-width="3" fill="none"/><rect x="-14" y="-24" width="28" height="12" rx="2" fill="#1f6f78"/></g>
    <g id="bag"><path d="M-16 -32 h32 l4 32 h-40 z" fill="#7a4e7e"/><path d="M-8 -32 q8 -16 16 0" stroke="#7a4e7e" stroke-width="4" fill="none"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 40 V600" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ORDER</text>
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASK</text>

  <!-- LEFT -->
  <rect x="380" y="270" width="90" height="290" fill="#e8dcc6"/>
  <rect x="394" y="390" width="62" height="170" fill="#6b5446"/><circle cx="446" cy="478" r="4" fill="#e0a33a"/>
  <path d="M404 360 l10 -14 l6 12 l10 -16 l6 14 l12 -14" stroke="#e07a5f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(20 560) scale(.9)"><use href="#auto"/></g>
  <use href="#sack" transform="translate(130 504) scale(.8)"/><use href="#bag" transform="translate(150 506) scale(.8)"/>
  <!-- older cousin, hands on hips, pointing -->
  <g transform="translate(232 560)"><use href="#woman"/>
    <path d="M-7 -146 h5 M2 -146 h5" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-9 -154 l7 3 M9 -154 l-7 3" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-5 -134 h10" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M18 -104 l16 26 l-16 14" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-18 -104 l-60 -12" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- teen dragging one small bag, phone in hand -->
  <g transform="translate(330 560)"><use href="#teen"/>
    <path d="M-8 -142 h6 M3 -142 h6" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -130 q6 -5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l14 26 l-4 -16" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="26" y="-96" width="14" height="22" rx="3" fill="#3d3a3a"/>
    <path d="M-22 -104 l-22 50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <use href="#bag" transform="translate(278 560) rotate(-12) scale(.7)"/><path d="M286 506 l-6 30" stroke="#7a4e7e" stroke-width="3"/>
  <!-- snail -->
  <g transform="translate(372 558)"><path d="M-18 0 h34 q6 0 6 -6" stroke="#b9876a" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="-4" cy="-12" r="11" fill="#e0a33a"/><path d="M-4 -12 m-5 0 a5 5 0 1 0 5 -5" stroke="#b9876a" stroke-width="2.5" fill="none"/><path d="M20 -8 l4 -10" stroke="#b9876a" stroke-width="2.5"/></g>

  <!-- RIGHT -->
  <rect x="860" y="270" width="100" height="290" fill="#e8dcc6"/>
  <rect x="874" y="390" width="70" height="170" fill="#fbeedb"/>
  <path d="M874 390 l-30 14 v170 l30 -14 z" fill="#6b5446"/>
  <circle cx="910" cy="436" r="12" fill="#c98a5e"/><path d="M898 436 a12 12 0 0 1 24 0 z" fill="#2e2a2a"/><path d="M896 476 v-20 a14 14 0 0 1 28 0 v20 z" fill="#1f6f78"/>
  <rect x="884" y="486" width="52" height="14" rx="3" fill="#9a9590"/><path d="M894 486 v-12 h32 v12" fill="#b8bec2"/>
  <g transform="translate(494 560) scale(.9)"><use href="#auto"/></g>
  <use href="#bag" transform="translate(620 506) scale(.8)"/>
  <!-- older cousin, tired, hand on back -->
  <g transform="translate(700 560)"><use href="#woman"/>
    <path d="M-8 -146 q4 3 8 0 M2 -146 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-5 -133 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M18 -104 l12 30 l-14 10" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-18 -104 l-10 32 l12 10" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- her request bubble -->
  <rect x="560" y="136" width="170" height="110" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M676 244 l14 140 l18 -140" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M678 242 h28" stroke="#ffffff" stroke-width="5"/>
  <use href="#sack" transform="translate(618 228) scale(1.3)"/>
  <text x="694" y="216" text-anchor="middle" font-size="64" font-weight="800" fill="#7a4e7e">?</text>
  <!-- teen carrying sack on shoulder and a second bag -->
  <g transform="translate(800 560)"><use href="#teen"/>
    <path d="M-8 -146 q4 -4 8 0 M2 -146 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-8 -134 q8 8 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M22 -104 l14 -34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-6 46" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <use href="#sack" transform="translate(842 434) rotate(10)"/>
  <use href="#bag" transform="translate(770 534)"/>
  <circle cx="850" cy="300" r="20" fill="#3f9a5a"/><path d="M841 300 l6 6 l12 -13" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>
