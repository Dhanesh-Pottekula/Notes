<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A driving instructor asks her learner a question about the turn ahead, and the learner signals and takes the turn on her own</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <text x="210" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASK</text>
  <text x="690" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">OWN DECISION</text>
  <!-- windshield view -->
  <path d="M110 92 H850 Q878 92 882 120 L912 420 H48 L78 120 Q82 92 110 92 Z" fill="#e6efec"/>
  <path d="M60 200 H900 L912 420 H48 Z" fill="#c9d3a8"/>
  <!-- trees -->
  <g fill="#7f9a6a"><circle cx="370" cy="190" r="22"/><circle cx="410" cy="182" r="26"/><circle cx="820" cy="172" r="30"/><circle cx="868" cy="188" r="22"/></g>
  <g fill="#6b5446"><rect x="406" y="200" width="7" height="16"/><rect x="816" y="196" width="8" height="26"/></g>
  <!-- roads -->
  <path d="M200 420 L468 200 H492 L760 420 Z" fill="#b9ad98"/>
  <path d="M520 232 L900 220 L906 282 L566 270 Z" fill="#b9ad98"/>
  <path d="M480 404 L480 214" stroke="#f6f1e7" stroke-width="5" stroke-dasharray="18 16"/>
  <path d="M600 252 H880" stroke="#f6f1e7" stroke-width="4" stroke-dasharray="14 14"/>
  <!-- painted lane arrow -->
  <path d="M540 360 v-34 q0 -14 14 -14 h16" stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M566 302 l16 10 l-16 10 z" fill="#ffffff"/>
  <!-- distant lorry -->
  <rect x="468" y="186" width="24" height="16" rx="2" fill="#e0a33a"/><rect x="486" y="192" width="10" height="10" rx="2" fill="#c98a3a"/>
  <!-- intended path -->
  <path d="M600 396 C560 330 580 270 720 252" stroke="#7a4e7e" stroke-width="5" fill="none" stroke-dasharray="12 9" marker-end="url(#ah)"/>
  <!-- frame -->
  <path d="M110 92 H850 Q878 92 882 120 L912 420 H48 L78 120 Q82 92 110 92 Z" fill="none" stroke="#3d3a3a" stroke-width="16" stroke-linejoin="round"/>
  <!-- dashboard -->
  <path d="M20 430 Q480 396 940 430 V500 H20 Z" fill="#6b6461"/>
  <!-- indicator light -->
  <circle cx="820" cy="452" r="22" fill="#4a4545"/><path d="M808 444 h12 v-8 l14 16 l-14 16 v-8 h-12 z" fill="#e0a33a"/>
  <path d="M850 434 l10 -8 M854 452 h12 M850 470 l10 8" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  <!-- steering wheel -->
  <circle cx="660" cy="470" r="76" fill="none" stroke="#2f2c2c" stroke-width="16"/>
  <!-- learner (from behind) -->
  <path d="M600 470 q0 -64 60 -64 q60 0 60 64 v170 h-120 z" fill="#e0a33a"/>
  <rect x="650" y="386" width="20" height="22" fill="#c98a5e"/>
  <circle cx="660" cy="368" r="34" fill="#2e2a2a"/>
  <path d="M660 398 q-6 26 0 52 q6 -26 0 -52 z" fill="#2e2a2a"/><circle cx="660" cy="452" r="5" fill="#e07a5f"/>
  <path d="M612 440 L594 410" stroke="#d9a27a" stroke-width="13" stroke-linecap="round"/>
  <path d="M708 440 L726 410" stroke="#d9a27a" stroke-width="13" stroke-linecap="round"/>
  <!-- instructor, head turned to learner -->
  <path d="M220 480 q0 -66 64 -66 q64 0 64 66 v160 h-128 z" fill="#1f6f78"/>
  <rect x="274" y="392" width="20" height="24" fill="#c98a5e"/>
  <circle cx="284" cy="368" r="34" fill="#c98a5e"/>
  <path d="M250 372 a34 34 0 0 1 56 -30 q-14 10 -18 30 q-18 6 -38 0 z" fill="#2e2a2a"/>
  <circle cx="306" cy="364" r="9" fill="none" stroke="#2e2a2a" stroke-width="3"/><path d="M297 364 h-10" stroke="#2e2a2a" stroke-width="3"/>
  <path d="M308 384 q6 2 10 -2" stroke="#2e2a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- seats -->
  <path d="M190 520 q0 -24 24 -24 h140 q24 0 24 24 v120 h-188 z" fill="#8a6d5a"/>
  <path d="M566 520 q0 -24 24 -24 h140 q24 0 24 24 v120 h-188 z" fill="#8a6d5a"/>
  <!-- question bubble -->
  <rect x="96" y="114" width="230" height="120" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M236 232 l34 60 l4 -60" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M240 230 h32" stroke="#ffffff" stroke-width="5"/>
  <text x="152" y="204" text-anchor="middle" font-size="76" font-weight="800" fill="#7a4e7e">?</text>
  <path d="M252 132 l38 38 l-38 38 l-38 -38 z" fill="#e0a33a"/>
  <path d="M240 186 v-16 q0 -8 8 -8 h10" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M256 154 l12 8 l-12 8 z" fill="#2b2b2b"/>
</svg>
