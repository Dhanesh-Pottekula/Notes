<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At Sunday lunch an uncle asks the family how to plan a wedding, and an aunt, a cousin and a nephew each add a piece of the plan</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="bust">
      <path d="M-30 0 v-40 a30 30 0 0 1 60 0 v40 z" fill="currentColor"/>
      <rect x="-7" y="-80" width="14" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-96" r="22" fill="#c98a5e"/>
      <circle cx="-7" cy="-96" r="2.5" fill="#2e2a2a"/><circle cx="7" cy="-96" r="2.5" fill="#2e2a2a"/>
      <path d="M-8 -86 q8 7 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="bub"><rect x="-70" y="-50" width="140" height="96" rx="20" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- window -->
  <rect x="640" y="40" width="150" height="100" rx="6" fill="#fbeedb" stroke="#8a6d5a" stroke-width="6"/><path d="M715 40 v100" stroke="#8a6d5a" stroke-width="4"/>

  <!-- relatives behind the table -->
  <g transform="translate(330 420)"><use href="#bust" color="#7a4e7e"/><path d="M-22 -112 a22 22 0 0 1 44 0 q-6 -6 -22 -6 q-16 0 -22 6 z" fill="#2e2a2a"/><circle cx="0" cy="-122" r="9" fill="#2e2a2a"/><path d="M-30 -38 l60 30" stroke="#e0a33a" stroke-width="8" opacity=".8"/></g>
  <g transform="translate(610 420)"><use href="#bust" color="#e07a5f"/><path d="M-23 -98 a23 23 0 0 1 46 0 v24 h-8 v-20 q-15 -8 -30 0 v20 h-8 z" fill="#2e2a2a"/></g>
  <g transform="translate(800 420) scale(.92)"><use href="#bust" color="#1f6f78"/><path d="M-22 -100 a22 22 0 0 1 44 0 q-22 -10 -44 0 z" fill="#2e2a2a"/></g>
  <!-- arms resting / pointing -->
  <path d="M352 392 l30 24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M588 392 l-24 26" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>

  <!-- uncle at head of table -->
  <g transform="translate(118 560)">
    <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
    <rect x="-34" y="-64" width="60" height="9" rx="3" fill="#6b5446"/><rect x="-32" y="-56" width="6" height="56" fill="#6b5446"/><rect x="20" y="-56" width="6" height="56" fill="#6b5446"/><rect x="-40" y="-126" width="9" height="66" rx="3" fill="#6b5446"/>
    <rect x="-22" y="-70" width="56" height="16" rx="7" fill="#4a3f55"/><rect x="20" y="-70" width="14" height="70" rx="6" fill="#4a3f55"/>
    <path d="M-26 -62 v-50 a26 26 0 0 1 52 0 v50 z" fill="#f3ede0"/>
    <rect x="-7" y="-150" width="14" height="12" fill="#c98a5e"/>
    <circle cx="2" cy="-164" r="22" fill="#c98a5e"/><path d="M-20 -166 a22 22 0 0 1 40 -10 q-20 -2 -26 10 z" fill="#e3dccd"/>
    <circle cx="10" cy="-166" r="7" fill="none" stroke="#2e2a2a" stroke-width="2.5"/><path d="M3 -166 h-8" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M10 -150 q6 3 10 -1" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M20 -118 l40 -10 l12 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14 -110 l46 4" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- table -->
  <path d="M230 410 H930 L920 470 H210 Z" fill="#8a6d5a"/><rect x="210" y="470" width="710" height="16" fill="#6b5446"/>
  <rect x="226" y="486" width="12" height="74" fill="#6b5446"/><rect x="892" y="486" width="12" height="74" fill="#6b5446"/>
  <!-- plates -->
  <g fill="#e3e6e8" stroke="#b8bec2" stroke-width="2"><ellipse cx="330" cy="440" rx="40" ry="12"/><ellipse cx="640" cy="440" rx="40" ry="12"/><ellipse cx="830" cy="434" rx="34" ry="10"/></g>
  <ellipse cx="330" cy="438" rx="22" ry="6" fill="#f3e3b0"/><ellipse cx="640" cy="438" rx="22" ry="6" fill="#e0a33a"/>
  <ellipse cx="560" cy="428" rx="26" ry="9" fill="#e3c27a"/>
  <!-- nephew laptop on table -->
  <path d="M752 446 h96 l-10 -64 h-76 z" fill="#3d3a3a"/><rect x="740" y="444" width="120" height="8" rx="3" fill="#6b6461"/>
  <!-- plan on table -->
  <g transform="translate(470 436) rotate(-4)">
    <rect x="-46" y="-30" width="92" height="56" rx="4" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/>
    <path d="M-34 -16 h44 M-34 -2 h56 M-34 12 h38" stroke="#d8cdb8" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="512" cy="404" r="15" fill="#3f9a5a"/><path d="M505 404 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <text x="472" y="306" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">OUR PLAN</text>

  <!-- uncle's question bubble -->
  <text x="140" y="72" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ASK</text>
  <rect x="34" y="94" width="216" height="110" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M150 202 l-12 140 l52 -140" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M152 200 h36" stroke="#ffffff" stroke-width="5"/>
  <g transform="translate(58 120)"><rect width="56" height="30" rx="3" fill="#8fbf8a"/><rect y="10" width="56" height="30" rx="3" fill="#7aae76"/><rect y="20" width="56" height="30" rx="3" fill="#8fbf8a"/><circle cx="28" cy="35" r="8" fill="#6a9a66"/></g>
  <g transform="translate(126 112)"><rect width="50" height="62" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect width="50" height="16" rx="4" fill="#e07a5f"/><text x="25" y="54" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b">2</text></g>
  <text x="214" y="176" text-anchor="middle" font-size="60" font-weight="800" fill="#7a4e7e">?</text>

  <!-- aunt idea --><g transform="translate(44 -6)">  <use href="#bub" transform="translate(300 160)"/>
  <rect x="276" y="122" width="48" height="80" rx="8" fill="#3d3a3a"/><rect x="281" y="130" width="38" height="62" rx="3" fill="#e6efec"/>
  <path d="M288 166 h24 v-6 a8 8 0 0 0 -4 -14 a8 8 0 0 0 -16 0 a8 8 0 0 0 -4 14 z" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/><rect x="290" y="168" width="20" height="8" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/>
  </g>
  <!-- cousin's idea: hall at half price -->
  <use href="#bub" transform="translate(620 190)"/>
  <path d="M572 220 v-36 l30 -22 l30 22 v36 z" fill="#e0a33a"/><rect x="592" y="196" width="20" height="24" fill="#8a6d5a"/>
  <path d="M642 160 h28 l12 14 l-12 14 h-28 z" fill="#e07a5f"/><circle cx="648" cy="174" r="3" fill="#fff"/>
  <path d="M674 152 l-16 44" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="664" y="222" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b">1/2</text>
  <path d="M824 240 l-18 50 l40 -50" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M826 238 h18" stroke="#ffffff" stroke-width="5"/><g transform="translate(0 -96)"><!-- nephew's idea: RSVP checklist -->
  <use href="#bub" transform="translate(850 290)"/>
  <rect x="812" y="254" width="76" height="70" rx="4" fill="#e6efec"/>
  <g stroke="#3f9a5a" stroke-width="4" fill="none" stroke-linecap="round"><path d="M820 268 l4 4 l7 -8 M820 288 l4 4 l7 -8 M820 308 l4 4 l7 -8"/></g>
  <path d="M840 268 h38 M840 288 h38 M840 308 h30" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>

  </g>
  <!-- ideas flow into the plan -->
  <path d="M374 200 C358 320 400 370 434 400" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M562 236 C590 320 530 370 500 398" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M736 458 C660 476 590 470 526 452" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
