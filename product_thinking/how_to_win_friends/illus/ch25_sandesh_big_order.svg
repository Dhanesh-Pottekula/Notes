<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A sweet-shop owner asks his sweet makers over tea if they can take a huge order, and they offer moulds, an early shift and help with packing</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
      <rect x="-26" y="-50" width="52" height="10" rx="4" fill="#8a6d5a"/><rect x="-22" y="-40" width="7" height="40" fill="#6b5446"/><rect x="15" y="-40" width="7" height="40" fill="#6b5446"/>
      <rect x="-18" y="-60" width="46" height="16" rx="7" fill="#4a3f55"/><rect x="16" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-24 -54 v-44 a24 24 0 0 1 48 0 v44 z" fill="currentColor"/>
      <rect x="-6" y="-130" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-144" r="19" fill="#c98a5e"/>
      <circle cx="-6" cy="-146" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.5" fill="#2e2a2a"/>
      <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    </g>
    <g id="cup"><path d="M-9 -16 h18 l-3 16 h-12 z" fill="#b9765a"/></g>
    <g id="sd"><ellipse cx="0" cy="0" rx="13" ry="6" fill="#fbf6ea" stroke="#e3dccd" stroke-width="1.5"/><circle cx="0" cy="-2" r="2.5" fill="#e0a33a"/></g>
    <g id="mould"><circle r="16" fill="#8a6d5a"/><g fill="#6b5446"><circle cx="0" cy="-7" r="5"/><circle cx="7" cy="0" r="5"/><circle cx="0" cy="7" r="5"/><circle cx="-7" cy="0" r="5"/></g><circle r="3" fill="#e0a33a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>

  <!-- shelves with sandesh -->
  <rect x="30" y="240" width="140" height="320" fill="#e8dcc6"/>
  <g fill="#8a6d5a"><rect x="30" y="300" width="140" height="8"/><rect x="30" y="380" width="140" height="8"/><rect x="30" y="460" width="140" height="8"/></g>
  <g fill="#b8bec2"><rect x="40" y="290" width="120" height="10" rx="3"/><rect x="40" y="370" width="120" height="10" rx="3"/><rect x="40" y="450" width="120" height="10" rx="3"/></g>
  <use href="#sd" transform="translate(64 284)"/><use href="#sd" transform="translate(100 284)"/><use href="#sd" transform="translate(136 284)"/>
  <use href="#sd" transform="translate(64 364)"/><use href="#sd" transform="translate(100 364)"/><use href="#sd" transform="translate(136 364)"/>
  <use href="#sd" transform="translate(64 444)"/><use href="#sd" transform="translate(100 444)"/><use href="#sd" transform="translate(136 444)"/>
  <!-- window with festival lights -->
  <rect x="760" y="100" width="170" height="130" rx="6" fill="#3e4a5c"/>
  <path d="M770 200 l40 -50 l40 50 z" fill="#4f5d72"/><path d="M850 200 l30 -36 l30 36 z" fill="#4f5d72"/>
  <path d="M762 118 q84 30 166 0" stroke="#6b6461" stroke-width="2" fill="none"/>
  <g><circle cx="784" cy="126" r="5" fill="#e0a33a"/><circle cx="808" cy="131" r="5" fill="#e07a5f"/><circle cx="834" cy="133" r="5" fill="#8fbf8a"/><circle cx="860" cy="133" r="5" fill="#e0a33a"/><circle cx="886" cy="130" r="5" fill="#e07a5f"/><circle cx="910" cy="124" r="5" fill="#8fbf8a"/></g>
  <rect x="760" y="100" width="170" height="130" rx="6" fill="none" stroke="#8a6d5a" stroke-width="7"/>

  <!-- owner -->
  <g transform="translate(290 560)"><use href="#sit" color="#ffffff"/>
    <rect x="-18" y="-60" width="48" height="60" rx="6" fill="#f3ede0"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#8f8a85"/>
    <circle cx="-7" cy="-146" r="7" fill="none" stroke="#2e2a2a" stroke-width="2.5"/><circle cx="7" cy="-146" r="7" fill="none" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -100 l44 10 l14 -26" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -100 l14 34 l24 -8" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <use href="#cup" transform="translate(22 -66)"/>
  </g>
  <!-- owner's question bubble -->
  <text x="270" y="74" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">CAN WE?</text>
  <rect x="160" y="96" width="230" height="118" rx="22" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M266 212 l14 148 l30 -148" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M268 210 h40" stroke="#ffffff" stroke-width="5"/>
  <g transform="translate(184 112) rotate(-3)">
    <rect width="110" height="84" rx="4" fill="#fbeedb" stroke="#b9ad98" stroke-width="2"/>
    <path d="M12 16 h60" stroke="#cbbfa9" stroke-width="5" stroke-linecap="round"/>
    <text x="55" y="64" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b">5000</text>
  </g>
  <text x="340" y="190" text-anchor="middle" font-size="68" font-weight="800" fill="#7a4e7e">?</text>
  <circle cx="294" cy="116" r="17" fill="#3f9a5a"/><path d="M286 116 l6 6 l10 -11" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- karigars, facing the owner -->
  <text x="690" y="74" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">YES!</text>
  <!-- senior with moulds -->
  <g transform="translate(560 560) scale(-1 1)"><use href="#sit" color="#ffffff"/>
    <path d="M-24 -98 h48 v44 h-48 z" fill="#ffffff"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#d8d2c8"/>
    <path d="M24 -100 l8 34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M580 460 l30 -54" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M540 460 l-34 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <use href="#mould" transform="translate(616 394)"/><use href="#mould" transform="translate(500 412)"/>
  <!-- middle worker pointing at clock -->
  <g transform="translate(700 560) scale(-1 1)"><use href="#sit" color="#1f6f78"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -100 l-6 36" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M722 456 l20 -84" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  <rect x="716" y="320" width="74" height="10" rx="3" fill="#8a6d5a"/>
  <g transform="translate(752 286)"><circle r="30" fill="#ffffff" stroke="#e07a5f" stroke-width="5"/><circle cx="-20" cy="-26" r="8" fill="#e07a5f"/><circle cx="20" cy="-26" r="8" fill="#e07a5f"/>
    <text y="8" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">4:00</text></g>
  <!-- youngest with boxes and thumbs-up -->
  <g transform="translate(850 560) scale(-.94 .94)"><use href="#sit" color="#e0a33a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 v8 h-6 v-6 q-13 -6 -26 0 v6 h-6 z" fill="#2e2a2a"/>
  </g>
  <path d="M870 462 l20 -60" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/><path d="M890 404 v-18" stroke="#d9a27a" stroke-width="8" stroke-linecap="round"/>
  <path d="M832 462 l-26 -20" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(770 470)"><rect x="0" y="-12" width="60" height="12" rx="2" fill="#fbf6ea" stroke="#cbbfa9" stroke-width="2"/><rect x="0" y="-24" width="60" height="12" rx="2" fill="#fbf6ea" stroke="#cbbfa9" stroke-width="2"/><rect x="0" y="-36" width="60" height="12" rx="2" fill="#fbf6ea" stroke="#cbbfa9" stroke-width="2"/><path d="M30 -36 v36" stroke="#e07a5f" stroke-width="4"/></g>

  <!-- ideas flow to the order -->
  <path d="M484 396 C450 330 420 260 392 196" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M716 270 C600 200 480 160 396 150" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M770 440 C700 380 560 300 470 240 L396 196" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
