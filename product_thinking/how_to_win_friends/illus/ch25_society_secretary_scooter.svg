<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A society secretary shouts at a scooter owner in front of the neighbours, and at the next meeting the same neighbours vote down his proposal</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="bust">
      <path d="M-22 0 v-26 a22 22 0 0 1 44 0 v26 z" fill="currentColor"/>
      <circle cx="0" cy="-64" r="17" fill="#c98a5e"/><path d="M-17 -66 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
      <path d="M-14 -22 h28 M-14 -22 l6 8 M14 -22 l-6 8" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
      <path d="M-7 -54 q7 -5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    </g>
    <g id="sit">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-26" y="-56" width="52" height="8" rx="3" fill="#1f6f78"/><rect x="-24" y="-48" width="5" height="48" fill="#1f6f78"/><rect x="19" y="-48" width="5" height="48" fill="#1f6f78"/>
      <rect x="-30" y="-108" width="8" height="58" rx="3" fill="#1f6f78"/>
      <rect x="-18" y="-60" width="44" height="14" rx="6" fill="#4a3f55"/><rect x="14" y="-60" width="13" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-22 -56 v-42 a22 22 0 0 1 44 0 v42 z" fill="currentColor"/>
      <circle cx="0" cy="-138" r="18" fill="#c98a5e"/><path d="M-18 -140 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
      <path d="M-8 -128 q8 -5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    </g>
    <g id="card"><rect x="-18" y="-24" width="36" height="28" rx="4" fill="#e07a5f"/><path d="M-7 -17 l14 14 M7 -17 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 40 V600" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SHOUTED</text>
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">VOTED DOWN</text>

  <!-- LEFT: building -->
  <rect x="30" y="100" width="300" height="460" fill="#e8dcc6"/>
  <!-- balconies with neighbours -->
  <use href="#bust" color="#7a4e7e" transform="translate(80 222)"/>
  <use href="#bust" color="#e0a33a" transform="translate(180 222)"/>
  <use href="#bust" color="#1f6f78" transform="translate(280 222)"/>
  <g fill="#8a6d5a"><rect x="40" y="206" width="280" height="8" rx="2"/><rect x="40" y="250" width="280" height="10" rx="2"/></g>
  <g stroke="#8a6d5a" stroke-width="4"><path d="M54 214 v36 M76 214 v36 M98 214 v36 M120 214 v36 M142 214 v36 M164 214 v36 M186 214 v36 M208 214 v36 M230 214 v36 M252 214 v36 M274 214 v36 M296 214 v36"/></g>
  <!-- windows -->
  <g fill="#cbbfa9"><rect x="60" y="290" width="60" height="50" rx="4"/><rect x="240" y="290" width="60" height="50" rx="4"/></g>
  <!-- door with owner -->
  <rect x="50" y="390" width="96" height="170" fill="#6b5446"/><rect x="60" y="400" width="76" height="160" fill="#4a3c33"/>
  <g transform="translate(98 560) scale(.92)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -66 h48 v66 h-48 z" fill="#cfe0dd"/><path d="M-24 -40 h48 M-24 -20 h48" stroke="#9fbcb8" stroke-width="3"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-8 -146 h5 M3 -146 h5" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -134 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-24 -104 l-4 40 M24 -104 l4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- secretary shouting -->
  <g transform="translate(228 560) scale(1.02)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -100 h48 v40 h-48 z" fill="#f0ebe0"/>
    <path d="M-19 -154 a19 19 0 0 1 38 0 z" fill="#d8d2c8"/>
    <circle cx="-7" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2.5"/><circle cx="7" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-8 -140 q8 -4 16 0" stroke="#8f8a85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-133" rx="5" ry="4" fill="#7a2e2e"/>
    <circle cx="-13" cy="-140" r="4" fill="#e07a5f" opacity=".6"/><circle cx="13" cy="-140" r="4" fill="#e07a5f" opacity=".6"/>
    <path d="M22 -104 l70 -14" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-12 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M30 -168 l12 -10 M36 -152 l16 -2 M26 -182 l4 -14" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- gate pillar + clock -->
  <rect x="420" y="250" width="40" height="310" fill="#cbbfa9"/>
  <circle cx="440" cy="290" r="22" fill="#ffffff" stroke="#3d3a3a" stroke-width="3"/>
  <text x="440" y="297" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b">8:00</text>
  <!-- scooter across the gate -->
  <g transform="translate(360 560)">
    <ellipse cx="0" cy="2" rx="70" ry="7" fill="#000" opacity=".08"/>
    <circle cx="-44" cy="-20" r="20" fill="#3d3a3a"/><circle cx="-44" cy="-20" r="8" fill="#b9ad98"/>
    <circle cx="44" cy="-20" r="20" fill="#3d3a3a"/><circle cx="44" cy="-20" r="8" fill="#b9ad98"/>
    <path d="M-66 -28 q0 -40 40 -40 h30 l14 20 h24 l22 -40 h10 l-16 60 z" fill="#e0a33a"/>
    <rect x="-56" y="-80" width="56" height="12" rx="6" fill="#3d3a3a"/>
    <path d="M60 -92 l-6 24" stroke="#3d3a3a" stroke-width="5"/><path d="M50 -94 h22" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- RIGHT: meeting hall -->
  <rect x="500" y="100" width="440" height="460" fill="#efe6d4"/>
  <rect x="520" y="130" width="120" height="70" rx="4" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><path d="M540 150 h80 M540 166 h60 M540 182 h70" stroke="#d8cdb8" stroke-width="5" stroke-linecap="round"/>
  <path d="M700 130 h200" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- secretary with paper -->
  <g transform="translate(570 560)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -100 h48 v40 h-48 z" fill="#f0ebe0"/>
    <path d="M-19 -154 a19 19 0 0 1 38 0 z" fill="#d8d2c8"/>
    <circle cx="-7" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2.5"/><circle cx="7" cy="-150" r="6" fill="none" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-8 -140 q8 -4 16 0" stroke="#8f8a85" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M-5 -130 q5 -4 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-12 -164 l-6 -6 M12 -164 l6 -6" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M22 -104 l26 -34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-8 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(614 424) rotate(8)">
    <rect x="-6" y="-70" width="62" height="78" rx="4" fill="#ffffff" stroke="#b9ad98" stroke-width="2"/>
    <path d="M6 -26 q19 -26 38 0 z" fill="#1f6f78"/><rect x="2" y="-28" width="46" height="6" rx="3" fill="#174f55"/><circle cx="25" cy="-40" r="4" fill="#e0a33a"/>
  </g>
  <!-- table -->
  <rect x="536" y="470" width="130" height="12" rx="3" fill="#8a6d5a"/><rect x="546" y="482" width="8" height="78" fill="#6b5446"/><rect x="648" y="482" width="8" height="78" fill="#6b5446"/>
  <!-- seated neighbours raising red cards -->
  <g transform="translate(730 560) scale(-1 1)"><use href="#sit" color="#7a4e7e"/></g>
  <path d="M716 452 l-14 -64" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#card" transform="translate(700 384)"/>
  <g transform="translate(820 560) scale(-1 1)"><use href="#sit" color="#e0a33a"/></g>
  <path d="M806 452 l-14 -64" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#card" transform="translate(790 384)"/>
  <g transform="translate(910 560) scale(-1 1)"><use href="#sit" color="#1f6f78"/></g>
  <path d="M896 452 l-14 -64" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#card" transform="translate(880 384)"/>
  <!-- payback arrow -->
  <path d="M320 170 C470 90 690 110 780 330" stroke="#7a4e7e" stroke-width="5" fill="none" stroke-dasharray="12 9" marker-end="url(#ah)"/>
</svg>
