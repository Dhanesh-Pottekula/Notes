<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mother-in-law steps between a critical aunt and her nervous daughter-in-law to defend her too-salty first biryani and promise a retry next Sunday</title>
  <defs>
    <g id="sari">
      <ellipse cx="0" cy="2" rx="32" ry="6" fill="#000" opacity=".08"/>
      <path d="M-32 0 l8 -124 a24 24 0 0 1 48 0 l8 124 z" fill="currentColor"/>
      <rect x="-6" y="-156" width="12" height="12" fill="#c98a5e"/>
      <circle cx="0" cy="-170" r="20" fill="#c98a5e"/>
    </g>
    <g id="guest"><rect x="-18" y="-40" width="36" height="40" rx="14" fill="currentColor"/><circle cx="0" cy="-54" r="14" fill="#c98a5e"/><path d="M-14 -56 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/></g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="handi"><path d="M-60 0 q-20 -50 14 -78 h92 q34 28 14 78 z" fill="#b8bec2"/><ellipse cx="0" cy="-78" rx="48" ry="11" fill="#e8b85a"/><path d="M-36 -82 l6 4 M-14 -86 l4 6 M10 -84 l6 4 M28 -80 l4 4" stroke="#c4602a" stroke-width="4" stroke-linecap="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- marigold strings -->
  <path d="M20 100 q240 60 460 0 q220 60 460 0" stroke="#e0a33a" stroke-width="9" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M20 112 q240 60 460 0 q220 60 460 0" stroke="#e07a5f" stroke-width="7" fill="none" stroke-dasharray="2 14" stroke-linecap="round" opacity=".8"/>
  <text x="480" y="64" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SAVED FACE</text>

  <!-- guests eating, background right -->
  <use href="#guest" color="#7a4e7e" transform="translate(800 470)"/><use href="#guest" color="#1f6f78" transform="translate(860 476)"/><use href="#guest" color="#e0a33a" transform="translate(918 470)"/>
  <rect x="770" y="470" width="180" height="12" rx="3" fill="#8a6d5a"/><rect x="782" y="482" width="10" height="78" fill="#6b5446"/><rect x="928" y="482" width="10" height="78" fill="#6b5446"/>
  <g fill="#fff"><ellipse cx="800" cy="468" rx="16" ry="4"/><ellipse cx="860" cy="468" rx="16" ry="4"/><ellipse cx="918" cy="468" rx="16" ry="4"/></g>

  <!-- aunt about to comment -->
  <g transform="translate(96 560)"><use href="#sari" color="#3f9a5a"/>
    <path d="M-24 -124 l48 70" stroke="#e0a33a" stroke-width="6"/>
    <path d="M-20 -174 a20 20 0 0 1 40 0 q-10 -4 -20 -4 q-10 0 -20 4 z" fill="#d8d2c8"/><circle cx="-14" cy="-176" r="9" fill="#d8d2c8"/>
    <circle cx="8" cy="-170" r="2.5" fill="#2e2a2a"/><path d="M4 -180 l10 3" stroke="#2e2a2a" stroke-width="2.5"/>
    <ellipse cx="10" cy="-158" rx="4" ry="3" fill="#2e2a2a"/>
    <path d="M22 -116 l24 -30 l8 -22" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- aunt bubble: salt shaker -->
  <rect x="54" y="238" width="96" height="80" rx="18" fill="#efece6" stroke="#b9ad98" stroke-width="2"/>
  <path d="M112 316 l8 20 l10 -22" fill="#efece6" stroke="#b9ad98" stroke-width="2"/><path d="M114 314 h14" stroke="#efece6" stroke-width="5"/>
  <path d="M88 304 v-36 q14 -14 28 0 v36 z" fill="#fff" stroke="#9a9590" stroke-width="2"/><g fill="#9a9590"><circle cx="98" cy="266" r="2"/><circle cx="106" cy="264" r="2"/><circle cx="102" cy="258" r="2"/></g>

  <!-- mother-in-law: arm out as a shield, hand on daughter-in-law's shoulder -->
  <g transform="translate(290 560) scale(1.06)"><use href="#sari" color="#8a2f3a"/>
    <path d="M-24 -124 l48 70" stroke="#e0a33a" stroke-width="6"/>
    <path d="M-20 -174 a20 20 0 0 1 40 0 q-10 -6 -20 -6 q-10 0 -20 6 z" fill="#3a3434"/><circle cx="0" cy="-194" r="10" fill="#3a3434"/>
    <circle cx="-8" cy="-170" r="2.5" fill="#2e2a2a"/><circle cx="8" cy="-170" r="2.5" fill="#2e2a2a"/><circle cx="0" cy="-180" r="2.5" fill="#c8383a"/>
    <path d="M-9 -160 q9 10 18 0 z" fill="#2e2a2a"/>
    <path d="M-22 -118 l-50 -12" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><path d="M-76 -142 v24" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/>
    <path d="M22 -118 l56 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>
  <!-- big bubble: next Sunday retry -->
  <rect x="270" y="110" width="220" height="116" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M300 224 l-6 132 l34 -132" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M302 222 h24" stroke="#fff" stroke-width="5"/>
  <rect x="290" y="126" width="70" height="84" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="290" y="126" width="70" height="20" rx="4" fill="#e07a5f"/>
  <text x="325" y="192" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2b2b">SUN</text>
  <use href="#handi" transform="translate(414 200) scale(.5)"/>
  <use href="#tick" transform="translate(462 140)"/>

  <!-- daughter-in-law, teary but lifting her head -->
  <g transform="translate(410 560)"><use href="#sari" color="#e07a5f"/>
    <path d="M-24 -124 q20 40 8 120" stroke="#f3c9a8" stroke-width="12" fill="none"/>
    <path d="M-20 -172 a20 20 0 0 1 40 0 q-10 -6 -20 -6 q-10 0 -20 6 z" fill="#2e2a2a"/><path d="M-20 -172 q-6 24 -2 40" stroke="#2e2a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-12 -170 q4 3 8 0 M4 -170 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-10 -166 q-3 8 0 12 q3 -4 0 -12 z" fill="#5b9bd5"/>
    <path d="M-5 -158 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -116 l28 34 l20 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M70 -72 l40 -40" stroke="#9a9590" stroke-width="5" stroke-linecap="round"/><ellipse cx="112" cy="-114" rx="10" ry="6" fill="#9a9590"/>
  </g>

  <!-- biryani handi on stand, salt spilling -->
  <rect x="560" y="468" width="160" height="12" rx="3" fill="#3d3a3a"/><path d="M574 480 l-10 80 M706 480 l10 80" stroke="#3d3a3a" stroke-width="8"/>
  <use href="#handi" transform="translate(640 468)"/>
  <path d="M610 370 q8 -16 0 -32 M640 366 q8 -16 0 -32 M670 370 q8 -16 0 -32" stroke="#e3dccd" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M708 410 v-34 q12 -12 24 0 v34 z" fill="#fff" stroke="#9a9590" stroke-width="2" transform="rotate(-30 720 393)"/>
  <g fill="#fff" stroke="#b9ad98" stroke-width="1"><circle cx="694" cy="392" r="3"/><circle cx="684" cy="398" r="3"/><circle cx="690" cy="404" r="3"/><circle cx="676" cy="392" r="3"/></g>
</svg>
