<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One caterer ignores a seasonal helper at season's end; another shares chai and jalebis and invites him back in October</title>
  <defs>
    <g id="sit">
      <ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/>
      <rect x="-22" y="-40" width="44" height="40" rx="4" fill="#8a6d5a"/>
      <rect x="-8" y="-60" width="54" height="16" rx="8" fill="#4a3f55"/><rect x="34" y="-56" width="14" height="56" rx="6" fill="#4a3f55"/>
      <path d="M-24 -44 v-50 a24 24 0 0 1 48 0 v50 z" fill="currentColor"/>
      <rect x="-6" y="-126" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-140" r="19" fill="#c98a5e"/>
    </g>
    <g id="walk">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-4 -62 l-18 62" stroke="#4a3f55" stroke-width="13" stroke-linecap="round"/><path d="M4 -62 l16 62" stroke="#4a3f55" stroke-width="13" stroke-linecap="round"/>
      <path d="M-22 -60 v-42 a22 22 0 0 1 44 0 v42 z" fill="#f3ede0"/>
      <path d="M-18 -96 h36 v50 h-36 z" fill="#e0a33a"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="18" fill="#d9a27a"/><path d="M-18 -150 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    </g>
    <g id="pot"><path d="M-46 0 q-10 -40 10 -60 h72 q20 20 10 60 z" fill="#c47a4a"/><rect x="-40" y="-68" width="80" height="10" rx="4" fill="#a8623a"/></g>
    <g id="cup"><path d="M-7 -18 h14 l-2 18 h-10 z" fill="#fff" opacity=".9"/><path d="M-6 -12 h12 l-1 12 h-10 z" fill="#b8743c"/></g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">SILENCE</text>
  <text x="720" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">COME BACK</text>

  <!-- LEFT: gate, stacked pots -->
  <rect x="30" y="260" width="70" height="300" fill="#cbbfa9"/><path d="M40 270 v290 M58 270 v290 M76 270 v290 M92 270 v290" stroke="#9a9590" stroke-width="4"/>
  <use href="#pot" transform="translate(410 560)"/><use href="#pot" transform="translate(410 492) scale(.8)"/>
  <!-- helper walking away to the gate -->
  <g transform="translate(160 560) scale(-1 1)"><use href="#walk"/>
    <path d="M-18 -100 l-10 40" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
    <path d="M18 -102 l-6 26" stroke="#7a8fa0" stroke-width="4"/><rect x="2" y="-80" width="34" height="38" rx="6" fill="#b9ad98"/>
  </g>
  <path d="M148 404 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" transform="rotate(180 154 404)"/>
  <!-- owner turned away, on phone -->
  <g transform="translate(280 560)"><use href="#sit" color="#ffffff"/>
    <ellipse cx="0" cy="-156" rx="26" ry="12" fill="#c8383a"/><path d="M-22 -150 q22 -14 44 0 l-4 -14 q-18 -10 -36 0 z" fill="#e05a4a"/>
    <path d="M-20 -94 l30 10 l16 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="300" y="454" width="16" height="26" rx="3" fill="#3d3a3a" transform="rotate(-20 308 467)"/>
  <circle cx="288" cy="424" r="2.5" fill="#2e2a2a"/><path d="M282 434 h10" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- crossed-out phone -->
  <g transform="translate(230 220)">
    <rect x="-22" y="-38" width="44" height="76" rx="8" fill="#fff" stroke="#3d3a3a" stroke-width="4"/>
    <path d="M-8 -6 q0 18 16 18 l4 -8 l-8 -4 l-2 4 q-6 -2 -6 -8 l4 -2 l-4 -8 z" fill="#3d3a3a"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#e07a5f" stroke-width="7"/><path d="M-36 -36 l72 72" stroke="#e07a5f" stroke-width="7"/>
  </g>

  <!-- RIGHT: pots behind -->
  <use href="#pot" transform="translate(560 560) scale(.8)"/>
  <!-- owner with chai -->
  <g transform="translate(620 560)"><use href="#sit" color="#f3ede0"/>
    <path d="M-19 -146 a19 19 0 0 1 38 0 z" fill="#e3dccd"/>
    <circle cx="-4" cy="-142" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/><circle cx="12" cy="-142" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/>
    <path d="M2 -128 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -96 l26 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <use href="#cup" transform="translate(670 496)"/>
  <!-- helper with chai, facing owner -->
  <g transform="translate(830 560) scale(-1 1)"><use href="#sit" color="#f3ede0"/>
    <path d="M-18 -90 h36 v46 h-36 z" fill="#e0a33a"/>
    <path d="M-19 -142 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="8" cy="-140" r="2.4" fill="#2e2a2a"/><path d="M2 -128 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -96 l26 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <use href="#cup" transform="translate(780 496)"/>
  <!-- jalebi plate on small table -->
  <rect x="694" y="490" width="62" height="10" rx="3" fill="#8a6d5a"/><rect x="718" y="500" width="14" height="60" fill="#6b5446"/>
  <ellipse cx="725" cy="488" rx="34" ry="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <g fill="none" stroke="#f08a24" stroke-width="5" stroke-linecap="round"><path d="M708 482 a8 6 0 1 1 10 0 a4 3 0 1 1 -4 -2"/><path d="M728 480 a8 6 0 1 1 10 0 a4 3 0 1 1 -4 -2"/><path d="M718 474 a7 5 0 1 1 10 0"/></g>
  <!-- speech bubble with October calendar -->
  <rect x="540" y="120" width="190" height="120" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M600 238 l10 50 l22 -50" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M602 236 h28" stroke="#fff" stroke-width="5"/>
  <rect x="560" y="138" width="80" height="86" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="560" y="138" width="80" height="22" rx="4" fill="#e07a5f"/>
  <text x="600" y="206" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2b2b">OCT</text>
  <use href="#tick" transform="translate(684 180)"/>
  <!-- inset: next October, phone rings -->
  <circle cx="860" cy="240" r="70" fill="#fff" stroke="#1f6f78" stroke-width="4"/>
  <rect x="836" y="196" width="48" height="84" rx="8" fill="#3d3a3a"/><rect x="841" y="206" width="38" height="62" fill="#9fc4c8"/>
  <circle cx="860" cy="228" r="11" fill="#c98a5e"/><path d="M849 226 a11 11 0 0 1 22 0 z" fill="#e3dccd"/><path d="M848 252 a12 12 0 0 1 24 0 z" fill="#f3ede0"/>
  <path d="M820 212 q-8 18 0 36 M808 204 q-12 26 0 52 M900 212 q8 18 0 36 M912 204 q12 26 0 52" stroke="#e0a33a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M806 320 q20 30 -40 80" stroke="#1f6f78" stroke-width="3" stroke-dasharray="6 6" fill="none"/>
</svg>
