<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A grandfather sits tall at the head of the dinner table as household chairman while his daughter-in-law quietly pays the bill on her phone</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="250" y="70" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">CHAIRMAN</text>

  <!-- wall: family photo and brass lamp -->
  <rect x="430" y="120" width="130" height="96" rx="4" fill="#8a6d5a"/><rect x="440" y="130" width="110" height="76" fill="#fbeedb"/>
  <g><circle cx="470" cy="160" r="10" fill="#c98a5e"/><path d="M458 200 a12 22 0 0 1 24 0 z" fill="#1f6f78"/><circle cx="495" cy="156" r="10" fill="#b07850"/><path d="M483 200 a12 24 0 0 1 24 0 z" fill="#7a4e7e"/><circle cx="520" cy="160" r="10" fill="#d9a27a"/><path d="M508 200 a12 22 0 0 1 24 0 z" fill="#e07a5f"/></g>
  <path d="M610 250 h30 l-6 -14 h-18 z" fill="#e0a33a"/><rect x="622" y="250" width="6" height="70" fill="#c48a2a"/><path d="M606 322 h38 l-6 -10 h-26 z" fill="#e0a33a"/>
  <path d="M625 234 q-6 -10 0 -20 q6 10 0 20 z" fill="#e07a5f"/>

  <!-- doorway to kitchen -->
  <rect x="700" y="230" width="190" height="330" fill="#cbbfa9"/><rect x="714" y="244" width="162" height="316" fill="#e9dfcd"/>

  <!-- grandfather (seated, torso above table) -->
  <g transform="translate(230 400)">
    <path d="M-36 0 v-70 a36 36 0 0 1 72 0 v70 z" fill="#f3ede0"/>
    <rect x="-8" y="-114" width="16" height="12" fill="#b07850"/>
    <circle cx="0" cy="-134" r="26" fill="#b07850"/>
    <path d="M-26 -140 a26 26 0 0 1 52 0 q-6 -8 -26 -10 q-20 2 -26 10 z" fill="#e3dccd"/>
    <circle cx="-10" cy="-136" r="8" fill="none" stroke="#3d3a3a" stroke-width="3"/><circle cx="10" cy="-136" r="8" fill="none" stroke="#3d3a3a" stroke-width="3"/><path d="M-2 -136 h4" stroke="#3d3a3a" stroke-width="3"/>
    <path d="M-12 -122 q12 -6 24 0" stroke="#e3dccd" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-8 -116 q8 5 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M30 -66 l34 -28 l6 -40" stroke="#b07850" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-30 -66 l-10 50" stroke="#b07850" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  <use href="#tick" transform="translate(300 210)"/>
  <path d="M156 380 v-90" stroke="#1f6f78" stroke-width="5" stroke-dasharray="8 7" marker-end="url(#ah)"/>

  <!-- son leaning with brochure -->
  <g transform="translate(470 400)">
    <path d="M-30 0 v-64 a30 30 0 0 1 60 0 v64 z" fill="#5b8fc7" transform="rotate(-12 0 0)"/>
    <g transform="rotate(-12 0 0)"><rect x="-7" y="-104" width="14" height="12" fill="#c98a5e"/><circle cx="0" cy="-122" r="22" fill="#c98a5e"/><path d="M-22 -126 a22 22 0 0 1 44 0 z" fill="#2e2a2a"/>
    <path d="M-12 -132 h10" stroke="#2e2a2a" stroke-width="3"/><circle cx="-8" cy="-122" r="2.5" fill="#2e2a2a"/><path d="M-8 -110 q-6 3 -10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
    <path d="M-46 -60 l-50 -14" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <rect x="-140" y="-110" width="52" height="66" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-8 -114 -77)"/>
    <rect x="-128" y="-98" width="28" height="40" rx="4" fill="#9fc4c8" transform="rotate(-8 -114 -77)"/>
  </g>

  <!-- table -->
  <rect x="110" y="398" width="470" height="14" rx="3" fill="#6b5446"/>
  <rect x="122" y="412" width="446" height="148" fill="#8a6d5a"/>
  <path d="M122 412 h446 v28 h-446 z" fill="#6b5446" opacity=".35"/>
  <path d="M190 394 q30 -22 82 -8 l-20 14 z" fill="#3f9a5a"/>
  <ellipse cx="230" cy="392" rx="22" ry="6" fill="#fff"/>
  <ellipse cx="350" cy="394" rx="34" ry="7" fill="#b8bec2"/>
  <path d="M470 398 v-20 h40 v20 z" fill="#b8bec2"/><ellipse cx="490" cy="378" rx="20" ry="5" fill="#e0a33a"/>

  <!-- daughter-in-law in doorway, paying on phone -->
  <g transform="translate(800 560)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <path d="M-30 0 l8 -120 a22 22 0 0 1 44 0 l8 120 z" fill="#7a4e7e"/>
    <path d="M-22 -120 l44 60" stroke="#e0a33a" stroke-width="6"/>
    <rect x="-6" y="-152" width="12" height="12" fill="#d9a27a"/>
    <circle cx="0" cy="-166" r="19" fill="#d9a27a"/>
    <path d="M-19 -168 a19 19 0 0 1 38 0 q-8 -6 -19 -6 q-11 0 -19 6 z" fill="#2e2a2a"/><circle cx="16" cy="-178" r="10" fill="#2e2a2a"/>
    <circle cx="-8" cy="-164" r="2.4" fill="#2e2a2a"/><path d="M-10 -154 q-4 2 -8 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-18 -112 l-14 30 l-8 -24" stroke="#d9a27a" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-54" y="-136" width="22" height="36" rx="4" fill="#3d3a3a"/><rect x="-51" y="-132" width="16" height="26" fill="#9fc4c8"/>
  </g>
  <!-- bubble: bill paid -->
  <rect x="700" y="80" width="200" height="110" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M752 190 l-4 228" stroke="#cbbfa9" stroke-width="2" stroke-dasharray="5 6"/>
  <rect x="720" y="96" width="70" height="80" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M742 108 l-8 16 h10 l-6 16 l16 -22 h-10 l6 -10 z" fill="#e0a33a"/>
  <path d="M730 150 h50 M730 162 h36" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/>
  <text x="846" y="128" text-anchor="middle" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1">PAID</text>
  <use href="#tick" transform="translate(846 156)"/>
</svg>
