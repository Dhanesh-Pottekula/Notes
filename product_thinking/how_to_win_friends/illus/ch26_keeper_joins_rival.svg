<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A coach shouts at a young wicketkeeper in front of the squad; later the same boy takes a diving catch for a rival club</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <clipPath id="ic"><circle cx="740" cy="360" r="150"/></clipPath>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="w">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#ffffff"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#d9a27a"/>
      <circle cx="0" cy="-148" r="19" fill="#d9a27a"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="ball"><circle r="8" fill="#c8383a"/><path d="M-6 -4 q6 4 12 0" stroke="#fff" stroke-width="1.5" fill="none"/></g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#c9c79a"/>
  <!-- practice nets -->
  <g stroke="#b9ad98" stroke-width="2"><path d="M30 300 h520 M30 340 h520 M30 380 h520 M30 420 h520 M30 460 h520 M30 500 h520"/><path d="M50 300 v240 M110 300 v240 M170 300 v240 M230 300 v240 M290 300 v240 M350 300 v240 M410 300 v240 M470 300 v240 M530 300 v240"/></g>
  <path d="M30 300 h520" stroke="#8a6d5a" stroke-width="6"/>

  <!-- squad watching, arms folded -->
  <g transform="translate(410 548) scale(.82)"><use href="#w"/><path d="M-22 -94 h44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/><circle cx="-6" cy="-146" r="2.6" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.6" fill="#2e2a2a"/></g>
  <g transform="translate(470 548) scale(.82)"><use href="#w"/><path d="M-22 -94 h44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/><circle cx="-6" cy="-146" r="2.6" fill="#2e2a2a"/><path d="M-8 -136 q8 6 14 -2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
  <g transform="translate(530 548) scale(.82)"><use href="#w"/><path d="M-22 -94 h44" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/><circle cx="-6" cy="-146" r="2.6" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.6" fill="#2e2a2a"/></g>

  <!-- coach shouting -->
  <g transform="translate(130 580) scale(1.1)"><use href="#m" color="#1f4f88"/>
    <path d="M-16 -64 h32" stroke="#ffffff" stroke-width="3"/>
    <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-20 -152 a20 20 0 0 1 40 0 z" fill="#e07a5f"/><path d="M10 -153 h22" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
    <path d="M-10 -122 l10 18 l10 -18" stroke="#cbbfa9" stroke-width="2" fill="none"/><circle cx="0" cy="-104" r="4" fill="#9a9590"/>
    <circle cx="8" cy="-144" r="2.6" fill="#2e2a2a"/><path d="M3 -150 l11 3" stroke="#2e2a2a" stroke-width="2.5"/><ellipse cx="9" cy="-134" rx="4" ry="3.5" fill="#2e2a2a"/>
    <path d="M22 -104 l38 -6 l18 -12" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -104 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- jagged shout bubble -->
  <path transform="translate(-40 96)" d="M120 150 l30 -26 l14 22 l32 -30 l8 30 l34 -10 l-12 30 l30 14 l-30 16 l14 30 l-36 -8 l-12 28 l-20 -26 l-30 20 l-2 -30 l-34 -2 l20 -24 l-24 -20 z" fill="#e07a5f"/>
  <text x="150" y="292" text-anchor="middle" font-size="46" font-weight="800" fill="#fff">!</text>

  <!-- young keeper, eyes down -->
  <g transform="translate(270 580)"><use href="#w"/>
    <rect x="-17" y="-60" width="15" height="58" rx="5" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/><rect x="2" y="-60" width="15" height="58" rx="5" fill="#ffffff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-10 -142 q4 3 8 0 M2 -142 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-5 -132 q5 -3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-8 36 M22 -104 l8 36" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="-32" cy="-62" rx="13" ry="15" fill="#f3ede0" stroke="#b9ad98" stroke-width="2"/><ellipse cx="32" cy="-62" rx="13" ry="15" fill="#f3ede0" stroke="#b9ad98" stroke-width="2"/>
  </g>
  <!-- excuse bubble: sun and swinging ball -->
  <rect x="250" y="250" width="130" height="80" rx="18" fill="#efece6" stroke="#b9ad98" stroke-width="2"/>
  <path d="M282 328 l-6 22 l22 -20" fill="#efece6" stroke="#b9ad98" stroke-width="2"/><path d="M284 326 h12" stroke="#efece6" stroke-width="5"/>
  <circle cx="284" cy="290" r="12" fill="#e0a33a"/><path d="M284 268 v-6 M284 312 v6 M262 290 h-6 M306 290 h6" stroke="#e0a33a" stroke-width="3" stroke-linecap="round"/>
  <path d="M316 306 q20 -2 30 -30" stroke="#9a9590" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
  <use href="#ball" transform="translate(350 272)"/>
  <!-- three dropped balls -->
  <use href="#ball" transform="translate(220 588)"/><use href="#ball" transform="translate(320 594)"/><use href="#ball" transform="translate(350 582)"/>

  <!-- arrow to the rival club -->
  <path d="M310 230 C400 120 520 160 590 270" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <text x="740" y="180" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">RIVAL CLUB</text>
  <!-- inset -->
  <circle cx="740" cy="360" r="150" fill="#fbeedb"/>
  <g clip-path="url(#ic)">
    <rect x="580" y="430" width="320" height="100" fill="#a9c47a"/>
    <g fill="#e3dccd"><rect x="854" y="350" width="7" height="84" rx="2"/><rect x="868" y="350" width="7" height="84" rx="2"/><rect x="882" y="350" width="7" height="84" rx="2"/></g>
    <path d="M852 348 h40" stroke="#c8a878" stroke-width="4"/>
    <!-- diving keeper -->
    <ellipse cx="740" cy="446" rx="110" ry="8" fill="#000" opacity=".1"/>
    <path d="M790 396 l70 -18 M790 410 l74 -4" stroke="#f3ede0" stroke-width="16" stroke-linecap="round"/>
    <rect x="700" y="384" width="100" height="36" rx="18" fill="#1f6f78"/>
    <path d="M708 392 l-60 -26 M712 404 l-62 -14" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <circle cx="684" cy="398" r="19" fill="#d9a27a"/><path d="M665 394 a19 19 0 0 1 38 0 z" fill="#e07a5f"/><path d="M668 392 h-14" stroke="#e07a5f" stroke-width="6" stroke-linecap="round"/>
    <circle cx="678" cy="400" r="2.5" fill="#2e2a2a"/><path d="M672 408 q6 6 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <ellipse cx="640" cy="372" rx="15" ry="17" fill="#f3ede0" stroke="#b9ad98" stroke-width="2"/>
    <use href="#ball" transform="translate(634 366)"/>
  </g>
  <circle cx="740" cy="360" r="150" fill="none" stroke="#1f6f78" stroke-width="5"/>
  <use href="#tick" transform="translate(690 270)"/>
</svg>
