<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A teacher shames a boy by holding up his copied notebook in front of the class, versus talking to him quietly after the bell</title>
  <defs>
    <g id="boy">
      <ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/>
      <rect x="-13" y="-44" width="11" height="44" rx="5" fill="#c98a5e"/><rect x="2" y="-44" width="11" height="44" rx="5" fill="#c98a5e"/>
      <rect x="-17" y="-62" width="34" height="24" rx="4" fill="#2f3f6b"/>
      <path d="M-20 -60 v-36 a20 20 0 0 1 40 0 v36 z" fill="#ffffff"/>
      <path d="M0 -112 l-4 6 l4 30 l4 -30 z" fill="#2f3f6b"/>
    </g>
    <g id="teacher">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <path d="M-30 0 l8 -122 a22 22 0 0 1 44 0 l8 122 z" fill="#e0a33a"/>
      <path d="M-22 -122 l44 66" stroke="#1f6f78" stroke-width="7"/>
      <rect x="-6" y="-154" width="12" height="12" fill="#b07850"/>
      <circle cx="0" cy="-168" r="20" fill="#b07850"/>
      <path d="M-20 -170 a20 20 0 0 1 40 0 q-8 -6 -20 -6 q-12 0 -20 6 z" fill="#2e2a2a"/>
      <circle cx="-8" cy="-168" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/><circle cx="8" cy="-168" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/>
    </g>
    <g id="kid"><rect x="-18" y="-40" width="36" height="40" rx="14" fill="#ffffff"/><circle cx="0" cy="-54" r="15" fill="#c98a5e"/><path d="M-15 -56 a15 15 0 0 1 30 0 z" fill="#2e2a2a"/></g>
    <g id="tick"><circle r="16" fill="#3f9a5a"/><path d="M-8 0 l5 6 l11 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">IN FRONT</text>
  <text x="720" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">IN PRIVATE</text>

  <!-- LEFT: chalkboard -->
  <rect x="40" y="100" width="400" height="120" rx="4" fill="#8a6d5a"/><rect x="50" y="110" width="380" height="100" fill="#2f5d50"/>
  <path d="M74 140 h120 M74 168 h80 M250 150 h140" stroke="#cfe0d6" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <!-- teacher holding notebook high -->
  <g transform="translate(130 560)"><use href="#teacher"/>
    <path d="M-12 -150 q6 6 14 2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <ellipse cx="2" cy="-152" rx="6" ry="4" fill="#2e2a2a"/>
    <path d="M20 -114 l26 -50 l6 -40 M-20 -114 l-4 -40" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(184 330) rotate(8)">
    <rect x="-44" y="-30" width="88" height="56" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><path d="M0 -30 v56" stroke="#b9ad98" stroke-width="2"/>
    <path d="M-36 -16 h28 M-36 -4 h24 M8 -16 h28 M8 -4 h22 M8 8 h26" stroke="#7a8fa0" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- boy head bowed -->
  <g transform="translate(260 560)"><use href="#boy"/>
    <circle cx="4" cy="-120" r="17" fill="#c98a5e"/><path d="M-13 -124 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
    <path d="M0 -112 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><ellipse cx="14" cy="-110" rx="5" ry="3" fill="#e07a5f" opacity=".7"/>
    <path d="M-18 -94 l10 32 M18 -94 l-8 32" stroke="#c98a5e" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <!-- rain cloud of dread -->
  <g transform="translate(266 374)"><path d="M-34 10 a14 14 0 0 1 4 -27 a20 20 0 0 1 38 -6 a14 14 0 0 1 24 13 a12 12 0 0 1 -4 20 z" fill="#7d7a86"/>
    <path d="M-18 22 l-4 12 M0 22 l-4 12 M18 22 l-4 12" stroke="#5b9bd5" stroke-width="3" stroke-linecap="round"/></g>
  <circle cx="306" cy="420" r="15" fill="#e07a5f"/><text x="306" y="428" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">!</text>
  <!-- staring classmates -->
  <use href="#kid" transform="translate(342 488)"/><use href="#kid" transform="translate(392 480)"/><use href="#kid" transform="translate(442 488)"/>
  <path d="M330 462 l-30 -10" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>
  <path d="M384 438 q8 6 16 0" stroke="#c98a5e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <circle cx="336" cy="436" r="2.4" fill="#2e2a2a"/><circle cx="386" cy="428" r="2.4" fill="#2e2a2a"/><circle cx="436" cy="436" r="2.4" fill="#2e2a2a"/>
  <rect x="318" y="486" width="148" height="14" rx="3" fill="#8a6d5a"/><rect x="326" y="500" width="10" height="60" fill="#6b5446"/><rect x="448" y="500" width="10" height="60" fill="#6b5446"/>

  <!-- RIGHT: chalkboard + clock -->
  <rect x="520" y="100" width="300" height="120" rx="4" fill="#8a6d5a"/><rect x="530" y="110" width="280" height="100" fill="#2f5d50"/>
  <circle cx="878" cy="150" r="32" fill="#fff" stroke="#6b5446" stroke-width="5"/><path d="M878 150 v-22 M878 150 l6 -2" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <!-- window light -->
  <path d="M840 250 h80 v130 h-80 z" fill="#fbeedb"/><path d="M880 250 v130 M840 315 h80" stroke="#cbbfa9" stroke-width="4"/>
  <!-- teacher seated at desk -->
  <g transform="translate(610 470)">
    <path d="M-30 0 v-80 a24 24 0 0 1 48 0 l4 80 z" fill="#e0a33a" transform="rotate(8)"/>
    <path d="M-16 -100 l30 62" stroke="#1f6f78" stroke-width="7"/>
    <rect x="-4" y="-122" width="12" height="12" fill="#b07850"/>
    <circle cx="4" cy="-136" r="20" fill="#b07850"/>
    <path d="M-16 -138 a20 20 0 0 1 40 0 q-8 -6 -20 -6 q-12 0 -20 6 z" fill="#2e2a2a"/>
    <circle cx="-2" cy="-136" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/><circle cx="14" cy="-136" r="6" fill="none" stroke="#3d3a3a" stroke-width="2.5"/>
    <path d="M4 -124 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M18 -80 l40 10 l26 -14" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="560" y="466" width="200" height="14" rx="3" fill="#8a6d5a"/><rect x="574" y="480" width="172" height="80" fill="#6b5446"/>
  <rect x="644" y="452" width="60" height="14" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <!-- boy standing calm with fresh notebook -->
  <g transform="translate(844 560)"><use href="#boy"/>
    <circle cx="0" cy="-122" r="17" fill="#c98a5e"/><path d="M-17 -126 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-122" r="2.4" fill="#2e2a2a"/><circle cx="5" cy="-122" r="2.4" fill="#2e2a2a"/>
    <path d="M-6 -112 h10" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-18 -92 l-20 26 l10 6" stroke="#c98a5e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M18 -92 l4 34" stroke="#c98a5e" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  <rect x="776" y="470" width="40" height="52" rx="3" fill="#9fc4c8" stroke="#1f6f78" stroke-width="2"/>
  <path d="M820 462 l10 40" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  <use href="#tick" transform="translate(796 444)"/>
</svg>
