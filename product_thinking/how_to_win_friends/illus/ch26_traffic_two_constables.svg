<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One constable lectures a scooter rider loudly at a crowded junction; another writes the same challan quietly at the roadside</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="cop">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#b2955c"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#b2955c"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#c9ad72"/>
      <path d="M-24 -66 h48" stroke="#6b5446" stroke-width="6"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/>
      <path d="M-22 -160 h44 l-4 -14 h-36 z" fill="#ffffff"/><path d="M-24 -160 h48" stroke="#3d3a3a" stroke-width="3"/>
      <path d="M-14 -140 h10" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="scooter">
      <path d="M-76 -30 q0 -38 44 -38 h34 v34 h30 l20 -60 h14 l-10 40 q30 12 30 44 z" fill="#5b9bd5"/>
      <circle cx="-48" cy="-18" r="18" fill="#3d3a3a"/><circle cx="-48" cy="-18" r="7" fill="#b8bec2"/>
      <circle cx="50" cy="-18" r="18" fill="#3d3a3a"/><circle cx="50" cy="-18" r="7" fill="#b8bec2"/>

      <rect x="-64" y="-78" width="58" height="12" rx="6" fill="#3d3a3a"/>
      <path d="M58 -100 h-20" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="slip">
      <rect x="-42" y="-24" width="84" height="54" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
      <text x="-30" y="0" font-size="18" font-weight="800" fill="#2b2b2b">FINE</text>
      <path d="M-30 14 h40" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/>
      <circle cx="26" cy="12" r="11" fill="#3f9a5a"/><path d="M20 12 l4 4 l8 -8" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <g id="signal"><rect x="-4" y="-260" width="8" height="260" fill="#3d3a3a"/><rect x="-18" y="-330" width="36" height="84" rx="8" fill="#3d3a3a"/><circle cx="0" cy="-310" r="10" fill="#e0443a"/><circle cx="0" cy="-288" r="10" fill="#6a5a3a"/><circle cx="0" cy="-266" r="10" fill="#3a5a3a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="480" width="960" height="80" fill="#b9b4ac"/>
  <path d="M0 520 h960" stroke="#f6f1e7" stroke-width="5" stroke-dasharray="30 24"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LOUD</text>
  <text x="720" y="64" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">QUIET</text>

  <!-- LEFT: busy junction -->
  <rect x="30" y="150" width="90" height="330" fill="#cbbfa9"/><rect x="130" y="210" width="70" height="270" fill="#d8cdb8"/>
  <g fill="#f6f1e7"><rect x="46" y="170" width="20" height="24"/><rect x="84" y="170" width="20" height="24"/><rect x="46" y="220" width="20" height="24"/><rect x="84" y="220" width="20" height="24"/></g>
  <use href="#signal" transform="translate(440 480)"/>
  <!-- constable shouting -->
  <g transform="translate(160 540)"><use href="#cop"/>
    <ellipse cx="10" cy="-134" rx="5" ry="4" fill="#2e2a2a"/><path d="M2 -148 l10 3" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -104 l30 -10 l10 -26" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -104 l-6 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path transform="translate(100 120)" d="M40 70 l26 -22 l12 20 l28 -26 l8 26 l30 -8 l-10 26 l26 12 l-26 14 l12 26 l-32 -8 l-10 24 l-18 -22 l-26 18 l-2 -26 l-30 -2 l18 -22 l-22 -18 z" fill="#e07a5f"/>
  <text x="198" y="234" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">!</text>
  <!-- rider on scooter, jaw tight -->
  <use href="#scooter" transform="translate(290 552) scale(-1 1)"/>
  <g transform="translate(300 486)">
    <path d="M-20 0 v-60 a20 20 0 0 1 40 0 v60 z" fill="#ffffff"/>
    <rect x="-20" y="-6" width="40" height="18" rx="8" fill="#4a3f55"/><path d="M-20 10 l-14 40" stroke="#4a3f55" stroke-width="13" stroke-linecap="round"/>
    <circle cx="0" cy="-82" r="18" fill="#c98a5e"/><path d="M-22 -84 a22 24 0 0 1 44 0 v6 h-44 z" fill="#1f6f78"/>
    <circle cx="8" cy="-78" r="2.5" fill="#2e2a2a"/><path d="M4 -68 h10" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-16 -50 l-30 18" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- muttering scribble cloud -->
  <g transform="translate(300 362)"><path d="M-34 10 a14 14 0 0 1 4 -27 a20 20 0 0 1 38 -6 a14 14 0 0 1 24 13 a12 12 0 0 1 -4 20 z" fill="#5a5560"/>
    <path d="M-20 -2 l8 -8 l6 10 l8 -10 l6 10 l8 -10" stroke="#fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- staring onlookers -->
  <g transform="translate(386 480) scale(.72)"><use href="#m" color="#e07a5f"/><path d="M-19 -150 a19 19 0 0 1 38 0 q-8 -6 -19 -6 q-11 0 -19 6 z" fill="#2e2a2a"/><circle cx="-6" cy="-146" r="3" fill="#2e2a2a"/><circle cx="6" cy="-146" r="3" fill="#2e2a2a"/><path d="M-22 -104 l-30 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><rect x="18" y="-90" width="24" height="30" rx="4" fill="#e0a33a"/></g>
  <g transform="translate(424 474) scale(.68)"><use href="#m" color="#7a4e7e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-6" cy="-146" r="3" fill="#2e2a2a"/><circle cx="6" cy="-146" r="3" fill="#2e2a2a"/></g>
  <g transform="translate(462 482) scale(.54)"><use href="#m" color="#e0a33a"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="-6" cy="-146" r="3" fill="#2e2a2a"/></g>
  <use href="#slip" transform="translate(240 598)"/>

  <!-- RIGHT: quiet roadside under a tree -->
  <use href="#signal" transform="translate(530 480)"/>
  <rect x="890" y="250" width="22" height="230" fill="#6b5446"/>
  <circle cx="900" cy="210" r="70" fill="#5f9a6a"/><circle cx="850" cy="250" r="44" fill="#4e8a5a"/><circle cx="930" cy="268" r="40" fill="#4e8a5a"/>
  <use href="#scooter" transform="translate(630 552)"/>
  <!-- rider standing, helmet under arm, calm -->
  <g transform="translate(740 552)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/><path d="M4 -136 q6 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-10 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-50 -80 a20 22 0 0 1 40 0 v8 h-40 z" fill="#1f6f78"/>
  </g>
  <!-- constable writing the challan -->
  <g transform="translate(830 552)"><use href="#cop"/>
    <path d="M-6 -136 q-6 3 -10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-14 30 l10 6" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-46" y="-86" width="28" height="34" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
    <path d="M22 -104 l-14 34" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><path d="M6 -70 l-14 -6" stroke="#2b2b2b" stroke-width="3"/>
  </g>
  <use href="#slip" transform="translate(720 598)"/>
</svg>
