<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At an evening cricket net a coach points to a shy boy's wrist after a spinning ball and asks him to bowl it again</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <marker id="aa" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e0a33a"/></marker>
    <pattern id="net" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 0 L18 18 M18 0 L0 18" stroke="#3f8a5a" stroke-width="1.2" opacity=".55"/></pattern>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="0" width="960" height="330" fill="#f3e6d2"/>
  <rect y="330" width="960" height="310" fill="#d8cdb8"/>
  <!-- floodlight -->
  <path d="M900 330 V110" stroke="#3d3a3a" stroke-width="8"/>
  <rect x="860" y="84" width="80" height="30" rx="4" fill="#3d3a3a"/>
  <g fill="#fff6d8"><circle cx="876" cy="99" r="8"/><circle cx="900" cy="99" r="8"/><circle cx="924" cy="99" r="8"/></g>
  <circle cx="900" cy="99" r="60" fill="#e0a33a" opacity=".14"/>
  <!-- pitch strip -->
  <path d="M120 600 L320 360 H700 L800 600 z" fill="#c9b88f"/>
  <!-- net -->
  <path d="M220 200 H760 V560 H220 z" fill="url(#net)"/>
  <path d="M220 200 V560 M760 200 V560 M220 200 H760" stroke="#6b5446" stroke-width="6"/>
  <!-- stumps -->
  <g fill="#f3ede0" stroke="#b9ad98" stroke-width="1"><rect x="700" y="420" width="6" height="70"/><rect x="712" y="420" width="6" height="70"/><rect x="724" y="420" width="6" height="70"/></g>
  <!-- other boys walking off -->
  <g opacity=".7">
    <use href="#m" color="#ffffff" transform="translate(70 560) scale(.55)"/><rect x="80" y="508" width="34" height="18" rx="4" fill="#1f6f78"/>
    <use href="#m" color="#ffffff" transform="translate(130 560) scale(.55)"/><rect x="140" y="508" width="34" height="18" rx="4" fill="#e07a5f"/>
  </g>
  <!-- boy bowling -->
  <g transform="translate(320 560) scale(1.05)"><use href="#m" color="#ffffff"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#f3ede0"/>
    <path d="M-20 -162 a20 14 0 0 1 40 0 z" fill="#1f6f78"/><path d="M-20 -162 h-12" stroke="#1f6f78" stroke-width="5"/>
    <circle cx="5" cy="-148" r="2.2" fill="#2e2a2a"/><circle cx="14" cy="-148" r="2.2" fill="#2e2a2a"/>
    <path d="M4 -138 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
    <path d="M18 -110 l20 -64" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
    <path d="M38 -174 l12 -6" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>
    <path d="M-18 -104 l-30 30" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <!-- ball path -->
  <circle cx="380" cy="360" r="9" fill="#c0392b"/><path d="M374 356 q6 4 12 0" stroke="#fff" stroke-width="1.5" fill="none"/>
  <path d="M392 366 C520 380 600 520 640 470 S690 440 700 450" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M368 346 a14 14 0 1 1 -4 22" stroke="#e0a33a" stroke-width="3" fill="none" marker-end="url(#aa)"/>
  <!-- practice cone near boy -->
  <path d="M250 560 l12 -34 l12 34 z" fill="#e07a5f"/><path d="M256 544 h12" stroke="#fff" stroke-width="3"/>

  <!-- wrist inset -->
  <text x="140" y="74" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">WRIST</text>
  <circle cx="140" cy="200" r="96" fill="#fff" stroke="#e0a33a" stroke-width="5"/>
  <path d="M220 240 L330 380" stroke="#e0a33a" stroke-width="3" stroke-dasharray="6 6"/>
  <path d="M80 280 l40 -70" stroke="#c98a5e" stroke-width="26" stroke-linecap="round"/>
  <path d="M120 210 q20 -40 50 -40 q18 6 4 22 q-14 4 -24 26 z" fill="#c98a5e"/>
  <path d="M140 196 q4 -10 14 -14 M150 204 q6 -10 16 -12" stroke="#b07850" stroke-width="3" fill="none"/>
  <circle cx="174" cy="158" r="14" fill="#c0392b"/><path d="M166 152 q8 6 16 0" stroke="#fff" stroke-width="2" fill="none"/>
  <path d="M104 160 a50 50 0 0 1 80 -30" stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#ah)"/>

  <!-- coach outside net -->
  <text x="826" y="300" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">DO IT AGAIN</text>
  <g transform="translate(850 560) scale(1.14)"><use href="#m" color="#2f3f6a"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#2f3f6a"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#2f3f6a"/>
    <path d="M-20 -160 a20 14 0 0 1 40 0 z" fill="#e0a33a"/><path d="M-20 -160 h-14" stroke="#e0a33a" stroke-width="5"/>
    <path d="M-16 -140 q0 20 16 22 q16 -2 16 -22 q-8 8 -16 8 q-8 0 -16 -8 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-148" r="2.2" fill="#2e2a2a"/><circle cx="5" cy="-148" r="2.2" fill="#2e2a2a"/>
    <path d="M-8 -132 q6 3 12 0" stroke="#f3ede0" stroke-width="2.2" fill="none"/>
    <path d="M-12 -124 l10 30" stroke="#cbbfa9" stroke-width="2"/><circle cx="-2" cy="-92" r="4" fill="#cbbfa9"/>
    <path d="M-22 -104 l-60 -24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l20 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
