<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Wedding guests mumble vague praise on their way out while one old uncle praises the cook's food in specific detail</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="g"><path d="M-18 0 l4 -70 a14 14 0 0 1 28 0 l4 70 z" fill="currentColor"/><circle cx="0" cy="-86" r="14" fill="#c98a5e"/><path d="M-14 -88 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/></g>
    <g id="fb"><rect x="-38" y="-24" width="76" height="40" rx="14" fill="#fff" stroke="#d8cdb8" stroke-width="2"/><path d="M-8 6 v-14 l8 -10 v10 h10 v14 z" fill="#d8cdb8"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- kitchen side tint and doorway wall -->
  <rect x="440" y="0" width="520" height="560" fill="#efe4d2"/>
  <rect x="430" y="120" width="24" height="440" fill="#b9ad98"/>
  <!-- marigold garland on hall doorway -->
  <path d="M40 140 q200 70 390 0" stroke="#e0a33a" stroke-width="10" fill="none" stroke-dasharray="1 12" stroke-linecap="round"/>
  <path d="M60 140 v60 M410 140 v60" stroke="#e0a33a" stroke-width="10" stroke-dasharray="1 12" stroke-linecap="round"/>
  <text x="230" y="104" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" opacity=".7">VERY NICE</text>
  <!-- faded guest bubbles -->
  <g opacity=".55"><use href="#fb" transform="translate(110 290)"/><use href="#fb" transform="translate(190 270)"/><use href="#fb" transform="translate(270 290)"/><use href="#fb" transform="translate(350 272)"/></g>
  <!-- guests walking out (left) -->
  <use href="#g" color="#e07a5f" transform="translate(90 560) scale(1.3)"/>
  <use href="#g" color="#1f6f78" transform="translate(170 560) scale(1.25)"/>
  <use href="#g" color="#e0a33a" transform="translate(250 560) scale(1.3)"/>
  <use href="#g" color="#7a4e7e" transform="translate(330 560) scale(1.25)"/>
  <path d="M76 478 l-24 -26" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>
  <path d="M380 560 H40" stroke="#9a9590" stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M40 560 l14 -8 v16 z" fill="#9a9590"/>

  <!-- kitchen: burners and vessels -->
  <rect x="480" y="470" width="190" height="90" fill="#3d3a3a"/>
  <path d="M494 470 v-80 h160 v80 z" fill="#b8bec2"/><ellipse cx="574" cy="390" rx="80" ry="14" fill="#c4743a"/>
  <path d="M554 376 q8 -18 0 -34 M594 374 q8 -18 0 -34" stroke="#e3dccd" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="880" y="420" width="60" height="140" fill="#3d3a3a"/>
  <path d="M884 420 v-60 h52 v60 z" fill="#b8bec2"/><ellipse cx="910" cy="360" rx="26" ry="7" fill="#9a9590"/>
  <!-- cook -->
  <g transform="translate(700 560) scale(1.12)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -102 h48 v12 h-48 z" fill="#ffffff"/>
    <path d="M14 -122 q14 4 18 30 l-8 4 q-4 -20 -16 -24 z" fill="#e07a5f"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/>
    <path d="M-10 -150 q4 -4 8 0 M2 -150 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M-10 -138 q10 10 20 0 z" fill="#7a3a3a"/>
    <circle cx="12" cy="-160" r="2.5" fill="#5b9bd5"/>
    <path d="M-22 -104 l-70 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-92 -134 l-18 70" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>
    <path d="M14 -100 l-6 -2" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/>
  </g>
  <!-- uncle with walking stick -->
  <g transform="translate(820 560) scale(1.12)"><use href="#m" color="#f3ede0"/>
    <path d="M-18 -62 h36 v62 h-36 z" fill="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -4 -38 0 z" fill="#e3dccd"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2"><circle cx="-7" cy="-148" r="5"/><circle cx="6" cy="-148" r="5"/></g>
    <path d="M-12 -134 q6 3 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M-22 -104 l-22 -40" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><path d="M-44 -146 v-14" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/>
    <path d="M22 -100 l14 40" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
    <path d="M40 -64 v64" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/><path d="M40 -64 q0 -10 -10 -8" stroke="#6b5446" stroke-width="5" fill="none"/>
  </g>
  <!-- uncle's specific bubble -->
  <text x="730" y="74" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SPECIFIC</text>
  <rect x="520" y="94" width="420" height="170" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M790 262 l-2 46 l34 -46" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M792 261 h28" stroke="#fff" stroke-width="5"/>
  <!-- bisi bele bath bowl with tamarind -->
  <path d="M546 180 h104 a52 46 0 0 1 -104 0 z" fill="#b8bec2"/><ellipse cx="598" cy="180" rx="52" ry="12" fill="#c4743a"/>
  <g fill="#e0a33a"><circle cx="580" cy="178" r="4"/><circle cx="604" cy="182" r="3"/><circle cx="620" cy="176" r="3.5"/></g>
  <path d="M570 132 q24 -16 48 0 q-6 10 -24 6 q-18 4 -24 -6 z" fill="#8a5a3a"/>
  <!-- raita with boondi -->
  <path d="M676 180 h104 a52 46 0 0 1 -104 0 z" fill="#b8bec2"/><ellipse cx="728" cy="180" rx="52" ry="12" fill="#fff"/>
  <g fill="#e0a33a"><circle cx="706" cy="178" r="5"/><circle cx="724" cy="182" r="5"/><circle cx="744" cy="177" r="5"/><circle cx="756" cy="183" r="4"/><circle cx="732" cy="174" r="4"/></g>
  <!-- clock at ten -->
  <circle cx="866" cy="178" r="44" fill="#fff" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M866 178 v-30 M866 178 l-22 -12" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
  <g fill="#3d3a3a"><circle cx="866" cy="142" r="3"/><circle cx="902" cy="178" r="3"/><circle cx="866" cy="214" r="3"/><circle cx="830" cy="178" r="3"/></g>
  <circle cx="908" cy="132" r="18" fill="#3f9a5a"/><path d="M899 132 l6 6 l12 -13" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
