<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A hostel student walks the campus at midnight rereading an editor's note in his printed story, ten rejected envelopes left in his room</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="env"><rect x="0" y="0" width="80" height="14" rx="2" fill="#b98a5a"/><path d="M0 0 l40 9 l40 -9" stroke="#8a6d5a" stroke-width="1.5" fill="none"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- moon and stars -->
  <path d="M520 70 a30 30 0 1 0 30 38 a24 24 0 1 1 -30 -38 z" fill="#e0a33a"/>
  <g fill="#cbbfa9"><circle cx="440" cy="60" r="3"/><circle cx="470" cy="120" r="2.5"/><circle cx="380" cy="100" r="2"/><circle cx="560" cy="170" r="2.5"/></g>

  <!-- hostel block cutaway room -->
  <rect x="30" y="150" width="340" height="410" fill="#cbbfa9"/>
  <rect x="50" y="190" width="300" height="250" rx="4" fill="#6b5446"/><rect x="60" y="200" width="280" height="230" fill="#efe4d2"/>
  <text x="200" y="134" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">10 REJECTED</text>
  <!-- bed with lifted mattress -->
  <rect x="70" y="380" width="150" height="8" fill="#3d3a3a"/><path d="M74 388 v40 M216 388 v40" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M70 378 h150 v-14 l-150 -22 z" fill="#d9c9a6"/>
  <rect x="96" y="362" width="44" height="14" rx="2" fill="#1f6f78" transform="rotate(-4 118 369)"/>
  <!-- desk with envelopes -->
  <rect x="240" y="370" width="90" height="8" fill="#8a6d5a"/><path d="M246 378 v52 M324 378 v52" stroke="#8a6d5a" stroke-width="5"/>
  <use href="#env" transform="translate(245 356)"/><use href="#env" transform="translate(242 342) rotate(-3)"/><use href="#env" transform="translate(247 328)"/>
  <use href="#env" transform="translate(244 314) rotate(2)"/><use href="#env" transform="translate(246 300)"/><use href="#env" transform="translate(243 286) rotate(-2)"/>
  <use href="#env" transform="translate(246 272)"/><use href="#env" transform="translate(244 258) rotate(3)"/><use href="#env" transform="translate(246 244)"/><use href="#env" transform="translate(245 230) rotate(-2)"/>
  <circle cx="306" cy="226" r="14" fill="#e07a5f"/><path d="M300 220 l12 12 M312 220 l-12 12" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- path and street lamp -->
  <path d="M370 560 h590" stroke="#cbbfa9" stroke-width="2"/>
  <ellipse cx="660" cy="556" rx="170" ry="20" fill="#e0a33a" opacity=".18"/>
  <path d="M540 560 V320" stroke="#3d3a3a" stroke-width="7"/><path d="M540 324 q30 -10 46 6" stroke="#3d3a3a" stroke-width="6" fill="none"/>
  <path d="M572 330 h30 l-6 12 h-18 z" fill="#3d3a3a"/>
  <path d="M574 342 L500 556 H760 L600 342 z" fill="#e0a33a" opacity=".12"/>
  <!-- neem tree -->
  <rect x="868" y="380" width="22" height="180" fill="#6b5446"/>
  <circle cx="880" cy="330" r="62" fill="#1f6f78"/><circle cx="836" cy="372" r="40" fill="#1f6f78"/><circle cx="920" cy="378" r="38" fill="#185a61"/>

  <!-- student reading -->
  <g transform="translate(690 560) scale(1.1)"><use href="#m" color="#9a9590"/>
    <path d="M-18 -152 q-4 -18 10 -20 q6 -8 14 -2 q12 -4 14 10 q4 6 0 12 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-146" r="2.2" fill="#2e2a2a"/><circle cx="6" cy="-146" r="2.2" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-22 -100 l-20 28 M22 -100 l20 28" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
    <path d="M-56 -100 l56 -6 l56 6 l-6 44 l-50 -4 l-50 4 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M0 -106 v46" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-46 -90 h36 M-46 -80 h36 M-46 -70 h28 M10 -90 h36 M10 -80 h36" stroke="#b9ad98" stroke-width="3"/>
    <rect x="12" y="-74" width="30" height="12" fill="#e0a33a"/>
  </g>
  <!-- reread loop -->
  <defs><marker id="ap" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker></defs>
  <path d="M650 352 a44 30 0 1 1 80 0" stroke="#7a4e7e" stroke-width="3.5" fill="none" stroke-dasharray="6 5" marker-end="url(#ap)"/>
  <!-- inset: printed page with note -->
  <text x="760" y="70" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">PRINTED</text>
  <rect x="610" y="88" width="300" height="190" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M720 276 l-6 34 l34 -34" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M718 275 h30" stroke="#fff" stroke-width="5"/>
  <rect x="632" y="106" width="120" height="152" fill="#f6f1e7"/>
  <rect x="640" y="114" width="104" height="14" fill="#2b2b2b" opacity=".75"/>
  <path d="M640 144 h104 M640 158 h104 M640 172 h104 M640 186 h90 M640 200 h104 M640 214 h104 M640 228 h70 M640 242 h96" stroke="#b9ad98" stroke-width="4"/>
  <path d="M770 128 l124 -6 l4 112 l-124 6 z" fill="#fff6d8" stroke="#e0a33a" stroke-width="2"/>
  <rect x="806" y="116" width="26" height="14" rx="3" fill="#9a9590" opacity=".6" transform="rotate(-3 819 123)"/>
  <text x="834" y="172" text-anchor="middle" font-size="21" font-style="italic" fill="#2b2b2b" transform="rotate(-3 834 172)">Please</text>
  <text x="834" y="200" text-anchor="middle" font-size="21" font-style="italic" fill="#2b2b2b" transform="rotate(-3 834 200)">send more</text>
  <path d="M800 216 q30 6 64 -6" stroke="#7a4e7e" stroke-width="2" fill="none"/>
</svg>
