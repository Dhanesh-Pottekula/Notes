<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A grandmother praises the puffed side of a child's lopsided first roti while a row of rotis grows rounder towards the tenth</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="spots" fill="#8a5a3a"><circle cx="-8" cy="-4" r="4"/><circle cx="6" cy="6" r="3"/><circle cx="10" cy="-8" r="3.5"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- window -->
  <rect x="560" y="70" width="220" height="170" rx="6" fill="#6b5446"/><rect x="572" y="82" width="196" height="146" fill="#fbeedb"/>
  <path d="M670 82 v146 M572 155 h196" stroke="#6b5446" stroke-width="6"/>
  <circle cx="620" cy="125" r="22" fill="#e0a33a" opacity=".7"/>
  <path d="M572 228 L520 560 H800 L768 228 z" fill="#e0a33a" opacity=".07"/>
  <!-- shelf with jars -->
  <path d="M820 200 H930" stroke="#8a6d5a" stroke-width="8"/>
  <g fill="#cbbfa9"><rect x="830" y="160" width="30" height="40" rx="5"/><rect x="872" y="150" width="34" height="50" rx="5"/></g>

  <!-- speech bubble from grandmother -->
  <rect x="50" y="90" width="260" height="150" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M150 238 l14 46 l26 -46" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M152 237 h36" stroke="#fff" stroke-width="5"/>
  <path d="M90 170 q-6 -40 40 -46 q30 -14 60 6 q34 0 30 36 q10 30 -30 40 q-20 20 -60 4 q-46 4 -40 -40 z" fill="#f0d9a8"/>
  <path d="M150 170 q30 0 70 30 q-10 20 -40 20 q-30 0 -30 -50 z" fill="#b07850" opacity=".55"/>
  <use href="#spots" transform="translate(185 195)"/>
  <ellipse cx="120" cy="150" rx="20" ry="13" fill="#f8e8c4" stroke="#e0a33a" stroke-width="2"/>
  <circle cx="120" cy="150" r="30" fill="none" stroke="#1f6f78" stroke-width="4" stroke-dasharray="7 6"/>
  <circle cx="268" cy="130" r="20" fill="#3f9a5a"/><path d="M258 130 l7 7 l13 -14" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- stove and tawa -->
  <rect x="250" y="500" width="150" height="60" rx="6" fill="#3d3a3a"/>
  <circle cx="290" cy="530" r="8" fill="#9a9590"/><circle cx="360" cy="530" r="8" fill="#9a9590"/>
  <ellipse cx="325" cy="496" rx="62" ry="10" fill="#2b2b2b"/>
  <path d="M310 484 q6 -14 0 -26 M336 482 q6 -14 0 -26" stroke="#e3dccd" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- grandmother seated on stool -->
  <g transform="translate(160 560)">
    <ellipse cx="10" cy="2" rx="60" ry="7" fill="#000" opacity=".08"/>
    <rect x="-40" y="-56" width="80" height="56" rx="6" fill="#8a6d5a"/>
    <rect x="-14" y="-82" width="80" height="28" rx="14" fill="#e6d3ae"/>
    <rect x="44" y="-80" width="26" height="80" rx="12" fill="#e6d3ae"/>
    <path d="M44 -6 h34 v6 h-34 z" fill="#7a4e7e"/>
    <path d="M-28 -70 v-70 a28 28 0 0 1 56 0 v70 z" fill="#e6d3ae"/>
    <path d="M-28 -150 L28 -76" stroke="#7a4e7e" stroke-width="9"/>
    <rect x="-7" y="-176" width="14" height="10" fill="#b07850"/>
    <circle cx="0" cy="-192" r="21" fill="#b07850"/>
    <path d="M-21 -196 a21 21 0 0 1 42 0 q-21 -8 -42 0 z" fill="#b9ad98"/>
    <circle cx="-22" cy="-196" r="10" fill="#b9ad98"/>
    <g fill="none" stroke="#3d3a3a" stroke-width="2.5"><circle cx="2" cy="-192" r="6"/><circle cx="16" cy="-192" r="6"/><path d="M8 -192 h2"/></g>
    <path d="M4 -178 q7 5 13 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M18 -136 l40 -34" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M18 -120 l56 0" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 -132 q-4 -16 14 -16 q18 -6 20 10 q8 14 -10 18 q-10 6 -24 -12 z" fill="#f0d9a8"/>
    <path d="M58 -172 l10 -14" stroke="#b07850" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- child kneeling at board -->
  <ellipse cx="450" cy="552" rx="46" ry="10" fill="#8a6d5a"/>
  <ellipse cx="450" cy="546" rx="26" ry="6" fill="#f0d9a8"/>
  <rect x="418" y="538" width="64" height="6" rx="3" fill="#6b5446"/>
  <g transform="translate(520 560)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-20" width="44" height="20" rx="9" fill="#d9a27a"/>
    <path d="M-20 -14 v-50 a20 20 0 0 1 40 0 v50 z" fill="#e0a33a"/>
    <path d="M-24 -14 h48 l-6 -22 h-36 z" fill="#e0a33a"/>
    <rect x="-5" y="-88" width="10" height="8" fill="#d9a27a"/>
    <circle cx="0" cy="-102" r="17" fill="#d9a27a"/>
    <path d="M-17 -104 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#2e2a2a"/>
    <path d="M-17 -104 q-14 6 -10 18 M17 -104 q14 6 10 18" stroke="#2e2a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-7" cy="-102" r="2.2" fill="#2e2a2a"/><circle cx="5" cy="-102" r="2.2" fill="#2e2a2a"/>
    <path d="M-8 -94 q4 5 10 0" stroke="#2e2a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <circle cx="9" cy="-96" r="3" fill="#fff" opacity=".7"/>
    <path d="M-16 -56 l-32 18" stroke="#d9a27a" stroke-width="8" stroke-linecap="round"/>
    <path d="M14 -56 l20 22" stroke="#d9a27a" stroke-width="8" stroke-linecap="round"/>
    <circle cx="36" cy="-32" r="9" fill="#f0d9a8"/>
  </g>
  <!-- dough plate -->
  <ellipse cx="600" cy="552" rx="34" ry="8" fill="#b8bec2"/>
  <g fill="#f0d9a8"><circle cx="588" cy="544" r="9"/><circle cx="606" cy="542" r="9"/><circle cx="598" cy="534" r="8"/></g>

  <!-- row of rotis on a long steel plate -->
  <rect x="650" y="440" width="290" height="16" rx="8" fill="#b8bec2"/>
  <path d="M654 456 h282 v104 h-282 z" fill="#cbbfa9"/>
  <path d="M664 436 q-6 -24 16 -26 q16 -12 30 2 q20 2 12 20 q-6 10 -24 8 q-20 6 -34 -4 z" fill="#f0d9a8"/>
  <path d="M694 412 q20 2 28 20 q-10 8 -24 6 z" fill="#8a5a3a" opacity=".6"/>
  <ellipse cx="755" cy="428" rx="25" ry="12" fill="#f0d9a8" transform="rotate(-10 755 428)"/>
  <use href="#spots" transform="translate(760 428) scale(.6)"/>
  <ellipse cx="820" cy="428" rx="25" ry="13" fill="#f0d9a8"/>
  <circle cx="824" cy="426" r="3" fill="#b07850"/>
  <ellipse cx="890" cy="428" rx="27" ry="14" fill="#f3dca8" stroke="#e0a33a" stroke-width="2"/>
  <circle cx="884" cy="424" r="2.5" fill="#b07850"/><circle cx="898" cy="432" r="2.5" fill="#b07850"/>
  <path d="M672 486 H900" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>

  <text x="690" y="530" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">FIRST</text>
  <text x="884" y="530" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">TENTH</text>
</svg>
