<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At school a teacher dismisses a girl's thin voice; at home her mother hears that the high note did not crack</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="girl">
      <ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/>
      <rect x="-12" y="-50" width="10" height="50" rx="5" fill="#d9a27a"/><rect x="2" y="-50" width="10" height="50" rx="5" fill="#d9a27a"/>
      <path d="M-20 -110 h40 v20 l6 46 h-52 l6 -46 z" fill="#ffffff"/>
      <path d="M-14 -108 h28 v18 l8 48 h-44 l8 -48 z" fill="#3f8a5a"/>
      <rect x="-5" y="-122" width="10" height="12" fill="#d9a27a"/>
      <circle cx="0" cy="-136" r="17" fill="#d9a27a"/>
      <path d="M-17 -138 a17 17 0 0 1 34 0 q-17 -7 -34 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <rect x="480" y="0" width="480" height="560" fill="#efe4d2"/>
  <path d="M480 0 V640" stroke="#d8cdb8" stroke-width="4"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TOO THIN</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO CRACK TODAY</text>

  <!-- LEFT: classroom -->
  <rect x="40" y="100" width="230" height="130" rx="4" fill="#2f5a4a"/><rect x="40" y="226" width="230" height="8" fill="#8a6d5a"/>
  <path d="M64 140 h90 M64 170 h140" stroke="#e3dccd" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  <rect x="330" y="110" width="110" height="100" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="365" cy="150" r="14" fill="#e0a33a"/><path d="M345 196 l25 -26 l20 18 l14 -12 l22 20 z" fill="#1f6f78"/>
  <!-- harmonium -->
  <rect x="30" y="470" width="90" height="12" rx="3" fill="#6b5446"/><path d="M38 482 v78 M112 482 v78" stroke="#6b5446" stroke-width="6"/>
  <rect x="36" y="430" width="78" height="40" rx="4" fill="#8a6d5a"/><rect x="42" y="436" width="66" height="10" fill="#fff"/>
  <g stroke="#3d3a3a" stroke-width="2"><path d="M50 436 v10 M60 436 v10 M70 436 v10 M80 436 v10 M90 436 v10 M100 436 v10"/></g>
  <!-- teacher -->
  <g transform="translate(180 560) scale(1.12)"><use href="#m" color="#9a6b48"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#9a6b48"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#3d3a3a"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2.2"><circle cx="-7" cy="-148" r="5.5"/><circle cx="7" cy="-148" r="5.5"/></g>
    <path d="M-6 -134 q6 -3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -104 l60 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -104 l-8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- girl hunched -->
  <g transform="translate(320 560)"><use href="#girl"/>
    <path d="M14 -138 q14 20 6 48" stroke="#2e2a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-8 -130 h5 M4 -130 h5" stroke="#2e2a2a" stroke-width="2.2"/>
    <path d="M-5 -122 q5 -3 10 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-18 -104 l6 36 M18 -104 l-6 36" stroke="#d9a27a" stroke-width="8" stroke-linecap="round"/>
  </g>
  <circle cx="356" cy="390" r="18" fill="#e07a5f"/><path d="M348 382 l16 16 M364 382 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- classmates on bench -->
  <rect x="380" y="500" width="90" height="10" rx="3" fill="#8a6d5a"/><path d="M388 510 v50 M462 510 v50" stroke="#8a6d5a" stroke-width="6"/>
  <g><path d="M384 500 a12 26 0 0 1 24 0 z" fill="#fff"/><circle cx="396" cy="462" r="11" fill="#c98a5e"/><path d="M385 460 a11 11 0 0 1 22 0 z" fill="#2e2a2a"/>
     <path d="M414 500 a12 26 0 0 1 24 0 z" fill="#fff"/><circle cx="426" cy="462" r="11" fill="#b07850"/><path d="M415 460 a11 11 0 0 1 22 0 z" fill="#2e2a2a"/>
     <path d="M444 500 a12 26 0 0 1 24 0 z" fill="#fff"/><circle cx="456" cy="462" r="11" fill="#d9a27a"/><path d="M445 460 a11 11 0 0 1 22 0 z" fill="#2e2a2a"/></g>
  <g fill="#2e2a2a"><circle cx="390" cy="463" r="1.8"/><circle cx="420" cy="463" r="1.8"/><circle cx="450" cy="463" r="1.8"/></g>

  <!-- RIGHT: home in the evening -->
  <path d="M508 0 V140" stroke="#3d3a3a" stroke-width="2"/><circle cx="508" cy="150" r="12" fill="#e0a33a"/>
  <circle cx="508" cy="150" r="40" fill="#e0a33a" opacity=".15"/>
  <!-- price tag crossed out, flyer -->
  <path d="M770 170 h52 l14 18 l-14 18 h-52 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="782" cy="188" r="4" fill="#cbbfa9"/>
  <path d="M794 182 h28 M794 194 h20" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <path d="M764 204 L842 172" stroke="#e07a5f" stroke-width="5" stroke-linecap="round"/>
  <rect x="862" y="150" width="70" height="90" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M888 214 v-40 l20 -6 v34" stroke="#7a4e7e" stroke-width="5" fill="none"/><circle cx="883" cy="214" r="7" fill="#7a4e7e"/><circle cx="903" cy="204" r="7" fill="#7a4e7e"/>
  <!-- brass lamp on shelf -->
  <path d="M520 300 h80" stroke="#8a6d5a" stroke-width="6"/><path d="M548 298 q12 -12 24 0 z" fill="#e0a33a"/><path d="M560 286 q-4 -8 0 -14 q4 6 0 14 z" fill="#e07a5f"/>
  <!-- girl singing -->
  <g transform="translate(600 560)"><use href="#girl"/>
    <path d="M14 -140 q14 20 6 48" stroke="#2e2a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <circle cx="-5" cy="-140" r="2" fill="#2e2a2a"/><circle cx="7" cy="-140" r="2" fill="#2e2a2a"/>
    <ellipse cx="2" cy="-128" rx="4" ry="5" fill="#7a3a3a"/>
    <path d="M-18 -104 l14 22 l6 -4 M18 -104 l-14 22 l-6 -4" stroke="#d9a27a" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M624 432 C670 400 690 330 760 300" stroke="#1f6f78" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <g fill="#1f6f78"><circle cx="664" cy="398" r="7"/><path d="M669 398 v-24 l10 -3" stroke="#1f6f78" stroke-width="3" fill="none"/>
    <circle cx="712" cy="332" r="7"/><path d="M717 332 v-24 l10 -3" stroke="#1f6f78" stroke-width="3" fill="none"/></g>
  <!-- mat, mother folding laundry -->
  <rect x="700" y="548" width="230" height="12" rx="3" fill="#c9a86a"/>
  <g transform="translate(820 548)">
    <ellipse cx="0" cy="-8" rx="52" ry="16" fill="#4f7fb0"/>
    <path d="M-28 -16 v-58 a28 28 0 0 1 56 0 v58 z" fill="#4f7fb0"/>
    <path d="M-24 -86 L24 -20" stroke="#3a6390" stroke-width="8"/>
    <rect x="-6" y="-112" width="12" height="10" fill="#b07850"/>
    <circle cx="0" cy="-126" r="19" fill="#b07850"/>
    <path d="M-19 -128 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="18" cy="-132" r="8" fill="#2e2a2a"/>
    <path d="M-12 -126 q3 3 6 0 M0 -126 q3 3 6 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
    <path d="M-8 -116 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M-24 -66 l-22 -36" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
    <path d="M-48 -104 l-6 -10 M-46 -104 l-2 -12 M-44 -104 l4 -10" stroke="#b07850" stroke-width="4" stroke-linecap="round"/>
    <path d="M24 -60 l24 26" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  </g>
  <g><rect x="864" y="520" width="56" height="12" rx="4" fill="#e07a5f"/><rect x="868" y="508" width="48" height="12" rx="4" fill="#e0a33a"/><rect x="872" y="496" width="40" height="12" rx="4" fill="#fff" stroke="#cbbfa9"/></g>
</svg>
