<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A mother finds the one neat line in her son's messy homework and praises it; the next day he shows her two neat lines</title>
  <defs>
    <path id="mess" d="M0 0 q7 -9 14 -3 q8 12 16 2 q5 -9 10 -3 q8 -12 16 3 q5 -6 10 -1 q7 9 14 0 q5 -9 10 0 q5 -9 10 0 q6 -6 12 -1 q7 -6 14 0 q7 -12 14 2 q6 9 12 -1 q8 -9 16 0 q7 -12 14 -3 q7 -6 14 3 q8 -9 16 2 q7 9 14 2 q6 6 12 -1 q7 -6 14 -3 q5 -12 10 2 q7 12 14 3 q8 9 16 0" stroke="#7d7a80" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path id="neat" d="M0 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 m10 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 m10 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0 m10 0 q6 -14 12 0 q6 -14 12 0 q6 -14 12 0" stroke="#1f3f8a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <g id="star"><path d="M0 -14 l4 9 l10 1 l-8 7 l3 10 l-9 -5 l-9 5 l3 -10 l-8 -7 l10 -1 z" fill="#e0a33a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- big notebook inset -->
  <text x="300" y="62" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE NEAT LINE</text>
  <rect x="60" y="84" width="480" height="230" rx="22" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M310 312 l10 50 l26 -50" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M312 311 h32" stroke="#fff" stroke-width="5"/>
  <g stroke="#cfe0ef" stroke-width="2"><path d="M86 130 h430 M86 166 h430 M86 202 h430 M86 238 h430 M86 274 h430"/></g>
  <path d="M110 104 v196" stroke="#f0b8b0" stroke-width="2"/>
  <use href="#mess" transform="translate(124 124) rotate(-2)"/>
  <use href="#mess" transform="translate(124 162) rotate(1.5)"/>
  <rect x="116" y="182" width="320" height="26" rx="10" fill="#e0a33a" opacity=".3"/>
  <use href="#neat" transform="translate(124 200)"/>
  <use href="#star" transform="translate(470 196)"/>
  <use href="#mess" transform="translate(124 234) rotate(-1)"/>
  <use href="#mess" transform="translate(124 272) rotate(2)"/>

  <!-- next day inset -->
  <text x="790" y="104" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEXT DAY</text>
  <rect x="640" y="122" width="300" height="230" rx="12" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="640" y="122" width="300" height="26" rx="12" fill="#e07a5f"/><rect x="640" y="136" width="300" height="12" fill="#e07a5f"/>
  <circle cx="680" cy="122" r="5" fill="#3d3a3a"/><circle cx="900" cy="122" r="5" fill="#3d3a3a"/>
  <!-- boy holding notebook up -->
  <g transform="translate(700 340)">
    <path d="M-24 0 v-50 a24 24 0 0 1 48 0 v50 z" fill="#fff" stroke="#e3dccd" stroke-width="2"/>
    <rect x="-5" y="-82" width="10" height="8" fill="#c98a5e"/>
    <circle cx="0" cy="-96" r="17" fill="#c98a5e"/><path d="M-17 -98 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-96" r="2" fill="#2e2a2a"/><circle cx="6" cy="-96" r="2" fill="#2e2a2a"/><path d="M-7 -88 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M20 -50 l40 -40" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <rect x="740" y="166" width="180" height="120" rx="4" fill="#fdfaf3" stroke="#b9ad98" stroke-width="2"/>
  <rect x="750" y="188" width="160" height="22" rx="8" fill="#e0a33a" opacity=".3"/><rect x="750" y="224" width="160" height="22" rx="8" fill="#e0a33a" opacity=".3"/>
  <use href="#neat" transform="translate(756 204) scale(.5)"/><use href="#neat" transform="translate(756 240) scale(.5)"/>
  <use href="#star" transform="translate(892 270) scale(.8)"/>

  <!-- old shouting routine left behind -->
  <path d="M600 420 q-24 0 -18 -18 q-2 -20 20 -16 q8 -14 28 -4 q22 -4 20 16 q14 12 -4 22 z" fill="#cbbfa9" opacity=".8"/>
  <path d="M606 394 l20 20 M626 394 l-20 20" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>

  <!-- table -->
  <rect x="120" y="440" width="440" height="14" rx="3" fill="#8a6d5a"/><path d="M140 454 v106 M540 454 v106" stroke="#6b5446" stroke-width="10"/>
  <!-- open notebook on table -->
  <path d="M300 438 l50 -8 l50 8 z" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="430" y="424" width="26" height="16" rx="3" fill="#e07a5f"/>
  <path d="M480 440 v-30 h26 v30 z" fill="#b8bec2"/><ellipse cx="493" cy="410" rx="13" ry="4" fill="#fff"/>
  <!-- mother -->
  <rect x="180" y="470" width="80" height="10" fill="#6b5446"/><path d="M186 480 v80 M254 480 v80" stroke="#6b5446" stroke-width="6"/>
  <g transform="translate(240 470)">
    <path d="M-34 0 v-74 a30 30 0 0 1 60 0 v74 z" fill="#e0a33a"/>
    <path d="M-30 -96 L26 -10" stroke="#c4862a" stroke-width="8"/>
    <rect x="-6" y="-112" width="14" height="12" fill="#b07850"/>
    <circle cx="6" cy="-128" r="20" fill="#b07850" transform="rotate(14 6 -128)"/>
    <path d="M-14 -130 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-124" r="9" fill="#2e2a2a"/>
    <g fill="#fff"><circle cx="-22" cy="-130" r="3"/><circle cx="-24" cy="-122" r="3"/><circle cx="-20" cy="-114" r="3"/></g>
    <g fill="none" stroke="#3d3a3a" stroke-width="2"><circle cx="4" cy="-144" r="5"/><circle cx="18" cy="-144" r="5"/></g>
    <path d="M10 -128 q3 3 6 0 M20 -128 q3 3 6 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
    <path d="M12 -116 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M22 -70 l70 -36" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- son -->
  <rect x="400" y="490" width="70" height="10" fill="#6b5446"/><path d="M406 500 v60 M464 500 v60" stroke="#6b5446" stroke-width="6"/>
  <g transform="translate(430 490)">
    <path d="M-22 0 v-56 a22 22 0 0 1 44 0 v56 z" fill="#fff" stroke="#e3dccd" stroke-width="2"/>
    <path d="M-2 -76 l4 0 l3 30 l-5 6 l-5 -6 z" fill="#1f6f78"/>
    <rect x="-5" y="-88" width="10" height="10" fill="#c98a5e"/>
    <circle cx="0" cy="-102" r="17" fill="#c98a5e"/><path d="M-17 -104 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-102" r="2.2" fill="#2e2a2a"/><circle cx="4" cy="-102" r="2.2" fill="#2e2a2a"/>
    <path d="M-8 -93 q5 3 10 0" stroke="#2e2a2a" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M-20 -50 l-50 -2" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
    <path d="M-72 -52 l-8 -14" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
