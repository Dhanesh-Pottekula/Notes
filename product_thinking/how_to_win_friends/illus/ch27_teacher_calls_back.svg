<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A tired young man folding saris at night gets a call back from his old maths teacher; later he teaches a Class 8 tuition batch</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="kid"><path d="M-16 0 a16 34 0 0 1 32 0 z" fill="#fff"/><circle cx="0" cy="-42" r="13" fill="#c98a5e"/><path d="M-13 -42 a13 13 0 0 1 26 0 z" fill="#2e2a2a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 0 V640" stroke="#d8cdb8" stroke-width="4"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">12 HOURS</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">CLASS 8 BATCH</text>

  <!-- LEFT: sari shop shelves -->
  <rect x="30" y="96" width="420" height="300" fill="#8a6d5a"/>
  <path d="M30 196 h420 M30 296 h420" stroke="#6b5446" stroke-width="8"/>
  <g>
    <rect x="44" y="160" width="70" height="30" fill="#e07a5f"/><rect x="44" y="130" width="70" height="28" fill="#e0a33a"/><rect x="128" y="150" width="70" height="40" fill="#1f6f78"/><rect x="212" y="134" width="70" height="56" fill="#7a4e7e"/><rect x="296" y="156" width="70" height="34" fill="#e0a33a"/><rect x="376" y="140" width="64" height="50" fill="#e07a5f"/>
    <rect x="44" y="250" width="70" height="40" fill="#1f6f78"/><rect x="128" y="236" width="70" height="54" fill="#e07a5f"/><rect x="212" y="256" width="70" height="34" fill="#e0a33a"/><rect x="296" y="240" width="70" height="50" fill="#1f6f78"/><rect x="376" y="254" width="64" height="36" fill="#7a4e7e"/>
    <rect x="44" y="340" width="70" height="50" fill="#e0a33a"/><rect x="128" y="352" width="70" height="38" fill="#7a4e7e"/><rect x="212" y="336" width="70" height="54" fill="#1f6f78"/><rect x="296" y="350" width="70" height="40" fill="#e07a5f"/><rect x="376" y="344" width="64" height="46" fill="#e0a33a"/>
  </g>
  <g stroke="#fff" stroke-width="2" opacity=".35"><path d="M44 172 h70 M128 168 h70 M212 160 h70 M296 172 h70 M376 162 h64 M44 270 h70 M128 260 h70 M212 272 h70 M296 264 h70 M376 270 h64"/></g>
  <!-- wall clock -->
  <circle cx="400" cy="440" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M400 440 v-16 M400 440 l-10 -6" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  <!-- white floor mattress -->
  <rect x="40" y="530" width="400" height="30" rx="8" fill="#fff" stroke="#e3dccd" stroke-width="2"/>
  <!-- sari piles -->
  <rect x="60" y="506" width="70" height="12" rx="3" fill="#e07a5f"/><rect x="62" y="494" width="66" height="12" rx="3" fill="#1f6f78"/><rect x="64" y="518" width="62" height="12" rx="3" fill="#e0a33a"/>
  <rect x="330" y="508" width="70" height="22" rx="3" fill="#7a4e7e"/><rect x="334" y="496" width="62" height="12" rx="3" fill="#e0a33a"/>
  <!-- young man slumped, cross-legged -->
  <g transform="translate(230 530)">
    <ellipse cx="0" cy="-6" rx="56" ry="14" fill="#4a3f55"/>
    <path d="M-26 -12 v-50 q0 -26 28 -28 q28 2 28 28 v50 z" fill="#fff" stroke="#e3dccd" stroke-width="2"/>
    <rect x="-6" y="-106" width="12" height="12" fill="#c98a5e"/>
    <circle cx="4" cy="-118" r="19" fill="#c98a5e"/>
    <path d="M-15 -122 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/>
    <path d="M-4 -116 h6 M8 -116 h6" stroke="#2e2a2a" stroke-width="2.4"/>
    <path d="M0 -104 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M22 -70 l30 -16 l0 -20" stroke="#c98a5e" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="44" y="-140" width="22" height="38" rx="4" fill="#3d3a3a"/><rect x="47" y="-136" width="16" height="28" fill="#cfe3e6"/>
    <path d="M-22 -66 l-20 30" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- sad message bubble -->
  <rect x="130" y="290" width="150" height="70" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M246 358 l24 20 l-4 -20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M248 357 h16" stroke="#fff" stroke-width="5"/>
  <circle cx="166" cy="325" r="20" fill="#e0a33a"/><circle cx="159" cy="320" r="2.5" fill="#2b2b2b"/><circle cx="173" cy="320" r="2.5" fill="#2b2b2b"/>
  <path d="M157 334 q9 -8 18 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/>
  <path d="M198 316 h66 M198 334 h46" stroke="#b9ad98" stroke-width="5" stroke-linecap="round"/>

  <!-- call arc to teacher inset -->
  <path d="M300 380 C380 120 470 120 560 140" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <circle cx="620" cy="150" r="58" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M590 206 a30 40 0 0 1 60 0 z" fill="#8e3b46"/>
  <circle cx="620" cy="140" r="20" fill="#b07850"/>
  <path d="M600 140 q0 -26 20 -26 q20 0 20 26 q-6 -14 -20 -14 q-14 0 -20 14 z" fill="#2e2a2a"/><path d="M626 116 q10 2 12 14" stroke="#cbbfa9" stroke-width="4" fill="none"/>
  <g fill="none" stroke="#2b2b2b" stroke-width="2"><circle cx="613" cy="142" r="5"/><circle cx="627" cy="142" r="5"/></g>
  <path d="M614 152 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
  <rect x="638" y="128" width="12" height="24" rx="3" fill="#3d3a3a"/>
  <path d="M660 120 q8 8 0 16 M668 114 q14 14 0 28" stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- RIGHT: tuition room -->
  <rect x="520" y="240" width="250" height="150" rx="4" fill="#2f5a4a"/><rect x="520" y="386" width="250" height="8" fill="#8a6d5a"/>
  <path d="M550 360 L630 270 L680 360 z" stroke="#e3dccd" stroke-width="3" fill="none"/>
  <path d="M630 270 V360" stroke="#e3dccd" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M700 280 h50 M700 304 h40 M700 328 h52 M700 352 h30" stroke="#e3dccd" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <!-- teaching young man -->
  <g transform="translate(830 560) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-7" cy="-148" r="2.2" fill="#2e2a2a"/><circle cx="5" cy="-148" r="2.2" fill="#2e2a2a"/>
    <path d="M-7 -138 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M-22 -104 l-40 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-70" y="-156" width="10" height="5" fill="#fff" transform="rotate(-45 -65 -153)"/>
    <path d="M22 -104 l6 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- desk with mortarboard and book -->
  <rect x="880" y="470" width="66" height="8" fill="#8a6d5a"/><path d="M886 478 v82 M940 478 v82" stroke="#8a6d5a" stroke-width="5"/>
  <rect x="888" y="452" width="50" height="18" rx="2" fill="#1f6f78"/>
  <path d="M893 440 l20 -10 l22 10 l-22 10 z" fill="#2b2b2b"/><path d="M913 440 v8" stroke="#2b2b2b" stroke-width="6"/>
  <!-- students on benches -->
  <rect x="510" y="520" width="270" height="10" rx="3" fill="#8a6d5a"/><path d="M520 530 v30 M770 530 v30" stroke="#8a6d5a" stroke-width="6"/>
  <use href="#kid" transform="translate(546 520)"/><use href="#kid" transform="translate(612 520)"/><use href="#kid" transform="translate(678 520)"/><use href="#kid" transform="translate(744 520)"/>
  <path d="M624 488 l10 -40 M690 488 l-6 -42" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>
</svg>
