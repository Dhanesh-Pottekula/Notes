<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two colony gardens: a grumbling man pulls weeds among thin plants, a woman waters thick plants that shade the weeds out</title>
  <defs>
    <g id="weed" fill="#6f9a3a"><path d="M0 0 l-10 -30 l8 12 l2 -26 l4 26 l8 -14 l-6 32 z"/></g>
    <g id="tiny" fill="#9ab36a"><path d="M0 0 l-4 -12 l4 5 l3 -10 l1 17 z"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="0" width="960" height="300" fill="#fbeedb"/>
  <circle cx="480" cy="300" r="70" fill="#e0a33a" opacity=".35"/>
  <rect y="300" width="960" height="340" fill="#d8cdb8"/>
  <!-- colony houses back -->
  <rect x="40" y="190" width="180" height="110" fill="#cbbfa9"/><rect x="740" y="180" width="190" height="120" fill="#cbbfa9"/>
  <g fill="#b9ad98"><rect x="70" y="220" width="36" height="36"/><rect x="150" y="220" width="36" height="36"/><rect x="770" y="214" width="36" height="36"/><rect x="860" y="214" width="36" height="36"/></g>
  <!-- divider wall -->
  <rect x="472" y="300" width="16" height="280" fill="#b9876a"/>
  <path d="M472 340 h16 M472 380 h16 M472 420 h16 M472 460 h16 M472 500 h16 M472 540 h16" stroke="#9a6b50" stroke-width="2"/>
  <path d="M480 0 V300" stroke="#d8cdb8" stroke-width="4"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">PULL WEEDS</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">FEED PLANTS</text>

  <!-- LEFT bed -->
  <rect x="30" y="420" width="430" height="160" rx="10" fill="#9a7a5a"/>
  <use href="#weed" transform="translate(60 470)"/><use href="#weed" transform="translate(110 520)"/><use href="#weed" transform="translate(150 450)"/><use href="#weed" transform="translate(320 460)"/>
  <use href="#weed" transform="translate(360 520)"/><use href="#weed" transform="translate(410 470)"/><use href="#weed" transform="translate(90 570) scale(.8)"/><use href="#weed" transform="translate(300 560) scale(.8)"/><use href="#weed" transform="translate(430 560) scale(.8)"/>
  <!-- thin droopy plants -->
  <path d="M250 460 v-60 q0 -10 -16 0 M250 430 q12 -12 22 6" stroke="#a8b07a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M390 430 v-50 q0 -8 -14 2" stroke="#a8b07a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- dry watering can on its side -->
  <g transform="translate(400 556) rotate(80)"><rect x="-22" y="-30" width="44" height="36" rx="6" fill="#9a9590"/><path d="M22 -20 l30 -18" stroke="#9a9590" stroke-width="7" stroke-linecap="round"/></g>
  <!-- weed pile -->
  <g fill="#7d8a4a"><path d="M40 588 q20 -24 46 -4 q14 -20 30 4 z"/></g>
  <!-- squatting man -->
  <g transform="translate(200 560)">
    <ellipse cx="0" cy="2" rx="44" ry="6" fill="#000" opacity=".08"/>
    <path d="M-34 0 q-4 -40 14 -54 h46 q18 14 14 54 z" fill="#3a6f8a"/>
    <path d="M-28 -12 h66 M-30 -28 h68 M-22 -44 h50 M-10 -54 v54 M12 -54 v54" stroke="#e3dccd" stroke-width="2" opacity=".6"/>
    <path d="M-22 -54 q-6 -54 22 -56 q30 2 26 56 z" fill="#ffffff"/>
    <rect x="-4" y="-122" width="12" height="10" fill="#c98a5e"/>
    <circle cx="4" cy="-136" r="19" fill="#c98a5e"/>
    <path d="M-15 -140 q0 -10 6 -14 M23 -140 q0 -10 -6 -14" stroke="#2e2a2a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-8 -140 l6 3 M10 -137 l6 -3" stroke="#2e2a2a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-2 -126 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M-18 -92 l-40 50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-68 -38 l-6 -16 M-62 -40 l2 -18 M-58 -42 l10 -14" stroke="#6f9a3a" stroke-width="4" stroke-linecap="round"/>
    <path d="M22 -92 l24 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- grumble cloud -->
  <path d="M220 330 q-30 0 -24 -22 q-4 -24 24 -20 q10 -18 34 -6 q26 -6 26 18 q20 14 -4 30 z" fill="#b9ad98"/>
  <path d="M206 312 q8 -10 16 0 t16 0 t16 0 t16 0" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <path d="M216 350 a5 5 0 1 0 1 0 M206 370 a3 3 0 1 0 1 0" fill="#b9ad98"/>

  <!-- RIGHT bed -->
  <rect x="500" y="420" width="430" height="160" rx="10" fill="#8a6a4a"/>
  <ellipse cx="770" cy="470" rx="160" ry="34" fill="#5e4632" opacity=".7"/>
  <use href="#tiny" transform="translate(620 556)"/><use href="#tiny" transform="translate(900 552)"/>
  <!-- curry leaf shrub -->
  <rect x="660" y="370" width="8" height="90" fill="#6b5446"/>
  <g fill="#2f7a4a"><ellipse cx="640" cy="360" rx="34" ry="44"/><ellipse cx="690" cy="340" rx="34" ry="52"/><ellipse cx="664" cy="410" rx="44" ry="34"/></g>
  <g fill="#3f9a5a"><ellipse cx="650" cy="350" rx="8" ry="4" transform="rotate(-30 650 350)"/><ellipse cx="690" cy="320" rx="8" ry="4" transform="rotate(30 690 320)"/><ellipse cx="670" cy="400" rx="8" ry="4"/></g>
  <!-- tulsi in square clay planter -->
  <rect x="740" y="400" width="70" height="70" fill="#c9795a"/><rect x="734" y="394" width="82" height="12" fill="#b0654a"/>
  <path d="M760 420 h30 v30 h-30 z" fill="#b0654a"/>
  <g fill="#3f8a4a"><ellipse cx="775" cy="350" rx="40" ry="48"/><ellipse cx="755" cy="370" rx="26" ry="30"/><ellipse cx="800" cy="372" rx="26" ry="30"/></g>
  <g fill="#7a4e7e"><circle cx="770" cy="310" r="4"/><circle cx="784" cy="316" r="4"/><circle cx="760" cy="330" r="3.5"/></g>
  <!-- rose bush -->
  <g fill="#3a7a48"><ellipse cx="870" cy="380" rx="56" ry="64"/><ellipse cx="900" cy="430" rx="40" ry="34"/></g>
  <g fill="#e07a5f"><circle cx="850" cy="350" r="11"/><circle cx="888" cy="340" r="11"/><circle cx="870" cy="390" r="11"/><circle cx="906" cy="410" r="10"/><circle cx="840" cy="410" r="10"/></g>
  <!-- woman watering -->
  <g transform="translate(560 560)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-24 0 l6 -100 h36 l6 100 z" fill="#1f6f78"/>
    <path d="M-18 -100 a20 20 0 0 1 40 0 v30 h-40 z" fill="#1f6f78"/>
    <path d="M-18 -112 L22 -40" stroke="#e0a33a" stroke-width="7"/>
    <rect x="-5" y="-136" width="12" height="12" fill="#b07850"/>
    <circle cx="2" cy="-150" r="19" fill="#b07850"/>
    <path d="M-17 -152 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-156" r="8" fill="#2e2a2a"/>
    <circle cx="6" cy="-160" r="2" fill="#e07a5f"/>
    <circle cx="0" cy="-150" r="2.2" fill="#2e2a2a"/><circle cx="12" cy="-150" r="2.2" fill="#2e2a2a"/>
    <path d="M0 -140 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M18 -96 l34 10" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
    <rect x="46" y="-104" width="44" height="34" rx="6" fill="#3f9a5a"/><path d="M90 -96 l26 -16" stroke="#3f9a5a" stroke-width="7" stroke-linecap="round"/>
    <path d="M56 -104 q12 -18 26 0" stroke="#3f9a5a" stroke-width="5" fill="none"/>
  </g>
  <g stroke="#5b9bd5" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="6 6">
    <path d="M680 450 q20 -10 36 30"/><path d="M682 452 q34 -14 56 20"/><path d="M682 454 q8 -4 16 34"/>
  </g>
  <!-- compost sack -->
  <path d="M520 560 l6 -46 q20 -10 40 0 l6 46 z" fill="#b9ad98"/><path d="M528 514 q18 8 36 0" stroke="#8a6d5a" stroke-width="3" fill="none"/>
</svg>
