<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>In a busy Udupi restaurant the owner shows a new waiter a warm customer note in the feedback book while the head waiter frowns</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="tum"><path d="M-7 0 l-2 -20 h18 l-2 20 z" fill="#b8bec2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- back wall: kitchen hatch and cash counter -->
  <rect x="30" y="300" width="160" height="90" rx="4" fill="#6b5446"/><rect x="40" y="310" width="140" height="70" fill="#fbeedb"/>
  <path d="M60 350 q6 -14 0 -26 M100 350 q6 -14 0 -26" stroke="#cbbfa9" stroke-width="4" fill="none" stroke-linecap="round"/>
  <rect x="650" y="400" width="96" height="160" rx="4" fill="#8a6d5a"/><rect x="650" y="400" width="96" height="12" fill="#6b5446"/>
  <path d="M684 398 q14 -12 28 0 z" fill="#e0a33a"/><path d="M698 386 q-4 -8 0 -14 q4 6 0 14 z" fill="#e07a5f"/>

  <!-- feedback inset (left top) -->
  <text x="200" y="86" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">FEEDBACK</text>
  <rect x="40" y="104" width="320" height="170" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M330 220 l90 70 l-60 -86" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M332 214 l26 -8" stroke="#fff" stroke-width="6"/>
  <path d="M64 126 h126 v130 h-126 z M200 126 h126 v130 h-126 z" fill="#fdfaf3" stroke="#d8cdb8" stroke-width="2"/>
  <g stroke="#b9ad98" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M74 146 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0"/><path d="M74 170 q10 -6 20 0 t20 0 t20 0 t20 0"/><path d="M74 194 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0"/><path d="M74 218 q10 -6 20 0 t20 0 t20 0"/>
  </g>
  <g stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M210 146 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0"/><path d="M210 166 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0"/><path d="M210 186 q10 -6 20 0 t20 0 t20 0 t20 0 t20 0"/><path d="M210 206 q10 -6 20 0 t20 0 t20 0 t20 0"/>
  </g>
  <path d="M236 236 c-6 -8 -16 -2 -8 8 l8 8 l8 -8 c8 -10 -2 -16 -8 -8 z" fill="#e07a5f"/>
  <circle cx="286" cy="238" r="12" fill="#e0a33a"/><circle cx="282" cy="235" r="1.8" fill="#2b2b2b"/><circle cx="290" cy="235" r="1.8" fill="#2b2b2b"/><path d="M280 241 q6 5 12 0" stroke="#2b2b2b" stroke-width="2" fill="none"/>

  <text x="560" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">REAL PRAISE</text>

  <!-- head waiter, arms crossed -->
  <g transform="translate(110 560) scale(1.05)"><use href="#m" color="#7a4e7e"/>
    <path d="M-30 -60 v-40 a30 30 0 0 1 60 0 v40 z" fill="#7a4e7e"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/>
    <path d="M-10 -152 l7 3 M10 -152 l-7 3" stroke="#2e2a2a" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M-6 -134 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M-26 -92 h52" stroke="#c98a5e" stroke-width="12" stroke-linecap="round"/><path d="M-20 -84 h40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <circle cx="152" cy="378" r="16" fill="#e0a33a"/><text x="152" y="386" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">?</text>

  <!-- owner showing book -->
  <g transform="translate(430 560) scale(1.12)"><use href="#m" color="#ffffff"/>
    <rect x="-16" y="-62" width="32" height="62" rx="6" fill="#ffffff"/>
    <path d="M-16 -168 a16 16 0 0 1 32 0 v4 h-32 z" fill="#cbbfa9"/>
    <path d="M-8 -160 h16 M-8 -156 h16 M-8 -152 h16" stroke="#fff" stroke-width="1.5"/>
    <g fill="none" stroke="#2b2b2b" stroke-width="2"><circle cx="-6" cy="-146" r="5"/><circle cx="7" cy="-146" r="5"/></g>
    <path d="M-6 -134 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M22 -100 l34 -8" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-20 -100 l30 4" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M12 -116 l50 -10 l50 10 l-4 36 l-46 -6 l-46 6 z" fill="#1f6f78"/>
    <path d="M16 -112 l46 -8 l46 8 l-2 28 l-44 -6 l-44 6 z" fill="#fdfaf3"/>
    <path d="M62 -120 v34" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M70 -110 h30 M70 -102 h30 M70 -94 h24" stroke="#1f6f78" stroke-width="2.5"/>
  </g>
  <!-- new waiter -->
  <g transform="translate(590 560)"><use href="#m" color="#8e3b46"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#2e2a2a"/>
    <circle cx="-8" cy="-150" r="2.4" fill="#2e2a2a"/><circle cx="4" cy="-150" r="2.4" fill="#2e2a2a"/>
    <path d="M-10 -140 q6 -2 12 0" stroke="#2e2a2a" stroke-width="2.4"/>
    <ellipse cx="-3" cy="-132" rx="4" ry="3" fill="#7a3a3a"/>
    <rect x="6" y="-98" width="12" height="16" fill="#fff"/>
    <path d="M22 -100 l14 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="44" cy="-58" rx="8" ry="30" fill="#b8bec2" transform="rotate(10 44 -58)"/>
    <path d="M-22 -100 l-10 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M560 390 l-10 -14 M580 384 v-18 M600 390 l10 -14" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>

  <!-- elderly couple at table -->
  <rect x="760" y="470" width="180" height="12" rx="3" fill="#9a9590"/><path d="M780 482 v78 M920 482 v78" stroke="#7d7a80" stroke-width="6"/>
  <ellipse cx="850" cy="466" rx="36" ry="6" fill="#4f8a3a"/><use href="#tum" transform="translate(800 470)"/><use href="#tum" transform="translate(900 470)"/>
  <g transform="translate(790 470)">
    <path d="M-22 0 v-50 a22 22 0 0 1 44 0 v50 z" fill="#5b9bd5"/>
    <circle cx="0" cy="-88" r="17" fill="#c98a5e"/><path d="M-17 -92 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#e3dccd"/>
    <path d="M-2 -84 q4 4 8 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>
  <g transform="translate(910 470)">
    <path d="M-24 0 v-50 a22 22 0 0 1 44 0 v50 z" fill="#3f8a5a"/><path d="M-20 -60 L18 -6" stroke="#e0a33a" stroke-width="5"/>
    <circle cx="-2" cy="-88" r="17" fill="#b07850"/><path d="M-19 -92 a17 17 0 0 1 34 0 q-17 -6 -34 0 z" fill="#d8cdb8"/><circle cx="12" cy="-96" r="7" fill="#d8cdb8"/>
    <path d="M-10 -84 q4 4 8 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>
  <path d="M840 350 C760 240 560 200 420 220" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="4 7" stroke-linecap="round"/>
</svg>
