<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A new teacher asks a back-bench boy the change for a 500 rupee note; he answers right, classmates clap, and an arrow shows him moving toward the front</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="kid">
      <path d="M-20 0 v-34 a20 20 0 0 1 40 0 v34 z" fill="currentColor"/>
      <rect x="-5" y="-62" width="10" height="8" fill="#b07850"/><circle cx="0" cy="-74" r="16" fill="#b07850"/>
      <path d="M-16 -76 a16 16 0 0 1 32 0 q-16 -6 -32 0 z" fill="#2e2a2a"/>
      <path d="M-5 -66 q5 4 10 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    </g>
    <g id="desk"><rect x="-80" y="0" width="160" height="14" rx="3" fill="#8a6d5a"/><rect x="-72" y="14" width="10" height="56" fill="#6b5446"/><rect x="62" y="14" width="10" height="56" fill="#6b5446"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- blackboard -->
  <rect x="30" y="110" width="270" height="200" rx="6" fill="#6b5446"/><rect x="40" y="120" width="250" height="180" fill="#2f4f43"/>
  <rect x="62" y="150" width="96" height="48" rx="4" fill="none" stroke="#f3ede0" stroke-width="3"/><text x="110" y="183" text-anchor="middle" font-size="22" font-weight="800" fill="#f3ede0">500</text>
  <path d="M174 174 h22" stroke="#f3ede0" stroke-width="4" stroke-linecap="round"/>
  <g fill="none" stroke="#f3ede0" stroke-width="3"><circle cx="222" cy="174" r="14"/><circle cx="256" cy="174" r="14"/></g>
  <path d="M70 236 h190 M70 262 h110" stroke="#f3ede0" stroke-width="3" stroke-dasharray="14 10" opacity=".7"/>
  <!-- window with bars -->
  <rect x="380" y="120" width="120" height="120" fill="#bfe0e3"/><path d="M400 120 v120 M420 120 v120 M440 120 v120 M460 120 v120 M480 120 v120" stroke="#3d3a3a" stroke-width="4"/>
  <!-- teacher -->
  <g transform="translate(330 560)">
    <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
    <path d="M-26 0 L-20 -100 h40 L26 0 z" fill="#e0a33a"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#e0a33a"/>
    <path d="M-20 -118 L22 -40 L10 -40 L-24 -104 z" fill="#b9802a"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#2e2a2a"/><circle cx="-12" cy="-162" r="8" fill="#2e2a2a"/>
    <circle cx="-2" cy="-148" r="2.4" fill="#2e2a2a"/><circle cx="10" cy="-148" r="2.4" fill="#2e2a2a"/><path d="M-2 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l30 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-6 46" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="356" y="364" width="64" height="34" rx="3" fill="#f2a7b8" transform="rotate(-10 388 381)"/>
  <text x="388" y="389" text-anchor="middle" font-size="18" font-weight="800" fill="#7a3a4e" transform="rotate(-10 388 381)">500</text>
  <!-- front bench, empty spot -->
  <rect x="410" y="520" width="150" height="10" rx="3" fill="#a8775c"/>
  <use href="#desk" transform="translate(485 470)"/>
  <rect x="452" y="490" width="66" height="26" rx="6" fill="none" stroke="#7a4e7e" stroke-width="2.5" stroke-dasharray="6 5"/>
  <!-- middle bench with clapping classmates -->
  <g transform="translate(600 450)"><use href="#kid" color="#ffffff"/><path d="M-16 -32 l20 -22 M16 -32 l-4 -26" stroke="#b07850" stroke-width="7" stroke-linecap="round"/></g>
  <g transform="translate(666 450)"><use href="#kid" color="#ffffff"/><circle cx="0" cy="-92" r="7" fill="#2e2a2a"/><path d="M-16 -32 l20 -22 M16 -32 l-4 -26" stroke="#b07850" stroke-width="7" stroke-linecap="round"/></g>
  <g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"><path d="M610 382 l4 -10 M622 386 l10 -6 M676 382 l4 -10 M688 386 l10 -6"/></g>
  <use href="#desk" transform="translate(634 450)"/>
  <!-- back bench boy standing -->
  <g transform="translate(850 560)">
    <ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/>
    <rect x="-13" y="-48" width="11" height="48" rx="5" fill="#3a4a6a"/><rect x="2" y="-48" width="11" height="48" rx="5" fill="#3a4a6a"/>
    <path d="M-15 -36 h30 v-10 h-30 z" fill="#3a4a6a"/>
    <path d="M-20 -44 v-36 a20 20 0 0 1 40 0 v36 z" fill="#ffffff"/>
    <rect x="-5" y="-108" width="10" height="8" fill="#b07850"/><circle cx="0" cy="-120" r="16" fill="#b07850"/>
    <path d="M-16 -122 a16 16 0 0 1 32 0 q-16 -6 -32 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-120" r="2.4" fill="#2e2a2a"/><circle cx="6" cy="-120" r="2.4" fill="#2e2a2a"/><path d="M-6 -111 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M-18 -86 l-22 -38" stroke="#b07850" stroke-width="7" stroke-linecap="round"/><path d="M-40 -124 l-2 -10 M-40 -124 l6 -8" stroke="#b07850" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 -86 l6 34" stroke="#b07850" stroke-width="7" stroke-linecap="round"/>
  </g>
  <use href="#desk" transform="translate(850 490)"/>
  <text x="836" y="610" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">BACK BENCH</text>
  <!-- answer bubble -->
  <rect x="700" y="230" width="150" height="80" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M800 308 l20 40 l6 -40" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M802 306 h22" stroke="#fff" stroke-width="5"/>
  <rect x="716" y="252" width="40" height="22" rx="2" fill="#b8d8a8"/><rect x="722" y="262" width="40" height="22" rx="2" fill="#9cc78a"/><circle cx="782" cy="276" r="10" fill="#e0a33a"/>
  <circle cx="824" cy="262" r="16" fill="#3f9a5a"/><path d="M816 262 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- arrow toward front -->
  <path d="M808 440 C760 330 600 300 520 474" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- inset: uncle's shop -->
  <circle cx="850" cy="126" r="82" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M784 92 h132" stroke="#8a6d5a" stroke-width="5"/>
  <g fill="#e0a33a"><rect x="796" y="66" width="18" height="24" rx="3"/><rect x="852" y="70" width="20" height="20" rx="3" fill="#e07a5f"/></g><rect x="822" y="60" width="22" height="30" rx="3" fill="#1f6f78"/><rect x="880" y="64" width="20" height="26" rx="3" fill="#7a4e7e"/>
  <rect x="784" y="150" width="132" height="44" fill="#a8775c"/><rect x="778" y="142" width="144" height="12" rx="3" fill="#8a6d5a"/>
  <rect x="806" y="120" width="44" height="22" rx="3" fill="#3d3a3a"/><g fill="#e0a33a"><circle cx="874" cy="136" r="7"/><circle cx="890" cy="138" r="7"/><circle cx="882" cy="128" r="7"/></g>
  <circle cx="770" cy="214" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="782" cy="236" r="5" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
</svg>
