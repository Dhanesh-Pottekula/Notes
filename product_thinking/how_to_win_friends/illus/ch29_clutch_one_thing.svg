<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A learner car stalls on a slope while the instructor sighs; another instructor praises the steering and practises only the clutch in an empty lot</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="car">
      <ellipse cx="0" cy="2" rx="150" ry="8" fill="#000" opacity=".08"/>
      <path d="M-140 -26 v-42 q0 -14 14 -16 l44 -6 l34 -44 h96 l40 44 l34 6 q12 2 12 16 v42 z" fill="#f0f3f4"/>
      <path d="M-140 -26 v-14 h280 v14 z" fill="#cdd8dc"/>
      <path d="M-74 -92 l28 -36 h40 v36 z" fill="#bfe0e3"/><path d="M6 -92 v-36 h38 l32 36 z" fill="#bfe0e3"/>
      <rect x="-30" y="-150" width="40" height="22" rx="3" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
      <text x="-10" y="-133" text-anchor="middle" font-size="18" font-weight="800" fill="#e07a5f">L</text>
      <circle cx="-82" cy="-26" r="27" fill="#3d3a3a"/><circle cx="-82" cy="-26" r="10" fill="#b9ad98"/>
      <circle cx="86" cy="-26" r="27" fill="#3d3a3a"/><circle cx="86" cy="-26" r="10" fill="#b9ad98"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEVER</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">JUST ONE THING</text>

  <!-- LEFT: slope -->
  <path d="M0 640 V560 L478 440 V640 z" fill="#b9ad98"/>
  <g transform="translate(240 500) rotate(-14)">
    <use href="#car"/>
    <!-- instructor in rear window, hand on forehead -->
    <circle cx="-30" cy="-104" r="15" fill="#c98a5e"/><path d="M-45 -106 a15 15 0 0 1 30 0 z" fill="#2e2a2a"/>
    <path d="M-36 -104 l6 -2 M-26 -106 l6 2" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-48 -92 q-6 -16 6 -20" stroke="#c98a5e" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- student in front window -->
    <circle cx="34" cy="-104" r="15" fill="#b07850"/><path d="M19 -106 a15 15 0 0 1 30 0 q-15 -6 -30 0 z" fill="#2e2a2a"/><circle cx="20" cy="-110" r="7" fill="#2e2a2a"/>
    <path d="M28 -98 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>
  <!-- smoke puff and stall -->
  <g fill="#cbbfa9"><circle cx="400" cy="380" r="18"/><circle cx="424" cy="364" r="14"/><circle cx="420" cy="392" r="12"/></g>
  <circle cx="240" cy="230" r="24" fill="#e07a5f"/><path d="M230 220 l20 20 M250 220 l-20 20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M200 280 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0" stroke="#8f8a85" stroke-width="3" fill="none"/>
  <!-- cloud of sigh -->
  
  <!-- RIGHT: empty lot -->
  <rect x="482" y="520" width="478" height="120" fill="#cbbfa9"/>
  <g stroke="#ffffff" stroke-width="5"><path d="M520 540 l-20 90 M900 540 l20 90"/></g>
  <g transform="translate(700 572)">
    <use href="#car"/>
    <circle cx="-30" cy="-104" r="15" fill="#d9a27a"/><path d="M-45 -106 a15 15 0 0 1 30 0 q-15 -6 -30 0 z" fill="#d8d2c8"/>
    <path d="M-36 -96 q6 4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-16 -94 l20 10" stroke="#1f6f78" stroke-width="8" stroke-linecap="round"/>
    <circle cx="34" cy="-104" r="15" fill="#b07850"/><path d="M19 -106 a15 15 0 0 1 30 0 q-15 -6 -30 0 z" fill="#2e2a2a"/><circle cx="20" cy="-110" r="7" fill="#2e2a2a"/>
    <path d="M28 -96 q6 4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  </g>
  <!-- steering wheel tick -->
  <circle cx="852" cy="400" r="22" fill="none" stroke="#3d3a3a" stroke-width="6"/><path d="M830 400 h44 M852 400 v22" stroke="#3d3a3a" stroke-width="5"/>
  <circle cx="878" cy="376" r="14" fill="#3f9a5a"/><path d="M871 376 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- pedal inset -->
  <rect x="540" y="110" width="290" height="190" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M676 298 l14 74 l22 -74" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M678 296 h32" stroke="#fff" stroke-width="5"/>
  <path d="M608 140 v80" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/><rect x="584" y="216" width="48" height="26" rx="6" fill="#3d3a3a"/>
  <path d="M572 236 v-70" stroke="#1f6f78" stroke-width="5" marker-end="url(#ah)"/>
  <path d="M590 262 q8 -8 14 0 q8 8 14 0 q8 -8 14 0" stroke="#e0a33a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M770 140 v80" stroke="#3d3a3a" stroke-width="8" stroke-linecap="round"/><rect x="752" y="212" width="36" height="40" rx="6" fill="#3d3a3a"/>
  <path d="M650 200 h86" stroke="#1f6f78" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#ah)"/>
  <!-- tally of ten -->
  <g stroke-linecap="round" transform="translate(30 162)">
    <g stroke="#3f9a5a" stroke-width="5"><path d="M546 452 l5 6 l9 -12 M576 452 l5 6 l9 -12 M606 452 l5 6 l9 -12 M636 452 l5 6 l9 -12 M666 452 l5 6 l9 -12 M696 452 l5 6 l9 -12 M726 452 l5 6 l9 -12"/></g>
    <g stroke="#b9ad98" stroke-width="5"><path d="M760 444 v16 M780 444 v16 M800 444 v16"/></g>
  </g>
</svg>
