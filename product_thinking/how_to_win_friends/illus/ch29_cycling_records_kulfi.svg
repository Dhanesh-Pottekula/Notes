<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A father jogs behind his son on a bicycle past chalk marks of 5, 8 and 12 metres while neighbours cheer from balconies and a kulfi waits as the prize</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#8f8a85"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#8f8a85"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="hb"><rect x="-36" y="-30" width="72" height="30" rx="2" fill="#efe2c8"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <circle cx="480" cy="250" r="90" fill="#f2c27a" opacity=".55"/>
  <text x="480" y="62" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEW RECORD</text>
  <!-- houses -->
  <rect x="20" y="150" width="300" height="320" fill="#e9c9a3"/><rect x="20" y="140" width="300" height="14" fill="#c9a77a"/>
  <rect x="640" y="160" width="300" height="310" fill="#cfd9cf"/><rect x="640" y="150" width="300" height="14" fill="#a9bba9"/>
  <rect x="340" y="280" width="280" height="190" fill="#ece0cc"/>
  <g fill="#8a6d5a"><rect x="60" y="360" width="56" height="110"/><rect x="380" y="370" width="50" height="100"/><rect x="860" y="360" width="56" height="110"/></g>
  <g fill="#bfe0e3"><rect x="200" y="360" width="70" height="56"/><rect x="480" y="330" width="90" height="50"/><rect x="700" y="360" width="70" height="56"/></g>
  <!-- balconies with neighbours -->
  <g transform="translate(130 270) scale(.7)"><use href="#m" color="#7a4e7e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#d8d2c8"/><circle cx="0" cy="-170" r="8" fill="#d8d2c8"/>
    <path d="M-6 -138 q6 6 12 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-22 -104 l-10 -36 M22 -104 l10 -36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="60" y="266" width="200" height="16" fill="#6b5446"/><path d="M70 266 v-46 M100 266 v-46 M130 266 v-46 M160 266 v-46 M190 266 v-46 M220 266 v-46 M250 266 v-46 M64 222 h192" stroke="#6b5446" stroke-width="5" fill="none"/>
  <g transform="translate(800 280) scale(.7)"><use href="#m" color="#e07a5f"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-6 -138 q6 6 12 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-22 -104 l-22 -50 M22 -104 l22 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="700" y="276" width="210" height="16" fill="#6b5446"/><path d="M710 276 v-46 M740 276 v-46 M770 276 v-46 M800 276 v-46 M830 276 v-46 M860 276 v-46 M890 276 v-46 M704 232 h202" stroke="#6b5446" stroke-width="5" fill="none"/>
  <!-- lane -->
  <rect y="470" width="960" height="170" fill="#cbbfa9"/>
  <!-- chalk lines -->
  <g stroke="#ffffff" stroke-width="6" stroke-linecap="round"><path d="M250 486 L240 626"/><path d="M450 486 L444 626"/><path d="M700 486 L700 626"/></g>
  <g font-size="22" font-weight="800" fill="#ffffff"><text x="262" y="512">5 m</text><text x="462" y="512">8 m</text><text x="714" y="512">12 m</text></g>
  <!-- father jogging -->
  <g transform="translate(410 600)"><use href="#m" color="#ffffff"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-4" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="8" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M-6 -138 q8 10 16 0 z" fill="#2e2a2a"/>
    <path d="M22 -104 l44 -4" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-14 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- bicycle and boy -->
  <g transform="translate(560 600)">
    <ellipse cx="40" cy="4" rx="70" ry="7" fill="#000" opacity=".08"/>
    <circle cx="0" cy="-32" r="32" fill="none" stroke="#3d3a3a" stroke-width="6"/><circle cx="90" cy="-32" r="32" fill="none" stroke="#3d3a3a" stroke-width="6"/>
    <path d="M0 -32 L30 -80 L76 -80 L90 -32 M30 -80 L44 -32 L76 -80 M44 -32 L0 -32" stroke="#e07a5f" stroke-width="6" fill="none" stroke-linejoin="round"/>
    <path d="M76 -80 l-4 -22 h14" stroke="#3d3a3a" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="18" y="-90" width="26" height="8" rx="4" fill="#3d3a3a"/>
    <path d="M30 -92 l14 46" stroke="#4a5a7a" stroke-width="11" stroke-linecap="round"/>
    <path d="M24 -90 l-6 -46 a18 18 0 0 1 36 0 l-4 46 z" fill="#1f6f78"/>
    <rect x="31" y="-146" width="10" height="8" fill="#c98a5e"/><circle cx="38" cy="-160" r="16" fill="#c98a5e"/>
    <path d="M22 -162 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
    <circle cx="44" cy="-160" r="2.5" fill="#2e2a2a"/><path d="M42 -150 q4 3 8 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/><circle cx="50" cy="-149" r="2.5" fill="#e07a5f"/>
    <path d="M46 -126 l36 20" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 -172 l8 -6 M106 -160 l10 -2" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"/>
  </g>
  <path d="M690 560 h70" stroke="#7a4e7e" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#ah)"/>
  <!-- kulfi cart -->
  <g transform="translate(870 600)">
    <ellipse cx="0" cy="4" rx="70" ry="7" fill="#000" opacity=".08"/>
    <rect x="-60" y="-110" width="120" height="70" rx="6" fill="#e07a5f"/><rect x="-60" y="-118" width="120" height="14" rx="4" fill="#c25f47"/>
    <circle cx="-34" cy="-22" r="20" fill="#3d3a3a"/><circle cx="34" cy="-22" r="20" fill="#3d3a3a"/><circle cx="-34" cy="-22" r="6" fill="#8f8a85"/><circle cx="34" cy="-22" r="6" fill="#8f8a85"/>
    <path d="M0 -118 v-54" stroke="#8a6d5a" stroke-width="4"/>
    <path d="M-12 -172 h24 l-2 -50 a10 10 0 0 0 -20 0 z" fill="#f3e3b0"/><path d="M-12 -200 h24" stroke="#e0a33a" stroke-width="4"/>
  </g>
</svg>
