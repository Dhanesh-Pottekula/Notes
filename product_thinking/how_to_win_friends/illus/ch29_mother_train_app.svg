    <rect x="574" y="146" width="44" height="26" rx="6" fill="#1f6f78"/><rect x="580" y="151" width="12" height="9" fill="#fff"/><rect x="598" y="151" width="12" height="9" fill="#fff"/><circle cx="582" cy="175" r="4" fill="#3d3a3a"/><circle cx="610" cy="175" r="4" fill="#3d3a3a"/>
    <circle cx="726" cy="161" r="15" fill="#3f9a5a"/><path d="M719 161 l5 5 l10 -11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
