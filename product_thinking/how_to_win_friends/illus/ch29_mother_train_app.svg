    <rect x="578" y="204" width="36" height="34" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="578" y="204" width="36" height="10" fill="#e07a5f"/>
    <circle cx="726" cy="221" r="15" fill="#3f9a5a"/><path d="M719 221 l5 5 l10 -11" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>
  <g>
    <rect x="558" y="256" width="194" height="50" rx="10" fill="#fdf4e2" stroke="#e0a33a" stroke-width="2" stroke-dasharray="6 4"/>
    <circle cx="588" cy="272" r="7" fill="#7a4e7e"/><path d="M576 294 a12 12 0 0 1 24 0 z" fill="#7a4e7e"/>
    <circle cx="626" cy="281" r="13" fill="#e0a33a"/><text x="626" y="288" text-anchor="middle" font-size="18" font-weight="800" fill="#fff">₹</text>
    <circle cx="726" cy="281" r="10" fill="#e0a33a"/>
  </g>
  <!-- later inset: mother books alone -->
  <circle cx="862" cy="206" r="76" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M800 252 a64 30 0 0 0 124 0" fill="#d8cdb8"/>
  <g transform="translate(850 262) scale(.72)"><use href="#sw" color="#5b9a6a"/>
    <path d="M-6 -73 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.4" fill="none"/>
    <path d="M20 -36 l12 -16" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  </g>
  <use href="#ph" transform="translate(876 216) scale(.6)"/>
  <rect x="884" y="160" width="34" height="22" rx="3" fill="#fde4b0" stroke="#e0a33a" stroke-width="2"/><path d="M890 168 h20 M890 174 h14" stroke="#b9876a" stroke-width="2"/>
