<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A son scolds his mother and takes the phone back; told the hard part is done, she finishes booking and later books her own train ticket</title>
