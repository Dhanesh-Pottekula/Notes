<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One music teacher lists everything wrong and the adult learner walks out; another praises his ear and fixes only the breathing, and he comes every Sunday</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="w">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-26 0 L-20 -100 h40 L26 0 z" fill="currentColor"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <path d="M-20 -118 L22 -40 L10 -40 L-24 -104 z" fill="#000" opacity=".14"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#2e2a2a"/><circle cx="0" cy="-170" r="9" fill="#2e2a2a"/>
    </g>
    <g id="s">
      <ellipse cx="0" cy="4" rx="40" ry="7" fill="#000" opacity=".08"/>
      <ellipse cx="0" cy="-8" rx="36" ry="12" fill="#4a3f55"/>
      <path d="M-22 -12 v-34 a22 22 0 0 1 44 0 v34 z" fill="currentColor"/>
      <rect x="-5" y="-76" width="10" height="9" fill="#c98a5e"/>
      <circle cx="0" cy="-88" r="17" fill="#c98a5e"/>
    </g>
    <g id="tan"><ellipse cx="0" cy="0" rx="30" ry="34" fill="#8a6d5a"/><rect x="-6" y="-210" width="12" height="190" rx="4" fill="#6b5446"/><path d="M-3 -200 V-10 M3 -200 V-10" stroke="#e3dccd" stroke-width="1"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">START OVER</text>
  <text x="720" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">FIX ONE THING</text>

  <!-- LEFT: cold class -->
  <rect x="20" y="540" width="300" height="22" rx="4" fill="#cbbfa9"/>
  <path d="M30 551 H310" stroke="#b9ad98" stroke-width="2" stroke-dasharray="8 6"/>
  <!-- board with crosses -->
  <rect x="40" y="110" width="170" height="210" rx="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <g fill="#1f6f78"><ellipse cx="78" cy="152" rx="9" ry="15"/><ellipse cx="98" cy="152" rx="9" ry="15"/></g>
  <path d="M88 132 v10" stroke="#1f6f78" stroke-width="4"/>
  <path d="M86 230 v-34 l16 -4 v30" stroke="#7a4e7e" stroke-width="4" fill="none"/><circle cx="80" cy="230" r="7" fill="#7a4e7e"/><circle cx="96" cy="226" r="7" fill="#7a4e7e"/>
  <circle cx="88" cy="262" r="7" fill="#e0a33a"/><path d="M88 270 q14 14 4 30" stroke="#e0a33a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g><circle cx="170" cy="152" r="16" fill="#e07a5f"/><path d="M163 145 l14 14 M177 145 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  <g><circle cx="170" cy="212" r="16" fill="#e07a5f"/><path d="M163 205 l14 14 M177 205 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  <g><circle cx="170" cy="276" r="16" fill="#e07a5f"/><path d="M163 269 l14 14 M177 269 l-14 14" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  <!-- strict teacher -->
  <g transform="translate(262 540)"><use href="#w" color="#7a4e7e"/>
    <path d="M-20 -104 l-44 -74" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M20 -104 l6 46" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M-10 -154 l7 3 M10 -154 l-7 3" stroke="#2e2a2a" stroke-width="2.5"/><circle cx="-6" cy="-147" r="2.4" fill="#2e2a2a"/><circle cx="6" cy="-147" r="2.4" fill="#2e2a2a"/>
    <path d="M-6 -134 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <!-- children seated -->
  <g transform="translate(70 556) scale(.62)"><use href="#s" color="#e0a33a"/><path d="M-17 -90 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/><rect x="-22" y="-44" width="44" height="26" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
  <g transform="translate(140 556) scale(.62)"><use href="#s" color="#e07a5f"/><path d="M-17 -90 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/><circle cx="0" cy="-108" r="7" fill="#2e2a2a"/><rect x="-22" y="-44" width="44" height="26" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
  <g transform="translate(210 556) scale(.62)"><use href="#s" color="#1f6f78"/><path d="M-17 -90 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/><rect x="-22" y="-44" width="44" height="26" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="2"/></g>
  <!-- door, man leaving -->
  <rect x="360" y="300" width="100" height="260" fill="#8a6d5a"/><rect x="370" y="310" width="80" height="250" fill="#efe6d4"/>
  <g transform="translate(410 560)"><use href="#m" color="#f3ede0"/>
    <path d="M-19 -146 a19 19 0 0 1 38 0 v6 h-38 z" fill="#8f8a85"/>
    <path d="M-22 -100 l-6 46 M22 -100 l6 46" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="22" y="-70" width="22" height="26" rx="4" fill="#b9876a"/>
  </g>

  <!-- RIGHT: warm class -->
  <rect x="510" y="540" width="420" height="22" rx="4" fill="#cbbfa9"/>
  <path d="M520 551 H920" stroke="#b9ad98" stroke-width="2" stroke-dasharray="8 6"/>
  <g transform="translate(540 540) rotate(-8)"><use href="#tan"/></g>
  <!-- checklist -->
  <rect x="596" y="110" width="170" height="210" rx="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M640 140 a16 18 0 1 1 16 26 q-6 4 -6 12" stroke="#c98a5e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M642 230 v-34 l16 -4 v30" stroke="#7a4e7e" stroke-width="4" fill="none"/><circle cx="636" cy="230" r="7" fill="#7a4e7e"/><circle cx="652" cy="226" r="7" fill="#7a4e7e"/>
  <g fill="#1f6f78"><ellipse cx="634" cy="278" rx="9" ry="15"/><ellipse cx="654" cy="278" rx="9" ry="15"/></g><path d="M644 258 v10" stroke="#1f6f78" stroke-width="4"/>
  <g><circle cx="728" cy="152" r="16" fill="#3f9a5a"/><path d="M720 152 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <g><circle cx="728" cy="212" r="16" fill="#3f9a5a"/><path d="M720 212 l6 6 l10 -12" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></g>
  <circle cx="728" cy="278" r="15" fill="none" stroke="#e0a33a" stroke-width="5"/>
  <!-- calendar of Sundays -->
  <rect x="800" y="110" width="130" height="150" rx="6" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="800" y="110" width="130" height="26" rx="6" fill="#e07a5f"/>
  <g fill="#d8cdb8"><rect x="812" y="148" width="14" height="12"/><rect x="832" y="148" width="14" height="12"/><rect x="852" y="148" width="14" height="12"/><rect x="872" y="148" width="14" height="12"/><rect x="812" y="174" width="14" height="12"/><rect x="832" y="174" width="14" height="12"/><rect x="852" y="174" width="14" height="12"/><rect x="872" y="174" width="14" height="12"/><rect x="812" y="200" width="14" height="12"/><rect x="832" y="200" width="14" height="12"/><rect x="852" y="200" width="14" height="12"/><rect x="872" y="200" width="14" height="12"/><rect x="812" y="226" width="14" height="12"/><rect x="832" y="226" width="14" height="12"/><rect x="852" y="226" width="14" height="12"/><rect x="872" y="226" width="14" height="12"/></g>
  <g fill="none" stroke="#1f6f78" stroke-width="3"><circle cx="906" cy="154" r="10"/><circle cx="906" cy="180" r="10"/><circle cx="906" cy="206" r="10"/><circle cx="906" cy="232" r="10"/></g>
  <!-- warm teacher seated -->
  <g transform="translate(640 552)"><use href="#s" color="#1f6f78"/>
    <ellipse cx="0" cy="-8" rx="36" ry="12" fill="#1f6f78"/>
    <path d="M-17 -90 a17 17 0 0 1 34 0 q-17 -8 -34 0 z" fill="#d8d2c8"/><circle cx="0" cy="-108" r="8" fill="#d8d2c8"/>
    <path d="M-6 -90 q3 3 6 0 M2 -90 q3 3 6 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
    <path d="M-6 -78 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M20 -56 l44 6" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- man seated, happy -->
  <g transform="translate(820 552)"><use href="#s" color="#f3ede0"/>
    <path d="M-17 -92 a17 17 0 0 1 34 0 z" fill="#8f8a85"/>
    <g fill="none" stroke="#2e2a2a" stroke-width="2"><circle cx="-7" cy="-88" r="6"/><circle cx="7" cy="-88" r="6"/><path d="M-1 -88 h2"/></g>
    <path d="M-6 -77 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-20 -50 q-10 20 6 36 M20 -50 q10 20 -6 36" stroke="#c98a5e" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- music notes between them -->
  <g fill="#7a4e7e"><circle cx="716" cy="430" r="6"/><path d="M721 430 v-26 l10 4" stroke="#7a4e7e" stroke-width="3" fill="none"/><circle cx="748" cy="410" r="6"/><path d="M753 410 v-26 l10 4" stroke="#7a4e7e" stroke-width="3" fill="none"/></g>
</svg>
