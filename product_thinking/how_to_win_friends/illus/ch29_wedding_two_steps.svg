<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a Kerala wedding an aunt shows a shy young man just two steps, left and right, and points to the drum whose beat he already knows from the tabla</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <marker id="ah2" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <path d="M-22 0 L-20 -64 h40 L22 0 z" fill="#f3ede0"/><path d="M-22 -8 h44" stroke="#e0a33a" stroke-width="4"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="w">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <path d="M-26 0 L-20 -100 h40 L26 0 z" fill="currentColor"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/>
      <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="foot"><path d="M0 -26 c14 0 18 14 16 30 c-2 16 -26 16 -28 0 c-2 -16 0 -30 12 -30 z" fill="#cbbfa9"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- garlands -->
  <path d="M0 24 q120 60 240 0 q120 60 240 0 q120 60 240 0 q120 60 240 0" stroke="#e0a33a" stroke-width="10" fill="none" stroke-dasharray="2 12" stroke-linecap="round"/>
  <path d="M0 34 q120 50 240 0 q120 50 240 0 q120 50 240 0 q120 50 240 0" stroke="#ffffff" stroke-width="7" fill="none" stroke-dasharray="1 10" stroke-linecap="round"/>
  <text x="480" y="112" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">JUST TWO STEPS</text>
  <!-- stage with banana-leaf arch -->
  <rect x="720" y="470" width="230" height="90" fill="#b9876a"/><rect x="720" y="470" width="230" height="10" fill="#a8775c"/>
  <path d="M740 470 v-180 q100 -90 200 0 v180" stroke="#5b9a5a" stroke-width="18" fill="none"/>
  <path d="M740 350 l-18 -20 M740 390 l-18 -14 M940 350 l12 -16 M940 390 l12 -12" stroke="#5b9a5a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="840" cy="216" r="12" fill="#e0a33a"/>
  <!-- dance floor -->
  <ellipse cx="410" cy="604" rx="190" ry="30" fill="#e9dcc4"/>
  <!-- footprints with arrows -->
  <use href="#foot" transform="translate(380 616) rotate(-10)"/>
  <use href="#foot" transform="translate(446 616) rotate(10)"/>
  <path d="M354 612 h-46" stroke="#1f6f78" stroke-width="5" marker-end="url(#ah2)"/>
  <path d="M472 612 h46" stroke="#1f6f78" stroke-width="5" marker-end="url(#ah2)"/>
  <!-- relatives in background circle -->
  <g opacity=".85">
    <g transform="translate(560 548) scale(.62)"><use href="#w" color="#7a4e7e"/><path d="M-22 -104 l-20 -40 M22 -104 l20 -40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
    <g transform="translate(616 548) scale(.62)"><use href="#m" color="#1f6f78"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><path d="M-22 -104 l-22 -36 M22 -104 l22 -36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
    <g transform="translate(668 548) scale(.62)"><use href="#w" color="#e0a33a"/><path d="M-22 -104 l-20 -40 M22 -104 l20 -40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  </g>
  <!-- young man protesting -->
  <g transform="translate(240 560)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="-6" cy="-148" r="2.4" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.4" fill="#2e2a2a"/><path d="M-6 -136 q6 3 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-40 -144 l-6 -10" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
    <path d="M22 -104 l40 4" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- cousin tugging -->
  <g transform="translate(330 560)"><use href="#w" color="#e07a5f"/>
    <circle cx="0" cy="-170" r="8" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/><circle cx="-6" cy="-148" r="2.4" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.4" fill="#2e2a2a"/>
    <path d="M-22 -104 l-26 6" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l10 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- aunt demonstrating -->
  <g transform="translate(440 560)"><use href="#w" color="#f3ede0"/>
    <path d="M-26 -4 h52" stroke="#e0a33a" stroke-width="6"/><path d="M-20 -118 L22 -40" stroke="#e0a33a" stroke-width="5"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -10 -38 0 z" fill="#8f8a85"/><g fill="#fff"><circle cx="16" cy="-160" r="4"/><circle cx="20" cy="-152" r="4"/><circle cx="22" cy="-144" r="4"/></g>
    <path d="M-8 -150 q3 3 6 0 M2 -150 q3 3 6 0" stroke="#2e2a2a" stroke-width="2.2" fill="none"/>
    <path d="M-8 -138 q8 8 16 0 z" fill="#2e2a2a"/>
    <path d="M-22 -104 l-30 -26" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l80 -46" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- drummer -->
  <g transform="translate(830 560)"><use href="#m" color="#f3ede0"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <rect x="-46" y="-96" width="92" height="40" rx="18" fill="#e0a33a"/><path d="M-30 -94 l14 36 M-6 -94 l14 36 M18 -94 l14 36" stroke="#a8775c" stroke-width="3"/><ellipse cx="-46" cy="-76" rx="8" ry="20" fill="#e3dccd"/><ellipse cx="46" cy="-76" rx="8" ry="20" fill="#e3dccd"/>
        <path d="M-22 -104 l-30 26 M22 -104 l30 26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <!-- beat line from drum to thought of tabla -->
  <path d="M776 470 C640 330 420 280 300 250" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <g fill="#7a4e7e"><circle cx="610" cy="352" r="6"/><path d="M615 352 v-22 l9 3" stroke="#7a4e7e" stroke-width="3" fill="none"/><circle cx="470" cy="290" r="6"/><path d="M475 290 v-22 l9 3" stroke="#7a4e7e" stroke-width="3" fill="none"/></g>
  <!-- thought bubble with tabla -->
  <ellipse cx="196" cy="226" rx="96" ry="64" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <circle cx="226" cy="316" r="9" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="236" cy="340" r="5" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M138 264 q-4 -34 10 -50 h40 q14 16 10 50 z" fill="#8a6d5a"/><ellipse cx="168" cy="214" rx="22" ry="6" fill="#e3dccd"/><circle cx="168" cy="214" r="4" fill="#3d3a3a"/>
  <path d="M206 264 q-6 -26 6 -40 h28 q12 14 6 40 z" fill="#3d3a3a"/><ellipse cx="226" cy="224" rx="16" ry="5" fill="#e3dccd"/><circle cx="226" cy="224" r="3.5" fill="#3d3a3a"/>
</svg>
