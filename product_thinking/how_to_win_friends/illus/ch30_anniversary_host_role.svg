<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>At a 50th anniversary party the uncle gives the speech while the proud cousin runs the evening with a clipboard</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="sit">
      <rect x="-28" y="-70" width="56" height="74" rx="8" fill="#8a6d5a"/>
      <rect x="-20" y="-18" width="40" height="12" rx="6" fill="#4a3f55"/>
      <rect x="10" y="-14" width="12" height="40" rx="6" fill="#4a3f55"/><rect x="-22" y="-14" width="12" height="40" rx="6" fill="#4a3f55"/>
      <path d="M-22 -10 v-38 a22 22 0 0 1 44 0 v38 z" fill="currentColor"/>
      <rect x="-5" y="-78" width="10" height="9" fill="#d9a27a"/>
      <circle cx="0" cy="-90" r="16" fill="#d9a27a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- string lights -->
  <path d="M0 30 q120 40 240 0 q120 40 240 0 q120 40 240 0 q120 40 240 0" stroke="#8a6d5a" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="60" cy="44" r="6"/><circle cx="120" cy="50" r="6"/><circle cx="180" cy="44" r="6"/><circle cx="300" cy="44" r="6"/><circle cx="360" cy="50" r="6"/><circle cx="420" cy="44" r="6"/><circle cx="540" cy="44" r="6"/><circle cx="600" cy="50" r="6"/><circle cx="660" cy="44" r="6"/><circle cx="780" cy="44" r="6"/><circle cx="840" cy="50" r="6"/><circle cx="900" cy="44" r="6"/></g>
  <!-- stage -->
  <rect x="290" y="430" width="380" height="40" fill="#b9ad98"/><rect x="290" y="424" width="380" height="10" rx="3" fill="#cbbfa9"/>
  <path d="M320 428 V250 a160 140 0 0 1 320 0 V428" stroke="#e0a33a" stroke-width="16" fill="none" stroke-dasharray="1 18" stroke-linecap="round"/>
  <path d="M320 428 V250 a160 140 0 0 1 320 0 V428" stroke="#e07a5f" stroke-width="8" fill="none" stroke-dasharray="1 18" stroke-dashoffset="9" stroke-linecap="round"/>
  <circle cx="480" cy="170" r="40" fill="#fff" stroke="#e0a33a" stroke-width="4"/>
  <text x="480" y="186" text-anchor="middle" font-size="40" font-weight="800" fill="#b8862a">50</text>
  <!-- grandparents seated -->
  <g transform="translate(430 424)"><use href="#sit" color="#f3e3b0"/>
    <path d="M-22 -48 l44 30" stroke="#e0a33a" stroke-width="7"/>
    <path d="M-16 -94 a16 16 0 0 1 32 0 q-16 -6 -32 0 z" fill="#d8d3cc"/><circle cx="0" cy="-110" r="7" fill="#d8d3cc"/>
    <path d="M-6 -84 q6 4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/></g>
  <g transform="translate(530 424)"><use href="#sit" color="#ffffff"/>
    <path d="M-16 -94 a16 16 0 0 1 32 0 q-16 -4 -32 0 z" fill="#e8e4de"/>
    <circle cx="-6" cy="-92" r="5" fill="none" stroke="#3d3a3a" stroke-width="1.6"/><circle cx="6" cy="-92" r="5" fill="none" stroke="#3d3a3a" stroke-width="1.6"/>
    <path d="M-6 -82 q6 4 12 0" stroke="#2e2a2a" stroke-width="2" fill="none"/></g>
  <!-- cake table -->
  <rect x="610" y="520" width="90" height="10" rx="3" fill="#6b5446"/><path d="M620 530 v30 M690 530 v30" stroke="#6b5446" stroke-width="6"/>
  <rect x="628" y="488" width="54" height="32" rx="4" fill="#fbeedb"/><rect x="636" y="468" width="38" height="22" rx="4" fill="#f3c6c0"/><path d="M655 468 v-12" stroke="#e0a33a" stroke-width="3"/>
  <!-- uncle at mic -->
  <path d="M216 560 v-150" stroke="#3d3a3a" stroke-width="4"/><path d="M200 560 h32" stroke="#3d3a3a" stroke-width="5"/><rect x="208" y="398" width="16" height="22" rx="7" fill="#3d3a3a"/>
  <g transform="translate(150 560)"><use href="#m" color="#8a6d5a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -6 -38 0 z" fill="#d8d3cc"/>
    <path d="M-6 -136 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l24 -14" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="40" y="-136" width="26" height="34" rx="2" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
    <path d="M-22 -104 l-6 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <text x="150" y="364" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SPEECH</text>
  <!-- caterer with sweets tray -->
  <g transform="translate(470 600) scale(.92)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -104 l10 -10 M22 -104 l-10 -10" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="-44" y="-122" width="88" height="8" rx="4" fill="#9a9590"/>
    <g fill="#e0a33a"><circle cx="-28" cy="-128" r="7"/><circle cx="-10" cy="-128" r="7"/><circle cx="8" cy="-128" r="7"/><circle cx="26" cy="-128" r="7"/></g></g>
  <!-- mother, approving -->
  <g transform="translate(895 560) scale(.95)"><use href="#m" color="#3f9a5a"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#3f9a5a"/><path d="M-22 -116 L22 -66" stroke="#2f7a46" stroke-width="10"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="0" cy="-168" r="8" fill="#2e2a2a"/>
    <path d="M-6 -136 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
  <!-- cousin host -->
  <g transform="translate(760 610) scale(1.18)"><use href="#m" color="#8e2f3a"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#8e2f3a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-52 -18" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l14 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="22" y="-96" width="34" height="44" rx="3" fill="#8a6d5a"/><rect x="26" y="-90" width="26" height="36" fill="#fff"/>
    <path d="M30 -82 l3 3 l5 -6 M30 -72 l3 3 l5 -6 M30 -62 l3 3 l5 -6" stroke="#3f9a5a" stroke-width="2" fill="none"/>
    <path d="M41 -80 h8 M41 -70 h8 M41 -60 h8" stroke="#b9ad98" stroke-width="2"/></g>
  <text x="760" y="390" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">HOST</text>
  <!-- direction arrows -->
  <path d="M668 462 C620 410 560 420 520 470" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M668 456 C520 300 330 330 240 400" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
