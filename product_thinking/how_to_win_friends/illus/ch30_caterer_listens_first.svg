<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A wedding caterer listens and takes notes with the family before matching a package to what they care about</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="s">
      <rect x="-22" y="-18" width="44" height="14" rx="7" fill="#4a3f55"/>
      <rect x="-22" y="-12" width="13" height="42" rx="6" fill="#4a3f55"/><rect x="9" y="-12" width="13" height="42" rx="6" fill="#4a3f55"/>
      <path d="M-24 -8 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-82" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-96" r="18" fill="#c98a5e"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="480" y="62" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">LISTEN FIRST</text>
  <!-- steps -->
  <g stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#ah)"><path d="M336 124 h44"/><path d="M456 124 h44"/><path d="M576 124 h44"/></g>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="2"><circle cx="300" cy="124" r="32"/><circle cx="420" cy="124" r="32"/><circle cx="540" cy="124" r="32"/><circle cx="660" cy="124" r="32"/></g>
  <path d="M292 108 a14 16 0 1 1 18 22 q-4 4 -6 10 q-2 6 -8 4" stroke="#1f6f78" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M420 140 l-18 -18 a10 10 0 0 1 18 -12 a10 10 0 0 1 18 12 z" fill="#e07a5f"/>
  <g stroke="#2b2b2b" stroke-width="3"><path d="M528 112 h26 M528 124 h26 M528 136 h26"/></g><g fill="#e0a33a"><circle cx="522" cy="112" r="3"/><circle cx="522" cy="124" r="3"/><circle cx="522" cy="136" r="3"/></g>
  <ellipse cx="660" cy="130" rx="22" ry="8" fill="#cbbfa9"/><ellipse cx="660" cy="126" rx="16" ry="5" fill="#e0a33a"/>
  <path d="M676 102 l3 6 l6 3 l-6 3 l-3 6 l-3 -6 l-6 -3 l6 -3 z" fill="#e0a33a"/>
  <!-- lamp -->
  <path d="M920 560 V300" stroke="#6b5446" stroke-width="5"/><path d="M896 300 h48 l-10 -40 h-28 z" fill="#e0a33a"/>
  <!-- caterer thought bubble: live dosa counter + honest pot -->
  <circle cx="200" cy="350" r="8" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="180" cy="330" r="11" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="24" y="190" width="300" height="124" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="44" y="262" width="120" height="34" fill="#b9ad98"/><rect x="50" y="254" width="70" height="8" rx="2" fill="#3d3a3a"/>
  <path d="M76 254 v-22 a16 16 0 0 1 32 0 v22 z" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/>
  <circle cx="92" cy="216" r="11" fill="#b07850"/><rect x="82" y="196" width="20" height="10" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/>
  <ellipse cx="86" cy="254" rx="22" ry="4" fill="#d99a3a"/>
  <path d="M70 246 q4 -8 0 -16 M100 244 q4 -8 0 -16" stroke="#e3dccd" stroke-width="3" fill="none" stroke-linecap="round"/>
  <g><circle cx="140" cy="230" r="9" fill="#d9a27a"/><path d="M130 262 a10 22 0 0 1 20 0 z" fill="#7a4e7e"/><circle cx="162" cy="232" r="9" fill="#c98a5e"/><path d="M152 262 a10 20 0 0 1 20 0 z" fill="#1f6f78"/></g>
  <path d="M136 232 q4 3 8 0 M158 234 q4 3 8 0" stroke="#2b2b2b" stroke-width="2" fill="none"/>
  <path d="M220 296 v-50 h76 v50 z" fill="#9a9590"/><ellipse cx="258" cy="246" rx="38" ry="8" fill="#e0a33a"/><path d="M214 258 h-8 M302 258 h8" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/>
  <text x="258" y="284" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">300</text>
  <!-- caterer seated, leaning forward with notebook -->
  <path d="M150 440 v120 M240 500 v60" stroke="#6b5446" stroke-width="6"/><rect x="140" y="490" width="110" height="12" rx="4" fill="#8a6d5a"/><rect x="140" y="400" width="14" height="96" rx="4" fill="#8a6d5a"/>
  <g transform="translate(200 494) rotate(8)"><use href="#s" color="#3d78b0"/>
    <path d="M-18 -100 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    <path d="M-6 -86 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -50 l30 10" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <rect x="246" y="412" width="54" height="66" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-12 273 445)"/>
  <text x="270" y="444" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b" transform="rotate(-12 273 445)">500</text>
  <path d="M264 456 q8 -14 16 0 q-8 6 -16 0 z" fill="#3f9a5a" transform="rotate(-12 273 445)"/>
  <!-- table with brochure -->
  <rect x="330" y="500" width="170" height="10" rx="3" fill="#b9c8cc"/><path d="M344 510 v50 M486 510 v50" stroke="#9a9590" stroke-width="5"/>
  <rect x="350" y="490" width="40" height="10" fill="#e07a5f"/><rect x="396" y="490" width="40" height="10" fill="#1f6f78"/><rect x="442" y="490" width="40" height="10" fill="#e0a33a"/>
  <!-- sofa -->
  <rect x="540" y="400" width="360" height="100" rx="20" fill="#7a4e7e"/><rect x="530" y="470" width="380" height="60" rx="16" fill="#8d5f91"/><path d="M548 530 v30 M892 530 v30" stroke="#6b5446" stroke-width="8"/>
  <!-- father leaning in -->
  <g transform="translate(610 488) rotate(-8)"><use href="#s" color="#ffffff"/>
    <path d="M-18 -100 a18 18 0 0 1 36 0 q-18 -4 -36 0 z" fill="#8f8a85"/>
    <path d="M-12 -86 q12 6 24 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
    <path d="M-22 -50 l-14 34 M22 -50 l-6 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- mother red sari -->
  <g transform="translate(720 488)"><use href="#s" color="#c0392b"/>
    <path d="M-22 -56 L22 -14" stroke="#e0a33a" stroke-width="7"/>
    <path d="M-18 -98 a18 18 0 0 1 36 0 q-18 -8 -36 0 z" fill="#2e2a2a"/><circle cx="0" cy="-114" r="7" fill="#2e2a2a"/>
    <path d="M-6 -86 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
  <!-- bride pink -->
  <g transform="translate(828 488) scale(.95)"><use href="#s" color="#e58fae"/>
    <path d="M-18 -98 a18 18 0 0 1 36 0 q-18 -8 -36 0 z" fill="#2e2a2a"/><path d="M16 -100 q10 30 0 56" stroke="#2e2a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-6 -86 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/></g>
</svg>
