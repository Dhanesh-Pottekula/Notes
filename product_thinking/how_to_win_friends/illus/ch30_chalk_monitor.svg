<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Before and after: a boy throws chalk in class, then as monitor guards the chalk box and scolds a classmate for wasting chalk</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="kid">
      <ellipse cx="0" cy="2" rx="22" ry="5" fill="#000" opacity=".08"/>
      <rect x="-14" y="-50" width="11" height="50" rx="5" fill="#c98a5e"/><rect x="3" y="-50" width="11" height="50" rx="5" fill="#c98a5e"/>
      <rect x="-18" y="-64" width="36" height="22" rx="4" fill="#2f3f6b"/>
      <path d="M-20 -60 v-30 a20 20 0 0 1 40 0 v30 z" fill="#ffffff"/>
      <circle cx="0" cy="-120" r="16" fill="#c98a5e"/><path d="M-16 -122 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
    </g>
    <g id="bench"><rect x="-60" y="-50" width="120" height="12" rx="3" fill="#8a6d5a"/><path d="M-50 -38 v38 M50 -38 v38" stroke="#6b5446" stroke-width="8"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BEFORE</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">MONITOR</text>
  <!-- palms in windows -->
  <rect x="380" y="110" width="80" height="110" fill="#dcebe6"/><path d="M420 220 v-60 M420 160 q-24 -10 -34 4 M420 160 q24 -10 34 4 M420 160 q-8 -24 -26 -26 M420 160 q8 -24 26 -26" stroke="#3f9a5a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- LEFT board -->
  <rect x="40" y="110" width="320" height="150" rx="4" fill="#2f5a4a"/><rect x="40" y="260" width="320" height="10" fill="#8a6d5a"/>
  <path d="M70 150 h120 M70 180 h170 M70 210 h90" stroke="#e8f0ea" stroke-width="4" opacity=".7" stroke-linecap="round"/>
  <!-- teacher frowning -->
  <g transform="translate(90 560)"><use href="#m" color="#f3e3b0"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#f3e3b0"/><path d="M-30 -6 H30" stroke="#e0a33a" stroke-width="6"/><path d="M22 -116 L-22 -66" stroke="#e0a33a" stroke-width="8"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="-16" cy="-166" r="8" fill="#2e2a2a"/>
    <path d="M-8 -154 l6 3 M8 -154 l-6 3" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -136 q6 -5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-14 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M22 -104 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- boy on bench throwing -->
  <use href="#bench" transform="translate(250 560)"/>
  <g transform="translate(250 512)"><use href="#kid"/>
    <path d="M-6 -122 q6 5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" transform="translate(0 6)"/>
    <circle cx="-6" cy="-122" r="2" fill="#2e2a2a"/><circle cx="6" cy="-122" r="2" fill="#2e2a2a"/>
    <path d="M18 -84 l26 -40" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><path d="M-18 -84 l-20 20" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/></g>
  <!-- flying chalk -->
  <path d="M300 380 C340 300 380 320 400 380" stroke="#9a9590" stroke-width="3" fill="none" stroke-dasharray="6 6"/>
  <rect x="396" y="378" width="18" height="7" rx="2" fill="#ffffff" stroke="#b9ad98" transform="rotate(30 405 381)"/>
  <!-- ducking student -->
  <use href="#bench" transform="translate(410 560)"/>
  <g transform="translate(414 512) rotate(14)"><use href="#kid"/>
    <path d="M-16 -96 l-8 -32 l10 -6 M16 -96 l8 -32 l-10 -6" stroke="#c98a5e" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>

  <!-- RIGHT board -->
  <rect x="520" y="110" width="400" height="150" rx="4" fill="#2f5a4a"/><rect x="520" y="260" width="400" height="10" fill="#8a6d5a"/>
  <!-- teacher smiling -->
  <g transform="translate(890 560) scale(.95)"><use href="#m" color="#f3e3b0"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#f3e3b0"/><path d="M-30 -6 H30" stroke="#e0a33a" stroke-width="6"/><path d="M-22 -116 L22 -66" stroke="#e0a33a" stroke-width="8"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="16" cy="-166" r="8" fill="#2e2a2a"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-4 40 M22 -104 l4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- monitor boy with chalk box -->
  <g transform="translate(640 560) scale(1.15)"><use href="#kid"/>
    <path d="M-6 -152 l6 2 M6 -152 l-6 2" stroke="#2e2a2a" stroke-width="2" transform="translate(0 32)"/>
    <path d="M-5 -110 h10" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M-4 -96 l4 -4 l4 4 l-4 4 z" fill="#e0a33a"/>
    <path d="M-18 -84 l-6 26" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
    <rect x="-46" y="-66" width="40" height="24" rx="3" fill="#8a6d5a"/><g fill="#fff"><rect x="-42" y="-74" width="6" height="12"/><rect x="-33" y="-76" width="6" height="14"/><rect x="-24" y="-74" width="6" height="12"/></g>
    <path d="M18 -84 l34 -10 l4 -20" stroke="#c98a5e" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
  <!-- classmate who dropped chalk -->
  <g transform="translate(770 560)"><use href="#kid"/>
    <path d="M-6 -112 q6 -4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-18 -84 l-10 30 M18 -84 l10 30" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/></g>
  <g fill="#fff" stroke="#b9ad98"><rect x="718" y="554" width="12" height="6" rx="2"/><rect x="734" y="556" width="9" height="6" rx="2" transform="rotate(25 738 559)"/></g>
  <!-- same energy, redirected -->
  <path d="M414 360 C470 280 560 330 586 470" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
</svg>
