<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cricket coach quietly encourages a young batsman at the nets, with nine stepping stones leading to a district team cap</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="st"><ellipse cx="0" cy="0" rx="28" ry="11" fill="#b9ad98"/><ellipse cx="0" cy="-3" rx="28" ry="10" fill="#cbbfa9"/></g>
    <pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 0 L16 16 M16 0 L0 16" stroke="#9a9590" stroke-width="1" opacity=".6"/></pattern>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="480" width="960" height="160" fill="#a9c79a"/>
  <rect y="480" width="960" height="6" fill="#93b585" opacity=".6"/>
  <!-- low sun -->
  <circle cx="120" cy="150" r="46" fill="#e0a33a" opacity=".35"/>
  <!-- net tunnel -->
  <path d="M430 480 V230 H780 V480" fill="url(#net)" stroke="#6b5446" stroke-width="5"/>
  <path d="M430 230 L470 200 H820 L780 230 M820 200 V450 L780 480" fill="none" stroke="#6b5446" stroke-width="4"/>
  <rect x="440" y="440" width="330" height="40" fill="#d8cdb8" opacity=".8"/>
  <g stroke="#f3ede0" stroke-width="4"><path d="M470 478 v-44 M478 478 v-44 M486 478 v-44"/></g>
  <!-- short ball and sway -->
  <path d="M760 300 L600 466 L500 320" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="8 7"/>
  <circle cx="500" cy="318" r="9" fill="#c0392b"/>
  <path d="M490 360 q-30 -10 -40 20" stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#ah)"/>
  <!-- senior players far away -->
  <g transform="translate(48 476) scale(.42)"><use href="#m" color="#ffffff"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/></g>
  <g transform="translate(84 478) scale(.42)"><use href="#m" color="#ffffff"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/></g>
  <!-- young batsman -->
  <g transform="translate(180 560) scale(1.1)"><use href="#m" color="#ffffff"/>
    <rect x="-18" y="-62" width="16" height="56" rx="5" fill="#f3ede0" stroke="#cbbfa9" stroke-width="1.5"/><rect x="2" y="-62" width="16" height="56" rx="5" fill="#f3ede0" stroke="#cbbfa9" stroke-width="1.5"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="-6" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M-5 -137 q5 3 10 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-10 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-34" cy="-66" r="17" fill="#2f3f6b"/><path d="M-50 -66 h32" stroke="#9a9590" stroke-width="3"/>
    <path d="M22 -104 l8 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="26" y="-82" width="10" height="70" rx="3" fill="#d9b98a" transform="rotate(-8 30 -76)"/></g>
  <!-- coach -->
  <g transform="translate(300 560) scale(1.12)"><use href="#m" color="#1f6f78"/>
    <path d="M-24 -96 h48 M-2 -124 v62" stroke="#f3ede0" stroke-width="3"/>
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#185a61"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#185a61"/>
    <path d="M-20 -156 a20 18 0 0 1 40 0 z" fill="#2f3f6b"/><path d="M-22 -158 h-16 v6 h16 z" fill="#2f3f6b"/>
    <path d="M-16 -142 q0 22 16 22 q16 0 16 -22 q-8 8 -16 8 q-8 0 -16 -8 z" fill="#8f8a85" opacity=".7"/>
    <circle cx="-7" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="5" cy="-148" r="2.5" fill="#2e2a2a"/>
    <path d="M-7 -134 q7 5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-60 -6" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l26 -26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M44 -138 v-14 M54 -136 v-14" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/></g>
  <!-- tiny-change gap mark -->
  <path d="M352 380 h12" stroke="#7a4e7e" stroke-width="2"/><path d="M350 374 v12 M366 374 v12" stroke="#7a4e7e" stroke-width="2"/>
  <!-- thumbs-up bubble -->
  <rect x="236" y="250" width="70" height="60" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M286 308 l10 22 l2 -24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M286 306 h12" stroke="#fff" stroke-width="5"/>
  <path d="M256 298 v-20 h8 l6 -14 q6 0 4 10 h12 q6 0 4 8 l-4 14 q-2 4 -8 4 z" fill="#e0a33a"/><rect x="248" y="278" width="8" height="22" rx="2" fill="#e0a33a"/>
  <!-- nine stepping stones -->
  <g>
    <use href="#st" transform="translate(110 606)"/><use href="#st" transform="translate(190 618)"/><use href="#st" transform="translate(270 624)"/>
    <use href="#st" transform="translate(350 620)"/><use href="#st" transform="translate(430 612)"/><use href="#st" transform="translate(510 604)"/>
    <use href="#st" transform="translate(590 598)"/><use href="#st" transform="translate(670 594)"/><use href="#st" transform="translate(750 590)"/>
  </g>
  <g font-size="16" font-weight="800" fill="#2b2b2b" text-anchor="middle">
    <text x="110" y="609">1</text><text x="190" y="621">2</text><text x="270" y="627">3</text><text x="350" y="623">4</text><text x="430" y="615">5</text>
    <text x="510" y="607">6</text><text x="590" y="601">7</text><text x="670" y="597">8</text><text x="750" y="593">9</text>
  </g>
  <!-- pedestal with cap -->
  <ellipse cx="860" cy="604" rx="56" ry="10" fill="#000" opacity=".08"/>
  <rect x="816" y="520" width="88" height="84" fill="#cbbfa9"/><rect x="806" y="510" width="108" height="14" rx="3" fill="#b9ad98"/>
  <path d="M826 508 a34 28 0 0 1 68 0 z" fill="#2f3f6b"/><path d="M890 508 h30 q4 6 -4 8 h-26 z" fill="#2f3f6b"/>
  <path d="M860 482 v-8" stroke="#e0a33a" stroke-width="4"/><circle cx="860" cy="496" r="5" fill="#e0a33a"/>
  <path d="M800 470 l-8 -10 M920 470 l8 -10 M860 456 v-12" stroke="#e0a33a" stroke-width="4" stroke-linecap="round"/>
  <text x="812" y="420" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">DISTRICT TEAM</text>
</svg>
