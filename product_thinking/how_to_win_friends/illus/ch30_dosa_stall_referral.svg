<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A dosa stall owner apologetically declines a bulk Sunday order and hands over a card for another stall two streets away</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="dosa"><path d="M-40 0 a40 10 0 0 0 80 0 z" fill="#d99a3a"/><path d="M-34 -2 q34 -10 68 0" stroke="#b8862a" stroke-width="2" fill="none"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="320" y="72" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NOT TODAY</text>
  <!-- main stall -->
  <path d="M110 380 V200 M530 380 V200" stroke="#6b5446" stroke-width="8"/>
  <path d="M90 110 h460 l-20 80 h-420 z" fill="#e07a5f"/>
  <g fill="#fff" opacity=".75"><path d="M150 110 h40 l-6 80 h-40 z"/><path d="M250 110 h40 l-2 80 h-40 z"/><path d="M350 110 h40 l2 80 h-40 z"/><path d="M450 110 h40 l6 80 h-40 z"/></g>
  <path d="M110 190 q26 22 52 0 q26 22 52 0 q26 22 52 0 q26 22 52 0 q26 22 52 0 q26 22 52 0 q26 22 52 0 q26 22 52 0" fill="#e07a5f"/>
  <!-- owner behind counter -->
  <g transform="translate(330 480) scale(1.1)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-12 -138 q6 -5 12 -1 q6 -4 12 1 q-6 4 -12 1 q-6 3 -12 -1 z" fill="#2e2a2a"/>
    <path d="M-7 -130 q7 5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-8 -152 q3 -3 6 0 M2 -152 q3 -3 6 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <path d="M-22 -104 l14 22 l14 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l133 2" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- counter -->
  <rect x="100" y="380" width="440" height="16" rx="3" fill="#9a9590"/><rect x="112" y="396" width="416" height="164" fill="#b9ad98"/>
  <path d="M112 450 h416" stroke="#a89c86" stroke-width="3"/>
  <!-- griddle -->
  <rect x="128" y="366" width="170" height="14" rx="3" fill="#3d3a3a"/>
  <use href="#dosa" transform="translate(170 366) scale(.55)"/><use href="#dosa" transform="translate(240 366) scale(.55)"/>
  <path d="M170 350 q6 -14 0 -28 M230 350 q6 -14 0 -28 M270 352 q6 -14 0 -28" stroke="#e3dccd" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- chutney -->
  <path d="M350 380 v-36 h50 v36 z" fill="#b8bec2"/><ellipse cx="375" cy="344" rx="25" ry="6" fill="#eef3df"/>
  <!-- card handed over -->
  <rect x="488" y="350" width="44" height="28" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-8 510 364)"/>
  <path d="M496 362 h24 M496 370 h16" stroke="#b9ad98" stroke-width="3" transform="rotate(-8 510 364)"/>
  <!-- customer -->
  <g transform="translate(600 590) scale(1.05)"><use href="#m" color="#b49ad6"/>
    <path d="M-24 -60 h48 v30 h-48 z" fill="#b49ad6"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><path d="M-19 -150 q-6 30 4 48" stroke="#2e2a2a" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-10 -124 l10 40 l10 -40" stroke="#1f6f78" stroke-width="3" fill="none"/><rect x="-6" y="-88" width="12" height="16" fill="#fff"/>
    <path d="M-22 -104 l-69 -100" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/>
    <path d="M22 -104 l8 36" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/><rect x="24" y="-74" width="14" height="24" rx="3" fill="#3d3a3a"/></g>
  <!-- thought bubble -->
  <circle cx="650" cy="380" r="7" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><circle cx="666" cy="356" r="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <rect x="620" y="220" width="170" height="110" rx="24" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <use href="#dosa" transform="translate(674 300) scale(.8)"/><use href="#dosa" transform="translate(674 288) scale(.8)"/><use href="#dosa" transform="translate(674 276) scale(.8)"/><use href="#dosa" transform="translate(674 264) scale(.8)"/>
  <rect x="722" y="244" width="52" height="60" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="722" y="244" width="52" height="15" rx="4" fill="#e07a5f"/>
  <text x="748" y="292" text-anchor="middle" font-size="19" font-weight="800" fill="#2b2b2b">SUN</text>
  <!-- route to second stall -->
  <path d="M530 344 C560 140 700 150 790 170 H860 V330" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <!-- second stall -->
  <text x="852" y="118" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRY HIM</text>
  <path d="M790 470 V380 M914 470 V380" stroke="#6b5446" stroke-width="6"/>
  <path d="M776 340 h152 l-10 44 h-132 z" fill="#1f6f78"/><path d="M806 340 h20 l-3 44 h-20 z M866 340 h20 l3 44 h-20 z" fill="#fff" opacity=".5"/>
  <rect x="784" y="470" width="136" height="10" rx="3" fill="#9a9590"/><rect x="792" y="480" width="120" height="80" fill="#b9ad98"/>
  <rect x="806" y="460" width="70" height="10" rx="3" fill="#3d3a3a"/><use href="#dosa" transform="translate(840 460) scale(.45)"/>
  <circle cx="900" cy="444" r="14" fill="#3f9a5a"/><path d="M893 444 l5 5 l9 -10" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
</svg>
