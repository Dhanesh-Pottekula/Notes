<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A boy paid per folded basket pulls clean shirts off hangers to fold them again while his mother watches in dismay</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="fs"><rect x="-34" y="-12" width="68" height="12" rx="3" fill="currentColor"/><path d="M-10 -12 l10 6 l10 -6" stroke="#fff" stroke-width="2" fill="none" opacity=".6"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <text x="180" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">PAID PER BASKET</text>
  <!-- window -->
  <rect x="330" y="110" width="150" height="150" fill="#dcebe6"/><path d="M405 110 v150 M330 185 h150" stroke="#fff" stroke-width="6"/>
  <path d="M320 104 h40 v170 h-40 z M450 104 h40 v170 h-40 z" fill="#3f9a5a" opacity=".8"/>
  <!-- ceiling fan -->
  <path d="M600 0 v34" stroke="#3d3a3a" stroke-width="4"/><ellipse cx="600" cy="40" rx="90" ry="7" fill="#b9ad98"/><circle cx="600" cy="40" r="10" fill="#3d3a3a"/>
  <!-- note card -->
  <rect x="120" y="120" width="120" height="80" rx="4" fill="#fff" stroke="#cbbfa9" stroke-width="2" transform="rotate(-3 180 160)"/>
  <text x="180" y="172" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" transform="rotate(-3 180 160)">+10 / -2</text>
  <!-- basket of folded shirts -->
  <path d="M90 560 l-10 -110 h200 l-10 110 z" fill="#1f6f78"/><path d="M84 470 h192 M88 500 h184 M92 530 h176" stroke="#185a61" stroke-width="3"/>
  <use href="#fs" transform="translate(180 450)" color="#e07a5f"/><use href="#fs" transform="translate(180 438)" color="#ffffff"/><use href="#fs" transform="translate(180 426)" color="#e0a33a"/><use href="#fs" transform="translate(180 414)" color="#7a4e7e"/><use href="#fs" transform="translate(180 402)" color="#5b9bd5"/>
  <!-- coin bowl -->
  <ellipse cx="320" cy="556" rx="38" ry="8" fill="#000" opacity=".08"/><path d="M286 530 h68 a34 24 0 0 1 -68 0 z" fill="#b8bec2"/>
  <g fill="#e0a33a"><circle cx="306" cy="526" r="9"/><circle cx="322" cy="522" r="9"/><circle cx="338" cy="527" r="9"/></g>
  <!-- cupboard -->
  <rect x="470" y="200" width="230" height="360" fill="#8a6d5a"/><rect x="480" y="210" width="210" height="340" fill="#f0e7d6"/>
  <path d="M480 240 H690" stroke="#6b5446" stroke-width="5"/>
  <g stroke="#3d3a3a" stroke-width="2.5" fill="none"><path d="M520 240 v8 l-22 14 h44 z"/><path d="M590 240 v8 l-22 14 h44 z"/><path d="M650 240 v8 l-22 14 h44 z"/></g>
  <path d="M500 262 h40 v90 h-40 z" fill="#5b9bd5"/><path d="M630 262 h40 v90 h-40 z" fill="#ffffff" stroke="#cbbfa9"/>
  <rect x="480" y="420" width="210" height="10" fill="#6b5446"/>
  <!-- crumpled shirts forgotten -->
  <path d="M500 548 q10 -24 30 -16 q14 -14 26 4 q14 2 6 14 z" fill="#d9a27a"/>
  <!-- door open -->
  <rect x="700" y="200" width="18" height="360" fill="#6b5446"/>
  <!-- boy pulling clean shirt -->
  <g transform="translate(450 584)"><use href="#m" color="#e0a33a"/>
    <rect x="-16" y="-62" width="13" height="30" rx="4" fill="#3d6b8a"/><rect x="3" y="-62" width="13" height="30" rx="4" fill="#3d6b8a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <circle cx="6" cy="-150" r="2.5" fill="#2e2a2a"/><path d="M0 -138 q6 3 10 -2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l56 -56" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l14 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="rotate(-14 530 420)"><path d="M530 404 v-10 a6 6 0 1 1 6 -6" stroke="#3d3a3a" stroke-width="2.5" fill="none"/><path d="M530 404 l-24 14 h48 z" stroke="#3d3a3a" stroke-width="2.5" fill="none"/><path d="M508 418 h44 v86 h-44 z" fill="#ffffff" stroke="#cbbfa9"/></g>
  <!-- refolded pile at feet -->
  <use href="#fs" transform="translate(370 576) scale(.8)" color="#ffffff"/><use href="#fs" transform="translate(370 566) scale(.8)" color="#5b9bd5"/><use href="#fs" transform="translate(370 556) scale(.8)" color="#ffffff"/>
  <!-- loop arrow -->
  <path d="M590 230 C560 130 380 180 380 500" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="10 8" marker-end="url(#ah)"/>
  <path d="M340 572 C330 600 300 590 312 552" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#ah)"/>
  <!-- mother in doorway -->
  <g transform="translate(820 590) scale(1.08)"><use href="#m" color="#5b9bd5"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#5b9bd5"/><path d="M-22 -116 L22 -66" stroke="#3d78b0" stroke-width="10"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><path d="M14 -150 q12 30 4 64" stroke="#2e2a2a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M-10 -158 q4 -4 8 0 M2 -158 q4 -4 8 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
    <circle cx="-6" cy="-148" r="2.5" fill="#2e2a2a"/><circle cx="6" cy="-148" r="2.5" fill="#2e2a2a"/>
    <ellipse cx="0" cy="-135" rx="5" ry="4" fill="#2e2a2a"/>
    <path d="M-22 -104 l-14 30 l14 10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 q14 -30 -8 -54" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/></g>
  <circle cx="880" cy="380" r="22" fill="#e07a5f"/><text x="880" y="392" text-anchor="middle" font-size="32" font-weight="800" fill="#fff">!</text>
</svg>
