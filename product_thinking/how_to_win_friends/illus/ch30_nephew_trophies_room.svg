<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Split picture: a teen rolls his eyes at an order to clean up; given his own reason, the trophies and the cousins, he sighs and tidies</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="tr"><rect x="-12" y="-6" width="24" height="6" fill="#6b5446"/><rect x="-3" y="-18" width="6" height="12" fill="#e0a33a"/><path d="M-12 -40 h24 v6 a12 14 0 0 1 -24 0 z" fill="#e0a33a"/></g>
    <g id="shelf"><rect x="0" y="0" width="150" height="8" fill="#8a6d5a"/><use href="#tr" transform="translate(30 0)"/><use href="#tr" transform="translate(75 0)"/><use href="#tr" transform="translate(120 0)"/></g>
    <g id="bed"><rect x="0" y="-60" width="230" height="40" rx="6" fill="#5b9bd5"/><rect x="0" y="-20" width="230" height="20" fill="#8a6d5a"/><rect x="-6" y="-110" width="16" height="110" rx="4" fill="#8a6d5a"/><rect x="14" y="-80" width="56" height="22" rx="10" fill="#fff"/></g>
    <g id="bat"><rect x="-8" y="-150" width="16" height="110" rx="6" fill="#d9b98a"/><rect x="-3" y="-190" width="6" height="42" fill="#3d3a3a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ORDER</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">HIS REASON</text>

  <!-- LEFT -->
  <use href="#shelf" transform="translate(250 230)"/>
  <path d="M262 226 q20 -40 50 -30 q30 -30 60 0 q30 -6 26 30 z" fill="#e07a5f"/><path d="M290 222 q16 -22 40 -14" stroke="#c4664e" stroke-width="4" fill="none"/>
  <use href="#bat" transform="translate(440 560) rotate(8)"/>
  <use href="#bed" transform="translate(200 560)"/>
  <path d="M300 500 q20 -24 46 -14 q22 -18 44 2 q14 4 4 12 z" fill="#3f9a5a"/><path d="M250 500 q10 -14 30 -8 l6 8 z" fill="#e0a33a"/>
  <!-- teen lying, rolling eyes, on phone -->
  <path d="M290 488 h120" stroke="#4a3f55" stroke-width="22" stroke-linecap="round"/>
  <path d="M230 494 q0 -30 40 -30 h50 v30 z" fill="#8a8f99"/>
  <circle cx="230" cy="466" r="18" fill="#c98a5e"/><path d="M212 464 a18 18 0 0 1 36 -4 z" fill="#2e2a2a"/>
  <circle cx="226" cy="462" r="3" fill="#2e2a2a"/><circle cx="236" cy="462" r="3" fill="#2e2a2a"/>
  <path d="M260 476 l20 -26" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><rect x="272" y="432" width="14" height="22" rx="3" fill="#3d3a3a"/>
  <circle cx="200" cy="420" r="20" fill="#e07a5f"/><path d="M192 412 l16 16 M208 412 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
  <!-- aunt stern, pointing -->
  <g transform="translate(90 580)"><use href="#m" color="#e0a33a"/>
    <path d="M-24 -60 h48 v26 h-48 z" fill="#e0a33a"/><path d="M-22 -116 L22 -72" stroke="#c0392b" stroke-width="7"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-166" r="8" fill="#2e2a2a"/>
    <path d="M-8 -154 l6 3 M8 -154 l-6 3" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -134 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -104 l60 -14" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>

  <!-- RIGHT -->
  <use href="#shelf" transform="translate(730 230)"/>
  <circle cx="805" cy="170" r="30" fill="#e0a33a" opacity=".18"/>
  <use href="#bat" transform="translate(920 560) rotate(8)"/>
  <use href="#bed" transform="translate(680 560)"/>
  <path d="M780 500 q10 -12 26 -8 l4 8 z" fill="#3f9a5a"/>
  <!-- inset: cousins + Sunday match -->
  <rect x="500" y="110" width="200" height="110" rx="20" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M640 218 l16 30 l8 -32" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M642 216 h20" stroke="#fff" stroke-width="5"/>
  <circle cx="530" cy="160" r="10" fill="#d9a27a"/><path d="M520 154 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/><path d="M518 200 a12 20 0 0 1 24 0 z" fill="#e07a5f"/>
  <circle cx="562" cy="164" r="9" fill="#b07850"/><path d="M553 158 a9 9 0 0 1 18 0 z" fill="#2e2a2a"/><path d="M552 200 a10 18 0 0 1 20 0 z" fill="#1f6f78"/>
  <use href="#tr" transform="translate(546 152) scale(.6)"/>
  <rect x="600" y="128" width="78" height="66" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="600" y="128" width="78" height="16" rx="4" fill="#e07a5f"/>
  <text x="626" y="180" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">SUN</text><circle cx="660" cy="174" r="9" fill="#c0392b"/>
  <!-- calm adult sitting on desk -->
  <rect x="500" y="440" width="110" height="12" rx="3" fill="#8a6d5a"/><path d="M510 452 v108 M600 452 v108" stroke="#6b5446" stroke-width="6"/>
  <g transform="translate(560 440)">
    <rect x="-18" y="-6" width="13" height="56" rx="6" fill="#4a3f55"/><rect x="5" y="-6" width="13" height="56" rx="6" fill="#4a3f55"/>
    <path d="M-24 0 v-42 a24 24 0 0 1 48 0 v42 z" fill="#e0a33a"/><path d="M-22 -54 L22 -10" stroke="#c0392b" stroke-width="7"/>
    <rect x="-6" y="-74" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-88" r="19" fill="#c98a5e"/>
    <path d="M-19 -90 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-106" r="8" fill="#2e2a2a"/>
    <path d="M-7 -76 q7 5 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -44 l60 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -44 l-4 36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- teen carrying clothes, sighing -->
  <g transform="translate(860 590) scale(1.05)"><use href="#m" color="#8a8f99"/>
    <rect x="-16" y="-62" width="13" height="30" rx="4" fill="#4a3f55"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-10 -148 h7 M3 -148 h7" stroke="#2e2a2a" stroke-width="2.5"/>
    <ellipse cx="2" cy="-134" rx="7" ry="5" fill="#d9a27a"/>
    <path d="M-34 -96 q30 -24 64 -6 q8 14 -6 22 q-30 10 -58 -2 q-10 -6 0 -14 z" fill="#3f9a5a"/><path d="M-24 -96 q20 -10 40 0" stroke="#e07a5f" stroke-width="8" fill="none"/>
    <path d="M-22 -104 l-12 20 M22 -104 l10 20" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <path d="M884 420 q10 -8 20 -2 q10 6 20 -2" stroke="#9a9590" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
