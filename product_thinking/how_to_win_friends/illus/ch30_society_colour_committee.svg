<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Split picture: a repaint plan announced on a phone is voted down; next year the former critic leads it and residents vote yes</title>
  <defs>
    <g id="m">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    </g>
    <g id="bld">
      <rect x="0" y="0" width="190" height="270" fill="#e9dcc4"/><rect x="-8" y="-10" width="206" height="14" fill="#cbbfa9"/>
      <g fill="#b9ad98"><rect x="20" y="24" width="40" height="34"/><rect x="130" y="24" width="40" height="34"/><rect x="20" y="88" width="40" height="34"/><rect x="130" y="88" width="40" height="34"/><rect x="20" y="152" width="40" height="34"/><rect x="130" y="152" width="40" height="34"/></g>
      <g fill="#8a6d5a"><rect x="14" y="58" width="52" height="6"/><rect x="124" y="58" width="52" height="6"/><rect x="14" y="122" width="52" height="6"/><rect x="124" y="122" width="52" height="6"/><rect x="14" y="186" width="52" height="6"/><rect x="124" y="186" width="52" height="6"/></g>
      <rect x="76" y="200" width="38" height="70" fill="#6b5446"/>
      <g fill="#3f9a5a"><circle cx="26" cy="52" r="6"/><circle cx="164" cy="116" r="6"/></g>
    </g>
    <g id="sw"><rect x="-14" y="-24" width="28" height="48" rx="3" fill="#fff" stroke="#cbbfa9" stroke-width="1.5"/><rect x="-10" y="-20" width="20" height="12" fill="#1f6f78"/><rect x="-10" y="-6" width="20" height="12" fill="#e0a33a"/><rect x="-10" y="8" width="20" height="12" fill="#e07a5f"/></g>
    <g id="box"><rect x="-28" y="-56" width="56" height="56" rx="4" fill="#8a6d5a"/><rect x="-14" y="-58" width="28" height="6" fill="#3d3a3a"/><rect x="-8" y="-72" width="16" height="18" fill="#fff" transform="rotate(8)"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 24 V616" stroke="#d8cdb8" stroke-width="3"/>
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANNOUNCED</text>
  <text x="720" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">INVITED</text>

  <!-- LEFT -->
  <use href="#bld" transform="translate(150 150)"/>
  <!-- secretary with phone -->
  <g transform="translate(90 590) scale(.95)"><use href="#m" color="#ffffff"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-6 -136 h12" stroke="#2e2a2a" stroke-width="2.5"/>
    <path d="M22 -104 l18 -22" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <rect x="34" y="-152" width="18" height="30" rx="3" fill="#3d3a3a"/><rect x="37" y="-148" width="12" height="20" fill="#9fd3d8"/>
    <path d="M-22 -104 l-4 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- announcement bubble -->
  <rect x="40" y="240" width="96" height="70" rx="16" fill="#fff" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M110 308 l14 28 l-2 -30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M108 306 h14" stroke="#fff" stroke-width="5"/>
  <use href="#sw" transform="translate(68 275) scale(.9)"/>
  <path d="M90 262 l16 -8 v42 l-16 -8 z" fill="#e0a33a"/><rect x="84" y="266" width="8" height="18" fill="#e0a33a"/>
  <!-- protesters -->
  <g transform="translate(300 600) scale(.9)"><use href="#m" color="#7a4e7e"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#7a4e7e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <path d="M-8 -144 l6 3 M8 -144 l-6 3" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -132 q6 -5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-12 -48 M22 -104 l12 -48" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(372 600) scale(.95)"><use href="#m" color="#e8e4de"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -4 -38 0 z" fill="#d8d3cc"/>
    <path d="M-8 -144 l6 3 M8 -144 l-6 3" stroke="#2e2a2a" stroke-width="2.5"/><path d="M-6 -132 q6 -5 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M-22 -104 l-30 -36 M22 -104 l8 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#box" transform="translate(436 560)"/>
  <circle cx="436" cy="440" r="22" fill="#e07a5f"/><path d="M426 430 l20 20 M446 430 l-20 20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>

  <!-- RIGHT -->
  <use href="#bld" transform="translate(640 150)"/>
  <rect x="640" y="285" width="190" height="135" fill="#1f6f78" opacity=".55"/>
  <rect x="660" y="302" width="40" height="34" fill="#b9ad98"/><rect x="770" y="302" width="40" height="34" fill="#b9ad98"/>
  <rect x="716" y="350" width="38" height="70" fill="#6b5446"/>
  <!-- ladder and roller -->
  <path d="M846 560 L816 270 M880 560 L850 270" stroke="#8a6d5a" stroke-width="6"/>
  <path d="M842 520 h34 M838 480 h34 M834 440 h34 M830 400 h34 M826 360 h34 M822 320 h34" stroke="#8a6d5a" stroke-width="5"/>
  <rect x="808" y="250" width="40" height="14" rx="6" fill="#1f6f78"/><path d="M828 264 v18" stroke="#3d3a3a" stroke-width="4"/>
  <!-- former critic leading -->
  <g transform="translate(570 600) scale(1.02)"><use href="#m" color="#1f6f78"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 q-19 -4 -38 0 z" fill="#d8d3cc"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l50 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-14 34" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#sw" transform="translate(532 528) rotate(-10)"/>
  <!-- voters yes -->
  <g transform="translate(690 610) scale(.88)"><use href="#m" color="#7a4e7e"/>
    <path d="M-26 -62 L-30 0 H30 L26 -62 z" fill="#7a4e7e"/>
    <path d="M-19 -150 a19 19 0 0 1 38 0 q-19 -8 -38 0 z" fill="#2e2a2a"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l8 -54" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(770 610) scale(.9)"><use href="#m" color="#e0a33a"/>
    <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-7 -136 q7 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M22 -104 l8 -54" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-4 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#box" transform="translate(912 560)"/>
  <circle cx="912" cy="440" r="22" fill="#3f9a5a"/><path d="M901 440 l8 8 l14 -15" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
</svg>
