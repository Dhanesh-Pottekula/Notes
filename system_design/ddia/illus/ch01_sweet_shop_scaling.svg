<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Scale up versus scale out in a sweet shop kitchen</title>
  <defs>
    <!-- a halwai, feet at 0,0; vest colour comes from the use element's color -->
    <g id="cook">
      <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
      <rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/>
      <path d="M-26 -112 l-14 34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
      <path d="M26 -112 l22 22" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
      <rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="20" fill="#c98a5e"/>
      <path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/>
      <rect x="-21" y="-162" width="42" height="7" rx="3.5" fill="#e07a5f"/>
    </g>
    <g id="minikadhai">
      <path d="M-34 0 q34 30 68 0 z" fill="#3d3a3a"/>
      <ellipse cx="0" cy="0" rx="34" ry="6" fill="#e0a33a"/>
      <rect x="-26" y="16" width="52" height="10" rx="3" fill="#6b5446"/>
      <path d="M-6 -10 q-6 -10 0 -18 M6 -12 q6 -10 0 -18" stroke="#b9ad98" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>

  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: one giant kadhai pressing on the ceiling -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCALE UP</text>
  <rect x="24" y="96" width="432" height="14" fill="#cbbfa9"/>
  <path d="M40 110 l14 12 M90 110 l14 12 M140 110 l14 12 M190 110 l14 12 M240 110 l14 12 M290 110 l14 12 M340 110 l14 12 M390 110 l14 12" stroke="#b5a88f" stroke-width="3"/>
  <!-- steam already touching the ceiling -->
  <path d="M250 300 q-26 -40 0 -80 q26 -40 0 -100 M300 300 q-24 -50 4 -90 q24 -40 -4 -88 M350 305 q-20 -40 6 -80 q20 -45 -6 -100" stroke="#cfc4b0" stroke-width="10" fill="none" stroke-linecap="round" opacity=".9"/>
  <!-- price bubble -->
  <path d="M376 150 h76 a14 14 0 0 1 14 14 v50 a14 14 0 0 1 -14 14 h-40 l-14 18 l-4 -18 h-18 a14 14 0 0 1 -14 -14 v-50 a14 14 0 0 1 14 -14 z" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <g fill="#e0a33a" stroke="#b7802a" stroke-width="2">
    <ellipse cx="414" cy="210" rx="22" ry="7"/><ellipse cx="414" cy="200" rx="22" ry="7"/><ellipse cx="414" cy="190" rx="22" ry="7"/><ellipse cx="414" cy="180" rx="22" ry="7"/><ellipse cx="414" cy="170" rx="22" ry="7"/>
  </g>
  <!-- giant kadhai on a stove -->
  <rect x="190" y="418" width="220" height="110" rx="10" fill="#6b5446"/>
  <rect x="215" y="470" width="170" height="18" rx="9" fill="#e07a5f" opacity=".85"/>
  <path d="M110 310 q190 230 380 0 z" fill="#3d3a3a"/>
  <path d="M96 304 q-20 -4 -22 14" stroke="#3d3a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M484 304 q20 -4 22 14" stroke="#3d3a3a" stroke-width="10" fill="none" stroke-linecap="round"/>
  <ellipse cx="300" cy="310" rx="190" ry="28" fill="#555"/>
  <ellipse cx="300" cy="310" rx="174" ry="20" fill="#e0a33a"/>
  <g fill="#f3c46b"><circle cx="240" cy="306" r="7"/><circle cx="300" cy="314" r="9"/><circle cx="352" cy="304" r="6"/><circle cx="398" cy="312" r="5"/></g>
  <!-- the superstar halwai with a long paddle -->
  <line x1="152" y1="470" x2="290" y2="300" stroke="#8a6d5a" stroke-width="9" stroke-linecap="round"/>
  <use href="#cook" transform="translate(84 600) scale(1.45)" color="#ffffff"/>
  <path d="M70 412 q14 14 28 0" stroke="#e0a33a" stroke-width="4" fill="none"/>

  <!-- RIGHT: many small kadhais sharing one recipe and one sugar sack -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCALE OUT</text>
  <path d="M500 100 q220 40 440 0" stroke="#7a4e7e" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="520" cy="105" r="7"/><circle cx="560" cy="112" r="7"/><circle cx="600" cy="117" r="7"/><circle cx="640" cy="120" r="7"/><circle cx="800" cy="120" r="7"/><circle cx="840" cy="117" r="7"/><circle cx="880" cy="112" r="7"/><circle cx="920" cy="105" r="7"/></g>
  <g fill="#e07a5f"><circle cx="540" cy="109" r="6"/><circle cx="580" cy="115" r="6"/><circle cx="620" cy="119" r="6"/><circle cx="820" cy="119" r="6"/><circle cx="860" cy="115" r="6"/><circle cx="900" cy="109" r="6"/></g>
  <!-- shared recipe card on the string -->
  <line x1="720" y1="121" x2="720" y2="140" stroke="#7a4e7e" stroke-width="2"/>
  <rect x="686" y="140" width="68" height="78" rx="6" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M698 160 h44 M698 174 h44 M698 188 h30 M698 202 h38" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <!-- row of ordinary halwais behind the counter -->
  <use href="#cook" transform="translate(560 470)" color="#1f6f78"/>
  <use href="#cook" transform="translate(650 470)" color="#7a4e7e"/>
  <use href="#cook" transform="translate(790 470)" color="#1f6f78"/>
  <use href="#cook" transform="translate(880 470)" color="#7a4e7e"/>
  <rect x="508" y="420" width="432" height="112" rx="10" fill="#8a6d5a"/>
  <rect x="508" y="420" width="432" height="16" rx="8" fill="#6b5446"/>
  <use href="#minikadhai" transform="translate(560 404)"/>
  <use href="#minikadhai" transform="translate(650 404)"/>
  <use href="#minikadhai" transform="translate(790 404)"/>
  <use href="#minikadhai" transform="translate(880 404)"/>
  <!-- one sugar sack everybody needs -->
  <path d="M686 600 q-14 -50 6 -82 h56 q20 32 6 82 z" fill="#efe6d2" stroke="#b9ad98" stroke-width="3"/>
  <path d="M694 520 q26 -14 52 0" stroke="#b9ad98" stroke-width="5" fill="none"/>
  <rect x="700" y="552" width="40" height="22" rx="4" fill="#e0a33a" opacity=".7"/>
  <path d="M600 470 q40 40 84 80" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M840 470 q-40 40 -84 80" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <circle cx="720" cy="470" r="20" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="720" y="479" text-anchor="middle" font-size="26" font-weight="800" fill="#e07a5f">?</text>
</svg>
