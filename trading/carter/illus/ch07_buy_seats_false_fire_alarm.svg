<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>False fire alarm: the crowd flees, a calm man buys the seats, then sells them back</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="ch"><rect x="-18" y="-40" width="38" height="8" rx="3" fill="#8a6d5a"/><rect x="-18" y="-82" width="8" height="82" rx="3" fill="#6b5446"/><rect x="14" y="-36" width="6" height="36" fill="#6b5446"/></g>
<g id="slip"><rect x="-12" y="-62" width="26" height="20" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><path d="M-5 -52 l5 5 l9 -10" stroke="#1f6f78" stroke-width="3" fill="none" stroke-linecap="round"/></g>
<g id="door"><rect x="0" y="0" width="70" height="150" rx="4" fill="#6b5446"/><rect x="8" y="8" width="54" height="142" fill="#8a6d5a"/><circle cx="54" cy="80" r="4" fill="#e0a33a"/><rect x="6" y="-30" width="58" height="20" rx="4" fill="#1f6f78"/></g>
</defs>
<!-- garland + chandeliers -->
<path d="M30 14 q225 34 450 0 q225 34 450 0" stroke="#e0a33a" stroke-width="7" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
<path d="M30 334 q225 34 450 0 q225 34 450 0" stroke="#e0a33a" stroke-width="7" fill="none" stroke-dasharray="2 10" stroke-linecap="round"/>
<line x1="30" y1="320" x2="930" y2="320" stroke="#d8cdb8" stroke-width="3"/>
<!-- TOP: panic -->
<text x="480" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PANIC GAP</text>
<rect x="24" y="296" width="912" height="8" fill="#d8cdb8"/>
<use href="#door" transform="translate(856 146)"/>
<!-- shouter with FIRE bubble -->
<g transform="translate(70 296) scale(.8)"><use href="#man" color="#7a4e7e"/><path d="M26 -112 l18 -40 M-26 -112 l-8 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M104 116 h96 a12 12 0 0 1 12 12 v34 a12 12 0 0 1 -12 12 h-66 l-18 16 l2 -16 h-14 a12 12 0 0 1 -12 -12 v-34 a12 12 0 0 1 12 -12 z" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
<text x="152" y="156" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">FIRE!</text>
<!-- harmless samosa pan bubble -->
<rect x="650" y="34" width="140" height="84" rx="14" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<path d="M676 84 q44 30 88 0 z" fill="#3d3a3a"/><ellipse cx="720" cy="84" rx="44" ry="6" fill="#e0a33a"/>
<path d="M700 80 l10 -14 l10 14 z M722 82 l10 -14 l10 14 z" fill="#d9a27a"/>
<path d="M704 62 q-6 -8 0 -16 M734 62 q6 -8 0 -16" stroke="#cbbfa9" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="660" cy="130" r="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="648" cy="146" r="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
<!-- knocked chairs -->
<use href="#ch" transform="translate(250 296) rotate(-78)"/>
<use href="#ch" transform="translate(560 296)"/>
<use href="#ch" transform="translate(600 296) rotate(70)"/>
<!-- calm buyer at little table -->
<g transform="translate(360 296) scale(.85)"><use href="#sit" color="#ffffff"/><path d="M22 -104 l38 26" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="-7" cy="-148" r="6" fill="none" stroke="#2b2b2b" stroke-width="2"/><circle cx="8" cy="-148" r="6" fill="none" stroke="#2b2b2b" stroke-width="2"/></g>
<rect x="400" y="230" width="90" height="10" rx="4" fill="#8a6d5a"/><rect x="438" y="240" width="12" height="56" fill="#6b5446"/>
<g fill="#fff" stroke="#b9ad98" stroke-width="2"><rect x="410" y="218" width="34" height="10" rx="2"/><rect x="412" y="208" width="34" height="10" rx="2"/><rect x="410" y="198" width="34" height="10" rx="2"/><rect x="413" y="188" width="34" height="10" rx="2"/></g>
<!-- runners toward the door -->
<g transform="translate(540 296) scale(.8) rotate(12)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-40 10 M26 -112 l30 -34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<rect x="500" y="196" width="26" height="16" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
<path d="M500 226 q-20 10 -40 4" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="6 5" marker-end="url(#aC)"/>
<g transform="translate(680 296) scale(.8) rotate(12)"><use href="#wom" color="#e07a5f"/><path d="M-20 -108 l-30 -30 M20 -108 l34 -24" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<g transform="translate(790 296) scale(.8) rotate(12)"><use href="#man" color="#1f6f78"/><path d="M-26 -112 l-36 -22 M26 -112 l36 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M600 280 h220" stroke="#e07a5f" stroke-width="5" fill="none" marker-end="url(#aC)"/>
<!-- BOTTOM: fill back -->
<text x="480" y="384" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">FILL BACK</text>
<rect x="24" y="616" width="912" height="8" fill="#d8cdb8"/>
<use href="#door" transform="translate(856 466)"/>
<g><use href="#ch" transform="translate(90 616)"/><use href="#slip" transform="translate(94 616)"/>
<use href="#ch" transform="translate(170 616)"/><use href="#slip" transform="translate(174 616)"/>
<use href="#ch" transform="translate(250 616)"/><use href="#slip" transform="translate(254 616)"/>
<use href="#ch" transform="translate(330 616)"/><use href="#slip" transform="translate(334 616)"/>
<use href="#ch" transform="translate(410 616)"/><use href="#slip" transform="translate(414 616)"/></g>
<!-- calm man front row, arms crossed -->
<use href="#ch" transform="translate(500 616)"/>
<g transform="translate(506 616) scale(.85)"><use href="#sit" color="#ffffff"/><path d="M-18 -92 h44 M-14 -84 h40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><circle cx="-7" cy="-148" r="6" fill="none" stroke="#2b2b2b" stroke-width="2"/><circle cx="8" cy="-148" r="6" fill="none" stroke="#2b2b2b" stroke-width="2"/><path d="M-6 -136 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<!-- queue coming back in -->
<g transform="translate(660 616) scale(.8)"><use href="#wom" color="#7a4e7e"/><path d="M-20 -108 l-40 14" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<circle cx="610" cy="526" r="8" fill="#e0a33a"/>
<g transform="translate(740 616) scale(.8)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-10 40 M26 -112 l10 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(820 616) scale(.8) rotate(-8)"><use href="#man" color="#1f6f78"/><path d="M-26 -112 l-30 20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M880 600 h-230" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#aT)"/>
</svg>
