<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Bus stops on a road: a trend day bus drives on, a chop day bus shuttles between two stops</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="bus"><rect x="-70" y="-62" width="140" height="56" rx="10" fill="#e07a5f"/><rect x="-60" y="-54" width="120" height="20" rx="4" fill="#fff" opacity=".85"/><path d="M-30 -54 v20 M0 -54 v20 M30 -54 v20" stroke="#e07a5f" stroke-width="4"/><rect x="-70" y="-24" width="140" height="6" fill="#b9573f"/><circle cx="-40" cy="-6" r="11" fill="#3d3a3a"/><circle cx="40" cy="-6" r="11" fill="#3d3a3a"/><circle cx="-40" cy="-6" r="4" fill="#cbbfa9"/><circle cx="40" cy="-6" r="4" fill="#cbbfa9"/></g>
<g id="ghost"><rect x="-70" y="-62" width="140" height="56" rx="10" fill="none" stroke="#e07a5f" stroke-width="3" stroke-dasharray="7 6" opacity=".6"/></g>
<g id="shel"><rect x="-34" y="-96" width="68" height="10" rx="3" fill="#1f6f78"/><rect x="-30" y="-86" width="6" height="86" fill="#6b5446"/><rect x="24" y="-86" width="6" height="86" fill="#6b5446"/><rect x="-24" y="-30" width="48" height="6" fill="#8a6d5a"/></g>
<g id="tree"><rect x="-5" y="-60" width="10" height="60" fill="#6b5446"/><circle cx="0" cy="-74" r="26" fill="#1f6f78" opacity=".55"/></g>
</defs>
<line x1="30" y1="320" x2="930" y2="320" stroke="#d8cdb8" stroke-width="3"/>
<!-- TOP: trend day -->
<text x="160" y="56" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TREND DAY</text>
<rect x="24" y="270" width="912" height="30" fill="#cbbfa9"/><path d="M40 285 h40 M120 285 h40 M200 285 h40 M280 285 h40 M360 285 h40 M440 285 h40 M520 285 h40 M600 285 h40 M680 285 h40 M760 285 h40 M840 285 h40" stroke="#fff" stroke-width="4"/>
<use href="#tree" transform="translate(240 228)"/><use href="#tree" transform="translate(500 228)"/>
<use href="#shel" transform="translate(110 262)"/><use href="#shel" transform="translate(370 262)"/><use href="#shel" transform="translate(630 262)"/><use href="#ghost" transform="translate(630 282)"/><use href="#shel" transform="translate(880 262)"/>
<g font-size="22" font-weight="800" fill="#1f6f78" text-anchor="middle"><text x="110" y="158">1</text><text x="370" y="158">2</text><text x="630" y="158">3</text><text x="880" y="158">4</text></g>
<use href="#ghost" transform="translate(150 282)"/><use href="#ghost" transform="translate(410 282)"/>
<use href="#bus" transform="translate(730 282)"/>
<path d="M810 230 h110" stroke="#2b2b2b" stroke-width="6" marker-end="url(#aK)"/>
<g transform="translate(560 262) scale(.7)"><use href="#man" color="#1f6f78"/><rect x="-40" y="-120" width="18" height="50" rx="6" fill="#e0a33a"/><path d="M26 -112 l24 -36" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<!-- BOTTOM: chop day -->
<text x="160" y="378" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">CHOP DAY</text>
<rect x="24" y="590" width="912" height="30" fill="#cbbfa9"/><path d="M40 605 h40 M120 605 h40 M200 605 h40 M280 605 h40 M360 605 h40 M440 605 h40 M520 605 h40 M600 605 h40 M680 605 h40 M760 605 h40 M840 605 h40" stroke="#fff" stroke-width="4"/>
<use href="#shel" transform="translate(300 582)"/><use href="#shel" transform="translate(700 582)"/>
<g font-size="22" font-weight="800" fill="#1f6f78" text-anchor="middle"><text x="300" y="478">2</text><text x="700" y="478">3</text></g>
<use href="#bus" transform="translate(500 602)"/>
<!-- driver face in window -->
<circle cx="548" cy="560" r="8" fill="#b07850"/><path d="M542 565 h12" stroke="#2e2a2a" stroke-width="3"/>
<path d="M380 470 q120 -40 240 0" stroke="#7a4e7e" stroke-width="5" fill="none" marker-end="url(#aP)"/>
<path d="M620 488 q-120 40 -240 0" stroke="#7a4e7e" stroke-width="5" fill="none" marker-end="url(#aP)"/>
<g transform="translate(250 582) scale(.7)"><use href="#wom" color="#7a4e7e"/><path d="M20 -108 l10 40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<path d="M270 560 q240 -10 480 0" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="4 7" opacity="0"/>
<g transform="translate(760 582) scale(.7)" opacity=".5"><use href="#wom" color="#7a4e7e"/></g>
<path d="M290 430 q210 -50 430 0" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="5 7" marker-end="url(#aT)"/>
<!-- pivot levels signboard -->
<rect x="790" y="370" width="146" height="120" rx="8" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<path d="M806 398 h114 M806 424 h114 M806 450 h114 M806 476 h114" stroke="#1f6f78" stroke-width="4" stroke-dasharray="10 6"/>
<g font-size="15" font-weight="800" fill="#1f6f78"><text x="922" y="394" text-anchor="end">4</text><text x="922" y="420" text-anchor="end">3</text><text x="922" y="446" text-anchor="end">2</text><text x="922" y="472" text-anchor="end">1</text></g>
<text x="660" y="404" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PIVOT LEVELS</text>
<path d="M752 414 l30 10" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
</svg>
