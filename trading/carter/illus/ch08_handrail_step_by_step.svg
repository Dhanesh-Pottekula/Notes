<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stair climbing with a handrail: move the hand up one step at a time, never let go</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- mist + temple -->
<circle cx="860" cy="70" r="40" fill="#e0a33a" opacity=".35"/>
<path d="M800 200 v-70 h120 v70 z" fill="#e07a5f" opacity=".6"/><path d="M820 130 l40 -60 l40 60 z" fill="#e07a5f" opacity=".6"/><rect x="848" y="160" width="24" height="40" fill="#6b5446" opacity=".6"/>
<path d="M0 640 L0 600 L30 600 L30 560 L120 560 L120 560 L120 520 L210 520 L210 520 L210 480 L300 480 L300 480 L300 440 L390 440 L390 440 L390 400 L480 400 L480 400 L480 360 L570 360 L570 360 L570 320 L660 320 L660 320 L660 280 L750 280 L750 280 L750 240 L840 240 L960 200 L960 640 z" fill="#d8cdb8"/>
<path d="M30 600 M30 560 h90 M120 520 h90 M210 480 h90 M300 440 h90 M390 400 h90 M480 360 h90 M570 320 h90 M660 280 h90 M750 240 h90" stroke="#b9ad98" stroke-width="5"/>
<rect x="120" y="520" width="34" height="8" rx="2" fill="#e0a33a"/><rect x="210" y="480" width="34" height="8" rx="2" fill="#e0a33a"/><rect x="300" y="440" width="34" height="8" rx="2" fill="#e0a33a"/>
<rect x="72" y="460" width="6" height="100" fill="#7a4e7e"/><rect x="252" y="380" width="6" height="100" fill="#7a4e7e"/><rect x="432" y="300" width="6" height="100" fill="#7a4e7e"/><rect x="612" y="220" width="6" height="100" fill="#7a4e7e"/><rect x="792" y="140" width="6" height="100" fill="#7a4e7e"/>
<line x1="30" y1="480" x2="780" y2="147" stroke="#7a4e7e" stroke-width="8" stroke-linecap="round"/>
<circle cx="140" cy="431" r="9" fill="#d9a27a" opacity=".45"/><path d="M148 419 l30 -13" stroke="#1f6f78" stroke-width="3" marker-end="url(#aT)"/><circle cx="230" cy="391" r="9" fill="#d9a27a" opacity=".45"/><path d="M238 379 l30 -13" stroke="#1f6f78" stroke-width="3" marker-end="url(#aT)"/><circle cx="320" cy="351" r="9" fill="#d9a27a" opacity=".45"/><path d="M328 339 l30 -13" stroke="#1f6f78" stroke-width="3" marker-end="url(#aT)"/>
<text x="200" y="340" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle" transform="rotate(-24 200 340)">STOP MOVES UP</text>
<!-- woman: hand on the rail at the step she just left -->
<g transform="translate(470 400)"><use href="#wom" color="#3f9a5a"/><path d="M-20 -108 l-50 36" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M20 -108 l12 40" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M24 -110 l16 50 h18 l-10 -50 z" fill="#e0a33a"/></g>
<circle cx="404" cy="314" r="9" fill="#d9a27a"/>
<text x="230" y="590" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LEVEL BROKEN</text>
<path d="M300 562 l20 -100" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<!-- young man leaping two steps, no rail -->
<g transform="translate(660 300) rotate(-22)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-40 -30 M26 -112 l40 -36" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M650 312 q40 -60 110 -70" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#aC)"/>
<circle cx="560" cy="150" r="22" fill="#e07a5f"/><text x="560" y="160" font-size="28" font-weight="800" fill="#fff" text-anchor="middle">!</text>
<text x="640" y="90" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">NEVER LET GO</text>
</svg>
