<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ticket window: a calm woman stands one step in front of where the crowd forms</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="win"><rect x="0" y="0" width="150" height="190" rx="6" fill="#8a6d5a"/><rect x="18" y="40" width="114" height="100" fill="#3d3a3a"/><path d="M36 40 v100 M56 40 v100 M76 40 v100 M96 40 v100 M116 40 v100" stroke="#b9ad98" stroke-width="4"/><rect x="10" y="140" width="130" height="16" fill="#6b5446"/></g>
</defs>
<!-- back wall with high windows -->
<rect x="0" y="0" width="960" height="400" fill="#efe6d2"/>
<rect x="60" y="30" width="70" height="90" rx="35" fill="#fff" opacity=".7"/><rect x="830" y="30" width="70" height="90" rx="35" fill="#fff" opacity=".7"/>
<path d="M95 120 l200 280 h-80 z" fill="#fff" opacity=".25"/>
<rect x="0" y="560" width="960" height="80" fill="#d8cdb8"/>
<!-- ticket windows: main one closed with shutter -->
<use href="#win" transform="translate(190 150)"/>
<rect x="208" y="190" width="114" height="100" fill="#b9ad98"/><path d="M208 202 h114 M208 216 h114 M208 230 h114 M208 244 h114 M208 258 h114 M208 272 h114" stroke="#a39780" stroke-width="3"/>
<rect x="208" y="190" width="114" height="100" fill="none"/>
<!-- clock: two minutes before nine -->
<circle cx="265" cy="88" r="40" fill="#fff" stroke="#6b5446" stroke-width="6"/>
<path d="M265 88 v-28 M265 88 l-22 0" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
<path d="M265 88 l-4 -30" stroke="#e07a5f" stroke-width="2"/>
<text x="76" y="262" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">THE</text><text x="76" y="296" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LEVEL</text>
<path d="M126 272 h52" stroke="#2b2b2b" stroke-width="4" marker-end="url(#aK)"/>
<!-- yellow floor line just in front of the crowd -->
<path d="M340 560 v80" stroke="#e0a33a" stroke-width="10"/>
<!-- calm woman first in place -->
<g transform="translate(300 560)"><use href="#wom" color="#1f6f78"/><path d="M-20 -108 l-6 46" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M20 -108 l18 26" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><rect x="30" y="-90" width="26" height="34" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/><path d="M-26 -60 q-12 30 4 40 h20 q8 -20 -6 -40 z" fill="#e0a33a"/></g>
<text x="250" y="384" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">ORDER JUST IN FRONT</text>
<!-- thought bubble: shutter up, served instantly -->

<!-- the crowd jostling -->
<g transform="translate(470 560) rotate(-6)"><use href="#man" color="#ffffff"/><path d="M-26 -112 l-20 -50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="-60" y="-190" width="26" height="32" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/></g>
<g transform="translate(545 560) rotate(5)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-26 20 M26 -112 l24 22" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(620 560) rotate(-4)"><use href="#wom" color="#e07a5f"/><circle cx="-26" cy="-100" r="12" fill="#c98a5e"/><path d="M20 -108 l26 24" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<g transform="translate(695 560)"><use href="#man" color="#7a4e7e"/><path d="M-26 -112 l-6 -60 M26 -112 l6 -60" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="-40" y="-190" width="80" height="14" rx="3" fill="#cbbfa9"/></g>
<text x="580" y="250" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">THE CROWD</text>
<path d="M490 330 l-14 -12 M560 320 l14 -14 M640 336 l14 -10" stroke="#e07a5f" stroke-width="3" stroke-linecap="round"/>
<!-- more people still arriving from the entrance -->
<path d="M920 600 h-180" stroke="#7a4e7e" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#aP)"/>
<g opacity=".45"><use href="#man" transform="translate(800 560) scale(.8)" color="#1f6f78"/><use href="#man" transform="translate(880 560) scale(.8)" color="#e0a33a"/></g>
<!-- inset: shutter up, ticket stamped -->
<rect x="740" y="190" width="196" height="150" rx="16" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<rect x="760" y="208" width="80" height="60" fill="#3d3a3a"/><rect x="760" y="200" width="80" height="14" fill="#b9ad98"/>
<path d="M800 196 v-0" stroke="none"/>
<path d="M800 260 v-36" stroke="#1f6f78" stroke-width="4" marker-end="url(#aT)"/>
<rect x="852" y="236" width="64" height="42" rx="3" fill="#f6f1e7" stroke="#b9ad98" stroke-width="2"/>
<circle cx="884" cy="257" r="14" fill="none" stroke="#e07a5f" stroke-width="4"/><path d="M877 257 l5 5 l9 -10" stroke="#e07a5f" stroke-width="3" fill="none"/>
<path d="M760 316 h160" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/><path d="M820 300 l8 8 l14 -16" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>
