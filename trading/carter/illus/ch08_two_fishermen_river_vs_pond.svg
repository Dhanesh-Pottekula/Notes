<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two fishermen with the same rod: a long cast down a fast river versus quick casts in a still pond</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
<!-- LEFT: river -->
<text x="240" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TREND RULES</text>
<path d="M24 120 C 200 140 260 250 320 340 C 380 430 420 520 430 616 L 290 616 C 280 540 250 470 210 420 C 150 330 120 210 24 200 z" fill="#1f6f78" opacity=".55"/>
<path d="M60 160 q30 10 50 30 M150 230 q20 20 30 50 M230 330 q20 30 50 50 M330 450 q20 30 30 60" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
<path d="M60 170 l40 30" stroke="#1f6f78" stroke-width="5" marker-end="url(#aT)"/>
<!-- rock + fisherman -->
<ellipse cx="110" cy="560" rx="80" ry="34" fill="#b9ad98"/>
<g transform="translate(110 540)"><use href="#man" color="#7fa7c9"/><path d="M26 -112 l30 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M150 -0" stroke="none"/>
<path d="M140 425 L270 250" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/>
<path d="M270 250 q40 40 30 120" stroke="#2b2b2b" stroke-width="1.5" fill="none"/>
<circle cx="300" cy="372" r="6" fill="#e07a5f"/>
<path d="M306 388 C 330 450 350 500 356 548" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#aC)"/>
<!-- big fish waiting at the bend -->
<path d="M350 584 q30 -20 50 0 q-20 20 -50 0 z M350 584 l-14 -10 v20 z" fill="#e0a33a"/>
<!-- bamboo -->
<path d="M40 260 v-150 M54 270 v-170 M380 220 v-150 M394 230 v-160" stroke="#8aa36a" stroke-width="7" stroke-linecap="round"/>
<!-- RIGHT: pond -->
<text x="720" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">CHOP RULES</text>
<ellipse cx="760" cy="420" rx="190" ry="110" fill="#1f6f78" opacity=".4"/>
<g fill="#6f9a5e"><ellipse cx="840" cy="380" rx="26" ry="10"/><ellipse cx="700" cy="460" rx="22" ry="8"/><ellipse cx="880" cy="450" rx="20" ry="8"/></g>
<circle cx="840" cy="372" r="7" fill="#e8a0b4"/>
<!-- buffalo -->
<ellipse cx="900" cy="338" rx="34" ry="16" fill="#3d3a3a"/><circle cx="868" cy="330" r="12" fill="#3d3a3a"/><path d="M860 320 q-10 -10 -2 -14 M876 320 q10 -10 2 -14" stroke="#3d3a3a" stroke-width="4" fill="none"/>
<!-- steps -->
<rect x="520" y="520" width="200" height="22" fill="#cbbfa9"/><rect x="510" y="542" width="230" height="22" fill="#b9ad98"/><rect x="500" y="564" width="260" height="40" fill="#cbbfa9"/>
<g transform="translate(590 552)"><use href="#sit" color="#ffffff"/><path d="M22 -104 l34 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-20 -126 h40" stroke="#e07a5f" stroke-width="6"/></g>
<path d="M640 450 L700 330" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/>
<path d="M700 330 q20 30 16 80" stroke="#2b2b2b" stroke-width="1.5" fill="none"/>
<path d="M716 416 q-10 -6 -14 0 M716 416 q10 -6 14 0" stroke="#fff" stroke-width="3" fill="none"/>
<!-- loop arrow cast-catch -->
<path d="M740 300 a40 30 0 1 1 10 50" stroke="#7a4e7e" stroke-width="4" fill="none" marker-end="url(#aP)"/>
<!-- steel bucket with small fish -->
<path d="M770 610 l-8 -56 h60 l-8 56 z" fill="#8f9aa0"/><ellipse cx="792" cy="554" rx="30" ry="6" fill="#6e787d"/>
<g fill="#cbd5d9"><path d="M774 548 q10 -10 22 0 q-12 8 -22 0 z"/><path d="M794 542 q10 -10 22 0 q-12 8 -22 0 z"/></g>
<!-- SAME ROD inset -->
<rect x="400" y="120" width="160" height="96" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<path d="M420 200 l40 -64 M500 200 l40 -64" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>
<path d="M472 160 h16 M472 172 h16" stroke="#2b2b2b" stroke-width="4"/>
<text x="480" y="252" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SAME ROD</text>
</svg>
