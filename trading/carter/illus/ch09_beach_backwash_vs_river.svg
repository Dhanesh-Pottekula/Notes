<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The same splash at a beach (it runs back) and in a flooding river (it never comes back)</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
<!-- LEFT: beach -->
<text x="240" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">RANGE DAY</text>
<rect x="24" y="90" width="440" height="520" fill="#f3dfb6"/>
<path d="M24 470 q110 -30 220 -10 q110 20 220 -10 v160 h-440 z" fill="#1f6f78" opacity=".55"/>
<path d="M24 470 q110 -30 220 -10 q110 20 220 -10" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
<!-- palm + boat -->
<path d="M80 340 q-10 -110 20 -200" stroke="#8a6d5a" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M100 140 q-50 -20 -76 10 M100 140 q-30 -40 -70 -36 M100 140 q30 -40 76 -30 M100 140 q50 -6 70 30 M100 140 q10 -50 -6 -60" stroke="#5f8a4e" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M160 330 h110 l-20 30 h-70 z" fill="#e07a5f"/><path d="M215 330 v-50 l30 40 z" fill="#fff"/>
<!-- wave runs up and back -->
<path d="M330 500 q-30 -60 -80 -80" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#aT)"/>
<path d="M200 430 q-20 60 30 100" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#aT)"/>
<!-- relaxed man ankle-deep with coin -->
<g transform="translate(370 520)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-14 40 M26 -112 l14 -30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-6 -136 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<circle cx="390" cy="356" r="9" fill="#e0a33a" stroke="#b7802a" stroke-width="2"/>
<path d="M370 530 m-40 0 l-14 -12 M370 530 m40 0 l14 -12 M370 530 m-20 -12 l-6 -18 M370 530 m20 -12 l6 -18" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
<!-- RIGHT: flooding river -->
<text x="720" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TREND DAY</text>
<rect x="496" y="90" width="440" height="520" fill="#d8d6cf"/>
<path d="M520 100 l-10 30 M580 120 l-10 30 M660 100 l-10 30 M740 130 l-10 30 M820 100 l-10 30 M900 120 l-10 30 M560 200 l-10 30 M700 210 l-10 30 M860 200 l-10 30" stroke="#9aa3a6" stroke-width="3" stroke-linecap="round"/>
<path d="M496 420 h440 v190 h-440 z" fill="#8a6d5a" opacity=".75"/>
<path d="M520 470 q30 -10 60 0 M640 520 q30 -10 60 0 M760 470 q30 -10 60 0 M560 570 q30 -10 60 0 M820 560 q30 -10 60 0" stroke="#f6f1e7" stroke-width="4" fill="none" opacity=".7" stroke-linecap="round"/>
<path d="M530 500 h370" stroke="#2b2b2b" stroke-width="8" marker-end="url(#aK)"/>
<path d="M840 440 l40 20 M860 450 l10 -16" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/>
<!-- wary woman on the bank with the same coin -->
<rect x="496" y="380" width="200" height="40" fill="#b9ad98"/>
<g transform="translate(600 410)"><use href="#wom" color="#e0a33a"/><path d="M-20 -108 l-10 40 M20 -108 l12 -30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-26 -152 a26 26 0 0 1 52 0 z" fill="#e0a33a"/></g>
<circle cx="620" cy="266" r="9" fill="#e0a33a" stroke="#b7802a" stroke-width="2"/>
<path d="M600 420 m-40 0 l-14 -12 M600 420 m40 0 l14 -12 M600 420 m-20 -12 l-6 -18 M600 420 m20 -12 l6 -18" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
<!-- SAME SPLASH -->
<rect x="350" y="566" width="260" height="50" rx="12" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
<text x="480" y="602" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SAME SPLASH</text>
<path d="M390 566 l-14 -22" stroke="#e07a5f" stroke-width="3" marker-end="url(#aC)"/><path d="M570 566 l20 -110" stroke="#e07a5f" stroke-width="3" marker-end="url(#aC)"/>
</svg>
