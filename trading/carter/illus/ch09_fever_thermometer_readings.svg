<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Fever readings: one spike, sustained high readings, and waiting for the trend to turn</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- notebook of readings -->
<rect x="380" y="24" width="550" height="300" rx="10" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<path d="M400 24 v300" stroke="#e07a5f" stroke-width="2" opacity=".6"/>
<path d="M420 170 H900" stroke="#d8cdb8" stroke-width="2" stroke-dasharray="6 6"/>
<path d="M450 230 L540 170 L610 168 L680 172 L750 168 L830 204" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#7a4e7e"><circle cx="450" cy="230" r="8"/><circle cx="540" cy="170" r="8"/><circle cx="610" cy="168" r="8"/><circle cx="680" cy="172" r="8"/><circle cx="750" cy="168" r="8"/><circle cx="830" cy="204" r="8"/></g>
<g font-size="20" font-weight="700" fill="#2b2b2b" text-anchor="middle"><text x="450" y="264">39°</text><text x="540" y="150">40°</text><text x="610" y="150">40°</text><text x="680" y="150">40°</text><text x="750" y="150">40°</text><text x="796" y="236">39.4°</text></g>
<text x="470" y="304" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">ONE SPIKE</text>
<text x="648" y="100" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SUSTAINED READINGS</text>
<path d="M838 214 q20 30 34 44" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#aK)"/>
<circle cx="884" cy="282" r="22" fill="#fff" stroke="#e07a5f" stroke-width="3"/><text x="884" y="292" text-anchor="middle" font-size="28" font-weight="800" fill="#e07a5f">?</text>
<text x="740" y="372" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">WAIT FOR THE TURN</text>
<!-- wall clock at three -->
<circle cx="110" cy="100" r="44" fill="#fff" stroke="#6b5446" stroke-width="6"/>
<path d="M110 100 v-32 M110 100 h24" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/>
<!-- ceiling fan -->
<path d="M240 0 v40 M190 44 h100" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
<!-- bed with boy -->
<rect x="30" y="500" width="380" height="70" rx="8" fill="#8a6d5a"/><rect x="30" y="440" width="22" height="160" rx="6" fill="#6b5446"/>
<rect x="60" y="470" width="80" height="34" rx="14" fill="#fff"/>
<circle cx="100" cy="464" r="20" fill="#c98a5e"/><path d="M80 460 a20 20 0 0 1 22 -20 z" fill="#2e2a2a"/>
<rect x="88" y="444" width="28" height="10" rx="4" fill="#cfe3e6"/>
<path d="M120 480 q140 -30 280 10 v20 h-280 z" fill="#e0a33a"/>
<path d="M160 478 l20 22 M220 470 l20 26 M280 470 l20 26 M340 476 l20 24" stroke="#e07a5f" stroke-width="5"/>
<!-- mother on bed edge with thermometer -->
<g transform="translate(470 600) scale(-.95 .95)"><use href="#sit" color="#7a4e7e"/><path d="M-26 -108 l-10 -50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<rect x="500" y="420" width="6" height="34" rx="3" fill="#fff" stroke="#3d3a3a" stroke-width="2"/>
<!-- bedside table, lamp, glass, notebook -->
<rect x="540" y="500" width="110" height="100" fill="#6b5446"/>
<path d="M570 500 v-40 M550 460 l20 -40 h20 l20 40 z" fill="#e0a33a" stroke="#6b5446" stroke-width="4"/>
<circle cx="590" cy="440" r="60" fill="#e0a33a" opacity=".15"/>
<rect x="616" y="474" width="18" height="26" rx="3" fill="#b9ad98"/>
<!-- father in doorway with phone -->
<rect x="790" y="400" width="140" height="210" fill="#3d3a3a" opacity=".85"/>
<g transform="translate(860 610)"><use href="#man" color="#1f6f78"/><path d="M26 -112 l-8 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="10" y="-172" width="14" height="24" rx="3" fill="#2b2b2b"/></g>
<rect x="0" y="600" width="960" height="40" fill="#d8cdb8"/>
</svg>
