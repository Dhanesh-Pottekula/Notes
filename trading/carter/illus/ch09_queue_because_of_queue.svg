<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A long queue outside a sweet shop: the latest arrivals join just as the shelves run out</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- string lights -->
<path d="M20 40 q230 50 460 0 q230 50 460 0" stroke="#7a4e7e" stroke-width="2" fill="none"/>
<g fill="#e0a33a"><circle cx="80" cy="56" r="6"/><circle cx="160" cy="66" r="6"/><circle cx="240" cy="70" r="6"/><circle cx="320" cy="68" r="6"/><circle cx="400" cy="58" r="6"/><circle cx="560" cy="56" r="6"/><circle cx="640" cy="66" r="6"/><circle cx="720" cy="70" r="6"/><circle cx="800" cy="68" r="6"/><circle cx="880" cy="58" r="6"/></g>
<rect x="0" y="500" width="960" height="140" fill="#d8cdb8"/>
<!-- sweet shop -->
<rect x="690" y="150" width="250" height="350" fill="#e8dcc4"/>
<path d="M680 150 h270 l-10 40 h-250 z" fill="#e07a5f"/><path d="M710 150 l-6 40 M750 150 l-4 40 M790 150 l-2 40 M830 150 v40 M870 150 l2 40 M910 150 l4 40" stroke="#fff" stroke-width="10"/>
<rect x="700" y="210" width="230" height="160" fill="#fff" opacity=".6"/>
<path d="M710 260 h210 M710 310 h210" stroke="#b9ad98" stroke-width="5"/>
<rect x="730" y="236" width="34" height="24" rx="2" fill="#e0a33a"/>
<!-- worried shopkeeper lifting last boxes -->
<g transform="translate(860 420)"><use href="#man" color="#ffffff"/><path d="M-26 -112 l-24 -16 M26 -112 l-6 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-6 -134 q7 -5 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/><path d="M14 -168 l12 -6" stroke="#e0a33a" stroke-width="4"/></g>
<rect x="800" y="236" width="40" height="18" rx="2" fill="#e0a33a"/><rect x="802" y="218" width="40" height="18" rx="2" fill="#f0c36a"/><rect x="852" y="244" width="40" height="18" rx="2" fill="#e0a33a"/>
<rect x="700" y="370" width="230" height="130" fill="#8a6d5a"/><rect x="700" y="370" width="230" height="14" fill="#6b5446"/>
<rect x="730" y="396" width="70" height="44" rx="3" fill="#fff"/><path d="M740 410 h40 M740 424 h20" stroke="#e07a5f" stroke-width="4"/>
<text x="815" y="128" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SOLD OUT SOON</text>
<!-- the queue -->
<g transform="translate(640 500)"><use href="#wom" color="#7a4e7e"/><path d="M-26 -30 q-6 30 10 30 h18 q6 -26 -6 -30 z" fill="#e0a33a"/><rect x="-20" y="-160" width="40" height="10" rx="5" fill="#cbbfa9"/></g>
<g transform="translate(560 500)"><use href="#man" color="#1f6f78"/><path d="M26 -112 l2 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="22" y="-170" width="12" height="20" rx="3" fill="#3d3a3a"/></g>
<g transform="translate(480 500)"><use href="#man" color="#e07a5f"/><path d="M26 -112 l30 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M500 254 h70 a10 10 0 0 1 10 10 v34 a10 10 0 0 1 -10 10 h-46 l-14 14 l2 -14 h-12 a10 10 0 0 1 -10 -10 v-34 a10 10 0 0 1 10 -10 z" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<text x="535" y="294" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">?</text>
<g transform="translate(395 500)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-14 -46 M26 -112 l14 -46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(300 500) rotate(8)"><use href="#wom" color="#1f6f78"/><path d="M-20 -108 l-30 20 M20 -108 l26 -30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<text x="350" y="300" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LATE BUYERS</text>
<!-- scooter just parked, rider hurrying -->
<g transform="translate(120 500)"><circle cx="-50" cy="-20" r="20" fill="#3d3a3a"/><circle cx="50" cy="-20" r="20" fill="#3d3a3a"/><path d="M-60 -40 h70 q30 0 50 -40 l10 0 l-14 70 h-116 z" fill="#1f6f78"/><path d="M60 -80 l-6 -30 h20" stroke="#3d3a3a" stroke-width="6" fill="none" stroke-linecap="round"/><rect x="-60" y="-56" width="60" height="14" rx="6" fill="#3d3a3a"/></g>
<path d="M190 470 h60" stroke="#7a4e7e" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#aP)"/>
<!-- measuring tape -->
<rect x="250" y="520" width="440" height="22" rx="3" fill="#e0a33a"/>
<path d="M270 520 v10 M290 520 v6 M310 520 v10 M330 520 v6 M350 520 v10 M370 520 v6 M390 520 v10 M410 520 v6 M430 520 v10 M450 520 v6 M470 520 v10 M490 520 v6 M510 520 v10 M530 520 v6 M550 520 v10 M570 520 v6 M590 520 v10 M610 520 v6 M630 520 v10 M650 520 v6 M670 520 v10" stroke="#2b2b2b" stroke-width="2"/>
<rect x="680" y="510" width="40" height="42" rx="6" fill="#3d3a3a"/>
<text x="470" y="590" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">$TICK = LINE LENGTH</text>
</svg>
