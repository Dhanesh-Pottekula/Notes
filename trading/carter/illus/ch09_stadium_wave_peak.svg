<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stadium wave at its peak: most fans are standing, the first section is already sitting down</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="fs"><rect x="-10" y="-24" width="20" height="24" rx="6" fill="currentColor"/><circle cx="0" cy="-32" r="9" fill="#c98a5e"/><path d="M-9 -34 a9 9 0 0 1 18 0 z" fill="#2e2a2a"/></g>
<g id="fu"><rect x="-10" y="-50" width="20" height="50" rx="6" fill="currentColor"/><circle cx="0" cy="-60" r="9" fill="#c98a5e"/><path d="M-9 -62 a9 9 0 0 1 18 0 z" fill="#2e2a2a"/><path d="M-8 -46 l-8 -30 M8 -46 l8 -30" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/></g>
</defs>
<!-- floodlights -->
<path d="M60 30 v120" stroke="#3d3a3a" stroke-width="6"/><rect x="40" y="20" width="40" height="18" rx="3" fill="#fff" stroke="#3d3a3a" stroke-width="3"/>
<!-- stand band -->
<path d="M30 300 Q480 150 930 300 L930 360 Q480 210 30 360 z" fill="#cbbfa9"/>
<!-- field -->
<ellipse cx="560" cy="500" rx="360" ry="90" fill="#7fae6a"/><rect x="530" y="470" width="60" height="60" rx="4" fill="#d8cdb8"/>
<circle cx="440" cy="480" r="6" fill="#1f6f78"/><circle cx="680" cy="520" r="6" fill="#1f6f78"/><circle cx="600" cy="460" r="6" fill="#e07a5f"/>
<!-- fans: left section sitting back down, middle standing, right yet to rise -->
<use href="#fs" transform="translate(70 345)" color="#1f6f78"/><use href="#fs" transform="translate(120 330)" color="#e0a33a"/><use href="#fs" transform="translate(170 316)" color="#7a4e7e"/>
<use href="#fu" transform="translate(220 304)" color="#1f6f78"/><use href="#fu" transform="translate(270 294)" color="#e07a5f"/><use href="#fu" transform="translate(320 285)" color="#e0a33a"/><use href="#fu" transform="translate(370 280)" color="#7a4e7e"/><use href="#fu" transform="translate(420 276)" color="#1f6f78"/><use href="#fu" transform="translate(470 274)" color="#e07a5f"/><use href="#fu" transform="translate(520 274)" color="#e0a33a"/><use href="#fu" transform="translate(570 276)" color="#7a4e7e"/><use href="#fu" transform="translate(620 280)" color="#1f6f78"/><use href="#fu" transform="translate(670 286)" color="#e07a5f"/>
<use href="#fs" transform="translate(720 294)" color="#e0a33a"/><use href="#fs" transform="translate(770 304)" color="#1f6f78"/><use href="#fs" transform="translate(820 316)" color="#7a4e7e"/><use href="#fs" transform="translate(870 330)" color="#e07a5f"/>
<!-- wave travel + sitting arrow -->
<path d="M150 200 Q420 110 700 190" stroke="#7a4e7e" stroke-width="6" fill="none" marker-end="url(#aP)"/>
<path d="M120 210 v60" stroke="#e07a5f" stroke-width="5" marker-end="url(#aC)"/>
<text x="440" y="110" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PEAK</text>
<text x="120" y="196" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">FADE</text>
<!-- giant screen with gauge pinned -->
<rect x="710" y="30" width="220" height="150" rx="10" fill="#3d3a3a"/><rect x="722" y="42" width="196" height="126" rx="6" fill="#fff"/>
<path d="M760 120 a60 60 0 0 1 120 0" stroke="#d8cdb8" stroke-width="12" fill="none"/><path d="M850 68 a60 60 0 0 1 30 52" stroke="#e07a5f" stroke-width="12" fill="none"/>
<path d="M820 120 l52 -24" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round"/><circle cx="820" cy="120" r="7" fill="#2b2b2b"/>
<text x="820" y="158" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">+1,000 TICK</text>
<!-- foreground: calm counter-holder and late jumper -->
<rect x="40" y="560" width="340" height="40" rx="6" fill="#8a6d5a"/>
<g transform="translate(140 600)"><use href="#sit" color="#1f6f78"/><path d="M-21 -156 a21 21 0 0 1 42 0 z M-21 -158 h34 v4 h-34 z" fill="#e0a33a"/><path d="M22 -104 l30 10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="48" y="-104" width="18" height="24" rx="4" fill="#3d3a3a"/><circle cx="57" cy="-96" r="4" fill="#e0a33a"/><path d="M-6 -136 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<g transform="translate(290 586)"><use href="#man" color="#e07a5f"/><path d="M-26 -112 l-14 -50 M26 -112 l18 -50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g fill="#fff" stroke="#e0a33a" stroke-width="2"><circle cx="250" cy="390" r="6"/><circle cx="280" cy="372" r="5"/><circle cx="320" cy="384" r="6"/><circle cx="340" cy="404" r="5"/></g>
</svg>
