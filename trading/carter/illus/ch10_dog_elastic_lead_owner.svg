<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A dog on an elastic lead around a steady walker: the stretch is limited to about one ATR</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="dog"><path d="M-30 -30 q-10 -10 -24 -18" stroke="#d9a24a" stroke-width="7" stroke-linecap="round" fill="none"/><ellipse cx="0" cy="-30" rx="32" ry="14" fill="#d9a24a"/><rect x="-24" y="-24" width="8" height="24" rx="3" fill="#c48a34"/><rect x="16" y="-24" width="8" height="24" rx="3" fill="#c48a34"/><circle cx="34" cy="-44" r="13" fill="#d9a24a"/><ellipse cx="30" cy="-44" rx="5" ry="9" fill="#c48a34"/><circle cx="46" cy="-42" r="3" fill="#2b2b2b"/></g>
</defs>
<!-- sunrise sea + wall -->
<rect x="0" y="120" width="960" height="180" fill="#e7b9a8" opacity=".5"/>
<circle cx="820" cy="140" r="44" fill="#e0a33a" opacity=".7"/>
<rect x="0" y="290" width="960" height="40" fill="#cbbfa9"/>
<rect x="0" y="330" width="960" height="310" fill="#e8dcc4"/>
<!-- lamp post -->
<rect x="160" y="300" width="10" height="250" fill="#3d3a3a"/><path d="M150 300 h30" stroke="#3d3a3a" stroke-width="8"/><circle cx="165" cy="292" r="12" fill="#e0a33a"/>
<!-- waist-height average path -->
<path d="M30 470 H930" stroke="#1f6f78" stroke-width="3" stroke-dasharray="4 8"/>
<path d="M600 470 h80" stroke="#1f6f78" stroke-width="3" marker-end="url(#aT)"/>
<!-- the steady walker -->
<g transform="translate(470 560)"><use href="#man" color="#ffffff"/><path d="M-26 -112 l-14 40 M26 -112 l18 34" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z M-21 -158 h34 v4 h-34 z" fill="#1f6f78"/></g>
<text x="470" y="370" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">AVERAGE</text>
<!-- lead to far dog (taut), lagging dog, heel dog -->
<path d="M494 480 L800 528" stroke="#f2c230" stroke-width="3"/>
<path d="M494 480 C 400 520 300 530 230 540" stroke="#f2c230" stroke-width="4" fill="none" opacity=".55"/>
<path d="M494 480 q20 40 40 52" stroke="#f2c230" stroke-width="7" fill="none"/>
<g opacity=".5"><use href="#dog" transform="translate(830 580)"/></g>
<g opacity=".45"><use href="#dog" transform="translate(210 580) scale(-1 1)"/></g>
<use href="#dog" transform="translate(560 580)"/>
<text x="840" y="470" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PRICE</text>
<!-- pull-back arrows -->
<path d="M820 600 q-80 40 -180 10" stroke="#e07a5f" stroke-width="5" fill="none" marker-end="url(#aC)"/>
<path d="M200 600 q90 40 220 10" stroke="#e07a5f" stroke-width="5" fill="none" marker-end="url(#aC)" opacity=".7"/>
<!-- measuring tape along the far lead -->
<g transform="rotate(8.9 494 480)"><rect x="610" y="490" width="190" height="16" rx="3" fill="#e0a33a"/><path d="M630 490 v8 M660 490 v8 M690 490 v8 M720 490 v8 M750 490 v8 M780 490 v8" stroke="#2b2b2b" stroke-width="2"/></g>
<text x="650" y="462" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">1 ATR</text>
<!-- inset: owner speeds up a step -->
<rect x="30" y="24" width="220" height="150" rx="14" fill="#efe6d2" stroke="#7a4e7e" stroke-width="3"/>
<g transform="translate(110 160) scale(.6) rotate(10)"><use href="#man" color="#ffffff"/></g>
<g opacity=".4"><use href="#man" transform="translate(76 160) scale(.6)" color="#ffffff"/></g>
<path d="M150 90 h70" stroke="#7a4e7e" stroke-width="5" marker-end="url(#aP)"/><path d="M150 110 h50" stroke="#7a4e7e" stroke-width="3"/>
</svg>
