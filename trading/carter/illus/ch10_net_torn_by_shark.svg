<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Fishermen hauling a small-fish net while a shark fin heads for it; the old man shouts to pull the net</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- sea -->
<rect x="0" y="120" width="960" height="320" fill="#1f6f78" opacity=".45"/>
<path d="M80 180 q20 -8 40 0 M300 220 q20 -8 40 0 M600 170 q20 -8 40 0 M820 250 q20 -8 40 0" stroke="#fff" stroke-width="3" fill="none" opacity=".7"/>
<rect x="0" y="430" width="960" height="210" fill="#f3dfb6"/>
<path d="M0 434 q120 -14 240 0 q120 14 240 0 q120 -14 240 0 q120 14 240 0" stroke="#fff" stroke-width="6" fill="none"/>
<!-- net full of small fish -->
<path d="M260 300 Q410 250 560 300 L540 400 Q410 430 280 400 z" fill="#fff" opacity=".35"/>
<path d="M260 300 Q410 250 560 300 L540 400 Q410 430 280 400 z M300 290 L310 410 M350 280 L355 418 M400 274 L405 420 M450 274 L452 420 M500 280 L500 416 M268 330 Q410 290 554 330 M272 360 Q410 330 548 360 M276 390 Q410 370 544 390" stroke="#fff" stroke-width="2" fill="none"/>
<g fill="#cbd5d9"><path d="M310 340 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M370 360 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M430 330 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M480 370 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M340 390 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M450 392 q12 -10 24 0 q-12 8 -24 0 z"/></g>
<text x="410" y="236" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SMALL RTM TRADES</text>
<!-- three fishermen hauling -->
<g transform="translate(300 520) rotate(-8)"><use href="#man" color="#e07a5f"/><path d="M-26 -112 l-6 -40 M26 -112 l4 -42" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(410 520) rotate(-8)"><use href="#man" color="#1f6f78"/><path d="M-26 -112 l-6 -40 M26 -112 l4 -42" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(520 520) rotate(-8)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-6 -40 M26 -112 l4 -42" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M240 520 v-60 M250 520 v-60" stroke="none"/>
<!-- basket of fish -->
<path d="M590 540 l-10 -40 h80 l-10 40 z" fill="#8a6d5a"/><g fill="#cbd5d9"><ellipse cx="605" cy="498" rx="12" ry="5"/><ellipse cx="625" cy="494" rx="12" ry="5"/><ellipse cx="645" cy="498" rx="12" ry="5"/></g>
<!-- shark fin + path -->
<path d="M760 300 q20 -50 60 -70 q-6 40 10 70 z" fill="#3d3a3a"/>
<path d="M740 302 q30 6 100 0" stroke="#fff" stroke-width="3" fill="none"/>
<path d="M930 330 Q860 310 840 310 M740 310 Q650 320 580 330" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7"/>
<path d="M600 328 l-26 4" stroke="#e07a5f" stroke-width="4" marker-end="url(#aC)"/>
<text x="850" y="214" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SQUEEZE</text>
<!-- old fisherman on upturned boat -->
<path d="M30 600 q90 -60 200 0 z" fill="#e07a5f"/><path d="M40 596 h180" stroke="#7a4e7e" stroke-width="6"/>
<g transform="translate(120 576)"><use href="#man" color="#ffffff"/><path d="M26 -112 l40 -40 M-26 -112 l-24 -26" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-12 -138 q12 16 24 0 z" fill="#fff"/><ellipse cx="0" cy="-140" rx="5" ry="4" fill="#3d3a3a"/></g>
<path d="M150 420 l22 -10 M152 434 l26 0 M150 448 l22 10" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
<text x="130" y="350" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PULL THE NET</text>
<!-- warning flag -->
<path d="M40 120 v-100" stroke="#3d3a3a" stroke-width="5"/><path d="M42 22 h44 l-12 16 l12 16 h-44 z" fill="#e07a5f"/>
<!-- inset: if they wait -->
<rect x="700" y="450" width="230" height="160" rx="14" fill="#dfeaec" stroke="#e07a5f" stroke-width="3"/>
<path d="M720 480 Q815 460 910 480 L896 560 Q815 580 734 560 z" fill="none" stroke="#1f6f78" stroke-width="2"/>
<path d="M740 475 L745 565 M780 470 L782 572 M850 470 L848 572 M890 476 L886 562 M724 510 Q815 490 906 510 M730 540 Q815 525 900 540" stroke="#1f6f78" stroke-width="2" fill="none"/>
<path d="M792 490 q24 -10 44 10 q10 30 -16 50 q-30 0 -36 -30 z" fill="#fff"/>
<path d="M792 490 l8 10 l-8 8 l10 8 l-6 14 M836 500 l-10 8 l8 10 l-8 12" stroke="#3d3a3a" stroke-width="3" fill="none"/>
<g fill="#cbd5d9"><path d="M806 560 q12 -10 24 0 q-12 8 -24 0 z"/><path d="M820 586 q12 -10 24 0 q-12 8 -24 0 z"/></g>
<path d="M818 540 v50" stroke="#e07a5f" stroke-width="3" marker-end="url(#aC)"/>
</svg>
