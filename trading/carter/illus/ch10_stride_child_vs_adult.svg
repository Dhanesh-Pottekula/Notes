<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Same five strides from a lamp post: a child ends near, an adult far, so measure in strides</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="fp"><ellipse cx="0" cy="0" rx="9" ry="5" fill="currentColor"/></g>
</defs>
<!-- lamp post -->
<rect x="70" y="150" width="12" height="430" fill="#3d3a3a"/><path d="M58 150 h36" stroke="#3d3a3a" stroke-width="8"/><circle cx="76" cy="140" r="14" fill="#e0a33a"/>
<!-- paths -->
<rect x="40" y="306" width="900" height="22" rx="10" fill="#e8dcc4"/>
<rect x="40" y="560" width="900" height="26" rx="10" fill="#e8dcc4"/>
<!-- girl: five short steps -->
<g color="#e07a5f"><use href="#fp" transform="translate(120 314)"/><use href="#fp" transform="translate(160 320)"/><use href="#fp" transform="translate(200 314)"/><use href="#fp" transform="translate(240 320)"/><use href="#fp" transform="translate(280 314)"/></g>
<g font-size="16" font-weight="800" fill="#2b2b2b" text-anchor="middle"><text x="120" y="298">1</text><text x="160" y="298">2</text><text x="200" y="298">3</text><text x="240" y="298">4</text><text x="280" y="298">5</text></g>
<g transform="translate(320 318) scale(.55)"><use href="#wom" color="#e07a5f"/></g>
<rect x="300" y="160" width="64" height="56" rx="12" fill="#fff" stroke="#7a4e7e" stroke-width="3"/><path d="M318 216 l4 14 l10 -14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<text x="332" y="200" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">5</text>
<!-- father: five long strides -->
<g color="#1f6f78"><use href="#fp" transform="translate(180 568) scale(1.6)"/><use href="#fp" transform="translate(290 578) scale(1.6)"/><use href="#fp" transform="translate(400 568) scale(1.6)"/><use href="#fp" transform="translate(510 578) scale(1.6)"/><use href="#fp" transform="translate(620 568) scale(1.6)"/></g>
<g font-size="18" font-weight="800" fill="#2b2b2b" text-anchor="middle"><text x="180" y="548">1</text><text x="290" y="548">2</text><text x="400" y="548">3</text><text x="510" y="548">4</text><text x="620" y="548">5</text></g>
<g transform="translate(700 574) scale(1.05)"><use href="#man" color="#7a4e7e"/><path d="M-26 -112 l-10 40 M26 -112 l10 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<rect x="670" y="324" width="64" height="56" rx="12" fill="#fff" stroke="#7a4e7e" stroke-width="3"/><path d="M688 380 l4 14 l10 -14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<text x="702" y="364" text-anchor="middle" font-size="30" font-weight="800" fill="#7a4e7e">5</text>
<text x="400" y="80" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SAME 5 STRIDES</text>
<path d="M360 96 l-20 56 M470 96 l190 220" stroke="#7a4e7e" stroke-width="2" stroke-dasharray="5 6"/>
<!-- metre tape with both distances -->
<rect x="76" y="604" width="640" height="16" rx="3" fill="#e0a33a"/>
<path d="M116 604 v8 M156 604 v8 M196 604 v8 M236 604 v8 M276 604 v8 M316 604 v8 M356 604 v8 M396 604 v8 M436 604 v8 M476 604 v8 M516 604 v8 M556 604 v8 M596 604 v8 M636 604 v8 M676 604 v8" stroke="#2b2b2b" stroke-width="2"/>
<path d="M320 340 V600 M700 590 V600" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 5"/>
<text x="420" y="470" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">ATR = STRIDE</text>
<path d="M420 484 v40" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<!-- inset: tortoise vs deer -->
<rect x="610" y="24" width="320" height="160" rx="14" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<ellipse cx="680" cy="110" rx="34" ry="20" fill="#6f9a5e"/><circle cx="720" cy="112" r="9" fill="#9bb87e"/><path d="M660 128 v8 M698 128 v8" stroke="#9bb87e" stroke-width="6" stroke-linecap="round"/>
<path d="M650 160 v-8 M670 160 v-8 M690 160 v-8 M710 160 v-8" stroke="#2b2b2b" stroke-width="3"/>
<ellipse cx="840" cy="96" rx="34" ry="14" fill="#c48a34"/><circle cx="878" cy="76" r="9" fill="#c48a34"/><path d="M876 68 l6 -14 M882 68 l12 -10" stroke="#8a6d5a" stroke-width="3"/><path d="M816 106 l-16 20 M862 106 l20 18" stroke="#c48a34" stroke-width="6" stroke-linecap="round"/>
<path d="M770 160 v-8 M830 160 v-8 M890 160 v-8" stroke="#2b2b2b" stroke-width="3"/>
<text x="770" y="226" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">QUIET VS WILD</text>
</svg>
