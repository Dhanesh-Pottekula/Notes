<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A stretched rubber band snaps back; a compressed spring jumps: two hands, two different tools</title>
<defs>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- pegboard -->
<rect x="0" y="0" width="960" height="420" fill="#e8dcc4"/>
<g fill="#cbbfa9"><circle cx="60" cy="160" r="4"/><circle cx="120" cy="160" r="4"/><circle cx="180" cy="160" r="4"/><circle cx="60" cy="220" r="4"/><circle cx="120" cy="220" r="4"/><circle cx="180" cy="220" r="4"/><circle cx="60" cy="280" r="4"/><circle cx="120" cy="280" r="4"/><circle cx="180" cy="280" r="4"/><circle cx="800" cy="200" r="4"/><circle cx="860" cy="200" r="4"/><circle cx="920" cy="200" r="4"/><circle cx="800" cy="260" r="4"/><circle cx="860" cy="260" r="4"/><circle cx="920" cy="260" r="4"/></g>
<!-- bench -->
<rect x="0" y="420" width="960" height="220" fill="#8a6d5a"/><rect x="0" y="420" width="960" height="16" fill="#6b5446"/>
<!-- LEFT: rubber band -->
<text x="250" y="70" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">STRETCHED = SNAP BACK</text>
<rect x="104" y="440" width="10" height="70" fill="#9aa3a6"/><ellipse cx="109" cy="440" rx="14" ry="6" fill="#6e787d"/>
<path d="M109 380 V540" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5 6"/>
<path d="M112 452 L400 488 M112 466 L400 492" stroke="#e07a5f" stroke-width="3"/>
<path d="M380 380 Q250 330 130 400" stroke="#e07a5f" stroke-width="6" fill="none" marker-end="url(#aC)"/>
<path d="M520 640 L430 500" stroke="#7a9fc9" stroke-width="56" stroke-linecap="round"/>
<path d="M500 610 l-30 -40 M520 590 l-30 -40" stroke="#5b7fa6" stroke-width="4"/>
<circle cx="410" cy="490" r="26" fill="#c98a5e"/><path d="M398 470 l-6 18 M388 490 h-6" stroke="#b07850" stroke-width="8" stroke-linecap="round"/>
<!-- RIGHT: spring under thumb -->
<text x="730" y="70" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">COILED = JUMP</text>
<path d="M690 500 h100 M692 490 q48 -10 96 0 M692 480 q48 -10 96 0 M692 470 q48 -10 96 0 M692 460 q48 -10 96 0 M692 450 q48 -10 96 0" stroke="#6e787d" stroke-width="7" fill="none" stroke-linecap="round"/>
<rect x="682" y="430" width="116" height="14" rx="4" fill="#6e787d"/>
<path d="M940 200 L790 400" stroke="#7a9fc9" stroke-width="56" stroke-linecap="round"/>
<path d="M900 250 l-36 -26 M880 280 l-36 -26" stroke="#5b7fa6" stroke-width="4"/>
<ellipse cx="760" cy="410" rx="34" ry="22" fill="#c98a5e"/>
<path d="M650 420 V150" stroke="#1f6f78" stroke-width="12" marker-end="url(#aT)"/>
<path d="M620 200 l-20 -10 M680 200 l20 -10 M620 250 l-20 -6 M680 250 l20 -6" stroke="#1f6f78" stroke-width="4" stroke-linecap="round"/>
<!-- small compression gauge -->
<circle cx="860" cy="490" r="34" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M836 500 a26 26 0 0 1 48 0" stroke="#e07a5f" stroke-width="5" fill="none"/><path d="M860 500 l18 -16" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
<!-- inset: different tools -->
<rect x="400" y="110" width="170" height="130" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<rect x="418" y="150" width="60" height="50" rx="8" fill="#e0a33a"/><rect x="470" y="186" width="40" height="10" fill="#e0a33a"/><circle cx="448" cy="175" r="10" fill="#fff"/>
<circle cx="530" cy="175" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M530 175 l14 -12" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
<path d="M420 240 L380 380 M560 240 L740 400" stroke="#7a4e7e" stroke-width="2" stroke-dasharray="5 6"/>
<text x="485" y="290" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">DIFFERENT TOOLS</text>
</svg>
