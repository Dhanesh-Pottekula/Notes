<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A race start: crouched runners (squeeze), the gun fires, and the runner eases off as momentum fades</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="crouch"><ellipse cx="0" cy="2" rx="40" ry="6" fill="#000" opacity=".08"/><path d="M-28 -44 l-22 22 l-20 22" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M-20 -40 l22 24 l-30 16" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/><rect x="-40" y="-56" width="30" height="20" rx="8" fill="#4a3f55"/><path d="M-30 -50 L20 -72 L28 -54 L-20 -36 z" fill="currentColor"/><path d="M22 -64 l10 64" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><circle cx="40" cy="-74" r="14" fill="#c98a5e"/><path d="M28 -78 a14 14 0 0 1 26 -4 z" fill="#2e2a2a"/></g>
<g id="run"><ellipse cx="0" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><path d="M-6 -60 l-26 26 l-24 22" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/><path d="M6 -60 l32 18 l-4 42" stroke="#c98a5e" stroke-width="12" stroke-linecap="round" fill="none"/><rect x="-22" y="-74" width="44" height="20" rx="8" fill="#4a3f55"/><path d="M-24 -68 v-40 a24 24 0 0 1 48 0 v40 z" fill="currentColor"/><rect x="-6" y="-140" width="12" height="10" fill="#c98a5e"/><circle cx="0" cy="-154" r="18" fill="#c98a5e"/><path d="M-18 -158 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/><circle cx="-20" cy="-152" r="8" fill="#2e2a2a"/></g>
</defs>
<!-- stand -->
<rect x="0" y="230" width="960" height="120" fill="#d8cdb8"/>
<g fill="#b9ad98"><circle cx="40" cy="270" r="10"/><circle cx="90" cy="276" r="10"/><circle cx="140" cy="270" r="10"/><circle cx="420" cy="272" r="10"/><circle cx="470" cy="270" r="10"/><circle cx="700" cy="270" r="10"/><circle cx="750" cy="276" r="10"/><circle cx="800" cy="270" r="10"/><circle cx="900" cy="274" r="10"/></g>
<!-- track -->
<rect x="0" y="350" width="960" height="290" fill="#c9735a"/>
<path d="M0 420 H960 M0 500 H960 M0 580 H960" stroke="#fff" stroke-width="4"/>
<path d="M920 350 V640" stroke="#fff" stroke-width="8" stroke-dasharray="14 10" opacity=".35"/>
<!-- dots row -->
<g fill="#2b2b2b"><circle cx="70" cy="110" r="10"/><circle cx="110" cy="110" r="10"/><circle cx="150" cy="110" r="10"/><circle cx="190" cy="110" r="10"/></g>
<circle cx="380" cy="110" r="11" fill="none" stroke="#8f8f8f" stroke-width="5"/>
<path d="M210 110 h150" stroke="#b9ad98" stroke-width="2" stroke-dasharray="4 6"/>
<!-- stage 1: crouched runners -->
<text x="140" y="60" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SQUEEZE</text>
<use href="#crouch" transform="translate(90 490)" color="#1f6f78"/>
<use href="#crouch" transform="translate(150 570)" color="#7a4e7e"/>
<rect x="40" y="150" width="200" height="46" rx="12" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<text x="140" y="181" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">"ON YOUR MARKS"</text>
<!-- referee with pistol, burst -->
<g transform="translate(300 430)"><use href="#man" color="#ffffff"/><path d="M26 -112 l14 -56" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z M-21 -158 h34 v4 h-34 z" fill="#e0a33a"/></g>
<rect x="334" y="262" width="22" height="10" rx="2" fill="#3d3a3a"/>
<path d="M368 226 l8 -22 l6 22 l20 -10 l-10 18 l22 4 l-22 6 l12 18 l-20 -10 l-4 22 l-8 -20 l-16 14 l4 -22 l-22 -2 l20 -10 l-14 -16 z" fill="#e0a33a"/>
<circle cx="390" cy="194" r="12" fill="#d8cdb8"/><circle cx="406" cy="182" r="8" fill="#d8cdb8"/>
<text x="460" y="200" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">FIRES</text>
<!-- stage 2: explodes forward -->
<g transform="translate(500 560) rotate(14)"><use href="#run" color="#e0a33a"/><path d="M-22 -116 l-34 20 M22 -116 l34 -14" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M440 610 h200" stroke="#2b2b2b" stroke-width="8" marker-end="url(#aK)"/>
<!-- stage 3: tiring, momentum fades -->
<text x="770" y="60" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">MOMENTUM FADES</text>
<g transform="translate(780 560) rotate(3)"><use href="#run" color="#e0a33a"/><path d="M-22 -116 l-14 36 M22 -116 l14 36" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-6 -144 q6 -4 12 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<!-- speed bar falling -->
<rect x="650" y="110" width="20" height="90" fill="#1f6f78"/><rect x="690" y="130" width="20" height="70" fill="#1f6f78"/><rect x="730" y="160" width="20" height="40" fill="#1f6f78"/>
<path d="M780 100 v80" stroke="#e07a5f" stroke-width="6" marker-end="url(#aC)"/>
</svg>
