<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A surfer already waiting past the break as the swell rises; another still running across the beach</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- lighthouse on hill -->
<path d="M0 160 q80 -60 180 0 z" fill="#b9ad98"/>
<path d="M70 130 l8 -80 h20 l8 80 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="74" y="80" width="28" height="12" fill="#e07a5f"/><rect x="78" y="40" width="20" height="12" fill="#e0a33a"/>
<!-- sea -->
<rect x="0" y="160" width="960" height="320" fill="#1f6f78" opacity=".4"/>
<!-- rising swell -->
<path d="M560 440 C 650 400 700 300 740 230 C 770 170 840 150 890 170 C 860 180 850 200 862 230 C 885 300 925 380 960 420 L960 470 L560 470 z" fill="#1f6f78" opacity=".85"/>
<path d="M740 230 C 770 170 840 150 890 170 C 860 180 850 200 862 230" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
<text x="800" y="128" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">THE MOVE</text>
<!-- white water break -->
<path d="M0 470 q60 -14 120 0 q60 14 120 0 q60 -14 120 0 q60 14 120 0 q60 -14 120 0 q60 14 120 0 q60 -14 120 0 q60 14 120 0 v20 h-960 z" fill="#fff" opacity=".9"/>
<rect x="0" y="490" width="960" height="150" fill="#f3dfb6"/>
<!-- waiting surfer on board -->
<ellipse cx="470" cy="392" rx="80" ry="10" fill="#e0a33a"/>
<g transform="translate(450 392) scale(.75)"><use href="#sit" color="#7a4e7e"/><path d="M22 -104 l30 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M500 396 q20 26 40 0" stroke="#fff" stroke-width="3" fill="none"/>
<path d="M520 380 Q640 330 720 440" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-dasharray="7 7" marker-end="url(#aP)"/>
<rect x="340" y="236" width="56" height="40" rx="10" fill="#fff" stroke="#b9ad98" stroke-width="2"/><ellipse cx="368" cy="256" rx="10" ry="12" fill="#3d3a3a"/>
<circle cx="404" cy="284" r="5" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
<text x="470" y="210" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">POSITIONED</text>
<!-- lifeguard tower -->
<path d="M30 620 l20 -130 M100 620 l-20 -130" stroke="#8a6d5a" stroke-width="7"/><rect x="24" y="460" width="82" height="40" rx="4" fill="#e07a5f"/><path d="M64 460 v-60" stroke="#3d3a3a" stroke-width="4"/><path d="M66 400 h34 l-8 12 l8 12 h-34 z" fill="#e0a33a"/>
<!-- late runner with board -->
<g transform="translate(250 610) rotate(14)"><use href="#man" color="#e07a5f"/><path d="M-26 -112 l-36 20 M26 -112 l30 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<ellipse cx="290" cy="520" rx="90" ry="12" fill="#fff" stroke="#b9ad98" stroke-width="3" transform="rotate(-10 290 520)"/>
<g fill="#e0c48e"><circle cx="190" cy="606" r="5"/><circle cx="174" cy="594" r="4"/><circle cx="160" cy="610" r="5"/></g>
<path d="M330 600 Q420 560 430 470 Q436 430 440 410" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="6 7" marker-end="url(#aK)"/>
<text x="230" y="430" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TOO LATE</text>
</svg>
