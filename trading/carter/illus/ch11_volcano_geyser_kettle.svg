<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three squeezes by timeframe: a monthly volcano, a weekly geyser and a five-minute kettle</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- FAR: volcano -->
<path d="M400 340 L600 130 h80 L880 340 z" fill="#b9ad98"/>
<path d="M560 172 L600 130 h80 L720 172 q-20 14 -40 0 q-20 14 -40 0 q-20 14 -40 0 q-20 14 -40 0 z" fill="#fff"/>
<path d="M620 132 q-10 60 -30 120 M660 132 q10 50 30 110" stroke="#e07a5f" stroke-width="7" fill="none" stroke-linecap="round"/>
<g fill="#8f8a85"><circle cx="640" cy="100" r="34"/><circle cx="600" cy="70" r="30"/><circle cx="680" cy="64" r="34"/><circle cx="640" cy="36" r="30"/><circle cx="720" cy="40" r="24"/><circle cx="570" cy="36" r="22"/></g>
<circle cx="640" cy="110" r="18" fill="#e0a33a"/>
<!-- calendar flipping -->
<rect x="250" y="80" width="60" height="58" rx="6" fill="#fff" stroke="#7a4e7e" stroke-width="3"/><rect x="250" y="80" width="60" height="16" rx="4" fill="#7a4e7e"/><rect x="260" y="70" width="60" height="58" rx="6" fill="none" stroke="#7a4e7e" stroke-width="2" opacity=".5"/>
<text x="290" y="190" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">MONTHLY</text><path d="M360 180 H530" stroke="#7a4e7e" stroke-width="2" stroke-dasharray="5 6"/>
<!-- MIDDLE: geyser -->
<rect x="0" y="340" width="960" height="120" fill="#cbbfa9"/>
<path d="M280 440 q-30 -80 -10 -180 q20 -60 40 0 q20 100 -10 180 z" fill="#cfe3e6"/>
<g fill="#e7eff0"><circle cx="270" cy="250" r="20"/><circle cx="300" cy="236" r="22"/><circle cx="290" cy="212" r="18"/></g>
<ellipse cx="290" cy="440" rx="60" ry="10" fill="#9aa3a6"/>
<path d="M380 420 h120 M380 400 h120 M390 400 v20 M440 400 v20 M490 400 v20" stroke="#6b5446" stroke-width="4"/>
<g transform="translate(410 420) scale(.45)"><use href="#man" color="#1f6f78"/></g>
<g transform="translate(460 420) scale(.45)"><use href="#wom" color="#e07a5f"/></g>
<circle cx="130" cy="380" r="26" fill="#fff" stroke="#6b5446" stroke-width="4"/><path d="M130 380 v-16 M130 380 h12" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
<text x="130" y="330" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">WEEKLY</text>
<!-- FOREGROUND: tea shop window with kettle -->
<rect x="20" y="460" width="430" height="180" fill="#6b5446"/><rect x="40" y="480" width="390" height="160" fill="#f3d9a8"/>
<rect x="80" y="590" width="200" height="50" fill="#3d3a3a"/>
<path d="M120 588 q30 -6 60 0 M140 588 v-6 M160 588 v-6" stroke="#1f6f78" stroke-width="3" fill="none"/>
<path d="M120 588 q-6 -50 50 -50 q56 0 50 50 z" fill="#b9bfc2"/><path d="M216 560 l26 -20" stroke="#b9bfc2" stroke-width="9" stroke-linecap="round"/>
<path d="M150 540 q20 -30 40 0" stroke="#3d3a3a" stroke-width="5" fill="none"/>
<path d="M246 534 q20 -20 10 -40 q20 -10 14 -30" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round"/>
<g transform="translate(360 680) scale(.9)"><use href="#man" color="#7a4e7e"/><path d="M-26 -112 l-60 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z" fill="#e07a5f"/><path d="M-20 -128 h40" stroke="#e0a33a" stroke-width="10"/></g>
<rect x="250" y="566" width="30" height="22" rx="4" fill="#fff"/>
<rect x="290" y="596" width="140" height="44" fill="#8a6d5a"/>
<circle cx="510" cy="540" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><rect x="504" y="506" width="12" height="8" fill="#3d3a3a"/><path d="M510 540 l10 -12" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
<text x="700" y="590" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">5-MINUTE</text>
<!-- matching burst arrows, linked by dotted lines -->
<path d="M910 330 V70" stroke="#e07a5f" stroke-width="18" marker-end="url(#aC)"/>
<path d="M560 420 V330" stroke="#e07a5f" stroke-width="10" marker-end="url(#aC)"/>
<path d="M560 600 V556" stroke="#e07a5f" stroke-width="5" marker-end="url(#aC)"/>
<path d="M200 380 H545 M520 560 H545" stroke="#7a4e7e" stroke-width="2" stroke-dasharray="5 6" fill="none"/>
</svg>
