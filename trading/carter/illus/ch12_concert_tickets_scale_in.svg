<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Scaling into concert tickets on the rumour: an average price well below the breakout crowd's price</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="tag"><path d="M0 0 h56 l16 18 l-16 18 h-56 z" fill="#fff" stroke="#e07a5f" stroke-width="3"/><circle cx="58" cy="18" r="4" fill="#e07a5f"/><path d="M10 12 h30 M10 24 h20" stroke="#e07a5f" stroke-width="4"/></g>
<g id="tix"><rect x="-14" y="-10" width="28" height="18" rx="2" fill="#e0a33a" stroke="#b7802a" stroke-width="2"/><path d="M4 -10 v18" stroke="#b7802a" stroke-width="2" stroke-dasharray="3 3"/></g>
</defs>
<!-- stage panels -->
<rect x="0" y="0" width="318" height="640" fill="#2f3b5c" opacity=".18"/>
<path d="M320 120 V620 M640 120 V620" stroke="#d8cdb8" stroke-width="3"/>
<rect x="0" y="600" width="960" height="40" fill="#d8cdb8"/>
<!-- stage 1: night, bed, rumour poster -->
<circle cx="60" cy="370" r="18" fill="#fff" opacity=".9"/><circle cx="68" cy="364" r="16" fill="#cfd3da"/>
<rect x="190" y="320" width="100" height="110" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
<ellipse cx="226" cy="396" rx="18" ry="14" fill="#7a4e7e"/><path d="M234 388 l26 -40" stroke="#7a4e7e" stroke-width="6"/>
<text x="270" y="388" text-anchor="middle" font-size="32" font-weight="800" fill="#e07a5f">?</text>
<rect x="30" y="540" width="270" height="60" rx="8" fill="#8a6d5a"/><rect x="30" y="520" width="80" height="26" rx="10" fill="#fff"/>
<g transform="translate(150 560)"><use href="#sit" color="#7a4e7e"/><path d="M22 -104 l36 10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="54" y="-110" width="14" height="22" rx="3" fill="#2b2b2b"/></g>
<use href="#tix" transform="translate(230 490)"/><use href="#tix" transform="translate(262 482)"/>
<!-- stage 2: canteen, friends with phones -->
<rect x="350" y="510" width="220" height="14" rx="4" fill="#8a6d5a"/><rect x="452" y="524" width="16" height="76" fill="#6b5446"/>
<g transform="translate(400 600)"><use href="#sit" color="#7a4e7e"/><path d="M22 -104 l36 10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="54" y="-110" width="14" height="22" rx="3" fill="#2b2b2b"/></g>
<g transform="translate(580 600)"><use href="#man" color="#1f6f78"/><path d="M-26 -112 l-14 -50" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="-48" y="-186" width="14" height="22" rx="3" fill="#2b2b2b"/></g>
<path d="M500 400 v-30 l16 -6 v26 M500 400 a6 5 0 1 1 -1 0 M516 394 a6 5 0 1 1 -1 0" stroke="#7a4e7e" stroke-width="3" fill="#7a4e7e"/>
<use href="#tix" transform="translate(480 496)"/><use href="#tix" transform="translate(512 490)"/>
<!-- rising price tags + average line -->
<use href="#tag" transform="translate(120 280)"/>
<use href="#tag" transform="translate(440 200)"/>
<path d="M100 324 H260 V244 H530" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="2 5"/>
<path d="M60 258 H940" stroke="#1f6f78" stroke-width="4" stroke-dasharray="10 8"/>
<text x="310" y="170" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SCALE IN</text>
<text x="800" y="300" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">AVERAGE PRICE</text>
<!-- stage 3: queue at the stadium, big price tag -->
<rect x="650" y="400" width="310" height="200" fill="#cbbfa9"/>
<rect x="880" y="430" width="70" height="170" fill="#7a4e7e"/><rect x="890" y="450" width="50" height="40" fill="#fff"/>
<g transform="translate(760 70) scale(1.7)"><use href="#tag"/></g>
<path d="M822 140 V250" stroke="#e07a5f" stroke-width="3" stroke-dasharray="4 5"/>
<g transform="translate(800 600)"><use href="#man" color="#e07a5f"/><path d="M26 -112 l6 -40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M0 -196 q30 -30 60 0 z" fill="#1f6f78"/><path d="M30 -196 v44" stroke="#3d3a3a" stroke-width="3"/></g>
<g transform="translate(870 600)"><use href="#wom" color="#e0a33a"/></g>
<text x="800" y="370" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">BREAKOUT CROWD</text>
<!-- she walks past, relaxed, fan of tickets -->
<g transform="translate(700 610)"><use href="#wom" color="#7a4e7e"/><path d="M20 -108 l26 -30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-12 -150 h24" stroke="#2b2b2b" stroke-width="7"/></g>
<g transform="translate(748 462)"><use href="#tix" transform="rotate(-30)"/><use href="#tix" transform="rotate(-10)"/><use href="#tix" transform="rotate(10)"/><use href="#tix" transform="rotate(30)"/></g>
</svg>
