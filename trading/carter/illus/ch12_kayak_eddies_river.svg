<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A kayaker in a small upstream eddy while the whole river flows downhill</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="kay"><path d="M0 -60 q18 30 0 120 q-18 -90 0 -120 z" fill="#e07a5f"/><ellipse cx="0" cy="4" rx="9" ry="14" fill="#3d3a3a"/><circle cx="0" cy="0" r="10" fill="#e0a33a"/><circle cx="0" cy="-2" r="7" fill="#c0392b"/></g>
</defs>
<!-- banks -->
<rect x="0" y="0" width="960" height="640" fill="#a9c08e"/>
<path d="M300 0 C 270 200 350 420 300 640 L 690 640 C 730 420 620 200 660 0 z" fill="#f3dfb6"/>
<path d="M330 0 C 300 200 380 420 340 640 L 650 640 C 690 420 590 200 630 0 z" fill="#1f6f78" opacity=".75"/>
<!-- faint footbridge -->
<path d="M240 40 Q480 80 720 40" stroke="#6b5446" stroke-width="4" fill="none" opacity=".5"/><path d="M300 52 v-30 M660 52 v-30" stroke="#6b5446" stroke-width="4" opacity=".5"/>
<!-- big downstream arrow -->
<path d="M450 70 H510 V520 H550 L480 610 L410 520 H450 z" fill="#fff" opacity=".35"/>
<text x="480" y="300" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle" transform="rotate(90 480 300)">HOURLY CHART</text>
<!-- boulder + eddy -->
<ellipse cx="580" cy="240" rx="40" ry="26" fill="#8f8a85"/><ellipse cx="572" cy="234" rx="24" ry="12" fill="#a8a29c"/>
<path d="M556 380 a40 40 0 1 1 46 -6" stroke="#fff" stroke-width="4" fill="none" marker-end="url(#aK)"/>
<use href="#kay" transform="translate(580 340)"/>
<path d="M560 320 l40 20" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/><path d="M556 316 l8 8 M596 336 l8 8" stroke="#e0a33a" stroke-width="7" stroke-linecap="round"/>
<text x="790" y="330" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">5-MIN CHART</text>
<path d="M690 320 h-60" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<!-- dotted path: from upstream, into the eddy, back out, far downstream -->
<path d="M420 10 C 430 120 520 200 545 290 M600 400 C 560 450 470 480 440 540" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="6 7"/>
<g opacity=".35"><use href="#kay" transform="translate(430 570) rotate(15)"/></g>
<!-- guide on the bank -->
<g transform="translate(180 470)"><use href="#man" color="#1f6f78"/><path d="M26 -112 l50 30 M-26 -112 l-8 40" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z M-21 -158 h34 v4 h-34 z" fill="#e0a33a"/></g>
<path d="M250 400 l40 60" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<g fill="#5f8a4e"><circle cx="80" cy="120" r="40"/><circle cx="130" cy="90" r="34"/><circle cx="850" cy="520" r="44"/><circle cx="900" cy="560" r="36"/><circle cx="860" cy="110" r="36"/></g>
</svg>
