<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One surfer, two exits: step off when the first push fades, or keep half riding the deep C wave</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- shore with palms and lighthouse -->
<rect x="0" y="300" width="150" height="340" fill="#f3dfb6"/>
<path d="M40 300 l6 -150 h20 l6 150 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="46" y="190" width="24" height="16" fill="#e07a5f"/><rect x="44" y="236" width="28" height="16" fill="#e07a5f"/><rect x="48" y="130" width="20" height="20" fill="#e0a33a"/>
<path d="M110 300 q-6 -80 14 -150" stroke="#8a6d5a" stroke-width="9" fill="none" stroke-linecap="round"/>
<path d="M124 150 q-36 -14 -56 8 M124 150 q-20 -30 -50 -26 M124 150 q24 -30 56 -20 M124 150 q36 -4 50 24" stroke="#5f8a4e" stroke-width="9" fill="none" stroke-linecap="round"/>
<!-- sea -->
<rect x="150" y="320" width="810" height="320" fill="#1f6f78" opacity=".35"/>
<path d="M150 330 C 300 330 380 250 520 240 C 640 232 720 300 960 320 L960 340 L150 340 z" fill="#1f6f78" opacity=".55"/>
<!-- deep C wave under the surface -->
<path d="M200 600 C 260 440 420 400 560 400 C 700 400 820 470 900 600 z" fill="#3f6f98" opacity=".4"/>
<path d="M640 480 H330" stroke="#2b2b2b" stroke-width="6" marker-end="url(#aK)" opacity=".8"/>
<text x="560" y="550" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">C WAVE</text>
<!-- exit 1: steps off as the push fades -->
<path d="M820 236 l8 -22 l6 22 l20 -10 l-10 18 l22 4 l-22 6 l12 18 l-20 -10 l-4 22 l-8 -20 l-16 14 l4 -22 l-22 -2 l20 -10 l-14 -16 z" fill="#e0a33a" opacity=".45"/>
<ellipse cx="700" cy="300" rx="70" ry="9" fill="#e0a33a"/>
<g transform="translate(790 350) rotate(16)"><use href="#man" color="#3a6fb0"/><path d="M-26 -112 l-30 20 M26 -112 l30 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M676 282 h-40" stroke="#2b2b2b" stroke-width="4" marker-end="url(#aK)"/><path d="M630 270 v24" stroke="#2b2b2b" stroke-width="4"/>
<text x="770" y="110" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">EXIT 1</text>
<!-- exit 2: half weight keeps riding -->
<ellipse cx="460" cy="252" rx="70" ry="9" fill="#e0a33a"/>
<g opacity=".6" transform="translate(460 244) scale(1 .92)"><use href="#man" color="#3a6fb0"/><path d="M-26 -112 l-44 -6 M26 -112 l44 -6" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M390 220 C 320 220 260 260 180 300" stroke="#2b2b2b" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#aK)"/>
<text x="460" y="56" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">EXIT 2</text>
<!-- inset: board stalled, nothing lost -->
<rect x="700" y="490" width="236" height="130" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<path d="M716 580 h204" stroke="#1f6f78" stroke-width="4"/>
<ellipse cx="780" cy="574" rx="46" ry="6" fill="#e0a33a"/>
<g transform="translate(780 570) scale(.42)"><use href="#man" color="#3a6fb0"/><path d="M-26 -112 l-30 -20 M26 -112 l30 -20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<text x="880" y="560" text-anchor="middle" font-size="48" font-weight="800" fill="#7a4e7e">0</text>
</svg>
