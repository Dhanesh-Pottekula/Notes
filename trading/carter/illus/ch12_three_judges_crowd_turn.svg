<path d="M760 330 Q760 420 416 482 L416 482 L448 482 L480 482 L512 482 L544 482 L576 482 L608 482 L640 482 L685 493 L707 523 L707 561 L685 591 L634 602 L602 602 L570 602 L538 602 L506 602 L474 602 L442 602 L410 602 L378 602 L346 602 L314 602 L282 602 L250 602 L218 602 L186 602 L154 602 L122 602 L90 602" stroke="#7a4e7e" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
