<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A car braking for a speed bump: the last bar looks like a turn, six bars show the same direction</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="car"><path d="M-48 -10 v-16 q0 -6 8 -8 l14 -4 l10 -14 h34 l14 14 l14 2 q6 2 6 10 v16 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/><path d="M-20 -38 l8 -10 h12 v10 z M6 -38 v-10 h14 l8 10 z" fill="#9fc3d1"/><circle cx="-28" cy="-8" r="9" fill="#3d3a3a"/><circle cx="30" cy="-8" r="9" fill="#3d3a3a"/></g>
</defs>
<!-- dunes -->
<path d="M0 360 q120 -50 240 0 q140 -60 280 0 q160 -50 440 -20 V640 H0 z" fill="#ecd4a2"/>
<path d="M0 470 q160 -40 320 0 q200 -40 640 -30 V640 H0 z" fill="#e3c48c"/>
<!-- town on the horizon -->
<g fill="#cbbfa9"><rect x="860" y="270" width="24" height="40"/><rect x="888" y="256" width="30" height="54"/><rect x="920" y="276" width="20" height="34"/></g>
<!-- road -->
<path d="M0 560 L960 300 L960 330 L0 640 z" fill="#8f8a85"/>
<path d="M0 600 L960 315" stroke="#fff" stroke-width="3" stroke-dasharray="20 18"/>
<!-- ghost cars -->
<g opacity=".3"><use href="#car" transform="translate(60 592) rotate(-16) scale(.8)"/><use href="#car" transform="translate(145 567) rotate(-16) scale(.8)"/><use href="#car" transform="translate(230 542) rotate(-16) scale(.8)"/><use href="#car" transform="translate(315 516) rotate(-16) scale(.8)"/><use href="#car" transform="translate(400 491) rotate(-16) scale(.8)"/><use href="#car" transform="translate(485 466) rotate(-16) scale(.8)"/></g>
<text x="270" y="620" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle" transform="rotate(-15 270 620)">SIX BARS</text>
<!-- the car on the speed bump -->
<g transform="translate(618 431) rotate(-16)"><rect x="-8" y="-6" width="16" height="14" rx="4" fill="#e0a33a"/><path d="M-8 -2 h16 M-8 4 h16" stroke="#2b2b2b" stroke-width="3"/></g>
<use href="#car" transform="translate(590 429) rotate(-20)"/>
<circle cx="544" cy="425" r="7" fill="#e07a5f"/><circle cx="544" cy="425" r="14" fill="#e07a5f" opacity=".3"/>
<!-- bold arrow ahead -->
<path d="M660 374 L850 318" stroke="#2b2b2b" stroke-width="10" marker-end="url(#aK)"/>
<text x="680" y="200" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">STILL THE SAME DIRECTION</text>
<path d="M740 214 l10 150" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="4 6"/>
<!-- inset: last ten metres only -->
<text x="180" y="62" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LAST BAR</text>
<rect x="30" y="84" width="300" height="190" rx="16" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
<rect x="44" y="210" width="272" height="40" fill="#8f8a85"/>
<rect x="210" y="196" width="40" height="14" fill="#e0a33a"/>
<use href="#car" transform="translate(150 222) scale(1.4)"/>
<circle cx="88" cy="206" r="9" fill="#e07a5f"/><circle cx="88" cy="206" r="18" fill="#e07a5f" opacity=".3"/>
<text x="270" y="170" text-anchor="middle" font-size="60" font-weight="800" fill="#e07a5f">?</text>
<path d="M330 200 L560 405" stroke="#e07a5f" stroke-width="2" stroke-dasharray="5 6"/>
<!-- calm man at a dhaba with tea -->
<rect x="760" y="440" width="190" height="14" fill="#8a6d5a"/><path d="M770 454 v130 M940 454 v130" stroke="#6b5446" stroke-width="7"/>
<g transform="translate(860 600)"><use href="#man" color="#ffffff"/><path d="M26 -112 l-10 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="8" y="-96" width="14" height="20" rx="2" fill="#e0a33a" opacity=".8"/><path d="M-22 -164 q22 -24 44 0 q-22 -6 -44 0 z" fill="#e07a5f"/><path d="M-22 -164 a22 14 0 0 1 44 0" fill="#e07a5f"/></g>
</svg>
