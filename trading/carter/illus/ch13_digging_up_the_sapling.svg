<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Digging up the sapling in every gust versus letting the mango tree grow through windy days</title>
<defs>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="sap"><path d="M0 0 q-4 -30 2 -60" stroke="#6b5446" stroke-width="5" fill="none"/><ellipse cx="-10" cy="-50" rx="12" ry="6" fill="#6f9a5e"/><ellipse cx="12" cy="-60" rx="12" ry="6" fill="#6f9a5e"/></g>
<g id="tree"><path d="M-16 0 q-6 -120 10 -200 h12 q8 80 10 200 z" fill="#8a6d5a"/><circle cx="0" cy="-260" r="80"/><circle cx="-70" cy="-210" r="56"/><circle cx="70" cy="-210" r="56"/></g>
</defs>
<line x1="480" y1="30" x2="480" y2="610" stroke="#b9ad98" stroke-width="10"/>
<rect x="0" y="560" width="960" height="80" fill="#c9a77d"/>
<!-- LEFT: exiting early -->
<text x="240" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">EXITING EARLY</text>
<path d="M300 160 q30 -20 60 0 q30 20 60 0 M280 200 q30 -20 60 0 q30 20 60 0" stroke="#b9ad98" stroke-width="4" fill="none" stroke-linecap="round"/>
<g transform="translate(330 560) rotate(16)"><use href="#sap"/></g>
<g transform="translate(250 560)"><use href="#sit" color="#ffffff"/><path d="M22 -104 l44 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M300 470 l40 96" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/><path d="M330 556 l22 -8 l6 22 z" fill="#9aa3a6"/>
<path d="M-6 -136 q7 -5 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" transform="translate(250 560)"/>
<!-- uprooted saplings wilting -->
<g transform="translate(60 556) rotate(-80)"><use href="#sap"/><circle cx="0" cy="4" r="7" fill="#8a6d5a"/></g>
<g transform="translate(110 556) rotate(-80)"><use href="#sap"/><circle cx="0" cy="4" r="7" fill="#8a6d5a"/></g>
<g transform="translate(160 556) rotate(-80)"><use href="#sap"/><circle cx="0" cy="4" r="7" fill="#8a6d5a"/></g>
<!-- small basket, seed packet -->
<path d="M390 600 l-8 -30 h70 l-8 30 z" fill="#8a6d5a"/><ellipse cx="410" cy="568" rx="7" ry="4" fill="#6f9a5e"/>
<rect x="60" y="590" width="34" height="40" rx="3" fill="#e0a33a"/><circle cx="77" cy="608" r="6" fill="#6f9a5e"/>
<!-- RIGHT: let it run -->
<text x="720" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LET IT RUN</text>
<g opacity=".25" fill="none" stroke="#5f8a4e" stroke-width="4" stroke-dasharray="8 6"><use href="#tree" transform="translate(760 560) skewX(-12)" fill="none"/></g>
<g fill="none" stroke="#5f8a4e" stroke-width="3" stroke-dasharray="8 6" opacity=".5"><circle cx="820" cy="300" r="80"/><circle cx="890" cy="350" r="56"/></g>
<text x="820" y="150" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">WINDY DAYS</text>
<use href="#tree" transform="translate(720 560)" fill="#5f8a4e"/>
<g fill="#e0a33a"><circle cx="680" cy="270" r="9"/><circle cx="720" cy="320" r="9"/><circle cx="760" cy="260" r="9"/><circle cx="660" cy="350" r="9"/><circle cx="780" cy="350" r="9"/><circle cx="700" cy="230" r="9"/></g>
<!-- charpai + woman -->
<rect x="560" y="520" width="150" height="16" rx="4" fill="#8a6d5a"/><path d="M570 536 v30 M700 536 v30" stroke="#6b5446" stroke-width="7"/>
<g transform="translate(610 534)"><use href="#sit" color="#e07a5f"/><path d="M-6 -132 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<path d="M800 600 l-8 -34 h80 l-8 34 z" fill="#8a6d5a"/>
<g fill="#e0a33a"><circle cx="808" cy="562" r="10"/><circle cx="828" cy="556" r="10"/><circle cx="848" cy="560" r="10"/><circle cx="866" cy="564" r="9"/><circle cx="838" cy="546" r="9"/></g>
<!-- growth arrow -->
<g transform="translate(540 560) scale(.8)"><use href="#sap"/></g>
<path d="M550 500 C 540 380 580 200 650 150" stroke="#1f6f78" stroke-width="5" fill="none" marker-end="url(#aT)"/>
</svg>
