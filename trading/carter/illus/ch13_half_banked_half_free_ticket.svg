<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Half the position banked as cash to sleep on, the other half a free Ferris wheel ticket worth at worst zero</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- LEFT: bank counter -->
<text x="220" y="62" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">HALF BANKED</text>
<rect x="200" y="300" width="230" height="140" fill="#dfe9ec" opacity=".8"/><path d="M200 300 h230 M315 300 v140" stroke="#b9ad98" stroke-width="4"/>
<g transform="translate(340 520)"><use href="#wom" color="#7a4e7e"/><path d="M-20 -108 l-20 26" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<rect x="190" y="440" width="250" height="160" fill="#8a6d5a"/><rect x="190" y="440" width="250" height="16" fill="#6b5446"/>
<g transform="translate(110 600)"><use href="#man" color="#ffffff"/><path d="M26 -112 l70 -6" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-6 -136 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<rect x="196" y="470" width="44" height="26" rx="3" fill="#5f8a4e"/><rect x="200" y="462" width="44" height="26" rx="3" fill="#6f9a5e"/>
<!-- inset: sleeping peacefully -->
<rect x="30" y="94" width="230" height="140" rx="14" fill="#2f3b5c"/>
<circle cx="220" cy="128" r="16" fill="#f3e3b0"/><circle cx="228" cy="122" r="14" fill="#2f3b5c"/>
<rect x="50" y="190" width="190" height="28" rx="6" fill="#8a6d5a"/><rect x="56" y="168" width="50" height="22" rx="8" fill="#fff"/>
<circle cx="84" cy="164" r="14" fill="#c98a5e"/><path d="M90 174 q60 -16 140 2 v14 h-140 z" fill="#1f6f78"/>
<path d="M76 164 q4 3 8 0 M88 164 q4 3 8 0" stroke="#2b2b2b" stroke-width="2" fill="none"/>
<text x="140" y="146" font-size="22" font-weight="800" fill="#f3e3b0" text-anchor="middle">z z</text>
<path d="M128 234 l-14 30" stroke="#2f3b5c" stroke-width="4"/>
<!-- connecting arrow -->
<path d="M320 200 C 400 120 470 120 520 170" stroke="#7a4e7e" stroke-width="5" fill="none" marker-end="url(#aP)"/>
<!-- RIGHT: Ferris wheel at the mela -->
<g stroke="#6b5446" stroke-width="10" stroke-linecap="round"><path d="M700 300 L610 600 M700 300 L790 600"/></g>
<circle cx="700" cy="300" r="190" fill="none" stroke="#e0a33a" stroke-width="10"/>
<path d="M510 300 H890 M700 110 V490 M566 166 L834 434 M566 434 L834 166" stroke="#e0a33a" stroke-width="4"/>
<g fill="#e07a5f"><circle cx="700" cy="110" r="7"/><circle cx="834" cy="166" r="7"/><circle cx="890" cy="300" r="7"/><circle cx="834" cy="434" r="7"/><circle cx="566" cy="166" r="7"/><circle cx="510" cy="300" r="7"/></g>
<circle cx="700" cy="300" r="18" fill="#6b5446"/>
<!-- carriage with the man and his free ticket -->
<path d="M566 434 v20" stroke="#3d3a3a" stroke-width="4"/>
<g transform="translate(566 520) scale(.8)"><use href="#man" color="#ffffff"/><path d="M-26 -112 l-30 -40 M26 -112 l34 -46" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-6 -136 q7 8 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<path d="M516 454 h100 l-10 64 h-80 z" fill="#1f6f78"/>
<rect x="580" y="352" width="64" height="40" rx="4" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
<text x="612" y="384" text-anchor="middle" font-size="32" font-weight="800" fill="#e07a5f">0</text>
<rect x="420" y="318" width="0" height="0"/>
<text x="430" y="300" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">FREE</text><text x="430" y="332" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TICKET</text>
<path d="M486 330 l90 30" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<!-- safety net -->
<path d="M480 590 Q560 610 650 590" stroke="#2b2b2b" stroke-width="2" fill="none"/>
<path d="M480 590 v-24 M650 590 v-24 M500 596 l20 -20 M530 600 l20 -24 M560 602 l20 -24 M590 600 l20 -22 M620 596 l16 -18" stroke="#2b2b2b" stroke-width="2"/>
<!-- two-bar exit sign -->
<rect x="886" y="530" width="8" height="80" fill="#6b5446"/><rect x="846" y="520" width="90" height="46" rx="6" fill="#fff" stroke="#6b5446" stroke-width="3"/>
<circle cx="874" cy="543" r="12" fill="#c0392b"/><circle cx="908" cy="543" r="12" fill="#c0392b"/>
<text x="852" y="505" font-size="22" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TWO-BAR EXIT</text>
<rect x="0" y="600" width="960" height="40" fill="#d8cdb8"/>
</svg>
