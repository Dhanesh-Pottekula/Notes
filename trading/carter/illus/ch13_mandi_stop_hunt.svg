<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A big buyer's stop run in a grain mandi: a quick dip fills the sellers' stops, then price recovers</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="sit"><ellipse cx="10" cy="2" rx="34" ry="6" fill="#000" opacity=".08"/><rect x="-14" y="-66" width="58" height="16" rx="7" fill="#4a3f55"/><rect x="30" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -56 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-130" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-146" r="20" fill="#c98a5e"/><path d="M-20 -150 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="sack"><path d="M-26 0 q-8 -40 6 -56 h40 q14 16 6 56 z" fill="#e8dcc4" stroke="#b9ad98" stroke-width="3"/><path d="M-18 -56 q18 -10 36 0" stroke="#b9ad98" stroke-width="4" fill="none"/></g>
</defs>
<!-- shed roof and pillar with price board -->
<path d="M0 30 L480 0 L960 30" stroke="#8a6d5a" stroke-width="10" fill="none"/>
<rect x="440" y="30" width="20" height="540" fill="#8a6d5a"/>
<rect x="340" y="60" width="220" height="120" rx="6" fill="#3d3a3a"/>
<path d="M360 90 L420 92 L460 160 L480 140 L540 96" stroke="#fff" stroke-width="4" fill="none"/>
<path d="M440 110 L460 152" stroke="#e07a5f" stroke-width="6" marker-end="url(#aC)"/>
<rect x="0" y="570" width="960" height="70" fill="#d8cdb8"/>
<!-- wheat heap -->
<path d="M560 570 q80 -90 160 0 z" fill="#e0a33a"/>
<!-- big trader on sacks -->
<use href="#sack" transform="translate(480 570)"/><use href="#sack" transform="translate(540 570)"/><use href="#sack" transform="translate(510 520)"/>
<g transform="translate(500 470)"><use href="#sit" color="#ffffff"/><path d="M-26 -112 l-40 22" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-12 -122 q12 12 24 0" stroke="#e0a33a" stroke-width="3" fill="none"/><path d="M-6 -136 q7 6 14 0" stroke="#2b2b2b" stroke-width="2.5" fill="none"/></g>
<rect x="420" y="340" width="34" height="20" rx="2" fill="#6f9a5e"/>
<text x="500" y="250" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">BIG BUYER</text>
<!-- helper tipping a sack off the cart, dust -->
<rect x="610" y="440" width="120" height="16" rx="4" fill="#8a6d5a"/><circle cx="640" cy="470" r="18" fill="#6b5446"/><circle cx="700" cy="470" r="18" fill="#6b5446"/>
<use href="#sack" transform="translate(650 440)"/>
<g transform="translate(640 560) rotate(50)"><use href="#sack"/></g>
<g fill="#d8cdb8" opacity=".9"><circle cx="600" cy="540" r="22"/><circle cx="630" cy="520" r="18"/><circle cx="580" cy="512" r="14"/></g>
<g transform="translate(780 570)"><use href="#man" color="#1f6f78"/><path d="M-26 -112 l-40 0" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<!-- small sellers pushing sacks, red tags snapping at the line -->
<path d="M330 380 V600" stroke="#2b2b2b" stroke-width="3" stroke-dasharray="8 7"/>
<g transform="translate(110 570)"><use href="#man" color="#e0a33a"/><path d="M26 -112 l40 20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z" fill="#e07a5f"/></g>
<use href="#sack" transform="translate(190 570)"/>
<g transform="translate(260 570)"><use href="#man" color="#7a4e7e"/><path d="M26 -112 l40 20" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M-21 -156 a21 21 0 0 1 42 0 z" fill="#ffffff"/></g>
<use href="#sack" transform="translate(340 570)"/>
<path d="M200 516 l-14 -26" stroke="#2b2b2b" stroke-width="2"/><rect x="176" y="474" width="18" height="18" rx="3" fill="#c0392b"/>
<path d="M350 516 l6 -18 M360 494 l6 -14" stroke="#2b2b2b" stroke-width="2"/><rect x="356" y="462" width="18" height="18" rx="3" fill="#c0392b" transform="rotate(30 365 471)"/>
<path d="M340 470 l-10 -10 M376 476 l12 -8 M352 452 l2 -14" stroke="#e07a5f" stroke-width="3" stroke-linecap="round"/>
<text x="200" y="300" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">STOP RUN</text>
<path d="M260 314 l80 130" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
<!-- inset: an hour later -->
<text x="810" y="90" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">PRICE RECOVERS</text>
<rect x="690" y="106" width="246" height="230" rx="14" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
<rect x="710" y="122" width="120" height="80" rx="4" fill="#3d3a3a"/>
<path d="M720 140 L745 180 L770 160 L815 132" stroke="#fff" stroke-width="3" fill="none"/>
<path d="M770 166 L812 134" stroke="#1f6f78" stroke-width="5" marker-end="url(#aT)"/>
<g transform="translate(870 326) scale(.55)"><use href="#sack" transform="translate(-50 0)"/><use href="#sack" transform="translate(10 0)"/><use href="#sack" transform="translate(70 0)"/><use href="#sack" transform="translate(-20 -56)"/><use href="#sack" transform="translate(40 -56)"/><use href="#sack" transform="translate(10 -112)"/></g>
<g transform="translate(760 326) scale(.6)"><use href="#sit" color="#ffffff"/><path d="M22 -104 l16 -30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/><rect x="30" y="-150" width="16" height="20" rx="2" fill="#e0a33a"/></g>
</svg>
