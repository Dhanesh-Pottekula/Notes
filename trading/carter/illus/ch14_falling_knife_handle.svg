<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A falling knife: don't grab the blade mid-air; wait for three bounces, then pick it up by the handle</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="knife"><path d="M0 0 h60 q14 0 22 -8 q-10 -6 -22 -6 h-60 z" fill="#d6dde0" stroke="#9aa3a6" stroke-width="2"/><rect x="-36" y="-12" width="38" height="14" rx="5" fill="#2b2b2b"/></g>
</defs>
<!-- window + plant -->
<rect x="700" y="40" width="200" height="150" rx="6" fill="#fff" opacity=".7"/><path d="M800 40 v150" stroke="#d8cdb8" stroke-width="4"/>
<!-- counter -->
<rect x="40" y="220" width="600" height="30" fill="#6e6a6a"/><rect x="60" y="250" width="560" height="330" fill="#8a6d5a"/>
<circle cx="120" cy="196" r="24" fill="#8a6d5a"/><rect x="200" y="206" width="140" height="14" rx="3" fill="#cbbfa9"/><g fill="#6f9a5e"><circle cx="230" cy="200" r="8"/><circle cx="260" cy="202" r="8"/></g>
<path d="M420 220 v-44 q0 -10 10 -10 h60 q10 0 10 10 v44 z" fill="#9aa3a6"/><rect x="448" y="152" width="24" height="14" rx="4" fill="#3d3a3a"/>
<rect x="0" y="580" width="960" height="60" fill="#d8cdb8"/><path d="M120 580 v60 M240 580 v60 M360 580 v60 M480 580 v60 M600 580 v60 M720 580 v60 M840 580 v60" stroke="#cbbfa9" stroke-width="3"/>
<!-- spinning knife falling -->
<g opacity=".3"><use href="#knife" transform="translate(640 250) rotate(20)"/></g>
<g opacity=".5"><use href="#knife" transform="translate(680 340) rotate(120)"/></g>
<use href="#knife" transform="translate(660 430) rotate(230)"/>
<path d="M740 300 q14 30 0 60 M760 400 q14 30 0 60" stroke="#b9ad98" stroke-width="4" fill="none" stroke-linecap="round"/>
<text x="820" y="300" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">STILL FALLING</text>
<!-- young man lunging at the blade -->
<g transform="translate(500 580) rotate(18)"><use href="#man" color="#1f6f78"/><path d="M26 -112 l70 -10" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<path d="M630 456 l6 -18 l6 16 l16 -8 l-8 14 l16 4 l-16 6 l8 14 l-16 -8 l-4 16 l-6 -16 l-14 10 l4 -16 l-16 -2 l14 -8 z" fill="#c0392b"/>
<!-- bounce marks on the tiles -->
<path d="M560 576 q20 -40 40 0 M620 576 q16 -28 32 0 M670 576 q12 -16 24 0" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="4 4"/>
<g font-size="18" font-weight="800" fill="#7a4e7e" text-anchor="middle"><text x="580" y="526">1</text><text x="636" y="540">2</text><text x="682" y="552">3</text></g>
<use href="#knife" transform="translate(712 578)"/>
<text x="620" y="624" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">3 BOUNCES</text>
<!-- mother, calm, hands behind back -->
<g transform="translate(860 580)"><use href="#wom" color="#e0a33a"/><path d="M-20 -108 l14 30 M20 -108 l-14 30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-22 -112 l40 20" stroke="#fff" stroke-width="8" opacity=".8"/></g>
<!-- inset: pick it up by the handle when still -->
<rect x="40" y="24" width="270" height="130" rx="14" fill="#fff" stroke="#1f6f78" stroke-width="3"/>
<rect x="56" y="126" width="238" height="16" fill="#d8cdb8"/>
<use href="#knife" transform="translate(140 126) scale(1.2)"/>
<path d="M140 40 L114 98" stroke="#d9a27a" stroke-width="18" stroke-linecap="round"/><circle cx="112" cy="108" r="14" fill="#d9a27a"/>
<path d="M240 60 l10 10 l20 -24" stroke="#1f6f78" stroke-width="6" fill="none" stroke-linecap="round"/>
<text x="410" y="74" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">NOW PICK</text><text x="410" y="104" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">IT UP</text>
<path d="M332 90 h-40" stroke="#2b2b2b" stroke-width="3" marker-end="url(#aK)"/>
</svg>
