<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Stop and reverse as a swing door: one double-strength shove from fully open one way to fully open the other</title>
<defs>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- plan view: dining (left), kitchen (right) -->
<rect x="24" y="24" width="452" height="592" fill="#f2dfb8"/>
<rect x="484" y="24" width="452" height="592" fill="#eef2f3"/>
<text x="240" y="76" font-size="38" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">LONG</text>
<text x="720" y="76" font-size="38" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">SHORT</text>
<!-- dining tables -->
<g fill="#8a6d5a"><circle cx="110" cy="190" r="34"/><circle cx="110" cy="420" r="34"/></g>
<g fill="#7a4e7e"><circle cx="60" cy="190" r="12"/><circle cx="160" cy="190" r="12"/><circle cx="60" cy="420" r="12"/><circle cx="160" cy="420" r="12"/></g>
<!-- kitchen counters + stove -->
<rect x="860" y="120" width="60" height="380" rx="6" fill="#b9bfc2"/><circle cx="890" cy="180" r="16" fill="#3d3a3a"/><circle cx="890" cy="240" r="16" fill="#3d3a3a"/>
<!-- head chef seen from above -->
<ellipse cx="800" cy="440" rx="34" ry="20" fill="#fff" stroke="#d8cdb8" stroke-width="2"/><circle cx="800" cy="440" r="16" fill="#fff" stroke="#cbbfa9" stroke-width="3"/>
<!-- wall with door gap -->
<path d="M480 24 V180 M480 420 V616" stroke="#6b5446" stroke-width="14"/>
<!-- ghost door fully open toward dining -->
<rect x="280" y="174" width="200" height="12" rx="4" fill="none" stroke="#6b5446" stroke-width="3" stroke-dasharray="8 6"/>
<circle cx="380" cy="180" r="0"/>
<!-- door now fully open toward kitchen -->
<rect x="480" y="174" width="200" height="12" rx="4" fill="#8a6d5a"/><circle cx="600" cy="180" r="8" fill="#cfe3e6" stroke="#6b5446" stroke-width="2"/>
<circle cx="480" cy="180" r="9" fill="#3d3a3a"/>
<!-- one big double-thick sweep -->
<path d="M290 210 A190 190 0 0 0 670 210" stroke="#e07a5f" stroke-width="22" fill="none"/>
<path d="M290 210 A190 190 0 0 0 670 210" stroke="#f6f1e7" stroke-width="6" fill="none"/>
<path d="M650 196 l40 14 l-30 30 z" fill="#e07a5f"/>
<path d="M466 384 l18 12 l-18 12 M486 384 l18 12 l-18 12" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="480" y="460" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">ONE DOUBLE ORDER</text>
<!-- waiter from above with tray, pushing through -->
<ellipse cx="560" cy="250" rx="36" ry="20" fill="#2b2b2b"/><circle cx="560" cy="250" r="14" fill="#2e2a2a"/>
<path d="M592 244 l20 -10" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
<circle cx="626" cy="228" r="22" fill="#cbbfa9"/><circle cx="618" cy="222" r="7" fill="#e0a33a"/><circle cx="634" cy="232" r="7" fill="#e0a33a"/>
<!-- inset: the wrong way, stop halfway then push back -->
<rect x="40" y="480" width="300" height="130" rx="14" fill="#fff" stroke="#c0392b" stroke-width="3"/>
<path d="M190 490 V530 M190 590 V600" stroke="#6b5446" stroke-width="8"/>
<rect x="186" y="530" width="8" height="60" fill="#8a6d5a" transform="rotate(-50 190 530)"/>
<circle cx="168" cy="590" r="10" fill="#c98a5e"/>
<path d="M120 560 q20 -30 40 -14 M210 520 q30 10 40 40" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 5" marker-end="url(#aP)"/>
<path d="M276 504 l40 40 M316 504 l-40 40" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
</svg>
