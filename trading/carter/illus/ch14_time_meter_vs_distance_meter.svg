<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A time meter ticks while the taxi is stuck; a distance meter ticks only as the road goes by</title>
<defs>
<marker id="aC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
<marker id="aP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<defs>
<g id="taxi"><path d="M-80 -16 v-26 q0 -8 10 -10 l20 -4 l18 -24 h60 l22 24 l26 4 q10 2 10 12 v24 z" fill="#e0a33a"/><rect x="-80" y="-28" width="166" height="14" fill="#2b2b2b"/><path d="M-26 -58 l12 -18 h22 v18 z M14 -58 v-18 h24 l16 18 z" fill="#cfe3e6"/><circle cx="-46" cy="-12" r="14" fill="#3d3a3a"/><circle cx="50" cy="-12" r="14" fill="#3d3a3a"/><circle cx="-46" cy="-12" r="5" fill="#cbbfa9"/><circle cx="50" cy="-12" r="5" fill="#cbbfa9"/></g>
<g id="meter"><rect x="-80" y="-50" width="160" height="100" rx="14" fill="#fff" stroke="#3d3a3a" stroke-width="5"/><rect x="-60" y="4" width="120" height="32" rx="4" fill="#2b2b2b"/></g>
</defs>
<line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
<!-- LEFT: stuck at a red signal -->
<rect x="24" y="90" width="440" height="520" fill="#dcd6cc"/>
<text x="240" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TIME CHART</text>
<rect x="24" y="500" width="440" height="110" fill="#9a958f"/>
<rect x="40" y="290" width="160" height="110" rx="8" fill="#7a4e7e" opacity=".55"/><rect x="330" y="300" width="120" height="100" rx="8" fill="#1f6f78" opacity=".5"/>
<rect x="404" y="140" width="34" height="90" rx="8" fill="#3d3a3a"/><circle cx="421" cy="160" r="11" fill="#e05a4a"/><circle cx="421" cy="185" r="9" fill="#6b6464"/><circle cx="421" cy="208" r="9" fill="#6b6464"/><rect x="417" y="230" width="8" height="270" fill="#3d3a3a"/>
<use href="#taxi" transform="translate(240 530)"/>
<circle cx="232" cy="468" r="10" fill="#d9a27a"/><path d="M222 462 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/><path d="M226 466 l6 2 l6 -2" stroke="#2b2b2b" stroke-width="2" fill="none"/>
<g transform="translate(160 190)"><use href="#meter"/><circle cx="0" cy="-20" r="18" fill="none" stroke="#2b2b2b" stroke-width="4"/><path d="M0 -20 v-10 M0 -20 h8" stroke="#2b2b2b" stroke-width="3"/><text x="0" y="29" text-anchor="middle" font-size="24" font-weight="800" fill="#e0a33a">₹ 248</text></g>
<path d="M260 160 v-40" stroke="#e07a5f" stroke-width="5" marker-end="url(#aC)"/><path d="M280 170 v-30" stroke="#e07a5f" stroke-width="4" marker-end="url(#aC)"/>
<path d="M200 240 L232 452" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5 6"/>
<!-- RIGHT: flying down the flyover -->
<rect x="496" y="90" width="440" height="520" fill="#eef3f2"/>
<text x="720" y="62" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">TICK CHART</text>
<rect x="496" y="480" width="440" height="40" fill="#9a958f"/><rect x="496" y="520" width="440" height="12" fill="#6b6464"/><rect x="560" y="532" width="24" height="78" fill="#b9ad98"/><rect x="840" y="532" width="24" height="78" fill="#b9ad98"/>
<g fill="#fff"><rect x="520" y="496" width="8" height="10"/><rect x="580" y="496" width="8" height="10"/><rect x="640" y="496" width="8" height="10"/><rect x="700" y="496" width="8" height="10"/><rect x="760" y="496" width="8" height="10"/><rect x="820" y="496" width="8" height="10"/><rect x="880" y="496" width="8" height="10"/></g>
<use href="#taxi" transform="translate(740 504)"/>
<circle cx="731" cy="442" r="10" fill="#c98a5e"/><path d="M721 438 a10 10 0 0 1 20 0 z" fill="#2e2a2a"/>
<path d="M520 440 h70 M530 460 h50 M520 420 h40" stroke="#b9ad98" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(600 210)"><use href="#meter"/><path d="M-20 -14 l12 -26 h16 l12 26 z" fill="#9a958f"/><path d="M0 -36 v6 M0 -24 v6" stroke="#fff" stroke-width="3"/><text x="0" y="29" text-anchor="middle" font-size="24" font-weight="800" fill="#e0a33a">₹ 96</text></g>
<path d="M640 262 L700 480" stroke="#2b2b2b" stroke-width="2" stroke-dasharray="5 6"/>
<text x="830" y="306" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">ONLY MOVES</text><text x="830" y="336" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">WITH BUSINESS</text>
<!-- small bubble: trades filling a counter -->
<rect x="760" y="110" width="160" height="130" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
<rect x="780" y="130" width="36" height="90" rx="4" fill="none" stroke="#7a4e7e" stroke-width="3"/>
<g fill="#e0a33a"><rect x="784" y="196" width="28" height="20" rx="3"/><rect x="784" y="172" width="28" height="20" rx="3"/><rect x="784" y="148" width="28" height="20" rx="3"/></g>
<path d="M840 176 q14 -14 28 0 q14 14 28 0" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round"/>
<path d="M850 206 h40" stroke="#7a4e7e" stroke-width="4" marker-end="url(#aP)"/>
</svg>
