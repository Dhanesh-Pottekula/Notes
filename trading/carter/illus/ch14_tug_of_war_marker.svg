<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Tug of war: only where the marker ends each round counts; three closes in a row toward the buyers</title>
<defs>
<g id="man"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><rect x="-17" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="14" height="60" rx="6" fill="#4a3f55"/><path d="M-26 -60 v-44 a26 26 0 0 1 52 0 v44 z" fill="currentColor"/><rect x="-7" y="-134" width="14" height="10" fill="#c98a5e"/><circle cx="0" cy="-150" r="20" fill="#c98a5e"/><path d="M-20 -154 a20 20 0 0 1 40 0 z" fill="#2e2a2a"/></g>
<g id="wom"><ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/><path d="M-30 0 L-22 -100 a22 22 0 0 1 44 0 L30 0 z" fill="currentColor"/><path d="M-22 -112 L22 -60 L26 -40 L-18 -100 z" fill="#fff" opacity=".3"/><rect x="-7" y="-132" width="14" height="10" fill="#d9a27a"/><circle cx="0" cy="-148" r="19" fill="#d9a27a"/><path d="M-20 -150 a20 20 0 0 1 40 0 q-20 -8 -40 0 z" fill="#2e2a2a"/><circle cx="-18" cy="-148" r="9" fill="#2e2a2a"/></g>
<marker id="aT" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
</defs>
<rect width="960" height="640" fill="#f6f1e7"/>
<!-- bunting -->
<path d="M20 30 Q480 70 940 30" stroke="#7a4e7e" stroke-width="2" fill="none"/>
<g><path d="M120 42 l14 24 l14 -22 z" fill="#1f6f78"/><path d="M300 54 l14 24 l14 -22 z" fill="#e0a33a"/><path d="M620 54 l14 24 l14 -22 z" fill="#e07a5f"/><path d="M800 42 l14 24 l14 -22 z" fill="#1f6f78"/></g>
<rect x="0" y="440" width="960" height="200" fill="#e3cfa8"/>
<path d="M480 440 V640" stroke="#fff" stroke-width="5" stroke-dasharray="14 10"/>
<!-- rope + marker (ghost swings faint) -->
<path d="M60 360 H900" stroke="#c4a46a" stroke-width="10" stroke-linecap="round"/>
<g fill="#e07a5f" opacity=".2"><path d="M560 360 l-10 34 h20 z"/><path d="M380 360 l-10 34 h20 z"/><path d="M600 360 l-10 34 h20 z"/></g>
<path d="M560 330 q20 -16 40 0 M380 330 q-20 -16 -40 0" stroke="#e07a5f" stroke-width="2" fill="none" opacity=".4"/>
<path d="M440 360 l-10 34 h20 z" fill="#e07a5f"/>
<!-- blue team (buyers), leaning left -->
<g transform="translate(150 460) rotate(-16)"><use href="#man" color="#3a6fb0"/><path d="M26 -112 l50 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(250 460) rotate(-16)"><use href="#wom" color="#3a6fb0"/><path d="M20 -108 l50 4" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/></g>
<text x="200" y="230" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">BUYERS</text>
<!-- orange team, leaning right -->
<g transform="translate(700 460) rotate(16)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-50 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<g transform="translate(800 460) rotate(16)"><use href="#man" color="#e0a33a"/><path d="M-26 -112 l-50 4" stroke="#c98a5e" stroke-width="11" stroke-linecap="round" fill="none"/></g>
<!-- three flags stepping toward buyers -->
<g stroke="#3d3a3a" stroke-width="4"><path d="M470 520 v-60"/><path d="M440 520 v-60"/><path d="M410 520 v-60"/></g>
<g fill="#e07a5f"><path d="M470 460 h26 l-8 9 l8 9 h-26 z"/><path d="M440 460 h-26 l8 9 l-8 9 h26 z"/><path d="M410 460 h-26 l8 9 l-8 9 h26 z"/></g>
<g font-size="16" font-weight="800" fill="#2b2b2b" text-anchor="middle"><text x="470" y="540">1</text><text x="440" y="540">2</text><text x="410" y="540">3</text></g>
<path d="M480 560 H400" stroke="#1f6f78" stroke-width="4" marker-end="url(#aT)"/>
<text x="440" y="436" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">3 IN A ROW</text>
<!-- referee with clipboard -->
<g transform="translate(620 640) scale(.9)"><use href="#wom" color="#7a4e7e"/><path d="M20 -108 l40 10 M-20 -108 l20 30" stroke="#d9a27a" stroke-width="10" stroke-linecap="round" fill="none"/><path d="M-12 -122 q12 20 24 0" stroke="#9aa3a6" stroke-width="3" fill="none"/></g>
<rect x="660" y="520" width="80" height="100" rx="6" fill="#8a6d5a"/><rect x="668" y="532" width="64" height="82" fill="#fff"/>
<path d="M676 556 h48 M676 578 h48 M676 600 h48" stroke="#d8cdb8" stroke-width="3"/>
<g fill="#1f6f78"><circle cx="716" cy="556" r="5"/><circle cx="704" cy="578" r="5"/><circle cx="692" cy="600" r="5"/></g>
<text x="840" y="600" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1" text-anchor="middle">CLOSE ONLY</text>
</svg>
