<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Watching a bike ride versus falling off and learning</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="wa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
    <g id="puff" fill="#d8cdb8"><circle cx="0" cy="0" r="14"/><circle cx="16" cy="-6" r="11"/><circle cx="-15" cy="-4" r="10"/><circle cx="4" cy="-14" r="10"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- warm sky glow + lane -->
  <circle cx="900" cy="40" r="120" fill="#e0a33a" opacity=".12"/>
  <rect y="520" width="960" height="120" fill="#e6d8bd"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: LECTURE -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">LECTURE</text>
  <!-- mango tree -->
  <rect x="40" y="200" width="18" height="320" fill="#6b5446"/>
  <ellipse cx="50" cy="190" rx="70" ry="60" fill="#1f6f78" opacity=".85"/>
  <ellipse cx="90" cy="220" rx="44" ry="36" fill="#1f6f78"/>
  <!-- bench -->
  <ellipse cx="125" cy="522" rx="90" ry="7" fill="#000" opacity=".08"/>
  <rect x="44" y="462" width="160" height="16" rx="4" fill="#cbbfa9"/>
  <rect x="58" y="478" width="14" height="42" fill="#b9ad98"/><rect x="176" y="478" width="14" height="42" fill="#b9ad98"/>
  <!-- seated boy, chin on hand -->
  <rect x="100" y="446" width="50" height="16" rx="7" fill="#2f3e6b"/>
  <rect x="140" y="454" width="12" height="62" rx="5" fill="#c98a5e"/>
  <rect x="136" y="510" width="22" height="9" rx="4" fill="#3d3a3a"/>
  <path d="M86 462 v-38 a24 24 0 0 1 48 0 v38 z" fill="#fff"/>
  <rect x="104" y="390" width="12" height="10" fill="#c98a5e"/>
  <circle cx="110" cy="376" r="18" fill="#c98a5e"/>
  <path d="M92 372 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <rect x="124" y="432" width="40" height="14" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-8 144 439)"/>
  <path d="M128 414 L146 444 L120 394" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- chalk path of the smooth ride -->
  <path d="M220 575 H452" stroke="#fff" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#wa)"/>
  <path d="M250 600 H420" stroke="#fff" stroke-width="3" stroke-dasharray="10 10" opacity=".8"/>
  <!-- cousin gliding past on a roadster -->
  <ellipse cx="335" cy="528" rx="100" ry="7" fill="#000" opacity=".08"/>
  <g stroke="#3d3a3a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="280" cy="488" r="36"/><circle cx="392" cy="488" r="36"/>
    <path d="M280 488 L326 488 L310 430 Z M326 488 L382 432 L310 430 M382 432 L392 488 M382 432 L374 412 L392 410"/>
  </g>
  <rect x="298" y="422" width="26" height="8" rx="4" fill="#3d3a3a"/>
  <path d="M312 420 L344 452 L332 492" stroke="#3b5a85" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="296" y="346" width="34" height="78" rx="16" fill="#9a9590" transform="rotate(18 313 420)"/>
  <rect x="330" y="340" width="11" height="12" fill="#c98a5e"/>
  <circle cx="342" cy="328" r="18" fill="#c98a5e"/>
  <path d="M324 324 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <path d="M334 370 L380 412" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M322 368 L296 342 L292 308" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- RIGHT: PROBLEM SET -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PROBLEM SET</text>
  <!-- water tank on a roof -->
  <rect x="840" y="240" width="110" height="280" fill="#d8cdb8"/><rect x="862" y="300" width="28" height="36" fill="#cbbfa9"/><rect x="906" y="300" width="28" height="36" fill="#cbbfa9"/><rect x="862" y="380" width="28" height="36" fill="#cbbfa9"/><rect x="906" y="380" width="28" height="36" fill="#cbbfa9"/>
  <rect x="858" y="196" width="72" height="46" rx="10" fill="#1f6f78" opacity=".75"/>
  <!-- wobbly earlier tracks with two falls -->
  <path d="M504 610 q30 -30 50 0 t50 -10 t46 -20 t40 -10" stroke="#8a6d5a" stroke-width="3" fill="none" stroke-dasharray="5 7"/>
  <use href="#puff" transform="translate(560 582)"/>
  <use href="#puff" transform="translate(660 566)"/>
  <!-- WHERE YOU LEARN tag -->
  <rect x="520" y="130" width="276" height="54" rx="10" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="658" y="167" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">WHERE YOU LEARN</text>
  <path d="M600 186 Q560 360 560 548" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <path d="M680 186 Q680 400 662 534" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <!-- boy tipping over on a small red bike -->
  <ellipse cx="790" cy="560" rx="110" ry="8" fill="#000" opacity=".08"/>
  <use href="#puff" transform="translate(860 552) scale(1.3)"/>
  <g transform="rotate(-16 740 556)">
    <g stroke="#e07a5f" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M740 528 L782 528 L770 482 Z M782 528 L826 484 L770 482 M826 484 L846 528 M826 484 L812 466 L834 460"/>
    </g>
    <circle cx="740" cy="528" r="28" stroke="#3d3a3a" stroke-width="6" fill="none"/>
    <ellipse cx="846" cy="528" rx="12" ry="28" stroke="#3d3a3a" stroke-width="6" fill="none"/>
    <rect x="760" y="474" width="22" height="7" rx="3" fill="#3d3a3a"/>
    <path d="M772 470 v-36 a22 22 0 0 1 44 0 v36 z" fill="#fff"/>
    <rect x="789" y="402" width="11" height="10" fill="#d9a27a"/>
    <circle cx="794" cy="388" r="17" fill="#d9a27a"/>
    <path d="M777 384 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
    <circle cx="804" cy="394" r="4" fill="#2e2a2a"/>
    <path d="M808 432 L834 460" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
    <path d="M778 432 L752 410" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
    <rect x="774" y="462" width="34" height="14" rx="6" fill="#2f3e6b"/>
  </g>
  <!-- foot stuck out, scraped knee with plaster -->
  <path d="M780 470 L870 490 L892 540" stroke="#d9a27a" stroke-width="11" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="862" y="482" width="16" height="10" rx="2" fill="#efd9b4"/>
  <rect x="884" y="536" width="22" height="9" rx="4" fill="#3d3a3a"/>
  <circle cx="900" cy="410" r="20" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="900" y="419" text-anchor="middle" font-size="26" font-weight="800" fill="#e07a5f">!</text>
</svg>
