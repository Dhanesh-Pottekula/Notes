<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A silent smoke alarm in the kitchen while smoke rises in the bedroom</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="alarm"><rect x="-10" y="0" width="20" height="6" fill="#cbbfa9"/><ellipse cx="0" cy="12" rx="34" ry="11" fill="#fff"/><path d="M-18 12 h36 M-12 16 h24" stroke="#cbbfa9" stroke-width="3"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- dollhouse cutaway -->
  <rect x="30" y="118" width="900" height="434" fill="#efe4cf"/>
  <rect x="30" y="540" width="900" height="26" fill="#8a6d5a"/>
  <rect x="20" y="104" width="920" height="18" fill="#cbbfa9"/>
  <rect x="470" y="122" width="20" height="160" fill="#d8cdb8"/>
  <!-- tube light glow -->
  <rect x="560" y="124" width="70" height="8" rx="4" fill="#fff"/>
  <rect x="200" y="124" width="70" height="8" rx="4" fill="#fff"/>

  <!-- LEFT: bedroom, forgotten coil -->
  <rect x="56" y="300" width="96" height="240" rx="4" fill="#b9ad98"/>
  <line x1="104" y1="310" x2="104" y2="530" stroke="#a39780" stroke-width="3"/>
  <rect x="94" y="400" width="6" height="26" fill="#8f846f"/><rect x="108" y="400" width="6" height="26" fill="#8f846f"/>
  <line x1="104" y1="122" x2="104" y2="150" stroke="#6b5446" stroke-width="4"/>
  <ellipse cx="104" cy="154" rx="60" ry="6" fill="#8a6d5a"/>
  <rect x="300" y="190" width="120" height="150" fill="#cfe3e3"/>
  <path d="M296 186 h132 v8 h-132 z" fill="#6b5446"/>
  <path d="M300 194 q20 160 10 340 h44 q-10 -170 -2 -340 z" fill="#7a4e7e"/>
  <path d="M380 194 q10 160 20 340 h28 q-4 -170 -8 -340 z" fill="#7a4e7e" opacity=".85"/>
  <!-- coil -->
  <ellipse cx="250" cy="536" rx="26" ry="6" fill="#3d3a3a"/>
  <path d="M250 532 m-18 0 a18 5 0 1 0 36 0 a13 4 0 1 0 -26 0 a8 2 0 1 0 16 0" stroke="#1f6f78" stroke-width="3" fill="none"/>
  <circle cx="232" cy="532" r="3" fill="#e07a5f"/>
  <path d="M232 526 q-22 -40 4 -80 q26 -40 -6 -90 q-26 -50 10 -100 q24 -40 4 -110" stroke="#a9a196" stroke-width="7" fill="none" stroke-linecap="round" opacity=".7"/>
  <path d="M236 270 q30 -30 10 -70 q-14 -30 20 -60" stroke="#a9a196" stroke-width="5" fill="none" stroke-linecap="round" opacity=".5"/>
  <text x="300" y="250" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO EVIDENCE</text>
  <!-- no alarm on this ceiling -->
  <circle cx="232" cy="142" r="14" fill="none" stroke="#e07a5f" stroke-width="3" stroke-dasharray="4 4"/>

  <!-- RIGHT: kitchen, silent alarm -->
  <use href="#alarm" transform="translate(720 122)"/>
  <path d="M770 140 h150 a10 10 0 0 1 10 10 v36 a10 10 0 0 1 -10 10 h-150 a10 10 0 0 1 -10 -10 v-12 l-16 -10 l16 -4 v-10 a10 10 0 0 1 10 -10 z" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="846" y="180" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">SILENCE</text>
  <!-- three fault insets -->
  <g stroke="#b9ad98" stroke-width="2" stroke-dasharray="4 4"><path d="M700 146 L606 200"/><path d="M720 148 L720 196"/><path d="M740 146 L834 200"/></g>
  <g>
    <circle cx="600" cy="236" r="40" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
    <ellipse cx="600" cy="236" rx="26" ry="10" fill="#efe4cf"/>
    <rect x="570" y="228" width="60" height="14" fill="#b07850" transform="rotate(-14 600 235)"/>
    <circle cx="720" cy="236" r="40" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
    <rect x="696" y="222" width="44" height="28" rx="4" fill="none" stroke="#3d3a3a" stroke-width="4"/>
    <rect x="740" y="231" width="5" height="10" fill="#3d3a3a"/>
    <rect x="701" y="227" width="7" height="18" fill="#e07a5f"/>
    <circle cx="840" cy="236" r="40" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
    <path d="M866 236 H818" stroke="#e07a5f" stroke-width="4" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  </g>
  <!-- counter, stove, cooker, dabba -->
  <rect x="640" y="440" width="290" height="100" fill="#8a6d5a"/>
  <rect x="640" y="430" width="290" height="14" fill="#6b5446"/>
  <rect x="680" y="414" width="130" height="18" rx="4" fill="#b9ad98"/>
  <path d="M700 414 q4 -10 8 0 M770 414 q4 -10 8 0" stroke="#1f6f78" stroke-width="3" fill="none"/>
  <path d="M694 412 v-42 a16 16 0 0 1 16 -16 h28 a16 16 0 0 1 16 16 v42 z" fill="#cbbfa9"/>
  <rect x="716" y="342" width="16" height="14" rx="3" fill="#3d3a3a"/>
  <path d="M754 380 h40" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="872" cy="420" rx="34" ry="10" fill="#cbbfa9"/>
  <rect x="838" y="404" width="68" height="16" fill="#b9ad98"/>
  <ellipse cx="872" cy="404" rx="34" ry="10" fill="#d8cdb8"/>

  <!-- man in the doorway, reading, trusting the quiet -->
  <text x="480" y="320" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRUST THE ALARM?</text>
  <ellipse cx="490" cy="542" rx="70" ry="6" fill="#000" opacity=".08"/>
  <rect x="446" y="470" width="70" height="12" rx="4" fill="#6b5446"/>
  <rect x="452" y="482" width="8" height="58" fill="#6b5446"/><rect x="502" y="482" width="8" height="58" fill="#6b5446"/>
  <path d="M458 476 h76 l6 64 h-30 l-6 -46 h-46 z" fill="#1f6f78"/>
  <path d="M470 476 h10 M500 476 v64 M520 480 v60" stroke="#e0a33a" stroke-width="3"/>
  <path d="M456 478 v-48 a26 26 0 0 1 52 0 v48 z" fill="#fff"/>
  <rect x="476" y="390" width="12" height="10" fill="#c98a5e"/>
  <circle cx="482" cy="374" r="20" fill="#c98a5e"/>
  <path d="M462 368 a20 18 0 0 1 40 0 z" fill="#2e2a2a"/>
  <path d="M490 380 q6 4 10 0" stroke="#2e2a2a" stroke-width="2" fill="none"/>
  <rect x="502" y="410" width="66" height="50" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-6 535 435)"/>
  <path d="M512 422 h44 M512 432 h44 M512 442 h30" stroke="#cbbfa9" stroke-width="3" transform="rotate(-6 535 435)"/>
  <path d="M496 420 l14 18" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <!-- chai -->
  <rect x="568" y="522" width="18" height="18" rx="3" fill="#fff"/>
  <path d="M572 516 q-4 -8 0 -14 M580 516 q4 -8 0 -14" stroke="#cbbfa9" stroke-width="2" fill="none"/>
</svg>
