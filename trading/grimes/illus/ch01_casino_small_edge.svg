<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A lucky roulette winner versus the casino's long ledger of spins</title>
  <defs>
    <pattern id="tally" width="44" height="24" patternUnits="userSpaceOnUse">
      <path d="M6 5 v14 M11 5 v14 M16 5 v14 M21 5 v14 M3 16 l22 -8" stroke="#b9ad98" stroke-width="2"/>
    </pattern>
    <g id="pp">
      <rect x="-24" y="-102" width="48" height="102" rx="20" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="600" width="960" height="40" fill="#d8cdb8"/>
  <!-- brass lamps -->
  <g fill="#e0a33a"><path d="M200 0 v40 M200 40" stroke="#b9ad98" stroke-width="3"/><path d="M176 64 q24 -30 48 0 z"/><path d="M456 64 q24 -30 48 0 z"/></g>
  <path d="M480 0 v40" stroke="#b9ad98" stroke-width="3"/>
  <ellipse cx="200" cy="70" rx="40" ry="10" fill="#e0a33a" opacity=".2"/><ellipse cx="480" cy="70" rx="40" ry="10" fill="#e0a33a" opacity=".2"/>

  <!-- the house ledger -->
  <rect x="716" y="64" width="208" height="34" rx="6" fill="#3d3a3a"/>
  <text x="820" y="88" text-anchor="middle" font-size="19" font-weight="800" fill="#e0a33a" letter-spacing="1">SPIN 4,812,330</text>
  <rect x="696" y="108" width="236" height="16" rx="8" fill="#cbbfa9"/>
  <path d="M704 116 h220 v462 q-40 30 -96 18 q-56 -12 -96 14 z" fill="#fff"/>
  <path d="M704 136 h220 v438 q-40 30 -96 18 q-56 -12 -96 14 z" fill="url(#tally)"/>
  <rect x="710" y="142" width="208" height="44" fill="#fff"/>
  <text x="814" y="176" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">HOUSE EDGE</text>
  <path d="M736 560 l20 -14 l12 6 l18 -22 l14 8 l20 -30 l14 6 l18 -34 l12 4 l18 -40 l14 2 l14 -34" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linejoin="round" transform="translate(0 -40)"/>
  <path d="M724 590 q40 -16 96 6 q56 20 96 -12 q20 30 -10 40 q-60 10 -100 -10 q-40 -14 -82 -24 z" fill="#ece3d0"/>

  <!-- friend + lucky player behind the table -->
  <g transform="translate(96 474) scale(.9)"><use href="#pp" color="#7a4e7e"/><path d="M-22 -96 l-16 -50 M22 -96 l14 -52" stroke="#d9a27a" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(200 474)"><use href="#pp" color="#e0a33a"/>
    <g fill="#e07a5f"><circle cx="-10" cy="-80" r="6"/><circle cx="10" cy="-50" r="6"/><circle cx="-6" cy="-24" r="5"/><circle cx="14" cy="-92" r="5"/></g>
    <path d="M-22 -100 l-22 -48" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><circle cx="-46" cy="-152" r="10" fill="#c98a5e"/>
    <path d="M22 -100 l22 -48" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/><circle cx="46" cy="-152" r="10" fill="#c98a5e"/>
    <path d="M-8 -138 q8 8 16 0" stroke="#2e2a2a" stroke-width="3" fill="none"/>
  </g>
  <text x="200" y="250" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">LUCK</text>

  <!-- calm croupier -->
  <g transform="translate(610 474)"><use href="#pp" color="#fff"/>
    <path d="M-24 -98 h48 v98 h-48 z" fill="#3d3a3a"/><path d="M-10 -102 l10 30 l10 -30 z" fill="#fff"/>
    <path d="M-10 -122 l10 5 l10 -5 v10 l-10 -5 l-10 5 z" fill="#3d3a3a"/>
    <circle cx="0" cy="-170" r="10" fill="#2e2a2a"/>
    <path d="M-6 -140 h12" stroke="#2e2a2a" stroke-width="2"/>
    <path d="M-22 -92 l-40 50 l-40 6" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -92 l8 60" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- table + wheel -->
  <rect x="30" y="470" width="672" height="130" rx="12" fill="#1f6f78"/>
  <rect x="30" y="462" width="672" height="16" rx="8" fill="#6b5446"/>
  <ellipse cx="390" cy="514" rx="140" ry="42" fill="#6b5446"/>
  <ellipse cx="390" cy="510" rx="118" ry="34" fill="#3d3a3a"/>
  <ellipse cx="390" cy="510" rx="100" ry="28" fill="none" stroke="#e07a5f" stroke-width="12" stroke-dasharray="14 14"/>
  <ellipse cx="390" cy="508" rx="58" ry="16" fill="#8a6d5a"/>
  <ellipse cx="390" cy="502" rx="16" ry="8" fill="#e0a33a"/>
  <circle cx="468" cy="528" r="6" fill="#fff"/>
  <path d="M462 532 q-30 10 -70 6" stroke="#fff" stroke-width="4" fill="none" opacity=".5" stroke-linecap="round"/>
  <!-- chips sliding to the player -->
  <g fill="#e0a33a" stroke="#b7802a" stroke-width="2">
    <ellipse cx="250" cy="484" rx="18" ry="6"/><ellipse cx="250" cy="476" rx="18" ry="6"/><ellipse cx="250" cy="468" rx="18" ry="6"/><ellipse cx="250" cy="460" rx="18" ry="6"/>
    <ellipse cx="290" cy="482" rx="18" ry="6"/><ellipse cx="290" cy="474" rx="18" ry="6"/>
  </g>
  <path d="M520 492 h-150" stroke="#fff" stroke-width="3" stroke-dasharray="6 6" opacity=".6"/>

  <!-- inset: trader with only a few spins -->
  <rect x="40" y="494" width="270" height="122" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="175" y="530" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">FEW SPINS</text>
  <circle cx="84" cy="562" r="14" fill="#c98a5e"/><path d="M70 558 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/>
  <rect x="68" y="578" width="32" height="30" rx="10" fill="#1f6f78"/>
  <rect x="120" y="546" width="170" height="58" rx="4" fill="#f6f1e7" stroke="#cbbfa9" stroke-width="2"/>
  <path d="M130 556 v12 M135 556 v12 M140 556 v12" stroke="#b9ad98" stroke-width="2"/>
  <path d="M152 590 l18 -14 l14 16 l16 -22 l14 20 l18 -10 l16 6 l18 -12" stroke="#e07a5f" stroke-width="3" fill="none" stroke-linejoin="round"/>
</svg>
