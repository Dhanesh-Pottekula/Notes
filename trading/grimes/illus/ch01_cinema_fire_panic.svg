<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Cinema crowd jamming one exit door, like everyone selling at the low</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
      <path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="0" width="960" height="560" fill="#ece2d0"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- screen -->
  <rect x="330" y="34" width="560" height="120" rx="6" fill="#cfe3e8"/>
  <rect x="330" y="34" width="560" height="120" rx="6" fill="none" stroke="#b9ad98" stroke-width="6"/>
  <!-- rows of red folding seats -->
  <g fill="#c0604a">
    <rect x="560" y="420" width="44" height="60" rx="8"/><rect x="614" y="420" width="44" height="60" rx="8"/><rect x="668" y="420" width="44" height="60" rx="8"/><rect x="722" y="420" width="44" height="60" rx="8"/><rect x="776" y="420" width="44" height="60" rx="8"/><rect x="830" y="420" width="44" height="60" rx="8"/><rect x="884" y="420" width="44" height="60" rx="8"/>
  </g>
  <g fill="#e07a5f">
    <rect x="540" y="490" width="50" height="66" rx="8"/><rect x="600" y="490" width="50" height="66" rx="8"/><rect x="660" y="490" width="50" height="66" rx="8"/><rect x="720" y="490" width="50" height="66" rx="8"/>
  </g>

  <!-- exit door on the left -->
  <rect x="96" y="226" width="64" height="30" rx="4" fill="#3f9a6b"/>
  <path d="M146 241 h-34 m10 -9 l-10 9 l10 9" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="262" width="210" height="44" fill="#d8cdb8"/>
  <text x="145" y="296" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">THE LOW</text>
  <rect x="40" y="306" width="22" height="254" fill="#d8cdb8"/><rect x="228" y="306" width="22" height="254" fill="#d8cdb8"/>
  <rect x="62" y="306" width="166" height="254" fill="#3d3a3a"/>
  <rect x="62" y="306" width="166" height="254" fill="#3f9a6b" opacity=".18"/>

  <text x="420" y="214" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">EVERYONE SELLS</text>

  <!-- arrows from the rows converging on the door -->
  <g stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="9 7" marker-end="url(#arr)">
    <path d="M880 400 Q600 270 300 330"/>
    <path d="M900 520 Q640 400 310 400"/>
    <path d="M700 600 Q500 560 310 470"/>
  </g>
  <!-- tangled knot at the door -->
  <path d="M190 320 c40 -20 60 30 20 40 c-40 10 -10 -50 30 -20 c40 30 -30 60 -40 20 c-8 -30 60 -20 40 20 c-20 40 -60 0 -30 -20" stroke="#e07a5f" stroke-width="4" fill="none"/>

  <!-- jammed crowd, arms up -->
  <g transform="translate(176 562) rotate(-6)"><use href="#pp" color="#7a4e7e"/><path d="M-22 -104 l-18 -46 M22 -104 l12 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(250 562) rotate(-8)"><use href="#pp" color="#3f9a6b"/><path d="M-24 -96 h60" stroke="#3f9a6b" stroke-width="10"/><circle cx="-34" cy="-118" r="13" fill="#d9a27a"/><rect x="-44" y="-108" width="20" height="30" rx="8" fill="#e0a33a"/><path d="M22 -104 l18 -48" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(330 562) rotate(-10)"><use href="#pp" color="#9a9590"/><path d="M-26 -134 a26 26 0 0 1 52 0 v10 h-52 z" fill="#9a9590"/><path d="M-22 -104 l-30 -36 M22 -104 l20 -50" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(410 562) rotate(-8)"><use href="#pp" color="#e0a33a"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#d8cdb8"/><path d="M-22 -104 l-20 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><line x1="-42" y1="-62" x2="-48" y2="2" stroke="#6b5446" stroke-width="6" stroke-linecap="round"/><path d="M22 -104 l16 -46" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(490 562) rotate(-6)"><use href="#pp" color="#1f6f78"/><path d="M-22 -104 l-26 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M22 -104 l18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M30 -170 h22 l-4 28 h-14 z" fill="#fff" stroke="#e07a5f" stroke-width="3"/></g>
  <!-- spilled popcorn -->
  <g fill="#fff"><circle cx="540" cy="590" r="5"/><circle cx="560" cy="600" r="4"/><circle cx="580" cy="588" r="5"/><circle cx="604" cy="604" r="4"/><circle cx="520" cy="604" r="4"/></g>
  <g fill="#e0a33a"><circle cx="550" cy="596" r="3"/><circle cx="592" cy="598" r="3"/></g>

  <!-- usher shouting, torch in hand -->
  <g transform="translate(860 600) scale(1.15)"><use href="#pp" color="#8a3b3b"/><path d="M-20 -152 h40 v-8 h-40 z" fill="#8a3b3b"/><path d="M-22 -104 l-14 -34 l20 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 -104 l12 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="26" y="-66" width="14" height="30" rx="3" fill="#3d3a3a"/></g>
  <path d="M808 400 l-24 -8 M808 412 l-26 4 M806 388 l-18 -18" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>

  <!-- inset: trader at laptop over SELL -->
  <path d="M190 170 Q300 260 330 360" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="4 6"/>
  <circle cx="120" cy="128" r="90" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="60" y="120" width="96" height="62" rx="4" fill="#3d3a3a"/>
  <rect x="50" y="182" width="116" height="10" rx="3" fill="#b9ad98"/>
  <rect x="80" y="140" width="56" height="26" rx="6" fill="#e07a5f"/>
  <circle cx="176" cy="96" r="18" fill="#c98a5e"/>
  <path d="M158 92 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <path d="M178 120 q-30 0 -48 20" stroke="#c98a5e" stroke-width="9" fill="none" stroke-linecap="round"/>
  <path d="M152 84 q-4 8 0 12 q4 -4 0 -12 M198 104 q-4 8 0 12 q4 -4 0 -12" fill="#7fb3c4"/>
</svg>
