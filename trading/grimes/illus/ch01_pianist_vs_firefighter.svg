<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A pianist repeating the same notes versus a firefighter facing a new fire, with trading closer to the fire</title>
  <defs>
    <g id="pianist">
      <rect x="-30" y="0" width="60" height="12" rx="4" fill="#6b5446"/>
      <rect x="-24" y="12" width="8" height="58" fill="#6b5446"/><rect x="16" y="12" width="8" height="58" fill="#6b5446"/>
      <path d="M-20 0 h64 l6 66 h-22 l-4 -44 h-44 z" fill="#efe0c0"/>
      <path d="M-24 2 v-60 a24 24 0 0 1 48 0 v60 z" fill="#efe0c0"/>
      <path d="M-24 -40 l48 -30 v12 l-48 30 z" fill="#e0a33a"/>
      <rect x="-5" y="-90" width="10" height="10" fill="#b07850"/>
      <circle cx="2" cy="-104" r="18" fill="#b07850"/><path d="M-16 -100 a18 18 0 0 1 36 -6 l-4 -6 a18 18 0 0 0 -30 2 z" fill="#2e2a2a"/><circle cx="-16" cy="-100" r="9" fill="#2e2a2a"/>
      <path d="M14 -60 l40 18 l20 -4" stroke="#b07850" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="burst"><path d="M0 -22 l5 14 l15 -6 l-8 13 l14 6 l-15 4 l3 15 l-12 -9 l-8 13 l-2 -15 l-15 3 l10 -11 l-12 -9 l15 -2 z" fill="#e0a33a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect x="490" y="0" width="470" height="640" fill="#efe1d4"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: same notes every night -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">SAME NOTES</text>
  <circle cx="90" cy="150" r="70" fill="#e0a33a" opacity=".12"/>
  <rect x="210" y="250" width="220" height="310" rx="6" fill="#3d3a3a"/>
  <rect x="200" y="400" width="240" height="22" fill="#fff"/>
  <path d="M212 400 v14 M224 400 v14 M248 400 v14 M260 400 v14 M272 400 v14 M296 400 v14 M308 400 v14 M332 400 v14 M344 400 v14 M356 400 v14 M380 400 v14 M392 400 v14 M416 400 v14" stroke="#3d3a3a" stroke-width="5"/>
  <rect x="200" y="422" width="240" height="18" fill="#2b2b2b"/>
  <rect x="270" y="300" width="100" height="80" fill="#fff"/>
  <path d="M280 318 h80 M280 330 h80 M280 342 h80 M280 354 h80 M280 366 h80" stroke="#cbbfa9" stroke-width="2"/>
  <g fill="#3d3a3a"><circle cx="292" cy="330" r="4"/><circle cx="310" cy="342" r="4"/><circle cx="328" cy="324" r="4"/><circle cx="346" cy="336" r="4"/></g>
  <path d="M392 250 l12 -44 l12 44 z" fill="#8a6d5a"/><line x1="404" y1="246" x2="414" y2="214" stroke="#e0a33a" stroke-width="3"/>
  <!-- ghosts of previous nights -->
  <use href="#pianist" transform="translate(70 470)" opacity=".14"/>
  <use href="#pianist" transform="translate(100 476)" opacity=".24"/>
  <use href="#pianist" transform="translate(130 482)" opacity=".38"/>
  <ellipse cx="164" cy="562" rx="60" ry="6" fill="#000" opacity=".08"/>
  <use href="#pianist" transform="translate(160 490)"/>

  <!-- RIGHT: a new fire every time -->
  <text x="720" y="66" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEW FIRE EVERY TIME</text>
  <rect x="640" y="170" width="290" height="390" fill="#b9ad98"/>
  <rect x="660" y="430" width="250" height="130" fill="#8a6d5a"/>
  <path d="M660 446 h250 M660 466 h250 M660 486 h250 M660 506 h250 M660 526 h250 M660 546 h250" stroke="#6b5446" stroke-width="3"/>
  <rect x="680" y="230" width="90" height="110" fill="#3d3a3a"/><rect x="810" y="230" width="90" height="110" fill="#3d3a3a"/>
  <path d="M680 340 q-4 -60 20 -90 q4 30 18 20 q-6 -50 24 -80 q6 40 22 30 q10 40 6 120 z" fill="#e07a5f"/>
  <path d="M694 340 q0 -40 16 -60 q6 24 16 14 q2 -30 18 -46 q8 40 10 92 z" fill="#e0a33a"/>
  <path d="M810 340 q0 -50 22 -80 q6 26 18 18 q6 -40 26 -60 q10 50 24 40 v82 z" fill="#e07a5f"/>
  <path d="M824 340 q4 -34 18 -50 q4 20 14 10 q6 -24 16 -30 q6 40 14 70 z" fill="#e0a33a"/>
  <!-- smoke curling -->
  <path d="M720 180 q-30 -40 10 -70 q40 -30 0 -60 M850 180 q40 -30 0 -70 q-30 -30 20 -50" stroke="#a9a196" stroke-width="12" fill="none" stroke-linecap="round" opacity=".6"/>
  <!-- tangled wires -->
  <path d="M500 150 q100 40 200 0 q60 -20 130 30 q40 20 110 -10 M500 170 q120 -10 220 30 q80 20 150 -20 q40 -20 90 10" stroke="#3d3a3a" stroke-width="2" fill="none"/>
  <!-- falling signboard -->
  <g transform="rotate(24 870 390)"><rect x="830" y="370" width="90" height="34" rx="3" fill="#1f6f78"/><path d="M842 382 h66 M842 392 h40" stroke="#fff" stroke-width="3"/></g>
  <path d="M846 352 l-10 -12 M880 350 l4 -16 M908 362 l12 -10" stroke="#e07a5f" stroke-width="4" stroke-linecap="round"/>
  <!-- gas cylinder flare -->
  <rect x="902" y="500" width="30" height="58" rx="12" fill="#e07a5f"/>
  <use href="#burst" transform="translate(918 480)"/>
  <!-- firefighter bracing with the hose -->
  <ellipse cx="654" cy="562" rx="50" ry="6" fill="#000" opacity=".08"/>
  <g transform="translate(654 560) rotate(-10)">
    <rect x="-20" y="-64" width="16" height="64" rx="6" fill="#8a7a4a"/><rect x="4" y="-64" width="16" height="64" rx="6" fill="#8a7a4a"/>
    <path d="M-26 -60 v-46 a26 26 0 0 1 52 0 v46 z" fill="#b59a5a"/>
    <path d="M-26 -84 h52 v10 h-52 z M-26 -64 h52 v8 h-52 z" fill="#e0a33a"/>
    <circle cx="0" cy="-148" r="19" fill="#c98a5e"/>
    <path d="M-26 -150 q0 -32 26 -32 q26 0 26 32 z" fill="#e0a33a"/><rect x="-30" y="-152" width="60" height="8" rx="4" fill="#c58a22"/>
    <path d="M4 -140 h10" stroke="#2e2a2a" stroke-width="2"/>
  </g>
  <path d="M670 470 C700 420 710 370 730 320" stroke="#3d3a3a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M670 474 l-14 -40 M684 460 l20 -26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <path d="M736 312 q20 -30 40 -20 M736 312 q30 -10 50 10 M736 312 q14 -40 30 -50" stroke="#7fb3c4" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- the trader, on the fire side of the line -->
  <rect x="500" y="556" width="70" height="10" rx="4" fill="#6b5446"/>
  <rect x="506" y="566" width="7" height="52" fill="#6b5446"/><rect x="557" y="566" width="7" height="52" fill="#6b5446"/>
  <rect x="494" y="582" width="88" height="28" rx="6" fill="#fff" stroke="#7a4e7e" stroke-width="2"/>
  <text x="538" y="603" text-anchor="middle" font-size="18" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRADING</text>
  <path d="M514 556 v-34 a16 16 0 0 1 32 0 v34 z" fill="#1f6f78"/>
  <circle cx="532" cy="492" r="13" fill="#c98a5e"/><path d="M519 489 a13 13 0 0 1 26 0 z" fill="#2e2a2a"/>
  <rect x="540" y="528" width="44" height="28" rx="2" fill="#3d3a3a" transform="rotate(-10 562 542)"/>
  <path d="M546 546 l8 -6 l6 4 l8 -10 l6 2" stroke="#e07a5f" stroke-width="2" fill="none" transform="rotate(-10 562 542)"/>
</svg>
