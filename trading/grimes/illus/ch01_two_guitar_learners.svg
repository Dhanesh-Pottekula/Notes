<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One guitar learner plays when free, the other practises the hard chord everywhere</title>
  <defs>
    <g id="gtr">
      <circle cx="0" cy="0" r="26" fill="#c98a3a"/><circle cx="0" cy="-30" r="20" fill="#c98a3a"/>
      <circle cx="0" cy="-12" r="7" fill="#3d3a3a"/>
      <rect x="-4" y="-112" width="8" height="74" fill="#6b5446"/><rect x="-7" y="-130" width="14" height="20" rx="3" fill="#6b5446"/>
    </g>
    <g id="sheet"><rect x="0" y="0" width="56" height="72" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="28" cy="4" r="4" fill="#e07a5f"/><path d="M8 20 h40 M8 30 h40 M8 40 h40 M8 50 h40 M8 60 h40" stroke="#cbbfa9" stroke-width="2"/><circle cx="18" cy="30" r="4" fill="#3d3a3a"/><circle cx="34" cy="40" r="4" fill="#3d3a3a"/></g>
    <g id="cal"><rect x="0" y="0" width="96" height="74" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="0" y="0" width="96" height="14" rx="4" fill="#e07a5f"/>
      <path d="M0 29 h96 M0 44 h96 M0 59 h96 M19 14 v60 M38 14 v60 M58 14 v60 M77 14 v60" stroke="#e5dccb" stroke-width="1.5"/></g>
    <path id="tk" d="M-5 0 l4 4 l7 -9" stroke="#3f9a6b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="pm">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-14" y="-56" width="12" height="56" rx="5" fill="#d8cdb8"/><rect x="2" y="-56" width="12" height="56" rx="5" fill="#d8cdb8"/>
      <path d="M-24 -48 v-56 a24 24 0 0 1 48 0 v56 z" fill="#8a3b3b"/>
      <rect x="-6" y="-136" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-150" r="19" fill="#b07850"/><path d="M-19 -154 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
      <path d="M-8 -160 l6 3 M8 -160 l-6 3" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
      <use href="#gtr" transform="translate(4 -70) rotate(-62) scale(.85)"/>
      <path d="M-22 -104 l-30 4 l-24 -20" stroke="#b07850" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 -104 l6 34 l-14 6" stroke="#b07850" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="520" width="960" height="120" fill="#d8cdb8"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT -->
  <text x="240" y="66" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">PLAYS WHEN FREE</text>
  <use href="#sheet" transform="translate(196 110)"/>
  <use href="#cal" transform="translate(300 108)"/>
  <use href="#tk" transform="translate(310 38) translate(0 100)"/><use href="#tk" transform="translate(370 168)"/>
  <!-- TV glow -->
  <rect x="44" y="110" width="120" height="78" rx="4" fill="#3d3a3a"/>
  <rect x="52" y="118" width="104" height="62" fill="#7fb3c4"/>
  <path d="M60 180 L30 330 H190 L156 180 Z" fill="#7fb3c4" opacity=".12"/>
  <!-- sofa + lounging man -->
  <ellipse cx="180" cy="522" rx="150" ry="7" fill="#000" opacity=".08"/>
  <rect x="34" y="340" width="300" height="80" rx="18" fill="#7a4e7e"/>
  <rect x="34" y="410" width="300" height="70" rx="12" fill="#8f6393"/>
  <rect x="24" y="380" width="40" height="100" rx="14" fill="#6b3f6f"/><rect x="304" y="380" width="40" height="100" rx="14" fill="#6b3f6f"/>
  <rect x="50" y="480" width="12" height="40" fill="#6b5446"/><rect x="306" y="480" width="12" height="40" fill="#6b5446"/>
  <rect x="180" y="384" width="120" height="26" rx="11" fill="#4a3f55"/>
  <rect x="92" y="372" width="96" height="40" rx="18" fill="#e0a33a"/>
  <circle cx="78" cy="372" r="19" fill="#c98a5e"/><path d="M60 378 a19 19 0 0 1 4 -22 l10 6 z" fill="#2e2a2a"/>
  <path d="M108 378 l6 -34" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <rect x="104" y="318" width="18" height="28" rx="3" fill="#3d3a3a"/><rect x="107" y="321" width="12" height="20" fill="#7fb3c4"/>
  <!-- dusty guitar in the corner -->
  <use href="#gtr" transform="translate(420 494) rotate(10) scale(1.1)"/>
  <g fill="#b9ad98"><circle cx="404" cy="462" r="2"/><circle cx="414" cy="456" r="2"/><circle cx="426" cy="462" r="2"/><circle cx="432" cy="440" r="2"/></g>
  <path d="M446 326 L470 300 M446 326 L470 340 M446 326 L452 300 M456 314 q8 8 14 0 M452 330 q8 0 10 10" stroke="#9a9590" stroke-width="1.5" fill="none"/>
  <path d="M440 340 v30" stroke="#9a9590" stroke-width="1.5" stroke-dasharray="2 3"/>

  <!-- RIGHT -->
  <text x="720" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">DELIBERATE PRACTICE</text>
  <use href="#sheet" transform="translate(610 102)"/>
  <use href="#cal" transform="translate(700 100)"/>
  <g transform="translate(700 100)">
    <use href="#tk" transform="translate(10 22)"/><use href="#tk" transform="translate(29 22)"/><use href="#tk" transform="translate(48 22)"/><use href="#tk" transform="translate(68 22)"/><use href="#tk" transform="translate(87 22)"/>
    <use href="#tk" transform="translate(10 37)"/><use href="#tk" transform="translate(29 37)"/><use href="#tk" transform="translate(48 37)"/><use href="#tk" transform="translate(68 37)"/><use href="#tk" transform="translate(87 37)"/>
    <use href="#tk" transform="translate(10 52)"/><use href="#tk" transform="translate(29 52)"/><use href="#tk" transform="translate(48 52)"/><use href="#tk" transform="translate(68 52)"/><use href="#tk" transform="translate(87 52)"/>
    <use href="#tk" transform="translate(10 67)"/><use href="#tk" transform="translate(29 67)"/><use href="#tk" transform="translate(48 67)"/>
  </g>
  <!-- three rooms of the same house -->
  <rect x="500" y="200" width="140" height="320" fill="#efe4cf"/>
  <rect x="650" y="200" width="140" height="320" fill="#f0c89a"/>
  <rect x="800" y="200" width="140" height="320" fill="#3f4a66"/>
  <!-- kitchen: kettle -->
  <rect x="580" y="420" width="60" height="100" fill="#8a6d5a"/>
  <path d="M596 420 v-24 a14 14 0 0 1 28 0 v24 z" fill="#b9ad98"/>
  <path d="M604 384 q-6 -12 2 -22 M616 384 q6 -12 -2 -22" stroke="#cbbfa9" stroke-width="3" fill="none"/>
  <!-- balcony: dusk sun + railing -->
  <circle cx="744" cy="260" r="26" fill="#e07a5f"/>
  <path d="M650 430 h140 M650 400 h140 M662 400 v120 M690 400 v120 M718 400 v120 M746 400 v120 M774 400 v120" stroke="#6b5446" stroke-width="4"/>
  <!-- bed at night -->
  <circle cx="908" cy="236" r="14" fill="#f3e3b0"/><circle cx="902" cy="232" r="13" fill="#3f4a66"/>
  <rect x="800" y="452" width="140" height="44" rx="6" fill="#d8cdb8"/>
  <rect x="804" y="496" width="10" height="24" fill="#6b5446"/><rect x="926" y="496" width="10" height="24" fill="#6b5446"/>
  <rect x="890" y="436" width="44" height="20" rx="8" fill="#fff"/>
  <!-- the same player, same awkward barre chord -->
  <use href="#pm" transform="translate(556 520) scale(.82)"/>
  <use href="#pm" transform="translate(706 520) scale(.82)"/>
  <use href="#pm" transform="translate(856 520) scale(.82)"/>
  <g stroke="#e07a5f" stroke-width="4" stroke-linecap="round"><path d="M508 352 l12 12 M520 352 l-12 12"/><path d="M520 320 l10 10 M530 320 l-10 10"/><path d="M658 352 l12 12 M670 352 l-12 12"/></g>
  <circle cx="808" cy="330" r="17" fill="#fff"/>
  <path d="M800 330 l6 6 l11 -13" stroke="#3f9a6b" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
