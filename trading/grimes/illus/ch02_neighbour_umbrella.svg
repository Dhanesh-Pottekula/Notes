<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A neighbour carrying an umbrella: the action is visible, the reason is hidden</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7a4e7e"/></marker>
    <g id="mini"><rect x="-7" y="-26" width="14" height="26" rx="6" fill="#9a9590"/><circle cx="0" cy="-34" r="8" fill="#c98a5e"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- left chawl building with the curious man -->
  <rect x="0" y="0" width="250" height="560" fill="#e0c9a6"/>
  <rect x="0" y="380" width="250" height="14" fill="#cbbfa9"/>
  <rect x="40" y="440" width="70" height="120" fill="#8a6d5a"/>
  <rect x="60" y="190" width="150" height="150" fill="#3d3a3a"/>
  <rect x="50" y="336" width="170" height="14" fill="#cbbfa9"/>
  <path d="M110 336 v-44 a32 32 0 0 1 64 0 v44 z" fill="#fff"/>
  <circle cx="148" cy="250" r="22" fill="#c98a5e"/>
  <path d="M126 246 a22 22 0 0 1 44 -4 z" fill="#2e2a2a"/>
  <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="150" cy="252" r="6"/><circle cx="164" cy="252" r="6"/></g>
  <path d="M146 240 l8 -4 M160 238 l8 2" stroke="#2e2a2a" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="168" y="296" width="60" height="40" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(12 198 316)"/>
  <path d="M168 300 l26 16" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <!-- tulsi pot -->
  <path d="M30 336 h26 l-4 -24 h-18 z" fill="#c0604a"/><path d="M43 312 q-12 -20 0 -30 q12 10 0 30" fill="#1f6f78"/>
  <!-- his thought: rain -->
  <circle cx="200" cy="164" r="7" fill="#fff" stroke="#b9ad98" stroke-width="2"/><circle cx="214" cy="140" r="10" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M190 120 a34 30 0 0 1 40 -50 a34 30 0 0 1 64 0 a30 28 0 0 1 16 50 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M220 96 a16 14 0 0 1 22 -18 a20 16 0 0 1 36 4 a12 12 0 0 1 2 22 h-56 z" fill="#3d3a3a"/>
  <path d="M234 108 l-4 8 M252 108 l-4 8 M270 108 l-4 8" stroke="#1f6f78" stroke-width="3" stroke-linecap="round"/>

  <!-- laundry + far balcony -->
  <path d="M250 40 q350 30 710 0" stroke="#9a9590" stroke-width="2" fill="none"/>
  <rect x="300" y="48" width="30" height="40" fill="#e07a5f"/><rect x="420" y="56" width="26" height="34" fill="#1f6f78"/><rect x="880" y="44" width="34" height="40" fill="#e0a33a"/>

  <!-- the three hidden reasons -->
  <text x="610" y="148" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">HIDDEN REASON</text>
  <circle cx="450" cy="240" r="62" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="470" y="196" width="30" height="76" fill="#8a6d5a"/>
  <use href="#mini" transform="translate(432 272)"/><use href="#mini" transform="translate(470 272)"/>
  <path d="M440 254 L462 238" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round"/>
  <circle cx="610" cy="240" r="62" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <circle cx="646" cy="202" r="14" fill="#e0a33a"/>
  <path d="M578 232 a34 22 0 0 1 68 0 z" fill="#2b2b2b"/><path d="M612 232 v32" stroke="#2b2b2b" stroke-width="3"/>
  <use href="#mini" transform="translate(602 286)"/>
  <circle cx="770" cy="240" r="62" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <circle cx="770" cy="254" r="24" fill="#c98a5e"/><path d="M746 250 a24 24 0 0 1 48 -6 z" fill="#d8cdb8"/>
  <circle cx="766" cy="246" r="3" fill="#2e2a2a"/><circle cx="780" cy="246" r="3" fill="#2e2a2a"/>
  <path d="M764 266 h12" stroke="#2e2a2a" stroke-width="2"/>
  <path d="M748 214 a8 7 0 0 1 12 -8 a10 8 0 0 1 18 2 a6 6 0 0 1 0 10 h-28 z" fill="#b9ad98"/>
  <path d="M496 296 L536 380 M610 302 L580 380 M724 296 L620 384" stroke="#b9ad98" stroke-width="2" stroke-dasharray="4 5"/>

  <!-- the neighbour with the closed umbrella -->
  <ellipse cx="560" cy="562" rx="44" ry="6" fill="#000" opacity=".08"/>
  <path d="M552 498 l-24 62 M568 498 l22 62" stroke="#7d7a76" stroke-width="15" stroke-linecap="round"/>
  <path d="M532 500 v-60 a28 28 0 0 1 56 0 v60 z" fill="#9a9590"/>
  <rect x="553" y="404" width="12" height="10" fill="#b07850"/>
  <circle cx="560" cy="390" r="20" fill="#b07850"/><path d="M540 386 a20 20 0 0 1 40 0 z" fill="#e5e0d8"/>
  <path d="M534 436 l-12 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  <path d="M586 436 l10 32 l22 -6" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M612 456 q-10 -12 2 -18 q10 -2 10 10 v80" stroke="#2b2b2b" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M624 470 l-10 64 h20 z" fill="#2b2b2b"/>

  <!-- chalk board -->
  <rect x="740" y="430" width="196" height="96" rx="6" fill="#3d3a3a" stroke="#8a6d5a" stroke-width="6"/>
  <rect x="770" y="526" width="8" height="34" fill="#8a6d5a"/><rect x="898" y="526" width="8" height="34" fill="#8a6d5a"/>
  <text x="838" y="490" text-anchor="middle" font-size="27" font-weight="800" fill="#fff" letter-spacing="1">BIG PUT BUY</text>
  <path d="M634 500 Q690 520 732 492" stroke="#7a4e7e" stroke-width="3" fill="none" marker-end="url(#arp)"/>

  <!-- label for what you can see -->
  <text x="300" y="612" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">VISIBLE ACTION</text>
  <path d="M420 590 Q520 580 606 520" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#arr)"/>
  <!-- vegetable cart -->
  <rect x="290" y="480" width="120" height="40" rx="4" fill="#8a6d5a"/>
  <circle cx="310" cy="536" r="16" fill="#3d3a3a"/><circle cx="390" cy="536" r="16" fill="#3d3a3a"/>
  <g fill="#e07a5f"><circle cx="310" cy="474" r="10"/><circle cx="330" cy="472" r="10"/></g><g fill="#3f9a6b"><circle cx="356" cy="472" r="10"/><circle cx="380" cy="474" r="10"/></g>
</svg>
