<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A ticket queue where some people are taller than their neighbours, and one is taller than the other tall ones</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="24" ry="5" fill="#000" opacity=".08"/>
      <rect x="-15" y="-64" width="12" height="64" rx="6" fill="#4a3f55"/><rect x="3" y="-64" width="12" height="64" rx="6" fill="#4a3f55"/>
      <path d="M-22 -60 v-46 a22 22 0 0 1 44 0 v46 z" fill="currentColor"/>
      <path d="M-22 -104 l-6 46 M22 -104 l6 46" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
      <rect x="-6" y="-138" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-150" r="18" fill="#c98a5e"/><path d="M-18 -153 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    </g>
    <path id="tri" d="M-11 -10 h22 l-11 16 z" fill="#e07a5f"/>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#d8cdb8"/>
  <path d="M0 560 h960" stroke="#cbbfa9" stroke-width="3"/>
  <!-- station: counter, sign, clock -->
  <rect x="846" y="230" width="100" height="310" fill="#cbbfa9"/>
  <rect x="862" y="300" width="68" height="70" fill="#3d3a3a"/>
  <path d="M874 300 v70 M886 300 v70 M898 300 v70 M910 300 v70 M922 300 v70" stroke="#9a9590" stroke-width="3"/>
  <rect x="836" y="176" width="120" height="40" fill="#e0a33a"/>
  <path d="M846 176 l14 40 M876 176 l14 40 M906 176 l14 40 M936 176 l14 40" stroke="#2b2b2b" stroke-width="8"/>
  <circle cx="760" cy="120" r="30" fill="#fff" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M760 120 v-18 M760 120 h12" stroke="#3d3a3a" stroke-width="4" stroke-linecap="round"/>

  <!-- the queue (heights chosen so 4 are taller than both neighbours) -->
  <use href="#pp" color="#e0a33a" transform="translate(62 540) scale(.8)"/>
  <use href="#pp" color="#1f6f78" transform="translate(132 540) scale(1.05)"/>
  <path d="M110 377 a22 18 0 0 1 44 0 l14 0 v5 h-58 z" fill="#e07a5f"/>
  <use href="#pp" color="#9a9590" transform="translate(202 540) scale(.86)"/>
  <use href="#pp" color="#7a4e7e" transform="translate(268 540) scale(.76)"/>
  <rect x="240" y="470" width="20" height="26" rx="4" fill="#e0a33a"/>
  <use href="#pp" color="#ffffff" transform="translate(336 540) scale(1.1)"/>
  <use href="#pp" color="#e0a33a" transform="translate(404 540) scale(.9)"/>
  <rect x="380" y="372" width="48" height="26" rx="4" fill="#6b5446"/>
  <use href="#pp" color="#b59a5a" transform="translate(480 540) scale(1.35)"/>
  <path d="M455 337 a25 18 0 0 1 50 0 h10 v6 h-60 z" fill="#8a7a4a"/>
  <use href="#pp" color="#7a4e7e" transform="translate(556 540) scale(.95)"/>
  <path d="M538 400 h36 v60 h-36 z" fill="#cbbfa9"/>
  <use href="#pp" color="#1f6f78" transform="translate(624 540) scale(.85)"/>
  <use href="#pp" color="#c0604a" transform="translate(694 540) scale(1.15)"/>
  <circle cx="694" cy="352" r="12" fill="#2e2a2a"/>
  <use href="#pp" color="#9a9590" transform="translate(766 540) scale(.9)"/>

  <!-- first-order markers -->
  <use href="#tri" transform="translate(132 344)"/>
  <use href="#tri" transform="translate(336 338)"/>
  <use href="#tri" transform="translate(694 322)"/>
  <use href="#tri" transform="translate(480 300)"/>
  <!-- second-order: the guard is tallest of the tall ones -->
  <g fill="#7a4e7e"><path d="M-14 -12 h28 l-14 20 z" transform="translate(480 276)"/><path d="M-14 -12 h28 l-14 20 z" transform="translate(480 250)"/></g>
  <path d="M132 330 L336 324 L480 286 L694 308" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="6 6"/>

  <text x="170" y="210" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">FIRST-ORDER</text>
  <path d="M150 222 L134 322" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arr)"/>
  <text x="500" y="200" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">SECOND-ORDER</text>
  <path d="M488 210 L482 228" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arr)"/>
</svg>
