<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A boulder's ripples linger on a pond, while a pebble on a calm pond barely shows</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect width="960" height="250" fill="#f3e2da"/>
  <!-- far bank: banyan + temple -->
  <rect x="0" y="236" width="960" height="24" fill="#b9ad98"/>
  <rect x="96" y="150" width="20" height="90" fill="#6b5446"/>
  <ellipse cx="106" cy="140" rx="90" ry="50" fill="#1f6f78" opacity=".8"/>
  <path d="M60 170 v60 M80 176 v56 M140 176 v58 M156 168 v60" stroke="#6b5446" stroke-width="2"/>
  <rect x="800" y="180" width="70" height="58" fill="#fff"/>
  <path d="M800 180 l35 -50 l35 50 z" fill="#fff"/><path d="M835 130 v-14" stroke="#e07a5f" stroke-width="3"/><path d="M835 116 l12 5 l-12 5 z" fill="#e07a5f"/>
  <rect x="824" y="204" width="22" height="34" rx="10" fill="#cbbfa9"/>
  <!-- water -->
  <rect y="260" width="960" height="300" fill="#a9cfd0"/>
  <ellipse cx="900" cy="300" rx="40" ry="8" fill="#3f9a6b" opacity=".7"/><ellipse cx="860" cy="320" rx="26" ry="6" fill="#3f9a6b" opacity=".7"/>

  <!-- boulder rings, getting fainter outward -->
  <g fill="none" stroke="#1f6f78">
    <ellipse cx="380" cy="400" rx="70" ry="20" stroke-width="7"/>
    <ellipse cx="380" cy="400" rx="130" ry="36" stroke-width="6" opacity=".75"/>
    <ellipse cx="380" cy="400" rx="190" ry="52" stroke-width="5" opacity=".5"/>
    <ellipse cx="380" cy="400" rx="250" ry="68" stroke-width="4" opacity=".3"/>
  </g>
  <!-- crown of spray -->
  <ellipse cx="380" cy="396" rx="40" ry="14" fill="#6b5446"/>
  <path d="M340 392 q-14 -50 -30 -80 M360 388 q-6 -60 -10 -100 M380 386 v-110 M400 388 q6 -60 12 -100 M420 392 q14 -50 30 -80" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g fill="#fff"><circle cx="306" cy="300" r="6"/><circle cx="348" cy="276" r="6"/><circle cx="380" cy="262" r="7"/><circle cx="414" cy="276" r="6"/><circle cx="456" cy="300" r="6"/></g>
  <text x="380" y="222" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEWS SHOCK</text>
  <!-- pebble falling into the still-rough water -->
  <circle cx="650" cy="330" r="10" fill="#6b5446"/>
  <path d="M650 300 v-24 M640 304 l-6 -18 M660 304 l6 -18" stroke="#9a9590" stroke-width="2"/>
  <g fill="none" stroke="#1f6f78" stroke-width="4"><ellipse cx="650" cy="410" rx="34" ry="10"/><ellipse cx="650" cy="410" rx="64" ry="18" opacity=".6"/></g>
  <path d="M590 412 l10 -16 l10 16 l10 -20 l10 20 l10 -18 l10 18" stroke="#1f6f78" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <text x="590" y="522" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">VOLATILITY LINGERS</text>
  <path d="M420 486 Q340 476 200 440" stroke="#1f6f78" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/>

  <!-- ghat steps + boy with a pebble -->
  <rect y="548" width="960" height="30" fill="#cbbfa9"/>
  <rect y="578" width="960" height="62" fill="#d8cdb8"/>
  <ellipse cx="840" cy="550" rx="50" ry="5" fill="#000" opacity=".08"/>
  <rect x="822" y="530" width="44" height="18" rx="7" fill="#2f3e6b"/>
  <rect x="854" y="540" width="12" height="54" rx="5" fill="#c98a5e"/>
  <path d="M808 548 v-44 a22 22 0 0 1 44 0 v44 z" fill="#e8e0cf"/>
  <rect x="824" y="468" width="11" height="10" fill="#c98a5e"/>
  <circle cx="830" cy="452" r="18" fill="#c98a5e"/><path d="M812 448 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <path d="M846 500 l20 -20" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><circle cx="868" cy="476" r="6" fill="#6b5446"/>
  <path d="M900 548 h26 l-4 -20 h-18 z" fill="#e0a33a"/>

  <!-- inset: calm pond, tiny ring -->
  <rect x="30" y="456" width="230" height="160" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="145" y="494" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">CALM POND</text>
  <rect x="48" y="510" width="194" height="90" rx="8" fill="#a9cfd0"/>
  <ellipse cx="145" cy="556" rx="18" ry="5" fill="none" stroke="#1f6f78" stroke-width="2" opacity=".5"/>
  <circle cx="145" cy="552" r="4" fill="#6b5446"/>
</svg>
