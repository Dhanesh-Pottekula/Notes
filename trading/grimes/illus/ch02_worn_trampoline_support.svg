<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A trampoline that sags more with each jump until it tears</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="boy">
      <rect x="-13" y="-52" width="11" height="52" rx="5" fill="#c98a5e"/><rect x="2" y="-52" width="11" height="52" rx="5" fill="#c98a5e"/>
      <rect x="-16" y="-62" width="32" height="22" rx="6" fill="#2f3e6b"/>
      <path d="M-20 -58 v-34 a20 20 0 0 1 40 0 v34 z" fill="#3b6fb0"/>
      <rect x="-5" y="-118" width="10" height="8" fill="#c98a5e"/>
      <circle cx="0" cy="-130" r="16" fill="#c98a5e"/><path d="M-16 -133 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
    </g>
    <g id="frame">
      <ellipse cx="0" cy="92" rx="96" ry="7" fill="#000" opacity=".08"/>
      <rect x="-82" y="0" width="10" height="90" fill="#3d3a3a"/><rect x="72" y="0" width="10" height="90" fill="#3d3a3a"/>
      <rect x="-90" y="-6" width="180" height="12" rx="6" fill="#9a9590"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <circle cx="480" cy="640" r="380" fill="#e0a33a" opacity=".1"/>
  <rect y="560" width="960" height="80" fill="#cdd3a8"/>
  <!-- guava tree -->
  <rect x="930" y="300" width="14" height="260" fill="#6b5446"/>
  <circle cx="936" cy="290" r="50" fill="#1f6f78" opacity=".8"/>

  <!-- FRAME 1: taut, big bounce -->
  <use href="#frame" transform="translate(125 470)"/>
  <path d="M55 470 Q125 474 195 470" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="125" y="506" text-anchor="middle" font-size="25" font-weight="800" fill="#2b2b2b" letter-spacing="1">SUPPORT</text>
  <g transform="translate(118 300)"><use href="#boy"/><path d="M-18 -88 l-14 -40 M18 -88 l14 -40" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/></g>
  <path d="M206 452 V160" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>

  <!-- FRAME 2: sagging, shorter bounce -->
  <use href="#frame" transform="translate(355 470)"/>
  <path d="M285 470 Q355 510 425 470" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <g transform="translate(350 380)"><use href="#boy"/><path d="M-18 -88 l-22 -24 M18 -88 l22 -24" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/></g>
  <path d="M436 452 V280" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>

  <!-- FRAME 3: deep sag, loose springs, only a little rise -->
  <use href="#frame" transform="translate(590 470)"/>
  <path d="M520 470 Q590 560 660 470" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round"/>
  <path d="M528 472 l-4 14 l6 6 l-4 12 M652 474 l6 12 l-6 6 l4 12" stroke="#9a9590" stroke-width="3" fill="none"/>
  <g transform="translate(590 512) scale(1 .82)"><use href="#boy"/><path d="M-18 -88 l-26 20 M18 -88 l26 20" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/></g>
  <path d="M506 210 Q520 320 560 380" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arc)"/>
  <path d="M672 452 V400" stroke="#1f6f78" stroke-width="5" marker-end="url(#arr)"/>
  <text x="472" y="130" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">WEAKER BOUNCES</text>
  <path d="M300 152 H644" stroke="#cbbfa9" stroke-width="3"/>
  <path d="M300 146 v12 M644 146 v12" stroke="#cbbfa9" stroke-width="3"/>

  <!-- FRAME 4: the fabric tears -->
  <use href="#frame" transform="translate(825 470)"/>
  <path d="M755 470 Q776 482 790 504 l6 -8 l4 14 l6 -6" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M895 470 Q874 482 862 500 l-6 -6 l-4 14 l-6 -4" stroke="#2b2b2b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(826 594) scale(.92)"><use href="#boy"/><path d="M-18 -88 l-30 -34 M18 -88 l30 -34" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/><circle cx="0" cy="-124" r="4" fill="#2e2a2a"/></g>
  <g fill="#d8cdb8"><circle cx="790" cy="596" r="12"/><circle cx="866" cy="598" r="13"/><circle cx="880" cy="588" r="9"/><circle cx="776" cy="590" r="8"/></g>
  <text x="825" y="130" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">THE BREAK</text>
  <path d="M825 146 V330" stroke="#e07a5f" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arc)"/>
</svg>
