<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A crowded ferry leaning one way, then lurching when one wave hits, while one man stays near the exit</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="pp">
      <rect x="-15" y="-60" width="12" height="60" rx="6" fill="#4a3f55"/><rect x="3" y="-60" width="12" height="60" rx="6" fill="#4a3f55"/>
      <path d="M-22 -58 v-40 a22 22 0 0 1 44 0 v40 z" fill="currentColor"/>
      <rect x="-6" y="-128" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-140" r="18" fill="#b07850"/><path d="M-18 -143 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
    </g>
    <g id="hull">
      <path d="M-196 -26 Q-176 0 -150 2 H150 Q176 0 196 -26 L156 56 H-156 Z" fill="#8a6d5a"/>
      <path d="M-180 -8 H180" stroke="#6b5446" stroke-width="6"/>
      <path d="M-170 22 H170" stroke="#6b5446" stroke-width="3" opacity=".6"/>
      <rect x="-150" y="-12" width="26" height="12" fill="#f6f1e7"/>
    </g>
    <g id="calm"><use href="#pp" color="#ffffff"/><path d="M-24 -100 q24 16 48 0 v14 q-24 14 -48 0 z" fill="#9a9590"/><path d="M-18 -143 a18 18 0 0 1 36 0 z" fill="#e5e0d8"/><path d="M22 -96 l14 40" stroke="#b07850" stroke-width="9" stroke-linecap="round"/><rect x="28" y="-60" width="18" height="20" rx="4" fill="#e0a33a"/></g>
  </defs>
  <rect width="960" height="640" fill="#e9e4dc"/>
  <!-- monsoon clouds with a sliver of sun -->
  <path d="M0 0 H960 V150 Q880 120 820 160 Q740 110 660 150 Q560 100 470 150 Q380 110 300 150 Q200 110 120 150 Q60 120 0 150 Z" fill="#b9b3ab"/>
  <path d="M560 150 L620 300 L700 300 L640 150 Z" fill="#f3e3b0" opacity=".35"/>
  <!-- far bank ghat -->
  <rect x="0" y="380" width="960" height="20" fill="#cbbfa9"/>
  <path d="M60 380 v-30 h40 v30 M120 380 v-46 l20 -20 l20 20 v46 M820 380 v-40 l16 -16 l16 16 v40" fill="#d8cdb8"/>
  <!-- river -->
  <rect y="400" width="960" height="240" fill="#cdb48e"/>
  <line x1="480" y1="170" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: everyone on one rail, gliding -->
  <path d="M30 520 q20 -6 40 0 M200 560 q20 -6 40 0 M350 530 q20 -6 40 0" stroke="#e8dcc4" stroke-width="3" fill="none"/>
  <g transform="translate(240 470) rotate(6)">
    <ellipse cx="0" cy="58" rx="170" ry="8" fill="#000" opacity=".08"/>
    <use href="#pp" color="#e0a33a" transform="translate(70 -8) scale(.62) rotate(14)"/>
    <use href="#pp" color="#1f6f78" transform="translate(110 -8) scale(.62) rotate(14)"/>
    <use href="#pp" color="#c0604a" transform="translate(146 -8) scale(.58) rotate(16)"/>
    <path d="M150 -66 l20 40 M112 -68 l24 34" stroke="#b07850" stroke-width="6" stroke-linecap="round"/>
    <use href="#calm" transform="translate(-118 -8) scale(.62)"/>
    <use href="#hull"/>
  </g>
  <text x="290" y="226" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CROWDED TRADE</text>
  <path d="M360 238 L352 330" stroke="#2b2b2b" stroke-width="3" marker-end="url(#ark)"/>
  <text x="160" y="296" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NEAR THE EXIT</text>
  <path d="M140 306 L130 336" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#ark)"/>

  <!-- RIGHT: one wave, everybody shifts at once -->
  <g transform="translate(700 470) rotate(-11)">
    <ellipse cx="0" cy="58" rx="170" ry="8" fill="#000" opacity=".08"/>
    <use href="#pp" color="#e0a33a" transform="translate(-30 -8) scale(.62) rotate(-22)"/>
    <use href="#pp" color="#1f6f78" transform="translate(10 -8) scale(.62) rotate(-26)"/>
    <use href="#pp" color="#c0604a" transform="translate(50 -8) scale(.58) rotate(-20)"/>
    <path d="M-44 -66 l-20 -34 M-4 -70 l-26 -26 M38 -62 l-18 -36" stroke="#b07850" stroke-width="6" stroke-linecap="round"/>
    <use href="#calm" transform="translate(-118 -8) scale(.62)"/>
    <use href="#hull"/>
  </g>
  <!-- the crowd's shift -->
  <path d="M780 330 Q720 290 640 320" stroke="#e07a5f" stroke-width="5" fill="none" marker-end="url(#arr)"/>
  <path d="M800 360 Q740 330 680 350" stroke="#e07a5f" stroke-width="4" fill="none" marker-end="url(#arr)"/>
  <!-- flying sack + jumping goat -->
  <path d="M730 270 q-6 -30 10 -36 h30 q12 12 4 36 z" fill="#efe6d2" stroke="#b9ad98" stroke-width="2" transform="translate(-30 50) rotate(-30 750 255)"/>
  <g transform="translate(810 300) rotate(-20)"><rect x="-22" y="-12" width="44" height="22" rx="10" fill="#fff"/><circle cx="-26" cy="-14" r="9" fill="#fff"/><path d="M-28 -22 l-6 -8 M-22 -22 l2 -8" stroke="#9a9590" stroke-width="2"/><path d="M-14 8 l-6 14 M-4 8 l-2 14 M10 8 l4 14 M18 8 l8 12" stroke="#9a9590" stroke-width="3"/></g>
  <!-- the wave -->
  <path d="M960 520 Q930 400 860 420 Q900 440 880 480 Q860 520 900 540 L960 560 Z" fill="#1f6f78" opacity=".85"/>
  <path d="M860 420 q30 -10 50 20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g fill="#fff"><circle cx="856" cy="400" r="6"/><circle cx="840" cy="420" r="5"/><circle cx="872" cy="384" r="5"/><circle cx="830" cy="440" r="4"/></g>
  <text x="890" y="230" text-anchor="end" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE WAVE</text>
  <path d="M880 244 Q900 320 890 380" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#ark)"/>
</svg>
