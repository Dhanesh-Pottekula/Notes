<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>The last bidder jumps the price at a mandi auction, then the next lot sells lower</title>
  <defs>
    <marker id="aru" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3f9a6b"/></marker>
    <marker id="ard" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sack"><path d="M-34 0 q-10 -50 6 -70 h56 q16 20 6 70 z" fill="#d8b98a"/><path d="M-26 -70 q26 -12 52 0" stroke="#b9976b" stroke-width="5" fill="none"/></g>
    <g id="onions" fill="#b0506a"><circle cx="-20" cy="0" r="10"/><circle cx="0" cy="-2" r="10"/><circle cx="20" cy="0" r="10"/><circle cx="-10" cy="-14" r="10"/><circle cx="10" cy="-14" r="10"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- tin shed roof -->
  <rect width="960" height="40" fill="#b9ad98"/>
  <path d="M0 40 H960" stroke="#9a9590" stroke-width="6"/>
  <path d="M30 0 v40 M80 0 v40 M130 0 v40 M180 0 v40 M230 0 v40 M280 0 v40 M330 0 v40 M380 0 v40 M430 0 v40 M480 0 v40 M530 0 v40 M580 0 v40 M630 0 v40 M680 0 v40 M730 0 v40 M780 0 v40 M830 0 v40 M880 0 v40 M930 0 v40" stroke="#a39780" stroke-width="3"/>
  <rect y="540" width="960" height="100" fill="#d8cdb8"/>
  <!-- dust light -->
  <path d="M120 40 L260 540 H420 L220 40 Z" fill="#e0a33a" opacity=".07"/>

  <!-- auctioneer pointing -->
  <g transform="translate(130 540) scale(1.1)"><use href="#pp" color="#ffffff"/>
    <rect x="-17" y="-178" width="34" height="14" rx="3" fill="#fff"/>
    <path d="M22 -104 l50 -24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="-42" y="-74" width="26" height="32" rx="2" fill="#efe6d2" stroke="#b9ad98" stroke-width="2"/>
    <path d="M-10 -136 h20" stroke="#2e2a2a" stroke-width="3"/>
  </g>
  <!-- price board for this lot -->
  <rect x="40" y="190" width="120" height="74" rx="6" fill="#3d3a3a"/>
  <text x="100" y="238" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">₹40</text>

  <!-- the last bidder on an onion sack -->
  <use href="#sack" transform="translate(380 540)"/>
  <g transform="translate(380 472)"><use href="#pp" color="#c9b6e4"/>
    <path d="M-24 -98 l12 0 l-8 20 z M10 -100 l14 4 l-4 18 z" fill="#fff" opacity=".7"/>
    <path d="M-12 -126 q12 14 24 0" stroke="#e0a33a" stroke-width="4" fill="none"/>
    <path d="M22 -104 l18 -66" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <path d="M-22 -104 l-22 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="4" cy="-140" rx="7" ry="5" fill="#2e2a2a"/>
  </g>
  <path d="M424 290 V140" stroke="#3f9a6b" stroke-width="12" marker-end="url(#aru)"/>
  <text x="330" y="106" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BUYING CLIMAX</text>

  <!-- everyone else has stopped: hands down, turning away -->
  <text x="580" y="270" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO ONE LEFT</text>
  <g transform="translate(540 540)"><use href="#pp" color="#efe6d2"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#e5e0d8"/><path d="M-22 -104 l-18 -14 M22 -104 l18 -14" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-24 -100 q24 20 48 0 v12 q-24 18 -48 0 z" fill="#9a9590"/></g>
  <g transform="translate(626 540) scale(-1 1)"><use href="#pp" color="#7a4e7e"/><path d="M-19 -152 a19 19 0 0 1 38 0 v8 h-38 z" fill="#2e2a2a"/><path d="M-22 -104 l-6 44 M22 -104 l26 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="40" y="-90" width="26" height="34" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/></g>
  <path d="M664 470 h30 m-10 -10 l10 10 l-10 10" stroke="#9a9590" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- crates of tomatoes / onion sacks -->
  <rect x="200" y="500" width="110" height="40" fill="#8a6d5a"/><use href="#onions" transform="translate(255 494)"/>
  <rect x="440" y="510" width="80" height="30" fill="#8a6d5a"/><g fill="#e07a5f"><circle cx="460" cy="504" r="9"/><circle cx="480" cy="504" r="9"/><circle cx="500" cy="504" r="9"/></g>

  <!-- RIGHT: the next lot, half-hearted buyer, lower price -->
  <line x1="712" y1="120" x2="712" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <use href="#sack" transform="translate(770 540) scale(.8)"/><use href="#sack" transform="translate(830 540) scale(.8)"/>
  <g transform="translate(900 540) scale(.85)"><use href="#pp" color="#1f6f78"/><path d="M-22 -104 l-10 -30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-32 -136 v-12" stroke="#c98a5e" stroke-width="5" stroke-linecap="round"/><path d="M22 -104 l6 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <rect x="742" y="190" width="120" height="74" rx="6" fill="#3d3a3a"/>
  <text x="802" y="238" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">₹22</text>
  <path d="M880 190 V264" stroke="#e07a5f" stroke-width="8" marker-end="url(#ard)"/>
  <text x="830" y="160" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">LOWER PRICE</text>
</svg>
