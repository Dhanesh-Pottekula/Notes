<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A surfer paddles hard on clean sets, sits out the chop and waits on the beach when the sea is flat</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="curl"><path d="M-80 60 Q-40 60 -10 20 Q10 -10 40 -10 Q70 -10 70 20 Q50 0 34 20 Q20 40 30 60 Z" fill="#1f6f78"/><path d="M-10 20 Q10 -10 40 -10 Q70 -10 70 20" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"/></g>
    <g id="palm"><path d="M0 0 Q-10 -120 30 -220" stroke="#6b5446" stroke-width="12" fill="none" stroke-linecap="round"/><g fill="#3f9a6b"><path d="M30 -220 q-60 -20 -100 20 q50 -40 100 -20"/><path d="M30 -220 q60 -30 100 10 q-50 -30 -100 -10"/><path d="M30 -220 q-20 -50 -70 -60 q50 10 70 60"/><path d="M30 -220 q30 -50 80 -50 q-50 10 -80 50"/></g></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- cliff with café -->
  <path d="M800 400 L820 220 L870 180 L960 170 V400 Z" fill="#c0604a"/>
  <rect x="880" y="140" width="60" height="34" fill="#fff"/><path d="M874 140 l36 -20 l36 20 z" fill="#e0a33a"/>
  <!-- sea -->
  <rect y="300" width="960" height="340" fill="#7fbfbf"/>
  <rect x="640" y="300" width="320" height="110" fill="#9fd0cc"/>
  <path d="M660 340 h120 M700 370 h140 M650 395 h90" stroke="#fff" stroke-width="2" opacity=".6"/>
  <!-- sand for the right zone -->
  <path d="M640 640 V420 Q760 396 960 404 V640 Z" fill="#ead9b0"/>
  <path d="M0 600 H640 V640 H0 Z" fill="#ead9b0"/>
  <path d="M320 110 V280 M640 110 V280" stroke="#cbbfa9" stroke-width="3" stroke-dasharray="8 8"/>

  <text x="160" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">PADDLE HARD</text>
  <text x="480" y="72" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">CHOP: SIT OUT</text>
  <text x="786" y="72" text-anchor="middle" font-size="25" font-weight="800" fill="#2b2b2b" letter-spacing="1">WAIT ON THE BEACH</text>

  <!-- inset: her own form, good days and bad -->
  <rect x="404" y="106" width="152" height="70" rx="12" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M416 146 h20 l8 -24 l10 40 l8 -22 h14 l6 -10 l6 10 h20 l8 -26 l10 34 l6 -8 h14" stroke="#e07a5f" stroke-width="3" fill="none" stroke-linejoin="round"/>

  <!-- LEFT: clean evenly spaced sets, surfer catching one -->
  <use href="#curl" transform="translate(70 360)"/>
  <use href="#curl" transform="translate(190 420)"/>
  <use href="#curl" transform="translate(110 500)"/>
  <g transform="translate(210 400) rotate(-14)">
    <ellipse cx="0" cy="0" rx="64" ry="9" fill="#fff"/>
    <rect x="-40" y="-24" width="54" height="22" rx="10" fill="#2b2b2b"/>
    <rect x="-70" y="-18" width="34" height="12" rx="6" fill="#4a3f55"/>
    <circle cx="26" cy="-22" r="13" fill="#c98a5e"/><path d="M14 -26 a13 13 0 0 1 26 0 z" fill="#2e2a2a"/>
    <path d="M8 -8 l22 24" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M120 300 Q200 230 280 330" stroke="#e07a5f" stroke-width="5" fill="none" marker-end="url(#arr)"/>

  <!-- MIDDLE: choppy whitecaps, another surfer wiping out -->
  <g stroke="#fff" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <path d="M340 340 l14 -12 l14 12 l14 -14 l14 14"/><path d="M500 330 l12 -12 l12 12 l12 -10"/><path d="M560 380 l14 -12 l14 12 l14 -14"/>
    <path d="M350 460 l14 -14 l14 14 l14 -10"/><path d="M520 470 l14 -12 l14 12 l14 -12 l14 12"/><path d="M400 540 l12 -10 l12 10 l12 -12"/>
  </g>
  <g transform="rotate(-50 470 380)"><ellipse cx="470" cy="380" rx="58" ry="9" fill="#fff"/></g>
  <circle cx="470" cy="450" r="34" fill="#fff" opacity=".85"/><circle cx="440" cy="460" r="20" fill="#fff" opacity=".85"/><circle cx="500" cy="458" r="22" fill="#fff" opacity=".85"/>
  <rect x="456" y="396" width="12" height="34" rx="5" fill="#4a3f55" transform="rotate(20 462 413)"/>
  <rect x="474" y="398" width="12" height="34" rx="5" fill="#4a3f55" transform="rotate(-24 480 415)"/>
  <rect x="456" y="424" width="34" height="30" rx="10" fill="#e07a5f"/>
  <path d="M452 434 l-26 -14 M494 434 l26 -10" stroke="#b07850" stroke-width="8" stroke-linecap="round"/>

  <!-- RIGHT: flat glassy water, she waits on the sand -->
  <use href="#palm" transform="translate(900 560)"/>
  <rect x="742" y="410" width="34" height="140" rx="17" fill="#fff"/>
  <path d="M759 420 v120" stroke="#e07a5f" stroke-width="3"/>
  <ellipse cx="830" cy="552" rx="70" ry="7" fill="#000" opacity=".08"/>
  <rect x="824" y="530" width="74" height="16" rx="7" fill="#4a3f55"/>
  <rect x="884" y="530" width="14" height="22" rx="6" fill="#c98a5e"/>
  <path d="M804 546 v-50 a24 24 0 0 1 48 0 v50 z" fill="#2b2b2b"/>
  <rect x="822" y="460" width="12" height="10" fill="#c98a5e"/>
  <circle cx="828" cy="446" r="18" fill="#c98a5e"/><path d="M810 444 a18 18 0 0 1 36 -2 l-4 -10 a18 18 0 0 0 -28 2 z" fill="#2e2a2a"/><circle cx="812" cy="438" r="8" fill="#2e2a2a"/>
  <path d="M848 498 l24 -16" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <circle cx="878" cy="474" r="16" fill="#3f9a6b"/><path d="M874 460 l8 -20" stroke="#e07a5f" stroke-width="3"/>
</svg>
