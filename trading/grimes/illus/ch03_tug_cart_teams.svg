<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Two teams pushing a cart: trend, range, then breakout past the last line</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
      <circle cx="0" cy="-148" r="19" fill="#b07850"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <circle cx="820" cy="90" r="46" fill="#e0a33a" opacity=".5"/>
  <rect y="500" width="960" height="140" fill="#e6d8bd"/>
  <!-- neem tree -->
  <rect x="70" y="200" width="20" height="300" fill="#6b5446"/>
  <ellipse cx="80" cy="180" rx="80" ry="64" fill="#3f9a6b" opacity=".8"/>
  <!-- lime lines: old ones scuffed, the newest redrawn -->
  <g stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M250 506 l-10 120" opacity=".35" stroke-dasharray="14 10"/>
    <path d="M380 506 l-10 120" opacity=".45" stroke-dasharray="18 8"/>
    <path d="M520 506 l-10 120" opacity=".55" stroke-dasharray="22 8"/>
    <path d="M664 506 l-10 120"/>
  </g>
  <!-- boy redrawing the line -->
  <rect x="682" y="566" width="22" height="22" rx="4" fill="#9a9590"/>
  <path d="M660 590 v-24 a14 14 0 0 1 28 0 v24 z" fill="#e0a33a" transform="rotate(-20 674 590)"/>
  <circle cx="664" cy="550" r="12" fill="#c98a5e"/><path d="M652 548 a12 12 0 0 1 24 0 z" fill="#2e2a2a"/>
  <path d="M664 574 l-6 22" stroke="#c98a5e" stroke-width="7" stroke-linecap="round"/>

  <!-- tyre history on the ground -->
  <text x="140" y="552" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">TREND</text>
  <path d="M40 604 H240" stroke="#8a6d5a" stroke-width="5" stroke-dasharray="10 6"/>
  <text x="450" y="552" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">RANGE</text>
  <path d="M240 604 l40 -16 l40 26 l40 -24 l40 24 l40 -26 l40 24 l40 -20 l40 18 l40 -18" stroke="#8a6d5a" stroke-width="5" fill="none" stroke-dasharray="10 6" stroke-linejoin="round"/>
  <text x="816" y="552" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">BREAKOUT</text>
  <path d="M700 604 H918" stroke="#e07a5f" stroke-width="10" marker-end="url(#arr)"/>

  <!-- the cart with grain sacks -->
  <ellipse cx="520" cy="504" rx="110" ry="7" fill="#000" opacity=".08"/>
  <g fill="#efe6d2" stroke="#b9ad98" stroke-width="2"><path d="M450 372 q-4 -40 14 -50 h44 q14 14 6 50 z"/><path d="M510 372 q-4 -46 14 -56 h44 q16 16 8 56 z"/><path d="M480 340 q-2 -30 12 -36 h40 q10 10 6 36 z"/></g>
  <rect x="440" y="370" width="160" height="70" rx="6" fill="#8a6d5a"/>
  <path d="M440 390 h160 M440 412 h160" stroke="#6b5446" stroke-width="3"/>
  <circle cx="520" cy="450" r="52" fill="none" stroke="#6b5446" stroke-width="10"/>
  <path d="M520 398 v104 M468 450 h104 M483 413 l74 74 M557 413 l-74 74" stroke="#6b5446" stroke-width="5"/>
  <circle cx="520" cy="450" r="10" fill="#3d3a3a"/>

  <!-- left team (dhotis) pushing right -->
  <g transform="translate(296 500) rotate(25)"><use href="#pp" color="#efe6d2"/><path d="M22 -100 l72 -32" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(330 500) rotate(25)"><use href="#pp" color="#ffffff"/><path d="M22 -100 l48 -22" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <!-- right team (T-shirts) pushing back -->
  <g transform="translate(744 500) rotate(-25)"><use href="#pp" color="#7a4e7e"/><path d="M-22 -100 l-72 -32" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(710 500) rotate(-25)"><use href="#pp" color="#1f6f78"/><path d="M-22 -100 l-48 -22" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- sweat -->
  <path d="M424 334 q-4 8 0 12 q4 -4 0 -12 M640 332 q-4 8 0 12 q4 -4 0 -12" fill="#7fb3c4"/>

  <!-- judge with walking stick -->
  <g transform="translate(890 500) scale(.85)"><use href="#pp" color="#efe6d2"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#e5e0d8"/><path d="M-22 -100 l-14 50" stroke="#b07850" stroke-width="10" stroke-linecap="round"/><line x1="-38" y1="-52" x2="-44" y2="0" stroke="#6b5446" stroke-width="6"/></g>
</svg>
