<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A birdwatcher compares her guidebook to a half-hidden bird in the fog</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="kf"><ellipse cx="0" cy="0" rx="22" ry="13" fill="#1f6f78"/><ellipse cx="2" cy="6" rx="14" ry="7" fill="#e07a5f"/><circle cx="18" cy="-8" r="10" fill="#1f6f78"/><path d="M26 -8 l20 3 l-20 3 z" fill="#2b2b2b"/><circle cx="20" cy="-10" r="2.5" fill="#fff"/><path d="M-20 -2 l-14 6 l14 4 z" fill="#1f6f78"/></g>
    <g id="ghost"><ellipse cx="0" cy="0" rx="18" ry="10"/><circle cx="14" cy="-7" r="8"/><path d="M20 -7 l14 2 l-14 3 z M-16 -2 l-12 6 l12 3 z"/></g>
  </defs>
  <rect width="960" height="640" fill="#e8ecec"/>
  <!-- filmstrip of birds already logged -->
  <g opacity=".35">
    <rect x="30" y="120" width="420" height="70" fill="none" stroke="#9aa6a8" stroke-width="3"/>
    <path d="M30 130 h420 M30 180 h420" stroke="#9aa6a8" stroke-width="2" stroke-dasharray="6 8"/>
    <g fill="#9aa6a8"><use href="#ghost" transform="translate(70 158)"/><use href="#ghost" transform="translate(150 158)"/><use href="#ghost" transform="translate(230 158)"/><use href="#ghost" transform="translate(310 158)"/><use href="#ghost" transform="translate(390 158)"/></g>
  </g>
  <!-- fog curtain over the future -->
  <path d="M500 40 H940 V250 q-30 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 q-28 18 -55 0 Z" fill="#fff" opacity=".9"/>
  <path d="M555 40 v206 M610 40 v210 M665 40 v206 M720 40 v210 M775 40 v206 M830 40 v210 M885 40 v206" stroke="#dfe4e4" stroke-width="4"/>
  <rect x="490" y="30" width="460" height="16" rx="8" fill="#b9ad98"/>
  <text x="720" y="160" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO PEEKING</text>
  <!-- middle distance: bare acacias in mist -->
  <path d="M120 330 v-60 l-20 -20 M120 290 l24 -26" stroke="#b7bfc0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M470 330 v-70 l-24 -18 M470 280 l20 -30" stroke="#b7bfc0" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect y="330" width="960" height="310" fill="#d3dbd6"/>
  <rect y="300" width="960" height="60" fill="#e8ecec" opacity=".7"/>

  <!-- tree on the right, bird half-hidden in leaves -->
  <path d="M900 640 V380 Q880 340 940 300" stroke="#6b5446" stroke-width="22" fill="none"/>
  <path d="M900 420 Q800 410 640 420" stroke="#6b5446" stroke-width="9" fill="none" stroke-linecap="round"/>
  <g fill="#6f9a7a">
    <ellipse cx="690" cy="396" rx="30" ry="16"/><ellipse cx="740" cy="380" rx="26" ry="14"/><ellipse cx="700" cy="414" rx="22" ry="10"/><ellipse cx="760" cy="410" rx="26" ry="12"/><ellipse cx="724" cy="372" rx="22" ry="10"/><ellipse cx="680" cy="372" rx="18" ry="10"/>
  </g>
  <g transform="translate(770 400) scale(1.4)">
    <path d="M-8 2 q14 -20 32 -6 q-10 14 -32 6 z" fill="#3a6f8f" opacity=".85"/>
    <path d="M22 -10 l26 3 l-26 4 z" fill="#2b2b2b"/>
    <circle cx="16" cy="-10" r="3" fill="#2b2b2b"/>
  </g>
  <rect x="610" y="300" width="300" height="160" fill="#e8ecec" opacity=".2"/>
  <text x="740" y="300" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">REAL CHART</text>
  <path d="M740 312 L760 362" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arr)"/>

  <!-- birdwatcher kneeling in the reeds -->
  <ellipse cx="170" cy="560" rx="80" ry="7" fill="#000" opacity=".08"/>
  <rect x="140" y="510" width="70" height="16" rx="7" fill="#4a3f55"/>
  <rect x="196" y="510" width="14" height="50" rx="6" fill="#4a3f55"/>
  <rect x="120" y="540" width="60" height="16" rx="7" fill="#4a3f55"/>
  <path d="M132 520 v-74 a28 28 0 0 1 56 0 v74 z" fill="#6f6b3c"/>
  <circle cx="160" cy="470" r="12" fill="none" stroke="#3d3a3a" stroke-width="3"/>
  <rect x="152" y="404" width="14" height="12" fill="#c98a5e"/>
  <circle cx="162" cy="386" r="20" fill="#c98a5e"/>
  <path d="M140 382 a22 20 0 0 1 44 -4 z" fill="#6f6b3c"/><path d="M178 378 h22 v6 h-22 z" fill="#6f6b3c"/>
  <path d="M176 384 l8 -2" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M180 438 l60 6" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <!-- the guidebook -->
  <path d="M232 412 l84 -10 l84 10 v80 l-84 -8 l-84 8 z" fill="#fff" stroke="#b9ad98" stroke-width="3"/>
  <path d="M316 402 v82" stroke="#b9ad98" stroke-width="3"/>
  <use href="#kf" transform="translate(352 448) scale(.95)"/>
  <path d="M248 430 h52 M248 446 h52 M248 462 h40" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/>
  <text x="356" y="534" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">RULE SHEET</text>
  <path d="M330 506 V498" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arr)"/>
  <!-- book picture vs real bird -->
  <path d="M400 440 Q540 380 680 400" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 7"/>
  <circle cx="540" cy="400" r="20" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="540" y="409" text-anchor="middle" font-size="26" font-weight="800" fill="#7a4e7e">?</text>
  <!-- reeds -->
  <g stroke="#7f9a6a" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M30 640 q6 -80 -6 -140 M60 640 q-2 -70 10 -120 M440 640 q4 -60 -8 -110 M470 640 q-4 -70 8 -130 M560 640 q6 -60 -4 -100 M600 640 q-4 -50 10 -90 M820 640 q4 -60 -6 -110"/>
  </g>
</svg>
