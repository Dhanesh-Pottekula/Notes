<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A good detective looks for evidence against her theory; a bad one bins it</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="paper"><rect x="-18" y="-22" width="36" height="44" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-10 -10 h20 M-10 0 h20 M-10 10 h14" stroke="#cbbfa9" stroke-width="2"/><circle cx="0" cy="-22" r="3" fill="#e07a5f"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT -->
  <text x="240" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">GOOD DETECTIVE</text>
  <rect x="40" y="110" width="190" height="200" rx="6" fill="#c9a87c"/>
  <rect x="62" y="130" width="70" height="86" fill="#fff"/>
  <circle cx="97" cy="160" r="16" fill="#9a9590"/><path d="M71 214 q26 -46 52 0 z" fill="#9a9590"/>
  <rect x="146" y="130" width="70" height="90" fill="#efe6d2"/>
  <path d="M154 148 h54 M154 164 h54 M154 180 h54 M154 196 h40" stroke="#b9ad98" stroke-width="3"/>
  <circle cx="181" cy="132" r="4" fill="#1f6f78"/><circle cx="97" cy="132" r="4" fill="#e07a5f"/>
  <use href="#paper" transform="translate(96 262) rotate(-4)"/><use href="#paper" transform="translate(176 262) rotate(5)"/>
  <!-- detective comparing a fingerprint card -->
  <ellipse cx="290" cy="562" rx="40" ry="6" fill="#000" opacity=".08"/>
  <rect x="274" y="498" width="13" height="62" rx="6" fill="#8a7a4a"/><rect x="293" y="498" width="13" height="62" rx="6" fill="#8a7a4a"/>
  <path d="M264 500 v-46 a26 26 0 0 1 52 0 v46 z" fill="#c2a86a"/>
  <rect x="284" y="414" width="12" height="10" fill="#b07850"/>
  <circle cx="290" cy="398" r="20" fill="#b07850"/><path d="M270 396 a20 20 0 0 1 40 0 l-4 -4 a16 16 0 0 0 -32 0 z" fill="#2e2a2a"/><circle cx="308" cy="388" r="10" fill="#2e2a2a"/>
  <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="276" cy="398" r="6"/><circle cx="264" cy="400" r="5"/></g>
  <path d="M282 410 q8 18 0 34" stroke="#e0a33a" stroke-width="2" fill="none"/>
  <path d="M268 450 l-30 -22" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  <rect x="210" y="404" width="34" height="26" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M220 412 q7 -6 14 0 q-7 12 -14 4" stroke="#7a4e7e" stroke-width="2" fill="none"/>
  <path d="M310 450 l-40 -50" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  <circle cx="262" cy="390" r="0" fill="none"/>
  <circle cx="234" cy="372" r="18" fill="#cfe3e8" opacity=".7" stroke="#3d3a3a" stroke-width="5"/>
  <path d="M248 386 l20 16" stroke="#3d3a3a" stroke-width="6" stroke-linecap="round"/>
  <!-- desk with the growing pile -->
  <rect x="330" y="462" width="140" height="14" fill="#6b5446"/>
  <rect x="340" y="476" width="12" height="84" fill="#6b5446"/><rect x="448" y="476" width="12" height="84" fill="#6b5446"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="2"><rect x="360" y="446" width="80" height="16"/><rect x="364" y="430" width="76" height="16"/><rect x="358" y="414" width="80" height="16"/><rect x="366" y="398" width="72" height="16"/><rect x="362" y="382" width="78" height="16"/></g>
  <g fill="#1f6f78"><rect x="430" y="434" width="14" height="8"/><rect x="430" y="402" width="14" height="8"/><rect x="430" y="386" width="14" height="8"/></g>
  <text x="250" y="612" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">EVIDENCE AGAINST</text>
  <path d="M380 590 Q400 560 396 486" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#arr)"/>

  <!-- RIGHT -->
  <text x="720" y="66" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">BAD DETECTIVE</text>
  <rect x="510" y="110" width="210" height="200" rx="6" fill="#c9a87c"/>
  <rect x="580" y="170" width="64" height="76" fill="#fff"/>
  <circle cx="612" cy="196" r="14" fill="#9a9590"/><path d="M588 244 q24 -40 48 0 z" fill="#9a9590"/>
  <use href="#paper" transform="translate(540 140)"/><use href="#paper" transform="translate(546 270)"/><use href="#paper" transform="translate(690 140)"/><use href="#paper" transform="translate(690 268)"/>
  <g stroke="#c0392b" stroke-width="2.5"><path d="M540 140 L612 172 M546 270 L612 244 M690 140 L612 172 M690 268 L612 244"/></g>
  <!-- smug officer -->
  <ellipse cx="790" cy="562" rx="40" ry="6" fill="#000" opacity=".08"/>
  <rect x="774" y="496" width="13" height="64" rx="6" fill="#8a7a4a"/><rect x="793" y="496" width="13" height="64" rx="6" fill="#8a7a4a"/>
  <path d="M762 498 v-48 a28 28 0 0 1 56 0 v48 z" fill="#c2a86a"/>
  <rect x="784" y="410" width="12" height="10" fill="#c98a5e"/>
  <circle cx="790" cy="394" r="20" fill="#c98a5e"/><path d="M770 390 a20 20 0 0 1 40 0 q-20 -14 -40 0 z" fill="#2e2a2a"/><path d="M770 388 q20 -22 42 -2" stroke="#2e2a2a" stroke-width="4" fill="none"/>
  <path d="M772 402 q8 8 16 0 q8 8 16 0" stroke="#2e2a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M776 392 h6 M792 392 h6" stroke="#2e2a2a" stroke-width="2.5"/>
  <path d="M766 450 l-46 -110" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <use href="#paper" transform="translate(716 324) rotate(-8)"/>
  <path d="M818 450 l10 46" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <!-- desk + bin of ignored papers -->
  <rect x="520" y="462" width="160" height="14" fill="#6b5446"/>
  <rect x="530" y="476" width="12" height="84" fill="#6b5446"/><rect x="658" y="476" width="12" height="84" fill="#6b5446"/>
  <path d="M846 500 h70 l-8 60 h-54 z" fill="#9a9590"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="2"><circle cx="860" cy="496" r="12"/><circle cx="882" cy="490" r="13"/><circle cx="904" cy="498" r="11"/><circle cx="930" cy="552" r="10"/></g>
  <g fill="#1f6f78"><rect x="874" y="484" width="12" height="6"/><rect x="852" y="492" width="10" height="6"/></g>
</svg>
