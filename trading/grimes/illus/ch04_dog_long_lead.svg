<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A dog on a long lead runs to the end, drifts back, then both walk on</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="dog">
      <path d="M-34 -30 q-20 -10 -24 -30" stroke="#d9a24a" stroke-width="7" fill="none" stroke-linecap="round"/>
      <rect x="-30" y="-20" width="8" height="22" rx="4" fill="#c8913c"/><rect x="18" y="-20" width="8" height="22" rx="4" fill="#c8913c"/>
      <ellipse cx="0" cy="-30" rx="38" ry="16" fill="#d9a24a"/>
      <circle cx="40" cy="-46" r="14" fill="#d9a24a"/><path d="M48 -44 l14 4 l-14 6 z" fill="#d9a24a"/>
      <path d="M32 -56 l-4 -14 l12 8 z" fill="#c8913c"/><circle cx="44" cy="-50" r="2.5" fill="#2e2a2a"/>
      <rect x="26" y="-42" width="8" height="10" fill="#e07a5f"/>
    </g>
    <g id="man">
      <ellipse cx="0" cy="2" rx="28" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#fff"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
      <path d="M-22 -104 l-6 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- skyline + sea + wall -->
  <g fill="#d8cdb8"><rect x="40" y="70" width="50" height="90"/><rect x="100" y="40" width="40" height="120"/><rect x="150" y="90" width="60" height="70"/><rect x="700" y="60" width="44" height="100"/><rect x="760" y="90" width="70" height="70"/><rect x="840" y="50" width="40" height="110"/></g>
  <rect y="160" width="960" height="110" fill="#7fbfbf"/>
  <path d="M60 200 q20 -8 40 0 M300 230 q20 -8 40 0 M600 190 q20 -8 40 0 M820 240 q20 -8 40 0" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M500 100 q10 -10 20 0 q10 -10 20 0 M560 130 q8 -8 16 0 q8 -8 16 0" stroke="#3d3a3a" stroke-width="2.5" fill="none"/>
  <rect y="270" width="960" height="40" fill="#cbbfa9"/>
  <rect y="310" width="960" height="330" fill="#e6dccb"/>

  <!-- the band: how far the lead lets it roam -->
  <rect x="96" y="440" width="600" height="140" rx="60" fill="#1f6f78" fill-opacity=".07" stroke="#1f6f78" stroke-width="4" stroke-dasharray="14 10"/>
  <text x="150" y="424" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">BAND</text>

  <!-- calm owner holding the long lead -->
  <use href="#man" transform="translate(250 520)"/>
  <path d="M272 416 l24 26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  <rect x="290" y="436" width="22" height="16" rx="5" fill="#e07a5f"/>
  <path d="M312 444 L612 476" stroke="#3d3a3a" stroke-width="3"/>

  <!-- dog at full stretch, front paws up -->
  <g transform="translate(600 540) rotate(-18)"><use href="#dog"/></g>
  <path d="M612 470 l8 -8" stroke="#3d3a3a" stroke-width="3"/>
  <path d="M690 470 l20 -6 M692 486 l22 2" stroke="#d9a24a" stroke-width="4" stroke-linecap="round"/>
  <text x="620" y="380" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">STRONG RUN</text>

  <!-- ghost: drifted back near his legs -->
  <g opacity=".45" transform="translate(370 560) scale(-1 1)"><use href="#dog"/></g>
  <path d="M560 560 Q480 600 410 574" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)"/>
  <text x="300" y="616" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">ENTER HERE</text>
  <path d="M380 594 L374 574" stroke="#2b2b2b" stroke-width="3" marker-end="url(#ark)"/>

  <!-- then both walk on together -->
  <path d="M430 520 Q600 430 760 480" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="8 7" marker-end="url(#arr)" opacity=".8"/>
  <g opacity=".55">
    <use href="#man" transform="translate(820 540)"/>
    <path d="M842 436 l20 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M864 470 Q880 490 896 500" stroke="#3d3a3a" stroke-width="3" fill="none"/>
    <use href="#dog" transform="translate(890 556) scale(.9)"/>
  </g>
</svg>
