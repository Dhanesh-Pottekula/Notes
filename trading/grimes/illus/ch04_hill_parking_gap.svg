<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Parking on a hill: too tight, a measured stop distance, or wasted room</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <!-- car facing right (uphill), wheels on y=0, length 110 -->
    <g id="car">
      <path d="M-55 -14 v-20 q0 -8 8 -8 h14 l18 -22 h44 l18 22 h8 q8 0 8 8 v20 z" fill="currentColor"/>
      <path d="M-26 -42 l14 -18 h18 v18 z M12 -42 v-18 h22 l14 18 z" fill="#cfe3e8"/>
      <circle cx="-30" cy="-12" r="12" fill="#3d3a3a"/><circle cx="32" cy="-12" r="12" fill="#3d3a3a"/>
      <circle cx="-30" cy="-12" r="4" fill="#b9ad98"/><circle cx="32" cy="-12" r="4" fill="#b9ad98"/>
    </g>
    <g id="road"><path d="M-160 0 H160 V60 H-160 Z" fill="#9a9590"/><path d="M-160 0 H160" stroke="#cbbfa9" stroke-width="6"/></g>
  </defs>
  <rect width="960" height="640" fill="#eef0ee"/>
  <!-- misty hills, pines, stepped houses -->
  <path d="M0 360 Q160 250 320 320 Q480 230 640 300 Q800 220 960 290 V640 H0 Z" fill="#d3dbd6"/>
  <g fill="#7f9a6a"><path d="M60 330 l18 -50 l18 50 z"/><path d="M380 300 l16 -44 l16 44 z"/><path d="M880 290 l18 -50 l18 50 z"/></g>
  <g><rect x="560" y="290" width="40" height="34" fill="#e07a5f"/><path d="M556 292 l24 -18 l24 18 z" fill="#8a6d5a"/><rect x="200" y="310" width="40" height="34" fill="#e0a33a"/><path d="M196 312 l24 -18 l24 18 z" fill="#8a6d5a"/></g>
  <rect y="560" width="960" height="80" fill="#cbbfa9"/>
  <path d="M320 230 V600 M640 230 V600" stroke="#d8cdb8" stroke-width="3"/>

  <!-- inset: how far cars usually roll here -->
  <rect x="380" y="30" width="200" height="86" rx="14" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <rect x="400" y="80" width="160" height="20" fill="#e0a33a"/>
  <path d="M410 80 v8 M430 80 v12 M450 80 v8 M470 80 v12 M490 80 v8 M510 80 v12 M530 80 v8 M550 80 v12" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M500 64 H452" stroke="#e07a5f" stroke-width="4" marker-end="url(#arr)"/>
  <rect x="500" y="48" width="44" height="20" rx="6" fill="#9a9590"/>

  <text x="160" y="210" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">TOO TIGHT</text>
  <text x="480" y="210" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">STOP DISTANCE</text>
  <text x="800" y="210" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">WASTED ROOM</text>

  <!-- LEFT: bumper to bumper, the roll-back hits -->
  <g transform="translate(160 470) rotate(-9)">
    <use href="#road"/>
    <use href="#car" color="#fff" transform="translate(-44 0)"/>
    <use href="#car" color="#9a9590" transform="translate(68 0)"/>
    <path d="M12 -30 l6 -14 l4 12 l12 -8 l-4 14 l12 4 l-14 4 l2 12 l-10 -8 l-8 10 l0 -14 l-12 -2 z" fill="#e0a33a"/>
    <circle cx="-30" cy="-54" r="11" fill="#c98a5e"/><path d="M-41 -56 a11 11 0 0 1 22 0 z" fill="#2e2a2a"/>
    <path d="M-40 -60 l-14 -18 M-20 -60 l8 -20" stroke="#c98a5e" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- CENTRE: a measured gap, the roll stops short -->
  <g transform="translate(480 470) rotate(-9)">
    <use href="#road"/>
    <use href="#car" color="#3b6fb0" transform="translate(-92 0)"/>
    <use href="#car" color="#9a9590" transform="translate(86 0)" opacity=".35"/>
    <use href="#car" color="#9a9590" transform="translate(98 0)"/>
    <path d="M60 -50 H34" stroke="#e07a5f" stroke-width="3" marker-end="url(#arr)"/>
    <rect x="-37" y="-6" width="80" height="12" fill="#e0a33a"/>
    <path d="M-30 -6 v6 M-20 -6 v8 M-10 -6 v6 M0 -6 v8 M10 -6 v6 M20 -6 v8 M30 -6 v6" stroke="#2b2b2b" stroke-width="2"/>
    <circle cx="-80" cy="-52" r="11" fill="#b07850"/><path d="M-92 -50 a12 12 0 0 1 24 -4 v-4 a12 12 0 0 0 -24 0 z" fill="#7a4e7e"/>
  </g>

  <!-- RIGHT: so far back the room is wasted -->
  <g transform="translate(800 470) rotate(-9)">
    <use href="#road"/>
    <use href="#car" color="#c0392b" transform="translate(-112 0) scale(.82)"/>
    <use href="#car" color="#9a9590" transform="translate(112 0) scale(.82)"/>
    <path d="M-62 -4 H62" stroke="#e07a5f" stroke-width="3" stroke-dasharray="6 6"/>
    <path d="M-62 -12 v16 M62 -12 v16" stroke="#e07a5f" stroke-width="3"/>
  </g>
  <!-- someone circling with nowhere to park -->
  <use href="#car" color="#1f6f78" transform="translate(800 330) scale(.6)"/>
  <path d="M740 340 a64 30 0 1 0 120 -20" stroke="#e07a5f" stroke-width="3" fill="none" stroke-dasharray="6 6" marker-end="url(#arr)"/>
</svg>
