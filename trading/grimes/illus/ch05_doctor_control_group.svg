<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Patients who took the pill and a control group who did not are equally healthy</title>
  <defs>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
      <path d="M-6 -140 q6 6 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    </g>
    <g id="card"><rect x="-30" y="-20" width="60" height="38" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/><text x="0" y="8" text-anchor="middle" font-size="19" font-weight="800" fill="#1f6f78">9/10</text></g>
    <g id="bottle"><rect x="-7" y="-16" width="14" height="20" rx="3" fill="#e0a33a"/><rect x="-6" y="-22" width="12" height="7" fill="#fff"/></g>
  </defs>
  <rect width="960" height="640" fill="#e3ebdc"/>
  <rect y="300" width="960" height="12" fill="#cbd6c3"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <!-- calendar with a year crossed off -->
  <rect x="40" y="110" width="110" height="90" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="40" y="110" width="110" height="16" rx="4" fill="#e07a5f"/>
  <g stroke="#e07a5f" stroke-width="2.5"><path d="M50 136 l12 12 M62 136 l-12 12 M74 136 l12 12 M86 136 l-12 12 M98 136 l12 12 M110 136 l-12 12 M122 136 l12 12 M134 136 l-12 12 M50 160 l12 12 M62 160 l-12 12 M74 160 l12 12 M86 160 l-12 12 M98 160 l12 12 M110 160 l-12 12 M122 160 l12 12 M134 160 l-12 12 M50 182 l12 12 M62 182 l-12 12 M74 182 l12 12 M86 182 l-12 12"/></g>
  <!-- clock + barred window -->
  <circle cx="480" cy="110" r="26" fill="#fff" stroke="#3d3a3a" stroke-width="4"/><path d="M480 110 v-16 M480 110 h10" stroke="#3d3a3a" stroke-width="3"/>
  <rect x="880" y="110" width="60" height="110" fill="#f3e3b0"/><path d="M895 110 v110 M910 110 v110 M925 110 v110" stroke="#9a9590" stroke-width="4"/>

  <!-- LEFT: doctor and the pill group -->
  <text x="270" y="262" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">PILL GROUP</text>
  <g transform="translate(96 560) scale(1.08)"><use href="#pp" color="#fff"/>
    <path d="M-8 -132 q8 6 16 0" stroke="#2e2a2a" stroke-width="4" fill="none"/>
    <path d="M-6 -102 q-4 30 8 40" stroke="#3d3a3a" stroke-width="3" fill="none"/><circle cx="2" cy="-60" r="5" fill="#3d3a3a"/>
    <circle cx="4" cy="-150" r="2.5" fill="#2e2a2a"/><circle cx="12" cy="-150" r="2.5" fill="#2e2a2a"/>
    <path d="M22 -104 l40 -20" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <path d="M-22 -104 l-6 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <g transform="translate(220 560)"><use href="#pp" color="#e07a5f"/><path d="M-22 -104 l-16 -40 M22 -104 l18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#bottle" transform="translate(-40 -146)"/></g>
  <use href="#card" transform="translate(262 360)"/>
  <g transform="translate(330 560)"><use href="#pp" color="#1f6f78"/><path d="M-22 -104 l-16 -40 M22 -104 l18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><use href="#bottle" transform="translate(42 -146)"/></g>

  <!-- dotted divide -->
  <path d="M470 240 V600" stroke="#7a4e7e" stroke-width="4" stroke-dasharray="10 10"/>

  <!-- RIGHT: researcher and the control group -->
  <g transform="translate(560 560)"><use href="#pp" color="#fff"/><circle cx="0" cy="-160" r="10" fill="#2e2a2a"/>
    <path d="M-22 -104 l-10 30 l30 -10 M22 -104 l10 30 l-30 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect x="482" y="384" width="156" height="84" rx="6" fill="#8a6d5a"/>
  <rect x="490" y="392" width="140" height="68" fill="#fff"/>
  <rect x="540" y="378" width="40" height="12" rx="3" fill="#9a9590"/>
  <text x="560" y="436" text-anchor="middle" font-size="24" font-weight="800" fill="#2b2b2b" letter-spacing="1">BASELINE</text>

  <text x="780" y="260" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">CONTROL GROUP</text>
  <g transform="translate(690 560)"><use href="#pp" color="#efe6d2"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#e5e0d8"/><path d="M-22 -104 l-12 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><line x1="-36" y1="-60" x2="-42" y2="0" stroke="#6b5446" stroke-width="6"/><path d="M22 -104 l18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(784 560)"><use href="#pp" color="#7a4e7e"/><ellipse cx="14" cy="-74" rx="20" ry="22" fill="#7a4e7e"/><circle cx="-12" cy="-158" r="9" fill="#2e2a2a"/><path d="M-22 -104 l-14 44 M22 -104 l18 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <use href="#card" transform="translate(842 380)"/>
  <g transform="translate(880 560) scale(.8)"><use href="#pp" color="#fff"/><rect x="-24" y="-74" width="48" height="16" fill="#2f3e6b"/><path d="M-22 -104 l-18 -40 M22 -104 l8 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
</svg>
