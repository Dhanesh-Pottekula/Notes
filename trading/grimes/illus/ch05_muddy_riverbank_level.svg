<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A riverbank looks like a clean line from far away but is a messy strip up close</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="ball"><circle r="16" fill="#fff"/><path d="M-6 -6 l6 -4 l6 4 l-2 7 h-8 z" fill="#2b2b2b"/><circle r="16" fill="none" stroke="#9a9590" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <!-- far view: hill with watcher, the bank as a clean line -->
  <path d="M0 260 Q80 150 200 190 Q320 230 460 210 Q700 180 960 220 V270 H0 Z" fill="#d7e3cf"/>
  <rect x="300" y="236" width="660" height="34" fill="#c2a77f" opacity=".6"/>
  <path d="M300 236 H900" stroke="#fff" stroke-width="5"/>
  <g transform="translate(110 178)">
    <rect x="-6" y="-30" width="12" height="30" rx="5" fill="#4a3f55"/><rect x="-8" y="-56" width="16" height="28" rx="6" fill="#1f6f78"/>
    <circle cx="0" cy="-64" r="8" fill="#c98a5e"/><rect x="4" y="-68" width="12" height="7" rx="2" fill="#3d3a3a"/>
  </g>
  <path d="M128 112 L300 232 M128 112 L900 232" stroke="#b9ad98" stroke-width="2" stroke-dasharray="4 6"/>
  <text x="600" y="214" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">LEVEL FROM FAR</text>

  <!-- up close: grass slope, mud strip, river -->
  <path d="M0 290 H420 L400 640 H0 Z" fill="#cdd3a8"/>
  <path d="M420 290 H640 L640 640 H400 Z" fill="#8a6d5a"/>
  <path d="M640 290 H960 V640 H640 Z" fill="#c2a77f"/>
  <path d="M700 340 q20 -8 40 0 M820 400 q20 -8 40 0 M700 470 q20 -8 40 0 M860 540 q20 -8 40 0 M760 600 q20 -8 40 0" stroke="#efe6d2" stroke-width="3" fill="none"/>
  <!-- messy details -->
  <g fill="#7fb3c4" opacity=".8"><ellipse cx="470" cy="360" rx="26" ry="8"/><ellipse cx="560" cy="430" rx="34" ry="9"/><ellipse cx="490" cy="560" rx="30" ry="8"/><ellipse cx="600" cy="600" rx="22" ry="6"/></g>
  <g fill="#6b5446"><ellipse cx="450" cy="420" rx="6" ry="9"/><ellipse cx="464" cy="436" rx="6" ry="9"/><ellipse cx="520" cy="500" rx="6" ry="9"/><ellipse cx="534" cy="516" rx="6" ry="9"/><ellipse cx="590" cy="370" rx="6" ry="9"/></g>
  <g stroke="#7f9a6a" stroke-width="4" stroke-linecap="round"><path d="M540 330 l-4 -14 M546 330 l4 -14 M600 520 l-4 -12 M606 520 l4 -12 M430 600 l-4 -14 M436 600 l4 -12"/></g>
  <g fill="#9a9590"><ellipse cx="420" cy="384" rx="16" ry="10"/><ellipse cx="410" cy="372" rx="12" ry="8"/></g>
  <rect x="418" y="296" width="204" height="44" rx="10" fill="#f6f1e7"/>
  <text x="520" y="329" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">MESSY ZONE</text>

  <!-- ball 1: clean bounce off the hard edge -->
  <path d="M120 366 Q300 380 398 380 Q330 340 250 330" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="4 7" marker-end="url(#arr)"/>
  <use href="#ball" transform="translate(236 330)"/>
  <!-- ball 2: sinks in, climbs out slowly -->
  <path d="M120 460 Q300 470 500 474 q20 10 0 20 q-20 6 -30 -10 q-60 -30 -140 -24" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="4 7" marker-end="url(#arr)"/>
  <use href="#ball" transform="translate(316 446)"/>
  <!-- ball 3: straight into the river -->
  <path d="M140 540 Q400 548 690 536" stroke="#2b2b2b" stroke-width="3" fill="none" stroke-dasharray="4 7" marker-end="url(#arr)"/>
  <use href="#ball" transform="translate(712 534)"/>
  <g fill="#fff"><circle cx="694" cy="516" r="6"/><circle cx="730" cy="512" r="5"/><circle cx="712" cy="504" r="4"/></g>
  <path d="M686 552 q26 10 52 0" stroke="#fff" stroke-width="4" fill="none"/>

  <!-- boy chasing barefoot -->
  <ellipse cx="80" cy="602" rx="34" ry="6" fill="#000" opacity=".08"/>
  <g transform="translate(80 600) scale(.9)">
    <path d="M-4 -60 l-22 30 l-10 30 M4 -60 l18 26 l22 4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-16" y="-72" width="32" height="20" rx="6" fill="#4a3f55"/>
    <path d="M-18 -66 v-40 a18 18 0 0 1 36 0 v40 z" fill="#fff"/>
    <path d="M-18 -96 h36 M-18 -82 h36" stroke="#e07a5f" stroke-width="6"/>
    <circle cx="2" cy="-140" r="16" fill="#c98a5e"/><path d="M-14 -143 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
    <path d="M-4 -132 q8 6 14 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
    <path d="M14 -104 l26 -10 M-14 -104 l-18 20" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
