<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A pullback is a water stop mid-race; an Anti is the first pause after turning uphill</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="run">
      <path d="M-4 -60 l-22 30 l-10 30 M4 -60 l18 26 l22 4" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-16" y="-72" width="32" height="18" rx="6" fill="#2b2b2b"/>
      <path d="M-18 -66 v-40 a18 18 0 0 1 36 0 v40 z" fill="currentColor"/>
      <rect x="-5" y="-132" width="10" height="10" fill="#c98a5e"/>
      <circle cx="2" cy="-144" r="16" fill="#c98a5e"/><path d="M-14 -147 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
      <path d="M-14 -104 l-16 22 l10 12 M14 -104 l16 18 l14 -12" stroke="#c98a5e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="bush"><ellipse cx="0" cy="0" rx="46" ry="16" fill="#3f9a6b"/><ellipse cx="0" cy="-6" rx="36" ry="10" fill="#5fae7f"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <path d="M0 260 Q200 180 480 230 Q720 170 960 220 V640 H0 Z" fill="#d7e3cf"/>
  <g opacity=".8"><use href="#bush" transform="translate(60 330)"/><use href="#bush" transform="translate(170 300)"/><use href="#bush" transform="translate(380 290)"/><use href="#bush" transform="translate(80 600)"/><use href="#bush" transform="translate(420 610)"/><use href="#bush" transform="translate(560 600)"/><use href="#bush" transform="translate(620 300)"/><use href="#bush" transform="translate(900 600)"/></g>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: water stop, same direction -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">PULLBACK</text>
  <path d="M0 560 L460 330 L460 380 L0 620 Z" fill="#cbbfa9"/>
  <path d="M20 570 L440 360" stroke="#fff" stroke-width="3" stroke-dasharray="14 12"/>
  <use href="#run" color="#1f6f78" transform="translate(360 384) scale(.62)"/>
  <use href="#run" color="#e0a33a" transform="translate(420 354) scale(.55)"/>
  <!-- water table + volunteer -->
  <rect x="40" y="420" width="110" height="12" fill="#8a6d5a"/><rect x="48" y="432" width="8" height="70" fill="#8a6d5a"/><rect x="134" y="432" width="8" height="70" fill="#8a6d5a"/>
  <g fill="#fff"><rect x="56" y="404" width="14" height="16"/><rect x="76" y="404" width="14" height="16"/><rect x="96" y="404" width="14" height="16"/></g>
  <g transform="translate(96 410)">
    <path d="M-22 -60 v-40 a22 22 0 0 1 44 0 v40 z" fill="#fff"/>
    <rect x="-6" y="-128" width="12" height="10" fill="#b07850"/>
    <circle cx="0" cy="-140" r="17" fill="#b07850"/><path d="M-17 -143 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
    <path d="M20 -96 l40 10" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- runner pausing, sipping, still facing uphill -->
  <ellipse cx="200" cy="504" rx="34" ry="6" fill="#000" opacity=".08"/>
  <g transform="translate(200 502)">
    <rect x="-14" y="-60" width="12" height="60" rx="5" fill="#c98a5e"/><rect x="2" y="-60" width="12" height="60" rx="5" fill="#c98a5e"/>
    <rect x="-16" y="-72" width="32" height="18" rx="6" fill="#2b2b2b"/>
    <path d="M-18 -66 v-40 a18 18 0 0 1 36 0 v40 z" fill="#c0392b"/>
    <rect x="-10" y="-96" width="20" height="16" fill="#fff"/>
    <rect x="-5" y="-132" width="10" height="10" fill="#c98a5e"/>
    <circle cx="2" cy="-144" r="16" fill="#c98a5e"/><path d="M-14 -147 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/><circle cx="-14" cy="-140" r="7" fill="#2e2a2a"/>
    <path d="M14 -104 l10 20 l2 -48" stroke="#c98a5e" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="18" y="-142" width="14" height="14" fill="#fff"/>
  </g>
  <path d="M250 470 L440 376" stroke="#1f6f78" stroke-width="7" marker-end="url(#arr)"/>

  <!-- RIGHT: downhill jog, sudden uphill sprint, first pause -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ANTI</text>
  <path d="M500 300 L640 500 L860 330 L940 290" stroke="#cbbfa9" stroke-width="40" fill="none" stroke-linejoin="round"/>
  <path d="M500 300 L640 500 L860 330 L940 290" stroke="#fff" stroke-width="3" fill="none" stroke-dasharray="12 12" stroke-linejoin="round"/>
  <g opacity=".35"><use href="#run" color="#3f9a6b" transform="translate(556 404) scale(.62)"/></g>
  <path d="M520 330 L600 446" stroke="#1f6f78" stroke-width="3" stroke-dasharray="6 6" marker-end="url(#arr)" opacity=".6"/>
  <g opacity=".6"><use href="#run" color="#3f9a6b" transform="translate(722 452) scale(.68)"/></g>
  <path d="M672 468 L800 372" stroke="#1f6f78" stroke-width="7" marker-end="url(#arr)"/>
  <path d="M740 350 l-14 -4 M748 364 l-16 0 M744 378 l-14 4" stroke="#1f6f78" stroke-width="3" stroke-linecap="round"/>
  <!-- the first pause, hands on knees -->
  <g transform="translate(862 336) scale(.7)">
    <ellipse cx="0" cy="2" rx="30" ry="6" fill="#000" opacity=".08"/>
    <rect x="-14" y="-60" width="12" height="60" rx="5" fill="#c98a5e"/><rect x="2" y="-60" width="12" height="60" rx="5" fill="#c98a5e"/>
    <rect x="-16" y="-72" width="32" height="18" rx="6" fill="#2b2b2b"/>
    <path d="M-16 -68 l46 -36 l14 18 l-40 30 z" fill="#3f9a6b"/>
    <circle cx="54" cy="-110" r="16" fill="#c98a5e"/><path d="M40 -116 a16 16 0 0 1 30 -4 z" fill="#2e2a2a"/>
    <path d="M30 -96 l-18 40 M38 -90 l-8 40" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/>
  </g>
  <path d="M884 300 Q920 240 914 200" stroke="#e07a5f" stroke-width="4" fill="none" stroke-dasharray="7 6" marker-end="url(#arc)"/>
  <circle cx="906" cy="172" r="18" fill="#fff" stroke="#e07a5f" stroke-width="3"/>
  <text x="906" y="181" text-anchor="middle" font-size="24" font-weight="800" fill="#e07a5f">?</text>
  <text x="720" y="210" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">FIRST PAUSE</text>
  <path d="M780 222 Q840 240 864 270" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#ark)"/>
</svg>
