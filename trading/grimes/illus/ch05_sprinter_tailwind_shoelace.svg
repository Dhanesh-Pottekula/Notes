<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A sprinter stops to tie a shoelace in a strong tailwind; will she run on, or has the wind dropped?</title>
  <defs>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="wind"><path d="M0 0 H150" stroke="#fff" stroke-width="14" stroke-linecap="round"/><path d="M146 -20 L184 0 L146 20 Z" fill="#fff"/></g>
    <g id="runner">
      <path d="M-4 -60 l-22 30 l-10 30 M4 -60 l18 26 l22 4" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-16" y="-72" width="32" height="18" rx="6" fill="#2b2b2b"/>
      <path d="M-18 -66 v-40 a18 18 0 0 1 36 0 v40 z" fill="#3b6fb0"/>
      <circle cx="2" cy="-144" r="16" fill="#b07850"/><path d="M-14 -147 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/><path d="M-14 -144 q-10 10 -8 24" stroke="#2e2a2a" stroke-width="6" fill="none"/>
      <rect x="-5" y="-132" width="10" height="10" fill="#b07850"/>
      <path d="M-14 -104 l-16 22 l10 12 M14 -104 l16 18 l14 -12" stroke="#b07850" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f4dcc0"/>
  <circle cx="480" cy="330" r="110" fill="#e0a33a" opacity=".35"/>
  <!-- palms bent by the wind -->
  <path d="M60 540 Q60 420 150 330" stroke="#6b5446" stroke-width="12" fill="none"/>
  <g fill="#3f9a6b"><path d="M150 330 q60 -10 90 30 q-40 -20 -90 -30"/><path d="M150 330 q70 -40 100 0 q-40 -30 -100 0"/><path d="M150 330 q40 20 70 60 q-40 -30 -70 -60"/></g>
  <!-- flags flapping right -->
  <path d="M300 540 V320" stroke="#3d3a3a" stroke-width="5"/><path d="M302 322 q30 -8 60 4 q20 6 40 0 v34 q-20 6 -40 0 q-30 -12 -60 -4 z" fill="#e07a5f"/>
  <path d="M690 540 V330" stroke="#3d3a3a" stroke-width="5"/><path d="M692 332 q30 -8 60 4 q20 6 40 0 v34 q-20 6 -40 0 q-30 -12 -60 -4 z" fill="#1f6f78"/>
  <!-- track -->
  <rect y="540" width="960" height="100" fill="#c0604a"/>
  <path d="M0 580 H960" stroke="#fff" stroke-width="3" opacity=".6"/>
  <path d="M600 600 q30 -6 60 0 M180 620 q30 -6 60 0" stroke="#ead9b0" stroke-width="4" fill="none"/>

  <!-- big wind arrows -->
  <use href="#wind" transform="translate(40 270)"/><use href="#wind" transform="translate(330 250)"/><use href="#wind" transform="translate(620 270)"/>
  <use href="#wind" transform="translate(140 440) scale(.8)"/><use href="#wind" transform="translate(760 450) scale(.8)"/>
  <text x="480" y="320" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">BIGGER TREND</text>

  <!-- sprinter kneeling to tie her lace -->
  <ellipse cx="470" cy="542" rx="60" ry="6" fill="#000" opacity=".1"/>
  <g transform="translate(460 540)">
    <path d="M-30 0 l-6 -40 l40 -4" stroke="#b07850" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M20 0 l-2 -40 l-30 -14" stroke="#b07850" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-28" y="-62" width="40" height="20" rx="8" fill="#2b2b2b"/>
    <path d="M-30 -56 l26 -64 l30 10 l-20 60 z" fill="#3b6fb0"/>
    <circle cx="22" cy="-118" r="16" fill="#b07850"/><path d="M8 -124 a16 16 0 0 1 30 -2 z" fill="#2e2a2a"/><path d="M10 -120 q-14 4 -22 22" stroke="#2e2a2a" stroke-width="6" fill="none"/>
    <path d="M10 -98 l14 50 M0 -100 l20 54" stroke="#b07850" stroke-width="8" stroke-linecap="round"/>
    <rect x="12" y="-8" width="28" height="10" rx="4" fill="#fff"/>
    <path d="M22 -10 q4 -10 10 -2" stroke="#e07a5f" stroke-width="3" fill="none"/>
  </g>
  <text x="250" y="612" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NESTED PAUSE</text>
  <path d="M370 594 Q420 590 440 556" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#ark)"/>

  <!-- coach on a bench -->
  <rect x="800" y="500" width="120" height="12" fill="#8a6d5a"/><rect x="808" y="512" width="8" height="28" fill="#6b5446"/><rect x="904" y="512" width="8" height="28" fill="#6b5446"/>
  <rect x="846" y="484" width="44" height="16" rx="7" fill="#4a3f55"/>
  <path d="M836 500 v-44 a22 22 0 0 1 44 0 v44 z" fill="#7a4e7e"/>
  <circle cx="858" cy="420" r="17" fill="#c98a5e"/><path d="M841 416 a17 17 0 0 1 34 0 z" fill="#2e2a2a"/>
  <path d="M846 410 l8 -3" stroke="#2e2a2a" stroke-width="3" stroke-linecap="round"/>
  <path d="M842 466 l-20 -14" stroke="#c98a5e" stroke-width="8" stroke-linecap="round"/><circle cx="816" cy="448" r="9" fill="#fff" stroke="#3d3a3a" stroke-width="3"/>

  <!-- inset LEFT: she springs up and runs on, wind still strong -->
  <rect x="60" y="34" width="340" height="170" rx="16" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M300 204 l-30 32 l2 -32 z" fill="#fff"/><path d="M300 204 l-28 30 M272 204 v30" stroke="#7a4e7e" stroke-width="3"/>
  <g transform="translate(76 100) scale(.6)"><path d="M0 0 H150" stroke="#e0a33a" stroke-width="14" stroke-linecap="round"/><path d="M146 -20 L184 0 L146 20 Z" fill="#e0a33a"/></g>
  <g transform="translate(76 160) scale(.6)"><path d="M0 0 H150" stroke="#e0a33a" stroke-width="14" stroke-linecap="round"/><path d="M146 -20 L184 0 L146 20 Z" fill="#e0a33a"/></g>
  <use href="#runner" transform="translate(300 190) scale(.95) rotate(8)"/>
  <!-- inset RIGHT: still standing, wind gone -->
  <rect x="560" y="34" width="340" height="170" rx="16" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M640 204 l30 32 l-2 -32 z" fill="#fff"/><path d="M640 204 l28 30 M668 204 v30" stroke="#7a4e7e" stroke-width="3"/>
  <text x="730" y="74" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">WIND DROPPED?</text>
  <path d="M590 120 H680 M590 160 H660" stroke="#e0a33a" stroke-width="3" opacity=".4" stroke-dasharray="6 8"/>
  <path d="M860 196 V96" stroke="#3d3a3a" stroke-width="4"/><path d="M862 98 h16 v44 h-16 z" fill="#1f6f78"/>
  <g transform="translate(770 196) scale(.62)">
    <rect x="-14" y="-60" width="12" height="60" rx="5" fill="#b07850"/><rect x="2" y="-60" width="12" height="60" rx="5" fill="#b07850"/>
    <rect x="-16" y="-72" width="32" height="18" rx="6" fill="#2b2b2b"/>
    <path d="M-18 -66 v-40 a18 18 0 0 1 36 0 v40 z" fill="#3b6fb0"/>
    <circle cx="0" cy="-140" r="16" fill="#b07850"/><path d="M-16 -143 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
    <path d="M-16 -100 l-20 22 l18 12 M16 -100 l20 22 l-18 12" stroke="#b07850" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
