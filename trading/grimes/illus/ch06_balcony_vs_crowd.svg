<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>From a balcony you see which way the crowd moves; down in it you read every face</title>
  <defs>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="mag"><circle r="36" fill="#fff" stroke="#3d3a3a" stroke-width="5"/><path d="M26 26 l18 18" stroke="#3d3a3a" stroke-width="7" stroke-linecap="round"/></g>
    <g id="bigarrow"><path d="M0 -26 H-150 V-50 L-210 0 L-150 50 V26 H0 Z" fill="#fff" opacity=".75"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6efe3"/>
  <!-- garland across the lane -->
  <path d="M0 40 Q480 120 960 40" stroke="#6b5446" stroke-width="2" fill="none"/>
  <g fill="#e0a33a"><circle cx="60" cy="49" r="8"/><circle cx="140" cy="62" r="8"/><circle cx="220" cy="72" r="8"/><circle cx="300" cy="78" r="8"/><circle cx="380" cy="82" r="8"/><circle cx="460" cy="84" r="8"/><circle cx="540" cy="83" r="8"/><circle cx="620" cy="79" r="8"/></g>
  <g fill="#e07a5f"><circle cx="100" cy="56" r="7"/><circle cx="180" cy="68" r="7"/><circle cx="260" cy="76" r="7"/><circle cx="340" cy="81" r="7"/><circle cx="420" cy="84" r="7"/><circle cx="500" cy="84" r="7"/><circle cx="580" cy="81" r="7"/></g>
  <!-- street + orange powder haze -->
  <rect y="300" width="960" height="340" fill="#e8d6bd"/>
  <circle cx="400" cy="300" r="140" fill="#e07a5f" opacity=".08"/>
  <!-- idol cart ahead -->
  <rect x="40" y="250" width="90" height="40" rx="6" fill="#8a6d5a"/>
  <path d="M60 250 q25 -70 50 0 z" fill="#e0a33a"/><circle cx="85" cy="206" r="14" fill="#e0a33a"/>
  <circle cx="58" cy="292" r="10" fill="#3d3a3a"/><circle cx="112" cy="292" r="10" fill="#3d3a3a"/>

  <!-- the crowd seen as dots -->
  <g fill="#7a4e7e" opacity=".75"><circle cx="230" cy="330" r="9"/><circle cx="300" cy="360" r="9"/><circle cx="380" cy="330" r="9"/><circle cx="450" cy="370" r="9"/><circle cx="520" cy="340" r="9"/><circle cx="600" cy="370" r="9"/><circle cx="660" cy="340" r="9"/><circle cx="350" cy="480" r="9"/><circle cx="470" cy="520" r="9"/><circle cx="560" cy="480" r="9"/><circle cx="700" cy="520" r="9"/><circle cx="800" cy="470" r="9"/><circle cx="880" cy="540" r="9"/></g>
  <g fill="#1f6f78" opacity=".75"><circle cx="260" cy="400" r="9"/><circle cx="340" cy="410" r="9"/><circle cx="420" cy="440" r="9"/><circle cx="500" cy="410" r="9"/><circle cx="580" cy="440" r="9"/><circle cx="650" cy="410" r="9"/><circle cx="740" cy="430" r="9"/><circle cx="400" cy="560" r="9"/><circle cx="620" cy="560" r="9"/><circle cx="760" cy="580" r="9"/><circle cx="860" cy="440" r="9"/></g>
  <g fill="#e0a33a" opacity=".85"><circle cx="280" cy="460" r="9"/><circle cx="530" cy="460" r="9"/><circle cx="680" cy="470" r="9"/><circle cx="820" cy="380" r="9"/><circle cx="560" cy="600" r="9"/><circle cx="460" cy="600" r="9"/><circle cx="900" cy="490" r="9"/><circle cx="720" cy="370" r="9"/></g>
  <use href="#bigarrow" transform="translate(860 410)"/>
  <use href="#bigarrow" transform="translate(700 520) scale(.8)"/>
  <text x="560" y="421" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">DIRECTION</text>

  <!-- balcony with the calm watcher -->
  <rect x="700" y="0" width="260" height="300" fill="#e0c9a6"/>
  <rect x="720" y="100" width="210" height="150" fill="#cbb38e"/>
  <circle cx="800" cy="168" r="18" fill="#c98a5e"/><path d="M782 164 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="794" cy="170" r="5"/><circle cx="808" cy="170" r="5"/></g>
  <path d="M794 182 h12" stroke="#2e2a2a" stroke-width="2"/>
  <path d="M776 260 v-46 a24 24 0 0 1 48 0 v46 z" fill="#fff"/>
  <path d="M822 214 l20 18" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><rect x="838" y="222" width="14" height="16" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="706" y="240" width="244" height="10" fill="#3d3a3a"/>
  <path d="M716 250 v40 M740 250 v40 M764 250 v40 M788 250 v40 M812 250 v40 M836 250 v40 M860 250 v40 M884 250 v40 M908 250 v40 M932 250 v40" stroke="#3d3a3a" stroke-width="4"/>
  <rect x="706" y="288" width="244" height="12" fill="#3d3a3a"/>
  <text x="440" y="168" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">CONCEPTUAL TRADER</text>
  <path d="M610 170 Q700 176 768 176" stroke="#2b2b2b" stroke-width="3" fill="none" marker-end="url(#ark)"/>

  <!-- woman down in the crowd, reading every face -->
  <ellipse cx="170" cy="602" rx="34" ry="6" fill="#000" opacity=".08"/>
  <rect x="154" y="540" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="173" y="540" width="13" height="62" rx="6" fill="#4a3f55"/>
  <path d="M146 548 v-50 a24 24 0 0 1 48 0 v50 z" fill="#e0a33a"/>
  <rect x="164" y="464" width="12" height="10" fill="#b07850"/>
  <circle cx="172" cy="450" r="19" fill="#b07850"/><path d="M153 446 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/><circle cx="154" cy="452" r="9" fill="#2e2a2a"/>
  <path d="M190 500 l26 10" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  <rect x="208" y="496" width="26" height="32" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <!-- magnified faces: drummer, girl on shoulders, balloon seller -->
  <use href="#mag" transform="translate(70 380)"/>
  <circle cx="70" cy="380" r="16" fill="#c98a5e"/><circle cx="58" cy="386" r="7" fill="#d9a27a"/><circle cx="82" cy="386" r="7" fill="#d9a27a"/><path d="M54 374 a16 16 0 0 1 32 0 z" fill="#2e2a2a"/>
  <use href="#mag" transform="translate(180 340)"/>
  <circle cx="180" cy="344" r="14" fill="#d9a27a"/><path d="M168 340 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/><path d="M172 350 q8 6 16 0" stroke="#2e2a2a" stroke-width="2" fill="none"/><circle cx="168" cy="330" r="5" fill="#e07a5f"/><circle cx="192" cy="330" r="5" fill="#e07a5f"/>
  <use href="#mag" transform="translate(290 400)"/>
  <circle cx="290" cy="410" r="14" fill="#b07850"/><path d="M276 406 a14 14 0 0 1 28 0 z" fill="#2e2a2a"/>
  <circle cx="276" cy="380" r="8" fill="#e07a5f"/><circle cx="296" cy="376" r="8" fill="#1f6f78"/><circle cx="308" cy="388" r="7" fill="#e0a33a"/>
  <text x="380" y="616" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DETAIL TRADER</text>
</svg>
