<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A shoulder against a locked door only rattles it, and the people leaning behind stumble back</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f6f78"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="paper"><rect x="-12" y="-15" width="24" height="30" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-6 -6 h12 M-6 2 h12" stroke="#cbbfa9" stroke-width="2"/></g>
  </defs>
  <rect width="960" height="640" fill="#efe6d0"/>
  <rect y="0" width="960" height="40" fill="#e3d7bd"/>
  <path d="M480 40 v24 M440 66 h80" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>
  <rect y="560" width="960" height="80" fill="#cbbfa9"/>
  <path d="M0 560 H960" stroke="#b9ad98" stroke-width="4"/>
  <!-- tall window light -->
  <path d="M40 80 h70 v200 h-70 z" fill="#f6f1e7"/>
  <path d="M110 80 L300 560 H200 L40 280 Z" fill="#fff" opacity=".25"/>

  <!-- the locked double door -->
  <rect x="580" y="160" width="200" height="400" fill="#6b5446"/>
  <rect x="592" y="172" width="84" height="388" fill="#8a6d5a"/><rect x="684" y="172" width="84" height="388" fill="#8a6d5a"/>
  <rect x="604" y="190" width="60" height="140" fill="#7a5f4d"/><rect x="696" y="190" width="60" height="140" fill="#7a5f4d"/>
  <rect x="604" y="360" width="60" height="170" fill="#7a5f4d"/><rect x="696" y="360" width="60" height="170" fill="#7a5f4d"/>
  <rect x="790" y="250" width="60" height="22" rx="3" fill="#e0a33a"/>
  <path d="M640 340 q40 26 80 0" stroke="#3d3a3a" stroke-width="7" fill="none" stroke-dasharray="10 4"/>
  <rect x="666" y="350" width="28" height="26" rx="4" fill="#3d3a3a"/><path d="M672 352 v-10 a8 8 0 0 1 16 0 v10" stroke="#3d3a3a" stroke-width="5" fill="none"/>
  <g stroke="#e07a5f" stroke-width="4" stroke-linecap="round"><path d="M630 312 l-10 -12 M622 336 l-16 -2 M740 312 l10 -12 M748 336 l16 -2 M680 300 v-14"/></g>
  <path d="M574 200 q-8 20 0 40 M574 420 q-8 20 0 40 M786 200 q8 20 0 40 M786 420 q8 20 0 40" stroke="#3d3a3a" stroke-width="3" fill="none"/>
  <text x="690" y="130" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">BREAKOUT ATTEMPT</text>

  <!-- burly man shouldering the door -->
  <g transform="translate(530 560) rotate(16) scale(1.15)"><use href="#pp" color="#c0604a"/>
    <path d="M-24 -92 h48 M-24 -76 h48 M-8 -110 v50 M8 -110 v50" stroke="#a24f3c" stroke-width="3"/>
    <path d="M22 -104 l16 26 M-22 -104 l26 30" stroke="#c98a5e" stroke-width="11" stroke-linecap="round"/>
  </g>

  <!-- people who leaned on him, now stumbling back -->
  <text x="330" y="250" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">TRAPPED BUYERS</text>
  <g transform="translate(436 560) rotate(-18)"><use href="#pp" color="#1f6f78"/><rect x="-12" y="-104" width="10" height="40" fill="#fff"/><path d="M-22 -104 l-30 -30 M22 -104 l26 -36" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <g transform="translate(350 560) rotate(-24)"><use href="#pp" color="#efe6d2"/><path d="M-22 -104 l-36 -16 M22 -104 l20 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><g fill="none" stroke="#2e2a2a" stroke-width="2"><circle cx="-26" cy="-170" r="6"/><circle cx="-12" cy="-172" r="6"/></g></g>
  <g transform="translate(262 560) rotate(-16)"><use href="#pp" color="#7a4e7e"/><circle cx="-12" cy="-160" r="9" fill="#2e2a2a"/><path d="M-22 -104 l-30 -24 M22 -104 l30 -24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="-60" y="-140" width="22" height="18" rx="4" fill="#e0a33a"/></g>
  <use href="#paper" transform="translate(300 300) rotate(-20)"/><use href="#paper" transform="translate(410 290) rotate(18)"/><use href="#paper" transform="translate(220 330) rotate(-36)"/><use href="#paper" transform="translate(470 330) rotate(30)"/>
  <path d="M200 520 q-20 -10 -40 0 M210 494 q-24 -6 -40 6" stroke="#9a9590" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- calm woman walking the other way -->
  <text x="150" y="180" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">FAILURE TEST</text>
  <g transform="translate(110 560)"><use href="#pp" color="#3b6fb0"/>
    <path d="M-24 -40 h48 v-20 h-48 z" fill="#3b6fb0"/>
    <path d="M-22 -96 h44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
    <circle cx="10" cy="-160" r="9" fill="#2e2a2a"/>
    <path d="M-10 -140 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <path d="M90 600 H40" stroke="#1f6f78" stroke-width="6" marker-end="url(#arr)"/>
</svg>
