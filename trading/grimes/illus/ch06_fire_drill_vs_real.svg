<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A fire drill gets only a glance; a real alarm empties the building and then everyone rushes back in</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3f9a6b"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="sit">
      <rect x="-30" y="-50" width="60" height="10" rx="4" fill="#3d3a3a"/><rect x="-4" y="-40" width="8" height="40" fill="#3d3a3a"/>
      <rect x="-6" y="-62" width="44" height="14" rx="6" fill="#4a3f55"/><rect x="26" y="-56" width="13" height="56" rx="6" fill="#4a3f55"/>
      <path d="M-22 -54 v-44 a22 22 0 0 1 44 0 v44 z" fill="currentColor"/>
      <rect x="-6" y="-128" width="12" height="10" fill="#c98a5e"/>
      <circle cx="-4" cy="-142" r="18" fill="#c98a5e"/><path d="M-22 -146 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
      <circle cx="-14" cy="-142" r="2.5" fill="#2e2a2a"/>
    </g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>

  <!-- LEFT: drill bell, people only glance -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">THE GLANCE</text>
  <rect x="0" y="540" width="478" height="100" fill="#d8cdb8"/>
  <rect x="40" y="130" width="100" height="40" rx="5" fill="#3f9a6b"/>
  <path d="M120 150 h-58 m14 -12 l-14 12 l14 12" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="40" y="190" width="100" height="350" fill="#e3d7bd"/>
  <circle cx="400" cy="160" r="20" fill="#e07a5f"/><rect x="396" y="180" width="8" height="10" fill="#3d3a3a"/>
  <path d="M430 146 q8 14 0 28 M376 146 q-8 14 0 28" stroke="#e07a5f" stroke-width="3" fill="none" opacity=".6"/>
  <!-- desks -->
  <rect x="180" y="440" width="270" height="14" fill="#8a6d5a"/><rect x="190" y="454" width="10" height="86" fill="#6b5446"/><rect x="430" y="454" width="10" height="86" fill="#6b5446"/>
  <rect x="300" y="390" width="70" height="48" rx="3" fill="#3d3a3a"/><rect x="390" y="404" width="44" height="34" rx="3" fill="#3d3a3a"/>
  <use href="#sit" color="#1f6f78" transform="translate(240 540)"/>
  <path d="M236 420 l-10 -16" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><rect x="216" y="392" width="16" height="18" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <use href="#sit" color="#7a4e7e" transform="translate(370 540)"/>
  <path d="M362 422 l-14 -12" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/><rect x="336" y="398" width="16" height="18" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M352 380 a20 20 0 0 1 32 0" stroke="#3d3a3a" stroke-width="4" fill="none"/>
  <path d="M220 396 Q170 260 146 176" stroke="#3f9a6b" stroke-width="3" fill="none" stroke-dasharray="5 7" marker-end="url(#arg)"/>
  <path d="M352 396 Q280 220 146 166" stroke="#3f9a6b" stroke-width="3" fill="none" stroke-dasharray="5 7" marker-end="url(#arg)"/>

  <!-- RIGHT: the real alarm -->
  <rect x="482" y="400" width="478" height="240" fill="#cdd3a8"/>
  <rect x="500" y="110" width="220" height="290" fill="#9fc3cc"/>
  <path d="M500 170 h220 M500 230 h220 M500 290 h220 M555 110 v190 M610 110 v190 M665 110 v190" stroke="#e8f0f2" stroke-width="4"/>
  <rect x="576" y="306" width="88" height="94" fill="#cfe3e8" stroke="#3d3a3a" stroke-width="4"/>
  <path d="M620 306 v94" stroke="#3d3a3a" stroke-width="3"/>
  <circle cx="530" cy="96" r="14" fill="#c0392b"/>
  <g stroke="#c0392b" stroke-width="4" stroke-linecap="round"><path d="M510 80 l-12 -10 M530 72 v-14 M550 80 l12 -10 M506 98 h-14"/></g>
  <!-- fire truck at the kerb -->
  <rect x="760" y="330" width="180" height="58" rx="6" fill="#c0392b"/><rect x="890" y="306" width="50" height="40" rx="4" fill="#c0392b"/>
  <rect x="898" y="314" width="34" height="18" fill="#cfe3e8"/>
  <path d="M770 322 h110 M770 322 v-6 M790 322 v-8 M810 322 v-8 M830 322 v-8 M850 322 v-8 M870 322 v-8" stroke="#9a9590" stroke-width="4"/>
  <circle cx="800" cy="392" r="14" fill="#3d3a3a"/><circle cx="900" cy="392" r="14" fill="#3d3a3a"/>
  <!-- people out on the lawn -->
  <text x="690" y="452" text-anchor="middle" font-size="32" font-weight="800" fill="#2b2b2b" letter-spacing="1">REAL RUN</text>
  <g transform="translate(560 610) scale(.75)"><use href="#pp" color="#e0a33a"/><path d="M-22 -104 l-10 40 M22 -104 l26 20" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="38" y="-96" width="40" height="28" rx="3" fill="#3d3a3a"/></g>
  <g transform="translate(690 610) scale(.75)"><use href="#pp" color="#1f6f78"/><path d="M-22 -104 l-22 -26 M22 -104 l22 -26" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><rect x="2" y="-4" width="18" height="8" rx="3" fill="#c98a5e"/><rect x="-20" y="-4" width="20" height="9" rx="4" fill="#3d3a3a"/></g>
  <rect x="640" y="604" width="20" height="9" rx="4" fill="#3d3a3a" transform="rotate(30 650 608)"/>
  <g transform="translate(810 610) scale(.75)"><use href="#pp" color="#8a7a4a"/><rect x="-21" y="-172" width="42" height="12" rx="4" fill="#4a3f55"/><path d="M-22 -104 l-26 -40 M22 -104 l26 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <!-- the rush back in -->
  <path d="M880 590 C960 520 940 250 676 312" stroke="#e07a5f" stroke-width="10" fill="none" marker-end="url(#arr)"/>
  <text x="830" y="242" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">RUSH BACK IN</text>
</svg>
