<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>One scientist keeps every result in ink; the other erases the failed runs and is left with nothing</title>
  <defs>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="beakers"><path d="M0 0 h26 v-30 h-4 v-10 h-18 v10 h-4 z" fill="#cfe3e8"/><path d="M2 0 h22 v-14 h-22 z" fill="#1f6f78" opacity=".6"/><path d="M40 0 l14 -26 v-16 h10 v16 l14 26 z" fill="#cfe3e8"/><path d="M44 0 l8 -14 h14 l8 14 z" fill="#e07a5f" opacity=".7"/></g>
  </defs>
  <rect width="960" height="640" fill="#f2f4f2"/>
  <line x1="480" y1="30" x2="480" y2="610" stroke="#d8cdb8" stroke-width="3"/>
  <!-- shelves -->
  <rect x="40" y="200" width="400" height="8" fill="#b9ad98"/><use href="#beakers" transform="translate(300 200)"/>
  <rect x="520" y="200" width="400" height="8" fill="#b9ad98"/><use href="#beakers" transform="translate(540 200)"/>
  <!-- window with neem trees -->
  <rect x="80" y="100" width="120" height="84" fill="#d7e3cf"/><circle cx="130" cy="150" r="28" fill="#3f9a6b" opacity=".6"/>
  <!-- benches -->
  <rect x="20" y="430" width="920" height="16" fill="#3d3a3a"/>
  <rect x="30" y="446" width="900" height="114" fill="#cbbfa9"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>

  <!-- LEFT: ink stays -->
  <text x="240" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">INK STAYS</text>
  <!-- scientist -->
  <rect x="66" y="330" width="12" height="12" fill="#b07850"/>
  <path d="M40 432 v-66 a32 32 0 0 1 64 0 v66 z" fill="#fff"/>
  <path d="M60 340 l12 28 l12 -28" fill="#e07a5f"/>
  <circle cx="72" cy="310" r="21" fill="#b07850"/><path d="M51 306 a21 21 0 0 1 42 0 l-6 -2 a16 16 0 0 0 -30 0 z" fill="#2e2a2a"/><circle cx="54" cy="314" r="10" fill="#2e2a2a"/>
  <rect x="58" y="284" width="30" height="8" rx="4" fill="#cfe3e8" stroke="#3d3a3a" stroke-width="2"/>
  <path d="M84 318 h6" stroke="#2e2a2a" stroke-width="2"/>
  <path d="M100 380 l60 30 l50 -6" stroke="#b07850" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M206 404 l20 -24" stroke="#1f3a5f" stroke-width="5" stroke-linecap="round"/>
  <!-- the inked notebook -->
  <path d="M150 428 l26 -82 h120 l-8 82 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M288 428 l8 -82 h120 l26 82 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <g stroke="#1f3a5f" stroke-width="2.5" stroke-linecap="round">
    <path d="M182 358 h60 M178 372 h90 M174 386 h70 M170 400 h88 M166 414 h60"/>
    <path d="M304 358 h70 M304 372 h96 M304 386 h60 M304 400 h88"/>
  </g>
  <path d="M176 386 h70" stroke="#2b2b2b" stroke-width="2"/>
  <path d="M338 412 l14 12 M352 412 l-14 12" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M370 410 q10 -10 20 0 t20 0" stroke="#7a4e7e" stroke-width="2.5" fill="none"/>
  <rect x="380" y="400" width="20" height="26" rx="4" fill="#fff" stroke="#9a9590" stroke-width="2" transform="translate(40 0)"/>

  <!-- RIGHT: erased runs -->
  <text x="720" y="66" text-anchor="middle" font-size="36" font-weight="800" fill="#2b2b2b" letter-spacing="1">ERASED RUNS</text>
  <!-- flask bubbling over -->
  <path d="M600 200 l18 -34 v-22 h14 v22 l18 34 z" fill="#cfe3e8"/>
  <path d="M606 200 l12 -22 h14 l12 22 z" fill="#3f9a6b"/>
  <path d="M624 144 q-14 -10 -6 -24 q14 -6 12 10 q12 -12 16 4 q2 14 -10 22 M632 150 q10 20 0 50" stroke="#3f9a6b" stroke-width="6" fill="none" stroke-linecap="round"/>
  <!-- smudged notebook -->
  <path d="M520 428 l26 -82 h120 l-8 82 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M658 428 l8 -82 h120 l26 82 z" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <g fill="#c9c9c9" opacity=".7"><ellipse cx="590" cy="376" rx="40" ry="10"/><ellipse cx="580" cy="404" rx="34" ry="8"/><ellipse cx="720" cy="370" rx="36" ry="9"/><ellipse cx="730" cy="398" rx="44" ry="10"/></g>
  <path d="M740 410 l6 6 l12 -14" stroke="#3f9a6b" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <g fill="#e8a0b0"><circle cx="620" cy="436" r="3"/><circle cx="632" cy="440" r="2.5"/><circle cx="648" cy="436" r="3"/><circle cx="662" cy="440" r="2.5"/><circle cx="700" cy="438" r="3"/><circle cx="612" cy="444" r="2"/></g>
  <!-- nervous scientist with a big eraser -->
  <rect x="850" y="330" width="12" height="12" fill="#c98a5e"/>
  <path d="M824 432 v-66 a32 32 0 0 1 64 0 v66 z" fill="#fff"/>
  <circle cx="856" cy="310" r="21" fill="#c98a5e"/>
  <path d="M834 306 l4 -16 l6 8 l6 -14 l6 10 l8 -12 l4 12 l8 -6 l-2 18 z" fill="#2e2a2a"/>
  <path d="M840 318 h6" stroke="#2e2a2a" stroke-width="2"/>
  <path d="M856 300 q-4 8 0 10 q4 -2 0 -10" fill="#7fb3c4"/>
  <path d="M830 384 l-60 20 l-50 -10" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="694" y="380" width="40" height="20" rx="5" fill="#e8a0b0" transform="rotate(-12 714 390)"/>
  <path d="M700 372 l-10 -6 M708 368 l-4 -10 M742 372 l10 -6" stroke="#9a9590" stroke-width="2.5" stroke-linecap="round"/>
  <!-- overflowing wastebasket -->
  <path d="M884 560 l-8 -70 h60 l-8 70 z" fill="#9a9590"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="2"><circle cx="890" cy="486" r="12"/><circle cx="912" cy="480" r="13"/><circle cx="930" cy="490" r="10"/><circle cx="866" cy="552" r="10"/></g>
  <text x="640" y="612" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">NO RESULT</text>
  <path d="M640 584 V426" stroke="#2b2b2b" stroke-width="3" marker-end="url(#ark)"/>
</svg>
