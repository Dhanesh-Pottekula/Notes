<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Rowing with the small daily waves against the weekly current; the decision is made on the bank</title>
  <defs>
    <marker id="wv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#fff"/></marker>
    <g id="big"><path d="M0 -24 H-170 V-48 L-230 0 L-170 48 V24 H0 Z" fill="#1f6f78" opacity=".28"/></g>
  </defs>
  <rect width="960" height="640" fill="#f3efe4"/>
  <path d="M0 200 Q160 130 330 180 Q520 120 700 170 Q840 130 960 160 V220 H0 Z" fill="#d8dcd2"/>
  <rect x="0" y="150" width="960" height="60" fill="#f3efe4" opacity=".5"/>
  <!-- distant ferry -->
  <rect x="790" y="208" width="70" height="12" rx="4" fill="#9a9590"/><rect x="806" y="196" width="34" height="12" fill="#b9ad98"/>
  <!-- river -->
  <rect y="216" width="960" height="280" fill="#9cc0bd"/>
  <!-- the current: big, faint, leftward -->
  <use href="#big" transform="translate(900 430)"/>
  <use href="#big" transform="translate(560 450)"/>
  <use href="#big" transform="translate(320 420) scale(.8)"/>
  <text x="640" y="444" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">WEEKLY: CURRENT</text>

  <!-- rower in the middle of the river -->
  <path d="M440 330 q40 26 200 0 l-10 18 q-90 18 -180 0 z" fill="#6b5446"/>
  <path d="M470 330 L420 380 M610 330 L670 372" stroke="#8a6d5a" stroke-width="6" stroke-linecap="round"/>
  <rect x="524" y="316" width="44" height="14" rx="6" fill="#4a3f55"/>
  <path d="M520 326 v-40 a22 22 0 0 1 44 0 v40 z" fill="#fff"/>
  <path d="M520 296 h44" stroke="#e07a5f" stroke-width="5"/>
  <circle cx="544" cy="250" r="18" fill="#b07850"/><path d="M526 246 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <path d="M536 256 l6 -2 M548 254 l6 2" stroke="#2e2a2a" stroke-width="2.5"/>
  <path d="M522 288 l-40 26 M564 288 l36 28" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  <!-- small choppy waves pushing right -->
  <g stroke="#fff" stroke-width="4" fill="none" marker-end="url(#wv)"><path d="M430 372 h40"/><path d="M500 382 h40"/><path d="M580 372 h40"/><path d="M650 380 h40"/></g>
  <text x="790" y="296" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">DAILY: WAVES</text>
  <path d="M720 306 Q700 350 690 368" stroke="#2b2b2b" stroke-width="3" fill="none"/>
  <!-- egrets -->
  <g fill="#fff"><ellipse cx="120" cy="300" rx="14" ry="8"/><path d="M128 296 q10 -20 4 -26" stroke="#fff" stroke-width="4" fill="none"/><ellipse cx="200" cy="320" rx="12" ry="7"/></g>
  <path d="M116 306 v18 M124 306 v18 M198 326 v16" stroke="#3d3a3a" stroke-width="2"/>

  <!-- sand bank: planning first -->
  <path d="M0 496 Q300 470 600 500 Q800 520 960 500 V640 H0 Z" fill="#e6d8bd"/>
  <path d="M240 560 q30 26 200 0 l-10 18 q-90 18 -180 0 z" fill="#6b5446"/>
  <!-- stick map in the sand -->
  <path d="M470 600 q30 -20 60 0 q30 20 60 0 M500 580 l-20 -10 l20 -10" stroke="#8a6d5a" stroke-width="3" fill="none"/>
  <!-- the same man, calm, oars on knees, pointing with the current -->
  <ellipse cx="160" cy="590" rx="60" ry="7" fill="#000" opacity=".08"/>
  <rect x="150" y="566" width="60" height="16" rx="7" fill="#4a3f55"/><rect x="196" y="570" width="14" height="22" rx="6" fill="#b07850"/>
  <path d="M130 584 v-48 a24 24 0 0 1 48 0 v48 z" fill="#fff"/>
  <path d="M130 556 h48" stroke="#e07a5f" stroke-width="5"/>
  <circle cx="154" cy="496" r="18" fill="#b07850"/><path d="M136 492 a18 18 0 0 1 36 0 z" fill="#2e2a2a"/>
  <path d="M120 546 l100 14 M110 556 l110 14" stroke="#8a6d5a" stroke-width="5" stroke-linecap="round"/>
  <path d="M138 528 l-34 -18" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
  <text x="250" y="614" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">DECIDE ON THE BANK</text>
  <!-- link: planner to rower -->
  <path d="M180 488 Q300 330 500 280" stroke="#7a4e7e" stroke-width="3" fill="none" stroke-dasharray="5 7"/>
</svg>
