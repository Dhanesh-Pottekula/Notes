<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>A cook rewrites the recipe after every complaint; the owner says follow it; the head chef reviews it monthly</title>
  <defs>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="crump"><circle r="10" fill="#fff" stroke="#cbbfa9" stroke-width="2"/><path d="M-5 -3 l4 4 l5 -5" stroke="#cbbfa9" stroke-width="2" fill="none"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6efe0"/>
  <rect y="560" width="960" height="80" fill="#d8cdb8"/>
  <path d="M480 0 v26 M430 30 h100" stroke="#6b5446" stroke-width="5" stroke-linecap="round"/>

  <!-- LEFT: service window, complaints, flustered cook -->
  <rect x="30" y="110" width="230" height="130" fill="#e3d7bd"/>
  <rect x="44" y="124" width="202" height="102" fill="#f6f1e7"/>
  <circle cx="100" cy="190" r="22" fill="#d9a27a"/><path d="M78 186 a22 22 0 0 1 44 0 z" fill="#2e2a2a"/><path d="M90 204 q10 -8 20 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M124 214 l20 -40" stroke="#d9a27a" stroke-width="9" stroke-linecap="round"/>
  <circle cx="190" cy="196" r="22" fill="#b07850"/><path d="M168 192 a22 22 0 0 1 44 0 z" fill="#d8cdb8"/><path d="M180 208 h20" stroke="#2e2a2a" stroke-width="2.5"/><path d="M180 188 l8 3 M200 188 l-8 3" stroke="#2e2a2a" stroke-width="2.5"/>
  <rect x="30" y="236" width="230" height="12" fill="#b9ad98"/>
  <text x="150" y="294" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">REWRITING</text>
  <text x="150" y="326" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">EVERY DAY</text>
  <rect x="150" y="452" width="150" height="12" fill="#8a6d5a"/><rect x="160" y="464" width="10" height="96" fill="#6b5446"/><rect x="280" y="464" width="10" height="96" fill="#6b5446"/>
  <g transform="translate(120 560)"><use href="#pp" color="#fff"/><rect x="-16" y="-178" width="32" height="20" rx="4" fill="#fff"/>
    <path d="M22 -104 l40 4 l30 -12" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-22 -104 l-14 -24 l10 -20" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-8 -140 q8 -6 16 0" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  </g>
  <path d="M152 392 q-4 8 0 12 q4 -4 0 -12" fill="#7fb3c4"/>
  <rect x="196" y="434" width="56" height="18" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <path d="M202 440 h24 M202 446 h40 M204 443 l40 0" stroke="#c0392b" stroke-width="2"/>
  <use href="#crump" transform="translate(60 560)"/><use href="#crump" transform="translate(80 548)"/><use href="#crump" transform="translate(178 556)"/><use href="#crump" transform="translate(200 548)"/><use href="#crump" transform="translate(222 558)"/>

  <!-- CENTRE: owner taps the pinned recipe -->
  <text x="456" y="214" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">FOLLOW THE RECIPE</text>
  <rect x="380" y="246" width="104" height="128" rx="6" fill="#fff" stroke="#1f6f78" stroke-width="5"/>
  <circle cx="432" cy="246" r="5" fill="#e07a5f"/>
  <path d="M394 272 h76 M394 290 h76 M394 308 h60 M394 326 h70 M394 344 h50" stroke="#b9ad98" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(520 560)"><use href="#pp" color="#7a4e7e"/>
    <path d="M-24 -100 q24 20 48 0 v20 q-24 18 -48 0 z" fill="#e0a33a"/>
    <circle cx="10" cy="-162" r="9" fill="#2e2a2a"/>
    <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="-8" cy="-146" r="6"/><circle cx="6" cy="-146" r="6"/></g>
    <path d="M-22 -104 l-20 -50 l-12 -46" stroke="#c98a5e" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 -104 l18 30" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <rect x="540" y="458" width="44" height="40" rx="3" fill="#fff" stroke="#b9ad98" stroke-width="2"/><rect x="540" y="458" width="44" height="10" fill="#e07a5f"/>
  <!-- big steel pot with steam -->
  <rect x="610" y="520" width="90" height="40" fill="#3d3a3a"/>
  <path d="M600 520 h110 v-56 a10 10 0 0 0 -10 -10 h-90 a10 10 0 0 0 -10 10 z" fill="#b9ad98"/>
  <path d="M630 448 q-10 -20 4 -36 M660 448 q10 -24 -4 -44 M690 448 q-8 -18 4 -32" stroke="#d8cdb8" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- RIGHT: head chef reviews monthly with all the feedback -->
  <text x="780" y="292" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">MONTHLY REVIEW</text>
  <rect x="840" y="130" width="96" height="100" rx="4" fill="#fff" stroke="#b9ad98" stroke-width="2"/>
  <rect x="840" y="130" width="96" height="18" rx="4" fill="#1f6f78"/>
  <path d="M840 168 h96 M840 188 h96 M840 208 h96 M864 148 v82 M888 148 v82 M912 148 v82" stroke="#e5dccb" stroke-width="1.5"/>
  <circle cx="924" cy="219" r="11" fill="none" stroke="#e07a5f" stroke-width="3"/>
  <!-- chef seated behind desk -->
  <rect x="806" y="324" width="40" height="40" rx="6" fill="#fff"/><ellipse cx="826" cy="324" rx="26" ry="14" fill="#fff"/>
  <circle cx="826" cy="380" r="20" fill="#b07850"/>
  <path d="M808 388 q18 30 36 0 q-4 22 -18 24 q-14 -2 -18 -24 z" fill="#9a9590"/>
  <g fill="none" stroke="#2e2a2a" stroke-width="2.5"><circle cx="818" cy="380" r="6"/><circle cx="834" cy="380" r="6"/></g>
  <path d="M798 460 v-42 a28 28 0 0 1 56 0 v42 z" fill="#fff"/>
  <rect x="660" y="460" width="270" height="14" fill="#8a6d5a"/><rect x="670" y="474" width="10" height="86" fill="#6b5446"/><rect x="910" y="474" width="10" height="86" fill="#6b5446"/>
  <rect x="700" y="424" width="96" height="36" rx="3" fill="#e0a33a"/>
  <g fill="#fff" stroke="#cbbfa9" stroke-width="2"><rect x="708" y="410" width="30" height="18" transform="rotate(-8 723 419)"/><rect x="740" y="406" width="30" height="18" transform="rotate(6 755 415)"/><rect x="760" y="414" width="30" height="18" transform="rotate(-4 775 423)"/></g>
  <path d="M800 440 l-20 -4" stroke="#b07850" stroke-width="9" stroke-linecap="round"/>
</svg>
