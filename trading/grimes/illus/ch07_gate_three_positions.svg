<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Three ways to get through a stadium gate: waiting at it, running when it opens, or arriving late</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
    <g id="pp">
      <ellipse cx="0" cy="2" rx="26" ry="6" fill="#000" opacity=".08"/>
      <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
      <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="currentColor"/>
      <rect x="-6" y="-134" width="12" height="10" fill="#c98a5e"/>
      <circle cx="0" cy="-148" r="19" fill="#c98a5e"/><path d="M-19 -152 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    </g>
    <g id="tag"><path d="M-44 -16 h80 l12 16 l-12 16 h-80 z" fill="#e0a33a"/><circle cx="34" cy="0" r="4" fill="#f6f1e7"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <rect y="540" width="960" height="100" fill="#cbbfa9"/>
  <!-- stadium wall + gate -->
  <rect x="0" y="300" width="240" height="240" fill="#d8cdb8"/>
  <path d="M0 300 Q120 240 240 300" fill="#d8cdb8"/>
  <rect x="20" y="330" width="26" height="210" fill="#8a7d6a"/><rect x="200" y="330" width="26" height="210" fill="#8a7d6a"/>
  <rect x="46" y="350" width="154" height="190" fill="#3d3a3a"/>
  <g stroke="#9a9590" stroke-width="5"><path d="M56 360 v180 M74 360 v180 M92 360 v180 M110 360 v180"/><path d="M50 380 h70 M50 460 h70"/></g>
  <path d="M122 360 l60 -20 v200 l-60 0 z" fill="none" stroke="#9a9590" stroke-width="5"/>
  <path d="M140 354 v186 M160 348 v192" stroke="#9a9590" stroke-width="4"/>
  <rect x="24" y="300" width="20" height="30" fill="#3b6fb0"/><rect x="202" y="300" width="20" height="30" fill="#e07a5f"/>

  <!-- 1: waiting at the gate with a ticket -->
  <text x="236" y="200" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">RESTING ORDER</text>
  <use href="#tag" transform="translate(236 240)"/><text x="232" y="248" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">₹500</text>
  <g transform="translate(236 540) scale(-1 1)"><use href="#pp" color="#3b6fb0"/><circle cx="-12" cy="-160" r="9" fill="#2e2a2a"/><path d="M22 -104 l26 -40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/><path d="M-22 -104 l-6 44" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>
  <rect x="172" y="370" width="30" height="20" rx="2" fill="#fff" stroke="#e07a5f" stroke-width="2"/>
  <path d="M232 384 q6 4 12 0" stroke="#2e2a2a" stroke-width="2.5" fill="none" transform="translate(-14 0)"/>
  <g transform="translate(300 540) scale(.9)"><use href="#pp" color="#3b6fb0"/><path d="M-22 -104 l-20 -30 M22 -104 l10 40" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/></g>

  <!-- 2: hears the creak, sprints over from the chai stall -->
  <rect x="600" y="380" width="120" height="160" fill="#8a6d5a"/><path d="M590 380 h140 l-14 -40 h-112 z" fill="#e07a5f"/>
  <rect x="616" y="400" width="88" height="40" fill="#efe6d2"/>
  <text x="510" y="200" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">SEE IT, THEN ACT</text>
  <use href="#tag" transform="translate(510 240)"/><text x="506" y="248" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">₹550</text>
  <g transform="translate(520 540) rotate(-14)">
    <path d="M-4 -60 l-26 26 l-22 6 M4 -60 l20 30 l6 30" stroke="#4a3f55" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-24 -58 v-44 a24 24 0 0 1 48 0 v44 z" fill="#3b6fb0"/>
    <circle cx="-4" cy="-146" r="19" fill="#c98a5e"/><path d="M-23 -150 a19 19 0 0 1 38 0 z" fill="#2e2a2a"/>
    <path d="M-22 -100 l-26 10 M22 -100 l20 24" stroke="#c98a5e" stroke-width="10" stroke-linecap="round"/>
  </g>
  <path d="M570 430 h40 M576 460 h40 M566 490 h40" stroke="#9a9590" stroke-width="4" stroke-linecap="round"/>
  <rect x="560" y="528" width="14" height="12" fill="#fff" transform="rotate(30 567 534)"/>
  <path d="M470 600 H330" stroke="#e07a5f" stroke-width="5" stroke-dasharray="10 8" marker-end="url(#arr)"/>

  <!-- 3: strolls up after the crowd is in -->
  <text x="830" y="200" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">BAR CLOSE</text>
  <use href="#tag" transform="translate(830 240)"/><text x="826" y="248" text-anchor="middle" font-size="20" font-weight="800" fill="#2b2b2b">₹700</text>
  <g transform="translate(840 540) scale(-1 1)"><use href="#pp" color="#fff"/><path d="M-21 -156 a21 16 0 0 1 42 0 l12 2 v4 h-54 z" fill="#3d3a3a"/><path d="M-22 -104 l-6 44 M22 -104 l6 44" stroke="#b07850" stroke-width="10" stroke-linecap="round"/></g>
  <path d="M700 580 l30 -8 l-4 14 z" fill="#3b6fb0"/><path d="M700 580 l-20 6" stroke="#3d3a3a" stroke-width="2"/>
  <path d="M900 600 l30 -10 l-2 16 z" fill="#e07a5f"/><path d="M900 600 l-22 4" stroke="#3d3a3a" stroke-width="2"/>
</svg>
