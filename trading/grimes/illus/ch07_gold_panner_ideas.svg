<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Panning for gold: scoop everything, wash most of it away, keep what is left on a setup sheet</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e07a5f"/></marker>
  </defs>
  <rect width="960" height="640" fill="#f6f1e7"/>
  <path d="M0 300 Q160 200 330 260 Q520 180 700 250 Q840 190 960 240 V400 H0 Z" fill="#9fbf8f"/>
  <path d="M0 340 Q200 280 400 330 Q640 270 960 320 V400 H0 Z" fill="#7fa47a"/>
  <!-- stream -->
  <rect y="380" width="960" height="260" fill="#a9cfd0"/>
  <path d="M60 600 q20 -6 40 0 M300 620 q20 -6 40 0 M620 610 q20 -6 40 0 M420 420 q20 -6 40 0" stroke="#fff" stroke-width="3" fill="none"/>
  <g fill="#b9ad98"><ellipse cx="380" cy="600" rx="16" ry="8"/><ellipse cx="560" cy="590" rx="12" ry="6"/><ellipse cx="300" cy="460" rx="10" ry="5"/></g>
  <!-- left bank -->
  <path d="M0 380 H300 Q330 460 280 640 H0 Z" fill="#e6d8bd"/>

  <!-- STEP 1: scoop everything -->
  <text x="170" y="122" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">SCOOP EVERYTHING</text>
  <path d="M40 520 Q140 360 250 520 Z" fill="#b9976b"/>
  <g fill="#8a7d6a"><circle cx="100" cy="490" r="8"/><circle cx="150" cy="470" r="9"/><circle cx="190" cy="500" r="7"/><circle cx="130" cy="510" r="6"/></g>
  <g fill="#e0a33a"><circle cx="120" cy="478" r="3"/><circle cx="176" cy="486" r="3"/></g>
  <path d="M160 300 L140 450" stroke="#8a6d5a" stroke-width="7" stroke-linecap="round"/><path d="M128 444 h26 l-4 30 h-18 z" fill="#3d3a3a"/>
  <path d="M150 300 h22" stroke="#8a6d5a" stroke-width="7" stroke-linecap="round"/>
  <ellipse cx="230" cy="572" rx="54" ry="16" fill="#9a9590"/>
  <rect x="196" y="536" width="66" height="44" rx="2" fill="#fff" stroke="#b9ad98" stroke-width="2" transform="rotate(-6 229 558)"/>
  <path d="M204 548 h44 M206 558 l10 -4 l10 6 l10 -6 M206 568 h34" stroke="#7a4e7e" stroke-width="2" fill="none" transform="rotate(-6 229 558)"/>
  <g stroke="#2b2b2b" stroke-width="2"><path d="M198 540 v40"/></g>

  <!-- STEP 2: wash away -->
  <text x="480" y="122" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">WASH AWAY</text>
  <path d="M300 200 H380" stroke="#e07a5f" stroke-width="6" marker-end="url(#arr)"/>
  <!-- prospector knee-deep -->
  <rect x="456" y="420" width="15" height="44" rx="6" fill="#6b5446"/><rect x="478" y="420" width="15" height="44" rx="6" fill="#6b5446"/>
  <ellipse cx="474" cy="466" rx="40" ry="8" fill="#fff" opacity=".6"/>
  <path d="M446 424 v-50 a28 28 0 0 1 56 0 v50 z" fill="#c0604a"/>
  <path d="M446 380 h56 M446 400 h56 M466 346 v78 M484 346 v78" stroke="#a24f3c" stroke-width="3"/>
  <rect x="468" y="320" width="12" height="10" fill="#b07850"/>
  <circle cx="474" cy="304" r="20" fill="#b07850"/>
  <path d="M454 300 a20 20 0 0 1 40 0 z" fill="#fff"/><path d="M490 296 l12 8" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M466 312 l6 2 M478 312 l6 -2" stroke="#2e2a2a" stroke-width="2.5"/>
  <path d="M452 372 l-14 40 M496 372 l18 40" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
  <ellipse cx="476" cy="424" rx="74" ry="18" fill="#3d3a3a"/>
  <ellipse cx="476" cy="420" rx="60" ry="12" fill="#8a7d6a"/>
  <path d="M500 418 a24 6 0 1 1 -48 0" stroke="#fff" stroke-width="3" fill="none"/>
  <path d="M404 424 q-14 20 -10 40 M548 424 q16 18 12 42" stroke="#9a8a6a" stroke-width="6" fill="none" stroke-linecap="round"/>
  <g fill="#8a7d6a"><circle cx="394" cy="472" r="5"/><circle cx="564" cy="478" r="5"/><circle cx="410" cy="490" r="4"/></g>
  <!-- tablet with a short list -->
  <ellipse cx="620" cy="500" rx="46" ry="14" fill="#9a9590"/>
  <rect x="592" y="452" width="58" height="42" rx="5" fill="#3d3a3a" transform="rotate(-8 621 473)"/>
  <path d="M600 464 h40 M600 474 h28 M600 484 h34" stroke="#cfe3e8" stroke-width="3" transform="rotate(-8 621 473)"/>
  <path d="M580 200 H660" stroke="#e07a5f" stroke-width="6" marker-end="url(#arr)"/>

  <!-- STEP 3: what's left in the pan -->
  <circle cx="800" cy="300" r="120" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <path d="M700 380 q40 -50 120 -50 q60 0 76 40 q-40 50 -110 50 q-60 0 -86 -40 z" fill="#c98a5e"/>
  <ellipse cx="800" cy="290" rx="86" ry="44" fill="#3d3a3a"/>
  <ellipse cx="800" cy="286" rx="70" ry="32" fill="#8a7d6a"/>
  <g fill="#f3c46b"><path d="M780 280 l8 -4 l4 8 z"/><path d="M806 292 l10 -2 l-2 8 z"/><path d="M820 276 l6 -4 l4 6 z"/><path d="M794 300 l6 -2 l0 6 z"/></g>
  <circle cx="790" cy="282" r="2" fill="#fff"/><circle cx="812" cy="294" r="2" fill="#fff"/>
  <!-- the setup sheet -->
  <rect x="688" y="476" width="230" height="110" rx="6" fill="#fff" stroke="#e0a33a" stroke-width="6"/>
  <text x="803" y="518" text-anchor="middle" font-size="28" font-weight="800" fill="#2b2b2b" letter-spacing="1">SETUP SHEET</text>
  <path d="M710 540 h170 M710 556 h130 M710 572 h150" stroke="#cbbfa9" stroke-width="4" stroke-linecap="round"/>
  <path d="M800 420 V466" stroke="#e07a5f" stroke-width="5" marker-end="url(#arr)"/>
  <!-- kingfisher -->
  <path d="M900 60 q-40 10 -60 40" stroke="#6b5446" stroke-width="5" fill="none"/>
  <ellipse cx="870" cy="70" rx="14" ry="9" fill="#1f6f78"/><circle cx="882" cy="64" r="7" fill="#1f6f78"/><path d="M888 64 l12 2 l-12 2 z" fill="#2b2b2b"/><ellipse cx="870" cy="75" rx="8" ry="4" fill="#e07a5f"/>
</svg>
