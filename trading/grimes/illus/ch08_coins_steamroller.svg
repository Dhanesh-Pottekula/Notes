<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Picking up coins in front of a steamroller: small steady gains, then one big loss</title>
  <defs>
    <marker id="ark" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2b2b2b"/></marker>
    <g id="coin"><ellipse cx="0" cy="0" rx="14" ry="5" fill="#e0a33a" stroke="#b7802a" stroke-width="2"/></g>
    <g id="cone"><path d="M-14 0 l10 -40 h8 l10 40 z" fill="#e07a5f"/><path d="M-9 -18 h18" stroke="#fff" stroke-width="5"/><rect x="-18" y="-4" width="36" height="6" fill="#3d3a3a"/></g>
  </defs>
  <rect width="960" height="640" fill="#f6efe0"/>
  <rect y="300" width="960" height="30" fill="#e8dcc4" opacity=".8"/>
  <!-- road -->
  <rect y="330" width="960" height="190" fill="#4a4646"/>
  <path d="M0 426 H960" stroke="#e0a33a" stroke-width="4" stroke-dasharray="30 24"/>
  <rect y="520" width="960" height="30" fill="#b9ad98"/>
  <rect y="550" width="960" height="90" fill="#d8cdb8"/>
  <use href="#cone" transform="translate(620 380)"/><use href="#cone" transform="translate(900 380)"/>

  <!-- the steamroller -->
  <text x="190" y="120" text-anchor="middle" font-size="34" font-weight="800" fill="#2b2b2b" letter-spacing="1">TAIL RISK</text>
  <rect x="40" y="290" width="230" height="110" rx="12" fill="#e0a33a"/>
  <rect x="80" y="190" width="120" height="100" rx="6" fill="none" stroke="#3d3a3a" stroke-width="8"/>
  <rect x="70" y="180" width="140" height="16" rx="6" fill="#3d3a3a"/>
  <circle cx="140" cy="250" r="16" fill="#c98a5e"/><path d="M124 246 a16 16 0 0 1 32 0 l10 2 v4 h-42 z" fill="#3b6fb0"/><rect x="134" y="246" width="20" height="6" rx="3" fill="#2b2b2b"/>
  <path d="M128 290 v-24 a12 12 0 0 1 24 0 v24 z" fill="#7a4e7e"/>
  <rect x="200" y="300" width="80" height="20" fill="#c58a22"/>
  <circle cx="280" cy="432" r="86" fill="#3d3a3a"/><circle cx="280" cy="432" r="70" fill="#5a5656"/><circle cx="280" cy="432" r="14" fill="#e0a33a"/>
  <circle cx="90" cy="460" r="58" fill="#3d3a3a"/><circle cx="90" cy="460" r="20" fill="#e0a33a"/>
  <path d="M180 140 L220 200" stroke="#2b2b2b" stroke-width="3" marker-end="url(#ark)"/>

  <!-- coins ahead on the road -->
  <use href="#coin" transform="translate(420 500)"/><use href="#coin" transform="translate(470 470)"/><use href="#coin" transform="translate(520 500)"/><use href="#coin" transform="translate(560 456)"/><use href="#coin" transform="translate(640 492)"/><use href="#coin" transform="translate(700 460)"/>
  <!-- cheerful man bent over, back to the roller -->
  <ellipse cx="440" cy="512" rx="40" ry="6" fill="#000" opacity=".1"/>
  <rect x="420" y="452" width="14" height="60" rx="6" fill="#4a3f55"/><rect x="440" y="452" width="14" height="60" rx="6" fill="#4a3f55"/>
  <rect x="412" y="506" width="26" height="8" rx="3" fill="#8a6d5a"/><rect x="438" y="506" width="26" height="8" rx="3" fill="#8a6d5a"/>
  <path d="M414 460 l20 -70 l50 14 l-20 62 z" fill="#fff"/>
  <path d="M424 432 l50 14 M430 412 l50 14" stroke="#1f6f78" stroke-width="5"/>
  <circle cx="500" cy="396" r="18" fill="#c98a5e"/><path d="M484 388 a18 18 0 0 1 34 -4 z" fill="#2e2a2a"/>
  <path d="M500 406 q6 4 12 -2" stroke="#2e2a2a" stroke-width="2.5" fill="none"/>
  <path d="M470 416 l14 50" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <path d="M446 424 l-6 30" stroke="#c98a5e" stroke-width="9" stroke-linecap="round"/>
  <path d="M428 454 q-14 4 -10 24 q14 6 24 -4 z" fill="#efe6d2" stroke="#b9ad98" stroke-width="2"/>

  <!-- staircase of weekly coin stacks on the kerb -->
  <g>
    <use href="#coin" transform="translate(400 540)"/><use href="#coin" transform="translate(400 532)"/>
    <use href="#coin" transform="translate(450 540)"/><use href="#coin" transform="translate(450 532)"/><use href="#coin" transform="translate(450 524)"/>
    <use href="#coin" transform="translate(500 540)"/><use href="#coin" transform="translate(500 532)"/><use href="#coin" transform="translate(500 524)"/><use href="#coin" transform="translate(500 516)"/>
    <use href="#coin" transform="translate(550 540)"/><use href="#coin" transform="translate(550 532)"/><use href="#coin" transform="translate(550 524)"/><use href="#coin" transform="translate(550 516)"/><use href="#coin" transform="translate(550 508)"/>
    <use href="#coin" transform="translate(600 540)"/><use href="#coin" transform="translate(600 532)"/><use href="#coin" transform="translate(600 524)"/><use href="#coin" transform="translate(600 516)"/><use href="#coin" transform="translate(600 508)"/><use href="#coin" transform="translate(600 500)"/>
    <use href="#coin" transform="translate(650 540)"/><use href="#coin" transform="translate(650 532)"/><use href="#coin" transform="translate(650 524)"/><use href="#coin" transform="translate(650 516)"/><use href="#coin" transform="translate(650 508)"/><use href="#coin" transform="translate(650 500)"/><use href="#coin" transform="translate(650 492)"/>
  </g>
  <g stroke="#3d3a3a" stroke-width="2"><path d="M410 528 v-16 M460 520 v-16 M510 512 v-16 M560 504 v-16 M610 496 v-16 M660 488 v-16"/></g>
  <g fill="#1f6f78"><path d="M410 512 h10 l-4 4 l4 4 h-10 z"/><path d="M460 504 h10 l-4 4 l4 4 h-10 z"/><path d="M510 496 h10 l-4 4 l4 4 h-10 z"/><path d="M560 488 h10 l-4 4 l4 4 h-10 z"/><path d="M610 480 h10 l-4 4 l4 4 h-10 z"/><path d="M660 472 h10 l-4 4 l4 4 h-10 z"/></g>
  <text x="530" y="608" text-anchor="middle" font-size="30" font-weight="800" fill="#2b2b2b" letter-spacing="1">SMALL STEADY GAINS</text>

  <!-- worker pointing in alarm -->
  <g transform="translate(676 330) scale(.85)">
    <rect x="-16" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/><rect x="3" y="-62" width="13" height="62" rx="6" fill="#4a3f55"/>
    <path d="M-24 -60 v-42 a24 24 0 0 1 48 0 v42 z" fill="#e07a5f"/>
    <circle cx="0" cy="-148" r="19" fill="#b07850"/><path d="M-24 -152 a24 20 0 0 1 48 0 z" fill="#e0a33a"/>
    <rect x="-6" y="-134" width="12" height="10" fill="#b07850"/>
    <path d="M-22 -104 l-60 -10" stroke="#b07850" stroke-width="10" stroke-linecap="round"/>
    <circle cx="-6" cy="-142" r="3" fill="#2e2a2a"/>
  </g>

  <!-- inset: the unlucky version -->
  <rect x="720" y="40" width="216" height="164" rx="16" fill="#fff" stroke="#7a4e7e" stroke-width="3"/>
  <text x="828" y="80" text-anchor="middle" font-size="26" font-weight="800" fill="#2b2b2b" letter-spacing="1">ONE BIG LOSS</text>
  <rect x="736" y="100" width="184" height="88" rx="6" fill="#4a4646"/>
  <path d="M746 150 q80 18 164 -2 q-80 26 -164 2 z" fill="#2b2b2b"/>
  <g fill="#e0a33a" opacity=".6"><ellipse cx="790" cy="152" rx="20" ry="3"/><ellipse cx="860" cy="154" rx="24" ry="3"/></g>
  <rect x="790" y="116" width="22" height="9" rx="4" fill="#8a6d5a"/><rect x="818" y="120" width="22" height="9" rx="4" fill="#8a6d5a"/>
</svg>
